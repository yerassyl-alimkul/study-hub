нему), ln m = β<sub>0</sub> + β<sub>1</sub>x ⇒ m = e<sup>β<sub>0</sub>+β<sub>1</sub>x</sup> &gt; 0. Пример: β<sub>0</sub> = 1, β<sub>1</sub> = 0.3, x = 2: m = e<sup>1.6</sup> = 4.95; +1 к x умножает среднее на e<sup>0.3</sup> = 1.35.</p>\n <p><b>Offset:</b> если счёт зависит от размера M: ln m = ln M + β<sub>0</sub> + β<sub>1</sub>x; ln M — предиктор с фиксированным коэффициентом 1 (моделируем частоту: 10 аварий на 100 учеников и на 2000 учеников — разные частоты).</p>"}, {"k": "quiz", "q": "Почему логистическая регрессия лучше линейной для бинарного Y?", "o": ["p(X) всегда в (0,1)", "она быстрее", "она не требует данных", "она линейна по p"], "a": 0, "why": "Логистическая функция ограничена (0,1)."}, {"k": "quiz", "q": "Что линейно по X в логистической регрессии?", "o": ["log-odds ln(p/(1−p))", "вероятность p", "odds", "p²"], "a": 0, "why": "ln(p/(1−p)) = β0 + β1X."}, {"k": "quiz", "q": "β1 = 0.05 в логистической регрессии. На что умножаются odds при +1 к X?", "o": ["e^0.05 ≈ 1.051", "0.05", "1.05 прибавляется к p", "1/0.05"], "a": 0, "why": "exp(β1) — множитель odds."}, {"k": "note", "h": "Тетрадь: логистическая регрессия", "b": "<div class=\"nb\"><div class=\"hd\">Модель</div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">p(X) = <span class=\"fr\"><span>e<sup>β<sub>0</sub>+β<sub>1</sub>X</sup></span><span>1 + e<sup>β<sub>0</sub>+β<sub>1</sub>X</sup></span></span></span></div><div class=\"nt\">всегда в (0,1)</div></div><div class=\"hd\">Odds и логит</div><div class=\"ln\"><div class=\"fm\">1 − p = <span class=\"fr\"><span>1</span><span>1 + e<sup>z</sup></span></span>,   z = β<sub>0</sub>+β<sub>1</sub>X</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>p</span><span>1 − p</span></span> = e<sup>z</sup></div><div class=\"nt\">odds</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">ln <span class=\"fr\"><span>p</span><span>1 − p</span></span> = β<sub>0</sub> + β<sub>1</sub>X</span></div><div class=\"nt\">логит линеен по X</div></div><div class=\"hd\">Правдоподобие</div><div class=\"ln\"><div class=\"fm\">L(β) = Π<sub>y<sub>i</sub>=1</sub> p(x<sub>i</sub>) · Π<sub>y<sub>i</sub>=0</sub> (1 − p(x<sub>i</sub>))</div></div><div class=\"hd\">Poisson</div><div class=\"ln\"><div class=\"fm\">ln m = β<sub>0</sub> + β<sub>1</sub>x ⇒ m = e<sup>β<sub>0</sub>+β<sub>1</sub>x</sup></div></div><div class=\"ln\"><div class=\"fm\">offset:  ln m = ln M + β<sub>0</sub> + β<sub>1</sub>x</div></div></div>"}, {"k": "exam", "h": "Эталонные ответы на Summary questions", "b": "<ol class=\"big\"><li><b>Цель классификации:</b> предсказать категорию (качественный Y); в регрессии Y количественный и предсказываем число.</li><li><b>Качественный ответ:</b> принимает значения из набора категорий (спам/не спам, болезнь A/B/C, дефолт да/нет).</li><li><b>Почему не линейная регрессия:</b> вероятности вне [0,1], навязанный порядок классов при &gt; 2 категорий.</li><li><b>Логистическая регрессия:</b> моделирует P(Y=1|X) логистической функцией, оценка по максимальному правдоподобию, вероятность всегда в (0,1).</li><li><b>p(X) = e<sup>β<sub>0</sub>+β<sub>1</sub>X</sup>/(1+e<sup>β<sub>0</sub>+β<sub>1</sub>X</sup>)</b> — вероятность класса 1 при значении X; её логит линейный: ln(p/(1−p)) = β<sub>0</sub>+β<sub>1</sub>X; e<sup>β<sub>1</sub></sup> — множитель odds на единицу X.</li></ol>"}], "part": "Часть 6 · Davide: модели и классификация"}, {"id": "surv", "title": "26. Survival analysis (Davide)", "goal": "Цензурирование, S(t), Каплан–Майер, log-rank, hazard, модель Кокса. По слайдам Davide.", "cards": [{"k": "story", "h": "Что это и зачем", "b": "<p>Анализ выживаемости (= lifetime data analysis) изучает <b>время до события</b>: смерть, поломка, уход клиента (churn), конец брака. Нужно задать: <b>шкалу времени и точку отсчёта</b> (часы, мили пробега, число отпечатанных страниц) и <b>само событие</b>.</p>\n <p><b>Проблема — цензурирование (censoring).</b> Мы часто не видим всю жизнь объекта. Пример: лампочки тестируют 100 часов, часть не перегорела: мы знаем только «T &gt; 100». Пациентов наблюдают 5 лет, кто-то ещё жив или выбыл: известно «T ≥ 5 лет». Выбрасывать их нельзя, это полезная информация.</p>\n <p><b>Обозначения:</b> T — время события, C — время цензурирования, наблюдаем <b>Y = min(T, C)</b> и индикатор <b>δ = 1</b> если T ≤ C (событие наблюдено), <b>δ = 0</b> если цензурировано. Данные: (y<sub>i</sub>, δ<sub>i</sub>).</p>\n <p><b>Типы цензурирования:</b> right (событие ещё не произошло или объект потерян, T &gt; Y; основной тип); left (событие было до начала наблюдения, T ≤ Y); interval (событие в известном интервале, точный момент неизвестен).</p>\n <p><b>Предположение независимого цензурирования:</b> T ⊥ C | covariates. Если более больные выбывают раньше, а мы это игнорируем, выживаемость завышается и сравнение групп искажается.</p>"}, {"k": "num", "h": "Числа: почему простые доли неверны", "b": "<p>88 пациентов с опухолью мозга, 53 живы к концу. Хотим S(20) = P(T &gt; 20 мес.). Дожили после 20 мес: 48.</p>\n <ul class=\"big\"><li>Ошибка 1: 48/88 = 55%. Тем самым считаем всех цензурированных умершими до 20 мес., хотя это неизвестно.</li><li>Ошибка 2: 48/71 = 68% (71 нецензурированный к t = 20). Полностью игнорируем тех, кого цензурировали до 20 мес.</li></ul>\n <p>Нужен метод, использующий и события, и цензурированных: это Каплан–Майер.</p>\n <p><b>Мини-пример KM.</b> 6 пациентов: события в 2, 3, 5, 8; цензура в 4 и 7.</p>\n <table class=\"tbl\"><tr><th>t</th><th>r (в риске)</th><th>q (событий)</th><th>(r−q)/r</th><th>Ŝ(t)</th></tr><tr><td>2</td><td>6</td><td>1</td><td>5/6</td><td>0.833</td></tr><tr><td>3</td><td>5</td><td>1</td><td>4/5</td><td>0.667</td></tr><tr><td>4 (цензура)</td><td>4 → 3</td><td>0</td><td></td><td>0.667</td></tr><tr><td>5</td><td>3</td><td>1</td><td>2/3</td><td>0.444</td></tr><tr><td>7 (цензура)</td><td>2 → 1</td><td>0</td><td></td><td>0.444</td></tr><tr><td>8</td><td>1</td><td>1</td><td>0</td><td>0</td></tr></table>\n <p>Цензурированный остаётся в риске до момента цензурирования, потом удаляется. Медиана: первое t, где Ŝ ≤ 0.5, здесь t = 5.</p>"}, {"k": "proof", "h": "Вывод оценки Каплана–Майера (как у Davide)", "b": "<ol class=\"big\"><li>Пусть d<sub>1</sub> &lt; … &lt; d<sub>K</sub> — уникальные моменты смертей среди нецензурированных. В момент d<sub>k</sub>: <b>q<sub>k</sub></b> — число умерших, <b>r<sub>k</sub></b> — число «в риске» (risk set) непосредственно перед d<sub>k</sub>.</li>\n <li>Разложение по условной вероятности: S(d<sub>k</sub>) = P(T &gt; d<sub>k</sub> | T &gt; d<sub>k−1</sub>)·S(d<sub>k−1</sub>) (так как P(T &gt; d<sub>k</sub> | T ≤ d<sub>k−1</sub>) = 0).</li>\n <li>Повторяя: S(d<sub>k</sub>) = Π<sub>j≤k</sub> P(T &gt; d<sub>j</sub> | T &gt; d<sub>j−1</sub>).</li>\n <li>Каждый множитель оценивается долей выживших в risk set: (r<sub>j</sub> − q<sub>j</sub>)/r<sub>j</sub>.</li>\n <li><b>Итог:</b> Ŝ(t) = Π<sub>d<sub>j</sub> ≤ t</sub> (r<sub>j</sub> − q<sub>j</sub>)/r<sub>j</sub>. Это ступенчатая функция, падает только в моменты событий, между ними постоянна.</li></ol>\n <p>Кривая KM: на графике стартует с 1, ступеньки вниз, пунктирные линии вокруг — полосы стандартной ошибки; можно рисовать несколько кривых (мужчины и женщины).</p>"}, {"k": "formula", "h": "Hazard, плотность, S(t) и правдоподобие", "b": "<table class=\"sym\"><tr><td>S(t) = P(T &gt; t)</td><td>функция выживания, всегда убывающая</td></tr>\n <tr><td>h(t) = lim<sub>Δt→0</sub> P(t &lt; T ≤ t+Δt | T &gt; t)/Δt</td><td>hazard: мгновенный риск события в t для тех, кто дожил до t</td></tr>\n <tr><td>f(t) = lim P(t &lt; T ≤ t+Δt)/Δt</td><td>плотность</td></tr>\n <tr><td><b>h(t) = f(t)/S(t)</b></td><td>вывод: P(t&lt;T≤t+Δt | T&gt;t) = P(t&lt;T≤t+Δt)/P(T&gt;t) (событие t&lt;T≤t+Δt уже включает T&gt;t)</td></tr>\n <tr><td>L<sub>i</sub> = f(y<sub>i</sub>)<sup>δ<sub>i</sub></sup>·S(y<sub>i</sub>)<sup>1−δ<sub>i</sub></sup></td><td>вклад в правдоподобие: плотность если событие, S(y<sub>i</sub>) если цензура</td></tr>\n <tr><td>L = Π h(y<sub>i</sub>)<sup>δ<sub>i</sub></sup>·S(y<sub>i</sub>)</td><td>через hazard (подставили f = hS)</td></tr></table>\n <p><b>Параметрическая модель:</b> экспоненциальная f(t) = λe<sup>−λt</sup> (постоянный hazard), Weibull, Gamma; можно оценить λ максимизацией L. Hazard-модель h(t|x) = exp(β<sub>0</sub> + Σβ<sub>j</sub>x<sub>j</sub>) не зависит от t и слишком жёсткая. Поэтому Кокс.</p>\n <p><b>Почему нельзя регрессию log(Y):</b> для цензурированных Y — лишь нижняя граница T, это систематически занижает времена.</p>"}, {"k": "num", "h": "Числа: log-rank test", "b": "<p>Сравниваем две группы (например, мужчины и женщины) не по средним, а по тому, как идут события. В каждый момент d<sub>k</sub>: r<sub>1k</sub>, r<sub>2k</sub> — в риске по группам, q<sub>k</sub> — всего событий. При H<sub>0</sub> (кривые одинаковы) ожидаемое число событий в группе 1: <b>μ<sub>k</sub> = q<sub>k</sub>·r<sub>1k</sub>/r<sub>k</sub></b>.</p>\n <p>W = Σ(q<sub>1k</sub> − μ<sub>k</sub>) / √(Σ q<sub>k</sub>(r<sub>1k</sub>/r<sub>k</sub>)(1 − r<sub>1k</sub>/r<sub>k</sub>)(r<sub>k</sub>−q<sub>k</sub>)/(r<sub>k</sub>−1)); при больших выборках W ~ N(0,1).</p>\n <p>Мини-пример: три события. Момент 1: r<sub>1</sub>=5, r<sub>2</sub>=5, умер член группы 1: μ = 0.5, q<sub>1</sub>−μ = 0.5, дисперсия 0.25. Момент 2: r<sub>1</sub>=4, r<sub>2</sub>=5, умер из группы 2: μ = 4/9, q<sub>1</sub>−μ = −0.444, дисперсия 0.247. Момент 3: r<sub>1</sub>=4, r<sub>2</sub>=4, умер из группы 1: +0.5, дисперсия 0.25. Числитель 0.556, дисперсия 0.747, W = 0.556/0.864 = <b>0.64</b>, p ≈ 0.52: H<sub>0</sub> не отвергаем.</p>\n <p>В примере лекции (BrainCancer): W = 1.2, p = 0.2, H<sub>0</sub> не отвергается.</p>"}, {"k": "proof", "h": "Модель Кокса и частичное правдоподобие", "b": "<p><b>Модель:</b> h(t|x<sub>i</sub>) = h<sub>0</sub>(t)·exp(Σ<sub>j</sub> x<sub>ij</sub>β<sub>j</sub>). h<sub>0</sub>(t) — baseline hazard (для x = 0), форма не задана, exp(Σxβ) — relative risk. Ковариаты действуют мультипликативно: рост x<sub>j</sub> на 1 умножает hazard на exp(β<sub>j</sub>).</p>\n <p><b>Как оценить β без h<sub>0</sub>:</b></p>\n <ol class=\"big\"><li>В момент события y<sub>i</sub> risk set = {i′ : y<sub>i′</sub> ≥ y<sub>i</sub>}; у каждого hazard h<sub>0</sub>(y<sub>i</sub>)·exp(x<sub>i′</sub>β).</li>\n <li>Вероятность, что умирает именно i: h<sub>0</sub>(y<sub>i</sub>)e<sup>x<sub>i</sub>β</sup> / Σ<sub>i′∈риск</sub> h<sub>0</sub>(y<sub>i</sub>)e<sup>x<sub>i′</sub>β</sup>.</li>\n <li>h<sub>0</sub>(y<sub>i</sub>) общий для всех в risk set и <b>сокращается</b>: e<sup>x<sub>i</sub>β</sup> / Σ e<sup>x<sub>i′</sub>β</sup>.</li>\n <li>Перемножаем по всем событиям: <b>PL(β) = Π<sub>i: δ<sub>i</sub>=1</sub> e<sup>x<sub>i</sub>β</sup> / Σ<sub>i′: y<sub>i′</sub>≥y<sub>i</sub></sub> e<sup>x<sub>i′</sub>β</sup></b>. Не зависит от h<sub>0</sub>, использует только порядок событий.</li>\n <li>Максимизируем PL итеративно (как в логистической регрессии), затем тесты H<sub>0</sub>: β<sub>j</sub> = 0 и доверительные интервалы.</li></ol>\n <p><b>Числа:</b> три пациента, x = (1, 0, 0), события в моменты 1, 2, 3. PL(β) = [e<sup>β</sup>/(e<sup>β</sup>+2)]·[1/2]·[1]. При β = 0.5: 1.6487/3.6487 = 0.452, PL = 0.226.</p>\n <p><b>Пример лекции:</b> пол (мужчины): exp(0.18) ≈ 1.2 (риск на 20% выше, p = 0.61, незначимо); индекс Карновского: exp(−0.05) ≈ 0.95 за единицу (защитный эффект, значим). Это множители hazard, а не вероятности.</p>"}, {"k": "quiz", "q": "Что такое цензурирование справа?", "o": ["событие ещё не произошло к концу наблюдения или объект потерян: T > Y", "событие произошло до начала наблюдения", "событие в известном интервале", "ошибка измерения"], "a": 0, "why": "Right censoring: известно только, что T > Y."}, {"k": "quiz", "q": "Что значит δ = 0?", "o": ["наблюдение цензурировано, мы видим C", "мы видим истинное T", "пациент умер", "пропущенные данные"], "a": 0, "why": "δ = 1 если T ≤ C (событие наблюдено), δ = 0 если T > C."}, {"k": "quiz", "q": "Чему равен hazard h(t)?", "o": ["f(t)/S(t)", "S(t)/f(t)", "1 − S(t)", "f(t)·S(t)"], "a": 0, "why": "Условная плотность события среди доживших до t."}, {"k": "quiz", "q": "Почему в частичном правдоподобии Кокса не нужен h0(t)?", "o": ["он общий для всех в risk set и сокращается", "его задали экспонентой", "его оценили заранее", "он равен 1"], "a": 0, "why": "В числителе и знаменателе стоит один и тот же h0(y_i)."}, {"k": "note", "h": "Тетрадь: survival analysis", "b": "<div class=\"nb\"><div class=\"hd\">Hazard и плотность</div><div class=\"ln\"><div class=\"fm\">h(t) = lim<sub>Δt→0</sub> <span class=\"fr\"><span>P(t &lt; T ≤ t+Δt | T &gt; t)</span><span>Δt</span></span></div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">h(t) = <span class=\"fr\"><span>f(t)</span><span>S(t)</span></span></span></div><div class=\"nt\">условная вероятность = P(A∩B)/P(B)</div></div><div class=\"ln\"><div class=\"fm\">S(t) = P(T &gt; t),   f(t) = −S′(t)</div></div><div class=\"ln\"><div class=\"fm\">h(t) = − <span class=\"fr\"><span>d</span><span>dt</span></span> ln S(t)  ⇒  S(t) = e<sup>−∫h</sup></div></div><div class=\"hd\">Правдоподобие с цензурированием</div><div class=\"ln\"><div class=\"fm\">L<sub>i</sub> = f(y<sub>i</sub>)<sup>δ<sub>i</sub></sup> · S(y<sub>i</sub>)<sup>1−δ<sub>i</sub></sup></div></div><div class=\"ln\"><div class=\"fm\">L = Π h(y<sub>i</sub>)<sup>δ<sub>i</sub></sup> S(y<sub>i</sub>)</div><div class=\"nt\">подставили f = h·S</div></div><div class=\"hd\">Kaplan–Meier</div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">Ŝ(t) = Π<sub>d<sub>j</sub> ≤ t</sub> <span class=\"fr\"><span>r<sub>j</sub> − q<sub>j</sub></span><span>r<sub>j</sub></span></span></span></div><div class=\"nt\">r — в риске, q — событий</div></div><div class=\"hd\">Log-rank</div><div class=\"ln\"><div class=\"fm\">μ<sub>k</sub> = q<sub>k</sub> <span class=\"fr\"><span>r<sub>1k</sub></span><span>r<sub>k</sub></span></span></div><div class=\"nt\"> ожидаемое число событий в группе 1</div></div><div class=\"ln\"><div class=\"fm\">W = <span class=\"fr\"><span>Σ(q<sub>1k</sub> − μ<sub>k</sub>)</span><span>√Σ q<sub>k</sub>(r<sub>1k</sub>/r<sub>k</sub>)(1−r<sub>1k</sub>/r<sub>k</sub>)(r<sub>k</sub>−q<sub>k</sub>)/(r<sub>k</sub>−1)</span></span></div></div><div class=\"hd\">Cox</div><div class=\"ln\"><div class=\"fm\">h(t|x) = h<sub>0</sub>(t) · exp(Σ x<sub>j</sub>β<sub>j</sub>)</div></div><div class=\"ln\"><div class=\"fm\">PL(β) = Π<sub>i: δ<sub>i</sub>=1</sub> <span class=\"fr\"><span>exp(x<sub>i</sub>β)</span><span>Σ<sub>i′: y<sub>i′</sub> ≥ y<sub>i</sub></sub> exp(x<sub>i′</sub>β)</span></span></div><div class=\"nt\">h₀ сократился</div></div></div>"}, {"k": "exam", "h": "Вопросы Davide из конца лекции (кратко)", "b": "<ol class=\"big\"><li><b>Цель survival analysis:</b> моделировать время до события с учётом цензурирования (медицина, надёжность, churn).</li><li><b>Censoring:</b> событие не наблюдено, известно только T &gt; y; нельзя выбросить, нельзя считать событием; типы: right, left, interval.</li><li><b>S(t):</b> вероятность прожить дольше t, убывающая.</li><li><b>Risk set:</b> кто ещё под наблюдением непосредственно перед d<sub>k</sub> (цензурированные включены до момента цензурирования); основа KM, log-rank, Cox.</li><li><b>Hazard vs S:</b> hazard — мгновенная скорость события среди доживших, S — накопленная вероятность дожить.</li><li><b>h<sub>0</sub>(t) не задан:</b> модель гибкая, форма риска во времени любая, β оцениваются через partial likelihood.</li><li><b>Челлендж vs обычная регрессия:</b> Y = min(T,C) занижает T, нужны последовательные методы.</li><li><b>Интуиция Кокса:</b> общий baseline hazard, ковариаты умножают его на exp(xβ).</li></ol>"}], "part": "Часть 6 · Davide: модели и классификация"}, {"id": "hier", "title": "27. Иерархические (multilevel) модели", "goal": "Вложенные данные, random effects, ICC/VPC, IGLS, shrinkage.", "cards": [{"k": "story", "h": "Зачем", "b": "<p>Данные вложены: студенты ⊂ школы, пациенты ⊂ клиники, повторные измерения одного человека. Объекты внутри группы <b>зависимы</b> (общий учитель, среда): Cov(Y<sub>i</sub>, Y<sub>j</sub>) ≠ 0. Обычная регрессия предполагает независимость, поэтому <b>занижает стандартные ошибки</b>, переоценивает информацию и даёт «ложную» значимость. 30 студентов в одном классе ≠ 30 студентов в 30 классах: группы сами являются статистическими единицами.</p>\n <p><b>Уровни:</b> level 1 — индивиды (студенты), level 2 — группы (школы), level 3 — ещё выше (учителя, регионы). Level 1 variation — разброс индивидов внутри группы; level 2 variation — разброс между группами (разные intercept и slope у школ).</p>"}, {"k": "proof", "h": "Построение двухуровневой модели", "b": "<ol class=\"big\"><li>Для одной школы: y<sub>i</sub> = α + βx<sub>i</sub> + e<sub>i</sub>. Для школы j: y<sub>ij</sub> = β<sub>0j</sub> + β<sub>1j</sub>x<sub>ij</sub> + e<sub>ij</sub>, e<sub>ij</sub> ~ N(0, σ<sub>e</sub>²).</li>\n <li><b>Random coefficients:</b> β<sub>0j</sub> = β<sub>0</sub> + u<sub>0j</sub>, β<sub>1j</sub> = β<sub>1</sub> + u<sub>1j</sub>; E(u) = 0, Var(u<sub>0j</sub>) = σ<sub>u0</sub>², Var(u<sub>1j</sub>) = σ<sub>u1</sub>², Cov(u<sub>0j</sub>,u<sub>1j</sub>) = σ<sub>u01</sub>.</li>\n <li>Подстановка: <b>y<sub>ij</sub> = β<sub>0</sub> + β<sub>1</sub>x<sub>ij</sub> + (u<sub>0j</sub> + u<sub>1j</sub>x<sub>ij</sub> + e<sub>ij</sub>)</b>: fixed part (β<sub>0</sub> + β<sub>1</sub>x) и random part (в скобках). E(Y) = Xβ.</li>\n <li>Простейшая <b>variance components model</b>: y<sub>ij</sub> = β<sub>0</sub> + u<sub>0j</sub> + e<sub>0ij</sub>. Var(y<sub>ij</sub>) = σ<sub>u0</sub>² + σ<sub>e0</sub>²; Cov двух студентов одной школы = σ<sub>u0</sub>² (общий u<sub>0j</sub>).</li>\n <li><b>ICC (intra-class correlation) = VPC:</b> ρ = σ<sub>u0</sub>²/(σ<sub>u0</sub>² + σ<sub>e0</sub>²) — корреляция двух студентов одной школы и доля общей дисперсии, приходящаяся на различия между группами.</li>\n <li>Ковариационная матрица <b>блочно-диагональна</b>: зависимость внутри группы, независимость между. Блок для группы: V = σ<sub>u0</sub>²J + σ<sub>e0</sub>²I (J — матрица единиц, I — единичная).</li></ol>"}, {"k": "num", "h": "Числа: ICC и поправка к SE", "b": "<p>Клиники: σ<sub>u</sub>² = 4.5, σ<sub>e</sub>² = 22 ⇒ VPC = 4.5/(4.5+22) = <b>0.17</b>: 17% остаточной вариации объясняются различиями клиник, 83% — различиями пациентов внутри клиники.</p>\n <p>Поправка OLS-ошибки: SE умножается на <b>√(1 + ρ<sub>y</sub>ρ<sub>x</sub>(n−1))</b>, ρ<sub>y</sub>, ρ<sub>x</sub> — ICC для Y и X, n — размер группы. При ρ<sub>y</sub> = ρ<sub>x</sub> = 0.2, n = 76: √(1 + 0.04·75) = √4 = <b>2</b> — OLS занижает SE вдвое. При n = 1 или ρ = 0 поправка 1 и OLS допустим.</p>\n <p><b>Shrinkage:</b> предсказанный эффект группы û<sub>0j</sub> = R<sub>j</sub>·ỹ<sub>j</sub>, R<sub>j</sub> = σ<sub>u0</sub>²/(σ<sub>u0</sub>² + σ<sub>e0</sub>²/n<sub>j</sub>). Среднее остатков группы ỹ<sub>j</sub> = 3: при n<sub>j</sub> = 1: R = 4.5/26.5 = 0.17, û = 0.51; при n<sub>j</sub> = 10: R = 0.67, û = 2.02; при n<sub>j</sub> = 100: R = 0.95, û = 2.86. Малые группы сильнее «подтягиваются» к общему среднему.</p>"}, {"k": "formula", "h": "Оценивание: GLS и IGLS", "b": "<p>Если дисперсии известны: <b>GLS</b> β̂ = (XᵀV⁻¹X)⁻¹XᵀV⁻¹Y (даёт больший вес надёжным наблюдениям, учитывает кластеризацию).</p>\n <p>Если неизвестны — <b>IGLS</b> (iterative generalized least squares):</p>\n <ol class=\"big\"><li>Старт с OLS, берём остатки ỹ<sub>ij</sub> = y<sub>ij</sub> − (β̂<sub>0</sub> + β̂<sub>1</sub>x<sub>ij</sub>).</li><li>Так как E(ỸỸᵀ) = V, оцениваем дисперсии <b>регрессией</b> квадратов и произведений остатков на матрицы структуры групп (получаем σ<sub>u0</sub>², σ<sub>e0</sub>²).</li><li>Fixed effects step: обновляем β по GLS при текущих дисперсиях; random effects step: обновляем дисперсии при текущем β.</li><li>Повторяем до сходимости ⇒ <b>MLE</b>.</li></ol>\n <p>ML в малых выборках занижает компоненты дисперсии; поправка — <b>REML</b>. Residuals: level 1 — для диагностики, level 2 — часто представляют самостоятельный интерес («borrowing strength»).</p>\n <p><b>Сложные дисперсии:</b> level-2 дисперсия при random slope: Var(u<sub>0j</sub> + u<sub>1j</sub>x) = σ<sub>u0</sub>² + 2σ<sub>u01</sub>x + σ<sub>u1</sub>²x² (квадратичная функция x). Level 1: Var = σ<sub>e0</sub>² + 2σ<sub>e01</sub>x + σ<sub>e1</sub>²x² (гетероскедастичность, например ceiling effect). Проблема отрицательных дисперсий решается нелинейными функциями (e<sup>f(x)</sup>) или ограничениями на σ<sub>e01</sub>.</p>\n <p><b>Multilevel GLM:</b> π<sub>ij</sub> = f(Xβ)<sub>ij</sub>; доли: Binomial + logit/probit; счёты: Poisson + log (+ offset ln M<sub>j</sub>); для категорий multinomial logit.</p>"}, {"k": "quiz", "q": "Что такое ICC/VPC?", "o": ["доля дисперсии, обусловленная различиями между группами", "корреляция X и Y", "доля объяснённой R²", "число уровней"], "a": 0, "why": "ρ = σ_u²/(σ_u² + σ_e²)."}, {"k": "quiz", "q": "Что делает OLS с кластеризованными данными?", "o": ["занижает стандартные ошибки", "завышает стандартные ошибки", "ничего", "делает оценки смещёнными всегда"], "a": 0, "why": "Игнорирует зависимость внутри групп: доверительные интервалы слишком узкие, тесты слишком либеральны."}, {"k": "quiz", "q": "Большая группа (n_j велико). Что происходит с shrinkage?", "o": ["почти нет, û ≈ среднему остатков группы", "сильное сжатие к 0", "û = 0", "û удваивается"], "a": 0, "why": "R_j → 1 при росте n_j."}, {"k": "note", "h": "Тетрадь: multilevel модель", "b": "<div class=\"nb\"><div class=\"hd\">Двухуровневая модель</div><div class=\"ln\"><div class=\"fm\">y<sub>ij</sub> = β<sub>0j</sub> + β<sub>1j</sub>x<sub>ij</sub> + e<sub>ij</sub></div></div><div class=\"ln\"><div class=\"fm\">β<sub>0j</sub> = β<sub>0</sub> + u<sub>0j</sub>,   β<sub>1j</sub> = β<sub>1</sub> + u<sub>1j</sub></div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">y<sub>ij</sub> = β<sub>0</sub> + β<sub>1</sub>x<sub>ij</sub> + (u<sub>0j</sub> + u<sub>1j</sub>x<sub>ij</sub> + e<sub>ij</sub>)</span></div><div class=\"nt\">fixed part + random part</div></div><div class=\"hd\">ICC / VPC</div><div class=\"ln\"><div class=\"fm\">Var(y<sub>ij</sub>) = σ<sub>u0</sub>² + σ<sub>e0</sub>²</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">ρ = <span class=\"fr\"><span>σ<sub>u0</sub>²</span><span>σ<sub>u0</sub>² + σ<sub>e0</sub>²</span></span></span></div><div class=\"nt\">доля дисперсии между группами</div></div><div class=\"hd\">Поправка SE и shrinkage</div><div class=\"ln\"><div class=\"fm\">SE<sub>true</sub> = SE<sub>OLS</sub> · √(1 + ρ<sub>y</sub>ρ<sub>x</sub>(n − 1))</div></div><div class=\"ln\"><div class=\"fm\">R<sub>j</sub> = <span class=\"fr\"><span>σ<sub>u0</sub>²</span><span>σ<sub>u0</sub>² + σ<sub>e0</sub>²/n<sub>j</sub></span></span>,   û<sub>0j</sub> = R<sub>j</sub>·ỹ<sub>j</sub></div></div><div class=\"hd\">GLS</div><div class=\"ln\"><div class=\"fm\">β̂ = (XᵀV⁻¹X)⁻¹ XᵀV⁻¹ Y</div></div></div>"}, {"k": "exam", "h": "Эталонный ответ: Hierarchical models", "b": "<p>Иерархические данные: единицы вложены в группы (студенты в школах), внутри группы коррелированы. OLS предполагает независимость и поэтому занижает SE, даёт ложно значимые результаты.</p>\n <p>Multilevel модель: y<sub>ij</sub> = β<sub>0</sub> + β<sub>1</sub>x<sub>ij</sub> + (u<sub>0j</sub> + u<sub>1j</sub>x<sub>ij</sub> + e<sub>ij</sub>); fixed part описывает среднюю зависимость, random part — вариацию на уровне групп (random intercept, random slope) и индивидов. ICC = σ<sub>u0</sub>²/(σ<sub>u0</sub>² + σ<sub>e0</sub>²). Оценка: GLS при известных дисперсиях; IGLS (итерации между β и дисперсиями) даёт ML, REML для малых выборок. Residuals уровня 2 предсказываются с shrinkage R<sub>j</sub> = σ<sub>u0</sub>²/(σ<sub>u0</sub>² + σ<sub>e0</sub>²/n<sub>j</sub>), малые группы сжимаются к среднему («borrowing strength»). Расширения: сложные дисперсии и multilevel GLM (logit, Poisson с offset).</p>"}], "part": "Часть 6 · Davide: модели и классификация"}];
const TOPICS_EN = [{"id": "gl", "title": "Glossary of terms and abbreviations", "goal": "SST, SSR, MSE, PCA, PD, ICC and all the other abbreviations of the course, explained.", "part": "Glossary", "cards": [{"k": "story", "h": "How to use the glossary", "b": "<p>All abbreviations and terms of the course are collected here. In addition, <b>in any topic</b> terms from this glossary are underlined with dots: tap one and the explanation appears.</p><p><b>The main confusion: SSR, SSE, SST.</b> SST is the total spread of y around its mean, Σ(y − ȳ)². SSR (in the professor's notation) or SSE/RSS (in most books) is the sum of squared residuals Σ(y − ŷ)², what we minimise. SSM (in some books SSR or ESS) is the explained part Σ(ŷ − ȳ)². Always: SST = residual part + explained part, and R² = 1 − residual/SST.</p>"}, {"k": "formula", "h": "Errors and regression", "b": "<table class=\"sym\"><tr><td>SSR</td><td>Sum of Squared Residuals: Σ(y − ŷ)². This is what least squares minimises. Careful: in some textbooks SSR = \"regression sum of squares\" (the explained part); the professor's SSR = residuals, and Davide calls the same sum RSS/SSE.</td></tr><tr><td>SSE</td><td>Sum of Squared Errors. Same as SSR (residuals) in most textbooks.</td></tr><tr><td>RSS</td><td>Residual Sum of Squares: the same as SSR of residuals.</td></tr><tr><td>SST</td><td>Total Sum of Squares Σ(y − ȳ)²: the total spread of y around its own mean. SST = SSR + SSM.</td></tr><tr><td>TSS</td><td>Total Sum of Squares: the same as SST.</td></tr><tr><td>SSM</td><td>Model (explained) sum of squares Σ(ŷ − ȳ)²: the part of the spread explained by the model (ESS or SSR in other books).</td></tr><tr><td>MSE</td><td>Mean Squared Error = SSR/N: the mean squared error.</td></tr><tr><td>RMSE</td><td>Root MSE = √MSE: the square root of MSE, in the same units as y.</td></tr><tr><td>MAE</td><td>Mean Absolute Error: the mean of the absolute errors, less sensitive to outliers.</td></tr><tr><td>R²</td><td>Coefficient of determination = 1 − SSR/SST: the share of the variance of y explained by the model. For simple regression it equals ρ².</td></tr><tr><td>OLS</td><td>Ordinary Least Squares: a = (XᵀX)⁻¹Xᵀy.</td></tr><tr><td>LSM</td><td>Least Squares Method: choose the parameters by minimising the sum of squared residuals.</td></tr><tr><td>LSM</td><td>Least Squares Method (the same as the OLS of most books).</td></tr><tr><td>WLS</td><td>Weighted Least Squares: each residual is multiplied by a weight (when the error variance differs).</td></tr><tr><td>GLS</td><td>Generalized Least Squares for correlated errors or unequal variance.</td></tr><tr><td>ŷ</td><td>y with a \"hat\": the value predicted by the model (fitted value).</td></tr><tr><td>residual</td><td>Residual r = y − ŷ: actual minus forecast.</td></tr><tr><td>slope</td><td>The slope of the line (α in the professor's notation, β₁ for Davide).</td></tr><tr><td>intercept</td><td>The intercept of the line: the value of y at x = 0 (β in the professor's notation, β₀ for Davide).</td></tr><tr><td>Hessian</td><td>Hessian: the matrix of second derivatives H = d²f/dxᵢdxⱼ; it describes curvature.</td></tr><tr><td>Hessian</td><td>The matrix of second derivatives of a function H = d²f/dxᵢdxⱼ; it describes curvature.</td></tr><tr><td>Jacobian</td><td>Jacobian: the matrix of first derivatives of a vector function J<sub>ij</sub> = drᵢ/daⱼ.</td></tr><tr><td>Jacobian</td><td>The matrix of first derivatives of a vector function Jᵢⱼ = drᵢ/daⱼ.</td></tr><tr><td>ISLR</td><td>An Introduction to Statistical Learning: the textbook (James, Witten, Hastie, Tibshirani) that Davide's programme follows.</td></tr><tr><td>AIC</td><td>Akaike information criterion: 2p − 2ln L, lower = better; penalty for the number of parameters p.</td></tr><tr><td>BIC</td><td>Bayesian information criterion: p·ln N − 2ln L; a stricter penalty than AIC.</td></tr><tr><td>VIF</td><td>Variance Inflation Factor = 1/(1 − R²ⱼ): shows multicollinearity; VIF &gt; 5–10 is a problem.</td></tr><tr><td>CV</td><td>1) Cross-Validation; 2) Coefficient of Variation = σ/μ.</td></tr><tr><td>LOO</td><td>Leave-One-Out cross-validation: k-fold with k = N, one point in the test set each time.</td></tr><tr><td>LOOCV</td><td>Leave-One-Out Cross-Validation: cross-validation with one point at a time.</td></tr><tr><td>LpO</td><td>Leave-p-Out cross-validation: try all subsets of p points as the test set, C(N,p) models.</td></tr><tr><td>holdout</td><td>A single simple split into train and test.</td></tr><tr><td>k-fold</td><td>Split the data into k parts; k times train on k−1 parts and test on the remaining one.</td></tr><tr><td>train</td><td>The training set: we fit the parameters on it.</td></tr><tr><td>test</td><td>The test set: we estimate the error on new data with it.</td></tr><tr><td>bootstrap</td><td>Bootstrap: repeated sampling with replacement from the data to estimate uncertainty.</td></tr></table>"}, {"k": "formula", "h": "Statistics", "b": "<table class=\"sym\"><tr><td>IQR</td><td>Interquartile range = Q₃ − Q₁.</td></tr><tr><td>MAD</td><td>Median Absolute Deviation: the median of |x − median|, a robust measure of spread.</td></tr><tr><td>σ</td><td>Standard deviation: the square root of the variance.</td></tr><tr><td>ρ</td><td>Correlation coefficient ρ = cov/(σₓσ_y) ∈ [−1, 1].</td></tr><tr><td>cov</td><td>Covariance: the joint variability of two quantities.</td></tr><tr><td>var</td><td>Variance: the mean squared deviation from the mean.</td></tr><tr><td>μ</td><td>The mean value (expected value).</td></tr><tr><td>N−1</td><td>Bessel's correction: divide by N − 1, because the mean was estimated from the same data.</td></tr><tr><td>robust</td><td>Robust = resistant to outliers (the median is robust, the mean is not).</td></tr><tr><td>i.i.d.</td><td>Independent and identically distributed.</td></tr><tr><td>MLE</td><td>Maximum Likelihood Estimation.</td></tr><tr><td>ANOVA</td><td>Analysis of Variance.</td></tr><tr><td>SE</td><td>Standard Error of an estimate.</td></tr><tr><td>df</td><td>Degrees of freedom.</td></tr></table>"}, {"k": "formula", "h": "Linear algebra", "b": "<table class=\"sym\"><tr><td>PD</td><td>Positive Definite matrix: xᵀAx &gt; 0 for all x ≠ 0, all λ &gt; 0.</td></tr><tr><td>PSD</td><td>Positive Semi-Definite: xᵀAx ≥ 0, all λ ≥ 0.</td></tr><tr><td>ND</td><td>Negative Definite: all λ &lt; 0.</td></tr><tr><td>det</td><td>The determinant of a matrix.</td></tr><tr><td>rank</td><td>The rank of a matrix: the number of independent rows (or columns).</td></tr><tr><td>SVD</td><td>Singular Value Decomposition A = UΣVᵀ.</td></tr><tr><td>Gram–Schmidt</td><td>The Gram–Schmidt process: turns independent vectors into orthonormal ones.</td></tr><tr><td>eigenvalue</td><td>Eigenvalue λ: Av = λv.</td></tr><tr><td>λ</td><td>An eigenvalue of a matrix (or a parameter, depending on the context).</td></tr><tr><td>Frobenius</td><td>The Frobenius norm ‖A‖_F = √Σaᵢⱼ².</td></tr><tr><td>Rouché–Capelli</td><td>The Rouché–Capelli theorem: the system Ax = b is consistent ⇔ rank A = rank[A | b].</td></tr></table>"}, {"k": "formula", "h": "PCA and clustering", "b": "<table class=\"sym\"><tr><td>PCA</td><td>Principal Component Analysis: rotate the axes to the directions of largest variance.</td></tr><tr><td>PC</td><td>Principal Component: a new axis / the projection of the data onto it.</td></tr><tr><td>scree</td><td>Scree plot: the eigenvalues in decreasing order.</td></tr><tr><td>WCSS</td><td>Within-Cluster Sum of Squares, the objective of k-means.</td></tr><tr><td>BCSS</td><td>Between-Cluster Sum of Squares.</td></tr><tr><td>AHC</td><td>Agglomerative Hierarchical Clustering (bottom-up).</td></tr><tr><td>UPGMA</td><td>Unweighted Pair Group Method with Arithmetic mean: average linkage, the mean of all pairwise distances.</td></tr><tr><td>WPGMA</td><td>Weighted PGMA: the distance to the merged cluster = the mean of the two distances.</td></tr><tr><td>DBSCAN</td><td>Density-Based Spatial Clustering of Applications with Noise: clusters are dense regions, outliers = noise.</td></tr><tr><td>minPts</td><td>The minimum number of points in the ε-neighbourhood for a point to count as core.</td></tr><tr><td>core</td><td>A DBSCAN core point: its ε-neighbourhood holds at least minPts points.</td></tr><tr><td>DB</td><td>Davies–Bouldin index: a clustering quality index, lower = better.</td></tr><tr><td>CH</td><td>Calinski–Harabasz index: the ratio of between-cluster to within-cluster spread, higher = better.</td></tr><tr><td>PAM</td><td>Partitioning Around Medoids — k-medoids.</td></tr><tr><td>CLARA</td><td>Clustering LARge Applications: k-medoids on subsamples for large N.</td></tr><tr><td>dendrogram</td><td>Dendrogram: the tree of cluster merges, height = merge distance.</td></tr><tr><td>Dendrogram</td><td>The tree of cluster merges, height = merge distance.</td></tr><tr><td>linkage</td><td>Linkage: the way to define the distance between clusters (single, complete, average, Ward).</td></tr><tr><td>Ward</td><td>Ward's method: merge the pair that gives the smallest increase of the within-cluster sum of squares.</td></tr><tr><td>Lloyd</td><td>Lloyd's algorithm: classical k-means, alternating point assignment and centre recomputation.</td></tr><tr><td>centroid</td><td>Centroid: the mean of the points of a cluster.</td></tr><tr><td>centroids</td><td>Centroids: the means of the points of the clusters.</td></tr><tr><td>medoid</td><td>Medoid: an actual data point that is central in its cluster.</td></tr><tr><td>Jaccard</td><td>Jaccard distance: 1 − |A∩B|/|A∪B|.</td></tr><tr><td>Hausdorff</td><td>The Hausdorff distance between sets.</td></tr><tr><td>Levenshtein</td><td>Levenshtein distance: the minimum number of insertions, deletions and substitutions between strings.</td></tr><tr><td>Mahalanobis</td><td>Mahalanobis distance: √((x−y)ᵀΣ⁻¹(x−y)), accounts for correlations of features.</td></tr></table>"}, {"k": "formula", "h": "Optimisation", "b": "<table class=\"sym\"><tr><td>∇</td><td>Nabla ∇f (gradient): the vector of all partial derivatives (df/dx₁, …, df/dxₙ); it shows where f grows fastest. For one variable it is the ordinary derivative df/dx.</td></tr><tr><td>GD</td><td>Gradient Descent: x ← x − t∇f.</td></tr><tr><td>SGD</td><td>Stochastic Gradient Descent: the gradient over a random part of the data.</td></tr><tr><td>CG</td><td>Conjugate Gradient method.</td></tr><tr><td>FR</td><td>Fletcher–Reeves: the formula for β in nonlinear CG: ‖g_{k+1}‖²/‖g_k‖².</td></tr><tr><td>PR</td><td>Polak–Ribière: the formula for β in nonlinear CG: gₖ₊₁ᵀ(gₖ₊₁ − gₖ)/‖gₖ‖².</td></tr><tr><td>κ</td><td>Condition number κ = L/m = λ_max/λ_min: the larger it is, the slower GD.</td></tr><tr><td>L-smooth</td><td>An L-smooth function: ‖∇f(x) − ∇f(y)‖ ≤ L‖x − y‖ (curvature at most L).</td></tr><tr><td>Armijo</td><td>The Armijo condition: sufficient decrease of f when choosing the step.</td></tr><tr><td>Wolfe</td><td>The Wolfe conditions: Armijo + the curvature condition.</td></tr><tr><td>backtracking</td><td>Step search: reduce α by the factor b until Armijo holds.</td></tr><tr><td>KKT</td><td>Karush–Kuhn–Tucker: optimality conditions under constraints.</td></tr><tr><td>ε</td><td>A small tolerance (for example, the stopping rule ‖∇f‖ ≤ ε; the radius in DBSCAN).</td></tr></table>"}, {"k": "formula", "h": "Davide: models", "b": "<table class=\"sym\"><tr><td>LRM</td><td>Linear Regression Model.</td></tr><tr><td>GLM</td><td>Generalized Linear Model (logistic, Poisson, etc.).</td></tr><tr><td>LDA</td><td>Linear Discriminant Analysis.</td></tr><tr><td>QDA</td><td>Quadratic Discriminant Analysis.</td></tr><tr><td>ROC</td><td>Receiver Operating Characteristic: the curve of sensitivity against (1 − specificity).</td></tr><tr><td>AUC</td><td>Area Under the ROC Curve: 0.5 = random, 1 = perfect.</td></tr><tr><td>odds</td><td>Odds p/(1 − p).</td></tr><tr><td>logit</td><td>Logit ln(p/(1 − p)): a linear function of X in logistic regression.</td></tr><tr><td>KM</td><td>Kaplan–Meier: an estimate of the survival function from censored data.</td></tr><tr><td>S(t)</td><td>The survival function: the probability of surviving beyond time t, S(t) = P(T &gt; t).</td></tr><tr><td>h(t)</td><td>Hazard (failure rate): the instantaneous risk of the event at time t given survival so far.</td></tr><tr><td>HR</td><td>Hazard Ratio: the ratio of the risks of two groups; e^β in the Cox model.</td></tr><tr><td>PH</td><td>Proportional Hazards: the assumption that hazards are proportional.</td></tr><tr><td>Cox</td><td>The Cox proportional hazards model: h(t|x) = h₀(t)·e^{βx}.</td></tr><tr><td>censor</td><td>Censoring: the event was not observed before the end of the study; we only know that T is larger than the observed time.</td></tr><tr><td>censor</td><td>Censoring: the event was not observed before the end of the study.</td></tr><tr><td>log-rank</td><td>The log-rank test: comparison of the survival curves of two groups.</td></tr><tr><td>ICC</td><td>Intraclass Correlation Coefficient: the share of variance that belongs to the group level.</td></tr><tr><td>VPC</td><td>Variance Partition Coefficient: the same as ICC, the share of variation between groups.</td></tr><tr><td>IGLS</td><td>Iterative Generalized Least Squares: an iterative method for estimating hierarchical models.</td></tr><tr><td>shrinkage</td><td>Shrinkage: group estimates are pulled towards the overall mean.</td></tr><tr><td>multilevel</td><td>A multilevel (hierarchical) model: the data are nested in groups.</td></tr><tr><td>leverage</td><td>Leverage: how unusual x is; a point with high leverage strongly influences the line.</td></tr><tr><td>outlier</td><td>An outlier in y: a point with a large residual.</td></tr></table>"}]}, {"title": "1. Data, scales, frequencies, quantiles", "goal": "What data analysis is, scales, frequencies, histogram, box plot and outliers.", "part": "Part 1 · Statistics", "cards": [{"k": "story", "h": "What data analysis is", "b": "<p><b>Data analysis</b> is the collection, cleaning, transformation and modelling of data in order to obtain compact useful information and make decisions. The idea \"Data = Model + Error\": data = model (the pattern) + error (random noise).</p><p><b>Six stages of the process:</b> 1) requirements (what we want to learn), 2) data collection, 3) cleaning (missing values, errors, duplicates), 4) analysis and modelling, 5) interpretation, 6) visualisation and report.</p><p><b>Types of analysis:</b> textual; statistical (descriptive: we describe the sample, and inferential: we draw conclusions about the population); diagnostic (why it happened); predictive (what will happen); prescriptive (what to do).</p>"}, {"k": "story", "h": "Scales of measurement", "b": "<ul class=\"big\"><li><b>Nominal</b> : categories without order (colour, city). You can count frequencies and the mode.</li><li><b>Ordinal</b> : categories with order (a grade \"bad/average/good\"), but the distances between them are not measured. You can use the median and quantiles.</li><li><b>Numerical</b> : differences are meaningful (height, temperature). Discrete (countable: number of children) or continuous (any value on an interval). You can use the mean and variance.</li></ul><p>The scale decides which operations are legitimate: the mean of a nominal variable is meaningless.</p>"}, {"k": "formula", "h": "Frequencies: formulas", "b": "<table class=\"sym\"><tr><td>fₖ</td><td>absolute frequency: how many times the k-th value occurred; Σfₖ = N</td></tr><tr><td>f̂ₖ = fₖ / N</td><td>relative frequency; Σf̂ₖ = 1</td></tr><tr><td>cumulative</td><td>running sum of frequencies: F₁ = f₁, F₂ = f₁ + f₂, …</td></tr><tr><td>number of classes k</td><td>√N; Sturges 1 + log₂N; Rice 2·∛N</td></tr><tr><td>Freedman–Diaconis</td><td>class width = 2·IQR / ∛N</td></tr><tr><td>class width</td><td>(max − min) / k</td></tr><tr><td>pie chart</td><td>sector angle g from f : 100 = g : 360</td></tr></table>"}, {"k": "num", "h": "Numbers: frequencies and classes", "b": "<p>Grades of 20 students: 3 got A, 7 got B, 8 got C, 2 got D. Absolute: 3, 7, 8, 2 (sum 20). Relative: 0.15; 0.35; 0.40; 0.10 (sum 1). Cumulative relative: 0.15; 0.50; 0.90; 1.00. On the pie chart the sector for C: 0.40·360° = 144°.</p><p>How many classes for N = 100 values? √100 = 10; Sturges 1 + log₂100 = 7.64, that is about 8. If min = 2 and max = 58, the width for k = 8 is (58 − 2)/8 = 7.</p><p><b>Histogram</b> : for continuous data, the bars are adjacent (no gaps), the area is proportional to the frequency. <b>Bar chart</b> : for categories, the bars are separated. <b>Empirical distribution function</b> F(x) = (number of values ≤ x)/N: a non-decreasing step function from 0 to 1.</p>"}, {"k": "formula", "h": "Box plot, quartiles, outliers", "b": "<table class=\"sym\"><tr><td>median Q₂</td><td>the middle value of the ordered data (50% of the data below it)</td></tr><tr><td>Q₁, Q₃</td><td>medians of the lower and upper halves: 25% and 75% of the data below</td></tr><tr><td>IQR = Q₃ − Q₁</td><td>interquartile range: the spread of the central half of the data</td></tr><tr><td>lower fence</td><td>Q₁ − 1.5·IQR</td></tr><tr><td>upper fence</td><td>Q₃ + 1.5·IQR</td></tr></table><p>The box plot draws: min (not counting outliers), Q₁, the median, Q₃, max, and shows the points beyond the fences separately as outliers.</p>"}, {"k": "num", "h": "Numbers: box plot", "b": "<p>Data: 1, 2, 3, 4, 5, 6, 7, 8, 9, 30 (N = 10). Median = (5 + 6)/2 = <b>5.5</b>. The lower half 1–5 gives Q₁ = <b>3</b>, the upper half 6–30 gives Q₃ = <b>8</b>. IQR = 5. Fences: 3 − 7.5 = −4.5 and 8 + 7.5 = 15.5. The value 30 lies beyond the upper fence, so it is an <b>outlier</b>.</p><p>Note: mean = 7.5, median = 5.5. The outlier pulls the mean strongly, while the median hardly changes. That is why the median is <b>robust</b>, the mean is not. (Different textbooks compute quartiles slightly differently; in the exam it is enough to name the method.)</p>"}, {"k": "quiz", "q": "How does a histogram differ from a bar chart?", "o": ["histogram for continuous data, adjacent bars; bar chart for categories", "they are the same", "histogram for categories", "bar chart only for normal data"], "a": 0, "why": "Continuous data have no gaps between classes, categories do."}, {"k": "quiz", "q": "Q₁ = 3, Q₃ = 8. What is the upper fence for outliers?", "o": ["15.5", "8", "11", "13"], "a": 0, "why": "Q₃ + 1.5·IQR = 8 + 1.5·5 = 15.5."}, {"k": "quiz", "q": "Which scale allows the mean and variance?", "o": ["numerical", "nominal", "ordinal", "any"], "a": 0, "why": "The mean requires measurable differences."}, {"k": "note", "h": "Notebook: model answers to the questions", "b": "<div class=\"nb\"><div class=\"hd\">Q: What is data analysis?</div><div class=\"ln\"><div class=\"fm\">Data analysis = collection → cleaning → transformation → modelling</div><div class=\"nt\">goal: compact useful information and decisions</div></div><div class=\"ln\"><div class=\"fm\">Data = Model + Error</div><div class=\"nt\">data = pattern + random noise</div></div><div class=\"hd\">Q: Scales of measurement</div><div class=\"ln\"><div class=\"fm\">nominal: categories without order (colour, city)</div><div class=\"nt\">we count frequencies and the mode</div></div><div class=\"ln\"><div class=\"fm\">ordinal: categories with order (bad &lt; average &lt; good)</div><div class=\"nt\">median, quantiles</div></div><div class=\"ln\"><div class=\"fm\">numerical: discrete (counts) or continuous</div><div class=\"nt\">mean, variance: differences are meaningful</div></div><div class=\"hd\">Q: Phases of the data analysis process</div><div class=\"ln\"><div class=\"fm\">1 requirements → 2 collection → 3 cleaning → 4 analysis/modelling → 5 interpretation → 6 visualisation and report</div><div class=\"nt\">cleaning: missing values, errors, duplicates</div></div><div class=\"hd\">Q: Types of data analysis</div><div class=\"ln\"><div class=\"fm\">descriptive, inferential, diagnostic, predictive, prescriptive, textual</div><div class=\"nt\">what happened / conclusion about the population / why / what will happen / what to do</div></div><div class=\"hd\">Q: How to build a frequency distribution</div><div class=\"ln\"><div class=\"fm\">f<sub>k</sub> = how many times the k-th value occurred,   <span class=\"sm\"><span>K</span><b>Σ</b><span>k=1</span></span> f<sub>k</sub> = N</div><div class=\"nt\">absolute frequency</div></div><div class=\"ln\"><div class=\"fm\">f̂<sub>k</sub> = <span class=\"fr\"><span>f<sub>k</sub></span><span>N</span></span>,   <span class=\"sm\"><span>K</span><b>Σ</b><span>k=1</span></span> f̂<sub>k</sub> = 1</div><div class=\"nt\">relative frequency</div></div><div class=\"ln\"><div class=\"fm\">number of classes  k ≈ √N  or  1 + log₂N,   width = <span class=\"fr\"><span>max − min</span><span>k</span></span></div><div class=\"nt\">continuous data are grouped into classes</div></div><div class=\"hd\">Q: Histogram vs bar chart</div><div class=\"ln\"><div class=\"fm\">histogram: continuous data, bars side by side, area ∝ frequency</div><div class=\"nt\">there are no gaps between classes</div></div><div class=\"ln\"><div class=\"fm\">bar chart: categories, bars separated</div><div class=\"nt\">the order of categories can be changed</div></div><div class=\"hd\">Q: Box plot and outliers</div><div class=\"ln\"><div class=\"fm\">IQR = Q₃ − Q₁</div><div class=\"nt\">interquartile range</div></div><div class=\"ln\"><div class=\"fm\">outlier: x &lt; Q₁ − 1.5·IQR  or  x &gt; Q₃ + 1.5·IQR</div><div class=\"nt\">\"fences\"</div></div><div class=\"ln\"><div class=\"fm\">example 1,2,…,9,30: Q₁ = 3, Q₃ = 8, IQR = 5, fence 15.5, so 30 is an outlier</div></div></div>"}, {"k": "exam", "h": "Model answers", "b": "<p><b>What is data analysis?</b> Process of collecting, cleaning, transforming and modelling data to extract compact useful information and support decisions; Data = Model + Error.</p><p><b>Scales:</b> nominal (categories), ordinal (ordered categories), numerical (discrete or continuous, differences are meaningful).</p><p><b>Phases:</b> requirements, collection, cleaning, analysis/modelling, interpretation, visualisation.</p><p><b>Frequency distribution:</b> list values (or classes), count absolute frequency fₖ, relative f̂ₖ = fₖ/N, cumulative frequencies; number of classes by √N or Sturges 1 + log₂N.</p><p><b>Box plot:</b> min, Q₁, median, Q₃, max; IQR = Q₃ − Q₁; outliers outside [Q₁ − 1.5·IQR, Q₃ + 1.5·IQR].</p>"}], "id": "st1"}, {"title": "2. Means and spread", "goal": "The mean and its properties, kinds of means, variance, the N−1 correction, standardisation.", "part": "Part 1 · Statistics", "cards": [{"k": "story", "h": "Why we need the mean and the variance", "b": "<p><b>The mean</b> μ = (x₁ + … + x_N)/N is the \"centre\" of the data: the point around which the data are balanced. <b>The variance</b> σ² is the mean squared deviation from the mean: how spread out the data are. The mean answers \"where\", the variance answers \"how wide\".</p><p>The mean is <b>not robust</b>: one outlier shifts it strongly.</p>"}, {"k": "note", "h": "Notebook: properties of the mean and the variance", "b": "<div class=\"nb\"><div class=\"hd\">The mean</div><div class=\"ln\"><div class=\"fm\">μ = <span class=\"fr\"><span>1</span><span><i>N</i></span></span> <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> x<sub>k</sub></div></div><div class=\"ln\"><div class=\"fm\"><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (x<sub>k</sub> − μ) = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> x<sub>k</sub> − Nμ = 0</div><div class=\"nt\">the sum of deviations from the mean is zero</div></div><div class=\"ln\"><div class=\"fm\">mean(ax + b) = aμ + b</div><div class=\"nt\">linear transformation of the data</div></div><div class=\"hd\">The variance</div><div class=\"ln\"><div class=\"fm\">σ² = <span class=\"fr\"><span>1</span><span><i>N</i></span></span> <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (x<sub>k</sub> − μ)²</div></div><div class=\"ln\"><div class=\"fm\">= <span class=\"fr\"><span>1</span><span><i>N</i></span></span><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> x<sub>k</sub>² − 2μ·<span class=\"fr\"><span>1</span><span><i>N</i></span></span><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> x<sub>k</sub> + μ²</div><div class=\"nt\">expanded the square</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">σ² = mean(x²) − μ²</span></div><div class=\"nt\">the mean of squares minus the square of the mean</div></div><div class=\"ln\"><div class=\"fm\">var(ax + b) = a²σ²</div><div class=\"nt\">the shift b does not change the variance, the scale a gives a²</div></div><div class=\"hd\">Bessel's correction</div><div class=\"ln\"><div class=\"fm\">σ̃² = <span class=\"fr\"><span>1</span><span>N − 1</span></span> <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (x<sub>k</sub> − x̄)² = <span class=\"fr\"><span>N</span><span>N − 1</span></span> σ²</div><div class=\"nt\">the sample unbiased variance</div></div></div>"}, {"k": "proof", "h": "Why we divide by N − 1", "b": "<p>If the mean μ of the population is known, then (1/N)Σ(xₖ − μ)² is an honest estimate of σ². But in practice μ is unknown, and we take the sample mean x̄, which is fitted to the data.</p><p><b>Derivation:</b> Σ(xₖ − μ)² = Σ(xₖ − x̄)² + N(x̄ − μ)². Take the expected value: E Σ(xₖ − μ)² = Nσ², and E N(x̄ − μ)² = N·σ²/N = σ². Hence E Σ(xₖ − x̄)² = Nσ² − σ² = (N − 1)σ². Dividing by N we would systematically underestimate σ² (by the factor (N−1)/N). Dividing by N − 1 removes the bias. Another way to say it: the data have N − 1 degrees of freedom, because one \"degree\" is spent on estimating the mean (the sum of deviations from x̄ is always zero).</p>"}, {"k": "formula", "h": "Other means and measures of spread", "b": "<table class=\"sym\"><tr><td>weighted</td><td>μ_w = Σwₖxₖ / Σwₖ (for example, grades weighted by credits)</td></tr><tr><td>geometric G</td><td>(x₁·x₂·…·x_N)^(1/N); for growth rates and multipliers</td></tr><tr><td>harmonic H</td><td>N / Σ(1/xₖ); for average speeds and \"price per unit\"</td></tr><tr><td>for x &gt; 0</td><td>H ≤ G ≤ μ, equality only if all x are equal</td></tr><tr><td>mode</td><td>the most frequent value</td></tr><tr><td>CV = σ / |μ|</td><td>coefficient of variation, without units</td></tr><tr><td>range</td><td>max − min</td></tr><tr><td>MAD</td><td>median of |x − median|; a robust measure of spread</td></tr><tr><td>z = (x − μ)/σ</td><td>standardisation: afterwards the mean is 0 and the variance is 1</td></tr></table>"}, {"k": "num", "h": "Numbers", "b": "<p>Data {1, 2, 3, 5}, N = 4. <b>Mean</b> μ = 11/4 = 2.75. <b>Mean of squares</b> = (1 + 4 + 9 + 25)/4 = 9.75. <b>Variance</b> σ² = 9.75 − 2.75² = 9.75 − 7.5625 = <b>2.1875</b>. <b>Sample</b> σ̃² = 4/3 · 2.1875 = <b>2.917</b>. Standard deviation σ ≈ 1.479.</p><p><b>Weighted:</b> grades 24, 25, 28, 26 with credits 8, 6, 8, 12 give (24·8 + 25·6 + 28·8 + 26·12)/34 = 878/34 = 25.82 (the simple mean is 25.75).</p><p><b>Geometric:</b> inflation 2.5%, 2%, 1.5% over three years: G = ∛(1.025·1.02·1.015) = 1.01999, that is 2.0% per year on average.</p><p><b>Harmonic:</b> cars with consumption 10 and 20 km/l: H = 2/(1/10 + 1/20) = 13.33 km/l. Check: for 100 km each, we need 10 + 5 = 15 l for 200 km, that is 13.33 km/l. The arithmetic mean 15 km/l would give a wrong answer.</p><p><b>Standardisation:</b> x = 5 with μ = 2.75, σ = 1.479: z = 1.52 (1.52 standard deviations above the mean).</p>"}, {"k": "quiz", "q": "Why is the sample variance divided by N − 1?", "o": ["the mean is estimated from the same data, otherwise the estimate is too low", "so that the number is an integer", "because N − 1 is always smaller", "it is simply easier to compute"], "a": 0, "why": "E Σ(x−x̄)² = (N−1)σ², dividing by N underestimates σ²."}, {"k": "quiz", "q": "Data x with variance σ². What is the variance of 3x + 5?", "o": ["9σ²", "3σ²", "9σ² + 5", "σ²"], "a": 0, "why": "var(ax + b) = a²σ², the shift does not change the variance."}, {"k": "quiz", "q": "Which mean is needed for the average speed over two equal distances?", "o": ["harmonic", "arithmetic", "geometric", "weighted by time"], "a": 0, "why": "Speeds over equal distances are averaged harmonically."}, {"k": "note", "h": "Notebook: model answers to the questions", "b": "<div class=\"nb\"><div class=\"hd\">Q: Define the mean and its properties</div><div class=\"ln\"><div class=\"fm\">μ = <span class=\"fr\"><span>1</span><span>N</span></span> <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> x<sub>k</sub></div><div class=\"nt\">centre of mass of the data</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (x<sub>k</sub> − μ) = 0</div><div class=\"nt\">the sum of deviations is zero</div></div><div class=\"ln\"><div class=\"fm\">mean(ax + b) = aμ + b</div><div class=\"nt\">linearity; the mean is not robust to outliers</div></div><div class=\"hd\">Q: When to use geometric or harmonic mean</div><div class=\"ln\"><div class=\"fm\">G = (x₁·x₂·…·x<sub>N</sub>)<sup>1/N</sup></div><div class=\"nt\">average growth multiplier (inflation, return)</div></div><div class=\"ln\"><div class=\"fm\">H = <span class=\"fr\"><span>N</span><span>Σ 1/x<sub>k</sub></span></span></div><div class=\"nt\">average speed, price per unit</div></div><div class=\"ln\"><div class=\"fm\">for x &gt; 0:  H ≤ G ≤ μ</div><div class=\"nt\">equality only when all x are equal</div></div><div class=\"hd\">Q: Why divide by N − 1</div><div class=\"ln\"><div class=\"fm\">E <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span>(x<sub>k</sub> − x̄)² = (N − 1)σ²</div><div class=\"nt\">the sample mean is fitted to the same data</div></div><div class=\"ln\"><div class=\"fm\">σ̃² = <span class=\"fr\"><span>1</span><span>N − 1</span></span> <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (x<sub>k</sub> − x̄)²</div><div class=\"nt\">divide by N − 1 and there is no bias; N − 1 degrees of freedom</div></div><div class=\"hd\">Q: What is standardisation</div><div class=\"ln\"><div class=\"fm\">z = <span class=\"fr\"><span>x − μ</span><span>σ</span></span></div><div class=\"nt\">afterwards the mean is 0 and the variance is 1</div></div><div class=\"ln\"><div class=\"fm\">makes different scales comparable; needed before PCA and clustering</div></div></div>"}, {"k": "exam", "h": "Model answers", "b": "<p><b>Mean and properties:</b> μ = Σx/N; Σ(x − μ) = 0; mean(ax + b) = aμ + b; not robust to outliers.</p><p><b>Geometric/harmonic mean:</b> geometric for growth factors and rates (product), harmonic for averaging rates like speeds (reciprocals); for positive data H ≤ G ≤ arithmetic.</p><p><b>Why N − 1:</b> sample mean is fitted to the same data; E Σ(x − x̄)² = (N − 1)σ², so dividing by N underestimates variance (Bessel correction); N − 1 degrees of freedom.</p><p><b>Standardisation:</b> z = (x − μ)/σ, makes mean 0 and variance 1, comparable across scales.</p><p>Variance identity: σ² = mean(x²) − μ²; var(ax + b) = a²σ².</p>"}], "id": "st2"}, {"title": "3. Covariance and correlation", "goal": "Joint variability, |ρ| ≤ 1, limitations of correlation, the covariance matrix.", "part": "Part 1 · Statistics", "cards": [{"k": "story", "h": "The idea", "b": "<p>The variance describes one variable. The covariance describes two at once: <b>do they grow together</b>. For each point we look at whether x and y lie on the same side of their means. If they do more often, the covariance is positive; if on opposite sides, negative.</p><p>The correlation is the same covariance divided by the scales of both variables, so it is always between −1 and 1 and does not depend on the units.</p>"}, {"k": "formula", "h": "Formulas and properties", "b": "<table class=\"sym\"><tr><td>cov(x,y) = (1/N)Σ(xₖ − x̄)(yₖ − ȳ)</td><td>covariance (in statistics often 1/(N−1))</td></tr><tr><td>cov(x,y) = mean(xy) − x̄·ȳ</td><td>a convenient formula: \"the mean of the products minus the product of the means\"</td></tr><tr><td>cov(x,x) = σ²(x)</td><td>the variance is a special case</td></tr><tr><td>cov(ax+b, cy+d) = ac·cov(x,y)</td><td>shifts do not matter, scales multiply</td></tr><tr><td>σ²(ax+by) = a²σ²(x) + b²σ²(y) + 2ab·cov(x,y)</td><td>the variance of a sum</td></tr><tr><td>ρ = cov(x,y)/(σₓσ_y)</td><td>the correlation coefficient, ρ ∈ [−1, 1]</td></tr></table>"}, {"k": "proof", "h": "Derivation: why |ρ| ≤ 1 (via the discriminant)", "b": "<ol class=\"big\"><li>For any number t a sum of squares is non-negative: (1/N)Σ[t(xₖ − x̄) − (yₖ − ȳ)]² ≥ 0.</li><li>Expand: t²σ²(x) − 2t·cov(x,y) + σ²(y) ≥ 0 for all t.</li><li>This is a quadratic in t that is <b>never negative</b>. So its discriminant is not positive: 4cov² − 4σ²(x)σ²(y) ≤ 0.</li><li>Hence cov² ≤ σ²(x)σ²(y) (the Cauchy–Schwarz inequality), that is |cov| ≤ σₓσ_y, and ρ = cov/(σₓσ_y) ∈ [−1, 1].</li><li>|ρ| = 1 if and only if y = ax + b (an exact linear relationship).</li></ol>"}, {"k": "num", "h": "Numbers: traps of correlation", "b": "<p><b>cov = 0 does not mean \"no relationship\".</b> x = −2, −1, 0, 1, 2; y = x² = 4, 1, 0, 1, 4. x̄ = 0, ȳ = 2. Sum of products of deviations: (−2)(2) + (−1)(−1) + 0·(−2) + 1·(−1) + 2·2 = −4 + 1 − 1 + 4 = 0. The covariance is zero although y is fully determined by x (non-linearly). Correlation measures <b>only the linear</b> relationship.</p><p><b>Correlation ≠ causation:</b> ice-cream sales and the number of drownings grow together (the common cause is hot weather).</p><p><b>Sensitive to outliers:</b> one distant point can change ρ sharply.</p><p>Calculation example: x = 1,2,3,4,5; y = 2,4,5,4,5. cov(x,y) = 6/5 = 1.2 (by the formula mean(xy) − x̄ȳ = 13.2 − 12 = 1.2), σₓ = √2, σ_y = √1.2, ρ = 1.2/(√2·√1.2) = 0.775.</p>"}, {"k": "formula", "h": "Covariance and correlation matrices", "b": "<p>For p variables we build a p×p matrix: the variances σ²ⱼ on the diagonal, the covariances cov(xᵢ, xⱼ) off the diagonal; it is symmetric and positive semi-definite. <b>The correlation matrix</b> is the same for standardised data (a diagonal of ones). The covariance matrix is exactly the starting object for <b>PCA</b>.</p><p>In matrix form for centred data X (rows are observations): C = XᵀX/(N−1).</p>"}, {"k": "quiz", "q": "What does cov(x,y) = 0 mean?", "o": ["there is no linear relationship, but a non-linear one may exist", "x and y are independent", "y = x", "the relationship is maximal"], "a": 0, "why": "Example y = x² on symmetric x."}, {"k": "quiz", "q": "What is cov(x,x) equal to?", "o": ["σ²(x)", "0", "1", "σ(x)"], "a": 0, "why": "The variance is the covariance of a quantity with itself."}, {"k": "note", "h": "Notebook: model answers to the questions", "b": "<div class=\"nb\"><div class=\"hd\">Q: Covariance and correlation</div><div class=\"ln\"><div class=\"fm\">cov(x,y) = <span class=\"fr\"><span>1</span><span>N</span></span><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (x<sub>k</sub> − x̄)(y<sub>k</sub> − ȳ) = mean(xy) − x̄·ȳ</div><div class=\"nt\">the sign: do they grow together</div></div><div class=\"ln\"><div class=\"fm\">ρ = <span class=\"fr\"><span>cov(x,y)</span><span>σ<sub>x</sub>·σ<sub>y</sub></span></span></div><div class=\"nt\">dimensionless, ρ ∈ [−1, 1]</div></div><div class=\"hd\">Q: Prove |ρ| ≤ 1</div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>1</span><span>N</span></span><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span>[t(x<sub>k</sub> − x̄) − (y<sub>k</sub> − ȳ)]² ≥ 0  for all t</div><div class=\"nt\">a sum of squares</div></div><div class=\"ln\"><div class=\"fm\">t²σ<sub>x</sub>² − 2t·cov + σ<sub>y</sub>² ≥ 0</div><div class=\"nt\">a quadratic in t, never negative</div></div><div class=\"ln\"><div class=\"fm\">D = 4cov² − 4σ<sub>x</sub>²σ<sub>y</sub>² ≤ 0</div><div class=\"nt\">the discriminant is not positive</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">cov² ≤ σ<sub>x</sub>²σ<sub>y</sub>²  ⇒  |ρ| ≤ 1</span></div><div class=\"nt\">Cauchy–Schwarz; |ρ| = 1 ⇔ y = ax + b</div></div><div class=\"hd\">Q: Limitations of correlation</div><div class=\"ln\"><div class=\"fm\">only a linear relationship: y = x² on symmetric x gives cov = 0</div><div class=\"nt\">non-linearity</div></div><div class=\"ln\"><div class=\"fm\">correlation ≠ causation (a common cause)</div><div class=\"nt\">ice cream and drownings</div></div><div class=\"ln\"><div class=\"fm\">sensitive to outliers</div><div class=\"nt\">one point changes ρ</div></div></div>"}, {"k": "exam", "h": "Model answers", "b": "<p><b>Covariance:</b> cov(x,y) = (1/N)Σ(xₖ − x̄)(yₖ − ȳ) = mean(xy) − x̄ȳ; sign shows direction of linear relationship. <b>Correlation:</b> ρ = cov/(σₓσ_y), scale-free, in [−1, 1].</p><p><b>Proof |ρ| ≤ 1:</b> for all t, (1/N)Σ[t(xₖ−x̄) − (yₖ−ȳ)]² ≥ 0, i.e. t²σₓ² − 2t·cov + σ_y² ≥ 0; non-negative quadratic has discriminant ≤ 0: cov² ≤ σₓ²σ_y² (Cauchy–Schwarz).</p><p><b>Limitations:</b> only linear association (y = x² gives 0), not causation, sensitive to outliers.</p>"}], "id": "st3"}, {"id": "reg", "title": "4. Linear regression: α and β", "goal": "A line through points: what a residual is, α, β, and how to derive them.", "cards": [{"k": "story", "h": "What we are actually doing", "b": "<p>There is a cloud of points (x<sub>i</sub>, y<sub>i</sub>): for example, x is hours of study, y is the grade. We want <b>one line</b>that passes as close as possible to all the points, so that for a new x we can predict y.</p>\n <p>In the professor's lecture the line is written as <b>y = αx + β</b>. Remember it exactly this way: <b>α is the slope</b>, <b>β is the shift (intercept, the value at x = 0)</b>. (In other textbooks it is often the opposite, β<sub>1</sub> is the slope. In the exam write as in the lecture and immediately label what is what.)</p>\n <p><b>Residual</b> of a point: r<sub>i</sub> = y<sub>i</sub> − (αx<sub>i</sub> + β), that is the actual y minus the prediction. It is the <b>vertical</b> distance to the line, not the perpendicular (the lecture stresses this separately).</p>"}, {"k": "num", "h": "Numbers: 5 points", "b": "<p>x = 1, 2, 3, 4, 5; y = 2, 4, 5, 4, 5. Means: x̄ = 3, ȳ = 4.</p>\n <table class=\"tbl\"><tr><th>x</th><th>y</th><th>x−x̄</th><th>y−ȳ</th><th>(x−x̄)(y−ȳ)</th><th>(x−x̄)²</th></tr>\n <tr><td>1</td><td>2</td><td>−2</td><td>−2</td><td>4</td><td>4</td></tr><tr><td>2</td><td>4</td><td>−1</td><td>0</td><td>0</td><td>1</td></tr><tr><td>3</td><td>5</td><td>0</td><td>1</td><td>0</td><td>0</td></tr><tr><td>4</td><td>4</td><td>1</td><td>0</td><td>0</td><td>1</td></tr><tr><td>5</td><td>5</td><td>2</td><td>1</td><td>2</td><td>4</td></tr><tr><th colspan=\"4\">sum</th><th>6</th><th>10</th></tr></table>\n <p><b>α = 6/10 = 0.6</b> (+0.6 points for each extra hour). <b>β = ȳ − αx̄ = 4 − 0.6·3 = 2.2</b>. The line: y = 0.6x + 2.2. Forecasts 2.8; 3.4; 4.0; 4.6; 5.2, residuals −0.8; 0.6; 1.0; −0.6; −0.2 (their sum is 0, this is not an accident, see the derivation).</p>"}, {"k": "formula", "h": "Formulas symbol by symbol", "b": "<table class=\"sym\"><tr><td>α = S<sub>xy</sub> / S<sub>xx</sub></td><td>slope = (sum of products of deviations) / (sum of squared deviations of x)</td></tr>\n <tr><td>S<sub>xy</sub> = Σ(x<sub>i</sub>−x̄)(y<sub>i</sub>−ȳ)</td><td>\"how x and y deviate together\"; divided by N−1 it is the covariance cov(x,y)</td></tr>\n <tr><td>S<sub>xx</sub> = Σ(x<sub>i</sub>−x̄)²</td><td>divided by N−1 it is the variance var(x)</td></tr>\n <tr><td>β = ȳ − αx̄</td><td>the line always passes through the point of means (x̄, ȳ)</td></tr>\n <tr><td>r = S<sub>xy</sub>/√(S<sub>xx</sub>S<sub>yy</sub>)</td><td>correlation coefficient, from −1 to 1; α = r·s<sub>y</sub>/s<sub>x</sub></td></tr></table>\n <p>In the example r = 6/√(10·6) = 0.775. In the lecture code: <code>alpha = cov(x,y)/cov(x,x); beta = mean(y) − alpha*mean(x)</code>.</p>"}, {"k": "proof", "h": "Derivation of the formulas for α and β (least squares method)", "b": "<p><b>Goal:</b> minimise the sum of squared residuals E(α,β) = Σ(y<sub>i</sub> − αx<sub>i</sub> − β)². The square is needed so that pluses and minuses do not cancel and so that the function is smooth.</p>\n <ol class=\"big\">\n <li><b>Derivative with respect to β</b> equals zero: dE/dβ = −2Σ(y<sub>i</sub> − αx<sub>i</sub> − β) = 0. Expand: Σy<sub>i</sub> = αΣx<sub>i</sub> + Nβ. Divide by N: <b>ȳ = αx̄ + β</b>, hence β = ȳ − αx̄. (Along the way: the sum of residuals is 0.)</li>\n <li><b>Derivative with respect to α</b>: dE/dα = −2Σ(y<sub>i</sub> − αx<sub>i</sub> − β)x<sub>i</sub> = 0.</li>\n <li>Substitute β = ȳ − αx̄: Σ[(y<sub>i</sub>−ȳ) − α(x<sub>i</sub>−x̄)]·x<sub>i</sub> = 0.</li>\n <li>Trick: Σ(y<sub>i</sub>−ȳ)x<sub>i</sub> = Σ(y<sub>i</sub>−ȳ)(x<sub>i</sub>−x̄) (because Σ(y<sub>i</sub>−ȳ)·x̄ = 0), and likewise Σ(x<sub>i</sub>−x̄)x<sub>i</sub> = Σ(x<sub>i</sub>−x̄)². We get S<sub>xy</sub> − αS<sub>xx</sub> = 0, that is <b>α = S<sub>xy</sub>/S<sub>xx</sub></b>.</li>\n <li><b>It is indeed a minimum:</b> the matrix of second derivatives [[2Σx<sub>i</sub>², 2Σx<sub>i</sub>],[2Σx<sub>i</sub>, 2N]] has determinant 4(NΣx<sub>i</sub>² − (Σx<sub>i</sub>)²) = 4N·S<sub>xx</sub> &gt; 0 unless all x are equal, and 2N &gt; 0. So it is positive definite: the solution is unique and is a minimum.</li></ol>\n <p>The two equations from steps 1–2 are called the <b>normal equations</b>.</p>"}, {"k": "note", "h": "Notebook 1: what we minimise", "b": "<div class=\"nb\"><div class=\"hd\">Model and residual</div><div class=\"ln\"><div class=\"fm\">ŷ<sub>i</sub> = <i>α</i>·<i>x</i><sub>i</sub> + <i>β</i></div><div class=\"nt\">the prediction of the line for point i</div></div><div class=\"ln\"><div class=\"fm\">r<sub>i</sub> = <i>y</i><sub>i</sub> − <i>α</i><i>x</i><sub>i</sub> − <i>β</i></div><div class=\"nt\">residual = the actual y minus the prediction (vertical distance)</div></div><div class=\"hd\">The least squares criterion</div><div class=\"ln\"><div class=\"fm\">E(<i>α</i>,<i>β</i>) = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> r<sub>i</sub>² = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>y</i><sub>i</sub> − <i>α</i><i>x</i><sub>i</sub> − <i>β</i>)²</div><div class=\"nt\">sum of squared residuals (SSR). The square removes the signs</div></div><div class=\"ln\"><div class=\"fm\">min E(<i>α</i>,<i>β</i>)</div><div class=\"nt\">we look for α and β for which E is smallest</div></div><div class=\"hd\">Two facts about the mean</div><div class=\"ln\"><div class=\"fm\"><span class=\"ov\"><i>x</i></span> = <span class=\"fr\"><span>1</span><span><i>N</i></span></span>·<span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub>  ⇒  <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub> = <i>N</i>·<span class=\"ov\"><i>x</i></span></div><div class=\"nt\">sum = N · mean</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"ov\"><i>y</i></span> = <span class=\"fr\"><span>1</span><span><i>N</i></span></span>·<span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>y</i><sub>i</sub>  ⇒  <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>y</i><sub>i</sub> = <i>N</i>·<span class=\"ov\"><i>y</i></span></div><div class=\"nt\">the same for y</div></div></div>"}, {"k": "note", "h": "Notebook 2: derivatives → normal equations", "b": "<div class=\"nb\"><div class=\"hd\">Rule: the derivative of a square</div><div class=\"ln\"><div class=\"fm\">(u²)′ = 2u·u′</div><div class=\"nt\">u = y<sub>i</sub> − αx<sub>i</sub> − β</div></div><div class=\"ln\"><div class=\"fm\">du/d<i>β</i> = −1,   du/d<i>α</i> = −<i>x</i><sub>i</sub></div><div class=\"nt\">β enters with a minus, α is multiplied by x<sub>i</sub></div></div><div class=\"hd\">Step 1: derivative with respect to <i>β</i></div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>dE</span><span>d<i>β</i></span></span> = −2 <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>y</i><sub>i</sub> − <i>α</i><i>x</i><sub>i</sub> − <i>β</i>) = 0</div><div class=\"nt\">=0 because it is a minimum</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>y</i><sub>i</sub> − <i>α</i><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub> − <i>N</i><i>β</i> = 0</div><div class=\"nt\">Σβ = Nβ, divide by −2</div></div><div class=\"hd\">Step 2: derivative with respect to <i>α</i></div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>dE</span><span>d<i>α</i></span></span> = −2 <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>y</i><sub>i</sub> − <i>α</i><i>x</i><sub>i</sub> − <i>β</i>)·<i>x</i><sub>i</sub> = 0</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub><i>y</i><sub>i</sub> − <i>α</i><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub>² − <i>β</i><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub> = 0</div></div><div class=\"hd\">Normal equations (a linear system, inhomogeneous)</div><div class=\"ln\"><div class=\"fm\"><i>α</i><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub> + <i>N</i><i>β</i> = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>y</i><sub>i</sub></div><div class=\"nt\">(1)</div></div><div class=\"ln\"><div class=\"fm\"><i>α</i><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub>² + <i>β</i><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub> = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub><i>y</i><sub>i</sub></div><div class=\"nt\">(2)  the right-hand sides are not zeros, hence \"inhomogeneous\"</div></div></div>"}, {"k": "note", "h": "Notebook 3: where the means and β come from", "b": "<div class=\"nb\"><div class=\"hd\">Take equation (1)</div><div class=\"ln\"><div class=\"fm\"><i>α</i><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub> + <i>N</i><i>β</i> = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>y</i><sub>i</sub></div></div><div class=\"ln\"><div class=\"fm\"><i>α</i>·<i>N</i><span class=\"ov\"><i>x</i></span> + <i>N</i><i>β</i> = <i>N</i><span class=\"ov\"><i>y</i></span></div><div class=\"nt\">replaced the sums by N · mean</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span><i>α</i>·<i>N</i><span class=\"ov\"><i>x</i></span> + <i>N</i><i>β</i></span><span><i>N</i></span></span> = <span class=\"fr\"><span><i>N</i><span class=\"ov\"><i>y</i></span></span><span><i>N</i></span></span></div><div class=\"nt\">divide both sides by N</div></div><div class=\"ln\"><div class=\"fm\"><i>α</i><span class=\"ov\"><i>x</i></span> + <i>β</i> = <span class=\"ov\"><i>y</i></span></div><div class=\"nt\">N cancelled</div></div><div class=\"hd\">Result</div><div class=\"ln\"><div class=\"fm\"><span class=\"box\"><i>β</i> = <span class=\"ov\"><i>y</i></span> − <i>α</i><span class=\"ov\"><i>x</i></span></span></div><div class=\"nt\">the formula for β</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"ov\"><i>y</i></span> = <i>α</i><span class=\"ov\"><i>x</i></span> + <i>β</i></div><div class=\"nt\">the same thing: the point (x̄, ȳ) lies on the line</div></div></div>"}, {"k": "note", "h": "Notebook 4: substitute β → we get α", "b": "<div class=\"nb\"><div class=\"hd\">Take equation (2) and substitute β = ȳ − αx̄</div><div class=\"ln\"><div class=\"fm\"><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub><i>y</i><sub>i</sub> − <i>α</i><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub>² − (<span class=\"ov\"><i>y</i></span> − <i>α</i><span class=\"ov\"><i>x</i></span>)·<i>N</i><span class=\"ov\"><i>x</i></span> = 0</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub><i>y</i><sub>i</sub> − <i>N</i><span class=\"ov\"><i>x</i></span><span class=\"ov\"><i>y</i></span> = <i>α</i> ( <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub>² − <i>N</i><span class=\"ov\"><i>x</i></span>² )</div><div class=\"nt\">expanded the bracket, collected the terms with α on the right</div></div><div class=\"hd\">Two identities (expand the brackets and use Σx = N·x̄)</div><div class=\"ln\"><div class=\"fm\"><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>x</i><sub>i</sub>−<span class=\"ov\"><i>x</i></span>)(<i>y</i><sub>i</sub>−<span class=\"ov\"><i>y</i></span>) = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub><i>y</i><sub>i</sub> − <i>N</i><span class=\"ov\"><i>x</i></span><span class=\"ov\"><i>y</i></span></div><div class=\"nt\">numerator</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>x</i><sub>i</sub>−<span class=\"ov\"><i>x</i></span>)² = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub>² − <i>N</i><span class=\"ov\"><i>x</i></span>²</div><div class=\"nt\">denominator</div></div><div class=\"hd\">Result</div><div class=\"ln\"><div class=\"fm\"><span class=\"box\"><i>α</i> = <span class=\"fr\"><span><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>x</i><sub>i</sub>−<span class=\"ov\"><i>x</i></span>)(<i>y</i><sub>i</sub>−<span class=\"ov\"><i>y</i></span>)</span><span><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>x</i><sub>i</sub>−<span class=\"ov\"><i>x</i></span>)²</span></span></span></div><div class=\"nt\">sum of products of deviations / sum of squared deviations</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\"><i>α</i> = <span class=\"fr\"><span>cov(<i>x</i>,<i>y</i>)</span><span>var(<i>x</i>)</span></span></span></div><div class=\"nt\">N−1 cancels on top and bottom</div></div></div>"}, {"k": "note", "h": "Notebook 5: variance, covariance, correlation", "b": "<div class=\"nb\"><div class=\"hd\">Variance: the spread of one quantity</div><div class=\"ln\"><div class=\"fm\">var(<i>x</i>) = <span class=\"fr\"><span><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>x</i><sub>i</sub> − <span class=\"ov\"><i>x</i></span>)²</span><span><i>N</i> − 1</span></span></div><div class=\"nt\">deviation from the mean, squared, averaged</div></div><div class=\"ln\"><div class=\"fm\">s<sub>x</sub> = √var(<i>x</i>)</div><div class=\"nt\">standard deviation, in units of x</div></div><div class=\"hd\">Covariance: how two quantities change together</div><div class=\"ln\"><div class=\"fm\">cov(<i>x</i>,<i>y</i>) = <span class=\"fr\"><span><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>x</i><sub>i</sub> − <span class=\"ov\"><i>x</i></span>)(<i>y</i><sub>i</sub> − <span class=\"ov\"><i>y</i></span>)</span><span><i>N</i> − 1</span></span></div><div class=\"nt\">(+)(+) and (−)(−) give plus, (+)(−) gives minus</div></div><div class=\"ln\"><div class=\"fm\">cov(<i>x</i>,<i>x</i>) = var(<i>x</i>)</div><div class=\"nt\">variance: the covariance of a quantity with itself</div></div><div class=\"hd\">Correlation: covariance without units</div><div class=\"ln\"><div class=\"fm\">r = <span class=\"fr\"><span>cov(<i>x</i>,<i>y</i>)</span><span>s<sub>x</sub>·s<sub>y</sub></span></span></div><div class=\"nt\">always from −1 to 1</div></div><div class=\"ln\"><div class=\"fm\"><i>α</i> = <span class=\"fr\"><span>cov(<i>x</i>,<i>y</i>)</span><span>var(<i>x</i>)</span></span> = r·<span class=\"fr\"><span>s<sub>y</sub></span><span>s<sub>x</sub></span></span></div><div class=\"nt\">the link between correlation and slope</div></div><div class=\"hd\">Check with numbers</div><div class=\"ln\"><div class=\"fm\">x: 1,2,3,4,5;  y: 2,4,5,4,5;  <span class=\"ov\"><i>x</i></span>=3,  <span class=\"ov\"><i>y</i></span>=4</div></div><div class=\"ln\"><div class=\"fm\">var(<i>x</i>) = <span class=\"fr\"><span>10</span><span>4</span></span> = 2.5,   cov = <span class=\"fr\"><span>6</span><span>4</span></span> = 1.5,   <i>α</i> = <span class=\"fr\"><span>1.5</span><span>2.5</span></span> = 0.6,   <i>β</i> = 4 − 0.6·3 = 2.2</div></div><div class=\"ln\"><div class=\"fm\">r = <span class=\"fr\"><span>1.5</span><span>1.581·1.225</span></span> = 0.775</div></div></div>"}, {"k": "quiz", "q": "In the professor's notation y = αx + β, what is β?", "o": ["slope of the line", "the value of y at x = 0 (the intercept)", "correlation coefficient", "residual"], "a": 1, "why": "In the lecture α is the slope, β is the intercept. The line passes through (x̄, ȳ), so β = ȳ − αx̄."}, {"k": "quiz", "q": "Why is the sum of residuals in least squares with an intercept equal to zero?", "o": ["it happened so in the example", "from the condition dE/dβ = 0", "from the condition dE/dα = 0", "because r = 1"], "a": 1, "why": "dE/dβ = −2Σr<sub>i</sub> = 0, that is Σr<sub>i</sub> = 0."}, {"k": "quiz", "q": "x̄ = 3, ȳ = 4, α = 0.6. What is β?", "o": ["2.2", "1.8", "0.6", "4"], "a": 0, "why": "β = ȳ − αx̄ = 4 − 0.6·3 = 2.2."}, {"k": "note", "h": "Notebook: model answers to the questions", "b": "<div class=\"nb\"><div class=\"hd\">Q: Least squares method for simple linear regression</div><div class=\"ln\"><div class=\"fm\">ŷ<sub>i</sub> = α<i>x</i><sub>i</sub> + β,   r<sub>i</sub> = <i>y</i><sub>i</sub> − α<i>x</i><sub>i</sub> − β</div><div class=\"nt\">residual = actual − forecast</div></div><div class=\"ln\"><div class=\"fm\">E(α,β) = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> r<sub>i</sub>² → min</div><div class=\"nt\">we minimise the sum of squared residuals (SSR)</div></div><div class=\"hd\">Q: Derive α and β</div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>dE</span><span>dβ</span></span> = 0  ⇒  <span class=\"box\">β = ȳ − αx̄</span></div><div class=\"nt\">the line passes through (x̄, ȳ)</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>dE</span><span>dα</span></span> = 0  ⇒  <span class=\"box\">α = <span class=\"fr\"><span><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>x</i><sub>i</sub>−x̄)(<i>y</i><sub>i</sub>−ȳ)</span><span><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>x</i><sub>i</sub>−x̄)²</span></span> = <span class=\"fr\"><span>cov(x,y)</span><span>var(x)</span></span></span></div><div class=\"nt\">after substituting β</div></div><div class=\"ln\"><div class=\"fm\">the Hessian is positive definite ⇒ a unique minimum</div></div><div class=\"hd\">Q: How is goodness of fit related to ρ</div><div class=\"ln\"><div class=\"fm\">SSR = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span>(y<sub>i</sub> − ȳ)² − α²<span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span>(x<sub>i</sub> − x̄)² = N·var(y) − α²·N·var(x)</div><div class=\"nt\">substituted ŷ</div></div><div class=\"ln\"><div class=\"fm\">α = <span class=\"fr\"><span>cov</span><span>var(x)</span></span>  ⇒  SSR = N·var(y)·(1 − ρ²) = SST·(1 − ρ²)</div><div class=\"nt\">cov² / (var x · var y) = ρ²</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">R² = 1 − SSR/SST = ρ²</span></div><div class=\"nt\">for simple regression</div></div></div>"}, {"k": "exam", "h": "How to answer \"Linear regression / Alpha, Beta\"", "b": "<ol class=\"big\"><li>Model y = αx + β + r, α is the slope, β the intercept, r the error.</li><li>Residual r<sub>i</sub> = y<sub>i</sub> − αx<sub>i</sub> − β, the vertical distance.</li><li>Criterion: min E(α,β) = Σr<sub>i</sub>².</li><li>Normal equations (derivatives = 0) and their solution: α = cov(x,y)/var(x), β = ȳ − αx̄.</li><li>Check for a minimum (the Hessian is positive definite).</li><li>A mini example with numbers and r.</li></ol>"}, {"k": "exam", "h": "Model answer (this is how you can write in the exam)", "b": "<p><b>Linear regression.</b> Linear regress
