ion models the dependence of y on x by a line y = αx + β + r, where α is the slope, β is the intercept, r is the residual (error).</p>\n<p><b>Residual</b> r<sub>i</sub> = y<sub>i</sub> − αx<sub>i</sub> − β. The parameters are chosen to minimise the sum of squared residuals E(α,β) = Σr<sub>i</sub>².</p>\n<p><b>Derivation.</b> dE/dβ = 0 gives β = ȳ − αx̄. dE/dα = 0 after substituting β gives α = Σ(x<sub>i</sub>−x̄)(y<sub>i</sub>−ȳ) / Σ(x<sub>i</sub>−x̄)² = cov(x,y)/var(x). The Hessian is positive definite (the determinant is 4N·S<sub>xx</sub> &gt; 0), so this is the unique minimum.</p>\n<p><b>Example.</b> x = 1..5, y = 2,4,5,4,5: α = 6/10 = 0.6, β = 4 − 0.6·3 = 2.2, SSR = 2.4.</p>\n<p><b>Notation:</b> in Gorgone's lectures α = slope, β = intercept; in Davide's slides and ISLR it is the opposite: β<sub>0</sub> = intercept, β<sub>1</sub> = slope. In the exam say at once which notation you use and label what is what.</p><p><b>Alpha / Beta (in the notation of Gorgone's lecture):</b> α = slope = cov(x,y)/var(x), β = intercept = mean(y) − α·mean(x). The line passes through (x̄, ȳ).</p>"}], "part": "Part 2 · Regression"}, {"id": "err", "title": "5. SSR, MSE, R²", "goal": "Model errors: the sum of squared residuals, MSE, goodness of fit.", "cards": [{"k": "story", "h": "Careful: the professor's SSR", "b": "<p>In the lecture <b>SSR = Sum of Squared Residuals</b> = sum of squared residuals = E(α) = Σ(y<sub>i</sub> − f(x<sub>i</sub>, α))². It is also called SSE (Sum of Squared Errors, the lecture uses both names).</p>\n <p>In many other textbooks SSR means the opposite, \"the sum of squares explained by the regression\". So in the exam <b>write it as a formula</b>: «SSR = Σr<sub>i</sub>²».</p>\n <p><b>MSE</b> (Mean Squared Error) is the same sum but averaged: MSE = SSR / N. It is the \"mean squared error\", convenient for comparing sets of different sizes.</p>"}, {"k": "num", "h": "Numbers from the previous topic", "b": "<p>Residuals: −0.8; 0.6; 1.0; −0.6; −0.2.</p><p><b>SSR</b> = 0.64 + 0.36 + 1 + 0.36 + 0.04 = <b>2.4</b>. <b>MSE</b> = 2.4/5 = <b>0.48</b>. <b>RMSE</b> = √0.48 ≈ 0.693 (in the same units as y).</p>\n <p><b>Total variation</b> SST = Σ(y<sub>i</sub> − ȳ)² = 4+0+1+0+1 = 6. <b>R² = 1 − SSR/SST = 1 − 2.4/6 = 0.6</b>: the model explains 60% of the spread of y (and r² = 0.775² = 0.6; this is not an accident in simple regression).</p>"}, {"k": "formula", "h": "Formulas symbol by symbol", "b": "<table class=\"sym\"><tr><td>SSR = Σr<sub>i</sub>²</td><td>sum of squared residuals (what least squares minimises)</td></tr><tr><td>MSE = SSR/N</td><td>mean squared error; sometimes divided by N−p (p parameters) so that the estimate is unbiased</td></tr><tr><td>RMSE = √MSE</td><td>typical error in units of y</td></tr><tr><td>SST = Σ(y<sub>i</sub>−ȳ)²</td><td>total spread of y around the mean (the error of the \"constant model\" ȳ)</td></tr><tr><td>R² = 1 − SSR/SST</td><td>share of the explained spread: 1 is perfect, 0 is no better than the mean</td></tr><tr><td>R²<sub>adj</sub> = 1 − (1−R²)(N−1)/(N−p−1)</td><td>R² with a penalty for extra variables (p predictors)</td></tr></table>"}, {"k": "proof", "h": "Derivation: SST = SSR + (explained part)", "b": "<p>Let ŷ<sub>i</sub> be the forecast, r<sub>i</sub> = y<sub>i</sub> − ŷ<sub>i</sub>. Then y<sub>i</sub> − ȳ = (y<sub>i</sub> − ŷ<sub>i</sub>) + (ŷ<sub>i</sub> − ȳ). Square and sum:</p>\n <p>Σ(y<sub>i</sub>−ȳ)² = Σr<sub>i</sub>² + Σ(ŷ<sub>i</sub>−ȳ)² + 2Σr<sub>i</sub>(ŷ<sub>i</sub>−ȳ).</p>\n <p>The cross term is zero: ŷ<sub>i</sub> − ȳ = α(x<sub>i</sub> − x̄), and from the normal equations Σr<sub>i</sub> = 0 and Σr<sub>i</sub>x<sub>i</sub> = 0 (the residuals are orthogonal to the columns 1 and x). So Σr<sub>i</sub>(ŷ<sub>i</sub>−ȳ) = αΣr<sub>i</sub>x<sub>i</sub> − αx̄Σr<sub>i</sub> = 0.</p>\n <p><b>Result:</b> SST = SSR + SS<sub>explained</sub>, so R² = 1 − SSR/SST = SS<sub>explained</sub>/SST ∈ [0,1].</p>\n <p><b>Why SSR is not suitable for choosing a model:</b> when variables are added SSR only decreases (R² grows) even on junk, so adj R² or a check on new data is needed (topic 5).</p>"}, {"k": "quiz", "q": "SSR = 2.4, N = 5. What is MSE?", "o": ["0.48", "12", "2.4", "1.55"], "a": 0, "why": "MSE = SSR/N = 2.4/5 = 0.48."}, {"k": "quiz", "q": "SST = 6, SSR = 2.4. What is R²?", "o": ["0.4", "0.6", "2.5", "3.6"], "a": 1, "why": "R² = 1 − 2.4/6 = 0.6."}, {"k": "note", "h": "Notebook: SSR, MSE, R²", "b": "<div class=\"nb\"><div class=\"hd\">Definitions</div><div class=\"ln\"><div class=\"fm\">SSR = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> r<sub>i</sub>² = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>y</i><sub>i</sub> − ŷ<sub>i</sub>)²</div><div class=\"nt\">sum of squared residuals</div></div><div class=\"ln\"><div class=\"fm\">MSE = <span class=\"fr\"><span>SSR</span><span><i>N</i></span></span></div><div class=\"nt\">mean squared error</div></div><div class=\"ln\"><div class=\"fm\">RMSE = √MSE</div><div class=\"nt\">in units of y</div></div><div class=\"ln\"><div class=\"fm\">SST = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>y</i><sub>i</sub> − <span class=\"ov\"><i>y</i></span>)²</div><div class=\"nt\">total spread of y around the mean</div></div><div class=\"hd\">Decomposition</div><div class=\"ln\"><div class=\"fm\">(<i>y</i><sub>i</sub>−<span class=\"ov\"><i>y</i></span>) = (<i>y</i><sub>i</sub>−ŷ<sub>i</sub>) + (ŷ<sub>i</sub>−<span class=\"ov\"><i>y</i></span>)</div><div class=\"nt\">added and subtracted ŷ</div></div><div class=\"ln\"><div class=\"fm\">SST = SSR + <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (ŷ<sub>i</sub>−<span class=\"ov\"><i>y</i></span>)²</div><div class=\"nt\">cross term = 0, because Σr = 0 and Σrx = 0</div></div><div class=\"hd\">Coefficient of determination</div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">R² = 1 − <span class=\"fr\"><span>SSR</span><span>SST</span></span></span></div><div class=\"nt\">share of the explained spread, from 0 to 1</div></div><div class=\"ln\"><div class=\"fm\">R²<sub>adj</sub> = 1 − (1−R²)<span class=\"fr\"><span>N−1</span><span>N−p−1</span></span></div><div class=\"nt\">penalty for the number of predictors p</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>2.4</span><span>6</span></span>=0.4,   R² = 1 − 0.4 = 0.6,   MSE = <span class=\"fr\"><span>2.4</span><span>5</span></span> = 0.48</div><div class=\"nt\">numbers from our example</div></div></div>"}, {"k": "note", "h": "Notebook: model answers to the questions", "b": "<div class=\"nb\"><div class=\"hd\">Q: Sum of squared residuals, MSE, R²</div><div class=\"ln\"><div class=\"fm\">SSR = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (y<sub>i</sub> − ŷ<sub>i</sub>)²</div><div class=\"nt\">sum of squared residuals (what least squares minimises)</div></div><div class=\"ln\"><div class=\"fm\">MSE = <span class=\"fr\"><span>SSR</span><span>N</span></span>,   RMSE = √MSE</div><div class=\"nt\">mean squared error; RMSE in units of y</div></div><div class=\"ln\"><div class=\"fm\">SST = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (y<sub>i</sub> − ȳ)²</div><div class=\"nt\">total spread of y around the mean</div></div><div class=\"ln\"><div class=\"fm\">SST = SSR + SSM</div><div class=\"nt\">residuals are orthogonal to ŷ − ȳ; SSM = Σ(ŷ − ȳ)² the explained part</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">R² = 1 − SSR/SST</span></div><div class=\"nt\">share of the explained variance; 1 is perfect, 0 is no better than the mean</div></div></div>"}, {"k": "exam", "h": "Answer \"Sum of squared residuals / MSE\"", "b": "<ol class=\"big\"><li>Residual r<sub>i</sub> = y<sub>i</sub> − f(x<sub>i</sub>,α).</li><li>SSR = Σr<sub>i</sub>², this is the function E(α) that least squares minimises.</li><li>MSE = SSR/N (RMSE = √MSE).</li><li>Relation to R² and SST.</li><li>The error estimate on test data (cross-validation) is more honest than on training data.</li></ol>"}, {"k": "exam", "h": "Model answer (this is how you can write in the exam)", "b": "<p><b>Sum of Squared Residuals (SSR/SSE).</b> SSR = Σ<sub>i=1..N</sub> r<sub>i</sub>² = Σ(y<sub>i</sub> − f(x<sub>i</sub>,α))² is the function E(α) that the least squares method minimises. Squaring removes the signs, penalises large errors more strongly and makes the function smooth and convex (for a linear model).</p>\n<p><b>MSE</b> = SSR/N is the mean squared error (RMSE = √MSE in units of y). For test data this is the main criterion of forecast quality.</p>\n<p><b>R²</b> = 1 − SSR/SST, where SST = Σ(y<sub>i</sub>−ȳ)². Derivation: SST = SSR + Σ(ŷ<sub>i</sub>−ȳ)², because the residuals are orthogonal to ŷ − ȳ.</p>\n<p><b>Example:</b> residuals −0.8; 0.6; 1.0; −0.6; −0.2 → SSR = 2.4, MSE = 0.48, SST = 6, R² = 0.6.</p>"}], "part": "Part 2 · Regression"}, {"id": "ols", "title": "6. OLS in matrix form", "goal": "The normal equations XᵀXα = Xᵀy and their derivation. Multiple regression.", "cards": [{"k": "story", "h": "The same points as a system of equations", "b": "<p>Each point gives an equation: αx<sub>i</sub> + β ≈ y<sub>i</sub>. In total N equations in 2 unknowns: the system is <b>overdetermined</b>, there is no exact solution. OLS (Ordinary Least Squares) finds the solution that gives the smallest sum of squared residuals.</p>\n <p>We write all the equations at once: <b>X a ≈ y</b>, where X is an N×p matrix (the first column is x<sub>i</sub>, the second is ones), a = (α, β)<sup>T</sup>, y is the vector of observations. For multiple regression there are simply more columns (one column per variable).</p>"}, {"k": "num", "h": "The same example in matrices", "b": "<p>Columns of X: x and ones; N = 5. We compute:</p><pre class=\"code\">XᵀX = [ Σx²  Σx ]   = [ 55  15 ]      Xᵀy = [ Σxy ] = [ 66 ]\n      [ Σx    N ]     [ 15   5 ]            [ Σy  ]   [ 20 ]</pre>\n <p>Σxy = 2+8+15+16+25 = 66. Solve 55α + 15β = 66 and 15α + 5β = 20. From the second, β = 4 − 3α. Into the first: 55α + 60 − 45α = 66, so <b>α = 0.6, β = 2.2</b>. The same answer.</p>"}, {"k": "formula", "h": "Formulas symbol by symbol", "b": "<table class=\"sym\"><tr><td>E(a) = ‖y − Xa‖²</td><td>the sum of squared residuals in vector notation</td></tr><tr><td>XᵀX a = Xᵀy</td><td>the normal equations</td></tr><tr><td>a = (XᵀX)⁻¹Xᵀy</td><td>the solution; it exists if the columns of X are linearly independent (rank X = p)</td></tr><tr><td>ŷ = X a = H y, H = X(XᵀX)⁻¹Xᵀ</td><td>forecasts; H projects y onto the column space of X</td></tr></table>"}, {"k": "proof", "h": "Derivation of the normal equations", "b": "<ol class=\"big\">\n <li>E(a) = (y − Xa)ᵀ(y − Xa) = yᵀy − 2aᵀXᵀy + aᵀXᵀX a.</li>\n <li>The gradient (rules: d(aᵀb)/da = b, d(aᵀMa)/da = 2Ma for a symmetric M): <b>dE/da = −2Xᵀy + 2XᵀX a</b>.</li>\n <li>Set it equal to zero: <b>XᵀX a = Xᵀy</b>. These are the p \"normal\" equations.</li>\n <li><b>Minimum and uniqueness:</b> the Hessian matrix d²E/da² = 2XᵀX. For any vector v: vᵀXᵀXv = ‖Xv‖² ≥ 0, and for independent columns Xv ≠ 0, so XᵀX is positive definite. Then XᵀX is invertible, the solution a = (XᵀX)⁻¹Xᵀy is unique and E is convex, i.e. it is a global minimum (lecture: \"closed-form solution unique, if N ≥ p\").</li>\n <li><b>Geometry:</b> the normal equations mean Xᵀ(y − Xa) = 0, that is <b>the residual vector is orthogonal to every column of X</b>. ŷ is the orthogonal projection of y onto the column space. Therefore, if there is a column of ones, Σr<sub>i</sub> = 0.</li></ol>"}, {"k": "quiz", "q": "What does XᵀX a = Xᵀy mean geometrically?", "o": ["the residuals are orthogonal to the columns of X", "the residuals are zero", "a is orthogonal to y", "X is square"], "a": 0, "why": "Xᵀ(y − Xa) = 0: the residual vector is perpendicular to all columns of X."}, {"k": "quiz", "q": "When is XᵀX not invertible?", "o": ["when the columns of X are linearly dependent (multicollinearity)", "when N is large", "when y is constant", "never"], "a": 0, "why": "We need rank X = p; otherwise the solution is not unique."}, {"k": "note", "h": "Notebook: OLS in matrices", "b": "<div class=\"nb\"><div class=\"hd\">Model and criterion</div><div class=\"ln\"><div class=\"fm\">y = X<b>a</b> + r</div><div class=\"nt\">X: N×p, a: the vector of parameters</div></div><div class=\"ln\"><div class=\"fm\">E(a) = (y − Xa)ᵀ(y − Xa) = yᵀy − 2aᵀXᵀy + aᵀXᵀXa</div><div class=\"nt\">expanded the brackets</div></div><div class=\"hd\">The derivative</div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>dE</span><span>da</span></span> = −2Xᵀy + 2XᵀXa = 0</div><div class=\"nt\">rules: d(aᵀb)/da = b, d(aᵀMa)/da = 2Ma</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">XᵀX a = Xᵀy</span></div><div class=\"nt\">the normal equations</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">a = (XᵀX)⁻¹ Xᵀ y</span></div><div class=\"nt\">if rank X = p</div></div><div class=\"hd\">Why it is a minimum</div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>d²E</span><span>da²</span></span> = 2XᵀX</div><div class=\"nt\">the Hessian</div></div><div class=\"ln\"><div class=\"fm\">vᵀXᵀXv = ‖Xv‖² ≥ 0</div><div class=\"nt\">is positive definite ⇒ a unique minimum</div></div><div class=\"ln\"><div class=\"fm\">Xᵀ(y − Xa) = 0</div><div class=\"nt\">the residuals ⟂ the columns of X</div></div></div>"}, {"k": "note", "h": "Notebook: model answers to the questions", "b": "<div class=\"nb\"><div class=\"hd\">Q: OLS (ordinary least squares) in matrix form</div><div class=\"ln\"><div class=\"fm\">y = X a + r</div><div class=\"nt\">X is an N×(p+1) matrix, the first column is ones</div></div><div class=\"ln\"><div class=\"fm\">E(a) = (y − Xa)ᵀ(y − Xa) → min</div><div class=\"nt\">SSR in matrix form</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>dE</span><span>da</span></span> = −2Xᵀ(y − Xa) = 0</div><div class=\"nt\">the derivative with respect to the vector a</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">XᵀX a = Xᵀy  ⇒  a = (XᵀX)⁻¹Xᵀy</span></div><div class=\"nt\">the normal equations</div></div><div class=\"ln\"><div class=\"fm\">XᵀX is not invertible if the columns of X are linearly dependent (multicollinearity) or N &lt; p + 1</div><div class=\"nt\">then regularisation or the pseudo-inverse</div></div></div>"}, {"k": "exam", "h": "Answer \"OLS\"", "b": "<ol class=\"big\"><li>Model y = Xa + r, criterion min ‖y − Xa‖².</li><li>The gradient and the normal equations XᵀXa = Xᵀy.</li><li>The solution a = (XᵀX)⁻¹Xᵀy and the condition rank X = p.</li><li>Minimum: the Hessian 2XᵀX is positive definite.</li><li>Geometric meaning (projection) and a mini 2×2 example.</li></ol>"}, {"k": "exam", "h": "Model answer (this is how you can write in the exam)", "b": "<p><b>OLS (Ordinary Least Squares)</b> is the least squares method: from all parameters we choose the vector a that minimises E(a) = ‖y − Xa‖².</p>\n<p><b>Derivation.</b> E = yᵀy − 2aᵀXᵀy + aᵀXᵀXa. The gradient: dE/da = −2Xᵀy + 2XᵀXa = 0 ⇒ the normal equations <b>XᵀXa = Xᵀy</b> ⇒ <b>a = (XᵀX)⁻¹Xᵀy</b> (for rank X = p). The Hessian 2XᵀX is positive definite ⇒ a unique global minimum.</p>\n<p><b>Geometry:</b> Xᵀ(y − Xa) = 0, the residuals are orthogonal to the columns of X, ŷ = Xa is the projection of y onto the column space. In simple regression this gives α = cov(x,y)/var(x), β = ȳ − αx̄.</p>\n<p><b>Example:</b> XᵀX = [[55,15],[15,5]], Xᵀy = [66,20] ⇒ α = 0.6, β = 2.2.</p>"}], "part": "Part 2 · Regression"}, {"id": "poly", "title": "7. Polynomial regression", "goal": "How to compute it: the same linear regression, but with the columns 1, x, x², ...", "cards": [{"k": "story", "h": "A curve, but \"linear in the parameters\": why", "b": "<div class=\"nb ex\"><div class=\"hd\">The model</div><div class=\"ln\"><div class=\"fm\">y = <i>α</i><sub>0</sub> + <i>α</i><sub>1</sub>·x + <i>α</i><sub>2</sub>·x² + … + <i>α</i><sub>p</sub>·x<sup>p</sup></div><div class=\"nt\">a curve (parabola etc.) in x</div></div><p>The question: why is this still \"linear regression\"? Because the word \"linear\" refers to the <b>parameters α</b>, not to x. Let us check this by differentiating the model with respect to each α.</p><div class=\"hd\">Step 1: derivatives with respect to the parameters</div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>dy</span><span>d<i>α</i><sub>0</sub></span></span> = 1</div><div class=\"nt\">α₀ stands alone</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>dy</span><span>d<i>α</i><sub>1</sub></span></span> = x</div><div class=\"nt\">α₁ is multiplied by x</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>dy</span><span>d<i>α</i><sub>2</sub></span></span> = x²</div><div class=\"nt\">α₂ is multiplied by x²</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>dy</span><span>d<i>α</i><sub>j</sub></span></span> = x<sup>j</sup></div><div class=\"nt\">in general</div></div><p><b>Conclusion:</b> no α appears in the answers. So the derivative with respect to α<sub>j</sub> does not depend on the parameters themselves. This is the definition of \"linear in the parameters\". The reason: x comes from the data table, so x<sup>j</sup> is just a known number, and each α is only multiplied by such a number and added to the others.</p><div class=\"hd\">Step 2: change of variables</div><div class=\"ln\"><div class=\"fm\">z<sub>1</sub> = x,  z<sub>2</sub> = x²,  …,  z<sub>p</sub> = x<sup>p</sup></div><div class=\"nt\">new columns, computed in advance from x</div></div><div class=\"ln\"><div class=\"fm\">y = <i>α</i><sub>0</sub> + <i>α</i><sub>1</sub>z<sub>1</sub> + <i>α</i><sub>2</sub>z<sub>2</sub> + … + <i>α</i><sub>p</sub>z<sub>p</sub></div><div class=\"nt\">an ordinary multiple linear regression</div></div><p>So all the OLS formulas are the same: <b>α = (XᵀX)⁻¹Xᵀy</b>. The conditions for a minimum dE/dα<sub>j</sub> = 0 give a linear system for α, solved in one step, with no iterations. And this is <b>one</b> regression on several features (x, x², x³), not a set of separate regressions.</p><div class=\"hd\">Counterexample: when the model is NOT linear in the parameters</div><div class=\"ln\"><div class=\"fm\">y = <i>α</i><sub>0</sub> + x<sup><i>α</i><sub>1</sub></sup></div></div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>dy</span><span>d<i>α</i><sub>1</sub></span></span> = x<sup><i>α</i><sub>1</sub></sup>·ln x</div><div class=\"nt\">α₁ remains in the answer: it depends on the parameter</div></div><p>Here α₁ is in the exponent, the equations dE/dα = 0 are already nonlinear and cannot be solved by a formula: iterations are needed (Newton, Gauss–Newton). This is nonlinear regression.</p><div class=\"hd\">Numbers: three points (0, 1), (1, 2), (2, 5), the model y = α₀ + α₁x + α₂x²</div><div class=\"ln\"><div class=\"fm\">x = 0:   <i>α</i><sub>0</sub> = 1</div><div class=\"nt\">substituted the point (0, 1)</div></div><div class=\"ln\"><div class=\"fm\">x = 1:   <i>α</i><sub>0</sub> + <i>α</i><sub>1</sub> + <i>α</i><sub>2</sub> = 2</div><div class=\"nt\">substituted (1, 2)</div></div><div class=\"ln\"><div class=\"fm\">x = 2:   <i>α</i><sub>0</sub> + 2<i>α</i><sub>1</sub> + 4<i>α</i><sub>2</sub> = 5</div><div class=\"nt\">substituted (2, 5)</div></div><div class=\"ln\"><div class=\"fm\"><i>α</i><sub>0</sub> = 1,  <i>α</i><sub>1</sub> = 0,  <i>α</i><sub>2</sub> = 1  ⇒  y = 1 + x²</div><div class=\"nt\">the linear system for α is solved by ordinary algebra</div></div><p>The curve turned out bent (a parabola), yet α was found as for a straight line: this is how \"linearity in the parameters\" works.</p></div>"}, {"k": "num", "h": "Numbers: a parabola through 4 points", "b": "<p>Points: (−1, 2), (0, 1), (1, 2), (2, 5), degree p = 2. Columns: 1, x, x².</p>\n <pre class=\"code\">X = [1 −1 1]      y = [2]\n    [1  0 0]          [1]\n    [1  1 1]          [2]\n    [1  2 4]          [5]\n\nXᵀX = [ 4  2  6 ]    Xᵀy = [10]\n      [ 2  6  8 ]          [10]\n      [ 6  8 18 ]          [24]</pre>\n <p>Solve XᵀXα = Xᵀy: we get <b>α = (1, 0, 1)</b>, that is y = 1 + 0·x + 1·x² = x² + 1. The residuals are zero (exactly these points lie on the parabola). For comparison: the line gives y = 2 + x and SSR = 4. The parabola fits better.</p>"}, {"k": "formula", "h": "The Vandermonde matrix and the steps", "b": "<table class=\"sym\"><tr><td>X<sub>ij</sub> = x<sub>i</sub><sup>j</sup>, j = 0..p</td><td>the Vandermonde matrix, size N×(p+1)</td></tr><tr><td>α = (XᵀX)⁻¹Xᵀy</td><td>the same normal equations</td></tr><tr><td>p ≤ N − 1</td><td>for p = N−1 the curve passes through all points (interpolation, SSR = 0)</td></tr></table>\n <p><b>The algorithm in the exam:</b> 1) choose the degree p; 2) build X with the columns 1, x, …, x<sup>p</sup>; 3) form XᵀX and Xᵀy; 4) solve the system; 5) compute SSR and compare degrees by cross-validation.</p>"}, {"k": "proof", "h": "Why the formulas are the same and why p cannot be too large", "b": "<p><b>The same:</b> f(x,α) = Σα<sub>j</sub>x<sup>j</sup> is linear in α, so df/dα<sub>j</sub> = x<sup>j</sup> does not depend on α, and the conditions dE/dα<sub>j</sub> = −2Σ(y<sub>i</sub> − f(x<sub>i</sub>))x<sub>i</sub><sup>j</sup> = 0 give exactly XᵀXα = Xᵀy (see topic 3).</p>\n <p><b>Overfitting:</b> for N distinct points the system with p = N−1 has a unique solution (the Vandermonde determinant Π(x<sub>j</sub>−x<sub>i</sub>) ≠ 0), the curve passes through all points and SSR = 0, but between them it oscillates wildly and predicts new data badly. How to choose the degree: by the error on <b>test</b> data (holdout, k-fold, topic 5) or by adjusted R², not by SSR on the training data.</p>"}, {"k": "quiz", "q": "Why is polynomial regression considered linear?", "o": ["linear in the parameters α", "linear in x", "because p = 1", "because the graph is a line"], "a": 0, "why": "The parameters enter linearly, so the normal equations work."}, {"k": "quiz", "q": "You have N = 9 distinct points. At what degree will the polynomial pass through all the points?", "o": ["p = 2", "p = 4", "p = 8", "p = 9"], "a": 2, "why": "p = N − 1 = 8: nine coefficients for nine points."}, {"k": "note", "h": "Notebook: polynomial regression", "b": "<div class=\"nb\"><div class=\"hd\">The model</div><div class=\"ln\"><div class=\"fm\">y = α<sub>0</sub> + α<sub>1</sub>x + α<sub>2</sub>x² + … + α<sub>p</sub>x<sup>p</sup></div><div class=\"nt\">linear in α, not in x</div></div><div class=\"hd\">The Vandermonde matrix</div><div class=\"ln\"><div class=\"fm\">X<sub>ij</sub> = x<sub>i</sub><sup>j</sup>,   j = 0,…,p</div><div class=\"nt\">rows = points, columns = 1, x, x², …</div></div><div class=\"hd\">The solution</div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">XᵀX α = Xᵀy</span></div><div class=\"nt\">the same normal equations</div></div><div class=\"ln\"><div class=\"fm\">α = (XᵀX)⁻¹ Xᵀ y</div></div><div class=\"hd\">The degree</div><div class=\"ln\"><div class=\"fm\">p ≤ N − 1</div><div class=\"nt\">for p = N−1, SSR = 0 (interpolation, overfitting)</div></div><div class=\"ln\"><div class=\"fm\">choice of p: the minimum of the CV error</div><div class=\"nt\">not by SSR on the training data</div></div><div class=\"ln\"><div class=\"fm\">(−1,2), (0,1), (1,2), (2,5), p=2  ⇒  α = (1, 0, 1),   y = x² + 1</div><div class=\"nt\">example</div></div></div>"}, {"k": "note", "h": "Notebook: model answers to the questions", "b": "<div class=\"nb\"><div class=\"hd\">Q: How can a non-linear model be linearised</div><div class=\"ln\"><div class=\"fm\">y = a·e<sup>bx</sup>  ⇒  ln y = ln a + b·x</div><div class=\"nt\">linear regression of ln y on x</div></div><div class=\"ln\"><div class=\"fm\">y = a·x<sup>b</sup>  ⇒  ln y = ln a + b·ln x</div><div class=\"nt\">log–log</div></div><div class=\"ln\"><div class=\"fm\">y = 1/(a + bx)  ⇒  1/y = a + bx</div><div class=\"nt\">change of variable</div></div><div class=\"hd\">Q: Multiple linear regression in matrix form</div><div class=\"ln\"><div class=\"fm\">y = X a,  a = (XᵀX)⁻¹Xᵀy</div><div class=\"nt\">rows of X are observations, columns are features</div></div><div class=\"hd\">Q: Why polynomial regression is multiple regression</div><div class=\"ln\"><div class=\"fm\">y = a₀ + a₁x + a₂x² + … + a<sub>p</sub>x<sup>p</sup></div><div class=\"nt\">the model is linear in the parameters a</div></div><div class=\"ln\"><div class=\"fm\">X = [1, x, x², …, x<sup>p</sup>]  (the Vandermonde matrix)</div><div class=\"nt\">the powers of x are \"new features\"; then the same formula a = (XᵀX)⁻¹Xᵀy</div></div><div class=\"ln\"><div class=\"fm\">for N points the degree p ≤ N − 1: for p = N − 1 the curve passes through all points (overfitting)</div></div></div>"}, {"k": "exam", "h": "Answer \"How to calculate polynomial regression?\"", "b": "<ol class=\"big\"><li>The model and why it is linear in the parameters.</li><li>The Vandermonde matrix X.</li><li>The normal equations and the solution α = (XᵀX)⁻¹Xᵀy.</li><li>A mini example (as above).</li><li>Choice of the degree: overfitting, cross-validation.</li></ol>"}, {"k": "exam", "h": "Model answer (this is how you can write in the exam)", "b": "<p><b>Polynomial regression.</b> The model y = α<sub>0</sub> + α<sub>1</sub>x + … + α<sub>p</sub>x<sup>p</sup> + r is non-linear in x, but <b>linear in the parameters α</b>, so it is a special case of multiple linear regression.</p>\n<p><b>How to compute it:</b> 1) choose the degree p; 2) build the Vandermonde matrix X (X<sub>ij</sub> = x<sub>i</sub><sup>j</sup>, j = 0..p); 3) form the normal equations XᵀXα = Xᵀy; 4) solve α = (XᵀX)⁻¹Xᵀy; 5) compute SSR; 6) choose the degree by cross-validation (on the training data SSR falls as p grows, for p = N−1 the curve passes through all points but is overfitted).</p>\n<p><b>Example:</b> points (−1,2), (0,1), (1,2), (2,5), p = 2 ⇒ XᵀX = [[4,2,6],[2,6,8],[6,8,18]], Xᵀy = [10,10,24] ⇒ α = (1,0,1), y = x² + 1.</p>"}], "part": "Part 2 · Regression"}, {"id": "jac", "title": "8. The Jacobian and non-linear least squares (Gauss–Newton)", "goal": "What the Jacobian is and how to fit a model that is non-linear in its parameters.", "cards": [{"k": "story", "h": "When the linear formulas do not work", "b": "<p>The model y = f(x, α), where α enters non-linearly, for example y = e<sup>αx</sup>. The normal equations are non-linear in α and there is usually no closed-form solution. The idea: <b>at each step replace the function by its linear approximation</b> (the first term of the Taylor series) and solve an ordinary linear least squares problem. Repeat until it converges.</p>\n <p><b>The Jacobian</b> is the matrix of all first partial derivatives. For fitting: J<sub>ij</sub> = df(x<sub>i</sub>, α)/dα<sub>j</sub> (N×p): a row for each point, a column for each parameter. For a vector function F: ℝⁿ→ℝᵐ: J<sub>ij</sub> = dF<sub>i</sub>/dx<sub>j</sub>.</p>"}, {"k": "num", "h": "Numbers: the Jacobian of a vector function", "b": "<p>F(x,y) = (x²y, 5x + sin y). Then</p><pre class=\"code\">J = [ dF₁/dx  dF₁/dy ]  =  [ 2xy   x² ]\\n    [ dF₂/dx  dF₂/dy ]     [  5   cos y ]\\n\\nat the point (1, 0):  J = [ 0  1 ]\\n                     [ 5  1 ]</pre><p>The Jacobian gives a \"linear copy\" of the function near a point: F(p+d) ≈ F(p) + J·d.</p>"}, {"k": "proof", "h": "Derivation of the Gauss–Newton step (as in the lecture)", "b": "<ol class=\"big\">\n <li>The residuals r<sub>i</sub> = y<sub>i</sub> − f(x<sub>i</sub>, α). We want to minimise E(α) = Σr<sub>i</sub>².</li>\n <li>Let the current approximation be α<sup>k</sup>. Linearise: f(x<sub>i</sub>, α) ≈ f(x<sub>i</sub>, α<sup>k</sup>) + Σ<sub>j</sub> J<sub>ij</sub> Δα<sub>j</sub>, where Δα = α − α<sup>k</sup>, J<sub>ij</sub> = df(x<sub>i</sub>, α<sup>k</sup>)/dα<sub>j</sub>.</li>\n <li>Denote Δy<sub>i</sub> = y<sub>i</sub> − f(x<sub>i</sub>, α<sup>k</sup>) (the current residual). Then r<sub>i</sub> ≈ Δy<sub>i</sub> − Σ<sub>j</sub> J<sub>ij</sub>Δα<sub>j</sub>, that is r ≈ Δy − JΔα.</li>\n <li>This is a <b>linear</b> least squares problem: min ‖Δy − JΔα‖². By topic 3 (X→J, y→Δy) the normal equations are: <b>JᵀJ Δα = JᵀΔy</b>.</li>\n <li>We solve Δα = (JᵀJ)⁻¹JᵀΔy and update <b>α<sup>k+1</sup> = α<sup>k</sup> + Δα</b>. We recompute J at the new point (it changes at every iteration) and repeat until the sum of squares stops decreasing.</li></ol>"}, {"k": "num", "h": "Numbers: y = e^{αx}", "b": "<p>Data: (0,1), (1,2), (2,7). Start α⁰ = 0.5. Here f = e<sup>αx</sup>, df/dα = x·e<sup>αx</sup>.</p>\n <table class=\"tbl\"><tr><th>x</th><th>f(x,0.5)</th><th>J = x·f</th><th>Δy = y−f</th></tr><tr><td>0</td><td>1.000</td><td>0</td><td>0</td></tr><tr><td>1</td><td>1.649</td><td>1.649</td><td>0.351</td></tr><tr><td>2</td><td>2.718</td><td>5.437</td><td>4.282</td></tr></table>\n <p>JᵀJ = 1.649² + 5.437² = 32.27; JᵀΔy = 1.649·0.351 + 5.437·4.282 = 23.86. Δα = 23.86/32.27 = <b>0.739</b>, so α¹ = 1.239 (an overshoot). Next iterations: α² ≈ 1.028, α³ ≈ 0.969, α⁴ ≈ 0.965 (converging to ≈ 0.97). SSR by steps: 18.46 → 26.34 → 1.31 → 0.41. We see that Gauss–Newton can get worse on the first step, so a sensible starting value matters.</p>"}, {"k": "formula", "h": "What to remember", "b": "<table class=\"sym\"><tr><td>JᵀJ Δα = JᵀΔy</td><td>the normal equations of the step; for a linear model J = X and we get ordinary OLS in one step</td></tr><tr><td>The starting α⁰</td><td>convergence depends on it, otherwise divergence is possible</td></tr><tr><td>Local minima</td><td>in non-linear least squares there can be many (in the linear case the minimum is unique)</td></tr><tr><td>Stopping</td><td>when SSR stops decreasing or the step Δα is small</td></tr><tr><td>The Jacobian numerically</td><td>by finite differences (J<sub>ij</sub> ≈ [f(α+hε<sub>j</sub>) − f(α)]/h), if analytically it is hard</td></tr></table>"}, {"k": "quiz", "q": "What is the size of the Jacobian J when fitting N points and p parameters?", "o": ["N×p", "p×p", "N×N", "p×N"], "a": 0, "why": "A row for each point, a column for each parameter."}, {"k": "quiz", "q": "Into what problem does each Gauss–Newton step turn?", "o": ["into a linear least squares problem for the correction Δα", "into sorting", "into root finding", "into a zero fit"], "a": 0, "why": "min‖Δy − JΔα‖², hence JᵀJ Δα = JᵀΔy."}, {"k": "note", "h": "Notebook: the Jacobian and Gauss–Newton", "b": "<div class=\"nb\"><div class=\"hd\">The Jacobian</div><div class=\"ln\"><div class=\"fm\">J<sub>ij</sub> = <span class=\"fr\"><span>df(x<sub>i</sub>, α)</span><span>dα<sub>j</sub></span></span></div><div class=\"nt\">row = point, column = parameter, size N×p</div></div><div class=\"hd\">Linearisation (Taylor)</div><div class=\"ln\"><div class=\"fm\">f(x<sub>i</sub>,α) ≈ f(x<sub>i</sub>,α<sup>k</sup>) + Σ<sub>j</sub> J<sub>ij</sub> Δα<sub>j</sub></div><div class=\"nt\">Δα = α − αᵏ</div></div><div class=\"ln\"><div class=\"fm\">Δy<sub>i</sub> = y<sub>i</sub> − f(x<sub>i</sub>, α<sup>k</sup>)</div><div class=\"nt\">the current residual</div></div><div class=\"ln\"><div class=\"fm\">r ≈ Δy − J Δα</div><div class=\"nt\">the residual after linearisation</div></div><div class=\"hd\">Linear least squares for the correction</div><div class=\"ln\"><div class=\"fm\">min ‖Δy − JΔα‖²</div><div class=\"nt\">like OLS: X → J, y → Δy</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">JᵀJ Δα = Jᵀ Δy</span></div><div class=\"nt\">the normal equations of the step</div></div><div class=\"ln\"><div class=\"fm\">α<sup>k+1</sup> = α<sup>k</sup> + Δα</div><div class=\"nt\">the new approximation, J is recomputed</div></div></div>"}, {"k": "note", "h": "Notebook: model answers to the questions", "b": "<div class=\"nb\"><div class=\"hd\">Q: Non-linear least squares</div><div class=\"ln\"><div class=\"fm\">r<sub>i</sub>(a) = <i>y</i><sub>i</sub> − f(<i>x</i><sub>i</sub>, a),   E(a) = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> r<sub>i</sub>(a)² → min</div><div class=\"nt\">f is non-linear in the parameters a</div></div><div class=\"ln\"><div class=\"fm\">the normal equations are non-linear, there is no closed formula ⇒ iterations</div><div class=\"nt\">a starting point and derivatives are needed</div></div><div class=\"hd\">Q: Gauss–Newton algorithm</div><div class=\"ln\"><div class=\"fm\">J<sub>ij</sub> = dr<sub>i</sub>/da<sub>j</sub></div><div class=\"nt\">the Jacobian of the residuals, size N×p</div></div><div class=\"ln\"><div class=\"fm\">r(a + δ) ≈ r(a) + J·δ</div><div class=\"nt\">linearisation of the residuals</div></div><div class=\"ln\"><div class=\"fm\">min ‖r + Jδ‖²  ⇒  JᵀJ δ = −Jᵀr</div><div class=\"nt\">at each step an ordinary linear least squares problem</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">a<sub>k+1</sub> = a<sub>k</sub> − (JᵀJ)⁻¹Jᵀr</span></div><div class=\"nt\">the Gauss–Newton step</div></div><div class=\"hd\">Q: Compare linear and non-linear least squares</div><div class=\"ln\"><div class=\"fm\">linear: one step, the formula (XᵀX)⁻¹Xᵀy, a unique minimum</div><div class=\"nt\">a convex problem</div></div><div class=\"ln\"><div class=\"fm\">non-linear: iterations, depends on the start, local minima are possible, the Jacobian is needed</div><div class=\"nt\">GN is quasi-Newton: the Hessian ≈ JᵀJ</div></div></div>"}, {"k": "exam", "h": "Answer \"Jacobian / nonlinear least squares\"", "b": "<ol class=\"big\"><li>The definition of the Jacobian and its size.</li><li>Why an iterative method is needed (no closed form).</li><li>Taylor linearisation and the derivation of JᵀJΔα = JᵀΔy.</li><li>The algorithm: initial α, step, update, stopping criterion.</li><li>Problems: the starting value, local minima, the need for J.</li></ol>"}, {"k": "exam", "h": "Model answer (this is how you can write in the exam)", "b": "<p><b>Jacobian.</b> The matrix of first partial derivatives. For F: ℝⁿ → ℝᵐ: J<sub>ij</sub> = dF<sub>i</sub>/dx<sub>j</sub> (m×n). When fitting a model y = f(x,α): J<sub>ij</sub> = df(x<sub>i</sub>,α)/dα<sub>j</sub> (N×p). It gives the linear approximation F(x+d) ≈ F(x) + J d.</p>\n<p><b>Non-linear least squares (Gauss–Newton).</b> The normal equations are non-linear in α, there is no closed-form solution ⇒ iterations α<sup>k+1</sup> = α<sup>k</sup> + Δα. Linearise f by Taylor: f(x<sub>i</sub>,α) ≈ f(x<sub>i</sub>,α<sup>k</sup>) + Σ J<sub>ij</sub>Δα<sub>j</sub>. Then r ≈ Δy − JΔα, Δy<sub>i</sub> = y<sub>i</sub> − f(x<sub>i</sub>,α<sup>k</sup>). Minimising ‖Δy − JΔα‖² gives <b>JᵀJ Δα = JᵀΔy</b>. J is recomputed at each iteration (it can be done numerically by finite differences).</p>\n<p><b>Problems:</b> a good starting α⁰ is needed, local minima and divergence are possible.</p>"}], "part": "Part 2 · Regression"}, {"id": "res", "title": "9. Resampling: cross-validation and bootstrap", "goal": "How to check a model honestly on new data.", "cards": [{"k": "story", "h": "Why", "b": "<p>A model fitted to the data always looks good on that same data (high R², small SSR). But we need the ability to <b>predict new</b> data. So we hide part of the data: we train on one part (the training set) and check on another (the testing set). Repeated splitting and averaging is called <b>resampling</b>.</p>\n <p>(If the list of questions said \"Resembling\", most likely resampling was meant, and this is the cross-validation from the lecture.)</p>"}, {"k": "formula", "h": "Methods from the lecture", "b": "<table class=\"sym\"><tr><td>Holdout</td><td>split once into train/test (often 10–33% in test). Fast, but the result depends on the random split.</td></tr>\n <tr><td>Leave-p-out (LpO)</td><td>p points in the test set, and we try ALL ways: C(N,p) models. For N = 100, p = 30 this is ≈ 2.9·10²⁵, unrealistic.</td></tr>\n <tr><td>Leave-one-out (LOO)</td><td>p = 1, N models in total. Expensive for large N.</td></tr>\n <tr><td>k-fold</td><td>split into k equal parts, each serves once as the test. k models in total; k = N gives LOO; 2-fold: train d1/test d2 and vice versa.</td></tr></table>\n <p>The final estimate = the mean of all the test errors: CV = (1/k)·Σ MSE<sub>j</sub>.</p>"}, {"k": "num", "h": "Numbers", "b": "<p>N = 8 points. <b>LOO:</b> 8 models; each is trained on 7 points and checked on 1. <b>4-fold:</b> 4 parts of 2 points, 4 models (each trained on 6, tested on 2); on average this is faster and more stable than a single holdout.</p>\n <p>Example of choosing the degree: for polynomials p = 1..5 we compute the 4-fold CV error, for example 3.2; 0.9; 0.8; 2.5; 9.1. We take p = 3: the minimum of the test error (after that overfitting begins: on training the error would keep falling, but on test it grows).</p>"}, {"k": "proof", "h": "Derivation: the bootstrap takes ≈ 63.2% distinct points (ISLR ch. 5)", "b": "<p><b>Bootstrap</b> (ISLR ch. 5, not from Gorgone's slides): from N points we draw a point N times <b>with replacement</b>, get a new sample of the same size, compute the statistic, repeat many times and look at the spread (an estimate of the error).</p>\n <p>The probability that a particular point was NOT drawn into the sample: (1 − 1/N)<sup>N</sup> → e<sup>−1</sup> ≈ 0.368 as N → ∞ (since (1 − 1/N)<sup>N</sup> → e<sup>−1</sup>). So it was drawn with probability ≈ 0.632: on average 63.2% distinct points, the remaining ≈ 36.8% (\"out-of-bag\") are used as the test.</p>"}, {"k": "quiz", "q": "What does k-fold cross-validation do when k = N?", "o": ["turns into leave-one-out", "turns into holdout", "nothing", "computes C(N,2) models"], "a": 0, "why": "Lecture: for k = N, k-fold CV equals leave-one-out."}, {"k": "quiz", "q": "Why is LpO CV hardly ever used?", "o": ["the number of splits C(N,p) is huge", "it is inaccurate", "it is not for regression", "it is always 2 times more expensive than the bootstrap"], "a": 0, "why": "Example from the lecture: C(100,30) ≈ 2.9·10²⁵ repetitions."}, {"k": "note", "h": "Notebook: model answers to the questions", "b": "<div class=\"nb\"><div class=\"hd\">Q: What is cross-validation and why</div><div class=\"ln\"><div class=\"fm\">the error on the training data is too low: the model is fitted to it</div><div class=\"nt\">overfitting</div></div><div class=\"ln\"><div class=\"fm\">CV estimates the error on data that the model has not seen</div><div class=\"nt\">choice of a model and hyperparameters</div></div><div class=\"hd\">Q: Holdout, LpO, LOO, k-fold</div><div class=\"ln\"><div class=\"fm\">holdout: one train/test split (fast, but depends on the split)</div></div><div class=\"ln\"><div class=\"fm\">k-fold: split into k parts, k times train on k − 1 and test on the remaining one,  CV = <span class=\"fr\"><span>1</span><span>k</span></span> <span class=\"sm\"><span>k</span><b>Σ</b><span>j=1</span></span> MSE<sub>j</sub></div><div class=\"nt\">usually k = 5 or 10</div></div><div class=\"ln\"><div class=\"fm\">LOO: k = N (one point at a time); LpO: all subsets of p points, C(N,p) models, too expensive</div></div><div class=\"hd\">Q: How to choose the degree of the polynomial</div><div class=\"ln\"><div class=\"fm\">the error on train always falls as the degree grows</div><div class=\"nt\">for p = N − 1 it equals 0</div></div><div class=\"ln\"><div class=\"fm\">compute the CV error for p = 1, 2, 3, … and take the p with the minimum (or the simplest within the noise)</div><div class=\"nt\">the CV curve is U-shaped</div></div></div>"}, {"k": "exam", "h": "Answer \"Resampling / Cross-validation\"", "b": "<ol class=\"big\"><li>The problem: overfitting, the estimate on the training data is too optimistic.</li><li>The idea: train/test, repeat and average.</li><li>Methods: holdout, LpO, LOO, k-fold (pros and cons).</li><li>Application: choosing the polynomial degree and the number of features.</li><li>Bootstrap in brief: sampling with replacement, 63.2%.</li></ol>"}, {"k": "exam", "h": "Model answer (this is how you can write in the exam)", "b": "<p><b>Resampling</b> is repeated splitting of the data into a training and a testing part to estimate the ability of the model to predict new data (the error on the training data is too low and leads to overfitting).</p>\n<p><b>Methods (lecture):</b> holdout (one split); leave-p-out (all C(N,p) splits, too expensive); leave-one-out (N models); k-fold (data into k parts, each is the test once, k models; k = N coincides with LOO). The estimate = the mean of the errors on the test parts.</p>\n<p><b>Application:</b> choice of the polynomial degree, the number of features, hyperparameters: we take the variant with the minimal CV error.</p>\n<p><b>Bootstrap</b> (general theory): sampling with replacement, each point is drawn with probability 1 − (1 − 1/N)<sup>N</sup> → 1 − e<sup>−1</sup> ≈ 0.632.</p>"}], "part": "Part 2 · Regression"}, {"id": "sel", "title": "10. Forward / backward selection", "goal": "How to choose features in regression.", "ext": true, "cards": [{"k": "story", "h": "A topic outside the lecture slides", "b": "<p class=\"warn\"><b>Source:</b> this is not in Gorgone's slides, but in Davide's programme it is ISLR ch. 6, section 6.1 (best subset, forward and backward stepwise). The text below is written from ISLR and general theory, not from the slides.</p>\n <p>There are p possible features. Trying all subsets (2<sup>p</sup> models) is impossible for large p, so greedy stepwise methods are used:</p>\n <ul class=\"big\"><li><b>Forward selection:</b> start with the empty model (only the intercept). At each step add the feature that improves the criterion most. Stop when adding no longer helps.</li><li><b>Backward elimination:</b> start with all features, at each step remove the most useless one. Stop when removal worsens the criterion.</li><li><b>Stepwise:</b> a combination (both adding and removing are allowed).</li></ul>"}, {"k": "formula", "h": "Criteria: what we use to measure \"better\"", "b": "<table class=\"sym\"><tr><td>adj R²</td><td>1 − (1−R²)(N−1)/(N−p−1): grows only if the feature helps more than the penalty</td></tr><tr><td>AIC</td><td>N·ln(SSR/N) + 2k: a penalty of 2 for each parameter (k parameters), lower is better</td></tr><tr><td>BIC</td><td>N·ln(SSR/N) + k·ln N: a stronger penalty</td></tr><tr><td>C<sub>p</sub> (ISLR 6.1)</td><td>(RSS + 2dσ̂²)/N, d the number of predictors; lower is better</td></tr><tr><td>CV error</td><td>test MSE from k-fold</td></tr><tr><td>F-test / p-value</td><td>whether the feature being added is significant</td></tr></table>\n <p>You must not choose by the plain SSR or R²: they always improve when features are added (see topic 2).</p>"}, {"k": "num", "h": "Example with hypothetical numbers", "b": "<p>Features x<sub>1</sub>, x<sub>2</sub>, x<sub>3</sub>. Hypothetical SSR values (the numbers are made up to show the logic): the empty model 100; {x<sub>1</sub>} 40; {x<sub>2</sub>} 70; {x<sub>3</sub>} 90.</p>\n <p><b>Forward, step 1:</b> the best single x<sub>1</sub> (SSR 40), we take it. <b>Step 2:</b> we try {x<sub>1</sub>,x<sub>2</sub>} = 38 and {x<sub>1</sub>,x<sub>3</sub>} = 39.5. The improvement from 40 to 38 is small: by AIC/CV it may not pay for the extra parameter, then we stop at {x<sub>1</sub>}.</p>\n <p><b>Backward:</b> we start with {x<sub>1</sub>,x<sub>2</sub>,x<sub>3</sub>}, remove the feature whose removal worsens the criterion least, and so on.</p>\n <p>The number of all models for p = 3: 2³ = 8; for p = 20 it is already more than a million, hence the greedy search.</p>"}, {"k": "proof", "h": "Why greedy search does not guarantee the best model", "b": "<p>Forward adds features one at a time and does not revisit past decisions: two features may be useful only together (each is weak alone), and forward will miss them. Backward starts with the full model, so it finds such pairs, but it needs N &gt; p and breaks under multicollinearity (XᵀX is not invertible). To avoid fooling yourself, the final model is checked on separate data (cross-validation).</p>"}, {"k": "quiz", "q": "What does forward selection start with?", "o": ["with the empty model", "with all features", "with random features", "with the most significant one"], "a": 0, "why": "Forward: the empty model, then we add one at a time. Backward is the opposite."}, {"k": "quiz", "q": "Can we choose features by the minimum SSR on the training data?", "o": ["no, SSR falls when any features are added", "yes, it is the best criterion", "only in backward", "only if N is small"], "a": 0, "why": "That is why adj R², AIC/BIC or the CV error are needed."}, {"k": "exam", "h": "Answer \"Forward / backward selection\"", "b": "<ol class=\"big\"><li>Why: many features, 2<sup>p</sup> subsets are too many.</li><li>Forward: empty → add the best; Backward: full → remove the worst.</li><li>Stopping criterion: adj R², AIC/BIC, CV, F-test.</li><li>Drawbacks: greediness, multicollinearity, overfitting during selection.</li></ol>"}, {"k": "exam", "h": "Model answer (this is how you can write in the exam)", "b": "<p><b>Forward / backward selection</b> are greedy feature selection methods in regression when trying all 2<sup>p</sup> subsets is impossible.</p>\n<p><b>Forward:</b> start with the empty model; at each step add the feature that gives the largest improvement of the criterion; stop when there is no improvement. <b>Backward:</b> start with all features; at each step remove the least useful one; stop when removal worsens the criterion. <b>Stepwise</b> is a combination.</p>\n<p><b>Criteria:</b> adjusted R², AIC = N ln(SSR/N) + 2k, BIC = N ln(SSR/N) + k ln N, the CV error, the F-test. You must not use the plain SSR/R² (they improve when any feature is added).</p>\n<p><b>Drawbacks:</b> greediness (does not guarantee the best set), backward needs N &gt; p, multicollinearity. (The topic is not from the slides, it is general theory.)</p>"}], "part": "Part 2 · Regression"}, {"title": "11. Matrices, determinant, rank, systems", "goal": "The determinant, rank, the Rouché–Capelli theorem, the methods of Gauss and Cramer.", "part": "Part 3 · Linear algebra and PCA", "cards": [{"k": "story", "h": "Why this course needs linear algebra", "b": "<p>Regression (the normal equations XᵀXa = Xᵀy), PCA (eigenvectors), Gauss–Newton, gradient methods: all of these are systems of linear equations and matrices. Here is the minimum needed for the rest of the course.</p><p><b>The determinant</b> det A is a number that characterises a square matrix. It is zero ⇔ the matrix is not invertible (the rows are linearly dependent). A unique solution of Ax = b is guaranteed if det A ≠ 0.</p>"}, {"k": "formula", "h": "Determinant and rank: formulas", "b": "<table class=\"sym\"><tr><td>det(AB) = det A · det B</td><td>the determinant of a product</td></tr><tr><td>det(λA) = λⁿ det A</td><td>for an n×n matrix</td></tr><tr><td>swapping rows</td><td>changes the sign of det</td></tr><tr><td>A⁻¹ = adj(A) / det A</td><td>the inverse exists ⇔ det A ≠ 0</td></tr><tr><td>Laplace O(n!), Gauss O(n³)</td><td>the complexity of computing det</td></tr><tr><td>rank A</td><td>the maximal order of a non-zero minor = the number of independent rows = the number of pivots after Gaussian elimination</td></tr><tr><td>Kronecker</td><td>the rank is found by \"bordering\" minors: a non-zero minor + checking the bordering ones</td></tr></table>"}, {"k": "proof", "h": "The Rouché–Capelli theorem and Gaussian elimination", "b": "<p><b>Theorem.</b> The system Ax = b (n unknowns) is consistent ⇔ rank A = rank[A | b].</p><ul class=\"big\"><li>rank A &lt; rank[A | b]: the vector b is not expressed through the columns of A, <b>no solutions</b>.</li><li>rank A = rank[A | b] = n: <b>exactly one solution</b>.</li><li>rank A = rank[A | b] = r &lt; n: <b>infinitely many solutions</b>, n − r free parameters (∞<sup>n−r</sup>).</li></ul><p><b>Gaussian elimination:</b> with elementary row operations (add a multiple of one row to another, swap, multiply by a number) we bring [A | b] to row echelon form; then back substitution from the bottom up. Complexity O(n³). The rank = the number of non-zero rows after reduction.</p><p><b>Cramer's rule:</b> xᵢ = det Aᵢ / det A, where Aᵢ is the matrix A with the i-th column replaced by b. Suitable for small n (expensive for large ones).</p>"}, {"k": "num", "h": "Numbers", "b": "<p><b>Cramer:</b> x + y = 3, 2x − y = 0. det A = 1·(−1) − 1·2 = −3. det A₁ (the column x replaced by b = (3, 0)) = 3·(−1) − 1·0 = −3, so x = −3/−3 = <b>1</b>. det A₂ (the column y replaced) = 1·0 − 3·2 = −6, so y = −6/−3 = <b>2</b>. Check: 1 + 2 = 3, 2·1 − 2 = 0.</p><p><b>Rank:</b> the matrix [[1,2,3],[2,4,6],[1,0,1]]: the second row = 2·the first, so the rows are dependent, det = 0, the rank = <b>2</b>.</p><p><b>Rouché–Capelli:</b> x + y = 1 and 2x + 2y = 3: rank A = 1, rank[A | b] = 2, <b>no solutions</b>. And x + y = 1, 2x + 2y = 2: both ranks are 1 &lt; 2 = n, the solutions are ∞¹ (x = 1 − y, any y).</p>"}, {"k": "quiz", "q": "rank A = 2, rank[A|b] = 3. What about the system?", "o": ["no solutions", "one solution", "infinitely many", "cannot say"], "a": 0, "why": "rank A ≠ rank[A|b]: the system is inconsistent."}, {"k": "quiz", "q": "n = 4 unknowns, rank A = rank[A|b] = 3. How many solutions?", "o": ["∞¹ (one free parameter)", "one", "none", "∞⁴"], "a": 0, "why": "n − r = 4 − 3 = 1 free parameter."}, {"k": "note", "h": "Notebook: model answers to the questions", "b": "<div class=\"nb\"><div class=\"hd\">Q: Rouché–Capelli theorem</div><div class=\"ln\"><div class=\"fm\">Ax = b is consistent ⇔ rank A = rank[A | b]</div></div><div class=\"ln\"><div class=\"fm\">rank = n  ⇒  one solution;  rank = r &lt; n  ⇒  ∞<sup>n−r</sup> solutions</div><div class=\"nt\">n is the number of unknowns</div></div><div class=\"hd\">Q: How to compute the rank</div><div class=\"ln\"><div class=\"fm\">rank = the largest order of a non-zero minor = the number of independent rows</div><div class=\"nt\">Gaussian elimination: the number of non-zero rows in echelon form</div></div><div class=\"ln\"><div class=\"fm\">the method of bordering minors (Kronecker)</div></div><div class=\"hd\">Q: Gaussian elimination and Cramer</div><div class=\"ln\"><div class=\"fm\">Gauss: [A | b] → echelon form by elementary operations, then substitution from the bottom up, O(n³)</div></div><div class=\"ln\"><div class=\"fm\">Cramer: x<sub>i</sub> = <span class=\"fr\"><span>det A<sub>i</sub></span><span>det A</span></span>,  det A ≠ 0</div><div class=\"nt\">A<sub>i</sub>: the i-th column is replaced by b; for small n</div></div></div>"}, {"k": "exam", "h": "Model answers", "b": "<p><b>Rouché–Capelli:</b> Ax = b is consistent iff rank A = rank[A|b]; if the common rank is n there is a unique solution, if r &lt; n there are ∞^(n−r) solutions.</p><p><b>Rank:</b> maximal order of a non-zero minor = number of independent rows = number of pivots after Gaussian elimination.</p><p><b>Gaussian elimination:</b> reduce [A|b] to row echelon form by elementary row operations, then back-substitution, O(n³). <b>Cramer:</b> xᵢ = det Aᵢ/det A, needs det A ≠ 0, practical for small n only.</p>"}], "id": "la1"}, {"title": "12. Vector spaces, norms, Gram–Schmidt", "goal": "Independence, basis, dimension, norms, the inner product, orthogonalisation.", "part": "Part 3 · Linear algebra and PCA", "cards": [{"k": "story", "h": "The basic concepts in plain words", "b": "<ul class=\"big\"><li><b>Linear independence:</b> the vectors v₁…v_k are independent if Σλᵢvᵢ = 0 implies that all λᵢ = 0. No vector is expressed through the others.</li><li><b>Basis:</b> an independent system through which any vector of the space is expressed. <b>Dimension</b> = the number of vectors in a basis (in ℝⁿ it is n).</li><li><b>Subspace:</b> must contain 0 and be closed under addition and multiplication by a number. The sum and intersection of subspaces are subspaces, the union is not.</li><li><b>Grassmann's formula:</b> dim(U + V) = dim U + dim V − dim(U ∩ V).</li></ul>"}, {"k": "formula", "h": "The inner product and norms", "b": "<table class=\"sym\"><tr><td>u·v = Σuᵢvᵢ</td><td>the inner product (a symmetric positive definite bilinear form)</td></tr><tr><td>|u·v| ≤ ‖u‖·‖v‖</td><td>the Cauchy–Schwarz inequality</td></tr><tr><td>‖v‖ₚ = (Σ|vᵢ|ᵖ)^(1/p), p ≥ 1</td><td>the Lₚ norm: p = 1 sum of absolute values, p = 2 Euclidean, p → ∞ maximum</td></tr><tr><td>norm</td><td>‖v‖ ≥ 0, ‖v‖ = 0 ⇔ v = 0, ‖λv‖ = |λ|‖v‖, ‖u + v‖ ≤ ‖u‖ + ‖v‖</td></tr><tr><td>matrix norms</td><td>‖A‖₁ = the max over columns of Σ|aᵢⱼ|, ‖A‖∞ = the max over rows, Frobenius ‖A‖_F = √(Σaᵢⱼ²)</td></tr><tr><td>d(x,y) = ‖x − y‖</td><td>every norm generates a distance</td></tr></table>"}, {"k": "proof", "h": "The Gram–Schmidt process", "b": "<p>Goal: from independent v₁, …, v_k build an <b>orthonormal</b> basis e₁, …, e_k (pairwise perpendicular vectors of length 1).</p><ol class=\"big\"><li>e₁ = v₁ / ‖v₁‖.</li><li>u₂ = v₂ − (v₂·e₁)e₁: we subtract from v₂ its projection onto e₁ (what remains is perpendicular to e₁). Then e₂ = u₂ / ‖u₂‖.</li><li>u_j = v_j − Σ_{i&lt;j}(v_j·eᵢ)eᵢ, e_j = u_j / ‖u_j‖.</li></ol><p><b>Why it works:</b> check u₂ ⟂ e₁: u₂·e₁ = v₂·e₁ − (v₂·e₁)(e₁·e₁) = v₂·e₁ − v₂·e₁ = 0, since e₁·e₁ = 1.</p>"}, {"k": "num", "h": "Numbers", "b": "<p><b>Norms:</b> v = (3, −4). L₁ = 3 + 4 = 7; L₂ = √(9 + 16) = 5; L∞ = max(3, 4) = 4.</p><p><b>Gram–Schmidt:</b> v₁ = (1, 1, 0), v₂ = (1, 0, 1). ‖v₁‖ = √2, e₁ = (1/√2, 1/√2, 0). v₂·e₁ = 1/√2. u₂ = v₂ − (1/√2)·e₁ = (1,0,1) − (1/2, 1/2, 0) = (1/2, −1/2, 1). ‖u₂‖ = √(1/4 + 1/4 + 1) = √1.5 = 1.2247. e₂ = (0.408, −0.408, 0.816). Check: e₁·e₂ = (0.408 − 0.408)/√2 + 0 = 0.</p><p><b>Dimension:</b> U = span{(1,0,0), (0,1,0)}, V = span{(0,1,0), (0,0,1)} in ℝ³. dim U = dim V = 2, U ∩ V = span{(0,1,0)} (dim 1), so dim(U + V) = 2 + 2 − 1 = 3.</p>"}, {"k": "quiz", "q": "Vectors (1,2) and (2,4). Are they independent?", "o": ["no, the second = 2·the first", "yes", "depends on the basis", "cannot say"], "a": 0, "why": "2·(1,2) = (2,4), so a linear combination gives 0 with non-zero coefficients."}, {"k": "quiz", "q": "dim U = 3, dim V = 4, dim(U∩V) = 2. What is dim(U+V)?", "o": ["5", "7", "9", "6"], "a": 0, "why": "Grassmann: 3 + 4 − 2 = 5."}, {"k": "note", "h": "Notebook: model answers to the questions", "b": "<div class=\"nb\"><div class=\"hd\">Q: Linear independence, basis, dimension</div><div class=\"ln\"><div class=\"fm\">Σλ<sub>i</sub>v<sub>i</sub> = 0 ⇒ all λ<sub>i</sub> = 0</div><div class=\"nt\">independence</div></div><div class=\"ln\"><div class=\"fm\">basis: an independent system that spans the space; dim = the number of basis vectors</div></div><div class=\"ln\"><div class=\"fm\">dim(U + V) = dim U + dim V − dim(U ∩ V)</div><div class=\"nt\">Grassmann's formula</div></div><div class=\"hd\">Q: What is a norm</div><div class=\"ln\"><div class=\"fm\">‖v‖ ≥ 0;  ‖v‖ = 0 ⇔ v = 0;  ‖λv‖ = |λ|‖v‖;  ‖u + v‖ ≤ ‖u‖ + ‖v‖</div><div class=\"nt\">axioms</div></div><div class=\"ln\"><div class=\"fm\">‖v‖<sub>p</sub> = (Σ|v<sub>i</sub>|<sup>p</sup>)<sup>1/p</sup>:  L₁, L₂, L∞;  matrix: ‖A‖₁, ‖A‖∞, Frobenius</div><div class=\"nt\">example v = (3, −4): 7, 5, 4</div></div><div class=\"hd\">Q: Gram–Schmidt</div><div class=\"ln\"><div class=\"fm\">e₁ = v₁ / ‖v₁‖</div><div class=\"nt\">normalise the first</div></div><div class=\"ln\"><div class=\"fm\">u<sub>j</sub> = v<sub>j</sub> − Σ<sub>i&lt;j</sub> (v<sub>j</sub>·e<sub>i</sub>) e<sub>i</sub>,   e<sub>j</sub> = u<sub>j</sub> / ‖u<sub>j</sub>‖</div><div class=\"nt\">subtract the projections and normalise</div></div><div class=\"ln\"><div class=\"fm\">result: an orthonormal basis</div><div class=\"nt\">u₂·e₁ = v₂·e₁ − v₂·e₁ = 0</div></div></div>"}, {"k": "exam", "h": "Model answers", "b": "<p><b>Linear independence:</b> Σλᵢvᵢ = 0 ⇒ all λᵢ = 0. <b>Basis:</b> independent spanning set; <b>dimension</b> = number of basis vectors.</p><p><b>Norm:</b> function with ‖v‖ ≥ 0, ‖v‖ = 0 ⇔ v = 0, ‖λv‖ = |λ|‖v‖, triangle inequality. Examples: L₁, L₂ (Euclidean), L∞ (max), Lₚ; matrix norms ‖A‖₁, ‖A‖∞, Frobenius.</p><p><b>Gram–Schmidt:</b> e₁ = v₁/‖v₁‖; uⱼ = vⱼ − Σ(vⱼ·eᵢ)eᵢ, eⱼ = uⱼ/‖uⱼ‖: subtract projections on previous vectors and normalise, giving an orthonormal basis.</p>"}], "id": "la2"}, {"title": "13. Eigenvalues, diagonalisation, quadratic forms", "goal": "Av = λv, the characteristic equation, diagonalisability, definiteness.", "part": "Part 3 · Linear algebra and PCA", "cards": [{"k": "story", "h": "The idea", "b": "<p>A matrix A acts on a vector as a transformation: it rotates and stretches. But most matrices have special directions in which a vector is <b>only stretched</b> (without changing direction): Av = λv. Such a v is called an <b>eigenvector</b>, and the factor λ is the <b>eigenvalue</b>.</p><p>This is the basis of PCA (the principal directions are eigenvectors of the covariance matrix), of studying the Hessian (minimum or not) and of the convergence speed of gradient descent (through λ_min and λ_max).</p>"}, {"k": "note", "h": "Notebook: how to find eigenvalues", "b": "<div class=\"nb\"><div class=\"hd\">Definition</div><div class=\"ln\"><div class=\"fm\">A v = λ v,   v ≠ 0</div><div class=\"nt\">v is an eigenvector, λ is an eigenvalue</div></div><div class=\"ln\"><div class=\"fm\">(A − λI) v = 0</div><div class=\"nt\">moved λv to the left</div></div><div class=\"hd\">The characteristic equation</div><div class=\"ln\"><div class=\"fm\">a non-trivial v exists ⇔ (A − λI) is singular</div><div class=\"nt\">otherwise the only solution is v = 0</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">det(A − λI) = 0</span></div><div class=\"nt\">a polynomial of degree n in λ</div></div><div class=\"hd\">Link with the matrix</div><div class=\"ln\"><div class=\"fm\">det A = λ₁·λ₂·…·λₙ</div><div class=\"nt\">the product of the eigenvalues</div></div><div class=\"ln\"><div class=\"fm\">tr A = λ₁ + λ₂ + … + λₙ</div><div class=\"nt\">the sum of the diagonal = the sum of the eigenvalues</div></div><div class=\"hd\">Diagonalisation</div><div class=\"ln\"><div class=\"fm\">A = P Λ P⁻¹</div><div class=\"nt\">the columns of P are eigenvectors, Λ is the diagonal of λ</div></div><div class=\"ln\"><div class=\"fm\">symmetric A:  A = Q Λ Qᵀ</div><div class=\"nt\">Q is orthogonal, λ are real</div></div></div>"}, {"k": "formula", "h": "Multiplicities, diagonalisability, forms", "b": "<table class=\"sym\"><tr><td>algebraic multiplicity μₐ</td><td>the multiplicity of λ as a root of the characteristic polynomial</td></tr><tr><td>geometric multiplicity μ_g</td><td>n − rank(A − λI): the dimension of the eigenspace; 1 ≤ μ_g ≤ μₐ</td></tr><tr><td>diagonalisable ⇔</td><td>all λ are real, Σμₐ = n and μₐ = μ_g for every λ</td></tr><tr><td>quadratic form q = xᵀAx</td><td>positive definite (PD) ⇔ all λ &gt; 0 ⇔ all leading principal minors &gt; 0 (Sylvester)</td></tr><tr><td>PSD ⪰ 0 / ND / indefinite</td><td>λ ≥ 0 / all λ &lt; 0 / λ of different signs</td></tr></table>"}, {"k": "num", "h": "Numbers", "b": "<p>A = [[2,1],[1,2]]. The characteristic equation: det(A − λI) = (2−λ)² − 1 = λ² − 4λ + 3 = 0, the roots <b>λ = 3 and λ = 1</b>. Check: the product 3·1 = 3 = det A = 4 − 1; the sum 3 + 1 = 4 = tr A.</p><p>The vector for λ = 3: (A − 3I)v = [[−1,1],[1,−1]]v = 0 ⇒ v = (1, 1). For λ = 1: [[1,1],[1,1]]v = 0 ⇒ v = (1, −1). They are perpendicular (a symmetric matrix). Diagonalisation: A = QΛQᵀ, Λ = diag(3, 1).</p><p><b>Not diagonalisable:</b> A = [[1,1],[0,1]]: λ = 1 twice (μₐ = 2), but rank(A − I) = 1, μ_g = 2 − 1 = 1 &lt; μₐ.</p><p><b>Definiteness:</b> f(x,y) = x² + 3y² has the matrix diag(1,3) → λ = 1, 3 &gt; 0, the form is positive definite. For [[1,2],[2,1]]: λ = 3 and −1, indefinite (a saddle).</p>"}, {"k": "quiz", "q": "A = [[2,1],[1,2]]. What are the eigenvalues?", "o": ["3 and 1", "2 and 1", "4 and 0", "3 and 3"], "a": 0, "why": "λ² − 4λ + 3 = 0."}, {"k": "quiz", "q": "A quadratic form with λ = 3 and −1. What is it?", "o": ["indefinite", "positive definite", "negative definite", "zero"], "a": 0, "why": "The eigenvalues have different signs."}, {"k": "note", "h": "Notebook: model answers to the questions", "b": "<div class=\"nb\"><div class=\"hd\">Q: Eigenvalues and eigenvectors</div><div class=\"ln\"><div class=\"fm\">A v = λ v,  v ≠ 0</div><div class=\"nt\">an eigenpair</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">det(A − λI) = 0</span>  then  (A − λI)v = 0</div><div class=\"nt\">the characteristic equation, then the vectors</div></div><div class=\"ln\"><div class=\"fm\">det A = Πλ<sub>i</sub>,   tr A = Σλ<sub>i</sub></div><div class=\"nt\">check</div></div><div class=\"hd\">Q: When is a matrix diagonalisable</div><div class=\"ln\"><div class=\"fm\">all λ are real and μ<sub>a</sub> = μ<sub>g</sub> for every λ, Σμ<sub>a</sub> = n</div><div class=\"nt\">A = PΛP⁻¹</div></div><div class=\"ln\"><div class=\"fm\">a symmetric matrix always: A = QΛQᵀ, Q is orthogonal</div></div><div class=\"hd\">Q: Definiteness of a quadratic form</div><div class=\"ln\"><div class=\"fm\">q = xᵀAx is positive definite ⇔ all λ &gt; 0 ⇔ all leading principal minors &gt; 0 (Sylvester)</div></div><div class=\"ln\"><div class=\"fm\">λ ≥ 0 is PSD;  λ &lt; 0 is ND;  different signs is indefinite (a saddle)</div></div></div>"}, {"k": "exam", "h": "Model answers", "b": "<p><b>Eigenvalues/eigenvectors:</b> Av = λv, v ≠ 0. Compute λ from det(A − λI) = 0 (characteristic polynomial), then solve (A − λI)v = 0 for eigenvectors. det A = Πλᵢ, tr A = Σλᵢ.</p><p><b>Diagonalisable:</b> all eigenvalues real, algebraic multiplicities sum to n and equal geometric multiplicities (μₐ = μ_g); then A = PΛP⁻¹. Symmetric matrices are always diagonalisable with orthogonal Q: A = QΛQᵀ.</p><p><b>Definiteness of quadratic form xᵀAx:</b> positive definite iff all eigenvalues &gt; 0 (equivalently all leading principal minors &gt; 0, Sylvester); indefinite iff eigenvalues of both signs.</p>"}], "id": "la3"}, {"id": "pca", "title": "14. PCA", "goal": "Principal components: what they are, how to compute them and why they are eigenvectors.", "cards": [{"k": "story", "h": "The idea", "b": "<p>The data live in many dimensions, but in reality they are \"stretched\" along a few directions. PCA (Principal Component Analysis) finds new axes: the first axis goes in the direction of <b>the largest spread</b>, the second is perpendicular to it and takes the largest remaining spread, and so on. If the first few axes explain almost all the variability, the rest can be dropped: fewer dimensions, almost no loss.</p>\n <p><b>The algorithm:</b> 1) centre the data (subtract the mean of each column; with different units also divide by the standard deviation); 2) the covariance matrix C = XᵀX/(N−1); 3) the eigenvalues λ and eigenvectors v of C; 4) sort by decreasing λ; 5) the projections (scores) T = X V.</p>"}, {"k": "num", "h": "Numbers: 4 points in 2D", "b": "<p>Points (1,2), (2,3), (3,5), (4,6). Means (2.5; 4). Centred: (−1.5,−2), (−0.5,−1), (0.5,1), (1.5,2).</p>\n <pre class=\"code\">C = [ 1.667  2.333 ]    (var x = 1.667, var y = 3.333, cov = 2.333)\n    [ 2.333  3.333 ]</pre>\n <p>Eigenvalues: <b>λ₁ = 4.978, λ₂ = 0.022</b> (check: the sum 5.0 = trace of C = 1.667 + 3.333). The eigenvector for λ₁: <b>v₁ = (0.576; 0.817)</b>. The share of variance explained by the first component: 4.978/5.0 = <b>99.5%</b>: the points lie almost on one line. Scores (the position along PC1): −2.50; −1.11; 1.11; 2.50.</p>\n <p>How to find λ by hand: det(C − λI) = 0 ⇒ (1.667−λ)(3.333−λ) − 2.333² = 0 ⇒ λ² − 5λ + 0.111 = 0 ⇒ λ = (5 ± √(25−0.444))/2 = 4.978 or 0.022.</p>"}, {"k": "proof", "h": "Derivation: the principal components = the eigenvectors of the covariance matrix", "b": "<ol class=\"big\"><li>The projection of the centred data onto a unit vector w (‖w‖ = 1): z = Xw. Its variance: Var(z) = (1/(N−1))‖Xw‖² = wᵀ[XᵀX/(N−1)]w = <b>wᵀCw</b>.</li>\n <li>We maximise wᵀCw subject to wᵀw = 1. The Lagrangian: L = wᵀCw − λ(wᵀw − 1).</li>\n <li>dL/dw = 2Cw − 2λw = 0 ⇒ <b>Cw = λw</b>: w is an eigenvector of C.</li>\n <li>Then the variance wᵀCw = wᵀλw = <b>λ</b>. For the variance to be maximal we take the <b>largest λ</b>: this is PC1.</li>\n <li>The next component: we maximise under the additional condition w ⟂ w₁. Since C is symmetric, its eigenvectors are orthogonal, and we get the second largest λ₂, and so on.</li>\n <li><b>Result:</b> the sum of all λ<sub>i</sub> = the trace of C = the total variance, and λ<sub>i</sub>/Σλ is the share of variance explained by the i-th component.</li></ol>\n <p><b>Link with SVD:</b> if the centred X = UΣVᵀ, then the columns of V are the principal directions, and λ<sub>i</sub> = σ<sub>i</sub>²/(N−1); scores T = XV = UΣ.</p>"}, {"k": "formula", "h": "Terms", "b": "<table class=\"sym\"><tr><td>loadings</td><td>components of the eigenvectors v: the \"contribution\" of the original variables to the component</td></tr><tr><td>scores</td><td>coordinates of the observations in the new axes: T = XV</td></tr><tr><td>explained variance</td><td>λ<sub>i</sub>/Σλ, the cumulative share for choosing the number of components (e.g. up to 90–95%)</td></tr><tr><td>scree plot</td><td>plot of λ<sub>i</sub>, we look for the \"elbow\"</td></tr><tr><td>scale</td><td>if the variables are in different units, standardise (then C is the correlation matrix), otherwise PCA will \"see\" only the variable with the largest scale</td></tr></table>"}, {"k": "quiz", "q": "What is the sum of the eigenvalues of the covariance matrix equal to?", "o": ["the trace of the matrix (the total variance)", "the determinant", "zero", "one"], "a": 0, "why": "Σλ = tr(C) = the sum of the variances of the variables."}, {"k": "quiz", "q": "Why is PC1 the eigenvector with the largest λ?", "o": ["the variance of the projection equals λ", "it is just the convention", "it is the longest", "its determinant is maximal"], "a": 0, "why": "Var = wᵀCw = λ for an eigenvector, so the maximum of the variance is the maximum of λ."}, {"k": "note", "h": "Notebook: PCA", "b": "<div class=\"nb\"><div class=\"hd\">The data and the covariance matrix</div><div class=\"ln\"><div class=\"fm\">X is the centred data (the mean subtracted)</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">C = <span class=\"fr\"><span>XᵀX</span><span>N − 1</span></span></span></div><div class=\"nt\">the covariance matrix</div></div><div class=\"hd\">The variance of the projection onto a unit w</div><div class=\"ln\"><div class=\"fm\">z = Xw,   Var(z) = <span class=\"fr\"><span>‖Xw‖²</span><span>N − 1</span></span> = wᵀ C w</div></div><div class=\"hd\">Maximisation (Lagrange)</div><div class=\"ln\"><div class=\"fm\">L(w,λ) = wᵀCw − λ(wᵀw − 1)</div></div><div class=\"ln\"><div class=\"fm\">dL/dw = 2Cw − 2λw = 0</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">C w = λ w</span></div><div class=\"nt\">w is an eigenvector of C</div></div><div class=\"ln\"><div class=\"fm\">Var = wᵀCw = λ</div><div class=\"nt\">the maximum of the variance = the largest λ ⇒ PC1</div></div><div class=\"hd\">Result</div><div class=\"ln\"><div class=\"fm\">the share of the i-th component = <span class=\"fr\"><span>λ<sub>i</sub></span><span>Σ λ<sub>j</sub></span></span></div><div class=\"nt\"> Σλ = tr(C) is the total variance</div></div><div class=\"ln\"><div class=\"fm\">scores:  T = X V</div></div><div class=\"ln\"><div class=\"fm\">example: λ = 4.978 and 0.022,   <span class=\"fr\"><span>4.978</span><span>5.0</span></span> = 99.5%</div></div></div>"}, {"k": "note", "h": "Notebook: model answers to the questions", "b": "<div class=\"nb\"><div class=\"hd\">Q: PCA algorithm step by step</div><div class=\"ln\"><div class=\"fm\">1. centre (and standardise) the data: X → X − x̄</div></div><div class=\"ln\"><div class=\"fm\">2. the covariance matrix  C = <span class=\"fr\"><span>XᵀX</span><span>N − 1</span></span></div><div class=\"nt\">p×p, symmetric</div></div><div class=\"ln\"><div class=\"fm\">3. eigendecomposition  C = VΛVᵀ,  λ₁ ≥ λ₂ ≥ …</div><div class=\"nt\">the columns of V are the principal directions</div></div><div class=\"ln\"><div class=\"fm\">4. keep k vectors W<sub>k</sub> and project  Z = X·W<sub>k</sub></div><div class=\"nt\">the new coordinates are the principal components</div></div><div class=\"hd\">Q: How many components to keep</div><div class=\"ln\"><div class=\"fm\">the share of explained variance  <span class=\"fr\"><span>λ₁ + … + λ<sub>k</sub></span><span>λ₁ + … + λ<sub>p</sub></span></span> ≥ 90–95%</div><div class=\"nt\">cumulative</div></div><div class=\"ln\"><div class=\"fm\">scree plot: the \"elbow\"; the Kaiser criterion: λ &gt; the mean</div></div><div class=\"hd\">Q: Limitations of PCA</div><div class=\"ln\"><div class=\"fm\">linear; sensitive to the scale of the features and to outliers</div><div class=\"nt\">we standardise</div></div><div class=\"ln\"><div class=\"fm\">large variance ≠ importance for the task; the components are hard to interpret</div></div></div>"}, {"k": "exam", "h": "Answer \"PCA\"", "b": "<ol class=\"big\"><li>Goal: reduce the dimension while keeping the variance.</li><li>Steps: centring/standardisation, C, eigenvalues and eigenvectors, sorting.</li><li>Derivation via Lagrange: Cw = λw.</li><li>The explained variance λ<sub>i</sub>/Σλ, the choice of the number of components (scree, cumulative share).</li><li>A numerical 2D example and the link with SVD.</li></ol>"}, {"k": "exam", "h": "Model answer (this is how you can write in the exam)", "b": "<p><b>PCA</b> is linear dimension reduction: new orthogonal axes (principal components) ordered by decreasing explained variance.</p>\n<p><b>The algorithm:</b> centre (and standardise if necessary) the data; C = XᵀX/(N−1); find the eigenpairs Cv = λv; order λ<sub>1</sub> ≥ λ<sub>2</sub> ≥ …; scores T = XV; keep the first k components (by the share Σλ<sub>i</sub>/Σλ or the scree plot).</p>\n<p><b>Derivation:</b> the variance of the projection onto a unit w equals wᵀCw. Maximise under wᵀw = 1 (Lagrange): Cw = λw, the value of the variance = λ ⇒ PC1 is the eigenvector with the largest λ; the next ones are orthogonal. Σλ = tr(C) is the total variance. Equivalently SVD: X = UΣVᵀ, λ = σ²/(N−1).</p>\n<p><b>Example:</b> points (1,2),(2,3),(3,5),(4,6): λ = 4.978 and 0.022, PC1 explains 99.5%.</p>"}], "part": "Part 3 · Linear algebra and PCA"}, {"title": "15. Metrics and distances", "goal": "What a distance is and which ones exist for vectors, sets, strings and texts.", "part": "Part 4 · Clustering", "cards": [{"k": "story", "h": "Why", "b": "<p>Any clustering begins with the question \"how similar are two objects\". <b>A metric</b> d(x,y) is a distance satisfying the axioms: 1) d ≥ 0; 2) d = 0 ⇔ x = y; 3) symmetry d(x,y) = d(y,x); 4) the triangle inequality d(x,z) ≤ d(x,y) + d(y,z). Without axiom 2 it is a pseudometric, without symmetry a quasimetric, without the triangle inequality a semimetric. Any norm gives a metric d = ‖x − y‖.</p><p>The choice of metric strongly affects the clustering result.</p>"}, {"k": "formula", "h": "Distances for vectors, sets and strings", "b": "<table class=\"sym\"><tr><td>L₁ (Manhattan)</td><td>Σ|xᵢ − yᵢ|</td></tr><tr><td>L₂ (Euclid)</td><td>√Σ(xᵢ − yᵢ)²; the only Lₚ that is invariant to rotations</td></tr><tr><td>L∞ (Chebyshev)</td><td>max|xᵢ − yᵢ|</td></tr><tr><td>Hamming</td><td>the number of positions where the values differ</td></tr><tr><td>Mahalanobis</td><td>√((x − y)ᵀ Σ⁻¹ (x − y)), accounts for correlations and the scales of features</td></tr><tr><td>cosine</td><td>1 − cos θ = 1 − x·y/(‖x‖‖y‖); not a metric (no triangle inequality), values [0, 2]; the angular distance [0, π] is a metric</td></tr><tr><td>Jaccard</td><td>1 − |A ∩ B| / |A ∪ B| for sets</td></tr><tr><td>Hausdorff</td><td>max( sup_a inf_b d(a,b), sup_b inf_a d(a,b) ) between sets</td></tr><tr><td>strings</td><td>Levenshtein (insertion, deletion, substitution), Hamming, LCS, Damerau–Levenshtein (+ transposition of neighbours)</td></tr><tr><td>texts</td><td>bag-of-words + cosine, or k-grams + Jaccard</td></tr></table>"}, {"k": "num", "h": "Numbers", "b": "<p>Points (1, 2) and (4, 6): the differences (3, 4). L₁ = 7, L₂ = √(9 + 16) = <b>5</b>, L∞ = 4.</p><p><b>Jaccard:</b> A = {a, b, c}, B = {b, c, d}. |A ∩ B| = 2, |A ∪ B| = 4, the distance 1 − 2/4 = <b>0.5</b>.</p><p><b>Cosine:</b> x = (1, 0), y = (1, 1): cos θ = 1/√2 = 0.707, the distance 1 − 0.707 = <b>0.293</b>. The cosine distance compares directions, not lengths: (1,1) and (5,5) give distance 0.</p><p><b>Levenshtein:</b> kitten → sitting: k→s, e→i, insert g, in total <b>3</b> operations.</p><p><b>Hamming:</b> 10110 and 11100 differ in positions 2 and 4, the distance is 2.</p>"}, {"k": "quiz", "q": "Which distance is not a metric?", "o": ["cosine (1 − cos θ)", "L₁", "L₂", "Hamming"], "a": 0, "why": "For 1 − cos θ the triangle inequality does not hold."}, {"k": "quiz", "q": "A = {1,2,3}, B = {3,4}. The Jaccard distance?", "o": ["0.75", "0.5", "0.25", "1"], "a": 0, "why": "|A∩B| = 1, |A∪B| = 4, 1 − 1/4 = 0.75."}, {"k": "note", "h": "Notebook: model answers to the questions", "b": "<div class=\"nb\"><div class=\"hd\">Q: Define a metric</div><div class=\"ln\"><div class=\"fm\">d ≥ 0;  d(x,y) = 0 ⇔ x = y;  d(x,y) = d(y,x);  d(x,z) ≤ d(x,y) + d(y,z)</div><div class=\"nt\">the axioms of a metric</div></div><div class=\"ln\"><div class=\"fm\">L₁, L₂, L∞, Hamming, Mahalanobis √((x−y)ᵀΣ⁻¹(x−y))</div><div class=\"nt\">examples; the cosine 1 − cos θ is not a metric</div></div><div class=\"hd\">Q: Hausdorff distance</div><div class=\"ln\"><div class=\"fm\">d<sub>H</sub>(A,B) = max( sup<sub>a∈A</sub> inf<sub>b∈B</sub> d(a,b),  sup<sub>b∈B</sub> inf<sub>a∈A</sub> d(a,b) )</div><div class=\"nt\">the distance between sets: how far the worst point is from the other set</div></div><div class=\"hd\">Q: Distances for strings and texts</div><div class=\"ln\"><div class=\"fm\">Hamming (equal length), Levenshtein (insertion, deletion, substitution), LCS, Damerau–Levenshtein</div><div class=\"nt\">kitten → sitting = 3</div></div><div class=\"ln\"><div class=\"fm\">texts: bag-of-words + cosine, k-grams + Jaccard 1 − |A∩B|/|A∪B|</div></div></div>"}, {"k": "exam", "h": "Model answers", "b": "<p><b>Metric:</b> d ≥ 0; d(x,y) = 0 ⇔ x = y; symmetry; triangle inequality. Examples: Euclidean L₂, Manhattan L₁, Chebyshev L∞, Hamming, Mahalanobis.</p><p><b>Hausdorff distance:</b> distance between two sets, max of the largest distance from points of A to the nearest point of B and vice versa.</p><p><b>Strings:</b> Hamming, Levenshtein (insert/delete/substitute), LCS, Damerau–Levenshtein. <b>Texts:</b> bag-of-words + cosine distance, or k-grams + Jaccard.</p>"}], "id": "dist"}, {"id": "clu", "title": "16. Cluster analysis", "goal": "k-means, hierarchical clustering, DBSCAN, quality evaluation.", "cards": [{"k": "story", "h": "The idea", "b": "<p>Clustering (unsupervised) divides objects into groups so that objects within a group are similar and between groups different. There are no correct answers in advance. Everything begins with the choice of the <b>distance</b> (lecture Similarity): Euclidean √Σ(a<sub>i</sub>−b<sub>i</sub>)², Manhattan Σ|a<sub>i</sub>−b<sub>i</sub>|, cosine and others. The choice of metric affects the result.</p>\n <ul class=\"big\"><li><b>k-means:</b> the number of clusters k is set by the user; each cluster is represented by a centroid (the mean).</li><li><b>Hierarchical (AHC):</b> build a tree of merges (a dendrogram), then \"cut\" it at the desired level.</li><li><b>DBSCAN:</b> clusters = dense regions, noise is singled out; k is not needed.</li><li><b>Fuzzy c-means:</b> an object belongs to several clusters with fractions (degrees of membership).</li></ul>"}, {"k": "num", "h": "Numbers: k-means in 1D, k = 2", "b": "<p>Points 1, 2, 4, 9, 10, 12. Initial centres c₁ = 1, c₂ = 9.</p>\n <table class=\"tbl\"><tr><th>iteration</th><th>assignment (to the nearest)</th><th>new centres</th></tr><tr><td>1</td><td>{1,2,4} → c₁; {9,10,12} → c₂</td><td>c₁ = 7/3 = 2.333; c₂ = 31/3 = 10.333</td></tr><tr><td>2</td><td>the same clusters</td><td>the centres did not change: converged</td></tr></table>\n <p>Objective (SSE) = Σ‖x − c‖² = (1.333²+0.333²+1.667²) + (1.333²+0.333²+1.667²) = 4.667 + 4.667 = <b>9.333</b>.</p>"}, {"k": "proof", "h": "Derivation of k-means: why the centre = the mean and why the algorithm converges", "b": "<p>Goal: minimise J = Σ<sub>j</sub>Σ<sub>x∈C<sub>j</sub></sub>‖x − c<sub>j</sub>‖².</p>\n <ol class=\"big\"><li><b>Assignment step:</b> for fixed centres each point is assigned to the nearest centre. This minimises J over the assignments.</li>\n <li><b>Update step:</b> for fixed clusters dJ/dc<sub>j</sub> = −2Σ<sub>x∈C<sub>j</sub></sub>(x − c<sub>j</sub>) = 0 ⇒ <b>c<sub>j</sub> = (1/|C<sub>j</sub>|)Σx</b>, that is the mean of the points of the cluster (J is convex in c<sub>j</sub>, the second derivative 2|C<sub>j</sub>| &gt; 0, this is a minimum).</li>\n <li>Each of the two steps does not increase J, and the number of partitions is finite, so the algorithm converges in a finite number of steps, but only to a <b>local</b> minimum: the result depends on the initial centres (run several times, k-means++).</li></ol>\n <p><b>Variants from the lecture:</b> k-medians (the median instead of the mean, more robust to outliers), k-medoids (the centre is an actual data point).</p>"}, {"k": "formula", "h": "Hierarchical, DBSCAN, quality", "b": "<table class=\"sym\"><tr><td>AHC: single / complete / average / Ward</td><td>the distance between clusters: minimum / maximum / mean of the pairs / growth of the within-cluster variance. Merging the nearest pairs bottom-up, then cutting the dendrogram.</td></tr>\n <tr><td>DBSCAN (ε, minPts)</td><td>core point: the ε-neighbourhood holds ≥ minPts points; border: in the neighbourhood of a core but not a core itself; the rest is noise. Clusters can have any shape.</td></tr>\n <tr><td>Silhouette s = (b − a)/max(a, b)</td><td>a = the mean distance to the points of its own cluster, b = the mean distance to the nearest other cluster; s ∈ [−1,1], the closer to 1 the better</td></tr>\n <tr><td>Elbow</td><td>plot of SSE against k, we take the \"elbow\"</td></tr></table>\n <p><b>Numbers:</b> in the example above for the point 1: a = (1+3)/2 = 2, b = (8+9+11)/3 = 9.333, s = (9.333 − 2)/9.333 = <b>0.786</b>: the point sits well in its cluster. Single linkage on the same points: first the pairs at distance 1 merge ((1,2) and (9,10)), then 4 with {1,2} and 12 with {9,10} (distance 2), last the two clusters merge at distance 5 (between 4 and 9): on the dendrogram a big jump in height suggests k = 2.</p>"}, {"k": "formula", "h": "Hierarchical clustering (AHC): linkage formulas", "b": "<p>We start with N clusters of one point and at each step merge the two nearest. The \"distance between clusters\" A and B is defined by the linkage:</p><table class=\"sym\"><tr><td>single</td><td>d(A,B) = min d(a,b): the nearest points; prone to \"chains\"</td></tr><tr><td>complete</td><td>d(A,B) = max d(a,b): the farthest points; compact balls</td></tr><tr><td>UPGMA (average)</td><td>d(A,B) = the mean of all pairwise d(a,b)</td></tr><tr><td>WPGMA</td><td>d(A∪B, C) = (d(A,C) + d(B,C))/2: equally regardless of size</td></tr><tr><td>centroid</td><td>the distance between centroids (inversions on the dendrogram are possible)</td></tr><tr><td>Ward</td><td>merge the pair that gives the smallest increase of the within-cluster sum of squares</td></tr></table><p><b>Dendrogram</b> is the tree of merges, height = merge distance; cutting it at the desired height we get clusters. <b>Cophenetic correlation</b> is the correlation between the original distances and the distances on the dendrogram: the closer to 1, the better the tree preserves the structure.</p>"}, {"k": "num", "h": "Numbers: single and complete", "b": "<p>Points on a line: 1, 2, 6, 7, 15. Step 1: the nearest pair (1,2) at distance 1 (and (6,7)). We merge {1,2}, {6,7}. Next: single: d({1,2},{6,7}) = min = 6 − 2 = 4; complete: max = 7 − 1 = 6. The point 15 from {6,7}: single 8, complete 9. The merge {1,2}+{6,7} happens at height 4 (single) or 6 (complete), and only then 15 joins.</p>"}, {"k": "formula", "h": "DBSCAN, fuzzy c-means and quality evaluation", "b": "<table class=\"sym\"><tr><td>DBSCAN (ε, minPts)</td><td>a core point: its ε-neighbourhood holds ≥ minPts points; border
