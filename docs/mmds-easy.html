т не равен нулю.</p>"}, {"k": "proof", "h": "Вывод 2: условие сходимости и скорость для квадратичной f", "b": "<p>Возьмём f(x) = ½xᵀAx − bᵀx с симметричной положительно определённой A (собственные числа 0 &lt; λ<sub>min</sub> ≤ … ≤ λ<sub>max</sub>). Минимум x*: Ax* = b. Градиент ∇f = Ax − b = A(x − x*).</p>\n <ol class=\"big\"><li>Ошибка e<sub>k</sub> = x<sub>k</sub> − x*. Шаг: e<sub>k+1</sub> = e<sub>k</sub> − tAe<sub>k</sub> = <b>(I − tA)e<sub>k</sub></b>.</li>\n <li>В базисе собственных векторов A компонента ошибки умножается на (1 − tλ<sub>i</sub>) на каждом шаге.</li>\n <li><b>Сходимость</b> ⇔ |1 − tλ<sub>i</sub>| &lt; 1 для всех i ⇔ <b>0 &lt; t &lt; 2/λ<sub>max</sub></b>. (В примере λ<sub>max</sub> = 6, значит t &lt; 1/3: 0.1 подходит, 0.4 нет.)</li>\n <li><b>Лучший шаг:</b> минимизируем max|1 − tλ|: t* = 2/(λ<sub>min</sub> + λ<sub>max</sub>), скорость ‖e<sub>k+1</sub>‖ ≤ ((κ − 1)/(κ + 1))‖e<sub>k</sub>‖, где κ = λ<sub>max</sub>/λ<sub>min</sub> — число обусловленности. Чем более «вытянуты» линии уровня (κ большое), тем медленнее спуск (линейная скорость сходимости).</li></ol>"}, {"k": "proof", "h": "Вывод 3: общий случай, L-гладкость (лемма о спуске)", "b": "<p>Пусть ∇f липшицев с константой L: ‖∇f(x) − ∇f(y)‖ ≤ L‖x − y‖. Тогда f(y) ≤ f(x) + ∇f(x)ᵀ(y−x) + (L/2)‖y−x‖². Подставляем y = x − t∇f(x):</p>\n <p><b>f(x − t∇f) ≤ f(x) − t(1 − Lt/2)‖∇f(x)‖²</b>.</p>\n <p>При t ≤ 1/L получаем f(x<sub>k+1</sub>) ≤ f(x<sub>k</sub>) − (t/2)‖∇f(x<sub>k</sub>)‖²: функция убывает на каждом шаге. Для выпуклой f с t = 1/L суммирование даёт f(x<sub>k</sub>) − f* ≤ L‖x<sub>0</sub> − x*‖²/(2k), то есть сублинейная скорость O(1/k); для сильно выпуклой f скорость линейная (геометрическая). Именно «linear or sublinear rates», как сказано на лекции.</p>"}, {"k": "formula", "h": "Резюме и улучшения", "b": "<table class=\"sym\"><tr><td>x<sub>k+1</sub> = x<sub>k</sub> − t∇f(x<sub>k</sub>)</td><td>базовый метод</td></tr><tr><td>выбор t</td><td>фиксированный (t &lt; 2/L), либо line search (Armijo/Wolfe: подбирать t на каждом шаге)</td></tr><tr><td>Heavy ball</td><td>добавляет «инерцию»: x<sub>k+1</sub> = x<sub>k</sub> − t∇f + β(x<sub>k</sub> − x<sub>k−1</sub>), ускоряет на «оврагах»</td></tr><tr><td>Conjugate gradient</td><td>для квадратичных f: сопряжённые направления, не больше n шагов</td></tr><tr><td>Критерий остановки</td><td>‖∇f‖ мало или f почти не меняется</td></tr></table>"}, {"k": "quiz", "q": "Почему шаг делается по −∇f?", "o": ["это направление наискорейшего убывания", "так проще считать", "это направление к максимуму", "так требует Ньютон"], "a": 0, "why": "Из Тейлора и неравенства Коши–Буняковского."}, {"k": "quiz", "q": "f = x² + 3y², λ_max = 6. При каком t гарантированно сходится?", "o": ["t < 1/3", "t < 3", "t = 1", "любой t"], "a": 0, "why": "0 < t < 2/λ_max = 1/3."}, {"k": "note", "h": "Тетрадь: градиентный спуск", "b": "<div class=\"nb\"><div class=\"hd\">Шаг</div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">x<sub>k+1</sub> = x<sub>k</sub> − t·∇f(x<sub>k</sub>)</span></div><div class=\"nt\">t — длина шага</div></div><div class=\"hd\">Почему −∇f</div><div class=\"ln\"><div class=\"fm\">f(x+d) ≈ f(x) + ∇f(x)ᵀ d</div><div class=\"nt\">Тейлор 1-го порядка</div></div><div class=\"ln\"><div class=\"fm\">∇fᵀd ≥ −‖∇f‖·‖d‖</div><div class=\"nt\">Коши–Буняковский</div></div><div class=\"ln\"><div class=\"fm\">равенство при  d = − <span class=\"fr\"><span>∇f</span><span>‖∇f‖</span></span></div><div class=\"nt\">антиградиент — самое быстрое убывание</div></div><div class=\"hd\">Квадратичная f(x) = ½xᵀAx − bᵀx</div><div class=\"ln\"><div class=\"fm\">∇f = Ax − b = A(x − x*)</div></div><div class=\"ln\"><div class=\"fm\">e<sub>k+1</sub> = (I − tA) e<sub>k</sub></div><div class=\"nt\">e = x − x*</div></div><div class=\"ln\"><div class=\"fm\">сходится ⇔ |1 − tλ<sub>i</sub>| &lt; 1 ⇔ 0 &lt; t &lt; <span class=\"fr\"><span>2</span><span>λ<sub>max</sub></span></span></div></div><div class=\"ln\"><div class=\"fm\">лучший шаг  t* = <span class=\"fr\"><span>2</span><span>λ<sub>min</sub>+λ<sub>max</sub></span></span>,   скорость  <span class=\"fr\"><span>κ−1</span><span>κ+1</span></span>,   κ = <span class=\"fr\"><span>λ<sub>max</sub></span><span>λ<sub>min</sub></span></span></div></div><div class=\"hd\">Общий случай (L-гладкость)</div><div class=\"ln\"><div class=\"fm\">f(x − t∇f) ≤ f(x) − t(1 − Lt/2)‖∇f‖²</div><div class=\"nt\">при t ≤ 1/L функция убывает</div></div></div>"}, {"k": "note", "h": "Тетрадь: эталонные ответы на вопросы", "b": "<div class=\"nb\"><div class=\"hd\">Q: Gradient descent</div><div class=\"ln\"><div class=\"fm\">x<sub>k+1</sub> = x<sub>k</sub> − t·∇f(x<sub>k</sub>)</div><div class=\"nt\">t — шаг (learning rate)</div></div><div class=\"ln\"><div class=\"fm\">почему −∇f: f(x + d) ≈ f(x) + ∇fᵀd, минимум при d = −∇f/‖∇f‖</div><div class=\"nt\">направление наискорейшего спуска</div></div><div class=\"ln\"><div class=\"fm\">для квадратичной f условие сходимости: 0 &lt; t &lt; 2/λ<sub>max</sub></div><div class=\"nt\">при t = 1/L гарантированное убывание</div></div></div>"}, {"k": "exam", "h": "Ответ «Gradient descent»", "b": "<ol class=\"big\"><li>Цель: min f(x), итерация x<sub>k+1</sub> = x<sub>k</sub> − t∇f(x<sub>k</sub>).</li><li>Вывод: Тейлор + направление наискорейшего убывания.</li><li>Выбор шага: условие t &lt; 2/L, line search.</li><li>Скорость: линейная при сильной выпуклости (κ), O(1/k) иначе.</li><li>Минусы: медленно при плохой обусловленности; улучшения: heavy ball, CG, Newton.</li></ol>"}, {"k": "exam", "h": "Эталонный ответ (так можно писать на экзамене)", "b": "<p><b>Gradient descent</b> — итерационный метод минимизации дифференцируемой f: <b>x<sub>k+1</sub> = x<sub>k</sub> − t·∇f(x<sub>k</sub>)</b>, t &gt; 0 — длина шага.</p>\n<p><b>Вывод:</b> f(x+d) ≈ f(x) + ∇fᵀd; по неравенству Коши–Буняковского ∇fᵀd ≥ −‖∇f‖‖d‖ с равенством при d = −∇f/‖∇f‖, значит антиградиент — направление наискорейшего убывания.</p>\n<p><b>Сходимость:</b> для квадратичной f ошибка умножается на (I − tA), сходимость при 0 &lt; t &lt; 2/λ<sub>max</sub>; скорость линейная с множителем (κ−1)/(κ+1), κ = λ<sub>max</sub>/λ<sub>min</sub>. Для L-гладкой выпуклой f при t = 1/L: f(x<sub>k</sub>) − f* ≤ L‖x<sub>0</sub>−x*‖²/(2k) (сублинейно).</p>\n<p><b>Улучшения:</b> line search (Wolfe), heavy ball, conjugate gradient, метод Ньютона.</p>"}], "part": "Часть 5 · Оптимизация"}, {"title": "19. Общая схема спуска и поиск шага (Вольфе, backtracking)", "goal": "Как выбирать направление и длину шага: точный поиск, условия Армихо, Вольфе, Гольдштейна.", "part": "Часть 5 · Оптимизация", "cards": [{"k": "story", "h": "Общая схема", "b": "<p>Почти все методы оптимизации делают одно и то же: из точки xₖ выбирают <b>направление</b> dₖ и <b>длину шага</b> αₖ, и идут в xₖ₊₁ = xₖ + αₖdₖ. Направление должно быть <b>направлением спуска</b>: ∇f(xₖ)ᵀdₖ &lt; 0 (функция сначала убывает). Все методы можно записать как dₖ = −B⁻¹∇f: при B = I получаем градиентный спуск, при B = H (гессиан) метод Ньютона.</p><p><b>Почему −∇f — наискорейший спуск:</b> среди единичных направлений d значение ∇fᵀd минимально при d = −∇f/‖∇f‖ (неравенство Коши–Шварца: ∇fᵀd ≥ −‖∇f‖‖d‖). Останавливаемся, когда ‖∇f‖ ≤ ε.</p>"}, {"k": "formula", "h": "Выбор шага α: что значит «достаточно хорошо»", "b": "<p>Обозначим φ(α) = f(xₖ + αdₖ) — функцию одной переменной α. Нужно подобрать α.</p><table class=\"sym\"><tr><td>точный поиск</td><td>α = argmin φ(α). Для квадратичной f = ½xᵀPx − bᵀx: α = ‖g‖²/(gᵀPg), где g = ∇f. Даёт зигзаг на вытянутых функциях; на практике дорог</td></tr><tr><td>условие Армихо (достаточное убывание)</td><td>f(x + αd) ≤ f(x) + c₁α∇f(x)ᵀd, 0 &lt; c₁ &lt; 1 (обычно 10⁻⁴): график φ ниже прямой с наклоном c₁φ′(0). Исключает слишком длинные шаги</td></tr><tr><td>условие кривизны</td><td>∇f(x + αd)ᵀd ≥ c₂∇f(x)ᵀd, c₁ &lt; c₂ &lt; 1: наклон φ уже не так крут. Исключает слишком короткие шаги</td></tr><tr><td>условия Вольфе</td><td>Армихо + кривизна одновременно</td></tr><tr><td>сильные Вольфе</td><td>Армихо + |∇f(x + αd)ᵀd| ≤ c₂|∇f(x)ᵀd|: производная φ близка к нулю (нужны для нелинейного CG)</td></tr><tr><td>Гольдштейн (0 &lt; c &lt; ½)</td><td>f + (1−c)α∇fᵀd ≤ f(x + αd) ≤ f + cα∇fᵀd; может исключить все минимумы φ</td></tr><tr><td>backtracking</td><td>α := 1 (или α₀), пока не выполнено Армихо: α := bα, b ∈ [0.1, 0.8]. Одного условия хватает, потому что шаг уменьшается постепенно</td></tr></table>"}, {"k": "num", "h": "Числа: backtracking на f(x) = x²", "b": "<p>x = 1, d = −f′(1) = −2, c₁ = 0.1, b = 0.5, α = 1. Проверяем Армихо: f(x + αd) = f(−1) = 1; правая часть f(1) + c₁·α·f′(1)·d = 1 + 0.1·1·2·(−2) = 0.6. 1 ≤ 0.6? Нет, уменьшаем α = 0.5: f(0) = 0; правая часть 1 + 0.1·0.5·2·(−2) = 0.8; 0 ≤ 0.8, принимаем α = 0.5, попали ровно в минимум.</p><p><b>Почему «f уменьшилась» недостаточно:</b> последовательность fₖ = 1 + 1/k убывает, но стремится к 1, а минимум функции может быть 0. Поэтому требуют <i>достаточное</i> убывание пропорционально α∇fᵀd.</p>"}, {"k": "quiz", "q": "Что гарантирует условие кривизны (вторая часть условий Вольфе)?", "o": ["шаг не слишком короткий", "шаг не слишком длинный", "что d — направление спуска", "что f выпукла"], "a": 0, "why": "Армихо запрещает длинные шаги, кривизна запрещает слишком короткие."}, {"k": "quiz", "q": "Backtracking line search использует…", "o": ["только условие Армихо и уменьшение α в b раз", "точную минимизацию", "гессиан", "второе условие Вольфе обязательно"], "a": 0, "why": "Шаг уменьшается постепенно, поэтому второе условие не нужно."}, {"k": "exam", "h": "Эталонные ответы", "b": "<p><b>General descent method:</b> x<sub>k+1</sub> = x<sub>k</sub> + α<sub>k</sub>d<sub>k</sub> with descent direction ∇f(x<sub>k</sub>)ᵀd<sub>k</sub> &lt; 0; −∇f is steepest descent by Cauchy–Schwarz; stop when ‖∇f‖ ≤ ε.</p><p><b>Wolfe conditions:</b> sufficient decrease (Armijo) f(x + αd) ≤ f(x) + c₁α∇f(x)ᵀd and curvature ∇f(x + αd)ᵀd ≥ c₂∇f(x)ᵀd with 0 &lt; c₁ &lt; c₂ &lt; 1; strong Wolfe uses |∇f(x + αd)ᵀd| ≤ c₂|∇f(x)ᵀd|.</p><p><b>Exact line search:</b> α = argmin f(x + αd) (for quadratic α = ‖g‖²/gᵀPg); <b>backtracking:</b> start with α = 1 and multiply by b until Armijo holds.</p>"}], "id": "ls"}, {"title": "20. Скорости сходимости и теоремы для градиентного спуска", "goal": "Линейная, сублинейная, квадратичная сходимость; L-гладкость; число обусловленности κ.", "part": "Часть 5 · Оптимизация", "cards": [{"k": "story", "h": "Как измерять «быстро»", "b": "<p>Пусть φₖ — ошибка на k-й итерации (например f(xₖ) − f* или ‖xₖ − x*‖). Алгоритм называют:</p><ul class=\"big\"><li><b>сублинейным</b>: φₖ ≤ C/√k или C/k или C/k². Чтобы получить ошибку ε, нужно O(1/ε²), O(1/ε), O(1/√ε) итераций. На графике в логарифмической шкале почти горизонталь.</li><li><b>линейным (Q-линейным)</b>: φₖ₊₁/φₖ ≤ 1 − σ, то есть φₖ ≤ C(1 − σ)ᵏ. Нужно O(log(1/ε)/σ) итераций. Прямая вниз в логарифмической шкале.</li><li><b>сверхлинейным</b>: φₖ₊₁/φₖ → 0.</li><li><b>квадратичным</b>: φₖ₊₁ ≤ Cφₖ²; число верных знаков удваивается, O(log log(1/ε)) итераций.</li></ul>"}, {"k": "note", "h": "Тетрадь: гладкость, лемма о спуске, три теоремы", "b": "<div class=\"nb\"><div class=\"hd\">L-гладкость</div><div class=\"ln\"><div class=\"fm\">‖∇f(x) − ∇f(y)‖ ≤ L‖x − y‖</div><div class=\"nt\">градиент не меняется быстрее, чем с константой L</div></div><div class=\"ln\"><div class=\"fm\">−L·I ⪯ H(x) ⪯ L·I</div><div class=\"nt\">то же в терминах гессиана</div></div><div class=\"hd\">Лемма о спуске (шаг 1/L)</div><div class=\"ln\"><div class=\"fm\">f(x − ∇f/L) ≤ f(x) − <span class=\"fr\"><span>‖∇f(x)‖²</span><span>2L</span></span></div><div class=\"nt\">каждый шаг гарантирует убывание</div></div><div class=\"hd\">Три теоремы для GD с шагом 1/L</div><div class=\"ln\"><div class=\"fm\">гладкая:  min ‖∇f(x<sub>k</sub>)‖ ≤ √(<span class=\"fr\"><span>2L(f₀ − f̄)</span><span>T</span></span>)</div><div class=\"nt\">скорость C/√k, минимум не гарантируется</div></div><div class=\"ln\"><div class=\"fm\">+ выпуклая:  f(x<sub>T</sub>) − f* ≤ <span class=\"fr\"><span>L‖x₀ − x*‖²</span><span>2T</span></span></div><div class=\"nt\">скорость C/k, O(1/ε)</div></div><div class=\"ln\"><div class=\"fm\">+ m-сильно выпуклая:  f(x<sub>T</sub>) − f* ≤ (1 − <span class=\"fr\"><span>m</span><span>L</span></span>)<sup>T</sup>(f₀ − f*)</div><div class=\"nt\">линейная скорость, O(κ·log(1/ε))</div></div><div class=\"hd\">Число обусловленности</div><div class=\"ln\"><div class=\"fm\">κ = <span class=\"fr\"><span>L</span><span>m</span></span> = <span class=\"fr\"><span>λ<sub>max</sub></span><span>λ<sub>min</sub></span></span></div><div class=\"nt\">отношение наибольшей кривизны к наименьшей</div></div><div class=\"ln\"><div class=\"fm\">точный поиск, квадратичная f:  (<span class=\"fr\"><span>κ − 1</span><span>κ + 1</span></span>)²</div><div class=\"nt\">множитель на шаг; κ ≥ 1000 — GD почти бесполезен</div></div><div class=\"ln\"><div class=\"fm\">лучший постоянный шаг:  α = <span class=\"fr\"><span>2</span><span>L + m</span></span></div></div></div>"}, {"k": "num", "h": "Числа: сколько итераций нужно", "b": "<p>Для f = (x−1)² + 10: L = m = 2, κ = 1. Шаг 1/L = ½: x − ½·f′(x) = x − (x − 1) = 1, то есть минимум за <b>один шаг</b> из любой точки.</p><p>Для f = ½·(1·x² + 100·y²): λ ∈ [1, 100], κ = 100. GD с шагом 1/L: множитель 1 − 1/κ = 0.99 за шаг. Чтобы уменьшить ошибку в 10⁶ раз: k ≈ ln(10⁶)/0.01 = 1382 итерации. Тяжёлый шар или CG: множитель ≈ (√κ − 1)/(√κ + 1) = 9/11 = 0.818, k ≈ ln(10⁶)/0.2 = 69 итераций.</p><p>Для f(x) = (h/2)x²: xₖ₊₁ = (1 − αh)xₖ. При α &lt; 1/h сходится монотонно, 1/h &lt; α &lt; 2/h — с колебаниями, α = 2/h — вечные колебания, α &gt; 2/h — расходится.</p>"}, {"k": "quiz", "q": "κ = 100, GD с шагом 1/L. Какой множитель ошибки за шаг?", "o": ["0.99", "0.9", "0.5", "0.01"], "a": 0, "why": "1 − 1/κ = 1 − 0.01 = 0.99."}, {"k": "quiz", "q": "Квадратичная сходимость — это когда", "o": ["φₖ₊₁ ≤ Cφₖ²", "φₖ₊₁ ≤ (1−σ)φₖ", "φₖ ≤ C/k", "φₖ ≤ C/√k"], "a": 0, "why": "Ошибка возводится в квадрат: число верных знаков удваивается."}, {"k": "exam", "h": "Эталонные ответы", "b": "<p><b>Rates:</b> sublinear C/√k, C/k, C/k² (O(1/ε²), O(1/ε), O(1/√ε) iterations); linear φₖ ≤ C(1−σ)ᵏ (O(log(1/ε)/σ)); superlinear φₖ₊₁/φₖ → 0; quadratic φₖ₊₁ ≤ Cφₖ² (O(log log(1/ε))).</p><p><b>Gradient descent with step 1/L:</b> L-smooth: min‖∇f‖ ≤ √(2L(f₀ − f̄)/T); + convex: f(x_T) − f* ≤ L‖x₀ − x*‖²/(2T); + m-strongly convex: linear rate (1 − m/L)ᵀ.</p><p><b>Condition number</b> κ = L/m = λ_max/λ_min; the number of iterations of GD is O(κ log(1/ε)), of heavy-ball/CG O(√κ log(1/ε)). For quadratics with exact line search the rate is ((κ−1)/(κ+1))².</p>"}], "id": "conv"}, {"title": "21. Тяжёлый шар и метод сопряжённых градиентов", "goal": "Как ускорить градиентный спуск: импульс и сопряжённые направления.", "part": "Часть 5 · Оптимизация", "cards": [{"k": "story", "h": "Проблема и идея", "b": "<p>Градиентный спуск на «вытянутой» функции (λ_max ≫ λ_min, большое κ) зигзагует поперёк оврага и медленно идёт вдоль него. Две идеи ускорения:</p><ul class=\"big\"><li><b>Heavy ball (Поляк):</b> добавить «инерцию» — учитывать предыдущий шаг. Как тяжёлый шарик, который катится по склону и не дёргается из стороны в сторону.</li><li><b>Conjugate gradient (CG):</b> выбирать направления так, чтобы не портить то, что уже достигнуто в предыдущих направлениях (сопряжённые направления).</li></ul>"}, {"k": "formula", "h": "Формулы", "b": "<table class=\"sym\"><tr><td>heavy ball</td><td>x<sub>k+1</sub> = x<sub>k</sub> − α∇f(x<sub>k</sub>) + β(x<sub>k</sub> − x<sub>k−1</sub>); для сильно выпуклой f: α = 4/(√L + √m)², β = ((√L − √m)/(√L + √m))²</td></tr><tr><td>скорость heavy ball</td><td>O(√κ · log(1/ε)) вместо O(κ · log(1/ε)) у обычного GD; не метод спуска (f может расти), нужны m и L</td></tr><tr><td>CG для Ax = b, A ≻ 0</td><td>минимизирует ½xᵀAx − bᵀx; направления A-сопряжены: dᵢᵀ A dⱼ = 0 при i ≠ j</td></tr><tr><td>α<sub>k</sub> = r<sub>k</sub>ᵀr<sub>k</sub> / (d<sub>k</sub>ᵀ A d<sub>k</sub>)</td><td>длина шага (точный линейный поиск), r = b − Ax — невязка</td></tr><tr><td>x<sub>k+1</sub> = x<sub>k</sub> + α<sub>k</sub> d<sub>k</sub>; r<sub>k+1</sub> = r<sub>k</sub> − α<sub>k</sub> A d<sub>k</sub></td><td>обновление точки и невязки</td></tr><tr><td>β<sub>k</sub> = r<sub>k+1</sub>ᵀr<sub>k+1</sub> / r<sub>k</sub>ᵀr<sub>k</sub>; d<sub>k+1</sub> = r<sub>k+1</sub> + β<sub>k</sub>d<sub>k</sub></td><td>новое направление</td></tr><tr><td>сходимость CG</td><td>не более N шагов; если у A только r различных собственных значений, то не более r шагов; предобуславливание улучшает спектр</td></tr><tr><td>нелинейный CG</td><td>Fletcher–Reeves (β = ‖g_{k+1}‖²/‖g_k‖², нужны сильные условия Вольфе c₂ &lt; ½), Polak–Ribière (β⁺ = max(β, 0)), Hestenes–Stiefel, Dai–Yuan, Hager–Zhang; рестарт каждые N шагов</td></tr></table>"}, {"k": "num", "h": "Числа: CG за два шага", "b": "<p>A = [[4,1],[1,3]], b = (1, 2), старт x₀ = 0. Точное решение x* = A⁻¹b = (1/11, 7/11) = (0.0909, 0.6364).</p><table class=\"tbl\"><tr><th>шаг</th><th>r (невязка)</th><th>d</th><th>α</th><th>x после шага</th></tr><tr><td>0</td><td>(1, 2)</td><td>(1, 2)</td><td>5/20 = 0.25</td><td>(0.25, 0.5)</td></tr><tr><td>1</td><td>(−0.5, 0.25)</td><td>(−0.4375, 0.375)</td><td>0.3125/0.859 = 0.3636</td><td><b>(0.0909, 0.6364)</b></td></tr></table><p>Пояснения: dᵀAd на шаге 0: A·(1,2) = (6, 7), (1,2)·(6,7) = 20; α₀ = rᵀr/dᵀAd = 5/20. Новая невязка r₁ = r₀ − α₀Ad₀ = (1 − 1.5, 2 − 1.75) = (−0.5, 0.25). β₀ = r₁ᵀr₁/r₀ᵀr₀ = 0.3125/5 = 0.0625, d₁ = r₁ + β₀d₀ = (−0.4375, 0.375). После второго шага получаем <b>точное решение</b>: N = 2 неизвестных, значит CG закончил за N = 2 шага (в теории; в реальных вычислениях с округлениями делают больше).</p>"}, {"k": "proof", "h": "Почему CG хорош (идея)", "b": "<p>Шаг по сопряжённому направлению dⱼ не портит минимизацию, сделанную по прежним направлениям: если dᵢᵀAdⱼ = 0, то уменьшение f вдоль dⱼ не меняет оптимальность вдоль dᵢ. Поэтому за N шагов по N сопряжённым направлениям мы минимизируем f по всем осям: точное решение. Если A имеет r различных собственных значений, пространство Крылова исчерпывается за r шагов.</p><p>Почему β считается так просто: невязки r<sub>k</sub> взаимно ортогональны, а направления сопряжены; из этого выводится, что нужно хранить только последнее направление (память O(N)).</p>"}, {"k": "quiz", "q": "Сколько шагов нужно CG для системы N×N с A ≻ 0 (точная арифметика)?", "o": ["не более N", "ровно N²", "бесконечно много", "1"], "a": 0, "why": "N A-сопряжённых направлений исчерпывают пространство."}, {"k": "quiz", "q": "Heavy ball по сравнению с GD:", "o": ["скорость O(√κ) вместо O(κ), но нужны m и L", "всегда проще", "всегда медленнее", "не нужен градиент"], "a": 0, "why": "Инерция ускоряет, но не гарантирует убывание f на каждом шаге."}, {"k": "note", "h": "Тетрадь: эталонные ответы на вопросы", "b": "<div class=\"nb\"><div class=\"hd\">Q: Heavy-ball method</div><div class=\"ln\"><div class=\"fm\">x<sub>k+1</sub> = x<sub>k</sub> − α∇f(x<sub>k</sub>) + β(x<sub>k</sub> − x<sub>k−1</sub>)</div><div class=\"nt\">инерция (момент)</div></div><div class=\"ln\"><div class=\"fm\">α = <span class=\"fr\"><span>4</span><span>(√L + √m)²</span></span>,   β = (<span class=\"fr\"><span>√L − √m</span><span>√L + √m</span></span>)²</div><div class=\"nt\">скорость O(√κ·log 1/ε)</div></div><div class=\"hd\">Q: Conjugate gradient and convergence</div><div class=\"ln\"><div class=\"fm\">A ≻ 0:  Ax = b ⇔ min ½xᵀAx − bᵀx;  направления A-сопряжены  d<sub>i</sub>ᵀAd<sub>j</sub> = 0</div></div><div class=\"ln\"><div class=\"fm\">α<sub>k</sub> = <span class=\"fr\"><span>r<sub>k</sub>ᵀr<sub>k</sub></span><span>d<sub>k</sub>ᵀAd<sub>k</sub></span></span>,   β<sub>k</sub> = <span class=\"fr\"><span>r<sub>k+1</sub>ᵀr<sub>k+1</sub></span><span>r<sub>k</sub>ᵀr<sub>k</sub></span></span>,   d<sub>k+1</sub> = r<sub>k+1</sub> + β<sub>k</sub>d<sub>k</sub></div><div class=\"nt\">r = b − Ax</div></div><div class=\"ln\"><div class=\"fm\">сходится не более чем за N шагов; за r шагов, если у A r различных собственных значений</div></div><div class=\"hd\">Q: Fletcher–Reeves vs Polak–Ribière</div><div class=\"ln\"><div class=\"fm\">FR: β = <span class=\"fr\"><span>‖g<sub>k+1</sub>‖²</span><span>‖g<sub>k</sub>‖²</span></span>;  PR: β = <span class=\"fr\"><span>g<sub>k+1</sub>ᵀ(g<sub>k+1</sub> − g<sub>k</sub>)</span><span>‖g<sub>k</sub>‖²</span></span></div><div class=\"nt\">g — градиент</div></div><div class=\"ln\"><div class=\"fm\">FR нужны сильные Вольфе (c₂ &lt; ½); PR на практике лучше, β⁺ = max(β, 0) гарантирует спуск; рестарт каждые N шагов</div></div></div>"}, {"k": "exam", "h": "Эталонные ответы", "b": "<p><b>Heavy-ball:</b> x<sub>k+1</sub> = x<sub>k</sub> − α∇f(x<sub>k</sub>) + β(x<sub>k</sub> − x<sub>k−1</sub>), α = 4/(√L+√m)², β = ((√L−√m)/(√L+√m))²; rate O(√κ log 1/ε); not a descent method.</p><p><b>Conjugate gradient:</b> solves Ax = b, A ≻ 0, directions are A-conjugate (dᵢᵀAdⱼ = 0), α = rᵀr/(dᵀAd), β = r<sub>k+1</sub>ᵀr<sub>k+1</sub>/r<sub>k</sub>ᵀr<sub>k</sub>; converges in at most N steps, in r steps if A has r distinct eigenvalues; preconditioning improves the spectrum.</p><p><b>FR vs PR:</b> Fletcher–Reeves β = ‖g<sub>k+1</sub>‖²/‖g<sub>k</sub>‖² needs strong Wolfe line search (c₂ &lt; ½) for global convergence; Polak–Ribière uses β = g<sub>k+1</sub>ᵀ(g<sub>k+1</sub> − g<sub>k</sub>)/‖g<sub>k</sub>‖², usually performs better in practice, with β⁺ = max(β, 0) to guarantee descent; both restart every N steps.</p>"}], "id": "hb"}, {"id": "newton", "title": "22. Метод Ньютона", "goal": "Вывод, быстрая (квадратичная) сходимость и сравнение с градиентным спуском.", "cards": [{"k": "story", "h": "Спуск с учётом кривизны", "b": "<p>Градиентный спуск знает только наклон. Метод Ньютона знает ещё <b>кривизну</b> (вторые производные, матрица Гессе H<sub>f</sub>) и приближает функцию параболой, а минимум параболы находит сразу.</p>\n <p>В одном измерении: <b>x<sub>k+1</sub> = x<sub>k</sub> − f′(x<sub>k</sub>)/f″(x<sub>k</sub>)</b>. В многомерном: <b>x<sub>k+1</sub> = x<sub>k</sub> − [H<sub>f</sub>(x<sub>k</sub>)]⁻¹ ∇f(x<sub>k</sub>)</b>. Вектор d = −H⁻¹∇f называют ньютоновским направлением, «естественный» шаг равен 1.</p>"}, {"k": "num", "h": "Числа 1: квадратичная функция, один шаг", "b": "<p>f(x,y) = x² + 3y². ∇f = (2x, 6y), H = diag(2, 6), H⁻¹ = diag(1/2, 1/6). Старт (1, 1): ∇f = (2, 6), d = −H⁻¹∇f = −(1, 1). x₁ = (1,1) − (1,1) = <b>(0, 0)</b>. Попали в минимум за <b>один</b> шаг (градиентному спуску из прошлой темы нужно бесконечно много шагов). Для любой квадратичной функции Ньютон сходится за 1 шаг.</p>"}, {"k": "num", "h": "Числа 2: минимизируем f(x) = x − ln x (минимум в x = 1)", "b": "<p>f′ = 1 − 1/x, f″ = 1/x². Шаг: x − f′/f″ = x − (1 − 1/x)·x² = 2x − x². Старт 0.5:</p>\n <table class=\"tbl\"><tr><th>k</th><th>x<sub>k</sub></th><th>ошибка |x<sub>k</sub> − 1|</th></tr><tr><td>0</td><td>0.5</td><td>0.5</td></tr><tr><td>1</td><td>0.75</td><td>0.25</td></tr><tr><td>2</td><td>0.9375</td><td>0.0625</td></tr><tr><td>3</td><td>0.99609</td><td>0.0039</td></tr></table>\n <p>Ошибка каждый раз возводится в квадрат: 0.25 = 0.5², 0.0625 = 0.25², 0.0039 ≈ 0.0625². Это и есть <b>квадратичная сходимость</b>: число верных цифр удваивается.</p>\n <p>Корень √2 (ищем f(x) = x² − 2 = 0, шаг x − f/f′ = x − (x²−2)/(2x)): 1 → 1.5 → 1.41667 → 1.414216 (√2 = 1.414214).</p>"}, {"k": "proof", "h": "Вывод формулы Ньютона (как на лекции)", "b": "<ol class=\"big\"><li>Берём разложение Тейлора второго порядка вокруг x<sub>k</sub>: f(x<sub>k</sub> + d) ≈ f(x<sub>k</sub>) + ∇f(x<sub>k</sub>)ᵀd + ½dᵀH<sub>f</sub>(x<sub>k</sub>)d =: m(d).</li>\n <li>Если H положительно определена, m(d) — выпуклая парабола, минимум в точке, где её градиент равен нулю: ∇m(d) = ∇f(x<sub>k</sub>) + H d = 0.</li>\n <li>Отсюда <b>d = −H⁻¹∇f(x<sub>k</sub>)</b>, и следующая точка x<sub>k+1</sub> = x<sub>k</sub> + d.</li>\n <li><b>Это направление убывания:</b> ∇fᵀd = −∇fᵀH⁻¹∇f &lt; 0, так как H⁻¹ положительно определена.</li></ol>\n <p><b>Если H не положительно определена</b> (лекция): направление может не быть направлением убывания или H⁻¹ не существует, поэтому в такой области метод модифицируют (регуляризация H + μI, line search).</p>"}, {"k": "proof", "h": "Вывод: почему сходимость квадратичная (1D, корень f(x) = 0)", "b": "<p>Пусть x* — корень, f′(x*) ≠ 0, e<sub>k</sub> = x<sub>k</sub> − x*. Тейлор с остаточным членом: 0 = f(x*) = f(x<sub>k</sub>) + f′(x<sub>k</sub>)(x* − x<sub>k</sub>) + ½f″(ξ)(x* − x<sub>k</sub>)².</p>\n <p>Делим на f′(x<sub>k</sub>) и переносим: x<sub>k</sub> − f(x<sub>k</sub>)/f′(x<sub>k</sub>) − x* = (f″(ξ)/(2f′(x<sub>k</sub>)))·e<sub>k</sub>². Левая часть это x<sub>k+1</sub> − x*, поэтому</p>\n <p><b>e<sub>k+1</sub> = [f″(ξ)/(2f′(x<sub>k</sub>))]·e<sub>k</sub>²</b>, то есть |e<sub>k+1</sub>| ≤ C·e<sub>k</sub>².</p>\n <p>Для минимизации применяем то же к f′ (ищем корень f′ = 0). В многомерном случае на лекции: ‖x<sub>k+1</sub> − x*‖ ≤ (L/m)‖x<sub>k</sub> − x*‖², если Гессиан липшицев (константа L), H(x*) ⪰ mI и старт достаточно близок: ‖x₀ − x*‖ ≤ m/(2L). Метод <b>локально</b> квадратично сходится; глобально без line search может расходиться.</p>"}, {"k": "formula", "h": "Ньютон против градиентного спуска", "b": "<table class=\"tbl\"><tr><th></th><th>градиентный спуск</th><th>Ньютон</th></tr><tr><td>информация</td><td>∇f</td><td>∇f и Гессиан H</td></tr><tr><td>скорость</td><td>линейная / сублинейная</td><td>квадратичная вблизи решения</td></tr><tr><td>цена шага</td><td>дёшево, O(n)</td><td>дорого: считать и решать систему с H, около O(n³)</td></tr><tr><td>устойчивость</td><td>глобально сходится при малом t</td><td>нужен хороший старт и H положительно определён</td></tr></table>\n <p><b>Связь с Якобианом:</b> для системы уравнений F(x) = 0 Ньютон: x<sub>k+1</sub> = x<sub>k</sub> − J⁻¹F(x<sub>k</sub>) (J — Якобиан F). Минимизация f это решение ∇f = 0, а Якобиан от ∇f это и есть Гессиан H. Gauss–Newton (тема 7) = Ньютон для МНК с отброшенным членом со вторыми производными.</p>"}, {"k": "quiz", "q": "За сколько шагов Ньютон минимизирует f = x² + 3y²?", "o": ["1", "2", "бесконечно много", "10"], "a": 0, "why": "Для квадратичных функций модель m(d) совпадает с f, поэтому минимум за один шаг."}, {"k": "quiz", "q": "Что значит квадратичная сходимость?", "o": ["ошибка ~ квадрат предыдущей ошибки", "ошибка падает как 1/k²", "шаг в квадрате", "нужен квадрат Гессиана"], "a": 0, "why": "e_{k+1} ≤ C·e_k²: число верных цифр удваивается."}, {"k": "quiz", "q": "Главный минус метода Ньютона?", "o": ["цена Гессиана и его положительная определённость", "он медленнее GD", "нужен только градиент", "он не сходится у квадратичных функций"], "a": 0, "why": "Вычисление и решение системы с H дорого, плюс нужна положительная определённость."}, {"k": "note", "h": "Тетрадь: метод Ньютона", "b": "<div class=\"nb\"><div class=\"hd\">Квадратичная модель</div><div class=\"ln\"><div class=\"fm\">m(d) = f(x<sub>k</sub>) + ∇f(x<sub>k</sub>)ᵀd + ½ dᵀ H d</div><div class=\"nt\">Тейлор 2-го порядка, H — гессиан</div></div><div class=\"hd\">Минимум модели</div><div class=\"ln\"><div class=\"fm\">∇m(d) = ∇f(x<sub>k</sub>) + H d = 0</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">d = − H⁻¹ ∇f(x<sub>k</sub>)</span></div><div class=\"nt\">ньютоновское направление</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">x<sub>k+1</sub> = x<sub>k</sub> − H⁻¹ ∇f(x<sub>k</sub>)</span></div></div><div class=\"ln\"><div class=\"fm\">1D:   x<sub>k+1</sub> = x<sub>k</sub> − <span class=\"fr\"><span>f′(x<sub>k</sub>)</span><span>f″(x<sub>k</sub>)</span></span></div></div><div class=\"hd\">Направление убывания</div><div class=\"ln\"><div class=\"fm\">∇fᵀd = − ∇fᵀ H⁻¹ ∇f &lt; 0</div><div class=\"nt\">если H положительно определён</div></div><div class=\"hd\">Квадратичная сходимость (корень f = 0)</div><div class=\"ln\"><div class=\"fm\">e<sub>k+1</sub> = <span class=\"fr\"><span>f″(ξ)</span><span>2f′(x<sub>k</sub>)</span></span>·e<sub>k</sub>²</div><div class=\"nt\">из Тейлора с остаточным членом</div></div><div class=\"ln\"><div class=\"fm\">‖x<sub>k+1</sub> − x*‖ ≤ <span class=\"fr\"><span>L</span><span>m</span></span> ‖x<sub>k</sub> − x*‖²</div><div class=\"nt\">теорема лекции</div></div><div class=\"ln\"><div class=\"fm\">условие старта:  ‖x₀ − x*‖ ≤ m/(2L)</div></div></div>"}, {"k": "note", "h": "Тетрадь: эталонные ответы на вопросы", "b": "<div class=\"nb\"><div class=\"hd\">Q: Derive the Newton direction</div><div class=\"ln\"><div class=\"fm\">f(x + d) ≈ f(x) + ∇fᵀd + ½ dᵀH d</div><div class=\"nt\">разложение Тейлора до 2-го порядка</div></div><div class=\"ln\"><div class=\"fm\">производная по d: ∇f + H d = 0</div><div class=\"nt\">минимум квадратичной модели</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">d = −H⁻¹∇f,   x<sub>k+1</sub> = x<sub>k</sub> − H⁻¹∇f</span></div><div class=\"nt\">направление Ньютона</div></div><div class=\"hd\">Q: Local convergence theorem</div><div class=\"ln\"><div class=\"fm\">f дважды дифференцируема, H липшицев, H(x*) ≻ 0, старт близко к x*</div><div class=\"nt\">условия</div></div><div class=\"ln\"><div class=\"fm\">‖x<sub>k+1</sub> − x*‖ ≤ C‖x<sub>k</sub> − x*‖²</div><div class=\"nt\">квадратичная сходимость; для квадратичной f один шаг</div></div><div class=\"hd\">Q: What if the Hessian is not positive definite</div><div class=\"ln\"><div class=\"fm\">направление Ньютона может не быть направлением спуска</div><div class=\"nt\">H⁻¹ может не существовать</div></div><div class=\"ln\"><div class=\"fm\">лечение: H + μI (Levenberg–Marquardt), модифицированное разложение Холецкого, trust region, line search, либо шаг градиентного спуска</div></div></div>"}, {"k": "exam", "h": "Ответ «Newton method»", "b": "<ol class=\"big\"><li>Идея: квадратичная модель функции (Тейлор до 2-го порядка).</li><li>Вывод: ∇m = 0 ⇒ d = −H⁻¹∇f, x<sub>k+1</sub> = x<sub>k</sub> + αd (α = 1).</li><li>Условия: H положительно определён (иначе d не убывающее).</li><li>Скорость: локально квадратичная (теорема с L и m), глобально нужен line search (Wolfe).</li><li>Плюсы/минусы относительно GD; пример 1D.</li></ol>"}, {"k": "exam", "h": "Эталонный ответ (так можно писать на экзамене)", "b": "<p><b>Newton method.</b> Метод второго порядка. В точке x<sub>k</sub> функцию заменяют квадратичной моделью m(d) = f + ∇fᵀd + ½dᵀHd. При H ≻ 0 минимум модели: ∇m = ∇f + Hd = 0 ⇒ <b>d = −H⁻¹∇f</b> (ньютоновское направление), x<sub>k+1</sub> = x<sub>k</sub> + αd, «естественный» шаг α = 1. Это направление убывания: ∇fᵀd = −∇fᵀH⁻¹∇f &lt; 0.</p>\n<p><b>Сходимость:</b> если Гессиан липшицев (L), H(x*) ⪰ mI и ‖x₀−x*‖ ≤ m/(2L), то ‖x<sub>k+1</sub>−x*‖ ≤ (L/m)‖x<sub>k</sub>−x*‖² — квадратичная (локальная); глобально нужен line search с условиями Вольфе.</p>\n<p><b>Плюсы/минусы:</b> быстро вблизи решения (для квадратичных функций за 1 шаг), но нужен Гессиан (дорого, O(n³)), требуется H ≻ 0.</p>\n<p><b>1D:</b> x<sub>k+1</sub> = x<sub>k</sub> − f′/f″; пример √2: 1 → 1.5 → 1.4167 → 1.41422.</p>"}], "part": "Часть 5 · Оптимизация"}, {"id": "lrm", "title": "23. Допущения линейной регрессии и их нарушения", "goal": "Что предполагает LRM, как увидеть нарушения и что делать (Davide).", "cards": [{"k": "story", "h": "Модель и допущения", "b": "<p>В этой части курса обозначения стандартные: <b>Y = β<sub>0</sub> + β<sub>1</sub>X + ε</b> (β<sub>0</sub> — свободный член, β<sub>1</sub> — наклон; не путай с α/β у Gorgone).</p>\n <p><b>Допущения (MLR):</b></p>\n <ul class=\"big\"><li><b>Linearity:</b> E[Y | X] = β<sub>0</sub> + β<sub>1</sub>X<sub>1</sub> + … + β<sub>k</sub>X<sub>k</sub>.</li><li><b>Independence (нет автокорреляции):</b> Cov(ε<sub>i</sub>, ε<sub>j</sub>) = 0 при i ≠ j.</li><li><b>Homoscedasticity:</b> Var(ε<sub>i</sub> | X) = σ² постоянна.</li><li><b>Zero conditional mean:</b> E[ε<sub>i</sub> | X] = 0, отсюда Cov(X<sub>j</sub>, ε) = 0. Означает: E(ε) = 0 и регрессоры не связаны с ошибкой.</li><li><b>No perfect multicollinearity:</b> ни один регрессор не есть точная линейная комбинация других.</li><li><b>Normality:</b> ε ~ N(0, σ²), нужна в основном для вывода (тесты, интервалы).</li></ul>\n <p><b>Что ломается при нарушении:</b> гетероскедастичность — оценки остаются несмещёнными, но перестают быть BLUE (минимальная дисперсия), стандартные ошибки смещены; мультиколлинеарность — растут SE, падают t-статистики; коррелированные ошибки — SE занижены, интервалы уже, p-value меньше.</p>\n <p><b>Simple vs multiple:</b> один предиктор против нескольких. <b>R²</b> — доля объяснённой вариации, 1 − SSR/SST; <b>adjusted R²</b> = 1 − (1−R²)(N−1)/(N−p−1) штрафует за лишние предикторы. Пример: R² = 0.6, N = 50, p = 3: adj = 1 − 0.4·49/46 = 0.574.</p>"}, {"k": "formula", "h": "Диагностика по пунктам", "b": "<table class=\"sym\"><tr><td>Residual plot</td><td>e<sub>i</sub> = y<sub>i</sub> − ŷ<sub>i</sub>. В простой регрессии строят e против x, в множественной против ŷ. Должно быть без паттерна. U-образность = нелинейность: добавь log X, √X, X².</td></tr>\n <tr><td>Tracking</td><td>соседние остатки движутся вместе: ошибки коррелированы (временные ряды); чем больше ρ, тем заметнее</td></tr>\n <tr><td>Funnel shape</td><td>воронка в residual plot: гетероскедастичность; лечат преобразованием Y (log Y, √Y)</td></tr>\n <tr><td>Outlier</td><td>необычное значение y<sub>i</sub> (далеко от предсказания). Увеличивает RSS, снижает R². Studentized residual = e<sub>i</sub>/оценка SE(e<sub>i</sub>); |значение| &gt; 3: возможный выброс</td></tr>\n <tr><td>High leverage</td><td>необычное значение предиктора x<sub>i</sub>. h<sub>i</sub> = 1/n + (x<sub>i</sub>−x̄)²/Σ(x<sub>j</sub>−x̄)²; h<sub>i</sub> ∈ [1/n, 1], среднее (p+1)/n; сильно сильнее среднего: высокий leverage, точка тянет прямую</td></tr>\n <tr><td>Collinearity</td><td>предикторы сильно коррелируют, трудно разделить эффекты; SE β̂<sub>j</sub> растёт, t падает; смотрим корреляции и <b>VIF</b></td></tr>\n <tr><td>VIF(β̂<sub>j</sub>) = 1/(1 − R²<sub>X<sub>j</sub>|X<sub>−j</sub></sub>)</td><td>R² регрессии X<sub>j</sub> на остальные предикторы; минимум 1; правило: &gt; 5 или 10 проблема</td></tr></table>"}, {"k": "num", "h": "Числа", "b": "<p><b>Leverage:</b> x = 1, 2, 3, 4, 10. x̄ = 4, S<sub>xx</sub> = 9+4+1+0+36 = 50. Для x = 10: h = 1/5 + 36/50 = <b>0.92</b>, среднее (p+1)/n = 2/5 = 0.4. Точка с x = 10 имеет огромный leverage.</p>\n <p><b>VIF:</b> если R² регрессии X<sub>1</sub> на остальные = 0.9, то VIF = 1/(1 − 0.9) = <b>10</b> (проблема); при 0.8 VIF = 5.</p>\n <p>VIF показывает, во сколько раз дисперсия β̂<sub>j</sub> в полной модели больше, чем была бы при отдельной подгонке.</p>"}, {"k": "quiz", "q": "Чем outlier отличается от high leverage point?", "o": ["outlier: необычный y; leverage: необычный x", "наоборот", "это одно и то же", "outlier только в множественной регрессии"], "a": 0, "why": "Outlier далёк по y от предсказания, leverage необычен по предикторам и сильно влияет на прямую."}, {"k": "quiz", "q": "VIF = 10. Что это значит?", "o": ["R² регрессии X_j на остальные = 0.9, сильная коллинеарность", "R² модели равен 10", "всё хорошо", "выброс"], "a": 0, "why": "VIF = 1/(1 − R²) = 10 ⇒ R² = 0.9."}, {"k": "quiz", "q": "Воронка на графике остатков означает:", "o": ["гетероскедастичность", "нелинейность", "автокорреляцию", "мультиколлинеарность"], "a": 0, "why": "Дисперсия ошибок меняется; лечат log Y или √Y."}, {"k": "note", "h": "Тетрадь: диагностика LRM", "b": "<div class=\"nb\"><div class=\"hd\">Leverage</div><div class=\"ln\"><div class=\"fm\">h<sub>i</sub> = <span class=\"fr\"><span>1</span><span>N</span></span> + <span class=\"fr\"><span>(<i>x</i><sub>i</sub> − <span class=\"ov\"><i>x</i></span>)²</span><span>Σ(<i>x</i><sub>j</sub> − <span class=\"ov\"><i>x</i></span>)²</span></span></div><div class=\"nt\">от 1/N до 1; среднее (p+1)/N</div></div><div class=\"hd\">VIF</div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">VIF(β̂<sub>j</sub>) = <span class=\"fr\"><span>1</span><span>1 − R²<sub>X<sub>j</sub>|X<sub>−j</sub></sub></span></span></span></div><div class=\"nt\">R² регрессии X_j на остальные предикторы</div></div><div class=\"ln\"><div class=\"fm\">R² = 0.9  ⇒  VIF = <span class=\"fr\"><span>1</span><span>0.1</span></span> = 10</div></div><div class=\"hd\">Studentized residual</div><div class=\"ln\"><div class=\"fm\">t<sub>i</sub> = <span class=\"fr\"><span>e<sub>i</sub></span><span>SE(e<sub>i</sub>)</span></span>,   |t<sub>i</sub>| &gt; 3 ⇒ возможный выброс</div></div></div>"}, {"k": "exam", "h": "Эталонный ответ: допущения LRM", "b": "<p>Модель Y = β<sub>0</sub> + Σβ<sub>j</sub>X<sub>j</sub> + ε. Допущения: линейность E[Y|X]; независимость ошибок; гомоскедастичность Var(ε|X) = σ²; нулевое условное среднее E[ε|X] = 0 (⇒ Cov(X,ε) = 0); отсутствие совершенной мультиколлинеарности; нормальность ε для вывода.</p>\n <p>Нарушения и диагностика: нелинейность видна на residual plot (лечится преобразованиями X); автокорреляция даёт tracking и заниженные SE; гетероскедастичность даёт воронку (лечится log/√ от Y), оценки несмещены, но не BLUE; outlier ищем по studentized residuals (|·| &gt; 3), leverage по h<sub>i</sub> (сравниваем с (p+1)/n); коллинеарность по VIF (&gt; 5–10), растут SE и падают t-статистики.</p>\n <p><b>E(ε<sub>i</sub>) = 0</b> означает, что в среднем ошибка не смещает модель: прямая правильно описывает среднее Y.</p>"}], "part": "Часть 6 · Davide: модели и классификация"}, {"id": "forms", "title": "24. Log-модели и типы данных", "goal": "Как читать β в log-linear, linear-log, log-log; cross-section, time series, panel, lifetime, hierarchical.", "cards": [{"k": "num", "h": "Числа: три формы", "b": "<ul class=\"big\"><li><b>Log-linear</b>: ln(wage) = 1.5 + 0.08·educ. Год образования ⇒ зарплата выше примерно на <b>8%</b> (точно e<sup>0.08</sup> − 1 = 8.3%).</li><li><b>Linear-log</b>: consumption = 2 + 0.5·ln(income). Рост дохода на 1% ⇒ потребление выше на 0.5/100 = <b>0.005</b> единицы.</li><li><b>Log-log</b>: ln(cons) = 0.5 + 0.6·ln(income). Рост дохода на 1% ⇒ потребление выше на <b>0.6%</b> (эластичность).</li></ul>"}, {"k": "formula", "h": "Правила чтения коэффициента", "b": "<table class=\"tbl\"><tr><th>Модель</th><th>Уравнение</th><th>Что значит β<sub>1</sub></th></tr><tr><td>Log-linear</td><td>ln Y = β<sub>0</sub> + β<sub>1</sub>X + ε</td><td>+1 к X ⇒ Y меняется примерно на 100·β<sub>1</sub>% (<b>semi-elasticity</b>)</td></tr><tr><td>Linear-log</td><td>Y = β<sub>0</sub> + β<sub>1</sub> ln X + ε</td><td>+1% к X ⇒ Y меняется примерно на β<sub>1</sub>/100 единиц (semi-elasticity)</td></tr><tr><td>Log-log</td><td>ln Y = β<sub>0</sub> + β<sub>1</sub> ln X + ε</td><td>+1% к X ⇒ Y меняется на β<sub>1</sub>% (<b>elasticity</b>), β<sub>1</sub> = %ΔY/%ΔX</td></tr></table>\n <p><b>Откуда:</b> d(ln Y) ≈ ΔY/Y, поэтому в log-linear Δln Y = β<sub>1</sub>ΔX — это относительное изменение Y. В log-log Δln Y = β<sub>1</sub>Δln X — отношение двух относительных изменений.</p>"}, {"k": "story", "h": "Типы данных", "b": "<ul class=\"big\"><li><b>Cross-sectional:</b> много объектов в один момент времени (доходы 1000 итальянцев в 2024). Нет временной вариации.</li><li><b>Time series:</b> один объект во времени (ВВП страны 2000–2025, цена акции).</li><li><b>Panel:</b> N объектов, каждый наблюдается T периодов; N·T наблюдений; есть и межобъектная, и временная вариация; более информативны, но сложнее. Модель: Y = Xβ + ε (Y: NT×1), или y<sub>it</sub> = x′<sub>it</sub>β + ε<sub>it</sub>, или по объекту y<sub>i</sub> = X<sub>i</sub>β + ε<sub>i</sub> (T×1).</li><li><b>Lifetime (survival):</b> время до события, возможно цензурированное (болезнь, поломка, churn).</li><li><b>Hierarchical (multilevel):</b> наблюдения вложены в группы (студенты в классах, пациенты в клиниках), не независимы, вариация на разных уровнях.</li></ul>\n <p>Пример panel: N = 100 человек, T = 5 лет ⇒ 500 наблюдений.</p>"}, {"k": "quiz", "q": "В какой модели β1 это эластичность?", "o": ["log-log", "log-linear", "linear-log", "линейной"], "a": 0, "why": "Обе переменные в логарифмах, β1 = %ΔY/%ΔX."}, {"k": "quiz", "q": "ln(wage) = 1.5 + 0.08·educ. Что значит 0.08?", "o": ["+1 год ⇒ примерно +8% зарплаты", "+1 год ⇒ +0.08 единицы", "+8% образования ⇒ +1 год", "+0.08%"], "a": 0, "why": "Log-linear: β1·100 процентов."}, {"k": "note", "h": "Тетрадь: log-модели", "b": "<div class=\"nb\"><div class=\"hd\">Три формы</div><div class=\"ln\"><div class=\"fm\"><b>log-linear:</b>   ln Y = β<sub>0</sub> + β<sub>1</sub>X + ε</div><div class=\"nt\">+1 к X ⇒ Y на ≈ 100·β₁ %</div></div><div class=\"ln\"><div class=\"fm\"><b>linear-log:</b>   Y = β<sub>0</sub> + β<sub>1</sub> ln X + ε</div><div class=\"nt\">+1% к X ⇒ Y на β₁/100 единиц</div></div><div class=\"ln\"><div class=\"fm\"><b>log-log:</b>   ln Y = β<sub>0</sub> + β<sub>1</sub> ln X + ε</div><div class=\"nt\">+1% к X ⇒ Y на β₁ %</div></div><div class=\"ln\"><div class=\"fm\">β<sub>1</sub> = <span class=\"fr\"><span>%ΔY</span><span>%ΔX</span></span></div><div class=\"nt\">эластичность</div></div><div class=\"ln\"><div class=\"fm\">e<sup>0.08</sup> − 1 = 0.083</div><div class=\"nt\">точный эффект для 0.08</div></div></div>"}, {"k": "exam", "h": "Эталонный ответ", "b": "<p><b>Функциональные формы:</b> log-linear (Y в логах, X в уровнях): +1 к X даёт примерно 100β<sub>1</sub>% к Y; linear-log (X в логах): +1% к X даёт β<sub>1</sub>/100 единиц Y; log-log: +1% к X даёт β<sub>1</sub>% к Y, β<sub>1</sub> — эластичность. Semi-elasticity в первых двух, elasticity в log-log.</p>\n <p><b>Типы данных:</b> cross-section (много объектов, один момент), time series (один объект, много моментов), panel (те же N объектов в T моментов, NT наблюдений, объединяет оба измерения и информативнее), lifetime (время до события с цензурированием), hierarchical (наблюдения вложены в группы, зависимы внутри группы).</p>"}], "part": "Часть 6 · Davide: модели и классификация"}, {"id": "cls", "title": "25. Классификация и логистическая регрессия", "goal": "Зачем логистическая регрессия, вывод p(X), логит, оценка по MLE, метрики.", "ext": true, "cards": [{"k": "story", "h": "Идея (ISLR гл. 4: 4.1, 4.2, 4.3, 4.6)", "b": "<p class=\"warn\"><b>Источник:</b> от Davide есть только список вопросов (Summary questions). Ответы ниже написаны по ISLR гл. 4 и общей теории.</p>\n <p><b>Классификация:</b> ответ Y качественный (категория: да/нет, вид болезни), задача предсказать класс объекта; в регрессии Y количественный. Примеры: пройдёт кредит или нет, спам или не спам.</p>\n <p><b>Почему не линейная регрессия:</b> (1) для бинарного Y она может давать «вероятности» вне [0,1] (−0.2, 1.3); (2) для &gt; 2 неупорядоченных классов кодирование 1,2,3 навязывает порядок и равные расстояния, который не имеет смысла.</p>\n <p><b>Логистическая регрессия</b> моделирует вероятность p(X) = P(Y = 1 | X) так, чтобы она всегда была в (0,1):</p>\n <p style=\"text-align:center;font-size:20px\"><b>p(X) = e<sup>β<sub>0</sub>+β<sub>1</sub>X</sup> / (1 + e<sup>β<sub>0</sub>+β<sub>1</sub>X</sup>)</b></p>\n <p>Это S-образная логистическая функция: при z → −∞ даёт 0, при z → +∞ даёт 1.</p>"}, {"k": "proof", "h": "Вывод: odds, логит, правдоподобие", "b": "<ol class=\"big\"><li>Из p = e<sup>z</sup>/(1+e<sup>z</sup>), z = β<sub>0</sub>+β<sub>1</sub>X: 1 − p = 1/(1+e<sup>z</sup>).</li><li><b>Odds</b> = p/(1−p) = e<sup>z</sup> ∈ (0, ∞).</li><li><b>Логит (log-odds)</b>: ln(p/(1−p)) = β<sub>0</sub> + β<sub>1</sub>X — <b>линейна по X</b>. Поэтому β<sub>1</sub>: +1 к X прибавляет β<sub>1</sub> к log-odds, т.е. умножает odds на e<sup>β<sub>1</sub></sup>. Прямая в p(X) не линейна: влияние X на p зависит от X.</li><li><b>Оценка — максимальное правдоподобие:</b> L(β) = Π<sub>y<sub>i</sub>=1</sub> p(x<sub>i</sub>) · Π<sub>y<sub>i</sub>=0</sub>(1 − p(x<sub>i</sub>)); выбираем β̂ максимизирующие L (логарифм: Σ[y<sub>i</sub> ln p + (1−y<sub>i</sub>) ln(1−p)]). Замкнутого решения нет, используют итерации (Ньютон/IRLS).</li><li>Предсказание: если p̂(x) &gt; 0.5 (порог можно менять), относим к классу 1.</li><li>Множественная: p(X) = e<sup>β<sub>0</sub>+β<sub>1</sub>X<sub>1</sub>+…+β<sub>p</sub>X<sub>p</sub></sup>/(1+…). Для &gt; 2 классов: multinomial logistic.</li></ol>"}, {"k": "num", "h": "Числа", "b": "<p>β<sub>0</sub> = −6, β<sub>1</sub> = 0.05. Для X = 100: z = −1, p = e<sup>−1</sup>/(1+e<sup>−1</sup>) = 0.269. Для X = 120: z = 0, p = 0.5. Для X = 160: z = 2, p = 0.881. Odds растут в e<sup>0.05</sup> = 1.051 раза за единицу X.</p>\n <p><b>Метрики по матрице ошибок:</b> TP = 40, FN = 10, FP = 5, TN = 45. Accuracy = 85/100 = 0.85; sensitivity (recall) = 40/50 = 0.80; specificity = 45/50 = 0.90; precision = 40/45 = 0.889. Меняя порог, получаем ROC-кривую (sensitivity против 1 − specificity), AUC — площадь под ней.</p>"}, {"k": "formula", "h": "GLM и счётные данные (sec. 4.6)", "b": "<p><b>Generalized linear model:</b> линейный предиктор η = Xβ связывается со средним ответа через link-функцию. Распределение ответа и link:</p>\n <table class=\"tbl\"><tr><th>Ответ</th><th>Распределение</th><th>Link</th></tr><tr><td>Количественный</td><td>Normal</td><td>identity</td></tr><tr><td>Бинарный / доля</td><td>Binomial</td><td>logit (или probit)</td></tr><tr><td>Счёт 0,1,2…</td><td>Poisson</td><td>log</td></tr></table>\n <p><b>Poisson regression:</b> E(n) = m, Var(n) = m (дисперсия равна среднему), ln m = β<sub>0</sub> + β<sub>1</sub>x ⇒ m = e<sup>β<sub>0</sub>+β<sub>1</sub>x</sup> &gt; 0. Пример: β<sub>0</sub> = 1, β<sub>1</sub> = 0.3, x = 2: m = e<sup>1.6</sup> = 4.95; +1 к x умножает среднее на e<sup>0.3</sup> = 1.35.</p>\n <p><b>Offset:</b> если счёт зависит от размера M: ln m = ln M + β<sub>0</sub> + β<sub>1</sub>x; ln M — предиктор с фиксированным коэффициентом 1 (моделируем частоту: 10 аварий на 100 учеников и на 2000 учеников — разные частоты).</p>"}, {"k": "quiz", "q": "Почему логистическая регрессия лучше линейной для бинарного Y?", "o": ["p(X) всегда в (0,1)", "она быстрее", "она не требует данных", "она линейна по p"], "a": 0, "why": "Логистическая функция ограничена (0,1)."}, {"k": "quiz", "q": "Что линейно по X в логистической регрессии?", "o": ["log-odds ln(p/(1−p))", "вероятность p", "odds", "p²"], "a": 0, "why": "ln(p/(1−p)) = β0 + β1X."}, {"k": "quiz", "q": "β1 = 0.05 в логистической регрессии. На что умножаются odds при +1 к X?", "o": ["e^0.05 ≈ 1.051", "0.05", "1.05 прибавляется к p", "1/0.05"], "a": 0, "why": "exp(β1) — множитель odds."}, {"k": "note", "h": "Тетрадь: логистическая регрессия", "b": "<div class=\"nb\"><div class=\"hd\">Модель</div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">p(X) = <span class=\"fr\"><span>e<sup>β<sub>0</sub>+β<sub>1</sub>X</sup></span><span>1 + e<sup>β<sub>0</sub>+β<sub>1</sub>X</sup></span></span></span></div><div class=\"nt\">всегда в (0,1)</div></div><div class=\"hd\">Odds и логит</div><div class=\"ln\"><div class=\"fm\">1 − p = <span class=\"fr\"><span>1</span><span>1 + e<sup>z</sup></span></span>,   z = β<sub>0</sub>+β<sub>1</sub>X</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>p</span><span>1 − p</span></span> = e<sup>z</sup></div><div class=\"nt\">odds</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">ln <span class=\"fr\"><span>p</span><span>1 − p</span></span> = β<sub>0</sub> + β<sub>1</sub>X</span></div><div class=\"nt\">логит линеен по X</div></div><div class=\"hd\">Правдоподобие</div><div class=\"ln\"><div class=\"fm\">L(β) = Π<sub>y<sub>i</sub>=1</sub> p(x<sub>i</sub>) · Π<sub>y<sub>i</sub>=0</sub> (1 − p(x<sub>i</sub>))</div></div><div class=\"hd\">Poisson</div><div class=\"ln\"><div class=\"fm\">ln m = β<sub>0</sub> + β<sub>1</sub>x ⇒ m = e<sup>β<sub>0</sub>+β<sub>1</sub>x</sup></div></div><div class=\"ln\"><div class=\"fm\">offset:  ln m = ln M + β<sub>0</sub> + β<sub>1</sub>x</div></div></div>"}, {"k": "exam", "h": "Эталонные ответы на Summary questions", "b": "<ol class=\"big\"><li><b>Цель классификации:</b> предсказать категорию (качественный Y); в регрессии Y количественный и предсказываем число.</li><li><b>Качественный ответ:</b> принимает значения из набора категорий (спам/не спам, болезнь A/B/C, дефолт да/нет).</li><li><b>Почему не линейная регрессия:</b> вероятности вне [0,1], навязанный порядок классов при &gt; 2 категорий.</li><li><b>Логистическая регрессия:</b> моделирует P(Y=1|X) логистической функцией, оценка по максимальному правдоподобию, вероятность всегда в (0,1).</li><li><b>p(X) = e<sup>β<sub>0</sub>+β<sub>1</sub>X</sup>/(1+e<sup>β<sub>0</sub>+β<sub>1</sub>X</sup>)</b> — вероятность класса 1 при значении X; её логит линейный: ln(p/(1−p)) = β<sub>0</sub>+β<sub>1</sub>X; e<sup>β<sub>1</sub></sup> — множитель odds на единицу X.</li></ol>"}], "part": "Часть 6 · Davide: модели и классификация"}, {"id": "surv", "title": "26. Survival analysis (Davide)", "goal": "Цензурирование, S(t), Каплан–Майер, log-rank, hazard, модель Кокса. По слайдам Davide.", "cards": [{"k": "story", "h": "Что это и зачем", "b": "<p>Анализ выживаемости (= lifetime data analysis) изучает <b>время до события</b>: смерть, поломка, уход клиента (churn), конец брака. Нужно задать: <b>шкалу времени и точку отсчёта</b> (часы, мили пробега, число отпечатанных страниц) и <b>само событие</b>.</p>\n <p><b>Проблема — цензурирование (censoring).</b> Мы часто не видим всю жизнь объекта. Пример: лампочки тестируют 100 часов, часть не перегорела: мы знаем только «T &gt; 100». Пациентов наблюдают 5 лет, кто-то ещё жив или выбыл: известно «T ≥ 5 лет». Выбрасывать их нельзя, это полезная информация.</p>\n <p><b>Обозначения:</b> T — время события, C — время цензурирования, наблюдаем <b>Y = min(T, C)</b> и индикатор <b>δ = 1</b> если T ≤ C (событие наблюдено), <b>δ = 0</b> если цензурировано. Данные: (y<sub>i</sub>, δ<sub>i</sub>).</p>\n <p><b>Типы цензурирования:</b> right (событие ещё не произошло или объект потерян, T &gt; Y; основной тип); left (событие было до начала наблюдения, T ≤ Y); interval (событие в известном интервале, точный момент неизвестен).</p>\n <p><b>Предположение независимого цензурирования:</b> T ⊥ C | covariates. Если более больные выбывают раньше, а мы это игнорируем, выживаемость завышается и сравнение групп искажается.</p>"}, {"k": "num", "h": "Числа: почему простые доли неверны", "b": "<p>88 пациентов с опухолью мозга, 53 живы к концу. Хотим S(20) = P(T &gt; 20 мес.). Дожили после 20 мес: 48.</p>\n <ul class=\"big\"><li>Ошибка 1: 48/88 = 55%. Тем самым считаем всех цензурированных умершими до 20 мес., хотя это неизвестно.</li><li>Ошибка 2: 48/71 = 68% (71 нецензурированный к t = 20). Полностью игнорируем тех, кого цензурировали до 20 мес.</li></ul>\n <p>Нужен метод, использующий и события, и цензурированных: это Каплан–Майер.</p>\n <p><b>Мини-пример KM.</b> 6 пациентов: события в 2, 3, 5, 8; цензура в 4 и 7.</p>\n <table class=\"tbl\"><tr><th>t</th><th>r (в риске)</th><th>q (событий)</th><th>(r−q)/r</th><th>Ŝ(t)</th></tr><tr><td>2</td><td>6</td><td>1</td><td>5/6</td><td>0.833</td></tr><tr><td>3</td><td>5</td><td>1</td><td>4/5</td><td>0.667</td></tr><tr><td>4 (цензура)</td><td>4 → 3</td><td>0</td><td></td><td>0.667</td></tr><tr><td>5</td><td>3</td><td>1</td><td>2/3</td><td>0.444</td></tr><tr><td>7 (цензура)</td><td>2 → 1</td><td>0</td><td></td><td>0.444</td></tr><tr><td>8</td><td>1</td><td>1</td><td>0</td><td>0</td></tr></table>\n <p>Цензурированный остаётся в риске до момента цензурирования, потом удаляется. Медиана: первое t, где Ŝ ≤ 0.5, здесь t = 5.</p>"}, {"k": "proof", "h": "Вывод оценки Каплана–Майера (как у Davide)", "b": "<ol class=\"big\"><li>Пусть d<sub>1</sub> &lt; … &lt; d<sub>K</sub> — уникальные моменты смертей среди нецензурированных. В момент d<sub>k</sub>: <b>q<sub>k</sub></b> — число умерших, <b>r<sub>k</sub></b> — число «в риске» (risk set) непосредственно перед d<sub>k</sub>.</li>\n <li>Разложение по условной вероятности: S(d<sub>k</sub>) = P(T &gt; d<sub>k</sub> | T &gt; d<sub>k−1</sub>)·S(d<sub>k−1</sub>) (так как P(T &gt; d<sub>k</sub> | T ≤ d<sub>k−1</sub>) = 0).</li>\n <li>Повторяя: S(d<sub>k</sub>) = Π<sub>j≤k</sub> P(T &gt; d<sub>j</sub> | T &gt; d<sub>j−1</sub>).</li>\n <li>Каждый множитель оценивается долей выживших в risk set: (r<sub>j</sub> − q<sub>j</sub>)/r<sub>j</sub>.</li>\n <li><b>Итог:</b> Ŝ(t) = Π<sub>d<sub>j</sub> ≤ t</sub> (r<sub>j</sub> − q<sub>j</sub>)/r<sub>j</sub>. Это ступенчатая функция, падает только в моменты событий, между ними постоянна.</li></ol>\n <p>Кривая KM: на графике стартует с 1, ступеньки вниз, пунктирные линии вокруг — полосы стандартной ошибки; можно рисовать несколько кривых (мужчины и женщины).</p>"}, {"k": "formula", "h": "Hazard, плотность, S(t) и правдоподобие", "b": "<table class=\"sym\"><tr><td>S(t) = P(T &gt; t)</td><td>функция выживания, всегда убывающая</td></tr>\n <tr><td>h(t) = lim<sub>Δt→0</sub> P(t &lt; T ≤ t+Δt | T &gt; t)/Δt</td><td>hazard: мгновенный риск события в t для тех, кто дожил до t</td></tr>\n <tr><td>f(t) = lim P(t &lt; T ≤ t+Δt)/Δt</td><td>плотность</td></tr>\n <tr><td><b>h(t) = f(t)/S(t)</b></td><td>вывод: P(t&lt;T≤t+Δt | T&gt;t) = P(t&lt;T≤t+Δt)/P(T&gt;t) (событие t&lt;T≤t+Δt уже включает T&gt;t)</td></tr>\n <tr><td>L<sub>i</sub> = f(y<sub>i</sub>)<sup>δ<sub>i</sub></sup>·S(y<sub>i</sub>)<sup>1−δ<sub>i</sub></sup></td><td>вклад в правдоподобие: плотность если событие, S(y<sub>i</sub>) если цензура</td></tr>\n <tr><td>L = Π h(y<sub>i</sub>)<sup>δ<sub>i</sub></sup>·S(y<sub>i</sub>)</td><td>через hazard (подставили f = hS)</td></tr></table>\n <p><b>Параметрическая модель:</b> экспоненциальная f(t) = λe<sup>−λt</sup> (постоянный hazard), Weibull, Gamma; можно оценить λ максимизацией L. Hazard-модель h(t|x) = exp(β<sub>0</sub> + Σβ<sub>j</sub>x<sub>j</sub>) не зависит от t и слишком жёсткая. Поэтому Кокс.</p>\n <p><b>Почему нельзя регрессию log(Y):</b> для цензурированных Y — лишь нижняя граница T, это систематически занижает времена.</p>"}, {"k": "num", "h": "Числа: log-rank test", "b": "<p>Сравниваем две группы (например, мужчины и женщины) не по средним, а по тому, как идут события. В каждый момент d<sub>k</sub>: r<sub>1k</sub>, r<sub>2k</sub> — в риске по группам, q<sub>k</sub> — всего событий. При H<sub>0</sub> (кривые одинаковы) ожидаемое число событий в группе 1: <b>μ<sub>k</sub> = q<sub>k</sub>·r<sub>1k</sub>/r<sub>k</sub></b>.</p>\n <p>W = Σ(q<sub>1k</sub> − μ<sub>k</sub>) / √(Σ q<sub>k</sub>(r<sub>1k</sub>/r<sub>k</sub>)(1 − r<sub>1k</sub>/r<sub>k</sub>)(r<sub>k</sub>−q<sub>k</sub>)/(r<sub>k</sub>−1)); при больших выборках W ~ N(0,1).</p>\n <p>Мини-пример: три события. Момент 1: r<sub>1</sub>=5, r<sub>2</sub>=5, умер член группы 1: μ = 0.5, q<sub>1</sub>−μ = 0.5, дисперсия 0.25. Момент 2: r<sub>1</sub>=4, r<sub>2</sub>=5, умер из группы 2: μ = 4/9, q<sub>1</sub>−μ = −0.444, дисперсия 0.247. Момент 3: r<sub>1</sub>=4, r<sub>2</sub>=4, умер из группы 1: +0.5, дисперсия 0.25. Числитель 0.556, дисперсия 0.747, W = 0.556/0.864 = <b>0.64</b>, p ≈ 0.52: H<sub>0</sub> не отвергаем.</p>\n <p>В примере лекции (BrainCancer): W = 1.2, p = 0.2, H<sub>0</sub> не отвергается.</p>"}, {"k": "proof", "h": "Модель Кокса и частичное правдоподобие", "b": "<p><b>Модель:</b> h(t|x<sub>i</sub>) = h<sub>0</sub>(t)·exp(Σ<sub>j</sub> x<sub>ij</sub>β<sub>j</sub>). h<sub>0</sub>(t) — baseline hazard (для x = 0), форма не задана, exp(Σxβ) — relative risk. Ковариаты действуют мультипликативно: рост x<sub>j</sub> на 1 умножает hazard на exp(β<sub>j</sub>).</p>\n <p><b>Как оценить β без h<sub>0</sub>:</b></p>\n <ol class=\"big\"><li>В момент события y<sub>i</sub> risk set = {i′ : y<sub>i′</sub> ≥ y<sub>i</sub>}; у каждого hazard h<sub>0</sub>(y<sub>i</sub>)·exp(x<sub>i′</sub>β).</li>\n <li>Вероятность, что умирает именно i: h<sub>0</sub>(y<sub>i</sub>)e<sup>x<sub>i</sub>β</sup> / Σ<sub>i′∈риск</sub> h<sub>0</sub>(y<sub>i</sub>)e<sup>x<sub>i′</sub>β</sup>.</li>\n <li>h<sub>0</sub>(y<sub>i</sub>) общий для всех в risk set и <b>сокращается</b>: e<sup>x<sub>i</sub>β</sup> / Σ e<sup>x<sub>i′</sub>β</sup>.</li>\n <li>Перемножаем по всем событиям: <b>PL(β) = Π<sub>i: δ<sub>i</sub>=1</sub> e<sup>x<sub>i</sub>β</sup> / Σ<sub>i′: y<sub>i′</sub>≥y<sub>i</sub></sub> e<sup>x<sub>i′</sub>β</sup></b>. Не зависит от h<sub>0</sub>, использует только порядок событий.</li>\n <li>Максимизируем PL итеративно (как в логистической регрессии), затем тесты H<sub>0</sub>: β<sub>j</sub> = 0 и доверительные интервалы.</li></ol>\n <p><b>Числа:</b> три пациента, x = (1, 0, 0), события в моменты 1, 2, 3. PL(β) = [e<sup>β</sup>/(e<sup>β</sup>+2)]·[1/2]·[1]. При β = 0.5: 1.6487/3.6487 = 0.452, PL = 0.226.</p>\n <p><b>Пример лекции:</b> пол (мужчины): exp(0.18) ≈ 1.2 (риск на 20% выше, p = 0.61, незначимо); индекс Карновского: exp(−0.05) ≈ 0.95 за единицу (защитный эффект, значим). Это множители hazard, а не вероятности.</p>"}, {"k": "quiz", "q": "Что такое цензурирование справа?", "o": ["событие ещё не произошло к концу наблюдения или объект потерян: T > Y", "событие произошло до начала наблюдения", "событие в известном интервале", "ошибка измерения"], "a": 0, "why": "Right censoring: известно только, что T > Y."}, {"k": "quiz", "q": "Что значит δ = 0?", "o": ["наблюдение цензурировано, мы видим C", "мы видим истинное T", "пациент умер", "пропущенные данные"], "a": 0, "why": "δ = 1 если T ≤ C (событие наблюдено), δ = 0 если T > C."}, {"k": "quiz", "q": "Чему равен hazard h(t)?", "o": ["f(t)/S(t)", "S(t)/f(t)", "1 − S(t)", "f(t)·S(t)"], "a": 0, "why": "Условная плотность события среди доживших до t."}, {"k": "quiz", "q": "Почему в частичном правдоподобии Кокса не нужен h0(t)?", "o": ["он общий для всех в risk set и сокращается", "его задали экспонентой", "его оценили заранее", "он равен 1"], "a": 0, "why": "В числителе и знаменателе стоит один и тот же h0(y_i)."}, {"k": "note", "h": "Тетрадь: survival analysis", "b": "<div class=\"nb\"><div class=\"hd\">Hazard и плотность</div><div class=\"ln\"><div class=\"fm\">h(t) = lim<sub>Δt→0</sub> <span class=\"fr\"><span>P(t &lt; T ≤ t+Δt | T &gt; t)</span><span>Δt</span></span></div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">h(t) = <span class=\"fr\"><span>f(t)</span><span>S(t)</span></span></span></div><div class=\"nt\">условная вероятность = P(A∩B)/P(B)</div></div><div class=\"ln\"><div class=\"fm\">S(t) = P(T &gt; t),   f(t) = −S′(t)</div></div><div class=\"ln\"><div class=\"fm\">h(t) = − <span class=\"fr\"><span>d</span><span>dt</span></span> ln S(t)  ⇒  S(t) = e<sup>−∫h</sup></div></div><div class=\"hd\">Правдоподобие с цензурированием</div><div class=\"ln\"><div class=\"fm\">L<sub>i</sub> = f(y<sub>i</sub>)<sup>δ<sub>i</sub></sup> · S(y<sub>i</sub>)<sup>1−δ<sub>i</sub></sup></div></div><div class=\"ln\"><div class=\"fm\">L = Π h(y<sub>i</sub>)<sup>δ<sub>i</sub></sup> S(y<sub>i</sub>)</div><div class=\"nt\">подставили f = h·S</div></div><div class=\"hd\">Kaplan–Meier</div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">Ŝ(t) = Π<sub>d<sub>j</sub> ≤ t</sub> <span class=\"fr\"><span>r<sub>j</sub> − q<sub>j</sub></span><span>r<sub>j</sub></span></span></span></div><div class=\"nt\">r — в риске, q — событий</div></div><div class=\"hd\">Log-rank</div><div class=\"ln\"><div class=\"fm\">μ<sub>k</sub> = q<sub>k</sub> <span class=\"fr\"><span>r<sub>1k</sub></span><span>r<sub>k</sub></span></span></div><div class=\"nt\"> ожидаемое число событий в группе 1</div></div><div class=\"ln\"><div class=\"fm\">W = <span class=\"fr\"><span>Σ(q<sub>1k</sub> − μ<sub>k</sub>)</span><span>√Σ q<sub>k</sub>(r<sub>1k</sub>/r<sub>k</sub>)(1−r<sub>1k</sub>/r<sub>k</sub>)(r<sub>k</sub>−q<sub>k</sub>)/(r<sub>k</sub>−1)</span></span></div></div><div class=\"hd\">Cox</div><div class=\"ln\"><div class=\"fm\">h(t|x) = h<sub>0</sub>(t) · exp(Σ x<sub>j</sub>β<sub>j</sub>)</div></div><div class=\"ln\"><div class=\"fm\">PL(β) = Π<sub>i: δ<sub>i</sub>=1</sub> <span class=\"fr\"><span>exp(x<sub>i</sub>β)</span><span>Σ<sub>i′: y<sub>i′</sub> ≥ y<sub>i</sub></sub> exp(x<sub>i′</sub>β)</span></span></div><div class=\"nt\">h₀ сократился</div></div></div>"}, {"k": "exam", "h": "Вопросы Davide из конца лекции (кратко)", "b": "<ol class=\"big\"><li><b>Цель survival analysis:</b> моделировать время до события с учётом цензурирования (медицина, надёжность, churn).</li><li><b>Censoring:</b> событие не наблюдено, известно только T &gt; y; нельзя выбросить, нельзя считать событием; типы: right, left, interval.</li><li><b>S(t):</b> вероятность прожить дольше t, убывающая.</li><li><b>Risk set:</b> кто ещё под наблюдением непосредственно перед d<sub>k</sub> (цензурированные включены до момента цензурирования); основа KM, log-rank, Cox.</li><li><b>Hazard vs S:</b> hazard — мгновенная скорость события среди доживших, S — накопленная вероятность дожить.</li><li><b>h<sub>0</sub>(t) не задан:</b> модель гибкая, форма риска во времени любая, β оцениваются через partial likelihood.</li><li><b>Челлендж vs обычная регрессия:</b> Y = min(T,C) занижает T, нужны последовательные методы.</li><li><b>Интуиция Кокса:</b> общий baseline hazard, ковариаты умножают его на exp(xβ).</li></ol>"}], "part": "Часть 6 · Davide: модели и классификация"}, {"id": "hier", "title": "27. Иерархические (multilevel) модели", "goal": "Вложенные данные, random effects, ICC/VPC, IGLS, shrinkage.", "cards": [{"k": "story", "h": "Зачем", "b": "<p>Данные вложены: студенты ⊂ школы, пациенты ⊂ клиники, повторные измерения одного человека. Объекты внутри группы <b>зависимы</b> (общий учитель, среда): Cov(Y<sub>i</sub>, Y<sub>j</sub>) ≠ 0. Обычная регрессия предполагает независимость, поэтому <b>занижает стандартные ошибки</b>, переоценивает информацию и даёт «ложную» значимость. 30 студентов в одном классе ≠ 30 студентов в 30 классах: группы сами являются статистическими единицами.</p>\n <p><b>Уровни:</b> level 1 — индивиды (студенты), level 2 — группы (школы), level 3 — ещё выше (учителя, регионы). Level 1 variation — разброс индивидов внутри группы; level 2 variation — разброс между группами (разные intercept и slope у школ).</p>"}, {"k": "proof", "h": "Построение двухуровневой модели", "b": "<ol class=\"big\"><li>Для одной школы: y<sub>i</sub> = α + βx<sub>i</sub> + e<sub>i</sub>. Для школы j: y<sub>ij</sub> = β<sub>0j</sub> + β<sub>1j</sub>x<sub>ij</sub> + e<sub>ij</sub>, e<sub>ij</sub> ~ N(0, σ<sub>e</sub>²).</li>\n <li><b>Random coefficients:</b> β<sub>0j</sub> = β<sub>0</sub> + u<sub>0j</sub>, β<sub>1j</sub> = β<sub>1</sub> + u<sub>1j</sub>; E(u) = 0, Var(u<sub>0j</sub>) = σ<sub>u0</sub>², Var(u<sub>1j</sub>) = σ<sub>u1</sub>², Cov(u<sub>0j</sub>,u<sub>1j</sub>) = σ<sub>u01</sub>.</li>\n <li>Подстановка: <b>y<sub>ij</sub> = β<sub>0</sub> + β<sub>1</sub>x<sub>ij</sub> + (u<sub>0j</sub> + u<sub>1j</sub>x<sub>ij</sub> + e<sub>ij</sub>)</b>: fixed part (β<sub>0</sub> + β<sub>1</sub>x) и random part (в скобках). E(Y) = Xβ.</li>\n <li>Простейшая <b>variance components model</b>: y<sub>ij</sub> = β<sub>0</sub> + u<sub>0j</sub> + e<sub>0ij</sub>. Var(y<sub>ij</sub>) = σ<sub>u0</sub>² + σ<sub>e0</sub>²; Cov двух студентов одной школы = σ<sub>u0</sub>² (общий u<sub>0j</sub>).</li>\n <li><b>ICC (intra-class correlation) = VPC:</b> ρ = σ<sub>u0</sub>²/(σ<sub>u0</sub>² + σ<sub>e0</sub>²) — корреляция двух студентов одной школы и доля общей дисперсии, приходящаяся на различия между группами.</li>\n <li>Ковариационная матрица <b>блочно-диагональна</b>: зависимость внутри группы, независимость между. Блок для группы: V = σ<sub>u0</sub>²J + σ<sub>e0</sub>²I (J — матрица единиц, I — единичная).</li></ol>"}, {"k": "num", "h": "Числа: ICC и поправка к SE", "b": "<p>Клиники: σ<sub>u</sub>² = 4.5, σ<sub>e</sub>² = 22 ⇒ VPC = 4.5/(4.5+22) = <b>0.17</b>: 17% остаточной вариации объясняются различиями клиник, 83% — различиями пациентов внутри клиники.</p>\n <p>Поправка OLS-ошибки: SE умножается на <b>√(1 + ρ<sub>y</sub>ρ<sub>x</sub>(n−1))</b>, ρ<sub>y</sub>, ρ<sub>x</sub> — ICC для Y и X, n — размер группы. При ρ<sub>y</sub> = ρ<sub>x</sub> = 0.2, n = 76: √(1 + 0.04·75) = √4 = <b>2</b> — OLS занижает SE вдвое. При n = 1 или ρ = 0 поправка 1 и OLS допустим.</p>\n <p><b>Shrinkage:</b> предсказанный эффект группы û<sub>0j</sub> = R<sub>j</sub>·ỹ<sub>j</sub>, R<sub>j</sub> = σ<sub>u0</sub>²/(σ<sub>u0</sub>² + σ<sub>e0</sub>²/n<sub>j</sub>). Среднее остатков группы ỹ<sub>j</sub> = 3: при n<sub>j</sub> = 1: R = 4.5/26.5 = 0.17, û = 0.51; при n<sub>j</sub> = 10: R = 0.67, û = 2.02; при n<sub>j</sub> = 100: R = 0.95, û = 2.86. Малые группы сильнее «подтягиваются» к общему среднему.</p>"}, {"k": "formula", "h": "Оценивание: GLS и IGLS", "b": "<p>Если дисперсии известны: <b>GLS</b> β̂ = (XᵀV⁻¹X)⁻¹XᵀV⁻¹Y (даёт больший вес надёжным наблюдениям, учитывает кластеризацию).</p>\n <p>Если неизвестны — <b>IGLS</b> (iterative generalized least squares):</p>\n <ol class=\"big\"><li>Старт с OLS, берём остатки ỹ<sub>ij</sub> = y<sub>ij</sub> − (β̂<sub>0</sub> + β̂<sub>1</sub>x<sub>ij</sub>).</li><li>Так как E(ỸỸᵀ) = V, оцениваем дисперсии <b>регрессией</b> квадратов и произведений остатков на матрицы структуры групп (получаем σ<sub>u0</sub>², σ<sub>e0</sub>²).</li><li>Fixed effects step: обновляем β по GLS при текущих дисперсиях; random effects step: обновляем дисперсии при текущем β.</li><li>Повторяем до сходимости ⇒ <b>MLE</b>.</li></ol>\n <p>ML в малых выборках занижает компоненты дисперсии; поправка — <b>REML</b>. Residuals: level 1 — для диагностики, level 2 — часто представляют самостоятельный интерес («borrowing strength»).</p>\n <p><b>Сложные дисперсии:</b> level-2 дисперсия при random slope: Var(u<sub>0j</sub> + u<sub>1j</sub>x) = σ<sub>u0</sub>² + 2σ<sub>u01</sub>x + σ<sub>u1</sub>²x² (квадратичная функция x). Level 1: Var = σ<sub>e0</sub>² + 2σ<sub>e01</sub>x + σ<sub>e1</sub>²x² (гетероскедастичность, например ceiling effect). Проблема отрицательных дисперсий решается нелинейными функциями (e<sup>f(x)</sup>) или ограничениями на σ<sub>e01</sub>.</p>\n <p><b>Multilevel GLM:</b> π<sub>ij</sub> = f(Xβ)<sub>ij</sub>; доли: Binomial + logit/probit; счёты: Poisson + log (+ offset ln M<sub>j</sub>); для категорий multinomial logit.</p>"}, {"k": "quiz", "q": "Что такое ICC/VPC?", "o": ["доля дисперсии, обусловленная различиями между группами", "корреляция X и Y", "доля объяснённой R²", "число уровней"], "a": 0, "why": "ρ = σ_u²/(σ_u² + σ_e²)."}, {"k": "quiz", "q": "Что делает OLS с кластеризованными данными?", "o": ["занижает стандартные ошибки", "завышает стандартные ошибки", "ничего", "делает оценки смещёнными всегда"], "a": 0, "why": "Игнорирует зависимость внутри групп: доверительные интервалы слишком узкие, тесты слишком либеральны."}, {"k": "quiz", "q": "Большая группа (n_j велико). Что происходит с shrinkage?", "o": ["почти нет, û ≈ среднему остатков группы", "сильное сжатие к 0", "û = 0", "û удваивается"], "a": 0, "why": "R_j → 1 при росте n_j."}, {"k": "note", "h": "Тетрадь: multilevel модель", "b": "<div class=\"nb\"><div class=\"hd\">Двухуровневая модель</div><div class=\"ln\"><div class=\"fm\">y<sub>ij</sub> = β<sub>0j</sub> + β<sub>1j</sub>x<sub>ij</sub> + e<sub>ij</sub></div></div><div class=\"ln\"><div class=\"fm\">β<sub>0j</sub> = β<sub>0</sub> + u<sub>0j</sub>,   β<sub>1j</sub> = β<sub>1</sub> + u<sub>1j</sub></div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">y<sub>ij</sub> = β<sub>0</sub> + β<sub>1</sub>x<sub>ij</sub> + (u<sub>0j</sub> + u<sub>1j</sub>x<sub>ij</sub> + e<sub>ij</sub>)</span></div><div class=\"nt\">fixed part + random part</div></div><div class=\"hd\">ICC / VPC</div><div class=\"ln\"><div class=\"fm\">Var(y<sub>ij</sub>) = σ<sub>u0</sub>² + σ<sub>e0</sub>²</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">ρ = <span class=\"fr\"><span>σ<sub>u0</sub>²</span><span>σ<sub>u0</sub>² + σ<sub>e0</sub>²</span></span></span></div><div class=\"nt\">доля дисперсии между группами</div></div><div class=\"hd\">Поправка SE и shrinkage</div><div class=\"ln\"><div class=\"fm\">SE<sub>true</sub> = SE<sub>OLS</sub> · √(1 + ρ<sub>y</sub>ρ<sub>x</sub>(n − 1))</div></div><div class=\"ln\"><div class=\"fm\">R<sub>j</sub> = <span class=\"fr\"><span>σ<sub>u0</sub>²</span><span>σ<sub>u0</sub>² + σ<sub>e0</sub>²/n<sub>j</sub></span></span>,   û<sub>0j</sub> = R<sub>j</sub>·ỹ<sub>j</sub></div></div><div class=\"hd\">GLS</div><div class=\"ln\"><div class=\"fm\">β̂ = (XᵀV⁻¹X)⁻¹ XᵀV⁻¹ Y</div></div></div>"}, {"k": "exam", "h": "Эталонный ответ: Hierarchical models", "b": "<p>Иерархические данные: единицы вложены в группы (студенты в школах), внутри группы коррелированы. OLS предполагает независимость и поэтому занижает SE, даёт ложно значимые результаты.</p>\n <p>Multilevel модель: y<sub>ij</sub> = β<sub>0</sub> + β<sub>1</sub>x<sub>ij</sub> + (u<sub>0j</sub> + u<sub>1j</sub>x<sub>ij</sub> + e<sub>ij</sub>); fixed part описывает среднюю зависимость, random part — вариацию на уровне групп (random intercept, random slope) и индивидов. ICC = σ<sub>u0</sub>²/(σ<sub>u0</sub>² + σ<sub>e0</sub>²). Оценка: GLS при известных дисперсиях; IGLS (итерации между β и дисперсиями) даёт ML, REML для малых выборок. Residuals уровня 2 предсказываются с shrinkage R<sub>j</sub> = σ<sub>u0</sub>²/(σ<sub>u0</sub>² + σ<sub>e0</sub>²/n<sub>j</sub>), малые группы сжимаются к среднему («borrowing strength»). Расширения: сложные дисперсии и multilevel GLM (logit, Poisson с offset).</p>"}], "part": "Часть 6 · Davide: модели и классификация"}];

const GL={"∇":"Набла ∇f (градиент) — вектор всех частных производных (df/dx₁, …, df/dxₙ); показывает, куда f растёт быстрее всего. Для одной переменной это обычная производная df/dx.","SSR": "Sum of Squared Residuals — сумма квадратов остатков Σ(y − ŷ)². Это то, что минимизирует МНК. Осторожно: в некоторых учебниках SSR = «regression sum of squares» (объяснённая часть); у профессора SSR = остатки, в Davide та же сумма называется RSS/SSE.", "SSE": "Sum of Squared Errors — сумма квадратов ошибок. То же, что SSR (остатки), в большинстве учебников.", "RSS": "Residual Sum of Squares — то же, что SSR остатков.", "SST": "Total Sum of Squares — полная сумма квадратов Σ(y − ȳ)²: общий разброс y вокруг своего среднего. SST = SSR + SSM.", "TSS": "Total Sum of Squares — то же, что SST.", "SSM": "Model (explained) sum of squares Σ(ŷ − ȳ)² — часть разброса, объяснённая моделью (в других книгах ESS или SSR).", "MSE": "Mean Squared Error = SSR/N — средний квадрат ошибки.", "RMSE": "Root MSE = √MSE — корень из MSE, в тех же единицах, что y.", "MAE": "Mean Absolute Error — среднее модулей ошибок, менее чувствительно к выбросам.", "R²": "Коэффициент детерминации = 1 − SSR/SST: доля дисперсии y, объяснённая моделью. Для простой регрессии равен ρ².", "OLS": "Ordinary Least Squares — обычный метод наименьших квадратов: a = (XᵀX)⁻¹Xᵀy.", "МНК": "Метод наименьших квадратов (Least Squares Method, LSM): подбираем параметры, минимизируя сумму квадратов остатков.", "LSM": "Least Squares Method — метод наименьших квадратов (МНК).", "WLS": "Weighted Least Squares — взвешенный МНК: каждый остаток умножается на вес (при разной дисперсии ошибок).", "GLS": "Generalized Least Squares — обобщённый МНК для коррелированных ошибок или разной дисперсии.", "ŷ": "y с «крышкой» — предсказанное моделью значение (fitted value).", "остаток": "Residual r = y − ŷ: факт минус прогноз.", "slope": "Наклон прямой (в записи профессора α, у Davide β₁).", "intercept": "Свободный член прямой — значение y при x = 0 (в записи профессора β, у Davide β₀).", "Hessian": "Гессиан — матрица вторых производных H = d²f/dxᵢdxⱼ; описывает кривизну.", "Гессиан": "Матрица вторых производных функции H = d²f/dxᵢdxⱼ; описывает кривизну.", "Jacobian": "Якобиан — матрица первых производных вектор-функции Jij = drᵢ/daⱼ.", "Якобиан": "Матрица первых производных вектор-функции Jᵢⱼ = drᵢ/daⱼ.", "ISLR": "An Introduction to Statistical Learning — учебник (James, Witten, Hastie, Tibshirani), по нему программа Davide.", "AIC": "Akaike information criterion: 2p − 2ln L, меньше = лучше; штраф за число параметров p.", "BIC": "Bayesian information criterion: p·ln N − 2ln L; штраф строже AIC.", "VIF": "Variance Inflation Factor = 1/(1 − R²ⱼ): показывает мультиколлинеарность; VIF > 5–10 — проблема.", "CV": "1) Cross-Validation — перекрёстная проверка; 2) Coefficient of Variation = σ/μ — коэффициент вариации.", "LOO": "Leave-One-Out cross-validation — k-fold при k = N: каждый раз одна точка в тесте.", "LOOCV": "Leave-One-Out Cross-Validation — перекрёстная проверка по одной точке.", "LpO": "Leave-p-Out cross-validation — перебираем все наборы по p точек в тесте, C(N,p) моделей.", "holdout": "Простое одно разбиение на train и test.", "k-fold": "Делим данные на k частей; k раз обучаемся на k−1 и тестируем на оставшейся.", "train": "Обучающая выборка — на ней подбираем параметры.", "test": "Тестовая выборка — на ней оцениваем ошибку на новых данных.", "bootstrap": "Бутстрэп: многократная выборка с возвращением из данных для оценки неопределённости.", "IQR": "Interquartile range = Q₃ − Q₁ — межквартильный размах.", "MAD": "Median Absolute Deviation — медиана |x − медиана|, робастная мера разброса.", "σ": "Стандартное отклонение — корень из дисперсии.", "ρ": "Коэффициент корреляции ρ = cov/(σₓσ_y) ∈ [−1, 1].", "cov": "Ковариация — совместная изменчивость двух величин.", "var": "Дисперсия — средний квадрат отклонения от среднего.", "μ": "Среднее значение (математическое ожидание).", "N−1": "Поправка Бесселя: делим на N − function nbSplit(h,sep){let d=0,t=0,out=[],last=0;for(let i=0;i<h.length;i++){const c=h[i];if(c==='<')t++;else if(c==='>')t--;else if(!t){if(c==='(')d++;else if(c===')')d--;else if(!d&&h.startsWith(sep,i)){out.push(h.slice(last,i));last=i+sep.length;i+=sep.length-1}}}out.push(h.slice(last));return out}
function nbConv(h){
  h=h.replace(/([A-Za-zα-ωΑ-Ω])̄/g,'<span class="ov">$1</span>');
  const eq=nbSplit(h,' = ');let rhs=eq.pop();const p=nbSplit(rhs,' / ');
  if(p.length===2){rhs='<span class="fr"><span>'+p[0].trim()+'</span><span>'+p[1].trim()+'</span></span>'}
  h=eq.concat([rhs]).join(' = ');
  h=h.replace(/Σ<sub>([^<>]*)<\/sub>/g,'<span class="sm"><span style="visibility:hidden">.</span><b>Σ</b><span>$1</span></span>');
  return h}
function nbify(){document.querySelectorAll('.card:not(.fin) table.sym td:first-child').forEach(td=>{if(td.dataset.nb)return;td.dataset.nb=1;if(/[=Σ∇√]/.test(td.textContent)){td.innerHTML=nbConv(td.innerHTML);td.classList.add('nbf')}});

const PREF=['робастн','цензур','L-гладк'];
const GLK=Object.keys(GL).sort((a,b)=>b.length-a.length);
function glEsc(x){return x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function glossify(){
  const o=document.getElementById('glp');if(o)o.remove();
  if(cur==='gl')return;
  document.querySelectorAll('#view .card').forEach(card=>{
    const used={};
    const w=document.createTreeWalker(card,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return(!p||p.closest('abbr,button,.opt,h3,.kind,script,style,.fm'))?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}});
    const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
    nodes.forEach(n=>{
      let txt=n.nodeValue,hit=null;
      for(const k of GLK){
        if(used[k])continue;
        const re=new RegExp('(?<![\\wА-Яа-яёЁ])'+glEsc(k)+(PREF.includes(k)?'':'(?![\\wА-Яа-яёЁ])'));
        const m=re.exec(txt);
        if(m&&(!hit||m.index<hit.i))hit={k,i:m.index,len:m[0].length}
      }
      if(!hit)return;
      used[hit.k]=1;
      const sp=document.createElement('abbr');sp.className='gl';sp.dataset.d=GL[hit.k];sp.title=GL[hit.k];sp.textContent=txt.substr(hit.i,hit.len);
      const after=document.createTextNode(txt.slice(hit.i+hit.len));
      n.nodeValue=txt.slice(0,hit.i);n.parentNode.insertBefore(sp,n.nextSibling);n.parentNode.insertBefore(after,sp.nextSibling);
    });
  });
}

  view.innerHTML=`<div class="tag">${f(u.of,Ts.indexOf(t),Ts.length-1)}</div><h2 class="tp">${t.title}</h2><p class="goal">${t.goal}</p><div class="dots">${dots}</div>${body}${last?'':`<div class="nav"><button class="btn ghost" id="prev" ${i===0?'disabled':''}>${u.prev}</button><button class="btn" id="next" ${canNext?'':'disabled'}>${i===t.cards.length-1?u.finish:u.next}</button></div>`}`;
  nbify();glossify();
  view.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.quiz[qkey(t,i)]=+b.dataset.j;save();render()});
  const nx=document.getElementById('next');if(nx)nx.onclick=()=>{S.pos[t.id]=i+1;if(i+1>=t.cards.length)S.done[t.id]=true;save();render();renderSide();window.scrollTo(0,0)};
  const pv=document.getElementById('prev');if(pv)pv.onclick=()=>{S.pos[t.id]=Math.max(0,i-1);save();render()};
  const ag=document.getElementById('again');if(ag)ag.onclick=()=>{S.pos[t.id]=0;t.cards.forEach((c,j)=>delete S.quiz[qkey(t,j)]);save();render()};
  const nt=document.getElementById('nxt');if(nt)nt.onclick=()=>go(Ts[Ts.indexOf(t)+1].id);
}
document.getElementById('menu').onclick=()=>side.classList.toggle('open');
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem('study-lang',lang)}catch(e){}renderSide();render()});
const h=(location.hash||'').slice(1);
if(TOPICS.some(t=>t.id===h))cur=h;else if(S.last&&TOPICS.some(t=>t.id===S.last))cur=S.last;
window.addEventListener('hashchange',()=>{const x=location.hash.slice(1);if(TOPICS.some(t=>t.id===x)&&x!==cur)go(x)});
renderSide();render();
</script></body></html>
