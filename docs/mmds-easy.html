<script>
/* тема: auto | light | dark, хранится в study-theme (синхронизируется с Telegram) */
(function(){
  var R=document.documentElement, m='auto';
  try{m=localStorage.getItem('study-theme')||'auto'}catch(e){}
  function sys(){var w=window.Telegram&&Telegram.WebApp; if(w&&w.initData&&w.colorScheme) return w.colorScheme; return (window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light'}
  function apply(){
    var r=m==='auto'?sys():m; R.setAttribute('data-theme',r); R.style.colorScheme=r;
    var b=document.querySelector('.themebtn'); if(b){b.textContent=m==='auto'?'◐':(m==='dark'?'☾':'☀'); b.title={auto:'Тема: авто',light:'Тема: светлая',dark:'Тема: тёмная'}[m]; b.setAttribute('aria-label',b.title)}
    try{var w=window.Telegram&&Telegram.WebApp; if(w&&w.initData){w.setHeaderColor&&w.setHeaderColor(r==='dark'?'#121315':'#FBFBFA'); w.setBackgroundColor&&w.setBackgroundColor(r==='dark'?'#121315':'#FBFBFA')}}catch(e){}
  }
  window.__theme={get:function(){return m},apply:apply,cycle:function(){m=m==='auto'?'light':(m==='light'?'dark':'auto'); try{localStorage.setItem('study-theme',m)}catch(e){} apply()}};
  apply();
  function mount(){
    apply();
    if(document.querySelector('.themebtn')) return;
    var anchor=document.querySelector('[data-langsw]'); if(!anchor) return;
    var b=document.createElement('button'); b.type='button'; b.className='themebtn'; b.onclick=function(){window.__theme.cycle()};
    anchor.parentNode.insertBefore(b,anchor); apply();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',mount); else mount();
  window.addEventListener('load',apply);
  try{matchMedia('(prefers-color-scheme:dark)').addEventListener('change',apply)}catch(e){}
  /* если Telegram подтянул более новый study-theme из облака, страница перезагрузится синхронизацией */
})();
</script>

<script>
/* JulYera study sync: Telegram CloudStorage <-> localStorage, вход только через бота */
(function(){
  var BOT_URL='https://t.me/dsstudyhub_bot';                 // ссылка на бота, например https://t.me/ИМЯ_БОТА
  var PFX=/^(imsds-|mmmds-|aacm-|study-)/, CH=3500, tg=window.Telegram&&Telegram.WebApp;
  var inTg=!!(tg&&tg.initData);
  var dev=false; try{ if(/[?&]dev=1/.test(location.search)) sessionStorage.setItem('dev','1'); dev=sessionStorage.getItem('dev')==='1'; }catch(e){}
  var origSet=Storage.prototype.setItem;
  function gate(){
    if(inTg||dev) return;
    var s=document.createElement('style');
    s.textContent='#gate{position:fixed;inset:0;z-index:99999;background:#FBFBFA;color:#17181C;display:grid;place-items:center;padding:24px;text-align:center;font:16px/1.5 Onest,system-ui,sans-serif}#gate b{display:block;font:600 22px Unbounded,sans-serif;margin-bottom:10px}#gate p{max-width:34ch;margin:0 auto 18px;color:#5D5F69}#gate a{display:inline-block;background:#557546;color:#fff;text-decoration:none;padding:12px 22px;border-radius:999px;font-weight:600}';
    document.head.appendChild(s);
    function mk(){ var d=document.createElement('div'); d.id='gate'; d.innerHTML='<div><b>JulYera study hub</b><p>Обучалки открываются только через Telegram-бота: так прогресс привязан к твоему аккаунту.</p>'+(BOT_URL?'<a href="'+BOT_URL+'">Открыть бота</a>':'')+'</div>'; document.body.appendChild(d); document.body.style.overflow='hidden'; }
    if(document.body) mk(); else document.addEventListener('DOMContentLoaded',mk);
  }
  /* gate() отключён: сайт открывается и без бота, прогресс хранится в браузере, в Telegram синхронизируется */
  if(!inTg) return;
  try{ tg.ready(); tg.expand(); }catch(e){}
  var cs=tg.CloudStorage, timers={};
  function lsKeys(){ var o=[]; for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(PFX.test(k)) o.push(k); } return o; }
  function push(k){
    var v=localStorage.getItem(k); if(v==null) return;
    var ts=+localStorage.getItem('__ts_'+k)||Date.now(), n=Math.max(1,Math.ceil(v.length/CH));
    for(var i=0;i<n;i++) cs.setItem(k+'_'+i, v.slice(i*CH,(i+1)*CH));
    cs.setItem(k+'_m', JSON.stringify({n:n,ts:ts}));
  }
  Storage.prototype.setItem=function(k,v){
    origSet.call(this,k,v);
    if(this===localStorage && PFX.test(k) && k.indexOf('__ts_')!==0){
      origSet.call(this,'__ts_'+k,String(Date.now()));
      clearTimeout(timers[k]); timers[k]=setTimeout(function(){push(k)},1500);
    }
  };
  document.addEventListener('visibilitychange',function(){ if(document.hidden) lsKeys().forEach(push); });
  cs.getKeys(function(err,keys){
    if(err||!keys) return;
    var metas=keys.filter(function(x){return /_m$/.test(x)}), left=metas.length, changed=false, seen={};
    function finish(){
      lsKeys().forEach(function(k){ if(!seen[k]) push(k); });
      var done=false; try{ done=sessionStorage.getItem('synced')==='1'; }catch(e){}
      if(changed && !done){ try{sessionStorage.setItem('synced','1');}catch(e){} location.reload(); }
    }
    if(!left) return finish();
    metas.forEach(function(mk){
      var k=mk.slice(0,-2); seen[k]=1;
      cs.getItem(mk,function(e,mv){
        var m={}; try{m=JSON.parse(mv)}catch(x){}
        var lts=+localStorage.getItem('__ts_'+k)||0;
        if(m.ts>lts && m.n){
          var names=[]; for(var i=0;i<m.n;i++) names.push(k+'_'+i);
          cs.getItems(names,function(e2,vals){
            if(!e2&&vals){ var s=''; names.forEach(function(nm){ s+=vals[nm]||''; });
              if(s && s!==localStorage.getItem(k)){ origSet.call(localStorage,k,s); changed=true; }
              origSet.call(localStorage,'__ts_'+k,String(m.ts)); }
            if(--left===0) finish();
          });
        } else { if(lts>m.ts) push(k); if(--left===0) finish(); }
      });
    });
  });
})();
</script>

<script>
const ANS = {
reg:`<p><b>Linear regression.</b> Линейная регрессия моделирует зависимость y от x прямой y = αx + β + r, где α — наклон (slope), β — свободный член (intercept), r — остаток (ошибка).</p>
<p><b>Остаток</b> r<sub>i</sub> = y<sub>i</sub> − αx<sub>i</sub> − β. Параметры выбираются так, чтобы минимизировать сумму квадратов остатков E(α,β) = Σr<sub>i</sub>².</p>
<p><b>Вывод.</b> ∂E/∂β = 0 даёт β = ȳ − αx̄. ∂E/∂α = 0 после подстановки β даёт α = Σ(x<sub>i</sub>−x̄)(y<sub>i</sub>−ȳ) / Σ(x<sub>i</sub>−x̄)² = cov(x,y)/var(x). Гессиан положительно определён (определитель 4N·S<sub>xx</sub> &gt; 0), значит это единственный минимум.</p>
<p><b>Пример.</b> x = 1..5, y = 2,4,5,4,5: α = 6/10 = 0.6, β = 4 − 0.6·3 = 2.2, SSR = 2.4.</p>
<p><b>Alpha / Beta (в обозначениях лекции):</b> α = slope = cov(x,y)/var(x), β = intercept = mean(y) − α·mean(x). Прямая проходит через (x̄, ȳ).</p>`,
err:`<p><b>Sum of Squared Residuals (SSR/SSE).</b> SSR = Σ<sub>i=1..N</sub> r<sub>i</sub>² = Σ(y<sub>i</sub> − f(x<sub>i</sub>,α))² — функция E(α), которую минимизирует метод наименьших квадратов. Возведение в квадрат убирает знаки, штрафует большие ошибки сильнее и делает функцию гладкой и выпуклой (для линейной модели).</p>
<p><b>MSE</b> = SSR/N — средний квадрат ошибки (RMSE = √MSE в единицах y). Для тестовых данных это основной критерий качества прогноза.</p>
<p><b>R²</b> = 1 − SSR/SST, где SST = Σ(y<sub>i</sub>−ȳ)². Вывод: SST = SSR + Σ(ŷ<sub>i</sub>−ȳ)², потому что остатки ортогональны ŷ − ȳ.</p>
<p><b>Пример:</b> остатки −0.8; 0.6; 1.0; −0.6; −0.2 → SSR = 2.4, MSE = 0.48, SST = 6, R² = 0.6.</p>`,
ols:`<p><b>OLS (Ordinary Least Squares)</b> — метод наименьших квадратов: из всех параметров выбирается вектор a, минимизирующий E(a) = ‖y − Xa‖².</p>
<p><b>Вывод.</b> E = yᵀy − 2aᵀXᵀy + aᵀXᵀXa. Градиент: ∇E = −2Xᵀy + 2XᵀXa = 0 ⇒ нормальные уравнения <b>XᵀXa = Xᵀy</b> ⇒ <b>a = (XᵀX)⁻¹Xᵀy</b> (при rank X = p). Гессиан 2XᵀX положительно определён ⇒ единственный глобальный минимум.</p>
<p><b>Геометрия:</b> Xᵀ(y − Xa) = 0, остатки ортогональны столбцам X, ŷ = Xa — проекция y на пространство столбцов. В простой регрессии это даёт α = cov(x,y)/var(x), β = ȳ − αx̄.</p>
<p><b>Пример:</b> XᵀX = [[55,15],[15,5]], Xᵀy = [66,20] ⇒ α = 0.6, β = 2.2.</p>`,
poly:`<p><b>Polynomial regression.</b> Модель y = α<sub>0</sub> + α<sub>1</sub>x + … + α<sub>p</sub>x<sup>p</sup> + r нелинейна по x, но <b>линейна по параметрам α</b>, поэтому это частный случай множественной линейной регрессии.</p>
<p><b>Как считать:</b> 1) выбрать степень p; 2) построить матрицу Вандермонда X (X<sub>ij</sub> = x<sub>i</sub><sup>j</sup>, j = 0..p); 3) составить нормальные уравнения XᵀXα = Xᵀy; 4) решить α = (XᵀX)⁻¹Xᵀy; 5) вычислить SSR; 6) выбрать степень по cross-validation (на обучающих данных SSR падает с ростом p, при p = N−1 кривая проходит через все точки, но переобучена).</p>
<p><b>Пример:</b> точки (−1,2), (0,1), (1,2), (2,5), p = 2 ⇒ XᵀX = [[4,2,6],[2,6,8],[6,8,18]], Xᵀy = [10,10,24] ⇒ α = (1,0,1), y = x² + 1.</p>`,
res:`<p><b>Resampling</b> — повторное разбиение данных на обучающую и тестовую части для оценки способности модели предсказывать новые данные (ошибка на обучающих данных занижена и приводит к переобучению).</p>
<p><b>Методы (лекция):</b> holdout (одно разбиение); leave-p-out (все C(N,p) разбиений, слишком дорого); leave-one-out (N моделей); k-fold (данные на k частей, каждая по разу тест, k моделей; k = N совпадает с LOO). Оценка = среднее ошибок на тестовых частях.</p>
<p><b>Применение:</b> выбор степени полинома, числа признаков, гиперпараметров — берут вариант с минимальной CV-ошибкой.</p>
<p><b>Bootstrap</b> (общая теория): выборка с возвращением, каждая точка попадает с вероятностью 1 − (1 − 1/N)<sup>N</sup> → 1 − e<sup>−1</sup> ≈ 0.632.</p>`,
sel:`<p><b>Forward / backward selection</b> — жадные методы выбора признаков в регрессии, когда перебор всех 2<sup>p</sup> подмножеств невозможен.</p>
<p><b>Forward:</b> старт с пустой модели; на каждом шаге добавляем признак, дающий наибольшее улучшение критерия; останавливаемся, когда улучшения нет. <b>Backward:</b> старт со всех признаков; на каждом шаге удаляем наименее полезный; останавливаемся, когда удаление ухудшает критерий. <b>Stepwise</b> — комбинация.</p>
<p><b>Критерии:</b> adjusted R², AIC = N ln(SSR/N) + 2k, BIC = N ln(SSR/N) + k ln N, CV-ошибка, F-тест. Нельзя использовать обычные SSR/R² (они улучшаются при добавлении любого признака).</p>
<p><b>Минусы:</b> жадность (не гарантирует лучший набор), backward требует N &gt; p, мультиколлинеарность. (Тема не из слайдов, это общая теория.)</p>`,
jac:`<p><b>Jacobian.</b> Матрица первых частных производных. Для F: ℝⁿ → ℝᵐ: J<sub>ij</sub> = ∂F<sub>i</sub>/∂x<sub>j</sub> (m×n). В подгонке модели y = f(x,α): J<sub>ij</sub> = ∂f(x<sub>i</sub>,α)/∂α<sub>j</sub> (N×p). Даёт линейное приближение F(x+d) ≈ F(x) + J d.</p>
<p><b>Нелинейный МНК (Gauss–Newton).</b> Нормальные уравнения нелинейны по α, замкнутого решения нет ⇒ итерации α<sup>k+1</sup> = α<sup>k</sup> + Δα. Линеаризуем f по Тейлору: f(x<sub>i</sub>,α) ≈ f(x<sub>i</sub>,α<sup>k</sup>) + Σ J<sub>ij</sub>Δα<sub>j</sub>. Тогда r ≈ Δy − JΔα, Δy<sub>i</sub> = y<sub>i</sub> − f(x<sub>i</sub>,α<sup>k</sup>). Минимизация ‖Δy − JΔα‖² даёт <b>JᵀJ Δα = JᵀΔy</b>. J пересчитывается на каждой итерации (можно численно конечными разностями).</p>
<p><b>Проблемы:</b> нужен хороший начальный α⁰, возможны локальные минимумы и расходимость.</p>`,
gd:`<p><b>Gradient descent</b> — итерационный метод минимизации дифференцируемой f: <b>x<sub>k+1</sub> = x<sub>k</sub> − t·∇f(x<sub>k</sub>)</b>, t &gt; 0 — длина шага.</p>
<p><b>Вывод:</b> f(x+d) ≈ f(x) + ∇fᵀd; по неравенству Коши–Буняковского ∇fᵀd ≥ −‖∇f‖‖d‖ с равенством при d = −∇f/‖∇f‖, значит антиградиент — направление наискорейшего убывания.</p>
<p><b>Сходимость:</b> для квадратичной f ошибка умножается на (I − tA), сходимость при 0 &lt; t &lt; 2/λ<sub>max</sub>; скорость линейная с множителем (κ−1)/(κ+1), κ = λ<sub>max</sub>/λ<sub>min</sub>. Для L-гладкой выпуклой f при t = 1/L: f(x<sub>k</sub>) − f* ≤ L‖x<sub>0</sub>−x*‖²/(2k) (сублинейно).</p>
<p><b>Улучшения:</b> line search (Wolfe), heavy ball, conjugate gradient, метод Ньютона.</p>`,
newton:`<p><b>Newton method.</b> Метод второго порядка. В точке x<sub>k</sub> функцию заменяют квадратичной моделью m(d) = f + ∇fᵀd + ½dᵀHd. При H ≻ 0 минимум модели: ∇m = ∇f + Hd = 0 ⇒ <b>d = −H⁻¹∇f</b> (ньютоновское направление), x<sub>k+1</sub> = x<sub>k</sub> + αd, «естественный» шаг α = 1. Это направление убывания: ∇fᵀd = −∇fᵀH⁻¹∇f &lt; 0.</p>
<p><b>Сходимость:</b> если Гессиан липшицев (L), H(x*) ⪰ mI и ‖x₀−x*‖ ≤ m/(2L), то ‖x<sub>k+1</sub>−x*‖ ≤ (L/m)‖x<sub>k</sub>−x*‖² — квадратичная (локальная); глобально нужен line search с условиями Вольфе.</p>
<p><b>Плюсы/минусы:</b> быстро вблизи решения (для квадратичных функций за 1 шаг), но нужен Гессиан (дорого, O(n³)), требуется H ≻ 0.</p>
<p><b>1D:</b> x<sub>k+1</sub> = x<sub>k</sub> − f′/f″; пример √2: 1 → 1.5 → 1.4167 → 1.41422.</p>`,
pca:`<p><b>PCA</b> — линейное снижение размерности: новые ортогональные оси (главные компоненты), упорядоченные по убыванию объяснённой дисперсии.</p>
<p><b>Алгоритм:</b> центрировать (и при необходимости стандартизировать) данные; C = XᵀX/(N−1); найти собственные пары Cv = λv; упорядочить λ<sub>1</sub> ≥ λ<sub>2</sub> ≥ …; scores T = XV; оставить первые k компонент (по доле Σλ<sub>i</sub>/Σλ или scree plot).</p>
<p><b>Вывод:</b> дисперсия проекции на единичный w равна wᵀCw. Максимизируем при wᵀw = 1 (Лагранж): Cw = λw, значение дисперсии = λ ⇒ PC1 — собственный вектор с наибольшим λ; следующие ортогональны. Σλ = tr(C) — полная дисперсия. Эквивалентно SVD: X = UΣVᵀ, λ = σ²/(N−1).</p>
<p><b>Пример:</b> точки (1,2),(2,3),(3,5),(4,6): λ = 4.978 и 0.022, PC1 объясняет 99.5%.</p>`,
clu:`<p><b>Cluster analysis</b> — разбиение объектов на группы (кластеры) без заранее заданных меток так, чтобы внутри кластера объекты похожи, между кластерами различны. Основа — мера сходства/расстояние (евклидово, манхэттенское, косинусное…).</p>
<p><b>Методы:</b> <b>k-means</b> (число k задано; назначение к ближайшему центру, пересчёт центров как среднего; минимизирует Σ‖x−c<sub>j</sub>‖², сходится к локальному минимуму; варианты k-medians, k-medoids); <b>AHC</b> (иерархия слияний, linkage single/complete/average/Ward, дендрограмма); <b>DBSCAN</b> (ε, minPts; плотностные кластеры любой формы + шум); <b>fuzzy c-means</b> (степени принадлежности).</p>
<p><b>Качество:</b> silhouette s = (b−a)/max(a,b), elbow по SSE.</p>
<p><b>Пример:</b> точки 1,2,4,9,10,12, k = 2: центры 2.33 и 10.33, SSE = 9.33.</p>`,
surv:`<p><b>Survival analysis</b> — анализ времени до события T (смерть, поломка, отток) с учётом <b>цензурирования</b> (событие к концу наблюдения не произошло, известно лишь T &gt; t). (Не из присланных слайдов, стандартная теория.)</p>
<p><b>Функции:</b> S(t) = P(T &gt; t) (выживание, S(0)=1, не возрастает); F = 1 − S; f = −S′; hazard h(t) = f/S; H(t) = ∫h; S = e<sup>−H</sup> (вывод: h = −(ln S)′).</p>
<p><b>Каплан–Майер:</b> Ŝ(t) = Π<sub>t<sub>i</sub>≤t</sub>(1 − d<sub>i</sub>/n<sub>i</sub>).</p>
<p><b>Какие линии:</b> ступенчатая невозрастающая кривая KM (скачки вниз в моменты событий, тики для цензурированных), доверительные границы (Гринвуд), медиана на уровне S = 0.5, кривые кумулятивного риска (Nelson–Aalen) и функции риска; несколько кривых для групп, сравнение log-rank тестом; модель Кокса h(t|x) = h₀(t)e<sup>βx</sup>.</p>`
};

const TOPICS = [{"id": "gl", "title": "Словарь терминов и сокращений", "goal": "SST, SSR, MSE, PCA, PD, ICC и все остальные сокращения курса с объяснением.", "part": "Словарь", "cards": [{"k": "story", "h": "Как пользоваться словарём", "b": "<p>Все сокращения и термины курса собраны здесь. Кроме того, <b>в любой теме</b> термины из этого словаря подчёркнуты пунктиром: нажми на него, и появится объяснение.</p><p><b>Главная путаница: SSR, SSE, SST.</b> SST — полный разброс y вокруг среднего, Σ(y − ȳ)². SSR (у профессора) или SSE/RSS (в большинстве книг) — сумма квадратов остатков Σ(y − ŷ)², то, что мы минимизируем. SSM (в книгах иногда SSR или ESS) — объяснённая часть Σ(ŷ − ȳ)². Всегда: SST = остатки + объяснённая часть, а R² = 1 − остатки/SST.</p>"}, {"k": "formula", "h": "Ошибки и регрессия", "b": "<table class=\"sym\"><tr><td>SSR</td><td>Sum of Squared Residuals — сумма квадратов остатков Σ(y − ŷ)². Это то, что минимизирует МНК. Осторожно: в некоторых учебниках SSR = «regression sum of squares» (объяснённая часть); у профессора SSR = остатки, в Davide та же сумма называется RSS/SSE.</td></tr><tr><td>SSE</td><td>Sum of Squared Errors — сумма квадратов ошибок. То же, что SSR (остатки), в большинстве учебников.</td></tr><tr><td>RSS</td><td>Residual Sum of Squares — то же, что SSR остатков.</td></tr><tr><td>SST</td><td>Total Sum of Squares — полная сумма квадратов Σ(y − ȳ)²: общий разброс y вокруг своего среднего. SST = SSR + SSM.</td></tr><tr><td>TSS</td><td>Total Sum of Squares — то же, что SST.</td></tr><tr><td>SSM</td><td>Model (explained) sum of squares Σ(ŷ − ȳ)² — часть разброса, объяснённая моделью (в других книгах ESS или SSR).</td></tr><tr><td>MSE</td><td>Mean Squared Error = SSR/N — средний квадрат ошибки.</td></tr><tr><td>RMSE</td><td>Root MSE = √MSE — корень из MSE, в тех же единицах, что y.</td></tr><tr><td>MAE</td><td>Mean Absolute Error — среднее модулей ошибок, менее чувствительно к выбросам.</td></tr><tr><td>R²</td><td>Коэффициент детерминации = 1 − SSR/SST: доля дисперсии y, объяснённая моделью. Для простой регрессии равен ρ².</td></tr><tr><td>OLS</td><td>Ordinary Least Squares — обычный метод наименьших квадратов: a = (XᵀX)⁻¹Xᵀy.</td></tr><tr><td>МНК</td><td>Метод наименьших квадратов (Least Squares Method, LSM): подбираем параметры, минимизируя сумму квадратов остатков.</td></tr><tr><td>LSM</td><td>Least Squares Method — метод наименьших квадратов (МНК).</td></tr><tr><td>WLS</td><td>Weighted Least Squares — взвешенный МНК: каждый остаток умножается на вес (при разной дисперсии ошибок).</td></tr><tr><td>GLS</td><td>Generalized Least Squares — обобщённый МНК для коррелированных ошибок или разной дисперсии.</td></tr><tr><td>ŷ</td><td>y с «крышкой» — предсказанное моделью значение (fitted value).</td></tr><tr><td>остаток</td><td>Residual r = y − ŷ: факт минус прогноз.</td></tr><tr><td>slope</td><td>Наклон прямой (в записи профессора α, у Davide β₁).</td></tr><tr><td>intercept</td><td>Свободный член прямой — значение y при x = 0 (в записи профессора β, у Davide β₀).</td></tr><tr><td>Hessian</td><td>Гессиан — матрица вторых производных H = d²f/dxᵢdxⱼ; описывает кривизну.</td></tr><tr><td>Гессиан</td><td>Матрица вторых производных функции H = d²f/dxᵢdxⱼ; описывает кривизну.</td></tr><tr><td>Jacobian</td><td>Якобиан — матрица первых производных вектор-функции J<sub>ij</sub> = drᵢ/daⱼ.</td></tr><tr><td>Якобиан</td><td>Матрица первых производных вектор-функции Jᵢⱼ = drᵢ/daⱼ.</td></tr><tr><td>ISLR</td><td>An Introduction to Statistical Learning — учебник (James, Witten, Hastie, Tibshirani), по нему программа Davide.</td></tr><tr><td>AIC</td><td>Akaike information criterion: 2p − 2ln L, меньше = лучше; штраф за число параметров p.</td></tr><tr><td>BIC</td><td>Bayesian information criterion: p·ln N − 2ln L; штраф строже AIC.</td></tr><tr><td>VIF</td><td>Variance Inflation Factor = 1/(1 − R²ⱼ): показывает мультиколлинеарность; VIF &gt; 5–10 — проблема.</td></tr><tr><td>CV</td><td>1) Cross-Validation — перекрёстная проверка; 2) Coefficient of Variation = σ/μ — коэффициент вариации.</td></tr><tr><td>LOO</td><td>Leave-One-Out cross-validation — k-fold при k = N: каждый раз одна точка в тесте.</td></tr><tr><td>LOOCV</td><td>Leave-One-Out Cross-Validation — перекрёстная проверка по одной точке.</td></tr><tr><td>LpO</td><td>Leave-p-Out cross-validation — перебираем все наборы по p точек в тесте, C(N,p) моделей.</td></tr><tr><td>holdout</td><td>Простое одно разбиение на train и test.</td></tr><tr><td>k-fold</td><td>Делим данные на k частей; k раз обучаемся на k−1 и тестируем на оставшейся.</td></tr><tr><td>train</td><td>Обучающая выборка — на ней подбираем параметры.</td></tr><tr><td>test</td><td>Тестовая выборка — на ней оцениваем ошибку на новых данных.</td></tr><tr><td>bootstrap</td><td>Бутстрэп: многократная выборка с возвращением из данных для оценки неопределённости.</td></tr></table>"}, {"k": "formula", "h": "Статистика", "b": "<table class=\"sym\"><tr><td>IQR</td><td>Interquartile range = Q₃ − Q₁ — межквартильный размах.</td></tr><tr><td>MAD</td><td>Median Absolute Deviation — медиана |x − медиана|, робастная мера разброса.</td></tr><tr><td>σ</td><td>Стандартное отклонение — корень из дисперсии.</td></tr><tr><td>ρ</td><td>Коэффициент корреляции ρ = cov/(σₓσ_y) ∈ [−1, 1].</td></tr><tr><td>cov</td><td>Ковариация — совместная изменчивость двух величин.</td></tr><tr><td>var</td><td>Дисперсия — средний квадрат отклонения от среднего.</td></tr><tr><td>μ</td><td>Среднее значение (математическое ожидание).</td></tr><tr><td>N−1</td><td>Поправка Бесселя: делим на N − 1, так как среднее оценено по тем же данным.</td></tr><tr><td>робастн</td><td>Робастный = устойчивый к выбросам (медиана робастна, среднее нет).</td></tr><tr><td>i.i.d.</td><td>Independent and identically distributed — независимые и одинаково распределённые.</td></tr><tr><td>MLE</td><td>Maximum Likelihood Estimation — оценка максимального правдоподобия.</td></tr><tr><td>ANOVA</td><td>Analysis of Variance — дисперсионный анализ.</td></tr><tr><td>SE</td><td>Standard Error — стандартная ошибка оценки.</td></tr><tr><td>df</td><td>Degrees of freedom — степени свободы.</td></tr></table>"}, {"k": "formula", "h": "Линейная алгебра", "b": "<table class=\"sym\"><tr><td>PD</td><td>Positive Definite — положительно определённая матрица: xᵀAx &gt; 0 для всех x ≠ 0, все λ &gt; 0.</td></tr><tr><td>PSD</td><td>Positive Semi-Definite — положительно полуопределённая: xᵀAx ≥ 0, все λ ≥ 0.</td></tr><tr><td>ND</td><td>Negative Definite — отрицательно определённая: все λ &lt; 0.</td></tr><tr><td>det</td><td>Определитель матрицы.</td></tr><tr><td>rank</td><td>Ранг матрицы — число независимых строк (или столбцов).</td></tr><tr><td>SVD</td><td>Singular Value Decomposition — сингулярное разложение A = UΣVᵀ.</td></tr><tr><td>Gram–Schmidt</td><td>Процесс Грама–Шмидта: превращает независимые векторы в ортонормированные.</td></tr><tr><td>eigenvalue</td><td>Собственное значение λ: Av = λv.</td></tr><tr><td>λ</td><td>Собственное значение матрицы (или параметр, зависит от контекста).</td></tr><tr><td>Frobenius</td><td>Норма Фробениуса ‖A‖_F = √Σaᵢⱼ².</td></tr><tr><td>Rouché–Capelli</td><td>Теорема Руше–Капелли: система Ax = b совместна ⇔ rank A = rank[A | b].</td></tr></table>"}, {"k": "formula", "h": "PCA и кластеризация", "b": "<table class=\"sym\"><tr><td>PCA</td><td>Principal Component Analysis — метод главных компонент: поворот осей на направления наибольшей дисперсии.</td></tr><tr><td>PC</td><td>Principal Component — главная компонента (новая ось / проекция данных на неё).</td></tr><tr><td>scree</td><td>Scree plot — график осыпи: собственные значения по убыванию.</td></tr><tr><td>WCSS</td><td>Within-Cluster Sum of Squares — внутрикластерная сумма квадратов, цель k-means.</td></tr><tr><td>BCSS</td><td>Between-Cluster Sum of Squares — межкластерная сумма квадратов.</td></tr><tr><td>AHC</td><td>Agglomerative Hierarchical Clustering — агломеративная иерархическая кластеризация (снизу вверх).</td></tr><tr><td>UPGMA</td><td>Unweighted Pair Group Method with Arithmetic mean — average linkage: среднее всех попарных расстояний.</td></tr><tr><td>WPGMA</td><td>Weighted PGMA — взвешенный вариант: расстояние до объединения = среднее двух расстояний.</td></tr><tr><td>DBSCAN</td><td>Density-Based Spatial Clustering of Applications with Noise — кластеры как плотные области, выбросы = шум.</td></tr><tr><td>minPts</td><td>Минимум точек в ε-окрестности, чтобы точка считалась core.</td></tr><tr><td>core</td><td>Ядровая точка DBSCAN: в ε-окрестности не меньше minPts точек.</td></tr><tr><td>DB</td><td>Davies–Bouldin index — индекс качества кластеризации, меньше = лучше.</td></tr><tr><td>CH</td><td>Calinski–Harabasz index — отношение межкластерного к внутрикластерному разбросу, больше = лучше.</td></tr><tr><td>PAM</td><td>Partitioning Around Medoids — k-medoids.</td></tr><tr><td>CLARA</td><td>Clustering LARge Applications — k-medoids на подвыборках для больших N.</td></tr><tr><td>dendrogram</td><td>Дендрограмма — дерево слияний кластеров, высота = расстояние слияния.</td></tr><tr><td>Дендрограмма</td><td>Дерево слияний кластеров, высота = расстояние слияния.</td></tr><tr><td>linkage</td><td>Линкаж — способ определить расстояние между кластерами (single, complete, average, Ward).</td></tr><tr><td>Ward</td><td>Метод Уорда: сливаем пару, дающую наименьший прирост внутрикластерной суммы квадратов.</td></tr><tr><td>Lloyd</td><td>Алгоритм Ллойда — классический k-means: чередуем назначение точек и пересчёт центров.</td></tr><tr><td>centroid</td><td>Центроид — среднее точек кластера.</td></tr><tr><td>centroids</td><td>Центроиды — средние точек кластеров.</td></tr><tr><td>medoid</td><td>Медоид — реальная точка данных, центральная в кластере.</td></tr><tr><td>Jaccard</td><td>Расстояние Жаккара: 1 − |A∩B|/|A∪B|.</td></tr><tr><td>Hausdorff</td><td>Расстояние Хаусдорфа между множествами.</td></tr><tr><td>Levenshtein</td><td>Расстояние Левенштейна: минимум вставок, удалений, замен между строками.</td></tr><tr><td>Mahalanobis</td><td>Расстояние Махаланобиса: √((x−y)ᵀΣ⁻¹(x−y)), учитывает корреляции признаков.</td></tr></table>"}, {"k": "formula", "h": "Оптимизация", "b": "<table class=\"sym\"><tr><td>∇</td><td>Набла ∇f (градиент) — вектор всех частных производных (df/dx₁, …, df/dxₙ); показывает, куда f растёт быстрее всего. Для одной переменной это обычная производная df/dx.</td></tr><tr><td>GD</td><td>Gradient Descent — градиентный спуск x ← x − t∇f.</td></tr><tr><td>SGD</td><td>Stochastic Gradient Descent — градиент по случайной части данных.</td></tr><tr><td>CG</td><td>Conjugate Gradient — метод сопряжённых градиентов.</td></tr><tr><td>FR</td><td>Fletcher–Reeves — формула β в нелинейном CG: ‖g_{k+1}‖²/‖g_k‖².</td></tr><tr><td>PR</td><td>Polak–Ribière — формула β в нелинейном CG: gₖ₊₁ᵀ(gₖ₊₁ − gₖ)/‖gₖ‖².</td></tr><tr><td>κ</td><td>Число обусловленности κ = L/m = λ_max/λ_min: чем больше, тем медленнее GD.</td></tr><tr><td>L-гладк</td><td>L-гладкая функция: ‖∇f(x) − ∇f(y)‖ ≤ L‖x − y‖ (кривизна не больше L).</td></tr><tr><td>Armijo</td><td>Условие Армихо: достаточное убывание f при выборе шага.</td></tr><tr><td>Wolfe</td><td>Условия Вольфе: Армихо + условие кривизны.</td></tr><tr><td>backtracking</td><td>Поиск шага: уменьшаем α в b раз, пока не выполнено Армихо.</td></tr><tr><td>KKT</td><td>Karush–Kuhn–Tucker — условия оптимальности при ограничениях.</td></tr><tr><td>ε</td><td>Малая точность/допуск (например, критерий остановки ‖∇f‖ ≤ ε; радиус в DBSCAN).</td></tr></table>"}, {"k": "formula", "h": "Davide: модели", "b": "<table class=\"sym\"><tr><td>LRM</td><td>Linear Regression Model — линейная регрессионная модель.</td></tr><tr><td>GLM</td><td>Generalized Linear Model — обобщённая линейная модель (логистическая, Пуассона и др.).</td></tr><tr><td>LDA</td><td>Linear Discriminant Analysis — линейный дискриминантный анализ.</td></tr><tr><td>QDA</td><td>Quadratic Discriminant Analysis — квадратичный дискриминантный анализ.</td></tr><tr><td>ROC</td><td>Receiver Operating Characteristic — кривая чувствительность/(1 − специфичность).</td></tr><tr><td>AUC</td><td>Area Under the ROC Curve — площадь под ROC-кривой, 0.5 = случайно, 1 = идеально.</td></tr><tr><td>odds</td><td>Шансы p/(1 − p).</td></tr><tr><td>logit</td><td>Логит ln(p/(1 − p)) — линейная функция от X в логистической регрессии.</td></tr><tr><td>KM</td><td>Kaplan–Meier — оценка функции выживания по цензурированным данным.</td></tr><tr><td>S(t)</td><td>Функция выживания: вероятность дожить до момента t, S(t) = P(T &gt; t).</td></tr><tr><td>h(t)</td><td>Hazard (интенсивность отказа): мгновенный риск события в момент t при условии дожития.</td></tr><tr><td>HR</td><td>Hazard Ratio — отношение рисков двух групп; e^β в модели Кокса.</td></tr><tr><td>PH</td><td>Proportional Hazards — допущение пропорциональности рисков.</td></tr><tr><td>Cox</td><td>Модель пропорциональных рисков Кокса: h(t|x) = h₀(t)·e^{βx}.</td></tr><tr><td>censor</td><td>Цензурирование: событие не наблюдалось до конца исследования; мы знаем только, что T больше наблюдаемого времени.</td></tr><tr><td>цензур</td><td>Цензурирование: событие не наблюдалось до конца исследования.</td></tr><tr><td>log-rank</td><td>Лог-ранговый тест: сравнение кривых выживания двух групп.</td></tr><tr><td>ICC</td><td>Intraclass Correlation Coefficient — доля дисперсии, приходящаяся на уровень групп.</td></tr><tr><td>VPC</td><td>Variance Partition Coefficient — то же, что ICC: доля вариации между группами.</td></tr><tr><td>IGLS</td><td>Iterative Generalized Least Squares — итерационный метод оценивания иерархических моделей.</td></tr><tr><td>shrinkage</td><td>Shrinkage (стягивание): оценки групп подтягиваются к общему среднему.</td></tr><tr><td>multilevel</td><td>Многоуровневая (иерархическая) модель: данные вложены в группы.</td></tr><tr><td>leverage</td><td>Leverage — рычаг: насколько необычен x; точка с большим leverage сильно влияет на прямую.</td></tr><tr><td>outlier</td><td>Выброс по y: точка с большим остатком.</td></tr></table>"}]}, {"title": "1. Данные, шкалы, частоты, квантили", "goal": "Что такое анализ данных, шкалы, частоты, гистограмма, box plot и выбросы.", "part": "Часть 1 · Статистика", "cards": [{"k": "story", "h": "Что такое анализ данных", "b": "<p><b>Анализ данных</b> — сбор, очистка, преобразование и моделирование данных, чтобы получить компактную полезную информацию и принимать решения. Идея «Data = Model + Error»: данные = модель (закономерность) + ошибка (случайный шум).</p><p><b>Шесть этапов процесса:</b> 1) требования (что хотим узнать), 2) сбор данных, 3) очистка (пропуски, ошибки, дубликаты), 4) анализ и моделирование, 5) интерпретация, 6) визуализация и отчёт.</p><p><b>Типы анализа:</b> текстовый; статистический (описательный — описываем выборку, и инференциальный — делаем выводы о генеральной совокупности); диагностический (почему так случилось); предиктивный (что будет); предписывающий (что делать).</p>"}, {"k": "story", "h": "Шкалы измерения", "b": "<ul class=\"big\"><li><b>Номинальная</b> — категории без порядка (цвет, город). Можно считать частоты и моду.</li><li><b>Порядковая</b> — категории с порядком (оценка «плохо/средне/хорошо»), но расстояния между ними не измерены. Можно медиану и квантили.</li><li><b>Числовая</b> — разности имеют смысл (рост, температура). Дискретная (счётная: число детей) или непрерывная (любое значение на отрезке). Можно среднее, дисперсию.</li></ul><p>От шкалы зависит, какие операции законны: среднее по номинальной шкале бессмысленно.</p>"}, {"k": "formula", "h": "Частоты: формулы", "b": "<table class=\"sym\"><tr><td>fₖ</td><td>абсолютная частота: сколько раз встретилось k-е значение; Σfₖ = N</td></tr><tr><td>f̂ₖ = fₖ / N</td><td>относительная частота; Σf̂ₖ = 1</td></tr><tr><td>накопленная</td><td>бегущая сумма частот: F₁ = f₁, F₂ = f₁ + f₂, …</td></tr><tr><td>число классов k</td><td>√N; Стёрджес 1 + log₂N; Райс 2·∛N</td></tr><tr><td>Фридман–Диаконис</td><td>ширина класса = 2·IQR / ∛N</td></tr><tr><td>ширина класса</td><td>(max − min) / k</td></tr><tr><td>круговая диаграмма</td><td>угол сектора g из f : 100 = g : 360</td></tr></table>"}, {"k": "num", "h": "Числа: частоты и классы", "b": "<p>Оценки 20 студентов: 3 получили A, 7 — B, 8 — C, 2 — D. Абсолютные: 3, 7, 8, 2 (сумма 20). Относительные: 0.15; 0.35; 0.40; 0.10 (сумма 1). Накопленные относительные: 0.15; 0.50; 0.90; 1.00. На круговой диаграмме сектор C: 0.40·360° = 144°.</p><p>Сколько классов для N = 100 значений? √100 = 10; Стёрджес 1 + log₂100 = 7.64, то есть около 8. Если min = 2 и max = 58, ширина при k = 8 равна (58 − 2)/8 = 7.</p><p><b>Гистограмма</b> — для непрерывных данных, столбики смежные (без промежутков), площадь пропорциональна частоте. <b>Столбчатая диаграмма</b> — для категорий, столбики разделены. <b>Эмпирическая функция распределения</b> F(x) = (число значений ≤ x)/N — ступенчатая неубывающая, от 0 до 1.</p>"}, {"k": "formula", "h": "Box plot, квартили, выбросы", "b": "<table class=\"sym\"><tr><td>медиана Q₂</td><td>значение посередине упорядоченных данных (50% данных ниже)</td></tr><tr><td>Q₁, Q₃</td><td>медианы нижней и верхней половины: 25% и 75% данных ниже</td></tr><tr><td>IQR = Q₃ − Q₁</td><td>межквартильный размах: разброс центральной половины данных</td></tr><tr><td>нижний забор</td><td>Q₁ − 1.5·IQR</td></tr><tr><td>верхний забор</td><td>Q₃ + 1.5·IQR</td></tr></table><p>Box plot рисует: min (не считая выбросов), Q₁, медиану, Q₃, max, а точки за заборами показывает отдельно как выбросы.</p>"}, {"k": "num", "h": "Числа: box plot", "b": "<p>Данные: 1, 2, 3, 4, 5, 6, 7, 8, 9, 30 (N = 10). Медиана = (5 + 6)/2 = <b>5.5</b>. Нижняя половина 1–5 даёт Q₁ = <b>3</b>, верхняя 6–30 даёт Q₃ = <b>8</b>. IQR = 5. Заборы: 3 − 7.5 = −4.5 и 8 + 7.5 = 15.5. Значение 30 лежит за верхним забором, поэтому это <b>выброс</b>.</p><p>Обрати внимание: среднее = 7.5, медиана = 5.5. Выброс сильно тянет среднее, а медиана почти не меняется. Поэтому медиана <b>робастна</b>, среднее нет. (Разные учебники считают квартили чуть по-разному; на экзамене достаточно назвать метод.)</p>"}, {"k": "quiz", "q": "Чем гистограмма отличается от столбчатой диаграммы?", "o": ["гистограмма для непрерывных данных, столбики смежные; столбчатая для категорий", "они одинаковы", "гистограмма для категорий", "столбчатая только для нормальных данных"], "a": 0, "why": "У непрерывных данных нет промежутков между классами, у категорий есть."}, {"k": "quiz", "q": "Q₁ = 3, Q₃ = 8. Какой верхний забор для выбросов?", "o": ["15.5", "8", "11", "13"], "a": 0, "why": "Q₃ + 1.5·IQR = 8 + 1.5·5 = 15.5."}, {"k": "quiz", "q": "Какая шкала допускает среднее и дисперсию?", "o": ["числовая", "номинальная", "порядковая", "любая"], "a": 0, "why": "Среднее требует измеримых разностей."}, {"k": "note", "h": "Тетрадь: эталонные ответы на вопросы", "b": "<div class=\"nb\"><div class=\"hd\">Q: What is data analysis? Что такое анализ данных</div><div class=\"ln\"><div class=\"fm\">Анализ данных = сбор → очистка → преобразование → моделирование</div><div class=\"nt\">цель: компактная полезная информация и решения</div></div><div class=\"ln\"><div class=\"fm\">Data = Model + Error</div><div class=\"nt\">данные = закономерность + случайный шум</div></div><div class=\"hd\">Q: Scales of measurement</div><div class=\"ln\"><div class=\"fm\">номинальная: категории без порядка (цвет, город)</div><div class=\"nt\">считаем частоты и моду</div></div><div class=\"ln\"><div class=\"fm\">порядковая: категории с порядком (плохо &lt; средне &lt; хорошо)</div><div class=\"nt\">медиана, квантили</div></div><div class=\"ln\"><div class=\"fm\">числовая: дискретная (счёт) или непрерывная</div><div class=\"nt\">среднее, дисперсия — разности имеют смысл</div></div><div class=\"hd\">Q: Phases of the data analysis process</div><div class=\"ln\"><div class=\"fm\">1 требования → 2 сбор → 3 очистка → 4 анализ/моделирование → 5 интерпретация → 6 визуализация и отчёт</div><div class=\"nt\">очистка: пропуски, ошибки, дубликаты</div></div><div class=\"hd\">Q: Types of data analysis</div><div class=\"ln\"><div class=\"fm\">описательный, инференциальный, диагностический, предиктивный, предписывающий, текстовый</div><div class=\"nt\">что было / вывод о генеральной / почему / что будет / что делать</div></div><div class=\"hd\">Q: How to build a frequency distribution</div><div class=\"ln\"><div class=\"fm\">f<sub>k</sub> = сколько раз встретилось k-е значение,   <span class=\"sm\"><span>K</span><b>Σ</b><span>k=1</span></span> f<sub>k</sub> = N</div><div class=\"nt\">абсолютная частота</div></div><div class=\"ln\"><div class=\"fm\">f̂<sub>k</sub> = <span class=\"fr\"><span>f<sub>k</sub></span><span>N</span></span>,   <span class=\"sm\"><span>K</span><b>Σ</b><span>k=1</span></span> f̂<sub>k</sub> = 1</div><div class=\"nt\">относительная частота</div></div><div class=\"ln\"><div class=\"fm\">число классов  k ≈ √N  или  1 + log₂N,   ширина = <span class=\"fr\"><span>max − min</span><span>k</span></span></div><div class=\"nt\">непрерывные данные группируем в классы</div></div><div class=\"hd\">Q: Histogram vs bar chart</div><div class=\"ln\"><div class=\"fm\">гистограмма: непрерывные данные, столбики вплотную, площадь ∝ частоте</div><div class=\"nt\">между классами нет промежутков</div></div><div class=\"ln\"><div class=\"fm\">столбчатая: категории, столбики раздельно</div><div class=\"nt\">порядок категорий можно менять</div></div><div class=\"hd\">Q: Box plot and outliers</div><div class=\"ln\"><div class=\"fm\">IQR = Q₃ − Q₁</div><div class=\"nt\">межквартильный размах</div></div><div class=\"ln\"><div class=\"fm\">выброс: x &lt; Q₁ − 1.5·IQR  или  x &gt; Q₃ + 1.5·IQR</div><div class=\"nt\">«заборы» (fences)</div></div><div class=\"ln\"><div class=\"fm\">пример 1,2,…,9,30: Q₁ = 3, Q₃ = 8, IQR = 5, забор 15.5, значит 30 — выброс</div></div></div>"}, {"k": "exam", "h": "Эталонные ответы", "b": "<p><b>What is data analysis?</b> Process of collecting, cleaning, transforming and modelling data to extract compact useful information and support decisions; Data = Model + Error.</p><p><b>Scales:</b> nominal (categories), ordinal (ordered categories), numerical (discrete or continuous, differences are meaningful).</p><p><b>Phases:</b> requirements, collection, cleaning, analysis/modelling, interpretation, visualisation.</p><p><b>Frequency distribution:</b> list values (or classes), count absolute frequency fₖ, relative f̂ₖ = fₖ/N, cumulative frequencies; number of classes by √N or Sturges 1 + log₂N.</p><p><b>Box plot:</b> min, Q₁, median, Q₃, max; IQR = Q₃ − Q₁; outliers outside [Q₁ − 1.5·IQR, Q₃ + 1.5·IQR].</p>"}], "id": "st1"}, {"title": "2. Средние и разброс", "goal": "Среднее и его свойства, виды средних, дисперсия, поправка N−1, стандартизация.", "part": "Часть 1 · Статистика", "cards": [{"k": "story", "h": "Зачем нужны среднее и дисперсия", "b": "<p><b>Среднее</b> μ = (x₁ + … + x_N)/N — «центр» данных: точка, вокруг которой данные уравновешены. <b>Дисперсия</b> σ² — средний квадрат отклонения от среднего: насколько данные разбросаны. Среднее отвечает «где», дисперсия отвечает «насколько широко».</p><p>Среднее <b>не робастно</b>: один выброс сильно его сдвигает.</p>"}, {"k": "note", "h": "Тетрадь: свойства среднего и дисперсии", "b": "<div class=\"nb\"><div class=\"hd\">Среднее</div><div class=\"ln\"><div class=\"fm\">μ = <span class=\"fr\"><span>1</span><span><i>N</i></span></span> <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> x<sub>k</sub></div></div><div class=\"ln\"><div class=\"fm\"><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (x<sub>k</sub> − μ) = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> x<sub>k</sub> − Nμ = 0</div><div class=\"nt\">сумма отклонений от среднего равна нулю</div></div><div class=\"ln\"><div class=\"fm\">mean(ax + b) = aμ + b</div><div class=\"nt\">линейное преобразование данных</div></div><div class=\"hd\">Дисперсия</div><div class=\"ln\"><div class=\"fm\">σ² = <span class=\"fr\"><span>1</span><span><i>N</i></span></span> <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (x<sub>k</sub> − μ)²</div></div><div class=\"ln\"><div class=\"fm\">= <span class=\"fr\"><span>1</span><span><i>N</i></span></span><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> x<sub>k</sub>² − 2μ·<span class=\"fr\"><span>1</span><span><i>N</i></span></span><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> x<sub>k</sub> + μ²</div><div class=\"nt\">раскрыли квадрат</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">σ² = mean(x²) − μ²</span></div><div class=\"nt\">среднее квадратов минус квадрат среднего</div></div><div class=\"ln\"><div class=\"fm\">var(ax + b) = a²σ²</div><div class=\"nt\">сдвиг b дисперсию не меняет, масштаб a даёт a²</div></div><div class=\"hd\">Поправка Бесселя</div><div class=\"ln\"><div class=\"fm\">σ̃² = <span class=\"fr\"><span>1</span><span>N − 1</span></span> <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (x<sub>k</sub> − x̄)² = <span class=\"fr\"><span>N</span><span>N − 1</span></span> σ²</div><div class=\"nt\">выборочная несмещённая дисперсия</div></div></div>"}, {"k": "proof", "h": "Почему делим на N − 1", "b": "<p>Если среднее μ генеральной совокупности известно, то (1/N)Σ(xₖ − μ)² — честная оценка σ². Но на практике μ неизвестно, и мы берём выборочное среднее x̄, которое подогнано под данные.</p><p><b>Вывод:</b> Σ(xₖ − μ)² = Σ(xₖ − x̄)² + N(x̄ − μ)². Берём математическое ожидание: E Σ(xₖ − μ)² = Nσ², а E N(x̄ − μ)² = N·σ²/N = σ². Значит E Σ(xₖ − x̄)² = Nσ² − σ² = (N − 1)σ². Деля на N, мы систематически занижали бы σ² (в (N−1)/N раз). Деление на N − 1 убирает смещение. Другая формулировка: у данных N − 1 степеней свободы, потому что одна «степень» потрачена на оценку среднего (сумма отклонений от x̄ всегда равна нулю).</p>"}, {"k": "formula", "h": "Другие средние и меры разброса", "b": "<table class=\"sym\"><tr><td>взвешенное</td><td>μ_w = Σwₖxₖ / Σwₖ (например, оценки с весами-кредитами)</td></tr><tr><td>геометрическое G</td><td>(x₁·x₂·…·x_N)^(1/N); для темпов роста и множителей</td></tr><tr><td>гармоническое H</td><td>N / Σ(1/xₖ); для средних скоростей и «цена за единицу»</td></tr><tr><td>для x &gt; 0</td><td>H ≤ G ≤ μ, равенство только если все x равны</td></tr><tr><td>мода</td><td>самое частое значение</td></tr><tr><td>CV = σ / |μ|</td><td>коэффициент вариации, без единиц измерения</td></tr><tr><td>размах</td><td>max − min</td></tr><tr><td>MAD</td><td>медиана от |x − медиана|; робастная мера разброса</td></tr><tr><td>z = (x − μ)/σ</td><td>стандартизация: после неё среднее 0, дисперсия 1</td></tr></table>"}, {"k": "num", "h": "Числа", "b": "<p>Данные {1, 2, 3, 5}, N = 4. <b>Среднее</b> μ = 11/4 = 2.75. <b>Среднее квадратов</b> = (1 + 4 + 9 + 25)/4 = 9.75. <b>Дисперсия</b> σ² = 9.75 − 2.75² = 9.75 − 7.5625 = <b>2.1875</b>. <b>Выборочная</b> σ̃² = 4/3 · 2.1875 = <b>2.917</b>. Стандартное отклонение σ ≈ 1.479.</p><p><b>Взвешенное:</b> оценки 24, 25, 28, 26 с кредитами 8, 6, 8, 12 дают (24·8 + 25·6 + 28·8 + 26·12)/34 = 878/34 = 25.82 (простое среднее 25.75).</p><p><b>Геометрическое:</b> инфляция 2.5%, 2%, 1.5% за три года: G = ∛(1.025·1.02·1.015) = 1.01999, то есть в среднем 2.0%/год.</p><p><b>Гармоническое:</b> машины с расходом 10 и 20 км/л: H = 2/(1/10 + 1/20) = 13.33 км/л. Проверка: на 100 км каждой нужно 10 + 5 = 15 л на 200 км, то есть 13.33 км/л. Арифметическое 15 км/л дало бы неверный ответ.</p><p><b>Стандартизация:</b> x = 5 при μ = 2.75, σ = 1.479: z = 1.52 (на 1.52 стандартных отклонения выше среднего).</p>"}, {"k": "quiz", "q": "Почему выборочная дисперсия делится на N − 1?", "o": ["среднее оценено по тем же данным, иначе оценка занижена", "чтобы число было целым", "потому что N − 1 всегда меньше", "так проще считать"], "a": 0, "why": "E Σ(x−x̄)² = (N−1)σ², деление на N занижает σ²."}, {"k": "quiz", "q": "Данные x, дисперсия σ². Какая дисперсия у 3x + 5?", "o": ["9σ²", "3σ²", "9σ² + 5", "σ²"], "a": 0, "why": "var(ax + b) = a²σ², сдвиг дисперсию не меняет."}, {"k": "quiz", "q": "Какое среднее нужно для средней скорости на двух равных путях?", "o": ["гармоническое", "арифметическое", "геометрическое", "взвешенное по времени"], "a": 0, "why": "Скорости на равных расстояниях усредняют гармонически."}, {"k": "note", "h": "Тетрадь: эталонные ответы на вопросы", "b": "<div class=\"nb\"><div class=\"hd\">Q: Define the mean and its properties</div><div class=\"ln\"><div class=\"fm\">μ = <span class=\"fr\"><span>1</span><span>N</span></span> <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> x<sub>k</sub></div><div class=\"nt\">центр масс данных</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (x<sub>k</sub> − μ) = 0</div><div class=\"nt\">сумма отклонений равна нулю</div></div><div class=\"ln\"><div class=\"fm\">mean(ax + b) = aμ + b</div><div class=\"nt\">линейность; среднее не робастно к выбросам</div></div><div class=\"hd\">Q: When to use geometric or harmonic mean</div><div class=\"ln\"><div class=\"fm\">G = (x₁·x₂·…·x<sub>N</sub>)<sup>1/N</sup></div><div class=\"nt\">средний множитель роста (инфляция, доходность)</div></div><div class=\"ln\"><div class=\"fm\">H = <span class=\"fr\"><span>N</span><span>Σ 1/x<sub>k</sub></span></span></div><div class=\"nt\">средняя скорость, цена за единицу</div></div><div class=\"ln\"><div class=\"fm\">для x &gt; 0:  H ≤ G ≤ μ</div><div class=\"nt\">равенство только при одинаковых x</div></div><div class=\"hd\">Q: Why divide by N − 1</div><div class=\"ln\"><div class=\"fm\">E <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span>(x<sub>k</sub> − x̄)² = (N − 1)σ²</div><div class=\"nt\">выборочное среднее подогнано под те же данные</div></div><div class=\"ln\"><div class=\"fm\">σ̃² = <span class=\"fr\"><span>1</span><span>N − 1</span></span> <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (x<sub>k</sub> − x̄)²</div><div class=\"nt\">делим на N − 1 и смещения нет; N − 1 степеней свободы</div></div><div class=\"hd\">Q: What is standardisation</div><div class=\"ln\"><div class=\"fm\">z = <span class=\"fr\"><span>x − μ</span><span>σ</span></span></div><div class=\"nt\">после этого среднее 0, дисперсия 1</div></div><div class=\"ln\"><div class=\"fm\">сравнимость разных шкал; нужна перед PCA и кластеризацией</div></div></div>"}, {"k": "exam", "h": "Эталонные ответы", "b": "<p><b>Mean and properties:</b> μ = Σx/N; Σ(x − μ) = 0; mean(ax + b) = aμ + b; not robust to outliers.</p><p><b>Geometric/harmonic mean:</b> geometric for growth factors and rates (product), harmonic for averaging rates like speeds (reciprocals); for positive data H ≤ G ≤ arithmetic.</p><p><b>Why N − 1:</b> sample mean is fitted to the same data; E Σ(x − x̄)² = (N − 1)σ², so dividing by N underestimates variance (Bessel correction); N − 1 degrees of freedom.</p><p><b>Standardisation:</b> z = (x − μ)/σ, makes mean 0 and variance 1, comparable across scales.</p><p>Variance identity: σ² = mean(x²) − μ²; var(ax + b) = a²σ².</p>"}], "id": "st2"}, {"title": "3. Ковариация и корреляция", "goal": "Совместная изменчивость, |ρ| ≤ 1, ограничения корреляции, ковариационная матрица.", "part": "Часть 1 · Статистика", "cards": [{"k": "story", "h": "Идея", "b": "<p>Дисперсия описывает одну переменную. Ковариация описывает две сразу: <b>растут ли они вместе</b>. Для каждой точки смотрим, по одну ли сторону от своих средних лежат x и y. Если чаще по одну, ковариация положительна; если по разные, отрицательна.</p><p>Корреляция — та же ковариация, но поделённая на масштабы обеих переменных, поэтому всегда между −1 и 1 и не зависит от единиц измерения.</p>"}, {"k": "formula", "h": "Формулы и свойства", "b": "<table class=\"sym\"><tr><td>cov(x,y) = (1/N)Σ(xₖ − x̄)(yₖ − ȳ)</td><td>ковариация (в статистике часто 1/(N−1))</td></tr><tr><td>cov(x,y) = mean(xy) − x̄·ȳ</td><td>удобная формула: «среднее произведений минус произведение средних»</td></tr><tr><td>cov(x,x) = σ²(x)</td><td>дисперсия — частный случай</td></tr><tr><td>cov(ax+b, cy+d) = ac·cov(x,y)</td><td>сдвиги не влияют, масштабы перемножаются</td></tr><tr><td>σ²(ax+by) = a²σ²(x) + b²σ²(y) + 2ab·cov(x,y)</td><td>дисперсия суммы</td></tr><tr><td>ρ = cov(x,y)/(σₓσ_y)</td><td>коэффициент корреляции, ρ ∈ [−1, 1]</td></tr></table>"}, {"k": "proof", "h": "Вывод: почему |ρ| ≤ 1 (через дискриминант)", "b": "<ol class=\"big\"><li>Для любого числа t сумма квадратов неотрицательна: (1/N)Σ[t(xₖ − x̄) − (yₖ − ȳ)]² ≥ 0.</li><li>Раскрываем: t²σ²(x) − 2t·cov(x,y) + σ²(y) ≥ 0 для всех t.</li><li>Это квадратный трёхчлен относительно t, который <b>никогда не отрицателен</b>. Значит его дискриминант не положителен: 4cov² − 4σ²(x)σ²(y) ≤ 0.</li><li>Отсюда cov² ≤ σ²(x)σ²(y) (неравенство Коши–Шварца), то есть |cov| ≤ σₓσ_y, и ρ = cov/(σₓσ_y) ∈ [−1, 1].</li><li>|ρ| = 1 тогда и только тогда, когда y = ax + b (точная линейная зависимость).</li></ol>"}, {"k": "num", "h": "Числа: ловушки корреляции", "b": "<p><b>cov = 0 не значит «нет связи».</b> x = −2, −1, 0, 1, 2; y = x² = 4, 1, 0, 1, 4. x̄ = 0, ȳ = 2. Сумма произведений отклонений: (−2)(2) + (−1)(−1) + 0·(−2) + 1·(−1) + 2·2 = −4 + 1 − 1 + 4 = 0. Ковариация нулевая, хотя y полностью определяется через x (нелинейно). Корреляция измеряет <b>только линейную</b> связь.</p><p><b>Корреляция ≠ причинность:</b> продажи мороженого и число утоплений растут вместе (общая причина — жара).</p><p><b>Чувствительна к выбросам:</b> одна далёкая точка может резко изменить ρ.</p><p>Пример расчёта: x = 1,2,3,4,5; y = 2,4,5,4,5. cov(x,y) = 6/5 = 1.2 (по формуле mean(xy) − x̄ȳ = 13.2 − 12 = 1.2), σₓ = √2, σ_y = √1.2, ρ = 1.2/(√2·√1.2) = 0.775.</p>"}, {"k": "formula", "h": "Матрицы ковариаций и корреляций", "b": "<p>Для p переменных строим матрицу p×p: на диагонали дисперсии σ²ⱼ, вне диагонали ковариации cov(xᵢ, xⱼ); она симметрична и положительно полуопределена. <b>Матрица корреляций</b> — то же для стандартизованных данных (диагональ из единиц). Именно ковариационная матрица — исходный объект для <b>PCA</b>.</p><p>В матричной форме для центрированных данных X (строки — наблюдения): C = XᵀX/(N−1).</p>"}, {"k": "quiz", "q": "Что значит cov(x,y) = 0?", "o": ["линейной связи нет, но нелинейная может быть", "x и y независимы", "y = x", "связь максимальна"], "a": 0, "why": "Пример y = x² на симметричных x."}, {"k": "quiz", "q": "Чему равна cov(x,x)?", "o": ["σ²(x)", "0", "1", "σ(x)"], "a": 0, "why": "Дисперсия — ковариация величины с самой собой."}, {"k": "note", "h": "Тетрадь: эталонные ответы на вопросы", "b": "<div class=\"nb\"><div class=\"hd\">Q: Covariance and correlation</div><div class=\"ln\"><div class=\"fm\">cov(x,y) = <span class=\"fr\"><span>1</span><span>N</span></span><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (x<sub>k</sub> − x̄)(y<sub>k</sub> − ȳ) = mean(xy) − x̄·ȳ</div><div class=\"nt\">знак: растут ли вместе</div></div><div class=\"ln\"><div class=\"fm\">ρ = <span class=\"fr\"><span>cov(x,y)</span><span>σ<sub>x</sub>·σ<sub>y</sub></span></span></div><div class=\"nt\">безразмерная, ρ ∈ [−1, 1]</div></div><div class=\"hd\">Q: Prove |ρ| ≤ 1</div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>1</span><span>N</span></span><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span>[t(x<sub>k</sub> − x̄) − (y<sub>k</sub> − ȳ)]² ≥ 0  для всех t</div><div class=\"nt\">сумма квадратов</div></div><div class=\"ln\"><div class=\"fm\">t²σ<sub>x</sub>² − 2t·cov + σ<sub>y</sub>² ≥ 0</div><div class=\"nt\">квадратный трёхчлен по t, никогда не отрицателен</div></div><div class=\"ln\"><div class=\"fm\">D = 4cov² − 4σ<sub>x</sub>²σ<sub>y</sub>² ≤ 0</div><div class=\"nt\">дискриминант не положителен</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">cov² ≤ σ<sub>x</sub>²σ<sub>y</sub>²  ⇒  |ρ| ≤ 1</span></div><div class=\"nt\">Коши–Шварц; |ρ| = 1 ⇔ y = ax + b</div></div><div class=\"hd\">Q: Limitations of correlation</div><div class=\"ln\"><div class=\"fm\">только линейная связь: y = x² на симметричных x даёт cov = 0</div><div class=\"nt\">нелинейность</div></div><div class=\"ln\"><div class=\"fm\">корреляция ≠ причинность (общая причина)</div><div class=\"nt\">мороженое и утопления</div></div><div class=\"ln\"><div class=\"fm\">чувствительна к выбросам</div><div class=\"nt\">одна точка меняет ρ</div></div></div>"}, {"k": "exam", "h": "Эталонные ответы", "b": "<p><b>Covariance:</b> cov(x,y) = (1/N)Σ(xₖ − x̄)(yₖ − ȳ) = mean(xy) − x̄ȳ; sign shows direction of linear relationship. <b>Correlation:</b> ρ = cov/(σₓσ_y), scale-free, in [−1, 1].</p><p><b>Proof |ρ| ≤ 1:</b> for all t, (1/N)Σ[t(xₖ−x̄) − (yₖ−ȳ)]² ≥ 0, i.e. t²σₓ² − 2t·cov + σ_y² ≥ 0; non-negative quadratic has discriminant ≤ 0: cov² ≤ σₓ²σ_y² (Cauchy–Schwarz).</p><p><b>Limitations:</b> only linear association (y = x² gives 0), not causation, sensitive to outliers.</p>"}], "id": "st3"}, {"id": "reg", "title": "4. Линейная регрессия: α и β", "goal": "Прямая по точкам: что такое остаток, α, β, и как их вывести.", "cards": [{"k": "story", "h": "Что мы вообще делаем", "b": "<p>Есть облако точек (x<sub>i</sub>, y<sub>i</sub>): например, x — часы учёбы, y — оценка. Мы хотим <b>одну прямую</b>, которая проходит как можно ближе ко всем точкам, чтобы по новому x предсказывать y.</p>\n <p>Прямая в лекции профессора записана как <b>y = αx + β</b>. Запомни именно так: <b>α — наклон (slope)</b>, <b>β — сдвиг (intercept, значение при x = 0)</b>. (В других учебниках часто наоборот, β<sub>1</sub> — наклон. На экзамене пиши как на лекции и сразу подпиши, что есть что.)</p>\n <p><b>Остаток (residual)</b> точки: r<sub>i</sub> = y<sub>i</sub> − (αx<sub>i</sub> + β), то есть настоящий y минус предсказание. Это <b>вертикальное</b> расстояние до прямой, а не перпендикуляр (на лекции это отдельно подчёркнуто).</p>"}, {"k": "num", "h": "Числа: 5 точек", "b": "<p>x = 1, 2, 3, 4, 5; y = 2, 4, 5, 4, 5. Средние: x̄ = 3, ȳ = 4.</p>\n <table class=\"tbl\"><tr><th>x</th><th>y</th><th>x−x̄</th><th>y−ȳ</th><th>(x−x̄)(y−ȳ)</th><th>(x−x̄)²</th></tr>\n <tr><td>1</td><td>2</td><td>−2</td><td>−2</td><td>4</td><td>4</td></tr><tr><td>2</td><td>4</td><td>−1</td><td>0</td><td>0</td><td>1</td></tr><tr><td>3</td><td>5</td><td>0</td><td>1</td><td>0</td><td>0</td></tr><tr><td>4</td><td>4</td><td>1</td><td>0</td><td>0</td><td>1</td></tr><tr><td>5</td><td>5</td><td>2</td><td>1</td><td>2</td><td>4</td></tr><tr><th colspan=\"4\">сумма</th><th>6</th><th>10</th></tr></table>\n <p><b>α = 6/10 = 0.6</b> (на каждый лишний час +0.6 балла). <b>β = ȳ − αx̄ = 4 − 0.6·3 = 2.2</b>. Прямая: y = 0.6x + 2.2. Прогнозы 2.8; 3.4; 4.0; 4.6; 5.2, остатки −0.8; 0.6; 1.0; −0.6; −0.2 (их сумма равна 0, это не случайность, см. вывод).</p>"}, {"k": "formula", "h": "Формулы по буквам", "b": "<table class=\"sym\"><tr><td>α = S<sub>xy</sub> / S<sub>xx</sub></td><td>наклон = (сумма произведений отклонений) / (сумма квадратов отклонений x)</td></tr>\n <tr><td>S<sub>xy</sub> = Σ(x<sub>i</sub>−x̄)(y<sub>i</sub>−ȳ)</td><td>«как x и y отклоняются вместе»; делённая на N−1 это ковариация cov(x,y)</td></tr>\n <tr><td>S<sub>xx</sub> = Σ(x<sub>i</sub>−x̄)²</td><td>делённая на N−1 это дисперсия var(x)</td></tr>\n <tr><td>β = ȳ − αx̄</td><td>прямая всегда проходит через точку средних (x̄, ȳ)</td></tr>\n <tr><td>r = S<sub>xy</sub>/√(S<sub>xx</sub>S<sub>yy</sub>)</td><td>коэффициент корреляции, от −1 до 1; α = r·s<sub>y</sub>/s<sub>x</sub></td></tr></table>\n <p>В примере r = 6/√(10·6) = 0.775. В коде лекции: <code>alpha = cov(x,y)/cov(x,x); beta = mean(y) − alpha*mean(x)</code>.</p>"}, {"k": "proof", "h": "Вывод формул α и β (метод наименьших квадратов)", "b": "<p><b>Цель:</b> минимизировать сумму квадратов остатков E(α,β) = Σ(y<sub>i</sub> − αx<sub>i</sub> − β)². Квадрат нужен, чтобы плюсы и минусы не гасили друг друга и чтобы функция была гладкой.</p>\n <ol class=\"big\">\n <li><b>Производная по β</b> равна нулю: dE/dβ = −2Σ(y<sub>i</sub> − αx<sub>i</sub> − β) = 0. Раскрываем: Σy<sub>i</sub> = αΣx<sub>i</sub> + Nβ. Делим на N: <b>ȳ = αx̄ + β</b>, откуда β = ȳ − αx̄. (Заодно: сумма остатков равна 0.)</li>\n <li><b>Производная по α</b>: dE/dα = −2Σ(y<sub>i</sub> − αx<sub>i</sub> − β)x<sub>i</sub> = 0.</li>\n <li>Подставляем β = ȳ − αx̄: Σ[(y<sub>i</sub>−ȳ) − α(x<sub>i</sub>−x̄)]·x<sub>i</sub> = 0.</li>\n <li>Трюк: Σ(y<sub>i</sub>−ȳ)x<sub>i</sub> = Σ(y<sub>i</sub>−ȳ)(x<sub>i</sub>−x̄) (потому что Σ(y<sub>i</sub>−ȳ)·x̄ = 0), и так же Σ(x<sub>i</sub>−x̄)x<sub>i</sub> = Σ(x<sub>i</sub>−x̄)². Получаем S<sub>xy</sub> − αS<sub>xx</sub> = 0, то есть <b>α = S<sub>xy</sub>/S<sub>xx</sub></b>.</li>\n <li><b>Это именно минимум:</b> матрица вторых производных [[2Σx<sub>i</sub>², 2Σx<sub>i</sub>],[2Σx<sub>i</sub>, 2N]] имеет определитель 4(NΣx<sub>i</sub>² − (Σx<sub>i</sub>)²) = 4N·S<sub>xx</sub> &gt; 0, если не все x одинаковы, и 2N &gt; 0. Значит положительно определена: решение единственно и является минимумом.</li></ol>\n <p>Два уравнения из шагов 1–2 называют <b>нормальными уравнениями</b>.</p>"}, {"k": "note", "h": "Тетрадь 1: что минимизируем", "b": "<div class=\"nb\"><div class=\"hd\">Модель и остаток</div><div class=\"ln\"><div class=\"fm\">ŷ<sub>i</sub> = <i>α</i>·<i>x</i><sub>i</sub> + <i>β</i></div><div class=\"nt\">предсказание прямой для точки i</div></div><div class=\"ln\"><div class=\"fm\">r<sub>i</sub> = <i>y</i><sub>i</sub> − <i>α</i><i>x</i><sub>i</sub> − <i>β</i></div><div class=\"nt\">остаток = настоящий y минус предсказание (вертикальное расстояние)</div></div><div class=\"hd\">Критерий МНК</div><div class=\"ln\"><div class=\"fm\">E(<i>α</i>,<i>β</i>) = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> r<sub>i</sub>² = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>y</i><sub>i</sub> − <i>α</i><i>x</i><sub>i</sub> − <i>β</i>)²</div><div class=\"nt\">сумма квадратов остатков (SSR). Квадрат убирает знаки</div></div><div class=\"ln\"><div class=\"fm\">min E(<i>α</i>,<i>β</i>)</div><div class=\"nt\">ищем α и β, при которых E наименьшая</div></div><div class=\"hd\">Два факта о среднем</div><div class=\"ln\"><div class=\"fm\"><span class=\"ov\"><i>x</i></span> = <span class=\"fr\"><span>1</span><span><i>N</i></span></span>·<span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub>  ⇒  <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub> = <i>N</i>·<span class=\"ov\"><i>x</i></span></div><div class=\"nt\">сумма = N · среднее</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"ov\"><i>y</i></span> = <span class=\"fr\"><span>1</span><span><i>N</i></span></span>·<span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>y</i><sub>i</sub>  ⇒  <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>y</i><sub>i</sub> = <i>N</i>·<span class=\"ov\"><i>y</i></span></div><div class=\"nt\">то же для y</div></div></div>"}, {"k": "note", "h": "Тетрадь 2: производные → нормальные уравнения", "b": "<div class=\"nb\"><div class=\"hd\">Правило: производная квадрата</div><div class=\"ln\"><div class=\"fm\">(u²)′ = 2u·u′</div><div class=\"nt\">u = y<sub>i</sub> − αx<sub>i</sub> − β</div></div><div class=\"ln\"><div class=\"fm\">du/d<i>β</i> = −1,   du/d<i>α</i> = −<i>x</i><sub>i</sub></div><div class=\"nt\">β входит с минусом, α умножена на x<sub>i</sub></div></div><div class=\"hd\">Шаг 1: производная по <i>β</i></div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>dE</span><span>d<i>β</i></span></span> = −2 <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>y</i><sub>i</sub> − <i>α</i><i>x</i><sub>i</sub> − <i>β</i>) = 0</div><div class=\"nt\">=0, потому что минимум</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>y</i><sub>i</sub> − <i>α</i><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub> − <i>N</i><i>β</i> = 0</div><div class=\"nt\">Σβ = Nβ, делим на −2</div></div><div class=\"hd\">Шаг 2: производная по <i>α</i></div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>dE</span><span>d<i>α</i></span></span> = −2 <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>y</i><sub>i</sub> − <i>α</i><i>x</i><sub>i</sub> − <i>β</i>)·<i>x</i><sub>i</sub> = 0</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub><i>y</i><sub>i</sub> − <i>α</i><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub>² − <i>β</i><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub> = 0</div></div><div class=\"hd\">Нормальные уравнения (линейная система, неоднородная)</div><div class=\"ln\"><div class=\"fm\"><i>α</i><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub> + <i>N</i><i>β</i> = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>y</i><sub>i</sub></div><div class=\"nt\">(1)</div></div><div class=\"ln\"><div class=\"fm\"><i>α</i><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub>² + <i>β</i><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub> = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub><i>y</i><sub>i</sub></div><div class=\"nt\">(2)  справа не нули, поэтому «неоднородная»</div></div></div>"}, {"k": "note", "h": "Тетрадь 3: откуда средние и β", "b": "<div class=\"nb\"><div class=\"hd\">Берём уравнение (1)</div><div class=\"ln\"><div class=\"fm\"><i>α</i><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub> + <i>N</i><i>β</i> = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>y</i><sub>i</sub></div></div><div class=\"ln\"><div class=\"fm\"><i>α</i>·<i>N</i><span class=\"ov\"><i>x</i></span> + <i>N</i><i>β</i> = <i>N</i><span class=\"ov\"><i>y</i></span></div><div class=\"nt\">заменили суммы на N · среднее</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span><i>α</i>·<i>N</i><span class=\"ov\"><i>x</i></span> + <i>N</i><i>β</i></span><span><i>N</i></span></span> = <span class=\"fr\"><span><i>N</i><span class=\"ov\"><i>y</i></span></span><span><i>N</i></span></span></div><div class=\"nt\">делим обе части на N</div></div><div class=\"ln\"><div class=\"fm\"><i>α</i><span class=\"ov\"><i>x</i></span> + <i>β</i> = <span class=\"ov\"><i>y</i></span></div><div class=\"nt\">N сократилось</div></div><div class=\"hd\">Результат</div><div class=\"ln\"><div class=\"fm\"><span class=\"box\"><i>β</i> = <span class=\"ov\"><i>y</i></span> − <i>α</i><span class=\"ov\"><i>x</i></span></span></div><div class=\"nt\">формула для β</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"ov\"><i>y</i></span> = <i>α</i><span class=\"ov\"><i>x</i></span> + <i>β</i></div><div class=\"nt\">то же самое: точка (x̄, ȳ) лежит на прямой</div></div></div>"}, {"k": "note", "h": "Тетрадь 4: подставляем β → получается α", "b": "<div class=\"nb\"><div class=\"hd\">Берём уравнение (2) и подставляем β = ȳ − αx̄</div><div class=\"ln\"><div class=\"fm\"><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub><i>y</i><sub>i</sub> − <i>α</i><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub>² − (<span class=\"ov\"><i>y</i></span> − <i>α</i><span class=\"ov\"><i>x</i></span>)·<i>N</i><span class=\"ov\"><i>x</i></span> = 0</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub><i>y</i><sub>i</sub> − <i>N</i><span class=\"ov\"><i>x</i></span><span class=\"ov\"><i>y</i></span> = <i>α</i> ( <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub>² − <i>N</i><span class=\"ov\"><i>x</i></span>² )</div><div class=\"nt\">раскрыли скобку, члены с α собрали справа</div></div><div class=\"hd\">Два тождества (раскрой скобки и используй Σx = N·x̄)</div><div class=\"ln\"><div class=\"fm\"><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>x</i><sub>i</sub>−<span class=\"ov\"><i>x</i></span>)(<i>y</i><sub>i</sub>−<span class=\"ov\"><i>y</i></span>) = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub><i>y</i><sub>i</sub> − <i>N</i><span class=\"ov\"><i>x</i></span><span class=\"ov\"><i>y</i></span></div><div class=\"nt\">числитель</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>x</i><sub>i</sub>−<span class=\"ov\"><i>x</i></span>)² = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub>² − <i>N</i><span class=\"ov\"><i>x</i></span>²</div><div class=\"nt\">знаменатель</div></div><div class=\"hd\">Результат</div><div class=\"ln\"><div class=\"fm\"><span class=\"box\"><i>α</i> = <span class=\"fr\"><span><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>x</i><sub>i</sub>−<span class=\"ov\"><i>x</i></span>)(<i>y</i><sub>i</sub>−<span class=\"ov\"><i>y</i></span>)</span><span><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>x</i><sub>i</sub>−<span class=\"ov\"><i>x</i></span>)²</span></span></span></div><div class=\"nt\">сумма произведений отклонений / сумма квадратов отклонений</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\"><i>α</i> = <span class=\"fr\"><span>cov(<i>x</i>,<i>y</i>)</span><span>var(<i>x</i>)</span></span></span></div><div class=\"nt\">N−1 сверху и снизу сокращается</div></div></div>"}, {"k": "note", "h": "Тетрадь 5: дисперсия, ковариация, корреляция", "b": "<div class=\"nb\"><div class=\"hd\">Дисперсия: разброс одной величины</div><div class=\"ln\"><div class=\"fm\">var(<i>x</i>) = <span class=\"fr\"><span><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>x</i><sub>i</sub> − <span class=\"ov\"><i>x</i></span>)²</span><span><i>N</i> − 1</span></span></div><div class=\"nt\">отклонение от среднего, в квадрате, усреднили</div></div><div class=\"ln\"><div class=\"fm\">s<sub>x</sub> = √var(<i>x</i>)</div><div class=\"nt\">стандартное отклонение, в единицах x</div></div><div class=\"hd\">Ковариация: как две величины меняются вместе</div><div class=\"ln\"><div class=\"fm\">cov(<i>x</i>,<i>y</i>) = <span class=\"fr\"><span><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>x</i><sub>i</sub> − <span class=\"ov\"><i>x</i></span>)(<i>y</i><sub>i</sub> − <span class=\"ov\"><i>y</i></span>)</span><span><i>N</i> − 1</span></span></div><div class=\"nt\">(+)(+) и (−)(−) дают плюс, (+)(−) даёт минус</div></div><div class=\"ln\"><div class=\"fm\">cov(<i>x</i>,<i>x</i>) = var(<i>x</i>)</div><div class=\"nt\">дисперсия: ковариация величины с самой собой</div></div><div class=\"hd\">Корреляция: ковариация без единиц измерения</div><div class=\"ln\"><div class=\"fm\">r = <span class=\"fr\"><span>cov(<i>x</i>,<i>y</i>)</span><span>s<sub>x</sub>·s<sub>y</sub></span></span></div><div class=\"nt\">всегда от −1 до 1</div></div><div class=\"ln\"><div class=\"fm\"><i>α</i> = <span class=\"fr\"><span>cov(<i>x</i>,<i>y</i>)</span><span>var(<i>x</i>)</span></span> = r·<span class=\"fr\"><span>s<sub>y</sub></span><span>s<sub>x</sub></span></span></div><div class=\"nt\">связь корреляции с наклоном</div></div><div class=\"hd\">Проверка на числах</div><div class=\"ln\"><div class=\"fm\">x: 1,2,3,4,5;  y: 2,4,5,4,5;  <span class=\"ov\"><i>x</i></span>=3,  <span class=\"ov\"><i>y</i></span>=4</div></div><div class=\"ln\"><div class=\"fm\">var(<i>x</i>) = <span class=\"fr\"><span>10</span><span>4</span></span> = 2.5,   cov = <span class=\"fr\"><span>6</span><span>4</span></span> = 1.5,   <i>α</i> = <span class=\"fr\"><span>1.5</span><span>2.5</span></span> = 0.6,   <i>β</i> = 4 − 0.6·3 = 2.2</div></div><div class=\"ln\"><div class=\"fm\">r = <span class=\"fr\"><span>1.5</span><span>1.581·1.225</span></span> = 0.775</div></div></div>"}, {"k": "quiz", "q": "В записи профессора y = αx + β что такое β?", "o": ["наклон прямой", "значение y при x = 0 (свободный член)", "коэффициент корреляции", "остаток"], "a": 1, "why": "В лекции α это наклон, β это свободный член (intercept). Прямая проходит через (x̄, ȳ), поэтому β = ȳ − αx̄."}, {"k": "quiz", "q": "Почему сумма остатков в МНК с свободным членом равна нулю?", "o": ["так получилось в примере", "из условия dE/dβ = 0", "из условия dE/dα = 0", "потому что r = 1"], "a": 1, "why": "dE/dβ = −2Σr<sub>i</sub> = 0, то есть Σr<sub>i</sub> = 0."}, {"k": "quiz", "q": "x̄ = 3, ȳ = 4, α = 0.6. Чему равен β?", "o": ["2.2", "1.8", "0.6", "4"], "a": 0, "why": "β = ȳ − αx̄ = 4 − 0.6·3 = 2.2."}, {"k": "note", "h": "Тетрадь: эталонные ответы на вопросы", "b": "<div class=\"nb\"><div class=\"hd\">Q: Least squares method for simple linear regression</div><div class=\"ln\"><div class=\"fm\">ŷ<sub>i</sub> = α<i>x</i><sub>i</sub> + β,   r<sub>i</sub> = <i>y</i><sub>i</sub> − α<i>x</i><sub>i</sub> − β</div><div class=\"nt\">остаток = факт − прогноз</div></div><div class=\"ln\"><div class=\"fm\">E(α,β) = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> r<sub>i</sub>² → min</div><div class=\"nt\">минимизируем сумму квадратов остатков (SSR)</div></div><div class=\"hd\">Q: Derive α and β</div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>dE</span><span>dβ</span></span> = 0  ⇒  <span class=\"box\">β = ȳ − αx̄</span></div><div class=\"nt\">прямая проходит через (x̄, ȳ)</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>dE</span><span>dα</span></span> = 0  ⇒  <span class=\"box\">α = <span class=\"fr\"><span><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>x</i><sub>i</sub>−x̄)(<i>y</i><sub>i</sub>−ȳ)</span><span><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>x</i><sub>i</sub>−x̄)²</span></span> = <span class=\"fr\"><span>cov(x,y)</span><span>var(x)</span></span></span></div><div class=\"nt\">после подстановки β</div></div><div class=\"ln\"><div class=\"fm\">гессиан положительно определён ⇒ единственный минимум</div></div><div class=\"hd\">Q: How is goodness of fit related to ρ</div><div class=\"ln\"><div class=\"fm\">SSR = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span>(y<sub>i</sub> − ȳ)² − α²<span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span>(x<sub>i</sub> − x̄)² = N·var(y) − α²·N·var(x)</div><div class=\"nt\">подставили ŷ</div></div><div class=\"ln\"><div class=\"fm\">α = <span class=\"fr\"><span>cov</span><span>var(x)</span></span>  ⇒  SSR = N·var(y)·(1 − ρ²) = SST·(1 − ρ²)</div><div class=\"nt\">cov² / (var x · var y) = ρ²</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">R² = 1 − SSR/SST = ρ²</span></div><div class=\"nt\">для простой регрессии</div></div></div>"}, {"k": "exam", "h": "Как отвечать «Linear regression / Alpha, Beta»", "b": "<ol class=\"big\"><li>Модель y = αx + β + r, α наклон, β свободный член, r ошибка.</li><li>Остаток r<sub>i</sub> = y<sub>i</sub> − αx<sub>i</sub> − β, вертикальное расстояние.</li><li>Критерий: min E(α,β) = Σr<sub>i</sub>².</li><li>Нормальные уравнения (производные = 0) и их решение: α = cov(x,y)/var(x), β = ȳ − αx̄.</li><li>Проверка на минимум (Гессиан положительно определён).</li><li>Мини-пример с числами и r.</li></ol>"}, {"k": "exam", "h": "Эталонный ответ (так можно писать на экзамене)", "b": "<p><b>Linear regression.</b> Линейная регрессия моделирует зависимость y от x прямой y = αx + β + r, где α — наклон (slope), β — свободный член (intercept), r — остаток (ошибка).</p>\n<p><b>Остаток</b> r<sub>i</sub> = y<sub>i</sub> − αx<sub>i</sub> − β. Параметры выбираются так, чтобы минимизировать сумму квадратов остатков E(α,β) = Σr<sub>i</sub>².</p>\n<p><b>Вывод.</b> dE/dβ = 0 даёт β = ȳ − αx̄. dE/dα = 0 после подстановки β даёт α = Σ(x<sub>i</sub>−x̄)(y<sub>i</sub>−ȳ) / Σ(x<sub>i</sub>−x̄)² = cov(x,y)/var(x). Гессиан положительно определён (определитель 4N·S<sub>xx</sub> &gt; 0), значит это единственный минимум.</p>\n<p><b>Пример.</b> x = 1..5, y = 2,4,5,4,5: α = 6/10 = 0.6, β = 4 − 0.6·3 = 2.2, SSR = 2.4.</p>\n<p><b>Обозначения:</b> у Gorgone α = наклон, β = свободный член; в слайдах Davide и ISLR наоборот: β<sub>0</sub> = intercept, β<sub>1</sub> = slope. На экзамене сразу скажи, какое обозначение берёшь, и подпиши, что есть что.</p><p><b>Alpha / Beta (в обозначениях лекции Gorgone):</b> α = slope = cov(x,y)/var(x), β = intercept = mean(y) − α·mean(x). Прямая проходит через (x̄, ȳ).</p>"}], "part": "Часть 2 · Регрессия"}, {"id": "err", "title": "5. SSR, MSE, R²", "goal": "Ошибки модели: сумма квадратов остатков, MSE, качество подгонки.", "cards": [{"k": "story", "h": "Осторожно: SSR у профессора", "b": "<p>В лекции <b>SSR = Sum of Squared Residuals</b> = сумма квадратов остатков = E(α) = Σ(y<sub>i</sub> − f(x<sub>i</sub>, α))². Её же называют SSE (Sum of Squared Errors, лекция употребляет оба названия).</p>\n <p>Во многих других учебниках SSR значит наоборот «сумма квадратов, объяснённая регрессией». Поэтому на экзамене <b>пиши формулой</b>: «SSR = Σr<sub>i</sub>²».</p>\n <p><b>MSE</b> (Mean Squared Error) — это та же сумма, но усреднённая: MSE = SSR / N. Это «средний квадрат ошибки», удобно сравнивать между наборами разного размера.</p>"}, {"k": "num", "h": "Числа из прошлой темы", "b": "<p>Остатки: −0.8; 0.6; 1.0; −0.6; −0.2.</p><p><b>SSR</b> = 0.64 + 0.36 + 1 + 0.36 + 0.04 = <b>2.4</b>. <b>MSE</b> = 2.4/5 = <b>0.48</b>. <b>RMSE</b> = √0.48 ≈ 0.693 (в тех же единицах, что y).</p>\n <p><b>Полная вариация</b> SST = Σ(y<sub>i</sub> − ȳ)² = 4+0+1+0+1 = 6. <b>R² = 1 − SSR/SST = 1 − 2.4/6 = 0.6</b>: модель объясняет 60% разброса y (и r² = 0.775² = 0.6, это совпадение не случайно в простой регрессии).</p>"}, {"k": "formula", "h": "Формулы по буквам", "b": "<table class=\"sym\"><tr><td>SSR = Σr<sub>i</sub>²</td><td>сумма квадратов остатков (то, что МНК минимизирует)</td></tr><tr><td>MSE = SSR/N</td><td>средний квадрат ошибки; иногда делят на N−p (p параметров), чтобы оценка была несмещённой</td></tr><tr><td>RMSE = √MSE</td><td>типичная ошибка в единицах y</td></tr><tr><td>SST = Σ(y<sub>i</sub>−ȳ)²</td><td>полный разброс y вокруг среднего (ошибка «модели-константы» ȳ)</td></tr><tr><td>R² = 1 − SSR/SST</td><td>доля объяснённого разброса: 1 идеально, 0 как среднее</td></tr><tr><td>R²<sub>adj</sub> = 1 − (1−R²)(N−1)/(N−p−1)</td><td>R² со штрафом за лишние переменные (p предикторов)</td></tr></table>"}, {"k": "proof", "h": "Вывод: SST = SSR + (объяснённая часть)", "b": "<p>Пусть ŷ<sub>i</sub> — прогноз, r<sub>i</sub> = y<sub>i</sub> − ŷ<sub>i</sub>. Тогда y<sub>i</sub> − ȳ = (y<sub>i</sub> − ŷ<sub>i</sub>) + (ŷ<sub>i</sub> − ȳ). Возводим в квадрат и суммируем:</p>\n <p>Σ(y<sub>i</sub>−ȳ)² = Σr<sub>i</sub>² + Σ(ŷ<sub>i</sub>−ȳ)² + 2Σr<sub>i</sub>(ŷ<sub>i</sub>−ȳ).</p>\n <p>Смешанный член равен нулю: ŷ<sub>i</sub> − ȳ = α(x<sub>i</sub> − x̄), а из нормальных уравнений Σr<sub>i</sub> = 0 и Σr<sub>i</sub>x<sub>i</sub> = 0 (остатки ортогональны столбцам 1 и x). Значит Σr<sub>i</sub>(ŷ<sub>i</sub>−ȳ) = αΣr<sub>i</sub>x<sub>i</sub> − αx̄Σr<sub>i</sub> = 0.</p>\n <p><b>Итог:</b> SST = SSR + SS<sub>объяснённая</sub>, поэтому R² = 1 − SSR/SST = SS<sub>объяснённая</sub>/SST ∈ [0,1].</p>\n <p><b>Почему SSR не годится для выбора модели:</b> при добавлении переменных SSR только падает (R² растёт) даже на мусоре, поэтому нужны adj R² или проверка на новых данных (тема 5).</p>"}, {"k": "quiz", "q": "SSR = 2.4, N = 5. Чему равен MSE?", "o": ["0.48", "12", "2.4", "1.55"], "a": 0, "why": "MSE = SSR/N = 2.4/5 = 0.48."}, {"k": "quiz", "q": "SST = 6, SSR = 2.4. Чему равен R²?", "o": ["0.4", "0.6", "2.5", "3.6"], "a": 1, "why": "R² = 1 − 2.4/6 = 0.6."}, {"k": "note", "h": "Тетрадь: SSR, MSE, R²", "b": "<div class=\"nb\"><div class=\"hd\">Определения</div><div class=\"ln\"><div class=\"fm\">SSR = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> r<sub>i</sub>² = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>y</i><sub>i</sub> − ŷ<sub>i</sub>)²</div><div class=\"nt\">сумма квадратов остатков</div></div><div class=\"ln\"><div class=\"fm\">MSE = <span class=\"fr\"><span>SSR</span><span><i>N</i></span></span></div><div class=\"nt\">средний квадрат ошибки</div></div><div class=\"ln\"><div class=\"fm\">RMSE = √MSE</div><div class=\"nt\">в единицах y</div></div><div class=\"ln\"><div class=\"fm\">SST = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>y</i><sub>i</sub> − <span class=\"ov\"><i>y</i></span>)²</div><div class=\"nt\">полный разброс y вокруг среднего</div></div><div class=\"hd\">Разложение</div><div class=\"ln\"><div class=\"fm\">(<i>y</i><sub>i</sub>−<span class=\"ov\"><i>y</i></span>) = (<i>y</i><sub>i</sub>−ŷ<sub>i</sub>) + (ŷ<sub>i</sub>−<span class=\"ov\"><i>y</i></span>)</div><div class=\"nt\">прибавили и вычли ŷ</div></div><div class=\"ln\"><div class=\"fm\">SST = SSR + <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (ŷ<sub>i</sub>−<span class=\"ov\"><i>y</i></span>)²</div><div class=\"nt\">смешанный член = 0, потому что Σr = 0 и Σrx = 0</div></div><div class=\"hd\">Коэффициент детерминации</div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">R² = 1 − <span class=\"fr\"><span>SSR</span><span>SST</span></span></span></div><div class=\"nt\">доля объяснённого разброса, от 0 до 1</div></div><div class=\"ln\"><div class=\"fm\">R²<sub>adj</sub> = 1 − (1−R²)<span class=\"fr\"><span>N−1</span><span>N−p−1</span></span></div><div class=\"nt\">штраф за число предикторов p</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>2.4</span><span>6</span></span>=0.4,   R² = 1 − 0.4 = 0.6,   MSE = <span class=\"fr\"><span>2.4</span><span>5</span></span> = 0.48</div><div class=\"nt\">числа из нашего примера</div></div></div>"}, {"k": "note", "h": "Тетрадь: эталонные ответы на вопросы", "b": "<div class=\"nb\"><div class=\"hd\">Q: Sum of squared residuals, MSE, R²</div><div class=\"ln\"><div class=\"fm\">SSR = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (y<sub>i</sub> − ŷ<sub>i</sub>)²</div><div class=\"nt\">сумма квадратов остатков (то, что минимизирует МНК)</div></div><div class=\"ln\"><div class=\"fm\">MSE = <span class=\"fr\"><span>SSR</span><span>N</span></span>,   RMSE = √MSE</div><div class=\"nt\">средний квадрат ошибки; RMSE в единицах y</div></div><div class=\"ln\"><div class=\"fm\">SST = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (y<sub>i</sub> − ȳ)²</div><div class=\"nt\">полный разброс y вокруг среднего</div></div><div class=\"ln\"><div class=\"fm\">SST = SSR + SSM</div><div class=\"nt\">остатки ортогональны ŷ − ȳ; SSM = Σ(ŷ − ȳ)² объяснённая часть</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">R² = 1 − SSR/SST</span></div><div class=\"nt\">доля объяснённой дисперсии; 1 — идеально, 0 — не лучше среднего</div></div></div>"}, {"k": "exam", "h": "Ответ «Sum of squared residuals / MSE»", "b": "<ol class=\"big\"><li>Остаток r<sub>i</sub> = y<sub>i</sub> − f(x<sub>i</sub>,α).</li><li>SSR = Σr<sub>i</sub>², это функция E(α), которую минимизирует МНК.</li><li>MSE = SSR/N (RMSE = √MSE).</li><li>Связь с R² и SST.</li><li>Оценка ошибки на тестовых данных (cross-validation) честнее, чем на обучающих.</li></ol>"}, {"k": "exam", "h": "Эталонный ответ (так можно писать на экзамене)", "b": "<p><b>Sum of Squared Residuals (SSR/SSE).</b> SSR = Σ<sub>i=1..N</sub> r<sub>i</sub>² = Σ(y<sub>i</sub> − f(x<sub>i</sub>,α))² — функция E(α), которую минимизирует метод наименьших квадратов. Возведение в квадрат убирает знаки, штрафует большие ошибки сильнее и делает функцию гладкой и выпуклой (для линейной модели).</p>\n<p><b>MSE</b> = SSR/N — средний квадрат ошибки (RMSE = √MSE в единицах y). Для тестовых данных это основной критерий качества прогноза.</p>\n<p><b>R²</b> = 1 − SSR/SST, где SST = Σ(y<sub>i</sub>−ȳ)². Вывод: SST = SSR + Σ(ŷ<sub>i</sub>−ȳ)², потому что остатки ортогональны ŷ − ȳ.</p>\n<p><b>Пример:</b> остатки −0.8; 0.6; 1.0; −0.6; −0.2 → SSR = 2.4, MSE = 0.48, SST = 6, R² = 0.6.</p>"}], "part": "Часть 2 · Ре
