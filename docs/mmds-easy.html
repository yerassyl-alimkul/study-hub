 = 2.25:   dE/da = −1.5,   a₃ = 2.625  →  …  →  3</div><div class=\"nt\">расстояние до 3 каждый раз вдвое меньше: 3, 1.5, 0.75, 0.375, это множитель 1 − 2t = 0.5</div></div><p>Здесь формула проще, но для логистической регрессии её нет, и остаются только шаги. Поэтому дальше мы учимся делать шаги быстро и в правильную сторону.</p></div>"}, {"k": "story", "h": "Зачем искать минимум: пример с числами", "b": "<div class=\"nb ex\"><div class=\"hd\">Задача на примере: подобрать правило</div><p>У тебя есть таблица прошлых продаж квартир. Нужно правило, чтобы оценивать <b>новую</b> квартиру: цена = a × площадь. Число a неизвестно. Любое a даёт какие-то прогнозы, но разные a ошибаются по-разному. Как выбрать лучшее?</p><div class=\"ln\"><div class=\"fm\">Данные (площадь; цена): (1; 2), (2; 3), (3; 5)</div><div class=\"nt\">площадь в десятках м², цена в десятках тыс. €</div></div><div class=\"hd\">Пробуем разные a и смотрим, насколько ошибаемся</div><div class=\"ln\"><div class=\"fm\">a = 1:  прогнозы 1; 2; 3,  настоящие 2; 3; 5</div><div class=\"nt\">недооценили на 1; 1; 2</div></div><div class=\"ln\"><div class=\"fm\">ошибка = 1² + 1² + 2² = 6</div><div class=\"nt\">возводим в квадрат и складываем, чтобы получить одно число «насколько плохо»</div></div><div class=\"ln\"><div class=\"fm\">a = 2:  прогнозы 2; 4; 6,  настоящие 2; 3; 5</div><div class=\"nt\">переоценили на 0; 1; 1</div></div><div class=\"ln\"><div class=\"fm\">ошибка = 0² + 1² + 1² = 2</div></div><div class=\"ln\"><div class=\"fm\">a = 1.643:  прогнозы 1.64; 3.29; 4.93</div><div class=\"nt\">промахи 0.36; −0.29; 0.07</div></div><div class=\"ln\"><div class=\"fm\">ошибка = 0.127 + 0.082 + 0.005 = 0.214</div><div class=\"nt\">это наименьшая ошибка из всех возможных a</div></div><div class=\"hd\">В чём смысл</div><p>Функция ошибки E(a) это просто таблица «значение a → насколько плохо». Минимум E это строка таблицы, где «плохо» меньше всего, то есть <b>лучшее a</b>. Искать минимум не самоцель: это способ выбрать лучшее правило. Компьютер не может «догадаться», какое правило хорошее, ему нужно число, которое можно сравнивать: меньше значит лучше.</p><div class=\"hd\">Что мы получили в итоге</div><div class=\"ln\"><div class=\"fm\">новая квартира 2.5:  1.643 × 2.5 = 4.1</div><div class=\"nt\">прогноз около 41 тыс. € для квартиры, которой нет в таблице</div></div><div class=\"hd\">Ещё два примера</div><p><b>Две точки доставки пиццы.</b> Дома стоят на отметках 1, 2, 4, 9, 10, 12 вдоль улицы. Ошибка E = сумма квадратов расстояний от каждого дома до ближайшей точки. Это и есть k-means (тема 16).</p><div class=\"ln\"><div class=\"fm\">точки на 5 и 8:  E = 16 + 9 + 1 + 1 + 4 + 16 = 47</div><div class=\"nt\">дома далеко от точек: плохо</div></div><div class=\"ln\"><div class=\"fm\">точки на 2.33 и 10.33:  E = 9.33</div><div class=\"nt\">в 5 раз меньше: минимум E дал лучшее расположение</div></div><p><b>Спам-фильтр.</b> У каждого слова есть вес, и E показывает, сколько писем фильтр классифицировал неверно. Весов тысячи, формулы для минимума нет. Поэтому веса подкручивают шагами: «чуть изменили, ошибок стало меньше?». Так идут вниз по склону в тумане (тема 18).</p><div class=\"hd\">Итог одной строкой</div><p>Модель это формула с «ручками» (параметрами). Функция ошибки это счётчик «насколько плохо». Оптимизация это подкручивание ручек, пока счётчик не станет наименьшим.</p></div>"}, {"k": "story", "h": "Как минимум функции уменьшает ошибку модели", "b": "<div class=\"nb ex\"><div class=\"hd\">Что именно мы меняем</div><p>В функции ошибки E переменные это <b>не данные</b> x и y (они уже известны и не меняются), а <b>параметры модели</b>: α, β или a. Каждый выбор параметров это своя модель, и для неё считается одно число E: насколько эта модель ошибается на данных. Значит, E(параметры) это «карта качества»: по ней видно, какие параметры хуже, а какие лучше.</p><div class=\"hd\">Почему минимум функции = лучшая модель</div><div class=\"ln\"><div class=\"fm\">E(a) = Σ (y<sub>i</sub> − a·x<sub>i</sub>)²</div><div class=\"nt\">сумма квадратов остатков: чем она меньше, тем ближе прогнозы к данным</div></div><p>Функция E и есть ошибка модели, поэтому «найти минимум E» и «сделать ошибку модели наименьшей» это одно и то же действие. Остатки возводят в квадрат, чтобы плюс и минус не гасили друг друга: тогда E ≥ 0, и E = 0 только когда модель попала во все точки.</p><div class=\"hd\">Числа: данные (1, 2), (2, 3), (3, 5), модель ŷ = a·x</div><div class=\"ln\"><div class=\"fm\">E(a) = (2 − a)² + (3 − 2a)² + (5 − 3a)² = 38 − 46a + 14a²</div><div class=\"nt\">подставили три точки и раскрыли скобки</div></div><div class=\"ln\"><div class=\"fm\">a = 1:   E = 38 − 46 + 14 = 6</div><div class=\"nt\">прямая слишком пологая, ошибка большая</div></div><div class=\"ln\"><div class=\"fm\">a = 2:   E = 38 − 92 + 56 = 2</div><div class=\"nt\">слишком крутая</div></div><div class=\"ln\"><div class=\"fm\">a = 1.5:   E = 38 − 69 + 31.5 = 0.5</div><div class=\"nt\">лучше обоих</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>dE</span><span>da</span></span> = −46 + 28a = 0  ⇒  a = 1.643</div><div class=\"nt\">минимум E: производная равна нулю; здесь E = 0.214</div></div><div class=\"ln\"><div class=\"fm\">ŷ = 1.643;  3.286;  4.929   остатки: 0.357;  −0.286;  0.071</div><div class=\"nt\">проверка: 0.127 + 0.082 + 0.005 = 0.214</div></div><p>Ни при каком другом a ошибка не бывает меньше 0.214. Поэтому «нашли минимум E» значит «нашли лучшее a».</p><div class=\"hd\">Где здесь оптимизация</div><p>Для одного параметра минимум нашёлся формулой dE/da = 0. Если параметров много или уравнение нелинейное, формулы нет, но задача та же: найти параметры с наименьшей E. Тогда минимум ищут шагами (следующие темы).</p><div class=\"hd\">Оговорка</div><p>Минимальная ошибка на <b>имеющихся</b> данных не всегда значит лучшую модель на <b>новых</b> данных. Например, полином степени N − 1 проходит через все N точек (E = 0), но «выучивает» шум. Поэтому дополнительно проверяют модель на отложенных данных (cross-validation, тема 9).</p></div>"}, {"k": "story", "h": "Что такое гессиан", "b": "<div class=\"nb ex\"><div class=\"hd\">Что такое гессиан</div><p><b>Гессиан H</b> это матрица всех вторых производных функции нескольких переменных. Для f(x, y) она имеет размер 2×2. Вторая производная показывает, как быстро меняется наклон, то есть <b>кривизну</b> функции.</p><div class=\"hd\">Как он записывается</div><div class=\"ln\"><div class=\"fm\">H<sub>11</sub> = <span class=\"fr\"><span>d²f</span><span>dx²</span></span></div><div class=\"nt\">как быстро меняется наклон вдоль x</div></div><div class=\"ln\"><div class=\"fm\">H<sub>12</sub> = H<sub>21</sub> = <span class=\"fr\"><span>d²f</span><span>dx dy</span></span></div><div class=\"nt\">смешанная: как наклон по x меняется при сдвиге по y; H симметрична, порядок производных неважен</div></div><div class=\"ln\"><div class=\"fm\">H<sub>22</sub> = <span class=\"fr\"><span>d²f</span><span>dy²</span></span></div><div class=\"nt\">как быстро меняется наклон вдоль y</div></div><p>Всего n переменных, значит матрица n×n. Чтобы её составить, берём производную по x<sub>i</sub> от производной по x<sub>j</sub>.</p><div class=\"hd\">Зачем он нужен: проверка минимума</div><p>Для одной переменной: d²f/dx² &gt; 0 значит «чаша» (минимум), &lt; 0 значит «горб» (максимум). Для многих переменных кривизна зависит от направления, поэтому нужна целая матрица. Смотрим на её собственные числа λ (кривизна вдоль главных направлений):</p><div class=\"ln\"><div class=\"fm\">все λ &gt; 0  (H ≻ 0)</div><div class=\"nt\">чаша: если первые производные равны 0, это строгий минимум</div></div><div class=\"ln\"><div class=\"fm\">все λ &lt; 0</div><div class=\"nt\">горб: максимум</div></div><div class=\"ln\"><div class=\"fm\">λ разных знаков</div><div class=\"nt\">седло: вверх в одну сторону, вниз в другую</div></div><div class=\"ln\"><div class=\"fm\">все λ ≥ 0  (H ⪰ 0)</div><div class=\"nt\">чаша с плоским дном: условие выпуклости; для выпуклой f любой минимум глобальный</div></div><div class=\"hd\">Где он встретится дальше</div><div class=\"ln\"><div class=\"fm\">Метод Ньютона (тема 22)</div><div class=\"nt\">шаг d = −H⁻¹·(вектор первых производных): гессиан говорит, насколько круто изгибается «чаша», и шаг подбирается под неё</div></div><div class=\"ln\"><div class=\"fm\">Градиентный спуск (тема 20)</div><div class=\"nt\">κ = λ<sub>max</sub> / λ<sub>min</sub>: отношение наибольшей кривизны к наименьшей определяет скорость сходимости</div></div><div class=\"hd\">Числа: f(x, y) = x² + 3y²</div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>df</span><span>dx</span></span> = 2x,   <span class=\"fr\"><span>df</span><span>dy</span></span> = 6y</div><div class=\"nt\">первые производные</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>d²f</span><span>dx²</span></span> = 2,   <span class=\"fr\"><span>d²f</span><span>dy²</span></span> = 6,   <span class=\"fr\"><span>d²f</span><span>dx dy</span></span> = 0</div><div class=\"nt\">вторые производные: смешанная равна 0, потому что 2x не зависит от y</div></div><div class=\"ln\"><div class=\"fm\">H = diag(2, 6),   λ = 2 и 6</div><div class=\"nt\">оба λ &gt; 0: H ≻ 0, точка (0, 0) это минимум, f сильнее изгибается вдоль y</div></div><div class=\"ln\"><div class=\"fm\">Для f = x² − y²:   H = diag(2, −2),   λ = 2 и −2</div><div class=\"nt\">знаки разные: (0, 0) это седло, не минимум</div></div></div>"}, {"k": "story", "h": "График: карта высот, градиент и шаг вниз", "b": "<div class=\"nb ex\"><div class=\"hd\">Как читать картинку</div><div class=\"viz\" data-v=\"contour\"></div><p>Представь карту местности с линиями высоты. Каждый <b>овал</b> это линия, вдоль которой функция f одинакова (на этом овале «высота» одна и та же). Чем меньше овал, тем ниже значение f. В самом центре дно «чаши»: <b>минимум</b>. Здесь f = x² + 3y².</p><p>Овалы вытянуты вдоль x, потому что по y функция растёт втрое быстрее (коэффициент 3): стоит чуть отойти по y, и f уже заметно выросла, а по x нужно уйти далеко.</p><div class=\"hd\">Что такое градиент на картинке</div><p><b>Градиент</b> (красная стрелка) это вектор из первых производных (df/dx, df/dy). Он показывает, в какую сторону f растёт быстрее всего, то есть «прямо в гору». Зелёная стрелка (<b>−градиент</b>) смотрит в противоположную сторону: «прямо вниз». Мы идём по ней.</p><p><b>Почему градиент перпендикулярен овалу.</b> Вдоль овала f не меняется, значит производная вдоль касательной к овалу равна нулю. Градиент даёт направление наибольшего роста, а значит он перпендикулярен направлению, где рост нулевой. Серый пунктир это касательная к овалу, красная стрелка стоит к ней под прямым углом.</p><p><b>Важное наблюдение.</b> Оранжевая стрелка идёт точно в минимум, а зелёная (−градиент) смотрит в другую сторону. На вытянутых овалах «самый крутой спуск» не совпадает с «кратчайшим путём к дну». Из-за этого спуск идёт зигзагом (смотри дальше, тема 18).</p><div class=\"hd\">Числа в точке P = (1.6; 0.7)</div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>df</span><span>dx</span></span> = 2x = 3.2,   <span class=\"fr\"><span>df</span><span>dy</span></span> = 6y = 4.2</div><div class=\"nt\">первые производные: градиент (3.2; 4.2)</div></div><div class=\"ln\"><div class=\"fm\">f(P) = 1.6² + 3·0.7² = 2.56 + 1.47 = 4.03</div><div class=\"nt\">высота в точке P</div></div><div class=\"ln\"><div class=\"fm\">t = 0.1:   (1.6; 0.7) − 0.1·(3.2; 4.2) = (1.28; 0.28)</div><div class=\"nt\">шаг по −градиенту, длина шага t = 0.1</div></div><div class=\"ln\"><div class=\"fm\">f = 1.28² + 3·0.28² = 1.638 + 0.235 = 1.87</div><div class=\"nt\">стало 1.87 вместо 4.03: мы спустились ниже</div></div></div>"}, {"k": "story", "h": "Задача и условия минимума", "b": "<p>Нужно найти x*, минимизирующий f(x). <b>Локальный минимум</b> — наименьшее значение в окрестности, <b>глобальный</b> — наименьшее вообще.</p><ul class=\"big\"><li><b>Необходимое условие 1-го порядка:</b> если x* — локальный минимум, то ∇f(x*) = 0 (стационарная точка).</li><li><b>Необходимое 2-го порядка:</b> ∇f(x*) = 0 и гессиан H(x*) ⪰ 0 (положительно полуопределён).</li><li><b>Достаточное:</b> ∇f(x*) = 0 и H(x*) ≻ 0 ⇒ строгий локальный минимум.</li></ul><p>Стационарная точка не всегда минимум: у f = x³ производная в 0 равна 0, но это не минимум (седло).</p>"}, {"k": "story", "h": "График: глобальный и локальный минимум, максимум и «ложная» точка", "b": "<div class=\"nb ex\"><div class=\"hd\">Как читать картинку</div><div class=\"viz\" data-v=\"min1\"></div><p>По горизонтали откладываем параметр x, по вертикали значение f(x), то есть ошибку. <b>Чем ниже точка кривой, тем меньше ошибка.</b> Нам нужна самая нижняя точка всей кривой.</p><p><b>Пунктирные линии это касательные.</b> В дне любой впадины и на вершине горба кривая на мгновение горизонтальна, то есть наклон равен нулю: f′(x) = 0. Такие точки называют <b>стационарными</b>. Они кандидаты на минимум, но кандидат ещё не победитель.</p><div class=\"ln\"><div class=\"fm\">зелёная точка слева</div><div class=\"nt\">глобальный минимум: самая низкая точка всего графика. Её мы и ищем</div></div><div class=\"ln\"><div class=\"fm\">оранжевая точка справа</div><div class=\"nt\">локальный минимум: ниже всех соседей, но на графике есть точка ещё ниже. Алгоритм может застрять здесь</div></div><div class=\"ln\"><div class=\"fm\">красная точка на горбе</div><div class=\"nt\">локальный максимум: f′ = 0, но вокруг значения НИЖЕ, это вершина, а не дно</div></div><p><b>Правая панель, f = x³.</b> В нуле касательная тоже горизонтальна (f′(0) = 0), но слева значения меньше нуля, справа больше. Здесь нет ни минимума, ни максимума. Почему: вторая производная f″(0) = 0, нет кривизны, которая загнула бы кривую вверх. Поэтому условие «f′ = 0» <b>необходимо, но недостаточно</b>.</p><div class=\"hd\">Что делать на практике</div><p>Найти все стационарные точки, сравнить значения f в них и взять наименьшее. Если функция выпуклая (следующая картинка), ловушек нет: любой найденный минимум глобальный.</p><div class=\"hd\">Числа: f(x) = x⁴/4 − x² + 0.4x</div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>df</span><span>dx</span></span> = x³ − 2x + 0.4 = 0</div><div class=\"nt\">условие стационарности; три корня</div></div><div class=\"ln\"><div class=\"fm\">x ≈ −1.51:  f ≈ −1.58</div><div class=\"nt\">самое низкое значение: глобальный минимум</div></div><div class=\"ln\"><div class=\"fm\">x ≈ 0.20:  f ≈ 0.04</div><div class=\"nt\">локальный максимум</div></div><div class=\"ln\"><div class=\"fm\">x ≈ 1.30:  f ≈ −0.46</div><div class=\"nt\">локальный минимум: выше, чем −1.58</div></div></div>"}, {"k": "formula", "h": "Выпуклость: определения", "b": "<table class=\"sym\"><tr><td>выпуклое множество</td><td>вместе с любыми двумя точками содержит отрезок между ними. Примеры: шары любой нормы, подпространства, ℝⁿ₊, конус PSD-матриц</td></tr><tr><td>выпуклая функция</td><td>f((1−α)x + αy) ≤ (1−α)f(x) + αf(y), α ∈ [0,1]: хорда выше графика</td></tr><tr><td>1-й порядок</td><td>f(y) ≥ f(x) + ∇f(x)ᵀ(y − x): касательная лежит ниже графика</td></tr><tr><td>2-й порядок</td><td>H(x) ⪰ 0 для всех x</td></tr><tr><td>строго выпуклая</td><td>неравенства строгие; достаточно H ≻ 0 (но x⁴ строго выпукла при H(0) = 0)</td></tr><tr><td>сильно выпуклая</td><td>H ⪰ mI, m &gt; 0</td></tr></table>"}, {"k": "story", "h": "График: что значит «выпуклая функция»", "b": "<div class=\"nb ex\"><div class=\"hd\">Три панели</div><div class=\"viz\" data-v=\"convex\"></div><p><b>Левая панель: хорда.</b> Берём две любые точки на кривой и соединяем их отрезком (хорда). Если кривая везде <b>ниже</b> отрезка (зелёная область между ними), то функция выпуклая. Формула это и говорит: f((1−α)x + αy) ≤ (1−α)f(x) + αf(y). Левая часть это высота кривой в точке между x и y, правая это высота хорды в той же точке.</p><p><b>Средняя панель: касательная.</b> Для выпуклой функции касательная в любой точке лежит <b>под</b> графиком (зелёная область): f(y) ≥ f(x) + f′(x)(y − x). Это второе, эквивалентное определение.</p><p><b>Почему это важно для минимума.</b> Если f′(x*) = 0, касательная в x* горизонтальна на высоте f(x*). А весь график лежит выше касательной. Значит, f(y) ≥ f(x*) для любого y: x* это <b>глобальный</b> минимум. Вот почему для выпуклых функций достаточно найти точку, где производная равна нулю.</p><p><b>Правая панель: не выпуклая.</b> Хорда уходит под график (красная область). Условие нарушено, у функции есть несколько впадин, и можно застрять в неглубокой.</p><div class=\"hd\">Числа: f = x²</div><div class=\"ln\"><div class=\"fm\">x = −1, y = 2, α = 0.5</div><div class=\"nt\">две точки и середина между ними</div></div><div class=\"ln\"><div class=\"fm\">f(0.5) = 0.25  ≤  (1 + 4)/2 = 2.5</div><div class=\"nt\">кривая в середине ниже хорды: выпукла ✓</div></div><div class=\"ln\"><div class=\"fm\">касательная в x = 1:  1 + 2(y − 1);  при y = 3 это 5 ≤ f(3) = 9</div><div class=\"nt\">касательная ниже графика ✓</div></div></div>"}, {"k": "proof", "h": "Вывод: у выпуклой функции стационарная точка — глобальный минимум", "b": "<ol class=\"big\"><li>Из определения выпуклости: f(x + α(y−x)) ≤ (1−α)f(x) + αf(y) для α ∈ (0,1].</li><li>Переносим: [f(x + α(y−x)) − f(x)]/α ≤ f(y) − f(x).</li><li>Левая часть при α → 0 стремится к производной по направлению: ∇f(x)ᵀ(y − x). Получаем <b>f(y) ≥ f(x) + ∇f(x)ᵀ(y−x)</b>.</li><li>Если ∇f(x*) = 0, то f(y) ≥ f(x*) для всех y: x* — <b>глобальный минимум</b>.</li></ol><p><b>Вывод:</b> для выпуклых функций любой локальный минимум глобален, а условие ∇f = 0 необходимо и достаточно. Поэтому выпуклость так важна в оптимизации: ловушек из локальных минимумов нет. Для строго выпуклой минимум ещё и единственен.</p>"}, {"k": "num", "h": "Числа", "b": "<p>f = x²: f′ = 2x = 0 в 0, f″ = 2 &gt; 0 ⇒ минимум. f = x³: f′(0) = 0, f″(0) = 0, слева значения меньше, чем в 0 ⇒ не минимум. f = (x² − 1)²: два глобальных минимума в x = ±1 и локальный максимум в 0 ⇒ невыпуклая.</p><p>f = x² + 3y²: H = diag(2, 6) ≻ 0 ⇒ строго (и сильно, m = 2) выпуклая, единственный минимум (0, 0). f = eˣ выпукла и строго, но минимума не имеет (значения &gt; 0, 0 не достигается): выпуклость не гарантирует <b>существование</b> минимума.</p><p>Вейерштрасс: непрерывная функция на замкнутом ограниченном множестве достигает минимума и максимума.</p>"}, {"k": "quiz", "q": "f = x³, f′(0) = 0. Это минимум?", "o": ["нет, седловая точка", "да", "максимум", "нельзя сказать"], "a": 0, "why": "f″(0) = 0, и слева значения меньше."}, {"k": "quiz", "q": "f выпукла и ∇f(x*) = 0. Что можно утверждать?", "o": ["x* — глобальный минимум", "x* — локальный максимум", "минимума нет", "x* — седло"], "a": 0, "why": "Из f(y) ≥ f(x*) + 0."}, {"k": "note", "h": "Тетрадь: эталонные ответы на вопросы", "b": "<div class=\"nb\"><div class=\"hd\">Q: First- and second-order optimality conditions</div><div class=\"ln\"><div class=\"fm\">∇f(x*) = 0</div><div class=\"nt\">необходимое 1-го порядка (стационарная точка)</div></div><div class=\"ln\"><div class=\"fm\">∇f(x*) = 0 и H(x*) ⪰ 0</div><div class=\"nt\">необходимое 2-го порядка</div></div><div class=\"ln\"><div class=\"fm\">∇f(x*) = 0 и H(x*) ≻ 0 ⇒ строгий локальный минимум</div><div class=\"nt\">достаточное</div></div><div class=\"hd\">Q: Convex functions</div><div class=\"ln\"><div class=\"fm\">f((1−α)x + αy) ≤ (1−α)f(x) + αf(y)</div><div class=\"nt\">определение: хорда выше графика</div></div><div class=\"ln\"><div class=\"fm\">f(y) ≥ f(x) + ∇f(x)ᵀ(y − x)</div><div class=\"nt\">1-й порядок</div></div><div class=\"ln\"><div class=\"fm\">H(x) ⪰ 0 для всех x</div><div class=\"nt\">2-й порядок</div></div><div class=\"hd\">Q: Why is convexity important</div><div class=\"ln\"><div class=\"fm\">у выпуклой f любой локальный минимум глобален; ∇f = 0 необходимо и достаточно</div><div class=\"nt\">вывод из f(y) ≥ f(x*) + 0</div></div><div class=\"ln\"><div class=\"fm\">для строго выпуклой минимум единственен</div></div></div>"}, {"k": "exam", "h": "Эталонные ответы", "b": "<p><b>Optimality conditions:</b> first-order necessary ∇f(x*) = 0; second-order necessary H(x*) ⪰ 0; sufficient: ∇f(x*) = 0 and H(x*) ≻ 0 gives strict local minimum.</p><p><b>Convex function:</b> f((1−α)x + αy) ≤ (1−α)f(x) + αf(y); first-order: f(y) ≥ f(x) + ∇f(x)ᵀ(y−x); second-order: H ⪰ 0. Strictly convex: strict inequalities, unique minimizer; strongly convex: H ⪰ mI.</p><p><b>Why important:</b> for convex f every local minimum is global and ∇f = 0 is necessary and sufficient.</p>"}], "id": "opt1"}, {"id": "gd", "title": "18. Градиентный спуск", "goal": "Откуда формула шага, когда сходится и с какой скоростью.", "cards": [{"k": "story", "h": "Спуск с холма в тумане", "b": "<p>Хотим найти минимум функции f(x). Стоим в точке, видим только наклон (градиент ∇f). Идём в сторону, где круче всего вниз, то есть <b>−∇f</b>, небольшим шагом t. Повторяем.</p>\n <p><b>x<sub>k+1</sub> = x<sub>k</sub> − t·∇f(x<sub>k</sub>)</b>, t — длина шага (step size / learning rate).</p>"}, {"k": "story", "h": "Интерактив: как шаг t влияет на спуск", "b": "<div class=\"nb ex\"><div class=\"hd\">Попробуй сам</div><div class=\"viz\" data-v=\"gd1\"></div><p>Тяни ползунок t и смотри, что происходит. <b>Слева</b> парабола E(a) = (a − 3)², минимум в a = 3. Красная точка это старт a₀ = 0, оранжевые точки это шаги 1, 2, 3, … Мы идём вниз по склону. <b>Справа</b> столбики показывают ошибку e = a − 3 на каждом шаге: синий столбик ниже нуля (мы левее минимума), красный выше (перескочили).</p><div class=\"hd\">Откуда берётся формула множителя</div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>dE</span><span>da</span></span> = 2(a − 3)</div><div class=\"nt\">производная (наклон параболы)</div></div><div class=\"ln\"><div class=\"fm\">a<sub>k+1</sub> = a<sub>k</sub> − t·2(a<sub>k</sub> − 3)</div><div class=\"nt\">шаг против наклона</div></div><div class=\"ln\"><div class=\"fm\">a<sub>k+1</sub> − 3 = (1 − 2t)(a<sub>k</sub> − 3)</div><div class=\"nt\">вычли 3 с обеих сторон: ошибка умножается на (1 − 2t)</div></div><p>Значит, всё решает число r = 1 − 2t. Если |r| &lt; 1, ошибка с каждым шагом уменьшается; если |r| ≥ 1, не уменьшается.</p><div class=\"hd\">Что попробовать</div><div class=\"ln\"><div class=\"fm\">t = 0.25:  r = 0.5</div><div class=\"nt\">ошибка вдвое меньше каждый шаг: 3, 1.5, 0.75, … плавный спуск</div></div><div class=\"ln\"><div class=\"fm\">t = 0.5:  r = 0</div><div class=\"nt\">ровно в минимум за один шаг: это 1/E″, тут «подходит» шаг Ньютона</div></div><div class=\"ln\"><div class=\"fm\">t = 0.75:  r = −0.5</div><div class=\"nt\">перескакиваем минимум и возвращаемся: колебания, но ошибка убывает</div></div><div class=\"ln\"><div class=\"fm\">t = 1:  r = −1</div><div class=\"nt\">прыгаем между 0 и 6 вечно: не сходится</div></div><div class=\"ln\"><div class=\"fm\">t = 1.1:  r = −1.2</div><div class=\"nt\">с каждым шагом дальше от минимума: расходится</div></div><p><b>Вывод:</b> шаг должен быть 0 &lt; t &lt; 2/λ, где λ = E″ = 2 (кривизна). Слишком маленький шаг медленный, слишком большой ломает метод.</p></div>"}, {"k": "num", "h": "Числа: f(x,y) = x² + 3y²", "b": "<p>∇f = (2x, 6y). Берём t = 0.1, старт (1, 1).</p>\n <table class=\"tbl\"><tr><th>шаг</th><th>точка</th><th>градиент</th></tr><tr><td>0</td><td>(1, 1)</td><td>(2, 6)</td></tr><tr><td>1</td><td>(1−0.2, 1−0.6) = (0.8, 0.4)</td><td>(1.6, 2.4)</td></tr><tr><td>2</td><td>(0.8−0.16, 0.4−0.24) = (0.64, 0.16)</td><td></td></tr><tr><td>3</td><td>(0.512, 0.064)</td><td></td></tr></table>\n <p>x умножается на 0.8 = 1 − 0.1·2, y на 0.4 = 1 − 0.1·6 на каждом шаге. Идём к (0, 0). Если взять t = 0.4, то множитель для y равен 1 − 0.4·6 = −1.4, |−1.4| &gt; 1: расходится! Ограничение на t видно из чисел.</p>"}, {"k": "story", "h": "Интерактив: вытянутость функции и зигзаг", "b": "<div class=\"nb ex\"><div class=\"hd\">Попробуй сам</div><div class=\"viz\" data-v=\"gd2\"></div><p>Функция f = ½(x² + κy²). Её линии уровня это овалы, и чем больше κ, тем сильнее они вытянуты (κ = 1 это круги). Оранжевая ломаная это путь градиентного спуска от красной точки к минимуму (зелёная точка). <b>Ползунок κ</b> меняет вытянутость, <b>ползунок шага</b> меняет t в долях от предельного значения 2/κ.</p><div class=\"hd\">Откуда формулы множителей</div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>df</span><span>dx</span></span> = x,   <span class=\"fr\"><span>df</span><span>dy</span></span> = κy</div><div class=\"nt\">первые производные</div></div><div class=\"ln\"><div class=\"fm\">x<sub>k+1</sub> = (1 − t)·x<sub>k</sub>,   y<sub>k+1</sub> = (1 − tκ)·y<sub>k</sub></div><div class=\"nt\">шаг по каждой координате независим: каждая просто умножается на свой множитель</div></div><p>Чтобы не расходиться по y, нужно |1 − tκ| &lt; 1, то есть t &lt; 2/κ. Но тогда по x множитель 1 − t остаётся близким к 1 (при большом κ шаг t крошечный), и по x мы ползём очень медленно. Это и есть <b>проклятие числа обусловленности κ = λ<sub>max</sub>/λ<sub>min</sub></b>: крутое направление ограничивает шаг, а пологое из-за этого сходится медленно.</p><div class=\"hd\">Что попробовать</div><div class=\"ln\"><div class=\"fm\">κ = 1, шаг 0.5 (t = 1)</div><div class=\"nt\">круги: один шаг прямо в минимум</div></div><div class=\"ln\"><div class=\"fm\">κ = 10, шаг 0.5 (t = 1/L = 0.1)</div><div class=\"nt\">множитель по y равен 0 (сразу в ноль), по x равен 0.9: ползём вдоль x медленно</div></div><div class=\"ln\"><div class=\"fm\">κ = 10, шаг 0.9</div><div class=\"nt\">по y множитель −0.8: зигзаг через дно ущелья</div></div><div class=\"ln\"><div class=\"fm\">κ = 10, шаг больше 1</div><div class=\"nt\">расходится: шаг превысил 2/κ</div></div><div class=\"ln\"><div class=\"fm\">κ = 30, любой шаг</div><div class=\"nt\">очень медленно: после 30 шагов ошибка уменьшилась лишь немного</div></div><p>Кнопка «оптимальный шаг» ставит t* = 2/(λ<sub>min</sub> + λ<sub>max</sub>) = 2/(1 + κ), лучший постоянный шаг. Но и он даёт множитель (κ − 1)/(κ + 1): при κ = 30 это 0.935, то есть всё равно медленно. Отсюда идея ускорений (тяжёлый шар, CG, Ньютон).</p></div>"}, {"k": "proof", "h": "Вывод 1: почему именно −∇f", "b": "<p>Разложение Тейлора: f(x + d) ≈ f(x) + ∇f(x)ᵀd. Среди всех направлений единичной длины ‖d‖ = 1 хотим наименьшее значение ∇fᵀd. По неравенству Коши–Буняковского ∇fᵀd ≥ −‖∇f‖‖d‖, и равенство достигается при <b>d = −∇f/‖∇f‖</b>. Значит антиградиент — направление самого быстрого убывания.</p>\n <p>Условие убывания: ∇fᵀd &lt; 0. Для d = −∇f это −‖∇f‖² &lt; 0, пока градиент не равен нулю.</p>"}, {"k": "proof", "h": "Вывод 2: условие сходимости и скорость для квадратичной f", "b": "<p>Возьмём f(x) = ½xᵀAx − bᵀx с симметричной положительно определённой A (собственные числа 0 &lt; λ<sub>min</sub> ≤ … ≤ λ<sub>max</sub>). Минимум x*: Ax* = b. Градиент ∇f = Ax − b = A(x − x*).</p>\n <ol class=\"big\"><li>Ошибка e<sub>k</sub> = x<sub>k</sub> − x*. Шаг: e<sub>k+1</sub> = e<sub>k</sub> − tAe<sub>k</sub> = <b>(I − tA)e<sub>k</sub></b>.</li>\n <li>В базисе собственных векторов A компонента ошибки умножается на (1 − tλ<sub>i</sub>) на каждом шаге.</li>\n <li><b>Сходимость</b> ⇔ |1 − tλ<sub>i</sub>| &lt; 1 для всех i ⇔ <b>0 &lt; t &lt; 2/λ<sub>max</sub></b>. (В примере λ<sub>max</sub> = 6, значит t &lt; 1/3: 0.1 подходит, 0.4 нет.)</li>\n <li><b>Лучший шаг:</b> минимизируем max|1 − tλ|: t* = 2/(λ<sub>min</sub> + λ<sub>max</sub>), скорость ‖e<sub>k+1</sub>‖ ≤ ((κ − 1)/(κ + 1))‖e<sub>k</sub>‖, где κ = λ<sub>max</sub>/λ<sub>min</sub> — число обусловленности. Чем более «вытянуты» линии уровня (κ большое), тем медленнее спуск (линейная скорость сходимости).</li></ol>"}, {"k": "proof", "h": "Вывод 3: общий случай, L-гладкость (лемма о спуске)", "b": "<p>Пусть ∇f липшицев с константой L: ‖∇f(x) − ∇f(y)‖ ≤ L‖x − y‖. Тогда f(y) ≤ f(x) + ∇f(x)ᵀ(y−x) + (L/2)‖y−x‖². Подставляем y = x − t∇f(x):</p>\n <p><b>f(x − t∇f) ≤ f(x) − t(1 − Lt/2)‖∇f(x)‖²</b>.</p>\n <p>При t ≤ 1/L получаем f(x<sub>k+1</sub>) ≤ f(x<sub>k</sub>) − (t/2)‖∇f(x<sub>k</sub>)‖²: функция убывает на каждом шаге. Для выпуклой f с t = 1/L суммирование даёт f(x<sub>k</sub>) − f* ≤ L‖x<sub>0</sub> − x*‖²/(2k), то есть сублинейная скорость O(1/k); для сильно выпуклой f скорость линейная (геометрическая). Именно «linear or sublinear rates», как сказано на лекции.</p>"}, {"k": "formula", "h": "Резюме и улучшения", "b": "<table class=\"sym\"><tr><td>x<sub>k+1</sub> = x<sub>k</sub> − t∇f(x<sub>k</sub>)</td><td>базовый метод</td></tr><tr><td>выбор t</td><td>фиксированный (t &lt; 2/L), либо line search (Armijo/Wolfe: подбирать t на каждом шаге)</td></tr><tr><td>Heavy ball</td><td>добавляет «инерцию»: x<sub>k+1</sub> = x<sub>k</sub> − t∇f + β(x<sub>k</sub> − x<sub>k−1</sub>), ускоряет на «оврагах»</td></tr><tr><td>Conjugate gradient</td><td>для квадратичных f: сопряжённые направления, не больше n шагов</td></tr><tr><td>Критерий остановки</td><td>‖∇f‖ мало или f почти не меняется</td></tr></table>"}, {"k": "quiz", "q": "Почему шаг делается по −∇f?", "o": ["это направление наискорейшего убывания", "так проще считать", "это направление к максимуму", "так требует Ньютон"], "a": 0, "why": "Из Тейлора и неравенства Коши–Буняковского."}, {"k": "quiz", "q": "f = x² + 3y², λ_max = 6. При каком t гарантированно сходится?", "o": ["t &lt; 1/3", "t &lt; 3", "t = 1", "любой t"], "a": 0, "why": "0 &lt; t &lt; 2/λ_max = 1/3."}, {"k": "note", "h": "Тетрадь: градиентный спуск", "b": "<div class=\"nb\"><div class=\"hd\">Шаг</div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">x<sub>k+1</sub> = x<sub>k</sub> − t·∇f(x<sub>k</sub>)</span></div><div class=\"nt\">t — длина шага</div></div><div class=\"hd\">Почему −∇f</div><div class=\"ln\"><div class=\"fm\">f(x+d) ≈ f(x) + ∇f(x)ᵀ d</div><div class=\"nt\">Тейлор 1-го порядка</div></div><div class=\"ln\"><div class=\"fm\">∇fᵀd ≥ −‖∇f‖·‖d‖</div><div class=\"nt\">Коши–Буняковский</div></div><div class=\"ln\"><div class=\"fm\">равенство при  d = − <span class=\"fr\"><span>∇f</span><span>‖∇f‖</span></span></div><div class=\"nt\">антиградиент — самое быстрое убывание</div></div><div class=\"hd\">Квадратичная f(x) = ½xᵀAx − bᵀx</div><div class=\"ln\"><div class=\"fm\">∇f = Ax − b = A(x − x*)</div></div><div class=\"ln\"><div class=\"fm\">e<sub>k+1</sub> = (I − tA) e<sub>k</sub></div><div class=\"nt\">e = x − x*</div></div><div class=\"ln\"><div class=\"fm\">сходится ⇔ |1 − tλ<sub>i</sub>| &lt; 1 ⇔ 0 &lt; t &lt; <span class=\"fr\"><span>2</span><span>λ<sub>max</sub></span></span></div></div><div class=\"ln\"><div class=\"fm\">лучший шаг  t* = <span class=\"fr\"><span>2</span><span>λ<sub>min</sub>+λ<sub>max</sub></span></span>,   скорость  <span class=\"fr\"><span>κ−1</span><span>κ+1</span></span>,   κ = <span class=\"fr\"><span>λ<sub>max</sub></span><span>λ<sub>min</sub></span></span></div></div><div class=\"hd\">Общий случай (L-гладкость)</div><div class=\"ln\"><div class=\"fm\">f(x − t∇f) ≤ f(x) − t(1 − Lt/2)‖∇f‖²</div><div class=\"nt\">при t ≤ 1/L функция убывает</div></div></div>"}, {"k": "note", "h": "Тетрадь: эталонные ответы на вопросы", "b": "<div class=\"nb\"><div class=\"hd\">Q: Gradient descent</div><div class=\"ln\"><div class=\"fm\">x<sub>k+1</sub> = x<sub>k</sub> − t·∇f(x<sub>k</sub>)</div><div class=\"nt\">t — шаг (learning rate)</div></div><div class=\"ln\"><div class=\"fm\">почему −∇f: f(x + d) ≈ f(x) + ∇fᵀd, минимум при d = −∇f/‖∇f‖</div><div class=\"nt\">направление наискорейшего спуска</div></div><div class=\"ln\"><div class=\"fm\">для квадратичной f условие сходимости: 0 &lt; t &lt; 2/λ<sub>max</sub></div><div class=\"nt\">при t = 1/L гарантированное убывание</div></div></div>"}, {"k": "exam", "h": "Ответ «Gradient descent»", "b": "<ol class=\"big\"><li>Цель: min f(x), итерация x<sub>k+1</sub> = x<sub>k</sub> − t∇f(x<sub>k</sub>).</li><li>Вывод: Тейлор + направление наискорейшего убывания.</li><li>Выбор шага: условие t &lt; 2/L, line search.</li><li>Скорость: линейная при сильной выпуклости (κ), O(1/k) иначе.</li><li>Минусы: медленно при плохой обусловленности; улучшения: heavy ball, CG, Newton.</li></ol>"}, {"k": "exam", "h": "Эталонный ответ (так можно писать на экзамене)", "b": "<p><b>Gradient descent</b> — итерационный метод минимизации дифференцируемой f: <b>x<sub>k+1</sub> = x<sub>k</sub> − t·∇f(x<sub>k</sub>)</b>, t &gt; 0 — длина шага.</p>\n<p><b>Вывод:</b> f(x+d) ≈ f(x) + ∇fᵀd; по неравенству Коши–Буняковского ∇fᵀd ≥ −‖∇f‖‖d‖ с равенством при d = −∇f/‖∇f‖, значит антиградиент — направление наискорейшего убывания.</p>\n<p><b>Сходимость:</b> для квадратичной f ошибка умножается на (I − tA), сходимость при 0 &lt; t &lt; 2/λ<sub>max</sub>; скорость линейная с множителем (κ−1)/(κ+1), κ = λ<sub>max</sub>/λ<sub>min</sub>. Для L-гладкой выпуклой f при t = 1/L: f(x<sub>k</sub>) − f* ≤ L‖x<sub>0</sub>−x*‖²/(2k) (сублинейно).</p>\n<p><b>Улучшения:</b> line search (Wolfe), heavy ball, conjugate gradient, метод Ньютона.</p>"}], "part": "Часть 5 · Оптимизация"}, {"title": "19. Общая схема спуска и поиск шага (Вольфе, backtracking)", "goal": "Как выбирать направление и длину шага: точный поиск, условия Армихо, Вольфе, Гольдштейна.", "part": "Часть 5 · Оптимизация", "cards": [{"k": "story", "h": "Общая схема", "b": "<p>Почти все методы оптимизации делают одно и то же: из точки xₖ выбирают <b>направление</b> dₖ и <b>длину шага</b> αₖ, и идут в xₖ₊₁ = xₖ + αₖdₖ. Направление должно быть <b>направлением спуска</b>: ∇f(xₖ)ᵀdₖ &lt; 0 (функция сначала убывает). Все методы можно записать как dₖ = −B⁻¹∇f: при B = I получаем градиентный спуск, при B = H (гессиан) метод Ньютона.</p><p><b>Почему −∇f — наискорейший спуск:</b> среди единичных направлений d значение ∇fᵀd минимально при d = −∇f/‖∇f‖ (неравенство Коши–Шварца: ∇fᵀd ≥ −‖∇f‖‖d‖). Останавливаемся, когда ‖∇f‖ ≤ ε.</p>"}, {"k": "formula", "h": "Выбор шага α: что значит «достаточно хорошо»", "b": "<p>Обозначим φ(α) = f(xₖ + αdₖ) — функцию одной переменной α. Нужно подобрать α.</p><table class=\"sym\"><tr><td>точный поиск</td><td>α = argmin φ(α). Для квадратичной f = ½xᵀPx − bᵀx: α = ‖g‖²/(gᵀPg), где g = ∇f. Даёт зигзаг на вытянутых функциях; на практике дорог</td></tr><tr><td>условие Армихо (достаточное убывание)</td><td>f(x + αd) ≤ f(x) + c₁α∇f(x)ᵀd, 0 &lt; c₁ &lt; 1 (обычно 10⁻⁴): график φ ниже прямой с наклоном c₁φ′(0). Исключает слишком длинные шаги</td></tr><tr><td>условие кривизны</td><td>∇f(x + αd)ᵀd ≥ c₂∇f(x)ᵀd, c₁ &lt; c₂ &lt; 1: наклон φ уже не так крут. Исключает слишком короткие шаги</td></tr><tr><td>условия Вольфе</td><td>Армихо + кривизна одновременно</td></tr><tr><td>сильные Вольфе</td><td>Армихо + |∇f(x + αd)ᵀd| ≤ c₂|∇f(x)ᵀd|: производная φ близка к нулю (нужны для нелинейного CG)</td></tr><tr><td>Гольдштейн (0 &lt; c &lt; ½)</td><td>f + (1−c)α∇fᵀd ≤ f(x + αd) ≤ f + cα∇fᵀd; может исключить все минимумы φ</td></tr><tr><td>backtracking</td><td>α := 1 (или α₀), пока не выполнено Армихо: α := bα, b ∈ [0.1, 0.8]. Одного условия хватает, потому что шаг уменьшается постепенно</td></tr></table>"}, {"k": "story", "h": "Интерактив: условия Армихо и Вольфе", "b": "<div class=\"nb ex\"><div class=\"hd\">Что за кривая</div><div class=\"viz\" data-v=\"armijo\"></div><p>Мы стоим в точке x и выбрали направление d. Теперь выбираем длину шага α. Функция φ(α) = f(x + α·d) показывает, чему станет f, если пройти α вдоль направления. Здесь x = 1, f = x², d = −2, поэтому φ(α) = (1 − 2α)²: минимум при α = 0.5. Тяни ползунок α и смотри, когда шаг принимается.</p><div class=\"hd\">Условие Армихо: «функция должна достаточно убывать»</div><div class=\"ln\"><div class=\"fm\">φ(α) ≤ φ(0) + c<sub>1</sub>·α·φ′(0)</div><div class=\"nt\">кривая должна лежать ниже красной пунктирной линии</div></div><p>Почему не просто «f уменьшилась»? Последовательность 1 + 1/k тоже убывает, но не доходит до минимума 0. Поэтому требуем убывания, пропорционального длине шага и наклону. Красная линия идёт чуть положе касательной (серая), это и есть запас c₁ = 0.1. Армихо <b>отсекает слишком длинные шаги</b> (правее 0.9 кривая выше красной линии).</p><div class=\"hd\">Условие кривизны: «не слишком коротко»</div><div class=\"ln\"><div class=\"fm\">φ′(α) ≥ c<sub>2</sub>·φ′(0)</div><div class=\"nt\">наклон в новой точке уже не такой крутой, как в начале</div></div><p>Армихо одобряет и крошечные шаги (при α почти 0 кривая под красной линией). Но если наклон всё ещё крутой, то можно было пройти дальше. Условие кривизны с c₂ = 0.9 <b>отсекает слишком короткие шаги</b> (левее 0.05, оранжевая зона). Вместе два условия называют условиями Вольфе.</p><div class=\"hd\">Числа</div><div class=\"ln\"><div class=\"fm\">φ(α) ≤ 1 − 0.4α  ⇔  4α² − 3.6α ≤ 0  ⇔  α ≤ 0.9</div><div class=\"nt\">решили Армихо: допустимы α от 0 до 0.9</div></div><div class=\"ln\"><div class=\"fm\">φ′(α) = −4 + 8α ≥ −3.6  ⇔  α ≥ 0.05</div><div class=\"nt\">решили кривизну: α от 0.05</div></div><div class=\"ln\"><div class=\"fm\">α = 1:  φ = 1 &gt; 0.6</div><div class=\"nt\">Армихо ✗, слишком длинно; backtracking уменьшает α до 0.5</div></div><div class=\"ln\"><div class=\"fm\">α = 0.02:  Армихо ✓, но φ′ = −3.84 &lt; −3.6</div><div class=\"nt\">кривизна ✗: слишком короткий шаг</div></div></div>"}, {"k": "num", "h": "Числа: backtracking на f(x) = x²", "b": "<p>x = 1, d = −f′(1) = −2, c₁ = 0.1, b = 0.5, α = 1. Проверяем Армихо: f(x + αd) = f(−1) = 1; правая часть f(1) + c₁·α·f′(1)·d = 1 + 0.1·1·2·(−2) = 0.6. 1 ≤ 0.6? Нет, уменьшаем α = 0.5: f(0) = 0; правая часть 1 + 0.1·0.5·2·(−2) = 0.8; 0 ≤ 0.8, принимаем α = 0.5, попали ровно в минимум.</p><p><b>Почему «f уменьшилась» недостаточно:</b> последовательность fₖ = 1 + 1/k убывает, но стремится к 1, а минимум функции может быть 0. Поэтому требуют <i>достаточное</i> убывание пропорционально α∇fᵀd.</p>"}, {"k": "quiz", "q": "Что гарантирует условие кривизны (вторая часть условий Вольфе)?", "o": ["шаг не слишком короткий", "шаг не слишком длинный", "что d — направление спуска", "что f выпукла"], "a": 0, "why": "Армихо запрещает длинные шаги, кривизна запрещает слишком короткие."}, {"k": "quiz", "q": "Backtracking line search использует…", "o": ["только условие Армихо и уменьшение α в b раз", "точную минимизацию", "гессиан", "второе условие Вольфе обязательно"], "a": 0, "why": "Шаг уменьшается постепенно, поэтому второе условие не нужно."}, {"k": "exam", "h": "Эталонные ответы", "b": "<p><b>General descent method:</b> x<sub>k+1</sub> = x<sub>k</sub> + α<sub>k</sub>d<sub>k</sub> with descent direction ∇f(x<sub>k</sub>)ᵀd<sub>k</sub> &lt; 0; −∇f is steepest descent by Cauchy–Schwarz; stop when ‖∇f‖ ≤ ε.</p><p><b>Wolfe conditions:</b> sufficient decrease (Armijo) f(x + αd) ≤ f(x) + c₁α∇f(x)ᵀd and curvature ∇f(x + αd)ᵀd ≥ c₂∇f(x)ᵀd with 0 &lt; c₁ &lt; c₂ &lt; 1; strong Wolfe uses |∇f(x + αd)ᵀd| ≤ c₂|∇f(x)ᵀd|.</p><p><b>Exact line search:</b> α = argmin f(x + αd) (for quadratic α = ‖g‖²/gᵀPg); <b>backtracking:</b> start with α = 1 and multiply by b until Armijo holds.</p>"}], "id": "ls"}, {"title": "20. Скорости сходимости и теоремы для градиентного спуска", "goal": "Линейная, сублинейная, квадратичная сходимость; L-гладкость; число обусловленности κ.", "part": "Часть 5 · Оптимизация", "cards": [{"k": "story", "h": "Как измерять «быстро»", "b": "<p>Пусть φₖ — ошибка на k-й итерации (например f(xₖ) − f* или ‖xₖ − x*‖). Алгоритм называют:</p><ul class=\"big\"><li><b>сублинейным</b>: φₖ ≤ C/√k или C/k или C/k². Чтобы получить ошибку ε, нужно O(1/ε²), O(1/ε), O(1/√ε) итераций. На графике в логарифмической шкале почти горизонталь.</li><li><b>линейным (Q-линейным)</b>: φₖ₊₁/φₖ ≤ 1 − σ, то есть φₖ ≤ C(1 − σ)ᵏ. Нужно O(log(1/ε)/σ) итераций. Прямая вниз в логарифмической шкале.</li><li><b>сверхлинейным</b>: φₖ₊₁/φₖ → 0.</li><li><b>квадратичным</b>: φₖ₊₁ ≤ Cφₖ²; число верных знаков удваивается, O(log log(1/ε)) итераций.</li></ul>"}, {"k": "story", "h": "График: как выглядят сублинейная, линейная и квадратичная скорости", "b": "<div class=\"nb ex\"><div class=\"hd\">Как читать график</div><div class=\"viz\" data-v=\"rates\"></div><p>По горизонтали номер итерации k. По вертикали <b>логарифм ошибки</b>: значение −6 означает ошибку 10⁻⁶ (одна миллионная), −12 означает 10⁻¹². Каждая ступенька вниз это ошибка в 10 раз меньше. Логарифмическая шкала нужна, чтобы вместить сразу и 1, и миллионную долю. Чем быстрее линия падает, тем быстрее метод.</p><div class=\"ln\"><div class=\"fm\">красная: сублинейная, e ≈ 1/k</div><div class=\"nt\">почти горизонтальна: за 20 шагов ошибка упала лишь в 20 раз. Очень медленно</div></div><div class=\"ln\"><div class=\"fm\">синяя: линейная, e = 0.6ᵏ</div><div class=\"nt\">прямая линия вниз: каждый шаг умножает ошибку на 0.6, то есть даёт постоянное число новых верных цифр</div></div><div class=\"ln\"><div class=\"fm\">зелёная: квадратичная, eₖ₊₁ = eₖ²</div><div class=\"nt\">падает всё круче: число верных цифр удваивается (0.3, 0.6, 1.2, 2.4, 4.8, 9.6) и скоро упирается в точность компьютера</div></div><div class=\"hd\">Числа: сколько шагов до ошибки 10⁻⁶</div><div class=\"ln\"><div class=\"fm\">сублинейная 1/k:  k = 10⁶</div><div class=\"nt\">миллион шагов</div></div><div class=\"ln\"><div class=\"fm\">линейная 0.6ᵏ:  k = ln(10⁶)/(−ln 0.6) = 13.8/0.511 ≈ 27</div><div class=\"nt\">27 шагов</div></div><div class=\"ln\"><div class=\"fm\">квадратичная:  e = 0.5, 0.25, 0.0625, 0.0039, 1.5·10⁻⁵, 2.3·10⁻¹⁰</div><div class=\"nt\">5 шагов (каждый раз ошибка возводится в квадрат)</div></div><p><b>Вывод:</b> градиентный спуск на сильно выпуклой функции линейный (синяя), на просто выпуклой сублинейный (красная), метод Ньютона около решения квадратичный (зелёная).</p></div>"}, {"k": "note", "h": "Тетрадь: гладкость, лемма о спуске, три теоремы", "b": "<div class=\"nb\"><div class=\"hd\">L-гладкость</div><div class=\"ln\"><div class=\"fm\">‖∇f(x) − ∇f(y)‖ ≤ L‖x − y‖</div><div class=\"nt\">градиент не меняется быстрее, чем с константой L</div></div><div class=\"ln\"><div class=\"fm\">−L·I ⪯ H(x) ⪯ L·I</div><div class=\"nt\">то же в терминах гессиана</div></div><div class=\"hd\">Лемма о спуске (шаг 1/L)</div><div class=\"ln\"><div class=\"fm\">f(x − ∇f/L) ≤ f(x) − <span class=\"fr\"><span>‖∇f(x)‖²</span><span>2L</span></span></div><div class=\"nt\">каждый шаг гарантирует убывание</div></div><div class=\"hd\">Три теоремы для GD с шагом 1/L</div><div class=\"ln\"><div class=\"fm\">гладкая:  min ‖∇f(x<sub>k</sub>)‖ ≤ √(<span class=\"fr\"><span>2L(f₀ − f̄)</span><span>T</span></span>)</div><div class=\"nt\">скорость C/√k, минимум не гарантируется</div></div><div class=\"ln\"><div class=\"fm\">+ выпуклая:  f(x<sub>T</sub>) − f* ≤ <span class=\"fr\"><span>L‖x₀ − x*‖²</span><span>2T</span></span></div><div class=\"nt\">скорость C/k, O(1/ε)</div></div><div class=\"ln\"><div class=\"fm\">+ m-сильно выпуклая:  f(x<sub>T</sub>) − f* ≤ (1 − <span class=\"fr\"><span>m</span><span>L</span></span>)<sup>T</sup>(f₀ − f*)</div><div class=\"nt\">линейная скорость, O(κ·log(1/ε))</div></div><div class=\"hd\">Число обусловленности</div><div class=\"ln\"><div class=\"fm\">κ = <span class=\"fr\"><span>L</span><span>m</span></span> = <span class=\"fr\"><span>λ<sub>max</sub></span><span>λ<sub>min</sub></span></span></div><div class=\"nt\">отношение наибольшей кривизны к наименьшей</div></div><div class=\"ln\"><div class=\"fm\">точный поиск, квадратичная f:  (<span class=\"fr\"><span>κ − 1</span><span>κ + 1</span></span>)²</div><div class=\"nt\">множитель на шаг; κ ≥ 1000 — GD почти бесполезен</div></div><div class=\"ln\"><div class=\"fm\">лучший постоянный шаг:  α = <span class=\"fr\"><span>2</span><span>L + m</span></span></div></div></div>"}, {"k": "num", "h": "Числа: сколько итераций нужно", "b": "<p>Для f = (x−1)² + 10: L = m = 2, κ = 1. Шаг 1/L = ½: x − ½·f′(x) = x − (x − 1) = 1, то есть минимум за <b>один шаг</b> из любой точки.</p><p>Для f = ½·(1·x² + 100·y²): λ ∈ [1, 100], κ = 100. GD с шагом 1/L: множитель 1 − 1/κ = 0.99 за шаг. Чтобы уменьшить ошибку в 10⁶ раз: k ≈ ln(10⁶)/0.01 = 1382 итерации. Тяжёлый шар или CG: множитель ≈ (√κ − 1)/(√κ + 1) = 9/11 = 0.818, k ≈ ln(10⁶)/0.2 = 69 итераций.</p><p>Для f(x) = (h/2)x²: xₖ₊₁ = (1 − αh)xₖ. При α &lt; 1/h сходится монотонно, 1/h &lt; α &lt; 2/h — с колебаниями, α = 2/h — вечные колебания, α &gt; 2/h — расходится.</p>"}, {"k": "quiz", "q": "κ = 100, GD с шагом 1/L. Какой множитель ошибки за шаг?", "o": ["0.99", "0.9", "0.5", "0.01"], "a": 0, "why": "1 − 1/κ = 1 − 0.01 = 0.99."}, {"k": "quiz", "q": "Квадратичная сходимость — это когда", "o": ["φₖ₊₁ ≤ Cφₖ²", "φₖ₊₁ ≤ (1−σ)φₖ", "φₖ ≤ C/k", "φₖ ≤ C/√k"], "a": 0, "why": "Ошибка возводится в квадрат: число верных знаков удваивается."}, {"k": "exam", "h": "Эталонные ответы", "b": "<p><b>Rates:</b> sublinear C/√k, C/k, C/k² (O(1/ε²), O(1/ε), O(1/√ε) iterations); linear φₖ ≤ C(1−σ)ᵏ (O(log(1/ε)/σ)); superlinear φₖ₊₁/φₖ → 0; quadratic φₖ₊₁ ≤ Cφₖ² (O(log log(1/ε))).</p><p><b>Gradient descent with step 1/L:</b> L-smooth: min‖∇f‖ ≤ √(2L(f₀ − f̄)/T); + convex: f(x_T) − f* ≤ L‖x₀ − x*‖²/(2T); + m-strongly convex: linear rate (1 − m/L)ᵀ.</p><p><b>Condition number</b> κ = L/m = λ_max/λ_min; the number of iterations of GD is O(κ log(1/ε)), of heavy-ball/CG O(√κ log(1/ε)). For quadratics with exact line search the rate is ((κ−1)/(κ+1))².</p>"}], "id": "conv"}, {"title": "21. Тяжёлый шар и метод сопряжённых градиентов", "goal": "Как ускорить градиентный спуск: импульс и сопряжённые направления.", "part": "Часть 5 · Оптимизация", "cards": [{"k": "story", "h": "Проблема и идея", "b": "<p>Градиентный спуск на «вытянутой» функции (λ_max ≫ λ_min, большое κ) зигзагует поперёк оврага и медленно идёт вдоль него. Две идеи ускорения:</p><ul class=\"big\"><li><b>Heavy ball (Поляк):</b> добавить «инерцию» — учитывать предыдущий шаг. Как тяжёлый шарик, который катится по склону и не дёргается из стороны в сторону.</li><li><b>Conjugate gradient (CG):</b> выбирать направления так, чтобы не портить то, что уже достигнуто в предыдущих направлениях (сопряжённые направления).</li></ul>"}, {"k": "formula", "h": "Формулы", "b": "<table class=\"sym\"><tr><td>heavy ball</td><td>x<sub>k+1</sub> = x<sub>k</sub> − α∇f(x<sub>k</sub>) + β(x<sub>k</sub> − x<sub>k−1</sub>); для сильно выпуклой f: α = 4/(√L + √m)², β = ((√L − √m)/(√L + √m))²</td></tr><tr><td>скорость heavy ball</td><td>O(√κ · log(1/ε)) вместо O(κ · log(1/ε)) у обычного GD; не метод спуска (f может расти), нужны m и L</td></tr><tr><td>CG для Ax = b, A ≻ 0</td><td>минимизирует ½xᵀAx − bᵀx; направления A-сопряжены: dᵢᵀ A dⱼ = 0 при i ≠ j</td></tr><tr><td>α<sub>k</sub> = r<sub>k</sub>ᵀr<sub>k</sub> / (d<sub>k</sub>ᵀ A d<sub>k</sub>)</td><td>длина шага (точный линейный поиск), r = b − Ax — невязка</td></tr><tr><td>x<sub>k+1</sub> = x<sub>k</sub> + α<sub>k</sub> d<sub>k</sub>; r<sub>k+1</sub> = r<sub>k</sub> − α<sub>k</sub> A d<sub>k</sub></td><td>обновление точки и невязки</td></tr><tr><td>β<sub>k</sub> = r<sub>k+1</sub>ᵀr<sub>k+1</sub> / r<sub>k</sub>ᵀr<sub>k</sub>; d<sub>k+1</sub> = r<sub>k+1</sub> + β<sub>k</sub>d<sub>k</sub></td><td>новое направление</td></tr><tr><td>сходимость CG</td><td>не более N шагов; если у A только r различных собственных значений, то не более r шагов; предобуславливание улучшает спектр</td></tr><tr><td>нелинейный CG</td><td>Fletcher–Reeves (β = ‖g_{k+1}‖²/‖g_k‖², нужны сильные условия Вольфе c₂ &lt; ½), Polak–Ribière (β⁺ = max(β, 0)), Hestenes–Stiefel, Dai–Yuan, Hager–Zhang; рестарт каждые N шагов</td></tr></table>"}, {"k": "story", "h": "График: три метода на одной вытянутой функции", "b": "<div class=\"nb ex\"><div class=\"hd\">Как читать картинку</div><div class=\"viz\" data-v=\"hb\"></div><p>Функция f = ½(x² + 16y²): очень вытянутые овалы (κ = 16), минимум в центре (0, 0). Все три метода стартуют из (4; 1).</p><div class=\"ln\"><div class=\"fm\">красный: обычный градиентный спуск (шаг 2/(1+κ))</div><div class=\"nt\">зигзагом перескакивает через «дно ущелья» туда-сюда и только медленно ползёт к центру</div></div><div class=\"ln\"><div class=\"fm\">оранжевый: тяжёлый шар (heavy ball)</div><div class=\"nt\">добавляет «инерцию»: идёт по предыдущему шагу, поэтому колебания по крутому направлению гасятся, а вдоль ущелья скорость копится</div></div><div class=\"ln\"><div class=\"fm\">зелёный: сопряжённые градиенты (CG)</div><div class=\"nt\">два шага, и мы ровно в минимуме (для функции двух переменных)</div></div><div class=\"hd\">Откуда берутся улучшения</div><p>Градиентный спуск использует только текущий наклон и «забывает» прошлое. Из-за этого он перескакивает через ущелье. <b>Тяжёлый шар</b> формулой x<sub>k+1</sub> = x<sub>k</sub> − α·(df/dx) + β·(x<sub>k</sub> − x<sub>k−1</sub>) помнит предыдущий шаг: он как тяжёлый шар, катящийся по склону, не дёргается из стороны в сторону. Множитель β = 0.36 здесь отвечает за «силу инерции».</p><p><b>CG</b> выбирает каждое следующее направление так, чтобы не портить то, что уже достигнуто по прошлым направлениям (сопряжённые направления). В двумерном случае двух шагов хватает: после первого шага мы на оси ущелья, второй идёт ровно по ней в минимум.</p><div class=\"hd\">Числа с картинки</div><div class=\"ln\"><div class=\"fm\">обычный GD: множитель (κ−1)/(κ+1) = 15/17 = 0.88</div><div class=\"nt\">медленно: сотни шагов до малой ошибки</div></div><div class=\"ln\"><div class=\"fm\">тяжёлый шар: множитель (√κ−1)/(√κ+1) = 3/5 = 0.6</div><div class=\"nt\">намного быстрее: сложность O(√κ) вместо O(κ)</div></div><div class=\"ln\"><div class=\"fm\">CG: 2 шага для 2 переменных (не более N шагов для N переменных)</div><div class=\"nt\">точно в минимум</div></div></div>"}, {"k": "num", "h": "Числа: CG за два шага", "b": "<p>A = [[4,1],[1,3]], b = (1, 2), старт x₀ = 0. Точное решение x* = A⁻¹b = (1/11, 7/11) = (0.0909, 0.6364).</p><table class=\"tbl\"><tr><th>шаг</th><th>r (невязка)</th><th>d</th><th>α</th><th>x после шага</th></tr><tr><td>0</td><td>(1, 2)</td><td>(1, 2)</td><td>5/20 = 0.25</td><td>(0.25, 0.5)</td></tr><tr><td>1</td><td>(−0.5, 0.25)</td><td>(−0.4375, 0.375)</td><td>0.3125/0.859 = 0.3636</td><td><b>(0.0909, 0.6364)</b></td></tr></table><p>Пояснения: dᵀAd на шаге 0: A·(1,2) = (6, 7), (1,2)·(6,7) = 20; α₀ = rᵀr/dᵀAd = 5/20. Новая невязка r₁ = r₀ − α₀Ad₀ = (1 − 1.5, 2 − 1.75) = (−0.5, 0.25). β₀ = r₁ᵀr₁/r₀ᵀr₀ = 0.3125/5 = 0.0625, d₁ = r₁ + β₀d₀ = (−0.4375, 0.375). После второго шага получаем <b>точное решение</b>: N = 2 неизвестных, значит CG закончил за N = 2 шага (в теории; в реальных вычислениях с округлениями делают больше).</p>"}, {"k": "proof", "h": "Почему CG хорош (идея)", "b": "<p>Шаг по сопряжённому направлению dⱼ не портит минимизацию, сделанную по прежним направлениям: если dᵢᵀAdⱼ = 0, то уменьшение f вдоль dⱼ не меняет оптимальность вдоль dᵢ. Поэтому за N шагов по N сопряжённым направлениям мы минимизируем f по всем осям: точное решение. Если A имеет r различных собственных значений, пространство Крылова исчерпывается за r шагов.</p><p>Почему β считается так просто: невязки r<sub>k</sub> взаимно ортогональны, а направления сопряжены; из этого выводится, что нужно хранить только последнее направление (память O(N)).</p>"}, {"k": "quiz", "q": "Сколько шагов нужно CG для системы N×N с A ≻ 0 (точная арифметика)?", "o": ["не более N", "ровно N²", "бесконечно много", "1"], "a": 0, "why": "N A-сопряжённых направлений исчерпывают пространство."}, {"k": "quiz", "q": "Heavy ball по сравнению с GD:", "o": ["скорость O(√κ) вместо O(κ), но нужны m и L", "всегда проще", "всегда медленнее", "не нужен градиент"], "a": 0, "why": "Инерция ускоряет, но не гарантирует убывание f на каждом шаге."}, {"k": "note", "h": "Тетрадь: эталонные ответы на вопросы", "b": "<div class=\"nb\"><div class=\"hd\">Q: Heavy-ball method</div><div class=\"ln\"><div class=\"fm\">x<sub>k+1</sub> = x<sub>k</sub> − α∇f(x<sub>k</sub>) + β(x<sub>k</sub> − x<sub>k−1</sub>)</div><div class=\"nt\">инерция (момент)</div></div><div class=\"ln\"><div class=\"fm\">α = <span class=\"fr\"><span>4</span><span>(√L + √m)²</span></span>,   β = (<span class=\"fr\"><span>√L − √m</span><span>√L + √m</span></span>)²</div><div class=\"nt\">скорость O(√κ·log 1/ε)</div></div><div class=\"hd\">Q: Conjugate gradient and convergence</div><div class=\"ln\"><div class=\"fm\">A ≻ 0:  Ax = b ⇔ min ½xᵀAx − bᵀx;  направления A-сопряжены  d<sub>i</sub>ᵀAd<sub>j</sub> = 0</div></div><div class=\"ln\"><div class=\"fm\">α<sub>k</sub> = <span class=\"fr\"><span>r<sub>k</sub>ᵀr<sub>k</sub></span><span>d<sub>k</sub>ᵀAd<sub>k</sub></span></span>,   β<sub>k</sub> = <span class=\"fr\"><span>r<sub>k+1</sub>ᵀr<sub>k+1</sub></span><span>r<sub>k</sub>ᵀr<sub>k</sub></span></span>,   d<sub>k+1</sub> = r<sub>k+1</sub> + β<sub>k</sub>d<sub>k</sub></div><div class=\"nt\">r = b − Ax</div></div><div class=\"ln\"><div class=\"fm\">сходится не более чем за N шагов; за r шагов, если у A r различных собственных значений</div></div><div class=\"hd\">Q: Fletcher–Reeves vs Polak–Ribière</div><div class=\"ln\"><div class=\"fm\">FR: β = <span class=\"fr\"><span>‖g<sub>k+1</sub>‖²</span><span>‖g<sub>k</sub>‖²</span></span>;  PR: β = <span class=\"fr\"><span>g<sub>k+1</sub>ᵀ(g<sub>k+1</sub> − g<sub>k</sub>)</span><span>‖g<sub>k</sub>‖²</span></span></div><div class=\"nt\">g — градиент</div></div><div class=\"ln\"><div class=\"fm\">FR нужны сильные Вольфе (c₂ &lt; ½); PR на практике лучше, β⁺ = max(β, 0) гарантирует спуск; рестарт каждые N шагов</div></div></div>"}, {"k": "exam", "h": "Эталонные ответы", "b": "<p><b>Heavy-ball:</b> x<sub>k+1</sub> = x<sub>k</sub> − α∇f(x<sub>k</sub>) + β(x<sub>k</sub> − x<sub>k−1</sub>), α = 4/(√L+√m)², β = ((√L−√m)/(√L+√m))²; rate O(√κ log 1/ε); not a descent method.</p><p><b>Conjugate gradient:</b> solves Ax = b, A ≻ 0, directions are A-conjugate (dᵢᵀAdⱼ = 0), α = rᵀr/(dᵀAd), β = r<sub>k+1</sub>ᵀr<sub>k+1</sub>/r<sub>k</sub>ᵀr<sub>k</sub>; converges in at most N steps, in r steps if A has r distinct eigenvalues; preconditioning improves the spectrum.</p><p><b>FR vs PR:</b> Fletcher–Reeves β = ‖g<sub>k+1</sub>‖²/‖g<sub>k</sub>‖² needs strong Wolfe line search (c₂ &lt; ½) for global convergence; Polak–Ribière uses β = g<sub>k+1</sub>ᵀ(g<sub>k+1</sub> − g<sub>k</sub>)/‖g<sub>k</sub>‖², usually performs better in practice, with β⁺ = max(β, 0) to guarantee descent; both restart every N steps.</p>"}], "id": "hb"}, {"id": "newton", "title": "22. Метод Ньютона", "goal": "Вывод, быстрая (квадратичная) сходимость и сравнение с градиентным спуском.", "cards": [{"k": "story", "h": "Спуск с учётом кривизны", "b": "<p>Градиентный спуск знает только наклон. Метод Ньютона знает ещё <b>кривизну</b> (вторые производные, матрица Гессе H<sub>f</sub>) и приближает функцию параболой, а минимум параболы находит сразу.</p>\n <p>В одном измерении: <b>x<sub>k+1</sub> = x<sub>k</sub> − f′(x<sub>k</sub>)/f″(x<sub>k</sub>)</b>. В многомерном: <b>x<sub>k+1</sub> = x<sub>k</sub> − [H<sub>f</sub>(x<sub>k</sub>)]⁻¹ ∇f(x<sub>k</sub>)</b>. Вектор d = −H⁻¹∇f называют ньютоновским направлением, «естественный» шаг равен 1.</p>"}, {"k": "story", "h": "График: метод Ньютона заменяет функцию параболой", "b": "<div class=\"nb ex\"><div class=\"hd\">Как читать картинку</div><div class=\"viz\" data-v=\"newton\"></div><p>Минимизируем f(x) = x − ln x (синяя кривая, настоящий минимум в x = 1). Мы стоим в x₀ = 0.5. Градиентный спуск знает только <b>касательную</b> (серая): она говорит «иди вправо», но не говорит, как далеко.</p><p>Метод Ньютона использует ещё и <b>кривизну</b> (вторую производную f″). Он строит <b>параболу</b> (оранжевая), которая в точке x₀ совпадает с f по высоте, наклону и кривизне. Минимум параболы считается мгновенно, и мы прыгаем прямо в него: это следующая точка x₁ = 0.75. Потом строим новую параболу (фиолетовая) в x₁ и прыгаем в x₂ = 0.9375.</p><div class=\"hd\">Откуда формула</div><div class=\"ln\"><div class=\"fm\">m(x) = f(x<sub>0</sub>) + f′(x<sub>0</sub>)(x − x<sub>0</sub>) + ½f″(x<sub>0</sub>)(x − x<sub>0</sub>)²</div><div class=\"nt\">парабола: ряд Тейлора до второго порядка</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>dm</span><span>dx</span></span> = f′(x<sub>0</sub>) + f″(x<sub>0</sub>)(x − x<sub>0</sub>) = 0</div><div class=\"nt\">минимум параболы: производная равна нулю</div></div><div class=\"ln\"><div class=\"fm\">x<sub>1</sub> = x<sub>0</sub> − f′(x<sub>0</sub>) / f″(x<sub>0</sub>)</div><div class=\"nt\">шаг Ньютона: наклон, делённый на кривизну</div></div><p>Чем больше кривизна (параболa «круче»), тем короче шаг, чем она меньше, тем смелее прыжок. Градиентный спуск такого различия не делает, поэтому ему нужен подбор t.</p><div class=\"hd\">Числа с картинки</div><div class=\"ln\"><div class=\"fm\">f′(x) = 1 − 1/x,   f″(x) = 1/x²</div><div class=\"nt\">первая и вторая производные</div></div><div class=\"ln\"><div class=\"fm\">x<sub>0</sub> = 0.5:  f′ = −1,  f″ = 4,  x<sub>1</sub> = 0.5 − (−1)/4 = 0.75</div><div class=\"nt\">первый прыжок</div></div><div class=\"ln\"><div class=\"fm\">x<sub>1</sub> = 0.75:  f′ = −0.333,  f″ = 1.778,  x<sub>2</sub> = 0.75 + 0.1875 = 0.9375</div><div class=\"nt\">второй прыжок</div></div><div class=\"ln\"><div class=\"fm\">ошибки: 0.5, 0.25, 0.0625: каждая равна квадрату предыдущей</div><div class=\"nt\">это и есть квадратичная сходимость</div></div></div>"}, {"k": "num", "h": "Числа 1: квадратичная функция, один шаг", "b": "<p>f(x,y) = x² + 3y². ∇f = (2x, 6y), H = diag(2, 6), H⁻¹ = diag(1/2, 1/6). Старт (1, 1): ∇f = (2, 6), d = −H⁻¹∇f = −(1, 1). x₁ = (1,1) − (1,1) = <b>(0, 0)</b>. Попали в минимум за <b>один</b> шаг (градиентному спуску из прошлой темы нужно бесконечно много шагов). Для любой квадратичной функции Ньютон сходится за 1 шаг.</p>"}, {"k": "num", "h": "Числа 2: минимизируем f(x) = x − ln x (минимум в x = 1)", "b": "<p>f′ = 1 − 1/x, f″ = 1/x². Шаг: x − f′/f″ = x − (1 − 1/x)·x² = 2x − x². Старт 0.5:</p>\n <table class=\"tbl\"><tr><th>k</th><th>x<sub>k</sub></th><th>ошибка |x<sub>k</sub> − 1|</th></tr><tr><td>0</td><td>0.5</td><td>0.5</td></tr><tr><td>1</td><td>0.75</td><td>0.25</td></tr><tr><td>2</td><td>0.9375</td><td>0.0625</td></tr><tr><td>3</td><td>0.99609</td><td>0.0039</td></tr></table>\n <p>Ошибка каждый раз возводится в квадрат: 0.25 = 0.5², 0.0625 = 0.25², 0.0039 ≈ 0.0625². Это и есть <b>квадратичная сходимость</b>: число верных цифр удваивается.</p>\n <p>Корень √2 (ищем f(x) = x² − 2 = 0, шаг x − f/f′ = x − (x²−2)/(2x)): 1 → 1.5 → 1.41667 → 1.414216 (√2 = 1.414214).</p>"}, {"k": "proof", "h": "Вывод формулы Ньютона (как на лекции)", "b": "<ol class=\"big\"><li>Берём разложение Тейлора второго порядка вокруг x<sub>k</sub>: f(x<sub>k</sub> + d) ≈ f(x<sub>k</sub>) + ∇f(x<sub>k</sub>)ᵀd + ½dᵀH<sub>f</sub>(x<sub>k</sub>)d =: m(d).</li>\n <li>Если H положительно определена, m(d) — выпуклая парабола, минимум в точке, где её градиент равен нулю: ∇m(d) = ∇f(x<sub>k</sub>) + H d = 0.</li>\n <li>Отсюда <b>d = −H⁻¹∇f(x<sub>k</sub>)</b>, и следующая точка x<sub>k+1</sub> = x<sub>k</sub> + d.</li>\n <li><b>Это направление убывания:</b> ∇fᵀd = −∇fᵀH⁻¹∇f &lt; 0, так как H⁻¹ положительно определена.</li></ol>\n <p><b>Если H не положительно определена</b> (лекция): направление может не быть направлением убывания или H⁻¹ не существует, поэтому в такой области метод модифицируют (регуляризация H + μI, line search).</p>"}, {"k": "proof", "h": "Вывод: почему сходимость квадратичная (1D, корень f(x) = 0)", "b": "<p>Пусть x* — корень, f′(x*) ≠ 0, e<sub>k</sub> = x<sub>k</sub> − x*. Тейлор с остаточным членом: 0 = f(x*) = f(x<sub>k</sub>) + f′(x<sub>k</sub>)(x* − x<sub>k</sub>) + ½f″(ξ)(x* − x<sub>k</sub>)².</p>\n <p>Делим на f′(x<sub>k</sub>) и переносим: x<sub>k</sub> − f(x<sub>k</sub>)/f′(x<sub>k</sub>) − x* = (f″(ξ)/(2f′(x<sub>k</sub>)))·e<sub>k</sub>². Левая часть это x<sub>k+1</sub> − x*, поэтому</p>\n <p><b>e<sub>k+1</sub> = [f″(ξ)/(2f′(x<sub>k</sub>))]·e<sub>k</sub>²</b>, то есть |e<sub>k+1</sub>| ≤ C·e<sub>k</sub>².</p>\n <p>Для минимизации применяем то же к f′ (ищем корень f′ = 0). В многомерном случае на лекции: ‖x<sub>k+1</sub> − x*‖ ≤ (L/m)‖x<sub>k</sub> − x*‖², если Гессиан липшицев (константа L), H(x*) ⪰ mI и старт достаточно близок: ‖x₀ − x*‖ ≤ m/(2L). Метод <b>локально</b> квадратично сходится; глобально без line search может расходиться.</p>"}, {"k": "formula", "h": "Ньютон против градиентного спуска", "b": "<table class=\"tbl\"><tr><th></th><th>градиентный спуск</th><th>Ньютон</th></tr><tr><td>информация</td><td>∇f</td><td>∇f и Гессиан H</td></tr><tr><td>скорость</td><td>линейная / сублинейная</td><td>квадратичная вблизи решения</td></tr><tr><td>цена шага</td><td>дёшево, O(n)</td><td>дорого: считать и решать систему с H, около O(n³)</td></tr><tr><td>устойчивость</td><td>глобально сходится при малом t</td><td>нужен хороший старт и H положительно определён</td></tr></table>\n <p><b>Связь с Якобианом:</b> для системы уравнений F(x) = 0 Ньютон: x<sub>k+1</sub> = x<sub>k</sub> − J⁻¹F(x<sub>k</sub>) (J — Якобиан F). Минимизация f это решение ∇f = 0, а Якобиан от ∇f это и есть Гессиан H. Gauss–Newton (тема 7) = Ньютон для МНК с отброшенным членом со вторыми производными.</p>"}, {"k": "quiz", "q": "За сколько шагов Ньютон минимизирует f = x² + 3y²?", "o": ["1", "2", "бесконечно много", "10"], "a": 0, "why": "Для квадратичных функций модель m(d) совпадает с f, поэтому минимум за один шаг."}, {"k": "quiz", "q": "Что значит квадратичная сходимость?", "o": ["ошибка ~ квадрат предыдущей ошибки", "ошибка падает как 1/k²", "шаг в квадрате", "нужен квадрат Гессиана"], "a": 0, "why": "e_{k+1} ≤ C·e_k²: число верных цифр удваивается."}, {"k": "quiz", "q": "Главный минус метода Ньютона?", "o": ["цена Гессиана и его положительная определённость", "он медленнее GD", "нужен только градиент", "он не сходится у квадратичных функций"], "a": 0, "why": "Вычисление и решение системы с H дорого, плюс нужна положительная определённость."}, {"k": "note", "h": "Тетрадь: метод Ньютона", "b": "<div class=\"nb\"><div class=\"hd\">Квадратичная модель</div><div class=\"ln\"><div class=\"fm\">m(d) = f(x<sub>k</sub>) + ∇f(x<sub>k</sub>)ᵀd + ½ dᵀ H d</div><div class=\"nt\">Тейлор 2-го порядка, H — гессиан</div></div><div class=\"hd\">Минимум модели</div><div class=\"ln\"><div class=\"fm\">∇m(d) = ∇f(x<sub>k</sub>) + H d = 0</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">d = − H⁻¹ ∇f(x<sub>k</sub>)</span></div><div class=\"nt\">ньютоновское направление</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">x<sub>k+1</sub> = x<sub>k</sub> − H⁻¹ ∇f(x<sub>k</sub>)</span></div></div><div class=\"ln\"><div class=\"fm\">1D:   x<sub>k+1</sub> = x<sub>k</sub> − <span class=\"fr\"><span>f′(x<sub>k</sub>)</span><span>f″(x<sub>k</sub>)</span></span></div></div><div class=\"hd\">Направление убывания</div><div class=\"ln\"><div class=\"fm\">∇fᵀd = − ∇fᵀ H⁻¹ ∇f &lt; 0</div><div class=\"nt\">если H положительно определён</div></div><div class=\"hd\">Квадратичная сходимость (корень f = 0)</div><div class=\"ln\"><div class=\"fm\">e<sub>k+1</sub> = <span class=\"fr\"><span>f″(ξ)</span><span>2f′(x<sub>k</sub>)</span></span>·e<sub>k</sub>²</div><div class=\"nt\">из Тейлора с остаточным членом</div></div><div class=\"ln\"><div class=\"fm\">‖x<sub>k+1</sub> − x*‖ ≤ <span class=\"fr\"><span>L</span><span>m</span></span> ‖x<sub>k</sub> − x*‖²</div><div class=\"nt\">теорема лекции</div></div><div class=\"ln\"><div class=\"fm\">условие старта:  ‖x₀ − x*‖ ≤ m/(2L)</div></div></div>"}, {"k": "note", "h": "Тетрадь: эталонные ответы на вопросы", "b": "<div class=\"nb\"><div class=\"hd\">Q: Derive the Newton direction</div><div class=\"ln\"><div class=\"fm\">f(x + d) ≈ f(x) + ∇fᵀd + ½ dᵀH d</div><div class=\"nt\">разложение Тейлора до 2-го порядка</div></div><div class=\"ln\"><div class=\"fm\">производная по d: ∇f + H d = 0</div><div class=\"nt\">минимум квадратичной модели</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">d = −H⁻¹∇f,   x<sub>k+1</sub> = x<sub>k</sub> − H⁻¹∇f</span></div><div class=\"nt\">направление Ньютона</div></div><div class=\"hd\">Q: Local convergence theorem</div><div class=\"ln\"><div class=\"fm\">f дважды дифференцируема, H липшицев, H(x*) ≻ 0, старт близко к x*</div><div class=\"nt\">условия</div></div><div class=\"ln\"><div class=\"fm\">‖x<sub>k+1</sub> − x*‖ ≤ C‖x<sub>k</sub> − x*‖²</div><div class=\"nt\">квадратичная сходимость; для квадратичной f один шаг</div></div><div class=\"hd\">Q: What if the Hessian is not positive definite</div><div class=\"ln\"><div class=\"fm\">направление Ньютона может не быть направлением спуска</div><div class=\"nt\">H⁻¹ может не существовать</div></div><div class=\"ln\"><div class=\"fm\">лечение: H + μI (Levenberg–Marquardt), модифицированное разложение Холецкого, trust region, line search, либо шаг градиентного спуска</div></div></div>"}, {"k": "exam", "h": "Ответ «Newton method»", "b": "<ol class=\"big\"><li>Идея: квадратичная модель функции (Тейлор до 2-го порядка).</li><li>Вывод: ∇m = 0 ⇒ d = −H⁻¹∇f, x<sub>k+1</sub> = x<sub>k</sub> + αd (α = 1).</li><li>Условия: H положительно определён (иначе d не убывающее).</li><li>Скорость: локально квадратичная (теорема с L и m), глобально нужен line search (Wolfe).</li><li>Плюсы/минусы относительно GD; пример 1D.</li></ol>"}, {"k": "exam", "h": "Эталонный ответ (так можно писать на экзамене)", "b": "<p><b>Newton method.</b> Метод второго порядка. В точке x<sub>k</sub> функцию заменяют квадратичной моделью m(d) = f + ∇fᵀd + ½dᵀHd. При H ≻ 0 минимум модели: ∇m = ∇f + Hd = 0 ⇒ <b>d = −H⁻¹∇f</b> (ньютоновское направление), x<sub>k+1</sub> = x<sub>k</sub> + αd, «естественный» шаг α = 1. Это направление убывания: ∇fᵀd = −∇fᵀH⁻¹∇f &lt; 0.</p>\n<p><b>Сходимость:</b> если Гессиан липшицев (L), H(x*) ⪰ mI и ‖x₀−x*‖ ≤ m/(2L), то ‖x<sub>k+1</sub>−x*‖ ≤ (L/m)‖x<sub>k</sub>−x*‖² — квадратичная (локальная); глобально нужен line search с условиями Вольфе.</p>\n<p><b>Плюсы/минусы:</b> быстро вблизи решения (для квадратичных функций за 1 шаг), но нужен Гессиан (дорого, O(n³)), требуется H ≻ 0.</p>\n<p><b>1D:</b> x<sub>k+1</sub> = x<sub>k</sub> − f′/f″; пример √2: 1 → 1.5 → 1.4167 → 1.41422.</p>"}], "part": "Часть 5 · Оптимизация"}, {"id": "lrm", "title": "23. Допущения линейной регрессии и их нарушения", "goal": "Что предполагает LRM, как увидеть нарушения и что делать (Davide).", "cards": [{"k": "story", "h": "Модель и допущения", "b": "<p>В этой части курса обозначения стандартные: <b>Y = β<sub>0</sub> + β<sub>1</sub>X + ε</b> (β<sub>0</sub> — свободный член, β<sub>1</sub> — наклон; не путай с α/β у Gorgone).</p>\n <p><b>Допущения (MLR):</b></p>\n <ul class=\"big\"><li><b>Linearity:</b> E[Y | X] = β<sub>0</sub> + β<sub>1</sub>X<sub>1</sub> + … + β<sub>k</sub>X<sub>k</sub>.</li><li><b>Independence (нет автокорреляции):</b> Cov(ε<sub>i</sub>, ε<sub>j</sub>) = 0 при i ≠ j.</li><li><b>Homoscedasticity:</b> Var(ε<sub>i</sub> | X) = σ² постоянна.</li><li><b>Zero conditional mean:</b> E[ε<sub>i</sub> | X] = 0, отсюда Cov(X<sub>j</sub>, ε) = 0. Означает: E(ε) = 0 и регрессоры не связаны с ошибкой.</li><li><b>No perfect multicollinearity:</b> ни один регрессор не есть точная линейная комбинация других.</li><li><b>Normality:</b> ε ~ N(0, σ²), нужна в основном для вывода (тесты, интервалы).</li></ul>\n <p><b>Что ломается при нарушении:</b> гетероскедастичность — оценки остаются несмещёнными, но перестают быть BLUE (минимальная дисперсия), стандартные ошибки смещены; мультиколлинеарность — растут SE, падают t-статистики; коррелированные ошибки — SE занижены, интервалы уже, p-value меньше.</p>\n <p><b>Simple vs multiple:</b> один предиктор против нескольких. <b>R²</b> — доля объяснённой вариации, 1 − SSR/SST; <b>adjusted R²</b> = 1 − (1−R²)(N−1)/(N−p−1) штрафует за лишние предикторы. Пример: R² = 0.6, N = 50, p = 3: adj = 1 − 0.4·49/46 = 0.574.</p>"}, {"k": "formula", "h": "Диагностика по пунктам", "b": "<table class=\"sym\"><tr><td>Residual plot</td><td>e<sub>i</sub> = y<sub>i</sub> − ŷ<sub>i</sub>. В простой регрессии строят e против x, в множественной против ŷ. Должно быть без паттерна. U-образность = нелинейность: добавь log X, √X, X².</td></tr>\n <tr><td>Tracking</td><td>соседние остатки движутся вместе: ошибки коррелированы (временные ряды); чем больше ρ, тем заметнее</td></tr>\n <tr><td>Funnel shape</td><td>воронка в residual plot: гетероскедастичность; лечат преобразованием Y (log Y, √Y)</td></tr>\n <tr><td>Outlier</td><td>необычное значение y<sub>i</sub> (далеко от предсказания). Увеличивает RSS, снижает R². Studentized residual = e<sub>i</sub>/оценка SE(e<sub>i</sub>); |значение| &gt; 3: возможный выброс</td></tr>\n <tr><td>High leverage</td><td>необычное значение предиктора x<sub>i</sub>. h<sub>i</sub> = 1/n + (x<sub>i</sub>−x̄)²/Σ(x<sub>j</sub>−x̄)²; h<sub>i</sub> ∈ [1/n, 1], среднее (p+1)/n; сильно сильнее среднего: высокий leverage, точка тянет прямую</td></tr>\n <tr><td>Collinearity</td><td>предикторы сильно коррелируют, трудно разделить эффекты; SE β̂<sub>j</sub> растёт, t падает; смотрим корреляции и <b>VIF</b></td></tr>\n <tr><td>VIF(β̂<sub>j</sub>) = 1/(1 − R²<sub>X<sub>j</sub>|X<sub>−j</sub></sub>)</td><td>R² регрессии X<sub>j</sub> на остальные предикторы; минимум 1; правило: &gt; 5 или 10 проблема</td></tr></table>"}, {"k": "num", "h": "Числа", "b": "<p><b>Leverage:</b> x = 1, 2, 3, 4, 10. x̄ = 4, S<sub>xx</sub> = 9+4+1+0+36 = 50. Для x = 10: h = 1/5 + 36/50 = <b>0.92</b>, среднее (p+1)/n = 2/5 = 0.4. Точка с x = 10 имеет огромный leverage.</p>\n <p><b>VIF:</b> если R² регрессии X<sub>1</sub> на остальные = 0.9, то VIF = 1/(1 − 0.9) = <b>10</b> (проблема); при 0.8 VIF = 5.</p>\n <p>VIF показывает, во сколько раз дисперсия β̂<sub>j</sub> в полной модели больше, чем была бы при отдельной подгонке.</p>"}, {"k": "quiz", "q": "Чем outlier отличается от high leverage point?", "o": ["outlier: необычный y; leverage: необычный x", "наоборот", "это одно и то же", "outlier только в множественной регрессии"], "a": 0, "why": "Outlier далёк по y от предсказания, leverage необычен по предикторам и сильно влияет на прямую."}, {"k": "quiz", "q": "VIF = 10. Что это значит?", "o": ["R² регрессии X_j на остальные = 0.9, сильная коллинеарность", "R² модели равен 10", "всё хорошо", "выброс"], "a": 0, "why": "VIF = 1/(1 − R²) = 10 ⇒ R² = 0.9."}, {"k": "quiz", "q": "Воронка на графике остатков означает:", "o": ["гетероскедастичность", "нелинейность", "автокорреляцию", "мультиколлинеарность"], "a": 0, "why": "Дисперсия ошибок меняется; лечат log Y или √Y."}, {"k": "note", "h": "Тетрадь: диагностика LRM", "b": "<div class=\"nb\"><div class=\"hd\">Leverage</div><div class=\"ln\"><div class=\"fm\">h<sub>i</sub> = <span class=\"fr\"><span>1</span><span>N</span></span> + <span class=\"fr\"><span>(<i>x</i><sub>i</sub> − <span class=\"ov\"><i>x</i></span>)²</span><span>Σ(<i>x</i><sub>j</sub> − <span class=\"ov\"><i>x</i></span>)²</span></span></div><div class=\"nt\">от 1/N до 1; среднее (p+1)/N</div></div><div class=\"hd\">VIF</div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">VIF(β̂<sub>j</sub>) = <span class=\"fr\"><span>1</span><span>1 − R²<sub>X<sub>j</sub>|X<sub>−j</sub></sub></span></span></span></div><div class=\"nt\">R² регрессии X_j на остальные предикторы</div></div><div class=\"ln\"><div class=\"fm\">R² = 0.9  ⇒  VIF = <span class=\"fr\"><span>1</span><span>0.1</span></span> = 10</div></div><div class=\"hd\">Studentized residual</div><div class=\"ln\"><div class=\"fm\">t<sub>i</sub> = <span class=\"fr\"><span>e<sub>i</sub></span><span>SE(e<sub>i</sub>)</span></span>,   |t<sub>i</sub>| &gt; 3 ⇒ возможный выброс</div></div></div>"}, {"k": "exam", "h": "Эталонный ответ: допущения LRM", "b": "<p>Модель Y = β<sub>0</sub> + Σβ<sub>j</sub>X<sub>j</sub> + ε. Допущения: линейность E[Y|X]; независимость ошибок; гомоскедастичность Var(ε|X) = σ²; нулевое условное среднее E[ε|X] = 0 (⇒ Cov(X,ε) = 0); отсутствие совершенной мультиколлинеарности; нормальность ε для вывода.</p>\n <p>Нарушения и диагностика: нелинейность видна на residual plot (лечится преобразованиями X); автокорреляция даёт tracking и заниженные SE; гетероскедастичность даёт воронку (лечится log/√ от Y), оценки несмещены, но не BLUE; outlier ищем по studentized residuals (|·| &gt; 3), leverage по h<sub>i</sub> (сравниваем с (p+1)/n); коллинеарность по VIF (&gt; 5–10), растут SE и падают t-статистики.</p>\n <p><b>E(ε<sub>i</sub>) = 0</b> означает, что в среднем ошибка не смещает модель: прямая правильно описывает среднее Y.</p>"}], "part": "Часть 6 · Davide: модели и классификация"}, {"id": "forms", "title": "24. Log-модели и типы данных", "goal": "Как читать β в log-linear, linear-log, log-log; cross-section, time series, panel, lifetime, hierarchical.", "cards": [{"k": "num", "h": "Числа: три формы", "b": "<ul class=\"big\"><li><b>Log-linear</b>: ln(wage) = 1.5 + 0.08·educ. Год образования ⇒ зарплата выше примерно на <b>8%</b> (точно e<sup>0.08</sup> − 1 = 8.3%).</li><li><b>Linear-log</b>: consumption = 2 + 0.5·ln(income). Рост дохода на 1% ⇒ потребление выше на 0.5/100 = <b>0.005</b> единицы.</li><li><b>Log-log</b>: ln(cons) = 0.5 + 0.6·ln(income). Рост дохода на 1% ⇒ потребление выше на <b>0.6%</b> (эластичность).</li></ul>"}, {"k": "formula", "h": "Правила чтения коэффициента", "b": "<table class=\"tbl\"><tr><th>Модель</th><th>Уравнение</th><th>Что значит β<sub>1</sub></th></tr><tr><td>Log-linear</td><td>ln Y = β<sub>0</sub> + β<sub>1</sub>X + ε</td><td>+1 к X ⇒ Y меняется примерно на 100·β<sub>1</sub>% (<b>semi-elasticity</b>)</td></tr><tr><td>Linear-log</td><td>Y = β<sub>0</sub> + β<sub>1</sub> ln X + ε</td><td>+1% к X ⇒ Y меняется примерно на β<sub>1</sub>/100 единиц (semi-elasticity)</td></tr><tr><td>Log-log</td><td>ln Y = β<sub>0</sub> + β<sub>1</sub> ln X + ε</td><td>+1% к X ⇒ Y меняется на β<sub>1</sub>% (<b>elasticity</b>), β<sub>1</sub> = %ΔY/%ΔX</td></tr></table>\n <p><b>Откуда:</b> d(ln Y) ≈ ΔY/Y, поэтому в log-linear Δln Y = β<sub>1</sub>ΔX — это относительное изменение Y. В log-log Δln Y = β<sub>1</sub>Δln X — отношение двух относительных изменений.</p>"}, {"k": "story", "h": "Типы данных", "b": "<ul class=\"big\"><li><b>Cross-sectional:</b> много объектов в один момент времени (доходы 1000 итальянцев в 2024). Нет временной вариации.</li><li><b>Time series:</b> один объект во времени (ВВП страны 2000–2025, цена акции).</li><li><b>Panel:</b> N объектов, каждый наблюдается T периодов; N·T наблюдений; есть и межобъектная, и временная вариация; более информативны, но сложнее. Модель: Y = Xβ + ε (Y: NT×1), или y<sub>it</sub> = x′<sub>it</sub>β + ε<sub>it</sub>, или по объекту y<sub>i</sub> = X<sub>i</sub>β + ε<sub>i</sub> (T×1).</li><li><b>Lifetime (survival):</b> время до события, возможно цензурированное (болезнь, поломка, churn).</li><li><b>Hierarchical (multilevel):</b> наблюдения вложены в группы (студенты в классах, пациенты в клиниках), не независимы, вариация на разных уровнях.</li></ul>\n <p>Пример panel: N = 100 человек, T = 5 лет ⇒ 500 наблюдений.</p>"}, {"k": "quiz", "q": "В какой модели β1 это эластичность?", "o": ["log-log", "log-linear", "linear-log", "линейной"], "a": 0, "why": "Обе переменные в логарифмах, β1 = %ΔY/%ΔX."}, {"k": "quiz", "q": "ln(wage) = 1.5 + 0.08·educ. Что значит 0.08?", "o": ["+1 год ⇒ примерно +8% зарплаты", "+1 год ⇒ +0.08 единицы", "+8% образования ⇒ +1 год", "+0.08%"], "a": 0, "why": "Log-linear: β1·100 процентов."}, {"k": "note", "h": "Тетрадь: log-модели", "b": "<div class=\"nb\"><div class=\"hd\">Три формы</div><div class=\"ln\"><div class=\"fm\"><b>log-linear:</b>   ln Y = β<sub>0</sub> + β<sub>1</sub>X + ε</div><div class=\"nt\">+1 к X ⇒ Y на ≈ 100·β₁ %</div></div><div class=\"ln\"><div class=\"fm\"><b>linear-log:</b>   Y = β<sub>0</sub> + β<sub>1</sub> ln X + ε</div><div class=\"nt\">+1% к X ⇒ Y на β₁/100 единиц</div></div><div class=\"ln\"><div class=\"fm\"><b>log-log:</b>   ln Y = β<sub>0</sub> + β<sub>1</sub> ln X + ε</div><div class=\"nt\">+1% к X ⇒ Y на β₁ %</div></div><div class=\"ln\"><div class=\"fm\">β<sub>1</sub> = <span class=\"fr\"><span>%ΔY</span><span>%ΔX</span></span></div><div class=\"nt\">эластичность</div></div><div class=\"ln\"><div class=\"fm\">e<sup>0.08</sup> − 1 = 0.083</div><div class=\"nt\">точный эффект для 0.08</div></div></div>"}, {"k": "exam", "h": "Эталонный ответ", "b": "<p><b>Функциональные формы:</b> log-linear (Y в логах, X в уровнях): +1 к X даёт примерно 100β<sub>1</sub>% к Y; linear-log (X в логах): +1% к X даёт β<sub>1</sub>/100 единиц Y; log-log: +1% к X даёт β<sub>1</sub>% к Y, β<sub>1</sub> — эластичность. Semi-elasticity в первых двух, elasticity в log-log.</p>\n <p><b>Типы данных:</b> cross-section (много объектов, один момент), time series (один объект, много моментов), panel (те же N объектов в T моментов, NT наблюдений, объединяет оба измерения и информативнее), lifetime (время до события с цензурированием), hierarchical (наблюдения вложены в группы, зависимы внутри группы).</p>"}], "part": "Часть 6 · Davide: модели и классификация"}, {"id": "cls", "title": "25. Классификация и логистическая регрессия", "goal": "Зачем логистическая регрессия, вывод p(X), логит, оценка по MLE, метрики.", "ext": true, "cards": [{"k": "story", "h": "Идея (ISLR гл. 4: 4.1, 4.2, 4.3, 4.6)", "b": "<p class=\"warn\"><b>Источник:</b> от Davide есть только список вопросов (Summary questions). Ответы ниже написаны по ISLR гл. 4 и общей теории.</p>\n <p><b>Классификация:</b> ответ Y качественный (категория: да/нет, вид болезни), задача предсказать класс объекта; в регрессии Y количественный. Примеры: пройдёт кредит или нет, спам или не спам.</p>\n <p><b>Почему не линейная регрессия:</b> (1) для бинарного Y она может давать «вероятности» вне [0,1] (−0.2, 1.3); (2) для &gt; 2 неупорядоченных классов кодирование 1,2,3 навязывает порядок и равные расстояния, который не имеет смысла.</p>\n <p><b>Логистическая регрессия</b> моделирует вероятность p(X) = P(Y = 1 | X) так, чтобы она всегда была в (0,1):</p>\n <p style=\"text-align:center;font-size:20px\"><b>p(X) = e<sup>β<sub>0</sub>+β<sub>1</sub>X</sup> / (1 + e<sup>β<sub>0</sub>+β<sub>1</sub>X</sup>)</b></p>\n <p>Это S-образная логистическая функция: при z → −∞ даёт 0, при z → +∞ даёт 1.</p>"}, {"k": "proof", "h": "Вывод: odds, логит, правдоподобие", "b": "<ol class=\"big\"><li>Из p = e<sup>z</sup>/(1+e<sup>z</sup>), z = β<sub>0</sub>+β<sub>1</sub>X: 1 − p = 1/(1+e<sup>z</sup>).</li><li><b>Odds</b> = p/(1−p) = e<sup>z</sup> ∈ (0, ∞).</li><li><b>Логит (log-odds)</b>: ln(p/(1−p)) = β<sub>0</sub> + β<sub>1</sub>X — <b>линейна по X</b>. Поэтому β<sub>1</sub>: +1 к X прибавляет β<sub>1</sub> к log-odds, т.е. умножает odds на e<sup>β<sub>1</sub></sup>. Прямая в p(X) не линейна: влияние X на p зависит от X.</li><li><b>Оценка — максимальное правдоподобие:</b> L(β) = Π<sub>y<sub>i</sub>=1</sub> p(x<sub>i</sub>) · Π<sub>y<sub>i</sub>=0</sub>(1 − p(x<sub>i</sub>)); выбираем β̂ максимизирующие L (логарифм: Σ[y<sub>i</sub> ln p + (1−y<sub>i</sub>) ln(1−p)]). Замкнутого решения нет, используют итерации (Ньютон/IRLS).</li><li>Предсказание: если p̂(x) &gt; 0.5 (порог можно менять), относим к классу 1.</li><li>Множественная: p(X) = e<sup>β<sub>0</sub>+β<sub>1</sub>X<sub>1</sub>+…+β<sub>p</sub>X<sub>p</sub></sup>/(1+…). Для &gt; 2 классов: multinomial logistic.</li></ol>"}, {"k": "num", "h": "Числа", "b": "<p>β<sub>0</sub> = −6, β<sub>1</sub> = 0.05. Для X = 100: z = −1, p = e<sup>−1</sup>/(1+e<sup>−1</sup>) = 0.269. Для X = 120: z = 0, p = 0.5. Для X = 160: z = 2, p = 0.881. Odds растут в e<sup>0.05</sup> = 1.051 раза за единицу X.</p>\n <p><b>Метрики по матрице ошибок:</b> TP = 40, FN = 10, FP = 5, TN = 45. Accuracy = 85/100 = 0.85; sensitivity (recall) = 40/50 = 0.80; specificity = 45/50 = 0.90; precision = 40/45 = 0.889. Меняя порог, получаем ROC-кривую (sensitivity против 1 − specificity), AUC — площадь под ней.</p>"}, {"k": "formula", "h": "GLM и счётные данные (sec. 4.6)", "b": "<p><b>Generalized linear model:</b> линейный предиктор η = Xβ связывается со средним ответа через link-функцию. Распределение ответа и link:</p>\n <table class=\"tbl\"><tr><th>Ответ</th><th>Распределение</th><th>Link</th></tr><tr><td>Количественный</td><td>Normal</td><td>identity</td></tr><tr><td>Бинарный / доля</td><td>Binomial</td><td>logit (или probit)</td></tr><tr><td>Счёт 0,1,2…</td><td>Poisson</td><td>log</td></tr></table>\n <p><b>Poisson regression:</b> E(n) = m, Var(n) = m (дисперсия равна сред
