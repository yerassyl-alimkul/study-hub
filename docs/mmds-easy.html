he function is replaced by the quadratic model m(d) = f + ∇fᵀd + ½dᵀHd. For H ≻ 0 the minimum of the model: ∇m = ∇f + Hd = 0 ⇒ <b>d = −H⁻¹∇f</b> (the Newton direction), x<sub>k+1</sub> = x<sub>k</sub> + αd, the \"natural\" step α = 1. This is a descent direction: ∇fᵀd = −∇fᵀH⁻¹∇f &lt; 0.</p>\n<p><b>Convergence:</b> if the Hessian is Lipschitz (L), H(x*) ⪰ mI and ‖x₀−x*‖ ≤ m/(2L), then ‖x<sub>k+1</sub>−x*‖ ≤ (L/m)‖x<sub>k</sub>−x*‖² is quadratic (local); globally line search with the Wolfe conditions is needed.</p>\n<p><b>Pros/cons:</b> fast near the solution (for quadratic functions in 1 step), but the Hessian is needed (expensive, O(n³)), H ≻ 0 is required.</p>\n<p><b>1D:</b> x<sub>k+1</sub> = x<sub>k</sub> − f′/f″; the √2 example: 1 → 1.5 → 1.4167 → 1.41422.</p>"}], "part": "Part 5 · Optimisation"}, {"id": "lrm", "title": "23. Assumptions of linear regression and their violations", "goal": "What the LRM assumes, how to see violations and what to do (Davide).", "cards": [{"k": "story", "h": "The model and the assumptions", "b": "<p>In this part of the course the notation is standard: <b>Y = β<sub>0</sub> + β<sub>1</sub>X + ε</b> (β<sub>0</sub> is the intercept, β<sub>1</sub> is the slope; do not confuse with α/β of Gorgone).</p>\n <p><b>Assumptions (MLR):</b></p>\n <ul class=\"big\"><li><b>Linearity:</b> E[Y | X] = β<sub>0</sub> + β<sub>1</sub>X<sub>1</sub> + … + β<sub>k</sub>X<sub>k</sub>.</li><li><b>Independence (no autocorrelation):</b> Cov(ε<sub>i</sub>, ε<sub>j</sub>) = 0 for i ≠ j.</li><li><b>Homoscedasticity:</b> Var(ε<sub>i</sub> | X) = σ² is constant.</li><li><b>Zero conditional mean:</b> E[ε<sub>i</sub> | X] = 0, hence Cov(X<sub>j</sub>, ε) = 0. It means: E(ε) = 0 and the regressors are not related to the error.</li><li><b>No perfect multicollinearity:</b> no regressor is an exact linear combination of the others.</li><li><b>Normality:</b> ε ~ N(0, σ²), needed mainly for inference (tests, intervals).</li></ul>\n <p><b>What breaks when violated:</b> heteroscedasticity: the estimates remain unbiased but are no longer BLUE (minimal variance), the standard errors are biased; multicollinearity: SE grow, t-statistics fall; correlated errors: SE are understated, intervals narrower, p-values smaller.</p>\n <p><b>Simple vs multiple:</b> one predictor versus several. <b>R²</b> is the share of explained variation, 1 − SSR/SST; <b>adjusted R²</b> = 1 − (1−R²)(N−1)/(N−p−1) penalises extra predictors. Example: R² = 0.6, N = 50, p = 3: adj = 1 − 0.4·49/46 = 0.574.</p>"}, {"k": "formula", "h": "Diagnostics point by point", "b": "<table class=\"sym\"><tr><td>Residual plot</td><td>e<sub>i</sub> = y<sub>i</sub> − ŷ<sub>i</sub>. In simple regression we plot e against x, in multiple regression against ŷ. There should be no pattern. A U-shape = non-linearity: add log X, √X, X².</td></tr>\n <tr><td>Tracking</td><td>neighbouring residuals move together: the errors are correlated (time series); the larger ρ, the more visible</td></tr>\n <tr><td>Funnel shape</td><td>a funnel in the residual plot: heteroscedasticity; treated by transforming Y (log Y, √Y)</td></tr>\n <tr><td>Outlier</td><td>an unusual value of y<sub>i</sub> (far from the prediction). Increases RSS, lowers R². Studentized residual = e<sub>i</sub>/the estimate of SE(e<sub>i</sub>); |value| &gt; 3: a possible outlier</td></tr>\n <tr><td>High leverage</td><td>an unusual value of the predictor x<sub>i</sub>. h<sub>i</sub> = 1/n + (x<sub>i</sub>−x̄)²/Σ(x<sub>j</sub>−x̄)²; h<sub>i</sub> ∈ [1/n, 1], the mean (p+1)/n; far above the mean: high leverage, the point pulls the line</td></tr>\n <tr><td>Collinearity</td><td>predictors strongly correlate, it is hard to separate the effects; SE of β̂<sub>j</sub> grows, t falls; we look at the correlations and <b>VIF</b></td></tr>\n <tr><td>VIF(β̂<sub>j</sub>) = 1/(1 − R²<sub>X<sub>j</sub>|X<sub>−j</sub></sub>)</td><td>R² of the regression of X<sub>j</sub> on the remaining predictors; minimum 1; rule: &gt; 5 or 10 is a problem</td></tr></table>"}, {"k": "num", "h": "Numbers", "b": "<p><b>Leverage:</b> x = 1, 2, 3, 4, 10. x̄ = 4, S<sub>xx</sub> = 9+4+1+0+36 = 50. For x = 10: h = 1/5 + 36/50 = <b>0.92</b>, the mean (p+1)/n = 2/5 = 0.4. The point with x = 10 has huge leverage.</p>\n <p><b>VIF:</b> if R² of the regression of X<sub>1</sub> on the others = 0.9, then VIF = 1/(1 − 0.9) = <b>10</b> (a problem); at 0.8 VIF = 5.</p>\n <p>VIF shows how many times the variance of β̂<sub>j</sub> in the full model is larger than it would be in a separate fit.</p>"}, {"k": "quiz", "q": "How does an outlier differ from a high leverage point?", "o": ["outlier: an unusual y; leverage: an unusual x", "the other way round", "it is the same thing", "outlier only in multiple regression"], "a": 0, "why": "An outlier is far in y from the prediction, leverage is unusual in the predictors and strongly affects the line."}, {"k": "quiz", "q": "VIF = 10. What does it mean?", "o": ["R² of the regression of X_j on the others = 0.9, strong collinearity", "R² of the model equals 10", "everything is fine", "an outlier"], "a": 0, "why": "VIF = 1/(1 − R²) = 10 ⇒ R² = 0.9."}, {"k": "quiz", "q": "A funnel on the residual plot means:", "o": ["heteroscedasticity", "non-linearity", "autocorrelation", "multicollinearity"], "a": 0, "why": "The variance of the errors changes; treated with log Y or √Y."}, {"k": "note", "h": "Notebook: LRM diagnostics", "b": "<div class=\"nb\"><div class=\"hd\">Leverage</div><div class=\"ln\"><div class=\"fm\">h<sub>i</sub> = <span class=\"fr\"><span>1</span><span>N</span></span> + <span class=\"fr\"><span>(<i>x</i><sub>i</sub> − <span class=\"ov\"><i>x</i></span>)²</span><span>Σ(<i>x</i><sub>j</sub> − <span class=\"ov\"><i>x</i></span>)²</span></span></div><div class=\"nt\">from 1/N to 1; the mean (p+1)/N</div></div><div class=\"hd\">VIF</div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">VIF(β̂<sub>j</sub>) = <span class=\"fr\"><span>1</span><span>1 − R²<sub>X<sub>j</sub>|X<sub>−j</sub></sub></span></span></span></div><div class=\"nt\">R² of the regression of X_j on the other predictors</div></div><div class=\"ln\"><div class=\"fm\">R² = 0.9  ⇒  VIF = <span class=\"fr\"><span>1</span><span>0.1</span></span> = 10</div></div><div class=\"hd\">Studentized residual</div><div class=\"ln\"><div class=\"fm\">t<sub>i</sub> = <span class=\"fr\"><span>e<sub>i</sub></span><span>SE(e<sub>i</sub>)</span></span>,   |t<sub>i</sub>| &gt; 3 ⇒ a possible outlier</div></div></div>"}, {"k": "exam", "h": "Model answer: the LRM assumptions", "b": "<p>The model Y = β<sub>0</sub> + Σβ<sub>j</sub>X<sub>j</sub> + ε. Assumptions: linearity of E[Y|X]; independence of the errors; homoscedasticity Var(ε|X) = σ²; zero conditional mean E[ε|X] = 0 (⇒ Cov(X,ε) = 0); no perfect multicollinearity; normality of ε for inference.</p>\n <p>Violations and diagnostics: non-linearity is visible on the residual plot (treated by transforming X); autocorrelation gives tracking and understated SE; heteroscedasticity gives a funnel (treated by log/√ of Y), the estimates are unbiased but not BLUE; outliers are found by studentized residuals (|·| &gt; 3), leverage by h<sub>i</sub> (compared with (p+1)/n); collinearity by VIF (&gt; 5–10), SE grow and t-statistics fall.</p>\n <p><b>E(ε<sub>i</sub>) = 0</b> means that on average the error does not bias the model: the line correctly describes the mean of Y.</p>"}], "part": "Part 6 · Davide: models and classification"}, {"id": "forms", "title": "24. Log models and data types", "goal": "How to read β in log-linear, linear-log, log-log; cross-section, time series, panel, lifetime, hierarchical.", "cards": [{"k": "num", "h": "Numbers: three forms", "b": "<ul class=\"big\"><li><b>Log-linear</b>: ln(wage) = 1.5 + 0.08·educ. One year of education ⇒ the wage is higher by about <b>8%</b> (exactly e<sup>0.08</sup> − 1 = 8.3%).</li><li><b>Linear-log</b>: consumption = 2 + 0.5·ln(income). Income grows by 1% ⇒ consumption is higher by 0.5/100 = <b>0.005</b> units.</li><li><b>Log-log</b>: ln(cons) = 0.5 + 0.6·ln(income). Income grows by 1% ⇒ consumption is higher by <b>0.6%</b> (elasticity).</li></ul>"}, {"k": "formula", "h": "Rules for reading the coefficient", "b": "<table class=\"tbl\"><tr><th>Model</th><th>Equation</th><th>What β means<sub>1</sub></th></tr><tr><td>Log-linear</td><td>ln Y = β<sub>0</sub> + β<sub>1</sub>X + ε</td><td>+1 to X ⇒ Y changes by about 100·β<sub>1</sub>% (<b>semi-elasticity</b>)</td></tr><tr><td>Linear-log</td><td>Y = β<sub>0</sub> + β<sub>1</sub> ln X + ε</td><td>+1% to X ⇒ Y changes by about β<sub>1</sub>/100 units (semi-elasticity)</td></tr><tr><td>Log-log</td><td>ln Y = β<sub>0</sub> + β<sub>1</sub> ln X + ε</td><td>+1% to X ⇒ Y changes by β<sub>1</sub>% (<b>elasticity</b>), β<sub>1</sub> = %ΔY/%ΔX</td></tr></table>\n <p><b>Where it comes from:</b> d(ln Y) ≈ ΔY/Y, so in log-linear Δln Y = β<sub>1</sub>ΔX is the relative change of Y. In log-log Δln Y = β<sub>1</sub>Δln X is the ratio of two relative changes.</p>"}, {"k": "story", "h": "Data types", "b": "<ul class=\"big\"><li><b>Cross-sectional:</b> many objects at one moment in time (the incomes of 1000 Italians in 2024). No variation over time.</li><li><b>Time series:</b> one object over time (a country's GDP 2000–2025, a share price).</li><li><b>Panel:</b> N objects, each observed for T periods; N·T observations; there is both between-object and time variation; more informative but more complex. The model: Y = Xβ + ε (Y: NT×1), or y<sub>it</sub> = x′<sub>it</sub>β + ε<sub>it</sub>, or per object y<sub>i</sub> = X<sub>i</sub>β + ε<sub>i</sub> (T×1).</li><li><b>Lifetime (survival):</b> the time to an event, possibly censored (illness, breakdown, churn).</li><li><b>Hierarchical (multilevel):</b> observations are nested in groups (students in classes, patients in clinics), not independent, variation at different levels.</li></ul>\n <p>Panel example: N = 100 people, T = 5 years ⇒ 500 observations.</p>"}, {"k": "quiz", "q": "In which model is β1 an elasticity?", "o": ["log-log", "log-linear", "linear-log", "linear"], "a": 0, "why": "Both variables in logarithms, β1 = %ΔY/%ΔX."}, {"k": "quiz", "q": "ln(wage) = 1.5 + 0.08·educ. What does 0.08 mean?", "o": ["+1 year ⇒ about +8% wage", "+1 year ⇒ +0.08 units", "+8% education ⇒ +1 year", "+0.08%"], "a": 0, "why": "Log-linear: β1·100 percent."}, {"k": "note", "h": "Notebook: log models", "b": "<div class=\"nb\"><div class=\"hd\">Three forms</div><div class=\"ln\"><div class=\"fm\"><b>log-linear:</b>   ln Y = β<sub>0</sub> + β<sub>1</sub>X + ε</div><div class=\"nt\">+1 to X ⇒ Y by ≈ 100·β₁ %</div></div><div class=\"ln\"><div class=\"fm\"><b>linear-log:</b>   Y = β<sub>0</sub> + β<sub>1</sub> ln X + ε</div><div class=\"nt\">+1% to X ⇒ Y by β₁/100 units</div></div><div class=\"ln\"><div class=\"fm\"><b>log-log:</b>   ln Y = β<sub>0</sub> + β<sub>1</sub> ln X + ε</div><div class=\"nt\">+1% to X ⇒ Y by β₁ %</div></div><div class=\"ln\"><div class=\"fm\">β<sub>1</sub> = <span class=\"fr\"><span>%ΔY</span><span>%ΔX</span></span></div><div class=\"nt\">elasticity</div></div><div class=\"ln\"><div class=\"fm\">e<sup>0.08</sup> − 1 = 0.083</div><div class=\"nt\">the exact effect for 0.08</div></div></div>"}, {"k": "exam", "h": "Model answer", "b": "<p><b>Functional forms:</b> log-linear (Y in logs, X in levels): +1 to X gives about 100β<sub>1</sub>% to Y; linear-log (X in logs): +1% to X gives β<sub>1</sub>/100 units of Y; log-log: +1% to X gives β<sub>1</sub>% to Y, β<sub>1</sub> is the elasticity. Semi-elasticity in the first two, elasticity in log-log.</p>\n <p><b>Data types:</b> cross-section (many objects, one moment), time series (one object, many moments), panel (the same N objects at T moments, NT observations, combines both dimensions and is more informative), lifetime (time to an event with censoring), hierarchical (observations nested in groups, dependent within a group).</p>"}], "part": "Part 6 · Davide: models and classification"}, {"id": "cls", "title": "25. Classification and logistic regression", "goal": "Why logistic regression, the derivation of p(X), the logit, MLE estimation, metrics.", "ext": true, "cards": [{"k": "story", "h": "The idea (ISLR ch. 4: 4.1, 4.2, 4.3, 4.6)", "b": "<p class=\"warn\"><b>Source:</b> from Davide there is only a list of questions (Summary questions). The answers below are written from ISLR ch. 4 and general theory.</p>\n <p><b>Classification:</b> the response Y is qualitative (a category: yes/no, type of disease), the task is to predict the class of an object; in regression Y is quantitative. Examples: whether a loan will be approved, spam or not spam.</p>\n <p><b>Why not linear regression:</b> (1) for a binary Y it can give \"probabilities\" outside [0,1] (−0.2, 1.3); (2) for &gt; 2 unordered classes the coding 1,2,3 imposes an order and equal distances that make no sense.</p>\n <p><b>Logistic regression</b> models the probability p(X) = P(Y = 1 | X) so that it is always in (0,1):</p>\n <p style=\"text-align:center;font-size:20px\"><b>p(X) = e<sup>β<sub>0</sub>+β<sub>1</sub>X</sup> / (1 + e<sup>β<sub>0</sub>+β<sub>1</sub>X</sup>)</b></p>\n <p>This is the S-shaped logistic function: as z → −∞ it gives 0, as z → +∞ it gives 1.</p>"}, {"k": "proof", "h": "Derivation: odds, logit, likelihood", "b": "<ol class=\"big\"><li>From p = e<sup>z</sup>/(1+e<sup>z</sup>), z = β<sub>0</sub>+β<sub>1</sub>X: 1 − p = 1/(1+e<sup>z</sup>).</li><li><b>Odds</b> = p/(1−p) = e<sup>z</sup> ∈ (0, ∞).</li><li><b>The logit (log-odds)</b>: ln(p/(1−p)) = β<sub>0</sub> + β<sub>1</sub>X — <b>is linear in X</b>. Therefore β<sub>1</sub>: +1 to X adds β<sub>1</sub> to the log-odds, i.e. multiplies the odds by e<sup>β<sub>1</sub></sup>. The line in p(X) is not linear: the influence of X on p depends on X.</li><li><b>The estimation is maximum likelihood:</b> L(β) = Π<sub>y<sub>i</sub>=1</sub> p(x<sub>i</sub>) · Π<sub>y<sub>i</sub>=0</sub>(1 − p(x<sub>i</sub>)); we choose β̂ that maximise L (the logarithm: Σ[y<sub>i</sub> ln p + (1−y<sub>i</sub>) ln(1−p)]). There is no closed-form solution, iterations are used (Newton/IRLS).</li><li>Prediction: if p̂(x) &gt; 0.5 (the threshold can be changed), we assign class 1.</li><li>Multiple: p(X) = e<sup>β<sub>0</sub>+β<sub>1</sub>X<sub>1</sub>+…+β<sub>p</sub>X<sub>p</sub></sup>/(1+…). For &gt; 2 classes: multinomial logistic.</li></ol>"}, {"k": "num", "h": "Numbers", "b": "<p>β<sub>0</sub> = −6, β<sub>1</sub> = 0.05. For X = 100: z = −1, p = e<sup>−1</sup>/(1+e<sup>−1</sup>) = 0.269. For X = 120: z = 0, p = 0.5. For X = 160: z = 2, p = 0.881. The odds grow by a factor e<sup>0.05</sup> = 1.051 per unit of X.</p>\n <p><b>Metrics from the confusion matrix:</b> TP = 40, FN = 10, FP = 5, TN = 45. Accuracy = 85/100 = 0.85; sensitivity (recall) = 40/50 = 0.80; specificity = 45/50 = 0.90; precision = 40/45 = 0.889. Changing the threshold, we get the ROC curve (sensitivity against 1 − specificity), AUC is the area under it.</p>"}, {"k": "formula", "h": "GLM and count data (sec. 4.6)", "b": "<p><b>Generalized linear model:</b> the linear predictor η = Xβ is linked to the mean of the response through a link function. The distribution of the response and the link:</p>\n <table class=\"tbl\"><tr><th>Response</th><th>Distribution</th><th>Link</th></tr><tr><td>Quantitative</td><td>Normal</td><td>identity</td></tr><tr><td>Binary / proportion</td><td>Binomial</td><td>logit (or probit)</td></tr><tr><td>Count 0,1,2…</td><td>Poisson</td><td>log</td></tr></table>\n <p><b>Poisson regression:</b> E(n) = m, Var(n) = m (the variance equals the mean), ln m = β<sub>0</sub> + β<sub>1</sub>x ⇒ m = e<sup>β<sub>0</sub>+β<sub>1</sub>x</sup> &gt; 0. Example: β<sub>0</sub> = 1, β<sub>1</sub> = 0.3, x = 2: m = e<sup>1.6</sup> = 4.95; +1 to x multiplies the mean by e<sup>0.3</sup> = 1.35.</p>\n <p><b>Offset:</b> if the count depends on the size M: ln m = ln M + β<sub>0</sub> + β<sub>1</sub>x; ln M is a predictor with a fixed coefficient 1 (we model the rate: 10 accidents per 100 students and per 2000 students are different rates).</p>"}, {"k": "quiz", "q": "Why is logistic regression better than linear for a binary Y?", "o": ["p(X) is always in (0,1)", "it is faster", "it does not require data", "it is linear in p"], "a": 0, "why": "The logistic function is bounded (0,1)."}, {"k": "quiz", "q": "What is linear in X in logistic regression?", "o": ["log-odds ln(p/(1−p))", "the probability p", "odds", "p²"], "a": 0, "why": "ln(p/(1−p)) = β0 + β1X."}, {"k": "quiz", "q": "β1 = 0.05 in logistic regression. By what are the odds multiplied for +1 to X?", "o": ["e^0.05 ≈ 1.051", "0.05", "1.05 is added to p", "1/0.05"], "a": 0, "why": "exp(β1) is the odds multiplier."}, {"k": "note", "h": "Notebook: logistic regression", "b": "<div class=\"nb\"><div class=\"hd\">The model</div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">p(X) = <span class=\"fr\"><span>e<sup>β<sub>0</sub>+β<sub>1</sub>X</sup></span><span>1 + e<sup>β<sub>0</sub>+β<sub>1</sub>X</sup></span></span></span></div><div class=\"nt\">always in (0,1)</div></div><div class=\"hd\">Odds and logit</div><div class=\"ln\"><div class=\"fm\">1 − p = <span class=\"fr\"><span>1</span><span>1 + e<sup>z</sup></span></span>,   z = β<sub>0</sub>+β<sub>1</sub>X</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>p</span><span>1 − p</span></span> = e<sup>z</sup></div><div class=\"nt\">odds</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">ln <span class=\"fr\"><span>p</span><span>1 − p</span></span> = β<sub>0</sub> + β<sub>1</sub>X</span></div><div class=\"nt\">the logit is linear in X</div></div><div class=\"hd\">Likelihood</div><div class=\"ln\"><div class=\"fm\">L(β) = Π<sub>y<sub>i</sub>=1</sub> p(x<sub>i</sub>) · Π<sub>y<sub>i</sub>=0</sub> (1 − p(x<sub>i</sub>))</div></div><div class=\"hd\">Poisson</div><div class=\"ln\"><div class=\"fm\">ln m = β<sub>0</sub> + β<sub>1</sub>x ⇒ m = e<sup>β<sub>0</sub>+β<sub>1</sub>x</sup></div></div><div class=\"ln\"><div class=\"fm\">offset:  ln m = ln M + β<sub>0</sub> + β<sub>1</sub>x</div></div></div>"}, {"k": "exam", "h": "Model answers to the Summary questions", "b": "<ol class=\"big\"><li><b>The goal of classification:</b> to predict a category (a qualitative Y); in regression Y is quantitative and we predict a number.</li><li><b>A qualitative response:</b> takes values from a set of categories (spam/not spam, disease A/B/C, default yes/no).</li><li><b>Why not linear regression:</b> probabilities outside [0,1], an imposed order of classes with &gt; 2 categories.</li><li><b>Logistic regression:</b> models P(Y=1|X) with the logistic function, estimated by maximum likelihood, the probability is always in (0,1).</li><li><b>p(X) = e<sup>β<sub>0</sub>+β<sub>1</sub>X</sup>/(1+e<sup>β<sub>0</sub>+β<sub>1</sub>X</sup>)</b> is the probability of class 1 at the value X; its logit is linear: ln(p/(1−p)) = β<sub>0</sub>+β<sub>1</sub>X; e<sup>β<sub>1</sub></sup> is the odds multiplier per unit of X.</li></ol>"}], "part": "Part 6 · Davide: models and classification"}, {"id": "surv", "title": "26. Survival analysis (Davide)", "goal": "Censoring, S(t), Kaplan–Meier, log-rank, hazard, the Cox model. From Davide's slides.", "cards": [{"k": "story", "h": "What it is and why", "b": "<p>Survival analysis (= lifetime data analysis) studies the <b>time to an event</b>: death, breakdown, a client leaving (churn), the end of a marriage. We need to specify: <b>the time scale and the origin</b> (hours, miles driven, number of pages printed) and <b>the event itself</b>.</p>\n <p><b>The problem is censoring.</b> We often do not see the whole life of an object. Example: bulbs are tested for 100 hours, some did not burn out: we know only \"T &gt; 100\". Patients are observed for 5 years, someone is still alive or dropped out: we know \"T ≥ 5 years\". They cannot be thrown away, this is useful information.</p>\n <p><b>Notation:</b> T is the event time, C is the censoring time, we observe <b>Y = min(T, C)</b> and the indicator <b>δ = 1</b> if T ≤ C (the event is observed), <b>δ = 0</b> if censored. The data: (y<sub>i</sub>, δ<sub>i</sub>).</p>\n <p><b>Types of censoring:</b> right (the event has not yet happened or the object is lost, T &gt; Y; the main type); left (the event was before the start of observation, T ≤ Y); interval (the event is in a known interval, the exact moment is unknown).</p>\n <p><b>The assumption of independent censoring:</b> T ⊥ C | covariates. If sicker patients drop out earlier and we ignore this, survival is overestimated and the comparison of groups is distorted.</p>"}, {"k": "num", "h": "Numbers: why simple proportions are wrong", "b": "<p>88 patients with a brain tumour, 53 alive at the end. We want S(20) = P(T &gt; 20 months). Survived beyond 20 months: 48.</p>\n <ul class=\"big\"><li>Mistake 1: 48/88 = 55%. This counts all censored ones as dead before 20 months, although this is unknown.</li><li>Mistake 2: 48/71 = 68% (71 uncensored by t = 20). It completely ignores those censored before 20 months.</li></ul>\n <p>We need a method that uses both events and censored ones: this is Kaplan–Meier.</p>\n <p><b>A mini KM example.</b> 6 patients: events at 2, 3, 5, 8; censoring at 4 and 7.</p>\n <table class=\"tbl\"><tr><th>t</th><th>r (at risk)</th><th>q (events)</th><th>(r−q)/r</th><th>Ŝ(t)</th></tr><tr><td>2</td><td>6</td><td>1</td><td>5/6</td><td>0.833</td></tr><tr><td>3</td><td>5</td><td>1</td><td>4/5</td><td>0.667</td></tr><tr><td>4 (censored)</td><td>4 → 3</td><td>0</td><td></td><td>0.667</td></tr><tr><td>5</td><td>3</td><td>1</td><td>2/3</td><td>0.444</td></tr><tr><td>7 (censored)</td><td>2 → 1</td><td>0</td><td></td><td>0.444</td></tr><tr><td>8</td><td>1</td><td>1</td><td>0</td><td>0</td></tr></table>\n <p>A censored subject stays at risk until the moment of censoring, then is removed. The median: the first t where Ŝ ≤ 0.5, here t = 5.</p>"}, {"k": "proof", "h": "Derivation of the Kaplan–Meier estimate (as in Davide)", "b": "<ol class=\"big\"><li>Let d<sub>1</sub> &lt; … &lt; d<sub>K</sub> be the unique times of deaths among the uncensored. At the time d<sub>k</sub>: <b>q<sub>k</sub></b> is the number of deaths, <b>r<sub>k</sub></b> is the number \"at risk\" (the risk set) just before d<sub>k</sub>.</li>\n <li>Decomposition by conditional probability: S(d<sub>k</sub>) = P(T &gt; d<sub>k</sub> | T &gt; d<sub>k−1</sub>)·S(d<sub>k−1</sub>) (since P(T &gt; d<sub>k</sub> | T ≤ d<sub>k−1</sub>) = 0).</li>\n <li>Repeating: S(d<sub>k</sub>) = Π<sub>j≤k</sub> P(T &gt; d<sub>j</sub> | T &gt; d<sub>j−1</sub>).</li>\n <li>Each factor is estimated by the proportion of survivors in the risk set: (r<sub>j</sub> − q<sub>j</sub>)/r<sub>j</sub>.</li>\n <li><b>Result:</b> Ŝ(t) = Π<sub>d<sub>j</sub> ≤ t</sub> (r<sub>j</sub> − q<sub>j</sub>)/r<sub>j</sub>. This is a step function, it drops only at event times and is constant between them.</li></ol>\n <p>The KM curve: on the plot it starts at 1, steps go down, dashed lines around it are standard error bands; several curves can be drawn (men and women).</p>"}, {"k": "formula", "h": "Hazard, density, S(t) and the likelihood", "b": "<table class=\"sym\"><tr><td>S(t) = P(T &gt; t)</td><td>the survival function, always decreasing</td></tr>\n <tr><td>h(t) = lim<sub>Δt→0</sub> P(t &lt; T ≤ t+Δt | T &gt; t)/Δt</td><td>hazard: the instantaneous risk of the event at t for those who survived to t</td></tr>\n <tr><td>f(t) = lim P(t &lt; T ≤ t+Δt)/Δt</td><td>density</td></tr>\n <tr><td><b>h(t) = f(t)/S(t)</b></td><td>derivation: P(t&lt;T≤t+Δt | T&gt;t) = P(t&lt;T≤t+Δt)/P(T&gt;t) (the event t&lt;T≤t+Δt already includes T&gt;t)</td></tr>\n <tr><td>L<sub>i</sub> = f(y<sub>i</sub>)<sup>δ<sub>i</sub></sup>·S(y<sub>i</sub>)<sup>1−δ<sub>i</sub></sup></td><td>contribution to the likelihood: the density if an event, S(y<sub>i</sub>) if censored</td></tr>\n <tr><td>L = Π h(y<sub>i</sub>)<sup>δ<sub>i</sub></sup>·S(y<sub>i</sub>)</td><td>through the hazard (substituted f = hS)</td></tr></table>\n <p><b>A parametric model:</b> exponential f(t) = λe<sup>−λt</sup> (a constant hazard), Weibull, Gamma; λ can be estimated by maximising L. The hazard model h(t|x) = exp(β<sub>0</sub> + Σβ<sub>j</sub>x<sub>j</sub>) does not depend on t and is too rigid. Hence Cox.</p>\n <p><b>Why we cannot regress log(Y):</b> for censored ones Y is only a lower bound of T, this systematically understates the times.</p>"}, {"k": "num", "h": "Numbers: the log-rank test", "b": "<p>We compare two groups (for example men and women) not by means but by how events occur. At each moment d<sub>k</sub>: r<sub>1k</sub>, r<sub>2k</sub> are at risk by group, q<sub>k</sub> is the total events. Under H<sub>0</sub> (the curves are equal) the expected number of events in group 1: <b>μ<sub>k</sub> = q<sub>k</sub>·r<sub>1k</sub>/r<sub>k</sub></b>.</p>\n <p>W = Σ(q<sub>1k</sub> − μ<sub>k</sub>) / √(Σ q<sub>k</sub>(r<sub>1k</sub>/r<sub>k</sub>)(1 − r<sub>1k</sub>/r<sub>k</sub>)(r<sub>k</sub>−q<sub>k</sub>)/(r<sub>k</sub>−1)); for large samples W ~ N(0,1).</p>\n <p>A mini example: three events. Moment 1: r<sub>1</sub>=5, r<sub>2</sub>=5, a member of group 1 died: μ = 0.5, q<sub>1</sub>−μ = 0.5, variance 0.25. Moment 2: r<sub>1</sub>=4, r<sub>2</sub>=5, a member of group 2 died: μ = 4/9, q<sub>1</sub>−μ = −0.444, variance 0.247. Moment 3: r<sub>1</sub>=4, r<sub>2</sub>=4, a member of group 1 died: +0.5, variance 0.25. The numerator 0.556, the variance 0.747, W = 0.556/0.864 = <b>0.64</b>, p ≈ 0.52: H<sub>0</sub> we do not reject.</p>\n <p>In the lecture example (BrainCancer): W = 1.2, p = 0.2, H<sub>0</sub> is not rejected.</p>"}, {"k": "proof", "h": "The Cox model and partial likelihood", "b": "<p><b>The model:</b> h(t|x<sub>i</sub>) = h<sub>0</sub>(t)·exp(Σ<sub>j</sub> x<sub>ij</sub>β<sub>j</sub>). h<sub>0</sub>(t) is the baseline hazard (for x = 0), its shape is not specified, exp(Σxβ) is the relative risk. Covariates act multiplicatively: an increase of x<sub>j</sub> by 1 multiplies the hazard by exp(β<sub>j</sub>).</p>\n <p><b>How to estimate β without h<sub>0</sub>:</b></p>\n <ol class=\"big\"><li>At the event time y<sub>i</sub> risk set = {i′ : y<sub>i′</sub> ≥ y<sub>i</sub>}; each has the hazard h<sub>0</sub>(y<sub>i</sub>)·exp(x<sub>i′</sub>β).</li>\n <li>The probability that exactly i dies: h<sub>0</sub>(y<sub>i</sub>)e<sup>x<sub>i</sub>β</sup> / Σ<sub>i′∈risk</sub> h<sub>0</sub>(y<sub>i</sub>)e<sup>x<sub>i′</sub>β</sup>.</li>\n <li>h<sub>0</sub>(y<sub>i</sub>) is common to everyone in the risk set and <b>cancels</b>: e<sup>x<sub>i</sub>β</sup> / Σ e<sup>x<sub>i′</sub>β</sup>.</li>\n <li>We multiply over all events: <b>PL(β) = Π<sub>i: δ<sub>i</sub>=1</sub> e<sup>x<sub>i</sub>β</sup> / Σ<sub>i′: y<sub>i′</sub>≥y<sub>i</sub></sub> e<sup>x<sub>i′</sub>β</sup></b>. It does not depend on h<sub>0</sub>, it uses only the order of events.</li>\n <li>We maximise PL iteratively (as in logistic regression), then tests of H<sub>0</sub>: β<sub>j</sub> = 0 and confidence intervals.</li></ol>\n <p><b>Numbers:</b> three patients, x = (1, 0, 0), events at times 1, 2, 3. PL(β) = [e<sup>β</sup>/(e<sup>β</sup>+2)]·[1/2]·[1]. At β = 0.5: 1.6487/3.6487 = 0.452, PL = 0.226.</p>\n <p><b>The lecture example:</b> sex (men): exp(0.18) ≈ 1.2 (the risk is 20% higher, p = 0.61, not significant); the Karnofsky index: exp(−0.05) ≈ 0.95 per unit (a protective effect, significant). These are hazard multipliers, not probabilities.</p>"}, {"k": "quiz", "q": "What is right censoring?", "o": ["the event has not yet happened by the end of observation or the object is lost: T > Y", "the event happened before the start of observation", "the event is in a known interval", "a measurement error"], "a": 0, "why": "Right censoring: we know only that T > Y."}, {"k": "quiz", "q": "What does δ = 0 mean?", "o": ["the observation is censored, we see C", "we see the true T", "the patient died", "missing data"], "a": 0, "why": "δ = 1 if T ≤ C (the event is observed), δ = 0 if T > C."}, {"k": "quiz", "q": "What is the hazard h(t)?", "o": ["f(t)/S(t)", "S(t)/f(t)", "1 − S(t)", "f(t)·S(t)"], "a": 0, "why": "The conditional density of the event among those who survived to t."}, {"k": "quiz", "q": "Why is h0(t) not needed in the Cox partial likelihood?", "o": ["it is common to everyone in the risk set and cancels", "it was set by an exponential", "it was estimated beforehand", "it equals 1"], "a": 0, "why": "The same h0(y_i) is in the numerator and the denominator."}, {"k": "note", "h": "Notebook: survival analysis", "b": "<div class=\"nb\"><div class=\"hd\">Hazard and density</div><div class=\"ln\"><div class=\"fm\">h(t) = lim<sub>Δt→0</sub> <span class=\"fr\"><span>P(t &lt; T ≤ t+Δt | T &gt; t)</span><span>Δt</span></span></div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">h(t) = <span class=\"fr\"><span>f(t)</span><span>S(t)</span></span></span></div><div class=\"nt\">conditional probability = P(A∩B)/P(B)</div></div><div class=\"ln\"><div class=\"fm\">S(t) = P(T &gt; t),   f(t) = −S′(t)</div></div><div class=\"ln\"><div class=\"fm\">h(t) = − <span class=\"fr\"><span>d</span><span>dt</span></span> ln S(t)  ⇒  S(t) = e<sup>−∫h</sup></div></div><div class=\"hd\">The likelihood with censoring</div><div class=\"ln\"><div class=\"fm\">L<sub>i</sub> = f(y<sub>i</sub>)<sup>δ<sub>i</sub></sup> · S(y<sub>i</sub>)<sup>1−δ<sub>i</sub></sup></div></div><div class=\"ln\"><div class=\"fm\">L = Π h(y<sub>i</sub>)<sup>δ<sub>i</sub></sup> S(y<sub>i</sub>)</div><div class=\"nt\">substituted f = h·S</div></div><div class=\"hd\">Kaplan–Meier</div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">Ŝ(t) = Π<sub>d<sub>j</sub> ≤ t</sub> <span class=\"fr\"><span>r<sub>j</sub> − q<sub>j</sub></span><span>r<sub>j</sub></span></span></span></div><div class=\"nt\">r is at risk, q is events</div></div><div class=\"hd\">Log-rank</div><div class=\"ln\"><div class=\"fm\">μ<sub>k</sub> = q<sub>k</sub> <span class=\"fr\"><span>r<sub>1k</sub></span><span>r<sub>k</sub></span></span></div><div class=\"nt\"> the expected number of events in group 1</div></div><div class=\"ln\"><div class=\"fm\">W = <span class=\"fr\"><span>Σ(q<sub>1k</sub> − μ<sub>k</sub>)</span><span>√Σ q<sub>k</sub>(r<sub>1k</sub>/r<sub>k</sub>)(1−r<sub>1k</sub>/r<sub>k</sub>)(r<sub>k</sub>−q<sub>k</sub>)/(r<sub>k</sub>−1)</span></span></div></div><div class=\"hd\">Cox</div><div class=\"ln\"><div class=\"fm\">h(t|x) = h<sub>0</sub>(t) · exp(Σ x<sub>j</sub>β<sub>j</sub>)</div></div><div class=\"ln\"><div class=\"fm\">PL(β) = Π<sub>i: δ<sub>i</sub>=1</sub> <span class=\"fr\"><span>exp(x<sub>i</sub>β)</span><span>Σ<sub>i′: y<sub>i′</sub> ≥ y<sub>i</sub></sub> exp(x<sub>i′</sub>β)</span></span></div><div class=\"nt\">h₀ cancelled</div></div></div>"}, {"k": "exam", "h": "Davide's questions from the end of the lecture (briefly)", "b": "<ol class=\"big\"><li><b>The goal of survival analysis:</b> to model the time to an event with censoring taken into account (medicine, reliability, churn).</li><li><b>Censoring:</b> the event is not observed, we know only T &gt; y; it cannot be thrown away, it cannot be counted as an event; types: right, left, interval.</li><li><b>S(t):</b> the probability of living longer than t, decreasing.</li><li><b>Risk set:</b> who is still under observation just before d<sub>k</sub> (censored ones are included until the moment of censoring); the basis of KM, log-rank, Cox.</li><li><b>Hazard vs S:</b> hazard is the instantaneous event rate among survivors, S is the cumulative probability of surviving.</li><li><b>h<sub>0</sub>(t) is not specified:</b> the model is flexible, the shape of the risk over time is arbitrary, β is estimated through the partial likelihood.</li><li><b>The challenge versus ordinary regression:</b> Y = min(T,C) understates T, specialised methods are needed.</li><li><b>The intuition of Cox:</b> a common baseline hazard, covariates multiply it by exp(xβ).</li></ol>"}], "part": "Part 6 · Davide: models and classification"}, {"id": "hier", "title": "27. Hierarchical (multilevel) models", "goal": "Nested data, random effects, ICC/VPC, IGLS, shrinkage.", "cards": [{"k": "story", "h": "Why", "b": "<p>The data are nested: students ⊂ schools, patients ⊂ clinics, repeated measurements of one person. Objects within a group are <b>dependent</b> (a common teacher, environment): Cov(Y<sub>i</sub>, Y<sub>j</sub>) ≠ 0. Ordinary regression assumes independence, therefore it <b>understates the standard errors</b>, overestimates the information and gives \"false\" significance. 30 students in one class ≠ 30 students in 30 classes: the groups themselves are statistical units.</p>\n <p><b>Levels:</b> level 1 are individuals (students), level 2 are groups (schools), level 3 is higher still (teachers, regions). Level 1 variation is the spread of individuals within a group; level 2 variation is the spread between groups (different intercepts and slopes of schools).</p>"}, {"k": "proof", "h": "Building a two-level model", "b": "<ol class=\"big\"><li>For one school: y<sub>i</sub> = α + βx<sub>i</sub> + e<sub>i</sub>. For school j: y<sub>ij</sub> = β<sub>0j</sub> + β<sub>1j</sub>x<sub>ij</sub> + e<sub>ij</sub>, e<sub>ij</sub> ~ N(0, σ<sub>e</sub>²).</li>\n <li><b>Random coefficients:</b> β<sub>0j</sub> = β<sub>0</sub> + u<sub>0j</sub>, β<sub>1j</sub> = β<sub>1</sub> + u<sub>1j</sub>; E(u) = 0, Var(u<sub>0j</sub>) = σ<sub>u0</sub>², Var(u<sub>1j</sub>) = σ<sub>u1</sub>², Cov(u<sub>0j</sub>,u<sub>1j</sub>) = σ<sub>u01</sub>.</li>\n <li>Substitution: <b>y<sub>ij</sub> = β<sub>0</sub> + β<sub>1</sub>x<sub>ij</sub> + (u<sub>0j</sub> + u<sub>1j</sub>x<sub>ij</sub> + e<sub>ij</sub>)</b>: fixed part (β<sub>0</sub> + β<sub>1</sub>x) and the random part (in brackets). E(Y) = Xβ.</li>\n <li>The simplest <b>variance components model</b>: y<sub>ij</sub> = β<sub>0</sub> + u<sub>0j</sub> + e<sub>0ij</sub>. Var(y<sub>ij</sub>) = σ<sub>u0</sub>² + σ<sub>e0</sub>²; the Cov of two students of the same school = σ<sub>u0</sub>² (the common u<sub>0j</sub>).</li>\n <li><b>ICC (intra-class correlation) = VPC:</b> ρ = σ<sub>u0</sub>²/(σ<sub>u0</sub>² + σ<sub>e0</sub>²) is the correlation of two students of the same school and the share of the total variance due to differences between groups.</li>\n <li>The covariance matrix <b>is block-diagonal</b>: dependence within a group, independence between groups. The block for a group: V = σ<sub>u0</sub>²J + σ<sub>e0</sub>²I (J is the matrix of ones, I is the identity).</li></ol>"}, {"k": "num", "h": "Numbers: ICC and the correction of SE", "b": "<p>Clinics: σ<sub>u</sub>² = 4.5, σ<sub>e</sub>² = 22 ⇒ VPC = 4.5/(4.5+22) = <b>0.17</b>: 17% of the residual variation is explained by differences between clinics, 83% by differences between patients within a clinic.</p>\n <p>The correction of the OLS error: SE is multiplied by <b>√(1 + ρ<sub>y</sub>ρ<sub>x</sub>(n−1))</b>, ρ<sub>y</sub>, ρ<sub>x</sub> is the ICC for Y and X, n is the group size. For ρ<sub>y</sub> = ρ<sub>x</sub> = 0.2, n = 76: √(1 + 0.04·75) = √4 = <b>2</b> OLS understates SE by half. For n = 1 or ρ = 0 the correction is 1 and OLS is acceptable.</p>\n <p><b>Shrinkage:</b> the predicted group effect û<sub>0j</sub> = R<sub>j</sub>·ỹ<sub>j</sub>, R<sub>j</sub> = σ<sub>u0</sub>²/(σ<sub>u0</sub>² + σ<sub>e0</sub>²/n<sub>j</sub>). The mean of the residuals of the group ỹ<sub>j</sub> = 3: for n<sub>j</sub> = 1: R = 4.5/26.5 = 0.17, û = 0.51; for n<sub>j</sub> = 10: R = 0.67, û = 2.02; for n<sub>j</sub> = 100: R = 0.95, û = 2.86. Small groups are \"pulled\" more strongly to the overall mean.</p>"}, {"k": "formula", "h": "Estimation: GLS and IGLS", "b": "<p>If the variances are known: <b>GLS</b> β̂ = (XᵀV⁻¹X)⁻¹XᵀV⁻¹Y (gives more weight to reliable observations, accounts for clustering).</p>\n <p>If unknown: <b>IGLS</b> (iterative generalized least squares):</p>\n <ol class=\"big\"><li>Start with OLS, take the residuals ỹ<sub>ij</sub> = y<sub>ij</sub> − (β̂<sub>0</sub> + β̂<sub>1</sub>x<sub>ij</sub>).</li><li>Since E(ỸỸᵀ) = V, we estimate the variances <b>by regressing</b> the squares and products of residuals on the matrices of the group structure (we get σ<sub>u0</sub>², σ<sub>e0</sub>²).</li><li>Fixed effects step: we update β by GLS at the current variances; random effects step: we update the variances at the current β.</li><li>Repeat until convergence ⇒ <b>MLE</b>.</li></ol>\n <p>ML in small samples understates the variance components; the correction is <b>REML</b>. Residuals: level 1 are for diagnostics, level 2 are often of independent interest (\"borrowing strength\").</p>\n <p><b>Complex variances:</b> the level-2 variance with a random slope: Var(u<sub>0j</sub> + u<sub>1j</sub>x) = σ<sub>u0</sub>² + 2σ<sub>u01</sub>x + σ<sub>u1</sub>²x² (a quadratic function of x). Level 1: Var = σ<sub>e0</sub>² + 2σ<sub>e01</sub>x + σ<sub>e1</sub>²x² (heteroscedasticity, for example a ceiling effect). The problem of negative variances is solved by nonlinear functions (e<sup>f(x)</sup>) or by restrictions on σ<sub>e01</sub>.</p>\n <p><b>Multilevel GLM:</b> π<sub>ij</sub> = f(Xβ)<sub>ij</sub>; proportions: Binomial + logit/probit; counts: Poisson + log (+ offset ln M<sub>j</sub>); for categories multinomial logit.</p>"}, {"k": "quiz", "q": "What is ICC/VPC?", "o": ["the share of variance due to differences between groups", "the correlation of X and Y", "the share explained by R²", "the number of levels"], "a": 0, "why": "ρ = σ_u²/(σ_u² + σ_e²)."}, {"k": "quiz", "q": "What does OLS do with clustered data?", "o": ["understates the standard errors", "overstates the standard errors", "nothing", "always makes the estimates biased"], "a": 0, "why": "It ignores the dependence within groups: the confidence intervals are too narrow, the tests too liberal."}, {"k": "quiz", "q": "A large group (n_j is large). What happens to shrinkage?", "o": ["almost none, û ≈ the mean of the group's residuals", "strong shrinkage to 0", "û = 0", "û doubles"], "a": 0, "why": "R_j → 1 as n_j grows."}, {"k": "note", "h": "Notebook: the multilevel model", "b": "<div class=\"nb\"><div class=\"hd\">The two-level model</div><div class=\"ln\"><div class=\"fm\">y<sub>ij</sub> = β<sub>0j</sub> + β<sub>1j</sub>x<sub>ij</sub> + e<sub>ij</sub></div></div><div class=\"ln\"><div class=\"fm\">β<sub>0j</sub> = β<sub>0</sub> + u<sub>0j</sub>,   β<sub>1j</sub> = β<sub>1</sub> + u<sub>1j</sub></div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">y<sub>ij</sub> = β<sub>0</sub> + β<sub>1</sub>x<sub>ij</sub> + (u<sub>0j</sub> + u<sub>1j</sub>x<sub>ij</sub> + e<sub>ij</sub>)</span></div><div class=\"nt\">fixed part + random part</div></div><div class=\"hd\">ICC / VPC</div><div class=\"ln\"><div class=\"fm\">Var(y<sub>ij</sub>) = σ<sub>u0</sub>² + σ<sub>e0</sub>²</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">ρ = <span class=\"fr\"><span>σ<sub>u0</sub>²</span><span>σ<sub>u0</sub>² + σ<sub>e0</sub>²</span></span></span></div><div class=\"nt\">the share of variance between groups</div></div><div class=\"hd\">Correction of SE and shrinkage</div><div class=\"ln\"><div class=\"fm\">SE<sub>true</sub> = SE<sub>OLS</sub> · √(1 + ρ<sub>y</sub>ρ<sub>x</sub>(n − 1))</div></div><div class=\"ln\"><div class=\"fm\">R<sub>j</sub> = <span class=\"fr\"><span>σ<sub>u0</sub>²</span><span>σ<sub>u0</sub>² + σ<sub>e0</sub>²/n<sub>j</sub></span></span>,   û<sub>0j</sub> = R<sub>j</sub>·ỹ<sub>j</sub></div></div><div class=\"hd\">GLS</div><div class=\"ln\"><div class=\"fm\">β̂ = (XᵀV⁻¹X)⁻¹ XᵀV⁻¹ Y</div></div></div>"}, {"k": "exam", "h": "Model answer: Hierarchical models", "b": "<p>Hierarchical data: units are nested in groups (students in schools), correlated within a group. OLS assumes independence and therefore understates SE, giving falsely significant results.</p>\n <p>A multilevel model: y<sub>ij</sub> = β<sub>0</sub> + β<sub>1</sub>x<sub>ij</sub> + (u<sub>0j</sub> + u<sub>1j</sub>x<sub>ij</sub> + e<sub>ij</sub>); the fixed part describes the average dependence, the random part describes variation at the level of groups (random intercept, random slope) and individuals. ICC = σ<sub>u0</sub>²/(σ<sub>u0</sub>² + σ<sub>e0</sub>²). Estimation: GLS with known variances; IGLS (iterations between β and the variances) gives ML, REML for small samples. Level-2 residuals are predicted with shrinkage R<sub>j</sub> = σ<sub>u0</sub>²/(σ<sub>u0</sub>² + σ<sub>e0</sub>²/n<sub>j</sub>), small groups are shrunk to the mean (\"borrowing strength\"). Extensions: complex variances and multilevel GLM (logit, Poisson with offset).</p>"}], "part": "Part 6 · Davide: models and classification"}];

function nbSplit(h,sep){let d=0,t=0,out=[],last=0;for(let i=0;i<h.length;i++){const c=h[i];if(c==='<')t++;else if(c==='>')t--;else if(!t){if(c==='(')d++;else if(c===')')d--;else if(!d&&h.startsWith(sep,i)){out.push(h.slice(last,i));last=i+sep.length;i+=sep.length-1}}}out.push(h.slice(last));return out}
function nbConv(h){
  h=h.replace(/([A-Za-zα-ωΑ-Ω])̄/g,'<span class="ov">$1</span>');
  const eq=nbSplit(h,' = ');let rhs=eq.pop();const p=nbSplit(rhs,' / ');
  if(p.length===2){rhs='<span class="fr"><span>'+p[0].trim()+'</span><span>'+p[1].trim()+'</span></span>'}
  h=eq.concat([rhs]).join(' = ');
  h=h.replace(/Σ<sub>([^<>]*)<\/sub>/g,'<span class="sm"><span style="visibility:hidden">.</span><b>Σ</b><span>$1</span></span>');
  return h}

 document.querySelectorAll('.card:not(.fin) b').forEach(b=>{if(b.closest('.nb')||b.dataset.nb||!/ \/ /.test(b.textContent)||!/[=]/.test(b.textContent)||b.textContent.length>90)return;b.dataset.nb=1;b.innerHTML=nbConv(b.innerHTML);b.classList.add('nbf')})}

const PREF=['робастн','цензур','L-гладк','robust','censor','L-smooth'];
const GLM=()=>lang==='en'?GL_EN:GL;
function glEsc(x){return x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function glossify(){
  const o=document.getElementById('glp');if(o)o.remove();
  if(cur==='gl')return;
  document.querySelectorAll('#view .card').forEach(card=>{
    const used={};
    const w=document.createTreeWalker(card,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return(!p||p.closest('abbr,button,.opt,h3,.kind,script,style,.fm,.viz'))?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}});
    const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
    nodes.forEach(n=>{
      let txt=n.nodeValue,hit=null;
      for(const k of Object.keys(GLM()).sort((a,b)=>b.length-a.length)){
        if(used[k])continue;
        const re=new RegExp('(?<![\\wА-Яа-яёЁ])'+glEsc(k)+(PREF.includes(k)?'':'(?![\\wА-Яа-яёЁ])'));
        const m=re.exec(txt);
        if(m&&(!hit||m.index<hit.i))hit={k,i:m.index,len:m[0].length}
      }
      if(!hit)return;
      used[hit.k]=1;
      const sp=document.createElement('abbr');sp.className='gl';sp.dataset.d=GLM()[hit.k];sp.title=GLM()[hit.k];sp.textContent=txt.substr(hit.i,hit.len);
      const after=document.createTextNode(txt.slice(hit.i+hit.len));
      n.nodeValue=txt.slice(0,hit.i);n.parentNode.insertBefore(sp,n.nextSibling);n.parentNode.insertBefore(after,sp.nextSibling);
    });
  });
}

function mkSvg(w,h,inner){return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" font-family="Inter,Arial,sans-serif" font-size="13" style="width:100%;height:auto;display:block"><rect width="${w}" height="${h}" rx="12" fill="${VC.bg}" stroke="#d9dce6"/>${inner}</svg>`}
function tx(x,y,s,o={}){return `<text x="${fx(x)}" y="${fx(y)}" fill="${o.c||VC.ink}" text-anchor="${o.a||'start'}" font-size="${o.s||13}" ${o.b?'font-weight="700"':''} ${o.i?'font-style="italic"':''}>${s}</text>`}
function pl(pts,c,w,dash){return `<polyline fill="none" stroke="${c}" stroke-width="${w||2.5}" ${dash?`stroke-dasharray="${dash}"`:''} stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p=>fx(p[0])+','+fx(p[1])).join(' ')}"/>`}
function dt(x,y,c,r){return `<circle cx="${fx(x)}" cy="${fx(y)}" r="${r||5}" fill="${c}" stroke="#fff" stroke-width="1.5"/>`}

function axes(p,xt,yt,xl,yl){let s='';

function curve(p,f,x0,x1,n,c,w,dash){const pts=[];for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n;pts.push([p.X(x),p.Y(f(x))])}return pl(pts,c||VC.blue,w||3,dash)}

function rng(label,id,min,max,step,val){return `<label style="display:flex;gap:10px;align-items:center;margin:6px 0;font:600 15px Inter,Arial,sans-serif;color:#23262f"><span style="min-width:150px">${label}</span><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" style="flex:1;accent-color:#1f4ea8"></label>`}

VZ.min1=el=>{
  const f=x=>0.25*x**4-x*x+0.4*x,df=x=>x**3-2*x+0.4;
  const root=x0=>{let x=x0;for(let i=0;i<40;i++)x-=df(x)/(3*x*x-2);return x};
  const a=root(-1.6),b=root(0.2),c=root(1.3);
  const p=plot(50,36,430,230,[-2.6,2.3],[-2.2,3.2]),cl=clip(p);
  let s=`<defs>${cl.def}</defs>`+axes(p,[-2,-1,0,1,2],[-2,-1,0,1,2,3],'x',vt('f(x): ошибка','f(x): error'));
  s+=`<g clip-path="url(#${cl.id})">`+curve(p,f,-2.6,2.3,200)+'</g>';
  const mk=(x,col,l1,l2,dy)=>{const X=p.X(x),Y=p.Y(f(x));return `<line x1="${fx(X-34)}" y1="${fx(Y)}" x2="${fx(X+34)}" y2="${fx(Y)}" stroke="${col}" stroke-width="2.5" stroke-dasharray="5 3"/>`+dt(X,Y,col,6)+tx(X,Y+dy,l1,{a:'middle',b:1,c:col,s:12})+tx(X,Y+dy+14,l2,{a:'middle',c:col,s:11})};
  s+=mk(a,VC.grn,vt('глобальный минимум','global minimum'),`x≈${q1(a)}, f≈${q1(f(a))}`,28);
  s+=mk(b,VC.red,vt('локальный максимум','local maximum'),`x≈${q1(b)}`,-26);
  s+=mk(c,VC.org,vt('локальный минимум','local minimum'),`x≈${q1(c)}, f≈${q1(f(c))}`,28);
  s+=tx(p.l+6,p.t+16,vt('пунктир = касательная, f′(x) = 0','dashed = tangent, f′(x) = 0'),{s:12,c:VC.gry});
  const p2=plot(530,36,170,230,[-1.3,1.3],[-1.6,1.6]),c2=clip(p2);
  s+=`<defs>${c2.def}</defs>`+axes(p2,[-1,0,1],[-1,0,1],'x','f = x³');
  s+=`<g clip-path="url(#${c2.id})">`+curve(p2,x=>x**3,-1.3,1.3,80)+'</g>';
  s+=`<line x1="${fx(p2.X(-0.6))}" y1="${fx(p2.Y(0))}" x2="${fx(p2.X(0.6))}" y2="${fx(p2.Y(0))}" stroke="${VC.red}" stroke-width="2.5" stroke-dasharray="5 3"/>`+dt(p2.X(0),p2.Y(0),VC.red,6);
  s+=tx(p2.X(0),p2.t+p2.h+16+16,vt('f′(0)=0, но не минимум','f′(0)=0 but not a minimum'),{a:'middle',s:11,c:VC.red});
  el.innerHTML=mkSvg(720,310,s)};

/* 2. convexity: chord above, tangent below, non-convex */
VZ.convex=el=>{
  const fa=x=>x*x,fb=x=>0.25*x**4-x*x+0.4*x;
  let s='';
  const panel=(l,f,xr,yr,title,kind)=>{
    const p=plot(l,40,205,180,xr,yr),cl=clip(p);
    s+=`<defs>${cl.def}</defs>`+axes(p,[],[],'','')+tx(p.l+p.w/2,22,title,{a:'middle',b:1,s:13});
    s+=`<g clip-path="url(#${cl.id})">`;
    if(kind==='chord'||kind==='bad'){
      const x1=kind==='chord'?-1.5:-1.5,x2=kind==='chord'?1.2:1.3;
      const y1=f(x1),y2=f(x2);
      const pts=[];for(let i=0;i<=60;i++){const x=x1+(x2-x1)*i/60;pts.push([p.X(x),p.Y(f(x))])}
      const ch=[[p.X(x2),p.Y(y2)],[p.X(x1),p.Y(y1)]];
      s+=`<polygon points="${pts.concat(ch).map(q=>fx(q[0])+','+fx(q[1])).join(' ')}" fill="${kind==='chord'?'#2f7d3233':'#c0392b33'}"/>`;
      s+=curve(p,f,xr[0],xr[1],120)+`<line x1="${fx(p.X(x1))}" y1="${fx(p.Y(y1))}" x2="${fx(p.X(x2))}" y2="${fx(p.Y(y2))}" stroke="${kind==='chord'?VC.grn:VC.red}" stroke-width="2.5"/>`+dt(p.X(x1),p.Y(y1),VC.org)+dt(p.X(x2),p.Y(y2),VC.org);
    }else{
      const x0=0.8,k=2*x0,y0=f(x0);
      const g=x=>y0+k*(x-x0);
      const pts=[];for(let i=0;i<=60;i++){const x=-1.8+3.6*i/60;pts.push([p.X(x),p.Y(f(x))])}
      const tl=[];for(let i=60;i>=0;i--){const x=-1.8+3.6*i/60;tl.push([p.X(x),p.Y(g(x))])}
      s+=`<polygon points="${pts.concat(tl).map(q=>fx(q[0])+','+fx(q[1])).join(' ')}" fill="#2f7d3233"/>`;
      s+=curve(p,f,xr[0],xr[1],120)+curve(p,g,xr[0],xr[1],2,VC.grn,2.5)+dt(p.X(x0),p.Y(y0),VC.org);
    }
    s+='</g>';
    return p};
  panel(30,fa,[-1.9,1.9],[-0.4,3.8],vt('выпукла: хорда выше графика','convex: chord above the graph'),'chord');
  panel(268,fa,[-1.9,1.9],[-0.4,3.8],vt('выпукла: касательная ниже графика','convex: tangent below the graph'),'tan');
  panel(506,fb,[-2.2,2.1],[-2.2,3],vt('НЕ выпукла: хорда под графиком','NOT convex: chord below the graph'),'bad');
  s+=tx(360,262,vt('зелёная область: «график ниже хорды / выше касательной» (так и должно быть); красная: условие нарушено','green: "graph below the chord / above the tangent" (as it should be); red: the condition is violated'),{a:'middle',s:12,c:VC.gry});
  el.innerHTML=mkSvg(720,280,s)};

/* 3. contour map and gradient */
VZ.contour=el=>{
  const p=plot(40,20,640,300,[-3.6,3.6],[-1.75,1.75]),cl=clip(p);
  const sc=p.w/7.2;let s=`<defs>${cl.def}</defs><g clip-path="url(#${cl.id})">`;
  [0.5,1,2,3.5,5.5,8,11].forEach((c,i)=>{s+=`<ellipse cx="${fx(p.X(0))}" cy="${fx(p.Y(0))}" rx="${fx(Math.sqrt(c)*sc)}" ry="${fx(Math.sqrt(c/3)*sc)}" fill="none" stroke="${VC.blue}" stroke-opacity="${(0.95-i*0.1).toFixed(2)}" stroke-width="2"/>`});
  const P=[1.6,0.7],g=[2*P[0],6*P[1]],gl=Math.hypot(g[0],g[1]),u=[g[0]/gl,g[1]/gl];
  const X0=p.X(P[0]),Y0=p.Y(P[1]);
  s+=`<line x1="${fx(X0+u[1]*70)}" y1="${fx(Y0+u[0]*70)}" x2="${fx(X0-u[1]*70)}" y2="${fx(Y0-u[0]*70)}" stroke="${VC.gry}" stroke-width="2" stroke-dasharray="6 4"/>`;
  s+=ar(X0,Y0,X0+u[0]*85,Y0-u[1]*85,VC.red,3.5)+ar(X0,Y0,X0-u[0]*85,Y0+u[1]*85,VC.grn,3.5);
  s+=ar(X0,Y0,p.X(0)+8,p.Y(0)-3,VC.org,2)+dt(X0,Y0,VC.ink,6)+dt(p.X(0),p.Y(0),VC.ink,6)+'</g>';
  s+=`<rect x="${p.l}" y="${p.t}" width="${p.w}" height="${p.h}" fill="none" stroke="#c5c9d6"/>`;
  s+=tx(p.X(0)-8,p.Y(0)-12,vt('минимум (0, 0)','minimum (0, 0)'),{a:'end'},{b:1,s:12});
  s+=tx(X0+u[0]*85+6,Y0-u[1]*85-2,vt('градиент: вверх по склону','gradient: uphill'),{c:VC.red,b:1,s:12});
  s+=tx(X0-u[0]*85+8,Y0+u[1]*85+30,vt('−градиент: вниз','−gradient: downhill'),{c:VC.grn,b:1,s:12,a:'end'});
  s+=tx(X0+8,Y0-12,'P = (1.6; 0.7)',{b:1,s:12});
  s+=tx(p.l+8,p.t+18,vt('овалы: линии уровня f = x² + 3y² (на каждом овале f одинакова)','ovals: level lines of f = x² + 3y² (f is the same along each oval)'),{s:12,c:VC.gry});
  s+=tx(p.l+8,p.t+p.h-10,vt('оранжевая стрелка: прямая «к минимуму», она НЕ совпадает с −градиентом','orange arrow: the straight line "to the minimum", it is NOT the same as −gradient'),{s:12,c:VC.org});
  el.innerHTML=mkSvg(720,340,s)};

/* 4. interactive 1D gradient descent */
VZ.gd1=el=>{
  el.innerHTML=rng(vt('шаг t =','step t ='),'g1t',0.05,1.15,0.05,0.25)+'<div class="vzs"></div><div class="vzr" style="font:600 15px Inter,Arial,sans-serif;margin:8px 2px"></div>';
  const S=el.querySelector('.vzs'),R=el.querySelector('.vzr'),I=el.querySelector('input');
  const draw=()=>{const t=+I.value,r=1-2*t,N=8;let a=0;const A=[0];for(let k=0;k<N;k++){a=a-t*2*(a-3);A.push(a)}
    const p=plot(40,30,400,230,[-1,7],[0,16]),cl=clip(p);
    let s=`<defs>${cl.def}</defs>`+axes(p,[0,1,2,3,4,5,6],[0,4,8,12,16],vt('a (параметр)','a (parameter)'),'E(a) = (a−3)²');
    s+=`<g clip-path="url(#${cl.id})">`+curve(p,x=>(x-3)**2,-1,7,120);
    for(let k=0;k<N;k++){const x1=p.X(A[k]),y1=p.Y((A[k]-3)**2),x2=p.X(A[k+1]),y2=p.Y((A[k+1]-3)**2);if(isFinite(x2)&&isFinite(y2))s+=`<line x1="${fx(x1)}" y1="${fx(y1)}" x2="${fx(x2)}" y2="${fx(y2)}" stroke="${VC.org}" stroke-width="1.8" stroke-dasharray="4 3"/>`}
    A.forEach((v,k)=>{s+=dt(p.X(v),p.Y((v-3)**2),k===0?VC.red:VC.org,5)+(k<5?tx(p.X(v),p.Y((v-3)**2)-9,String(k),{a:'middle',s:11,b:1}):'')});
    s+='</g>'+tx(p.X(3),p.t+p.h-6,vt('минимум a = 3','minimum a = 3'),{a:'middle',s:11,c:VC.grn,b:1});
    const q=plot(500,30,200,230,[-0.5,8.5],[-6,6]),c2=clip(q);
    s+=`<defs>${c2.def}</defs>`+axes(q,[0,2,4,6,8],[-6,-3,0,3,6],vt('шаг k','step k'),vt('ошибка e = a − 3','error e = a − 3'));
    s+=`<g clip-path="url(#${c2.id})">`;A.forEach((v,k)=>{const e=v-3;s+=`<rect x="${fx(q.X(k)-8)}" y="${fx(Math.min(q.Y(0),q.Y(e)))}" width="16" height="${fx(Math.abs(q.Y(e)-q.Y(0)))}" fill="${e<0?VC.blue:VC.red}" opacity=".85"/>`});s+='</g>';
    S.innerHTML=mkSvg(720,300,s);
    const v=r===0?vt('ровно в минимум за один шаг','exactly into the minimum in one step'):(Math.abs(r+1)<1e-9?vt('вечные колебания (не сходится)','endless oscillation (does not converge)'):(Math.abs(r)>=1?vt('РАСХОДИТСЯ: шаг слишком большой','DIVERGES: the step is too large'):(r<0?vt('сходится, но с колебаниями (перескакивает минимум)','converges, but oscillates (jumps over the minimum)'):vt('плавно сходится','converges smoothly'))));
    R.innerHTML=`t = ${t.toFixed(2)};  ${vt('множитель ошибки за шаг','error factor per step')} 1 − 2t = <b>${r.toFixed(2)}</b>;  a<sub>8</sub> = ${isFinite(A[N])&&Math.abs(A[N])<1e6?A[N].toFixed(3):'∞'}<br><span style="color:${Math.abs(r)<1?VC.grn:VC.red}">→ ${v}</span>`};
  I.oninput=draw;draw()};

/* 5. interactive 2D gradient descent on an ellipse */
VZ.gd2=el=>{
  el.innerHTML=rng(vt('вытянутость κ =','elongation κ ='),'g2k',1,30,1,10)+rng(vt('шаг (доля от 2/κ) =','step (share of 2/κ) ='),'g2s',0.05,1.2,0.01,0.5)+'<button type="button" id="g2o" style="margin:4px 0 8px;padding:6px 12px;border-radius:10px;border:1px solid #c5c9d6;background:#fff;font:600 13px Inter,Arial,sans-serif;cursor:pointer">'+vt('поставить оптимальный шаг t*','set the optimal step t*')+'</button><div class="vzs"></div><div class="vzr" style="font:600 15px Inter,Arial,sans-serif;margin:8px 2px"></div>';
  const S=el.querySelector('.vzs'),R=el.querySelector('.vzr'),K=el.querySelector('#g2k'),SS=el.querySelector('#g2s');
  const draw=()=>{const k=+K.value,sh=+SS.value,t=sh*2/k,fx_=1-t,fy=1-t*k;
    const p=plot(40,16,640,260,[-1.2,4.8],[-1.3,1.3]),cl=clip(p);const sc=p.w/6;
    let s=`<defs>${cl.def}</defs><g clip-path="url(#${cl.id})">`;
    [0.5,1,2,3,4,5].forEach((r,i)=>{s+=`<ellipse cx="${fx(p.X(0))}" cy="${fx(p.Y(0))}" rx="${fx(r*sc)}" ry="${fx(r/Math.sqrt(k)*sc)}" fill="none" stroke="${VC.blue}" stroke-opacity="${(0.9-i*0.1).toFixed(2)}" stroke-width="1.8"/>`});
    let x=4,y=1;const pts=[[p.X(x),p.Y(y)]];const f0=0.5*(x*x+k*y*y);
    for(let i=0;i<30;i++){x*=fx_;y*=fy;pts.push([p.X(x),p.Y(y)])}
    s+=pl(pts,VC.org,2,'')+pts.slice(0,12).map((q,i)=>dt(q[0],q[1],i===0?VC.red:VC.org,4)).join('')+'</g>';
    s+=`<rect x="${p.l}" y="${p.t}" width="${p.w}" height="${p.h}" fill="none" stroke="#c5c9d6"/>`+dt(p.X(0),p.Y(0),VC.grn,6)+tx(p.X(0)+9,p.Y(0)-8,vt('минимум','minimum'),{c:VC.grn,b:1,s:12})+tx(p.X(4)-6,p.Y(1)-10,vt('старт','start'),{c:VC.red,b:1,s:12,a:'end'});
    S.innerHTML=mkSvg(720,292,s);
    const f30=0.5*(Math.pow(4*Math.pow(fx_,30),2)+k*Math.pow(Math.pow(fy,30),2));
    const stable=Math.abs(fy)<1&&Math.abs(fx_)<1;
    R.innerHTML=`κ = ${k},  t = ${t.toFixed(3)} (t* = ${(2/(1+k)).toFixed(3)});  ${vt('множитель по x','factor along x')}: 1 − t = <b>${fx_.toFixed(3)}</b>,  ${vt('по y','along y')}: 1 − tκ = <b>${fy.toFixed(3)}</b><br><span style="color:${stable?VC.grn:VC.red}">→ ${stable?vt('сходится','converges')+': '+vt('после 30 шагов ошибка f уменьшилась в','after 30 steps the error f fell by a factor of')+' '+(f30>0&&isFinite(f30)?(f0/f30).toExponential(1):'∞'):vt('РАСХОДИТСЯ: шаг больше 2/κ','DIVERGES: the step is larger than 2/κ')}</span>`};
  K.oninput=draw;SS.oninput=draw;el.querySelector('#g2o').onclick=()=>{const k=+K.value;SS.value=(k/(1+k)).toFixed(2);draw()};draw()};

/* 6. interactive line search: Armijo / curvature */
VZ.armijo=el=>{
  el.innerHTML=rng(vt('длина шага α =','step length α ='),'arA',0,1.2,0.01,1)+'<div class="vzs"></div><div class="vzr" style="font:600 15px Inter,Arial,sans-serif;margin:8px 2px"></div>';
  const S=el.querySelector('.vzs'),R=el.querySelector('.vzr'),I=el.querySelector('input');
  const phi=a=>(1-2*a)**2,dphi=a=>-4+8*a,c1=0.1,c2=0.9;
  const draw=()=>{const a=+I.value,p=plot(50,26,630,240,[0,1.2],[-0.1,1.5]),cl=clip(p);
    let s=`<defs>${cl.def}</defs>`+axes(p,[0,0.2,0.4,0.6,0.8,1,1.2],[0,0.5,1,1.5],vt('α (длина шага)','α (step length)'),'φ(α) = f(x + α·d)');
    const lo=0.05,hi=0.9;
    s+=`<rect x="${fx(p.X(lo))}" y="${p.t}" width="${fx(p.X(hi)-p.X(lo))}" height="${p.h}" fill="#2f7d3226"/><rect x="${p.l}" y="${p.t}" width="${fx(p.X(lo)-p.l)}" height="${p.h}" fill="#d98a0030"/><rect x="${fx(p.X(hi))}" y="${p.t}" width="${fx(p.l+p.w-p.X(hi))}" height="${p.h}" fill="#c0392b26"/>`;
    s+=`<g clip-path="url(#${cl.id})">`+curve(p,phi,0,1.2,160)+curve(p,x=>1-4*x,0,1.2,2,VC.gry,1.8,'5 4')+curve(p,x=>1-0.4*x,0,1.2,2,VC.red,2.5,'7 4')+'</g>';
    s+=tx(p.X(lo+0.42),p.t+16,vt('допустимо (Wolfe)','acceptable (Wolfe)'),{a:'middle',b:1,c:VC.grn,s:12})+tx(p.X(0.4),p.Y(0.62),vt('линия Армихо: 1 − 0.4α','Armijo line: 1 − 0.4α'),{c:VC.red,s:12,b:1})+tx(p.X(0.12),p.Y(0.32),vt('касательная в 0','tangent at 0'),{c:VC.gry,s:11})+tx(p.X(hi)+5,p.t+16,vt('слишком длинно','too long'),{c:VC.red,s:11,b:1})+tx(p.l+3,p.t+30,vt('коротко','short'),{c:VC.org,s:10,b:1});
    s+=dt(p.X(a),p.Y(phi(a)),VC.ink,7);
    S.innerHTML=mkSvg(720,300,s);
    const A=phi(a)<=1-4*c1*a+1e-12,C=dphi(a)>=-4*c2-1e-12;
    const mark=ok=>`<span style="color:${ok?VC.grn:VC.red}">${ok?'✓':'✗'}</span>`;
    R.innerHTML=`α = ${a.toFixed(2)}:  φ(α) = ${phi(a).toFixed(3)},  ${vt('линия Армихо','Armijo line')} = ${(1-0.4*a).toFixed(3)} → ${vt('Армихо','Armijo')} ${mark(A)};  φ′(α) = ${dphi(a).toFixed(2)} ≥ −3.6? ${mark(C)}<br>${A&&C?`<span style="color:${VC.grn}">→ ${vt('шаг принимается (условия Вольфе выполнены)','the step is accepted (Wolfe conditions hold)')}</span>`:`<span style="color:${VC.red}">→ ${!A?vt('слишком длинный шаг: функция убывает недостаточно','step too long: not enough decrease'):vt('слишком короткий шаг: можно продвинуться дальше','step too short: we can go further')}</span>`}`};
  I.oninput=draw;draw()};

/* 7. convergence rates (semilog) */
VZ.rates=el=>{
  const p=plot(60,26,620,250,[0,20],[-14,0.3]),cl=clip(p);
  let s=`<defs>${cl.def}</defs>`+axes(p,[0,5,10,15,20],[0,-2,-4,-6,-8,-10,-12,-14],vt('номер итерации k','iteration k'),vt('lg(ошибка): −6 означает 10⁻⁶','lg(error): −6 means 10⁻⁶'));
  s+=`<line x1="${p.l}" y1="${fx(p.Y(-6))}" x2="${p.l+p.w}" y2="${fx(p.Y(-6))}" stroke="${VC.ink}" stroke-dasharray="6 4"/>`+tx(p.l+p.w-4,p.Y(-6)-6,vt('цель: ошибка 10⁻⁶','goal: error 10⁻⁶'),{a:'end',s:12});
  s+=`<g clip-path="url(#${cl.id})">`;
  const sub=[],lin=[],quad=[];let e=0.5;
  for(let k=0;k<=20;k++){sub.push([p.X(k),p.Y(-Math.log10(k+1))]);lin.push([p.X(k),p.Y(k*Math.log10(0.6))]);quad.push([p.X(k),p.Y(Math.max(-15,Math.log10(Math.max(e,1e-300))))]);e=e*e}
  s+=pl(sub,VC.red,3)+pl(lin,VC.blue,3)+pl(quad,VC.grn,3)+lin.concat(quad,sub).map((q,i)=>dt(q[0],q[1],i<21?VC.blue:(i<42?VC.grn:VC.red),3)).join('')+'</g>';
  s+=tx(p.X(12),p.Y(-0.9)-6,vt('сублинейная: 1/k','sublinear: 1/k'),{c:VC.red,b:1,s:13})+tx(p.X(13),p.Y(-3.6),vt('линейная: 0.6ᵏ (прямая вниз)','linear: 0.6ᵏ (a straight line down)'),{c:VC.blue,b:1,s:13})+tx(p.X(5.6),p.Y(-10.4),vt('квадратичная: eₖ₊₁ = eₖ²','quadratic: eₖ₊₁ = eₖ²'),{c:VC.grn,b:1,s:13});
  el.innerHTML=mkSvg(720,320,s)};

/* 8. GD vs heavy ball vs CG on a stretched ellipse */
VZ.hb=el=>{
  const k=16,f=(x,y)=>0.5*(x*x+k*y*y);
  const p=plot(40,16,640,270,[-1.2,4.8],[-1.45,1.45]),cl=clip(p);const sc=p.w/6;
  let s=`<defs>${cl.def}</defs><g clip-path="url(#${cl.id})">`;
  [0.5,1,2,3,4,5].forEach((r,i)=>{s+=`<ellipse cx="${fx(p.X(0))}" cy="${fx(p.Y(0))}" rx="${fx(r*sc)}" ry="${fx(r/Math.sqrt(k)*sc)}" fill="none" stroke="${VC.blue}" stroke-opacity="${(0.85-i*0.1).toFixed(2)}" stroke-width="1.6"/>`});
  const grad=(x,y)=>[x,k*y];
  let x=[4,1],t=2/(1+k);const gd=[x.slice()];let ng=0;
  for(let i=0;i<60;i++){const g=grad(x[0],x[1]);x=[x[0]-t*g[0],x[1]-t*g[1]];gd.push(x.slice());if(!ng&&f(x[0],x[1])<1e-6*f(4,1))ng=i+1}
  const al=4/Math.pow(1+4,2),be=Math.pow((4-1)/(4+1),2);let xp=[4,1],xc=[4,1];const hb=[xc.slice()];let nh=0;
  for(let i=0;i<60;i++){const g=grad(xc[0],xc[1]);const xn=[xc[0]-al*g[0]+be*(xc[0]-xp[0]),xc[1]-al*g[1]+be*(xc[1]-xp[1])];xp=xc;xc=xn;hb.push(xc.slice());if(!nh&&f(xc[0],xc[1])<1e-6*f(4,1))nh=i+1}
  let cx=[4,1],r=[-4,-k*1],d=r.slice();const cg=[cx.slice()];
  for(let i=0;i<2;i++){const Ad=[d[0],k*d[1]],rr=r[0]*r[0]+r[1]*r[1],al2=rr/(d[0]*Ad[0]+d[1]*Ad[1]);cx=[cx[0]+al2*d[0],cx[1]+al2*d[1]];const rn=[r[0]-al2*Ad[0],r[1]-al2*Ad[1]],be2=(rn[0]*rn[0]+rn[1]*rn[1])/rr;d=[rn[0]+be2*d[0],rn[1]+be2*d[1]];r=rn;cg.push(cx.slice())}
  const P=a=>a.map(q=>[p.X(q[0]),p.Y(q[1])]);
  s+=pl(P(gd.slice(0,26)),VC.red,2)+P(gd.slice(0,26)).map(q=>dt(q[0],q[1],VC.red,3)).join('');
  s+=pl(P(hb.slice(0,26)),VC.org,2.5)+P(hb.slice(0,26)).map(q=>dt(q[0],q[1],VC.org,3.5)).join('');
  s+=pl(P(cg),VC.grn,3.5)+P(cg).map(q=>dt(q[0],q[1],VC.grn,6)).join('')+'</g>';
  s+=`<rect x="${p.l}" y="${p.t}" width="${p.w}" height="${p.h}" fill="none" stroke="#c5c9d6"/>`+dt(p.X(0),p.Y(0),VC.ink,6)+tx(p.X(4)-6,p.Y(1)-12,vt('старт (4; 1)','start (4; 1)'),{a:'end',b:1,s:12});
  s+=tx(p.l+10,p.t+p.h-46,`● ${vt('градиентный спуск','gradient descent')}: ${vt('до 10⁻⁶ нужно','needs')} ${ng} ${vt('шагов','steps')}`,{c:VC.red,b:1,s:12})+tx(p.l+10,p.t+p.h-28,`● ${vt('тяжёлый шар','heavy ball')}: ${nh} ${vt('шагов','steps')}`,{c:VC.org,b:1,s:12})+tx(p.l+10,p.t+p.h-10,`● ${vt('сопряжённые градиенты','conjugate gradients')}: 2 ${vt('шага (точно в минимум)','steps (exactly the minimum)')}`,{c:VC.grn,b:1,s:12});
  el.innerHTML=mkSvg(720,300,s)};

/* 9. Newton's method: the parabola model */
VZ.newton=el=>{
  const f=x=>x-Math.log(x),f1=x=>1-1/x,f2=x=>1/(x*x);
  const p=plot(50,26,630,260,[0.15,2.5],[0.8,2.7]),cl=clip(p);
  let s=`<defs>${cl.def}</defs>`+axes(p,[0.5,1,1.5,2,2.5],[1,1.5,2,2.5],'x','f(x) = x − ln x');
  const model=(x0)=>x=>f(x0)+f1(x0)*(x-x0)+0.5*f2(x0)*(x-x0)**2;
  s+=`<g clip-path="url(#${cl.id})">`+curve(p,model(0.75),0.15,2.5,100,VC.pur,1.8,'3 4')+curve(p,x=>f(0.5)+f1(0.5)*(x-0.5),0.15,2.5,2,VC.gry,1.8,'6 4')+curve(p,model(0.5),0.15,2.5,100,VC.org,2.8)+curve(p,f,0.15,2.5,160)+'</g>';
  const xs=[0.5,0.75,0.9375];
  xs.forEach((x,i)=>{s+=`<line x1="${fx(p.X(x))}" y1="${fx(p.Y(f(x)))}" x2="${fx(p.X(x))}" y2="${p.t+p.h}" stroke="${VC.ink}" stroke-dasharray="3 4" stroke-opacity=".5"/>`+dt(p.X(x),p.Y(f(x)),i===0?VC.red:VC.grn,6)+tx(p.X(x),p.t+p.h-6,'x'+'₀₁₂'[i],{a:'middle',b:1,s:13})});
  s+=dt(p.X(1),p.Y(1),VC.ink,6)+tx(p.X(1)+8,p.Y(1)+18,vt('настоящий минимум x = 1','true minimum x = 1'),{s:12,b:1});
  s+=ar(p.X(0.5)+4,p.Y(1.15),p.X(0.75)-4,p.Y(1.15),VC.grn,3);
  s+=tx(p.l+380,p.t+18,vt('синяя: настоящая f','blue: the real f'),{c:VC.blue,b:1,s:12})+tx(p.l+380,p.t+34,vt('оранжевая: парабола в x₀ (модель)','orange: the parabola at x₀ (the model)'),{c:VC.org,b:1,s:12})+tx(p.l+380,p.t+50,vt('серая: касательная (знает GD)','grey: tangent (all GD knows)'),{c:VC.gry,b:1,s:12})+tx(p.l+380,p.t+66,vt('фиолетовая: парабола в x₁','purple: the parabola at x₁'),{c:VC.pur,b:1,s:12});
  el.innerHTML=mkSvg(720,320,s)};

function vizInit(){document.querySelectorAll('#view .viz').forEach(el=>{const g=VZ[el.dataset.v];if(g){el.innerHTML='';try{g(el)}catch(e){el.textContent='viz error: '+e.message}}})}

function render(){
  const Ts=T(),t=Ts.find(x=>x.id===cur),i=S.pos[t.id]||0,c=t.cards[Math.min(i,t.cards.length-1)],u=U();
  const dots=t.cards.map((_,j)=>`<i class="${j<i?'ok':j===i?'on':''}"></i>`).join('');
  const last=i>=t.cards.length;let body='';
  if(last){
    const nxt=Ts[Ts.indexOf(t)+1];
    const qs=t.cards.map((c,j)=>[c,j]).filter(x=>x[0].k==='quiz');
    const right=qs.filter(([c,j])=>S.quiz[qkey(t,j)]===c.a).length;
    body=`<div class="card fin"><div class="big">✓</div><h3>${f(u.passed,t.title)}</h3><p>${f(u.score,right,qs.length)}</p><div class="nav" style="justify-content:center"><button class="btn ghost" id="again">${u.again}</button>${nxt?`<button class="btn" id="nxt">${f(u.goto,nxt.title)}</button>`:''}</div></div>`;
  } else if(c.k==='quiz'){
    const a=S.quiz[qkey(t,i)];
    body=`<div class="card"><span class="kind k-quiz">${u.kinds.quiz}</span><div class="q">${c.q}</div>${c.o.map((o,j)=>`<button class="opt ${a!==undefined?(j===c.a?'good':j===a?'bad':''):''}" data-j="${j}" ${a!==undefined?'disabled':''}>${o}</button>`).join('')}${a!==undefined?`<div class="why"><b>${a===c.a?u.right:u.wrong}</b>${c.why}</div>`:''}</div>`;
  } else body=`<div class="card${c.k==='note'||c.k==='exam'||c.b.startsWith('<div class="nb')?'':' sheet'}"><span class="kind k-${c.k}">${u.kinds[c.k]}</span><h3>${c.h}</h3>${c.k==='exam'?'<div class="nb ex">'+c.b+'</div>':c.b}</div>`;
  const canNext=last||!(c.k==='quiz'&&S.quiz[qkey(t,i)]===undefined);
  view.innerHTML=`<div class="tag">${f(u.of,Ts.indexOf(t),Ts.length-1)}</div><h2 class="tp">${t.title}</h2><p class="goal">${t.goal}</p><div class="dots">${dots}</div>${body}${last?'':`<div class="nav"><button class="btn ghost" id="prev" ${i===0?'disabled':''}>${u.prev}</button><button class="btn" id="next" ${canNext?'':'disabled'}>${i===t.cards.length-1?u.finish:u.next}</button></div>`}`;
  nbify();glossify();vizInit();hlMark();
  view.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.quiz[qkey(t,i)]=+b.dataset.j;save();render()});
  const nx=document.getElementById('next');if(nx)nx.onclick=()=>{S.pos[t.id]=i+1;if(i+1>=t.cards.length)S.done[t.id]=true;save();render();renderSide();window.scrollTo(0,0)};
  const pv=document.getElementById('prev');if(pv)pv.onclick=()=>{S.pos[t.id]=Math.max(0,i-1);save();render()};
  const ag=document.getElementById('again');if(ag)ag.onclick=()=>{S.pos[t.id]=0;t.cards.forEach((c,j)=>delete S.quiz[qkey(t,j)]);save();render()};
  const nt=document.getElementById('nxt');if(nt)nt.onclick=()=>go(Ts[Ts.indexOf(t)+1].id);
}
document.getElementById('menu').onclick=()=>side.classList.toggle('open');
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem('study-lang',lang)}catch(e){}renderSide();render()});
const h=(location.hash||'').slice(1);
if(TOPICS.some(t=>t.id===h))cur=h;else if(S.last&&TOPICS.some(t=>t.id===S.last))cur=S.last;
window.addEventListener('hashchange',()=>{const x=location.hash.slice(1);if(TOPICS.some(t=>t.id===x)&&x!==cur)go(x)});
renderSide();render();
