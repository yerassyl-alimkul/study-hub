: in the neighbourhood of a core but not a core itself; the rest is noise. A cluster = points connected through core points. It finds clusters of arbitrary shape and outliers, the number of clusters is not set; poor with varying density</td></tr><tr><td>fuzzy c-means</td><td>minimises Σᵢ Σⱼ uᵢⱼᵐ‖xᵢ − cⱼ‖², uᵢⱼ are degrees of membership (Σⱼ uᵢⱼ = 1), m &gt; 1 is the \"fuzziness\"; as m → 1 we get k-means</td></tr><tr><td>Davies–Bouldin</td><td>the mean over clusters of max((sᵢ + sⱼ)/d(cᵢ,cⱼ)); lower = better</td></tr><tr><td>Calinski–Harabasz</td><td>(between-cluster spread/(k−1)) / (within-cluster/(N−k)); higher = better</td></tr><tr><td>silhouette</td><td>(b − a)/max(a,b): a is the mean distance to its own points, b to the nearest other cluster; [−1, 1], higher = better</td></tr></table>"}, {"k": "formula", "h": "k-means: the objective, variants and choice of k", "b": "<table class=\"sym\"><tr><td>WCSS = Σᵢ Σ_{x∈Cᵢ} ‖x − μᵢ‖²</td><td>the within-cluster sum of squares that k-means minimises; = Σ|Cᵢ|·var(Cᵢ) = ‖X − ZU‖²_F; an NP-hard problem</td></tr><tr><td>lemma 1</td><td>for a fixed partition the best representatives are the centroids (means): the minimum of a quadratic function at the point Σx/|C|</td></tr><tr><td>lemma 2</td><td>for fixed centres the best partition assigns each point to the nearest centre</td></tr><tr><td>Lloyd's algorithm</td><td>repeat \"assignment — update\"; WCSS does not grow and is bounded below by 0, so it converges (but to a local minimum, so it is run several times). Complexity O(N·k·p·i)</td></tr><tr><td>k-means++</td><td>a new starting centre is chosen with probability ∝ d²(x, the already chosen centres): it spreads the centres out; the result is O(log k)-competitive with the optimum</td></tr><tr><td>k-medians</td><td>the L1 distance, the centre is the median: more robust to outliers</td></tr><tr><td>k-medoids (PAM)</td><td>the centre is an actual data point, any dissimilarity measure; phases BUILD and SWAP, O(k(N−k)²) per iteration; CLARA, CLARANS for large N</td></tr><tr><td>choice of k</td><td>the elbow method (plot WCSS against k: look for the bend), silhouette, DB, CH</td></tr></table>"}, {"k": "num", "h": "Numbers: assignment and centroids (from the lecture)", "b": "<p>The point x₁ = (1, 0); the centres μ₁ = (−2, 1), μ₂ = (−10, 10), μ₃ = (3, −1). Distances: √10 ≈ 3.16, √221 ≈ 14.9, √5 ≈ 2.24. The nearest is μ₃, so x₁ ∈ C₃.</p><p>Update: for the cluster C₃ = {1, 4, 6, 8} the centre = the mean of its points, μ₃ = (7/4, −3/2); for C₁ = {2, 3, 7} we get μ₁ = (−7/3, 2/3).</p><p><b>The silhouette of one point:</b> a = the mean distance to the points of its own cluster, b = the mean distance to the points of the nearest other cluster, s = (b − a)/max(a, b). For example a = 1, b = 3: s = 2/3 (good). a = 3, b = 1: s = −2/3 (the point more likely belongs to another cluster).</p>"}, {"k": "quiz", "q": "Which linkage is prone to the \"chaining\" effect?", "o": ["single", "complete", "Ward", "centroid"], "a": 0, "why": "Single joins clusters through one close pair of points."}, {"k": "quiz", "q": "DBSCAN: a point with ≥ minPts neighbours in its ε-neighbourhood is called…", "o": ["core", "border", "noise", "centroid"], "a": 0, "why": "Core points define the clusters."}, {"k": "quiz", "q": "What is the k-means centroid for the cluster {1, 2, 4}?", "o": ["7/3 ≈ 2.33", "2", "4", "1"], "a": 0, "why": "The mean: (1+2+4)/3 = 7/3."}, {"k": "quiz", "q": "How does DBSCAN differ from k-means?", "o": ["it does not need k and finds noise and clusters of any shape", "it is always faster", "it works only with 1D", "it uses centroids"], "a": 0, "why": "The parameters ε and minPts instead of k."}, {"k": "note", "h": "Notebook: k-means", "b": "<div class=\"nb\"><div class=\"hd\">Goal</div><div class=\"ln\"><div class=\"fm\">J = Σ<sub>j=1</sub><sup>k</sup> Σ<sub>x∈C<sub>j</sub></sub> ‖x − c<sub>j</sub>‖²</div><div class=\"nt\">the sum of squared distances to the centres</div></div><div class=\"hd\">The centre update step</div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>dJ</span><span>dc<sub>j</sub></span></span> = −2 Σ<sub>x∈C<sub>j</sub></sub> (x − c<sub>j</sub>) = 0</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">c<sub>j</sub> = <span class=\"fr\"><span>1</span><span>|C<sub>j</sub>|</span></span> Σ<sub>x∈C<sub>j</sub></sub> x</span></div><div class=\"nt\">the centre = the mean of the points of the cluster</div></div><div class=\"hd\">Silhouette</div><div class=\"ln\"><div class=\"fm\">s = <span class=\"fr\"><span>b − a</span><span>max(a, b)</span></span></div><div class=\"nt\">a is to its own, b is to the nearest other cluster</div></div><div class=\"ln\"><div class=\"fm\">example: a = 2, b = 9.33,   s = <span class=\"fr\"><span>9.33 − 2</span><span>9.33</span></span> = 0.786</div></div></div>"}, {"k": "note", "h": "Notebook: model answers to the questions", "b": "<div class=\"nb\"><div class=\"hd\">Q: Agglomerative hierarchical clustering</div><div class=\"ln\"><div class=\"fm\">start: N clusters of one point; at each step merge the two nearest</div><div class=\"nt\">until one remains</div></div><div class=\"ln\"><div class=\"fm\">the result is a dendrogram; a cut at height h gives clusters</div></div><div class=\"hd\">Q: Single, complete, average linkage</div><div class=\"ln\"><div class=\"fm\">single: d(A,B) = min d(a,b);  complete: max d(a,b);  average (UPGMA): the mean of d(a,b)</div><div class=\"nt\">single gives chains, complete gives compact balls</div></div><div class=\"hd\">Q: How to read a dendrogram</div><div class=\"ln\"><div class=\"fm\">merge height = the distance between clusters; a long \"branch\" without merges = well separated clusters</div><div class=\"nt\">the cophenetic correlation checks the quality of the tree</div></div><div class=\"hd\">Q: k-means as optimisation; Lloyd and its convergence</div><div class=\"ln\"><div class=\"fm\">WCSS = <span class=\"sm\"><span>k</span><b>Σ</b><span>i=1</span></span> <span class=\"sm\"><span></span><b>Σ</b><span>x∈C<sub>i</sub></span></span> ‖x − μ<sub>i</sub>‖² → min</div><div class=\"nt\">NP-hard</div></div><div class=\"ln\"><div class=\"fm\">step 1: each point to the nearest centre (reduces WCSS, the assignment lemma)</div></div><div class=\"ln\"><div class=\"fm\">step 2: the centre = the mean of the cluster (reduces WCSS, the centroid minimises a quadratic function)</div></div><div class=\"ln\"><div class=\"fm\">WCSS does not grow and is ≥ 0 ⇒ converges; the number of partitions is finite ⇒ a finite number of steps; the result is a local minimum</div><div class=\"nt\">several starts, k-means++</div></div><div class=\"hd\">Q: DBSCAN, hard vs soft, silhouette</div><div class=\"ln\"><div class=\"fm\">DBSCAN(ε, minPts): core / border / noise; a cluster = connected core points; arbitrary shape, outliers</div><div class=\"nt\">k is not needed</div></div><div class=\"ln\"><div class=\"fm\">hard: each point in one cluster; soft (fuzzy c-means): degrees of membership u<sub>ij</sub>, Σ<sub>j</sub>u<sub>ij</sub> = 1</div></div><div class=\"ln\"><div class=\"fm\">s = <span class=\"fr\"><span>b − a</span><span>max(a, b)</span></span></div><div class=\"nt\">a is to its own, b to the nearest other; [−1, 1], higher is better</div></div></div>"}, {"k": "exam", "h": "Answer \"Cluster analysis\"", "b": "<ol class=\"big\"><li>The goal and the absence of labels; distances/similarity.</li><li>The main families: partitioning (k-means, k-medoids), hierarchical (AHC, linkage, dendrogram), density-based (DBSCAN), fuzzy.</li><li>k-means: steps, the objective, the derivation of the mean, the local minimum.</li><li>Evaluation: silhouette, elbow; the choice of k.</li><li>A mini 1D example (as above).</li></ol>"}, {"k": "exam", "h": "Model answer (this is how you can write in the exam)", "b": "<p><b>Cluster analysis</b> is the partition of objects into groups (clusters) without pre-given labels so that objects within a cluster are similar and between clusters different. The basis is a similarity measure/distance (Euclidean, Manhattan, cosine…).</p>\n<p><b>Methods:</b> <b>k-means</b> (the number k is given; assignment to the nearest centre, recomputing the centres as the mean; minimises Σ‖x−c<sub>j</sub>‖², converges to a local minimum; variants k-medians, k-medoids); <b>AHC</b> (a hierarchy of merges, linkage single/complete/average/Ward, dendrogram); <b>DBSCAN</b> (ε, minPts; density-based clusters of any shape + noise); <b>fuzzy c-means</b> (degrees of membership).</p>\n<p><b>Quality:</b> silhouette s = (b−a)/max(a,b), the elbow by SSE.</p>\n<p><b>Example:</b> points 1,2,4,9,10,12, k = 2: centres 2.33 and 10.33, SSE = 9.33.</p>"}], "part": "Part 4 · Clustering"}, {"title": "17. Optimality and convexity", "goal": "Conditions for a minimum, convex sets and functions, why convexity matters.", "part": "Part 5 · Optimisation", "cards": [{"k": "story", "h": "What optimisation is for and how it is used", "b": "<div class=\"nb ex\"><div class=\"hd\">Why optimisation is needed</div><p>Almost every model in this course is trained the same way: we define an <b>error function</b> E(parameters) and look for the parameters that make E smallest. Finding the smallest value of a function is called <b>optimisation</b>. Without it a model is just a formula with unknown numbers.</p><div class=\"hd\">Where we have already met it</div><div class=\"ln\"><div class=\"fm\">E(α, β) = Σ (y − αx − β)²  →  min</div><div class=\"nt\">OLS: we look for α and β, the sum of squared residuals</div></div><div class=\"ln\"><div class=\"fm\">J = Σ ‖x − c‖²  →  min</div><div class=\"nt\">k-means: we look for the cluster centres c</div></div><div class=\"ln\"><div class=\"fm\">−ln L(β)  →  min</div><div class=\"nt\">logistic regression: we look for β (maximum likelihood = minimum of minus the logarithm)</div></div><div class=\"ln\"><div class=\"fm\">E(a) = Σ (y − f(x, a))²  →  min</div><div class=\"nt\">nonlinear least squares (Gauss–Newton)</div></div><div class=\"hd\">How it is solved: two cases</div><p><b>Case 1.</b> The condition for a minimum dE/dα = 0 gives <b>linear</b> equations (as in OLS and polynomials). Then there is a formula and the answer is found in one step. The reason: E is quadratic in the parameters, so its derivative is linear.</p><p><b>Case 2.</b> The equations dE/dβ = 0 are <b>nonlinear</b> (logistic regression, nonlinear least squares, neural networks). There is no formula, so we walk to the minimum in steps: x<sub>k+1</sub> = x<sub>k</sub> + t·d. These are iterative methods.</p><div class=\"hd\">What each following topic solves</div><div class=\"ln\"><div class=\"fm\">17. Convexity</div><div class=\"nt\">when the found minimum is the right one: for a convex E any minimum is global, there are no traps</div></div><div class=\"ln\"><div class=\"fm\">18. Gradient descent</div><div class=\"nt\">go down the slope, against the gradient</div></div><div class=\"ln\"><div class=\"fm\">19. Line search</div><div class=\"nt\">what step length t, so as not to overshoot or crawl</div></div><div class=\"ln\"><div class=\"fm\">20. Convergence rates</div><div class=\"nt\">how many steps are needed, it depends on the condition number κ</div></div><div class=\"ln\"><div class=\"fm\">21. Heavy ball and CG</div><div class=\"nt\">speed-up through \"inertia\" and conjugate directions</div></div><div class=\"ln\"><div class=\"fm\">22. Newton's method</div><div class=\"nt\">accounts for curvature (second derivatives), converges fastest, but a step is more expensive</div></div><div class=\"hd\">Numbers: minimise E(a) = (a − 3)²</div><div class=\"ln\"><div class=\"fm\">dE/da = 2(a − 3)</div><div class=\"nt\">the derivative; it is zero at a = 3, this is the answer by the formula</div></div><div class=\"ln\"><div class=\"fm\">a₀ = 0:   dE/da = −6,   a₁ = 0 − 0.25·(−6) = 1.5</div><div class=\"nt\">step t = 0.25: we go against the derivative</div></div><div class=\"ln\"><div class=\"fm\">a₁ = 1.5:   dE/da = −3,   a₂ = 1.5 + 0.75 = 2.25</div></div><div class=\"ln\"><div class=\"fm\">a₂ = 2.25:   dE/da = −1.5,   a₃ = 2.625  →  …  →  3</div><div class=\"nt\">the distance to 3 halves each time: 3, 1.5, 0.75, 0.375, this is the factor 1 − 2t = 0.5</div></div><p>Here the formula is simpler, but for logistic regression there is none, and only steps remain. So next we learn to take steps quickly and in the right direction.</p></div>"}, {"k": "story", "h": "Why look for a minimum: an example with numbers", "b": "<div class=\"nb ex\"><div class=\"hd\">The task by example: choosing a rule</div><p>You have a table of past flat sales. You need a rule to price a <b>new</b> flat: price = a × area. The number a is unknown. Any a gives some predictions, but different a make different mistakes. How do we choose the best one?</p><div class=\"ln\"><div class=\"fm\">Data (area; price): (1; 2), (2; 3), (3; 5)</div><div class=\"nt\">area in tens of m², price in tens of thousands of €</div></div><div class=\"hd\">We try different a and see how wrong we are</div><div class=\"ln\"><div class=\"fm\">a = 1:  predictions 1; 2; 3,  real 2; 3; 5</div><div class=\"nt\">underestimated by 1; 1; 2</div></div><div class=\"ln\"><div class=\"fm\">error = 1² + 1² + 2² = 6</div><div class=\"nt\">we square and add to get one number \"how bad\"</div></div><div class=\"ln\"><div class=\"fm\">a = 2:  predictions 2; 4; 6,  real 2; 3; 5</div><div class=\"nt\">overestimated by 0; 1; 1</div></div><div class=\"ln\"><div class=\"fm\">error = 0² + 1² + 1² = 2</div></div><div class=\"ln\"><div class=\"fm\">a = 1.643:  predictions 1.64; 3.29; 4.93</div><div class=\"nt\">misses 0.36; −0.29; 0.07</div></div><div class=\"ln\"><div class=\"fm\">error = 0.127 + 0.082 + 0.005 = 0.214</div><div class=\"nt\">this is the smallest error among all possible a</div></div><div class=\"hd\">What the point is</div><p>The error function E(a) is just a table \"value of a → how bad\". The minimum of E is the row of the table where \"bad\" is smallest, that is the <b>best a</b>. Finding the minimum is not a goal in itself: it is a way to choose the best rule. A computer cannot \"guess\" which rule is good, it needs a number that can be compared: smaller means better.</p><div class=\"hd\">What we got in the end</div><div class=\"ln\"><div class=\"fm\">new flat 2.5:  1.643 × 2.5 = 4.1</div><div class=\"nt\">a forecast of about 41 thousand € for a flat that is not in the table</div></div><div class=\"hd\">Two more examples</div><p><b>Two pizza delivery points.</b> Houses stand at marks 1, 2, 4, 9, 10, 12 along a street. The error E = the sum of squared distances from each house to the nearest point. This is exactly k-means (topic 16).</p><div class=\"ln\"><div class=\"fm\">points at 5 and 8:  E = 16 + 9 + 1 + 1 + 4 + 16 = 47</div><div class=\"nt\">houses are far from the points: bad</div></div><div class=\"ln\"><div class=\"fm\">points at 2.33 and 10.33:  E = 9.33</div><div class=\"nt\">5 times smaller: the minimum of E gave the best placement</div></div><p><b>A spam filter.</b> Each word has a weight, and E shows how many emails the filter classified wrongly. There are thousands of weights, no formula for the minimum. So the weights are adjusted in steps: \"changed a little, are there fewer mistakes?\". This is walking down a slope in fog (topic 18).</p><div class=\"hd\">The summary in one line</div><p>A model is a formula with \"knobs\" (parameters). The error function is a counter \"how bad\". Optimisation is turning the knobs until the counter is smallest.</p></div>"}, {"k": "story", "h": "How the minimum of a function reduces the model error", "b": "<div class=\"nb ex\"><div class=\"hd\">What exactly we change</div><p>In the error function E the variables are <b>not the data</b> x and y (they are already known and fixed), but the <b>model parameters</b>: α, β or a. Each choice of parameters is a different model, and for it we compute one number E: how much this model is wrong on the data. So E(parameters) is a \"quality map\": it shows which parameters are worse and which are better.</p><div class=\"hd\">Why the minimum of the function = the best model</div><div class=\"ln\"><div class=\"fm\">E(a) = Σ (y<sub>i</sub> − a·x<sub>i</sub>)²</div><div class=\"nt\">the sum of squared residuals: the smaller it is, the closer the predictions are to the data</div></div><p>The function E is the model error, so \"find the minimum of E\" and \"make the model error smallest\" are the same action. Residuals are squared so that plus and minus do not cancel: then E ≥ 0, and E = 0 only when the model hits every point.</p><div class=\"hd\">Numbers: data (1, 2), (2, 3), (3, 5), model ŷ = a·x</div><div class=\"ln\"><div class=\"fm\">E(a) = (2 − a)² + (3 − 2a)² + (5 − 3a)² = 38 − 46a + 14a²</div><div class=\"nt\">substituted the three points and expanded the brackets</div></div><div class=\"ln\"><div class=\"fm\">a = 1:   E = 38 − 46 + 14 = 6</div><div class=\"nt\">the line is too flat, the error is large</div></div><div class=\"ln\"><div class=\"fm\">a = 2:   E = 38 − 92 + 56 = 2</div><div class=\"nt\">too steep</div></div><div class=\"ln\"><div class=\"fm\">a = 1.5:   E = 38 − 69 + 31.5 = 0.5</div><div class=\"nt\">better than both</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>dE</span><span>da</span></span> = −46 + 28a = 0  ⇒  a = 1.643</div><div class=\"nt\">the minimum of E: the derivative is zero; here E = 0.214</div></div><div class=\"ln\"><div class=\"fm\">ŷ = 1.643;  3.286;  4.929   residuals: 0.357;  −0.286;  0.071</div><div class=\"nt\">check: 0.127 + 0.082 + 0.005 = 0.214</div></div><p>For no other a is the error smaller than 0.214. So \"found the minimum of E\" means \"found the best a\".</p><div class=\"hd\">Where optimisation comes in</div><p>For one parameter the minimum was found by the formula dE/da = 0. If there are many parameters or the equation is nonlinear, there is no formula, but the task is the same: find the parameters with the smallest E. Then the minimum is searched for in steps (the following topics).</p><div class=\"hd\">A caveat</div><p>The smallest error on the <b>available</b> data does not always mean the best model on <b>new</b> data. For example a polynomial of degree N − 1 passes through all N points (E = 0), but \"memorises\" the noise. So the model is also checked on held-out data (cross-validation, topic 9).</p></div>"}, {"k": "story", "h": "What the Hessian is", "b": "<div class=\"nb ex\"><div class=\"hd\">What the Hessian is</div><p>The <b>Hessian H</b> is the matrix of all second derivatives of a function of several variables. For f(x, y) it is 2×2. The second derivative shows how fast the slope changes, that is the <b>curvature</b> of the function.</p><div class=\"hd\">How it is written</div><div class=\"ln\"><div class=\"fm\">H<sub>11</sub> = <span class=\"fr\"><span>d²f</span><span>dx²</span></span></div><div class=\"nt\">how fast the slope changes along x</div></div><div class=\"ln\"><div class=\"fm\">H<sub>12</sub> = H<sub>21</sub> = <span class=\"fr\"><span>d²f</span><span>dx dy</span></span></div><div class=\"nt\">mixed: how the slope in x changes when moving in y; H is symmetric, the order of differentiation does not matter</div></div><div class=\"ln\"><div class=\"fm\">H<sub>22</sub> = <span class=\"fr\"><span>d²f</span><span>dy²</span></span></div><div class=\"nt\">how fast the slope changes along y</div></div><p>With n variables the matrix is n×n. To build it, we differentiate with respect to x<sub>i</sub> the derivative with respect to x<sub>j</sub>.</p><div class=\"hd\">What it is for: testing a minimum</div><p>For one variable: d²f/dx² &gt; 0 means a \"bowl\" (minimum), &lt; 0 means a \"hump\" (maximum). For many variables the curvature depends on the direction, so a whole matrix is needed. We look at its eigenvalues λ (the curvature along the principal directions):</p><div class=\"ln\"><div class=\"fm\">all λ &gt; 0  (H ≻ 0)</div><div class=\"nt\">a bowl: if the first derivatives are 0, this is a strict minimum</div></div><div class=\"ln\"><div class=\"fm\">all λ &lt; 0</div><div class=\"nt\">a hump: a maximum</div></div><div class=\"ln\"><div class=\"fm\">λ of different signs</div><div class=\"nt\">a saddle: up in one direction, down in another</div></div><div class=\"ln\"><div class=\"fm\">all λ ≥ 0  (H ⪰ 0)</div><div class=\"nt\">a bowl with a flat bottom: the condition for convexity; for a convex f any minimum is global</div></div><div class=\"hd\">Where it appears next</div><div class=\"ln\"><div class=\"fm\">Newton's method (topic 22)</div><div class=\"nt\">the step d = −H⁻¹·(vector of first derivatives): the Hessian tells how sharply the bowl curves, and the step is fitted to it</div></div><div class=\"ln\"><div class=\"fm\">Gradient descent (topic 20)</div><div class=\"nt\">κ = λ<sub>max</sub> / λ<sub>min</sub>: the ratio of the largest curvature to the smallest determines the convergence rate</div></div><div class=\"hd\">Numbers: f(x, y) = x² + 3y²</div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>df</span><span>dx</span></span> = 2x,   <span class=\"fr\"><span>df</span><span>dy</span></span> = 6y</div><div class=\"nt\">first derivatives</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>d²f</span><span>dx²</span></span> = 2,   <span class=\"fr\"><span>d²f</span><span>dy²</span></span> = 6,   <span class=\"fr\"><span>d²f</span><span>dx dy</span></span> = 0</div><div class=\"nt\">second derivatives: the mixed one is 0 because 2x does not depend on y</div></div><div class=\"ln\"><div class=\"fm\">H = diag(2, 6),   λ = 2 and 6</div><div class=\"nt\">both λ &gt; 0: H ≻ 0, the point (0, 0) is a minimum, f bends more strongly along y</div></div><div class=\"ln\"><div class=\"fm\">For f = x² − y²:   H = diag(2, −2),   λ = 2 and −2</div><div class=\"nt\">different signs: (0, 0) is a saddle, not a minimum</div></div></div>"}, {"k": "story", "h": "Graph: a height map, the gradient and a step down", "b": "<div class=\"nb ex\"><div class=\"hd\">How to read the picture</div><div class=\"viz\" data-v=\"contour\"></div><p>Imagine a map of terrain with height lines. Each <b>oval</b> is a line along which the function f is the same (the \"height\" is the same on that oval). The smaller the oval, the lower the value of f. In the very centre is the bottom of the \"bowl\": the <b>minimum</b>. Here f = x² + 3y².</p><p>The ovals are stretched along x because along y the function grows three times faster (the coefficient 3): a small move in y already raises f noticeably, while along x we must go far.</p><div class=\"hd\">What the gradient is on the picture</div><p>The <b>gradient</b> (the red arrow) is the vector of first derivatives (df/dx, df/dy). It shows the direction in which f grows fastest, that is \"straight uphill\". The green arrow (<b>−gradient</b>) points the opposite way: \"straight downhill\". We walk along it.</p><p><b>Why the gradient is perpendicular to the oval.</b> Along the oval f does not change, so the derivative along the tangent of the oval is zero. The gradient gives the direction of greatest growth, so it is perpendicular to the direction where the growth is zero. The grey dashed line is the tangent to the oval, the red arrow stands at a right angle to it.</p><p><b>An important observation.</b> The orange arrow goes exactly to the minimum, but the green one (−gradient) looks elsewhere. On stretched ovals the \"steepest descent\" is not the same as the \"shortest way to the bottom\". Because of this the descent zigzags (see next, topic 18).</p><div class=\"hd\">Numbers at the point P = (1.6; 0.7)</div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>df</span><span>dx</span></span> = 2x = 3.2,   <span class=\"fr\"><span>df</span><span>dy</span></span> = 6y = 4.2</div><div class=\"nt\">first derivatives: the gradient is (3.2; 4.2)</div></div><div class=\"ln\"><div class=\"fm\">f(P) = 1.6² + 3·0.7² = 2.56 + 1.47 = 4.03</div><div class=\"nt\">the height at the point P</div></div><div class=\"ln\"><div class=\"fm\">t = 0.1:   (1.6; 0.7) − 0.1·(3.2; 4.2) = (1.28; 0.28)</div><div class=\"nt\">a step along −gradient, step length t = 0.1</div></div><div class=\"ln\"><div class=\"fm\">f = 1.28² + 3·0.28² = 1.638 + 0.235 = 1.87</div><div class=\"nt\">it is 1.87 instead of 4.03: we went lower</div></div></div>"}, {"k": "story", "h": "The problem and the conditions for a minimum", "b": "<p>We need to find x* that minimises f(x). <b>A local minimum</b> is the smallest value in a neighbourhood, <b>a global</b> minimum is the smallest overall.</p><ul class=\"big\"><li><b>The first-order necessary condition:</b> if x* is a local minimum, then ∇f(x*) = 0 (a stationary point).</li><li><b>The second-order necessary condition:</b> ∇f(x*) = 0 and the Hessian H(x*) ⪰ 0 (positive semi-definite).</li><li><b>The sufficient condition:</b> ∇f(x*) = 0 and H(x*) ≻ 0 ⇒ a strict local minimum.</li></ul><p>A stationary point is not always a minimum: for f = x³ the derivative at 0 is 0, but this is not a minimum (a saddle).</p>"}, {"k": "story", "h": "Graph: global and local minimum, maximum and a \"false\" point", "b": "<div class=\"nb ex\"><div class=\"hd\">How to read the picture</div><div class=\"viz\" data-v=\"min1\"></div><p>Horizontally we plot the parameter x, vertically the value f(x), that is the error. <b>The lower the point of the curve, the smaller the error.</b> We need the lowest point of the whole curve.</p><p><b>The dashed lines are tangents.</b> At the bottom of any valley and at the top of any hump the curve is momentarily horizontal, so the slope is zero: f′(x) = 0. Such points are called <b>stationary</b>. They are candidates for a minimum, but a candidate is not yet a winner.</p><div class=\"ln\"><div class=\"fm\">green point on the left</div><div class=\"nt\">global minimum: the lowest point of the whole graph. This is what we look for</div></div><div class=\"ln\"><div class=\"fm\">orange point on the right</div><div class=\"nt\">local minimum: lower than all its neighbours, but there is a lower point on the graph. An algorithm can get stuck here</div></div><div class=\"ln\"><div class=\"fm\">red point on the hump</div><div class=\"nt\">local maximum: f′ = 0, but the values around are LOWER, this is a peak, not a bottom</div></div><p><b>The right panel, f = x³.</b> At zero the tangent is also horizontal (f′(0) = 0), but to the left the values are below zero, to the right above. There is neither a minimum nor a maximum. Why: the second derivative f″(0) = 0, there is no curvature that would bend the curve upwards. So the condition \"f′ = 0\" is <b>necessary but not sufficient</b>.</p><div class=\"hd\">What to do in practice</div><p>Find all stationary points, compare the values of f at them and take the smallest. If the function is convex (the next picture), there are no traps: any minimum found is global.</p><div class=\"hd\">Numbers: f(x) = x⁴/4 − x² + 0.4x</div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>df</span><span>dx</span></span> = x³ − 2x + 0.4 = 0</div><div class=\"nt\">the stationarity condition; three roots</div></div><div class=\"ln\"><div class=\"fm\">x ≈ −1.51:  f ≈ −1.58</div><div class=\"nt\">the lowest value: the global minimum</div></div><div class=\"ln\"><div class=\"fm\">x ≈ 0.20:  f ≈ 0.04</div><div class=\"nt\">a local maximum</div></div><div class=\"ln\"><div class=\"fm\">x ≈ 1.30:  f ≈ −0.46</div><div class=\"nt\">a local minimum: higher than −1.58</div></div></div>"}, {"k": "formula", "h": "Convexity: definitions", "b": "<table class=\"sym\"><tr><td>convex set</td><td>together with any two points it contains the segment between them. Examples: balls of any norm, subspaces, ℝⁿ₊, the cone of PSD matrices</td></tr><tr><td>convex function</td><td>f((1−α)x + αy) ≤ (1−α)f(x) + αf(y), α ∈ [0,1]: the chord lies above the graph</td></tr><tr><td>first order</td><td>f(y) ≥ f(x) + ∇f(x)ᵀ(y − x): the tangent lies below the graph</td></tr><tr><td>second order</td><td>H(x) ⪰ 0 for all x</td></tr><tr><td>strictly convex</td><td>the inequalities are strict; H ≻ 0 is sufficient (but x⁴ is strictly convex with H(0) = 0)</td></tr><tr><td>strongly convex</td><td>H ⪰ mI, m &gt; 0</td></tr></table>"}, {"k": "story", "h": "Graph: what a \"convex function\" means", "b": "<div class=\"nb ex\"><div class=\"hd\">Three panels</div><div class=\"viz\" data-v=\"convex\"></div><p><b>The left panel: the chord.</b> Take any two points on the curve and join them with a segment (the chord). If the curve is everywhere <b>below</b> the segment (the green area between them), the function is convex. The formula says exactly this: f((1−α)x + αy) ≤ (1−α)f(x) + αf(y). The left side is the height of the curve at a point between x and y, the right side is the height of the chord at the same point.</p><p><b>The middle panel: the tangent.</b> For a convex function the tangent at any point lies <b>under</b> the graph (the green area): f(y) ≥ f(x) + f′(x)(y − x). This is the second, equivalent definition.</p><p><b>Why this matters for a minimum.</b> If f′(x*) = 0, the tangent at x* is horizontal at the height f(x*). And the whole graph lies above the tangent. So f(y) ≥ f(x*) for every y: x* is a <b>global</b> minimum. That is why for convex functions it is enough to find a point where the derivative is zero.</p><p><b>The right panel: not convex.</b> The chord goes under the graph (the red area). The condition is violated, the function has several valleys and one can get stuck in a shallow one.</p><div class=\"hd\">Numbers: f = x²</div><div class=\"ln\"><div class=\"fm\">x = −1, y = 2, α = 0.5</div><div class=\"nt\">two points and the middle between them</div></div><div class=\"ln\"><div class=\"fm\">f(0.5) = 0.25  ≤  (1 + 4)/2 = 2.5</div><div class=\"nt\">the curve in the middle is below the chord: convex ✓</div></div><div class=\"ln\"><div class=\"fm\">tangent at x = 1:  1 + 2(y − 1);  at y = 3 it is 5 ≤ f(3) = 9</div><div class=\"nt\">the tangent is below the graph ✓</div></div></div>"}, {"k": "proof", "h": "Derivation: for a convex function a stationary point is a global minimum", "b": "<ol class=\"big\"><li>From the definition of convexity: f(x + α(y−x)) ≤ (1−α)f(x) + αf(y) for α ∈ (0,1].</li><li>Rearrange: [f(x + α(y−x)) − f(x)]/α ≤ f(y) − f(x).</li><li>As α → 0 the left side tends to the directional derivative: ∇f(x)ᵀ(y − x). We get <b>f(y) ≥ f(x) + ∇f(x)ᵀ(y−x)</b>.</li><li>If ∇f(x*) = 0, then f(y) ≥ f(x*) for all y: x* is a <b>global minimum</b>.</li></ol><p><b>Conclusion:</b> for convex functions any local minimum is global, and the condition ∇f = 0 is necessary and sufficient. That is why convexity is so important in optimisation: there are no traps of local minima. For a strictly convex function the minimum is also unique.</p>"}, {"k": "num", "h": "Numbers", "b": "<p>f = x²: f′ = 2x = 0 at 0, f″ = 2 &gt; 0 ⇒ a minimum. f = x³: f′(0) = 0, f″(0) = 0, to the left the values are smaller than at 0 ⇒ not a minimum. f = (x² − 1)²: two global minima at x = ±1 and a local maximum at 0 ⇒ non-convex.</p><p>f = x² + 3y²: H = diag(2, 6) ≻ 0 ⇒ strictly (and strongly, m = 2) convex, a unique minimum (0, 0). f = eˣ is convex and strictly, but has no minimum (the values are &gt; 0, 0 is not attained): convexity does not guarantee the <b>existence</b> of a minimum.</p><p>Weierstrass: a continuous function on a closed bounded set attains its minimum and maximum.</p>"}, {"k": "quiz", "q": "f = x³, f′(0) = 0. Is this a minimum?", "o": ["no, a saddle point", "yes", "a maximum", "cannot say"], "a": 0, "why": "f″(0) = 0, and to the left the values are smaller."}, {"k": "quiz", "q": "f is convex and ∇f(x*) = 0. What can we claim?", "o": ["x* is a global minimum", "x* is a local maximum", "there is no minimum", "x* is a saddle"], "a": 0, "why": "From f(y) ≥ f(x*) + 0."}, {"k": "note", "h": "Notebook: model answers to the questions", "b": "<div class=\"nb\"><div class=\"hd\">Q: First- and second-order optimality conditions</div><div class=\"ln\"><div class=\"fm\">∇f(x*) = 0</div><div class=\"nt\">first-order necessary (a stationary point)</div></div><div class=\"ln\"><div class=\"fm\">∇f(x*) = 0 and H(x*) ⪰ 0</div><div class=\"nt\">second-order necessary</div></div><div class=\"ln\"><div class=\"fm\">∇f(x*) = 0 and H(x*) ≻ 0 ⇒ a strict local minimum</div><div class=\"nt\">sufficient</div></div><div class=\"hd\">Q: Convex functions</div><div class=\"ln\"><div class=\"fm\">f((1−α)x + αy) ≤ (1−α)f(x) + αf(y)</div><div class=\"nt\">definition: the chord lies above the graph</div></div><div class=\"ln\"><div class=\"fm\">f(y) ≥ f(x) + ∇f(x)ᵀ(y − x)</div><div class=\"nt\">first order</div></div><div class=\"ln\"><div class=\"fm\">H(x) ⪰ 0 for all x</div><div class=\"nt\">second order</div></div><div class=\"hd\">Q: Why is convexity important</div><div class=\"ln\"><div class=\"fm\">for a convex f any local minimum is global; ∇f = 0 is necessary and sufficient</div><div class=\"nt\">the conclusion from f(y) ≥ f(x*) + 0</div></div><div class=\"ln\"><div class=\"fm\">for a strictly convex function the minimum is unique</div></div></div>"}, {"k": "exam", "h": "Model answers", "b": "<p><b>Optimality conditions:</b> first-order necessary ∇f(x*) = 0; second-order necessary H(x*) ⪰ 0; sufficient: ∇f(x*) = 0 and H(x*) ≻ 0 gives strict local minimum.</p><p><b>Convex function:</b> f((1−α)x + αy) ≤ (1−α)f(x) + αf(y); first-order: f(y) ≥ f(x) + ∇f(x)ᵀ(y−x); second-order: H ⪰ 0. Strictly convex: strict inequalities, unique minimizer; strongly convex: H ⪰ mI.</p><p><b>Why important:</b> for convex f every local minimum is global and ∇f = 0 is necessary and sufficient.</p>"}], "id": "opt1"}, {"id": "gd", "title": "18. Gradient descent", "goal": "Where the step formula comes from, when it converges and how fast.", "cards": [{"k": "story", "h": "Descending a hill in the fog", "b": "<p>We want to find the minimum of the function f(x). We stand at a point and see only the slope (the gradient ∇f). We go in the direction where it goes down steepest, that is <b>−∇f</b>, with a small step t. Repeat.</p>\n <p><b>x<sub>k+1</sub> = x<sub>k</sub> − t·∇f(x<sub>k</sub>)</b>, t is the step length (step size / learning rate).</p>"}, {"k": "story", "h": "Interactive: how the step t affects the descent", "b": "<div class=\"nb ex\"><div class=\"hd\">Try it yourself</div><div class=\"viz\" data-v=\"gd1\"></div><p>Drag the t slider and watch what happens. <b>On the left</b> is the parabola E(a) = (a − 3)², the minimum at a = 3. The red point is the start a₀ = 0, the orange points are steps 1, 2, 3, … We go down the slope. <b>On the right</b> the bars show the error e = a − 3 at each step: a blue bar below zero (we are left of the minimum), a red one above (we jumped over).</p><div class=\"hd\">Where the factor formula comes from</div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>dE</span><span>da</span></span> = 2(a − 3)</div><div class=\"nt\">the derivative (the slope of the parabola)</div></div><div class=\"ln\"><div class=\"fm\">a<sub>k+1</sub> = a<sub>k</sub> − t·2(a<sub>k</sub> − 3)</div><div class=\"nt\">a step against the slope</div></div><div class=\"ln\"><div class=\"fm\">a<sub>k+1</sub> − 3 = (1 − 2t)(a<sub>k</sub> − 3)</div><div class=\"nt\">subtracted 3 from both sides: the error is multiplied by (1 − 2t)</div></div><p>So everything is decided by the number r = 1 − 2t. If |r| &lt; 1, the error shrinks at every step; if |r| ≥ 1, it does not.</p><div class=\"hd\">What to try</div><div class=\"ln\"><div class=\"fm\">t = 0.25:  r = 0.5</div><div class=\"nt\">the error halves each step: 3, 1.5, 0.75, … a smooth descent</div></div><div class=\"ln\"><div class=\"fm\">t = 0.5:  r = 0</div><div class=\"nt\">exactly into the minimum in one step: this is 1/E″, the Newton step \"fits\" here</div></div><div class=\"ln\"><div class=\"fm\">t = 0.75:  r = −0.5</div><div class=\"nt\">we jump over the minimum and come back: oscillations, but the error shrinks</div></div><div class=\"ln\"><div class=\"fm\">t = 1:  r = −1</div><div class=\"nt\">we jump between 0 and 6 forever: no convergence</div></div><div class=\"ln\"><div class=\"fm\">t = 1.1:  r = −1.2</div><div class=\"nt\">farther from the minimum at every step: diverges</div></div><p><b>Conclusion:</b> the step must satisfy 0 &lt; t &lt; 2/λ, where λ = E″ = 2 (the curvature). A step that is too small is slow, one that is too large breaks the method.</p></div>"}, {"k": "num", "h": "Numbers: f(x,y) = x² + 3y²", "b": "<p>∇f = (2x, 6y). Take t = 0.1, start (1, 1).</p>\n <table class=\"tbl\"><tr><th>step</th><th>point</th><th>gradient</th></tr><tr><td>0</td><td>(1, 1)</td><td>(2, 6)</td></tr><tr><td>1</td><td>(1−0.2, 1−0.6) = (0.8, 0.4)</td><td>(1.6, 2.4)</td></tr><tr><td>2</td><td>(0.8−0.16, 0.4−0.24) = (0.64, 0.16)</td><td></td></tr><tr><td>3</td><td>(0.512, 0.064)</td><td></td></tr></table>\n <p>x is multiplied by 0.8 = 1 − 0.1·2, y by 0.4 = 1 − 0.1·6 at each step. We go to (0, 0). If we take t = 0.4, then the multiplier for y is 1 − 0.4·6 = −1.4, |−1.4| &gt; 1: it diverges! The restriction on t is visible from the numbers.</p>"}, {"k": "story", "h": "Interactive: the elongation of the function and the zigzag", "b": "<div class=\"nb ex\"><div class=\"hd\">Try it yourself</div><div class=\"viz\" data-v=\"gd2\"></div><p>The function is f = ½(x² + κy²). Its level lines are ovals, and the larger κ, the more stretched they are (κ = 1 gives circles). The orange broken line is the path of gradient descent from the red point to the minimum (the green point). <b>The κ slider</b> changes the elongation, <b>the step slider</b> changes t as a share of the limit value 2/κ.</p><div class=\"hd\">Where the factor formulas come from</div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>df</span><span>dx</span></span> = x,   <span class=\"fr\"><span>df</span><span>dy</span></span> = κy</div><div class=\"nt\">first derivatives</div></div><div class=\"ln\"><div class=\"fm\">x<sub>k+1</sub> = (1 − t)·x<sub>k</sub>,   y<sub>k+1</sub> = (1 − tκ)·y<sub>k</sub></div><div class=\"nt\">the step in each coordinate is independent: each is simply multiplied by its own factor</div></div><p>To avoid diverging in y we need |1 − tκ| &lt; 1, that is t &lt; 2/κ. But then in x the factor 1 − t stays close to 1 (for large κ the step t is tiny), and in x we crawl very slowly. This is the <b>curse of the condition number κ = λ<sub>max</sub>/λ<sub>min</sub></b>: the steep direction limits the step, and the shallow one therefore converges slowly.</p><div class=\"hd\">What to try</div><div class=\"ln\"><div class=\"fm\">κ = 1, step 0.5 (t = 1)</div><div class=\"nt\">circles: one step straight into the minimum</div></div><div class=\"ln\"><div class=\"fm\">κ = 10, step 0.5 (t = 1/L = 0.1)</div><div class=\"nt\">the factor in y is 0 (straight to zero), in x it is 0.9: we crawl along x slowly</div></div><div class=\"ln\"><div class=\"fm\">κ = 10, step 0.9</div><div class=\"nt\">in y the factor is −0.8: a zigzag across the bottom of the ravine</div></div><div class=\"ln\"><div class=\"fm\">κ = 10, step above 1</div><div class=\"nt\">diverges: the step exceeded 2/κ</div></div><div class=\"ln\"><div class=\"fm\">κ = 30, any step</div><div class=\"nt\">very slow: after 30 steps the error has fallen only a little</div></div><p>The \"optimal step\" button sets t* = 2/(λ<sub>min</sub> + λ<sub>max</sub>) = 2/(1 + κ), the best constant step. But even it gives the factor (κ − 1)/(κ + 1): at κ = 30 this is 0.935, that is still slow. This is where the idea of accelerations comes from (heavy ball, CG, Newton).</p></div>"}, {"k": "proof", "h": "Derivation 1: why exactly −∇f", "b": "<p>Taylor expansion: f(x + d) ≈ f(x) + ∇f(x)ᵀd. Among all directions of unit length ‖d‖ = 1 we want the smallest value of ∇fᵀd. By the Cauchy–Bunyakovsky inequality ∇fᵀd ≥ −‖∇f‖‖d‖, and equality is attained for <b>d = −∇f/‖∇f‖</b>. So the anti-gradient is the direction of the fastest decrease.</p>\n <p>The condition for decrease: ∇fᵀd &lt; 0. For d = −∇f this is −‖∇f‖² &lt; 0 as long as the gradient is not zero.</p>"}, {"k": "proof", "h": "Derivation 2: the condition for convergence and the rate for a quadratic f", "b": "<p>Take f(x) = ½xᵀAx − bᵀx with a symmetric positive definite A (eigenvalues 0 &lt; λ<sub>min</sub> ≤ … ≤ λ<sub>max</sub>). The minimum x*: Ax* = b. The gradient ∇f = Ax − b = A(x − x*).</p>\n <ol class=\"big\"><li>The error e<sub>k</sub> = x<sub>k</sub> − x*. The step: e<sub>k+1</sub> = e<sub>k</sub> − tAe<sub>k</sub> = <b>(I − tA)e<sub>k</sub></b>.</li>\n <li>In the basis of eigenvectors of A the error component is multiplied by (1 − tλ<sub>i</sub>) at each step.</li>\n <li><b>Convergence</b> ⇔ |1 − tλ<sub>i</sub>| &lt; 1 for all i ⇔ <b>0 &lt; t &lt; 2/λ<sub>max</sub></b>. (In the example λ<sub>max</sub> = 6, so t &lt; 1/3: 0.1 fits, 0.4 does not.)</li>\n <li><b>The best step:</b> we minimise max|1 − tλ|: t* = 2/(λ<sub>min</sub> + λ<sub>max</sub>), the rate ‖e<sub>k+1</sub>‖ ≤ ((κ − 1)/(κ + 1))‖e<sub>k</sub>‖, where κ = λ<sub>max</sub>/λ<sub>min</sub> is the condition number. The more \"stretched\" the level lines (the larger κ), the slower the descent (a linear rate of convergence).</li></ol>"}, {"k": "proof", "h": "Derivation 3: the general case, L-smoothness (the descent lemma)", "b": "<p>Let ∇f be Lipschitz with constant L: ‖∇f(x) − ∇f(y)‖ ≤ L‖x − y‖. Then f(y) ≤ f(x) + ∇f(x)ᵀ(y−x) + (L/2)‖y−x‖². Substitute y = x − t∇f(x):</p>\n <p><b>f(x − t∇f) ≤ f(x) − t(1 − Lt/2)‖∇f(x)‖²</b>.</p>\n <p>For t ≤ 1/L we get f(x<sub>k+1</sub>) ≤ f(x<sub>k</sub>) − (t/2)‖∇f(x<sub>k</sub>)‖²: the function decreases at every step. For a convex f with t = 1/L summation gives f(x<sub>k</sub>) − f* ≤ L‖x<sub>0</sub> − x*‖²/(2k), that is a sublinear rate O(1/k); for a strongly convex f the rate is linear (geometric). Exactly \"linear or sublinear rates\", as said in the lecture.</p>"}, {"k": "formula", "h": "Summary and improvements", "b": "<table class=\"sym\"><tr><td>x<sub>k+1</sub> = x<sub>k</sub> − t∇f(x<sub>k</sub>)</td><td>the basic method</td></tr><tr><td>choice of t</td><td>fixed (t &lt; 2/L), or line search (Armijo/Wolfe: choose t at each step)</td></tr><tr><td>Heavy ball</td><td>adds \"inertia\": x<sub>k+1</sub> = x<sub>k</sub> − t∇f + β(x<sub>k</sub> − x<sub>k−1</sub>), speeds up in \"ravines\"</td></tr><tr><td>Conjugate gradient</td><td>for quadratic f: conjugate directions, at most n steps</td></tr><tr><td>Stopping criterion</td><td>‖∇f‖ is small or f hardly changes</td></tr></table>"}, {"k": "quiz", "q": "Why is the step taken along −∇f?", "o": ["this is the direction of the steepest decrease", "it is easier to compute", "this is the direction towards the maximum", "Newton requires it"], "a": 0, "why": "From Taylor and the Cauchy–Bunyakovsky inequality."}, {"k": "quiz", "q": "f = x² + 3y², λ_max = 6. For which t is convergence guaranteed?", "o": ["t &lt; 1/3", "t &lt; 3", "t = 1", "any t"], "a": 0, "why": "0 &lt; t &lt; 2/λ_max = 1/3."}, {"k": "note", "h": "Notebook: gradient descent", "b": "<div class=\"nb\"><div class=\"hd\">The step</div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">x<sub>k+1</sub> = x<sub>k</sub> − t·∇f(x<sub>k</sub>)</span></div><div class=\"nt\">t is the step length</div></div><div class=\"hd\">Why −∇f</div><div class=\"ln\"><div class=\"fm\">f(x+d) ≈ f(x) + ∇f(x)ᵀ d</div><div class=\"nt\">first-order Taylor</div></div><div class=\"ln\"><div class=\"fm\">∇fᵀd ≥ −‖∇f‖·‖d‖</div><div class=\"nt\">Cauchy–Bunyakovsky</div></div><div class=\"ln\"><div class=\"fm\">equality for  d = − <span class=\"fr\"><span>∇f</span><span>‖∇f‖</span></span></div><div class=\"nt\">the anti-gradient is the fastest decrease</div></div><div class=\"hd\">Quadratic f(x) = ½xᵀAx − bᵀx</div><div class=\"ln\"><div class=\"fm\">∇f = Ax − b = A(x − x*)</div></div><div class=\"ln\"><div class=\"fm\">e<sub>k+1</sub> = (I − tA) e<sub>k</sub></div><div class=\"nt\">e = x − x*</div></div><div class=\"ln\"><div class=\"fm\">converges ⇔ |1 − tλ<sub>i</sub>| &lt; 1 ⇔ 0 &lt; t &lt; <span class=\"fr\"><span>2</span><span>λ<sub>max</sub></span></span></div></div><div class=\"ln\"><div class=\"fm\">the best step  t* = <span class=\"fr\"><span>2</span><span>λ<sub>min</sub>+λ<sub>max</sub></span></span>,   rate  <span class=\"fr\"><span>κ−1</span><span>κ+1</span></span>,   κ = <span class=\"fr\"><span>λ<sub>max</sub></span><span>λ<sub>min</sub></span></span></div></div><div class=\"hd\">The general case (L-smoothness)</div><div class=\"ln\"><div class=\"fm\">f(x − t∇f) ≤ f(x) − t(1 − Lt/2)‖∇f‖²</div><div class=\"nt\">for t ≤ 1/L the function decreases</div></div></div>"}, {"k": "note", "h": "Notebook: model answers to the questions", "b": "<div class=\"nb\"><div class=\"hd\">Q: Gradient descent</div><div class=\"ln\"><div class=\"fm\">x<sub>k+1</sub> = x<sub>k</sub> − t·∇f(x<sub>k</sub>)</div><div class=\"nt\">t is the step (learning rate)</div></div><div class=\"ln\"><div class=\"fm\">why −∇f: f(x + d) ≈ f(x) + ∇fᵀd, the minimum at d = −∇f/‖∇f‖</div><div class=\"nt\">the direction of the steepest descent</div></div><div class=\"ln\"><div class=\"fm\">for a quadratic f the condition for convergence: 0 &lt; t &lt; 2/λ<sub>max</sub></div><div class=\"nt\">for t = 1/L guaranteed decrease</div></div></div>"}, {"k": "exam", "h": "Answer \"Gradient descent\"", "b": "<ol class=\"big\"><li>Goal: min f(x), the iteration x<sub>k+1</sub> = x<sub>k</sub> − t∇f(x<sub>k</sub>).</li><li>Derivation: Taylor + the direction of the steepest decrease.</li><li>Choice of the step: the condition t &lt; 2/L, line search.</li><li>Rate: linear for strong convexity (κ), O(1/k) otherwise.</li><li>Drawbacks: slow with poor conditioning; improvements: heavy ball, CG, Newton.</li></ol>"}, {"k": "exam", "h": "Model answer (this is how you can write in the exam)", "b": "<p><b>Gradient descent</b> is an iterative method for minimising a differentiable f: <b>x<sub>k+1</sub> = x<sub>k</sub> − t·∇f(x<sub>k</sub>)</b>, t &gt; 0 is the step length.</p>\n<p><b>Derivation:</b> f(x+d) ≈ f(x) + ∇fᵀd; by the Cauchy–Bunyakovsky inequality ∇fᵀd ≥ −‖∇f‖‖d‖ with equality for d = −∇f/‖∇f‖, so the anti-gradient is the direction of the steepest decrease.</p>\n<p><b>Convergence:</b> for a quadratic f the error is multiplied by (I − tA), convergence for 0 &lt; t &lt; 2/λ<sub>max</sub>; the rate is linear with the factor (κ−1)/(κ+1), κ = λ<sub>max</sub>/λ<sub>min</sub>. For an L-smooth convex f with t = 1/L: f(x<sub>k</sub>) − f* ≤ L‖x<sub>0</sub>−x*‖²/(2k) (sublinear).</p>\n<p><b>Improvements:</b> line search (Wolfe), heavy ball, conjugate gradient, Newton's method.</p>"}], "part": "Part 5 · Optimisation"}, {"title": "19. The general descent scheme and line search (Wolfe, backtracking)", "goal": "How to choose the direction and the step length: exact search, the Armijo, Wolfe and Goldstein conditions.", "part": "Part 5 · Optimisation", "cards": [{"k": "story", "h": "The general scheme", "b": "<p>Almost all optimisation methods do the same thing: from the point xₖ they choose a <b>direction</b> dₖ and a <b>step length</b> αₖ, and go to xₖ₊₁ = xₖ + αₖdₖ. The direction must be a <b>descent direction</b>: ∇f(xₖ)ᵀdₖ &lt; 0 (the function first decreases). All methods can be written as dₖ = −B⁻¹∇f: for B = I we get gradient descent, for B = H (the Hessian) Newton's method.</p><p><b>Why −∇f is the steepest descent:</b> among unit directions d the value ∇fᵀd is minimal for d = −∇f/‖∇f‖ (the Cauchy–Schwarz inequality: ∇fᵀd ≥ −‖∇f‖‖d‖). We stop when ‖∇f‖ ≤ ε.</p>"}, {"k": "formula", "h": "Choosing the step α: what \"good enough\" means", "b": "<p>Denote φ(α) = f(xₖ + αdₖ), a function of one variable α. We need to choose α.</p><table class=\"sym\"><tr><td>exact search</td><td>α = argmin φ(α). For a quadratic f = ½xᵀPx − bᵀx: α = ‖g‖²/(gᵀPg), where g = ∇f. Gives a zigzag on elongated functions; in practice expensive</td></tr><tr><td>the Armijo condition (sufficient decrease)</td><td>f(x + αd) ≤ f(x) + c₁α∇f(x)ᵀd, 0 &lt; c₁ &lt; 1 (usually 10⁻⁴): the graph of φ lies below the line with slope c₁φ′(0). Rules out steps that are too long</td></tr><tr><td>the curvature condition</td><td>∇f(x + αd)ᵀd ≥ c₂∇f(x)ᵀd, c₁ &lt; c₂ &lt; 1: the slope of φ is no longer so steep. Rules out steps that are too short</td></tr><tr><td>the Wolfe conditions</td><td>Armijo + curvature simultaneously</td></tr><tr><td>strong Wolfe</td><td>Armijo + |∇f(x + αd)ᵀd| ≤ c₂|∇f(x)ᵀd|: the derivative of φ is close to zero (needed for nonlinear CG)</td></tr><tr><td>Goldstein (0 &lt; c &lt; ½)</td><td>f + (1−c)α∇fᵀd ≤ f(x + αd) ≤ f + cα∇fᵀd; may exclude all minima of φ</td></tr><tr><td>backtracking</td><td>α := 1 (or α₀), until Armijo holds: α := bα, b ∈ [0.1, 0.8]. One condition is enough because the step decreases gradually</td></tr></table>"}, {"k": "story", "h": "Interactive: the Armijo and Wolfe conditions", "b": "<div class=\"nb ex\"><div class=\"hd\">What this curve is</div><div class=\"viz\" data-v=\"armijo\"></div><p>We stand at the point x and have chosen the direction d. Now we choose the step length α. The function φ(α) = f(x + α·d) shows what f becomes if we walk α along the direction. Here x = 1, f = x², d = −2, so φ(α) = (1 − 2α)²: the minimum at α = 0.5. Drag the α slider and see when the step is accepted.</p><div class=\"hd\">The Armijo condition: \"the function must decrease enough\"</div><div class=\"ln\"><div class=\"fm\">φ(α) ≤ φ(0) + c<sub>1</sub>·α·φ′(0)</div><div class=\"nt\">the curve must lie below the red dashed line</div></div><p>Why not just \"f decreased\"? The sequence 1 + 1/k also decreases, but never reaches the minimum 0. So we demand a decrease proportional to the step length and the slope. The red line is a bit flatter than the tangent (grey), this is the margin c₁ = 0.1. Armijo <b>cuts off steps that are too long</b> (to the right of 0.9 the curve is above the red line).</p><div class=\"hd\">The curvature condition: \"not too short\"</div><div class=\"ln\"><div class=\"fm\">φ′(α) ≥ c<sub>2</sub>·φ′(0)</div><div class=\"nt\">the slope at the new point is no longer as steep as at the start</div></div><p>Armijo also approves tiny steps (at α near 0 the curve is under the red line). But if the slope is still steep, we could have gone further. The curvature condition with c₂ = 0.9 <b>cuts off steps that are too short</b> (left of 0.05, the orange zone). Together the two conditions are called the Wolfe conditions.</p><div class=\"hd\">Numbers</div><div class=\"ln\"><div class=\"fm\">φ(α) ≤ 1 − 0.4α  ⇔  4α² − 3.6α ≤ 0  ⇔  α ≤ 0.9</div><div class=\"nt\">solved Armijo: α from 0 to 0.9 is allowed</div></div><div class=\"ln\"><div class=\"fm\">φ′(α) = −4 + 8α ≥ −3.6  ⇔  α ≥ 0.05</div><div class=\"nt\">solved curvature: α from 0.05</div></div><div class=\"ln\"><div class=\"fm\">α = 1:  φ = 1 &gt; 0.6</div><div class=\"nt\">Armijo ✗, too long; backtracking reduces α to 0.5</div></div><div class=\"ln\"><div class=\"fm\">α = 0.02:  Armijo ✓, but φ′ = −3.84 &lt; −3.6</div><div class=\"nt\">curvature ✗: the step is too short</div></div></div>"}, {"k": "num", "h": "Numbers: backtracking on f(x) = x²", "b": "<p>x = 1, d = −f′(1) = −2, c₁ = 0.1, b = 0.5, α = 1. We check Armijo: f(x + αd) = f(−1) = 1; the right side f(1) + c₁·α·f′(1)·d = 1 + 0.1·1·2·(−2) = 0.6. 1 ≤ 0.6? No, we reduce α = 0.5: f(0) = 0; the right side 1 + 0.1·0.5·2·(−2) = 0.8; 0 ≤ 0.8, we accept α = 0.5, we landed exactly in the minimum.</p><p><b>Why \"f decreased\" is not enough:</b> the sequence fₖ = 1 + 1/k decreases, but tends to 1, while the minimum of the function may be 0. So one requires a <i>sufficient</i> decrease proportional to α∇fᵀd.</p>"}, {"k": "quiz", "q": "What does the curvature condition (the second part of the Wolfe conditions) guarantee?", "o": ["the step is not too short", "the step is not too long", "that d is a descent direction", "that f is convex"], "a": 0, "why": "Armijo forbids long steps, curvature forbids steps that are too short."}, {"k": "quiz", "q": "Backtracking line search uses…", "o": ["only the Armijo condition and reducing α by the factor b", "exact minimisation", "the Hessian", "the second Wolfe condition is mandatory"], "a": 0, "why": "The step decreases gradually, so the second condition is not needed."}, {"k": "exam", "h": "Model answers", "b": "<p><b>General descent method:</b> x<sub>k+1</sub> = x<sub>k</sub> + α<sub>k</sub>d<sub>k</sub> with descent direction ∇f(x<sub>k</sub>)ᵀd<sub>k</sub> &lt; 0; −∇f is steepest descent by Cauchy–Schwarz; stop when ‖∇f‖ ≤ ε.</p><p><b>Wolfe conditions:</b> sufficient decrease (Armijo) f(x + αd) ≤ f(x) + c₁α∇f(x)ᵀd and curvature ∇f(x + αd)ᵀd ≥ c₂∇f(x)ᵀd with 0 &lt; c₁ &lt; c₂ &lt; 1; strong Wolfe uses |∇f(x + αd)ᵀd| ≤ c₂|∇f(x)ᵀd|.</p><p><b>Exact line search:</b> α = argmin f(x + αd) (for quadratic α = ‖g‖²/gᵀPg); <b>backtracking:</b> start with α = 1 and multiply by b until Armijo holds.</p>"}], "id": "ls"}, {"title": "20. Convergence rates and theorems for gradient descent", "goal": "Linear, sublinear and quadratic convergence; L-smoothness; the condition number κ.", "part": "Part 5 · Optimisation", "cards": [{"k": "story", "h": "How to measure \"fast\"", "b": "<p>Let φₖ be the error at the k-th iteration (for example f(xₖ) − f* or ‖xₖ − x*‖). An algorithm is called:</p><ul class=\"big\"><li><b>sublinear</b>: φₖ ≤ C/√k or C/k or C/k². To reach the error ε, O(1/ε²), O(1/ε), O(1/√ε) iterations are needed. On a logarithmic scale the graph is almost horizontal.</li><li><b>linear (Q-linear)</b>: φₖ₊₁/φₖ ≤ 1 − σ, that is φₖ ≤ C(1 − σ)ᵏ. O(log(1/ε)/σ) iterations are needed. A line going down on a logarithmic scale.</li><li><b>superlinear</b>: φₖ₊₁/φₖ → 0.</li><li><b>quadratic</b>: φₖ₊₁ ≤ Cφₖ²; the number of correct digits doubles, O(log log(1/ε)) iterations.</li></ul>"}, {"k": "story", "h": "Graph: what sublinear, linear and quadratic rates look like", "b": "<div class=\"nb ex\"><div class=\"hd\">How to read the graph</div><div class=\"viz\" data-v=\"rates\"></div><p>Horizontally the iteration number k. Vertically the <b>logarithm of the error</b>: the value −6 means error 10⁻⁶ (one millionth), −12 means 10⁻¹². Each step down is an error 10 times smaller. The logarithmic scale is needed to fit both 1 and one millionth. The faster the line falls, the faster the method.</p><div class=\"ln\"><div class=\"fm\">red: sublinear, e ≈ 1/k</div><div class=\"nt\">almost horizontal: in 20 steps the error fell only 20 times. Very slow</div></div><div class=\"ln\"><div class=\"fm\">blue: linear, e = 0.6ᵏ</div><div class=\"nt\">a straight line down: every step multiplies the error by 0.6, that is gives a constant number of new correct digits</div></div><div class=\"ln\"><div class=\"fm\">green: quadratic, eₖ₊₁ = eₖ²</div><div class=\"nt\">falls ever steeper: the number of correct digits doubles (0.3, 0.6, 1.2, 2.4, 4.8, 9.6) and soon hits the computer precision</div></div><div class=\"hd\">Numbers: how many steps to the error 10⁻⁶</div><div class=\"ln\"><div class=\"fm\">sublinear 1/k:  k = 10⁶</div><div class=\"nt\">a million steps</div></div><div class=\"ln\"><div class=\"fm\">linear 0.6ᵏ:  k = ln(10⁶)/(−ln 0.6) = 13.8/0.511 ≈ 27</div><div class=\"nt\">27 steps</div></div><div class=\"ln\"><div class=\"fm\">quadratic:  e = 0.5, 0.25, 0.0625, 0.0039, 1.5·10⁻⁵, 2.3·10⁻¹⁰</div><div class=\"nt\">5 steps (each time the error is squared)</div></div><p><b>Conclusion:</b> gradient descent on a strongly convex function is linear (blue), on a merely convex one sublinear (red), Newton's method near the solution is quadratic (green).</p></div>"}, {"k": "note", "h": "Notebook: smoothness, the descent lemma, three theorems", "b": "<div class=\"nb\"><div class=\"hd\">L-smoothness</div><div class=\"ln\"><div class=\"fm\">‖∇f(x) − ∇f(y)‖ ≤ L‖x − y‖</div><div class=\"nt\">the gradient does not change faster than with the constant L</div></div><div class=\"ln\"><div class=\"fm\">−L·I ⪯ H(x) ⪯ L·I</div><div class=\"nt\">the same in terms of the Hessian</div></div><div class=\"hd\">The descent lemma (step 1/L)</div><div class=\"ln\"><div class=\"fm\">f(x − ∇f/L) ≤ f(x) − <span class=\"fr\"><span>‖∇f(x)‖²</span><span>2L</span></span></div><div class=\"nt\">every step guarantees a decrease</div></div><div class=\"hd\">Three theorems for GD with the step 1/L</div><div class=\"ln\"><div class=\"fm\">smooth:  min ‖∇f(x<sub>k</sub>)‖ ≤ √(<span class=\"fr\"><span>2L(f₀ − f̄)</span><span>T</span></span>)</div><div class=\"nt\">the rate C/√k, a minimum is not guaranteed</div></div><div class=\"ln\"><div class=\"fm\">+ convex:  f(x<sub>T</sub>) − f* ≤ <span class=\"fr\"><span>L‖x₀ − x*‖²</span><span>2T</span></span></div><div class=\"nt\">the rate C/k, O(1/ε)</div></div><div class=\"ln\"><div class=\"fm\">+ m-strongly convex:  f(x<sub>T</sub>) − f* ≤ (1 − <span class=\"fr\"><span>m</span><span>L</span></span>)<sup>T</sup>(f₀ − f*)</div><div class=\"nt\">a linear rate, O(κ·log(1/ε))</div></div><div class=\"hd\">The condition number</div><div class=\"ln\"><div class=\"fm\">κ = <span class=\"fr\"><span>L</span><span>m</span></span> = <span class=\"fr\"><span>λ<sub>max</sub></span><span>λ<sub>min</sub></span></span></div><div class=\"nt\">the ratio of the largest curvature to the smallest</div></div><div class=\"ln\"><div class=\"fm\">exact search, quadratic f:  (<span class=\"fr\"><span>κ − 1</span><span>κ + 1</span></span>)²</div><div class=\"nt\">the multiplier per step; κ ≥ 1000: GD is almost useless</div></div><div class=\"ln\"><div class=\"fm\">the best constant step:  α = <span class=\"fr\"><span>2</span><span>L + m</span></span></div></div></div>"}, {"k": "num", "h": "Numbers: how many iterations are needed", "b": "<p>For f = (x−1)² + 10: L = m = 2, κ = 1. The step 1/L = ½: x − ½·f′(x) = x − (x − 1) = 1, that is the minimum in <b>one step</b> from any point.</p><p>For f = ½·(1·x² + 100·y²): λ ∈ [1, 100], κ = 100. GD with the step 1/L: the multiplier 1 − 1/κ = 0.99 per step. To reduce the error by a factor of 10⁶: k ≈ ln(10⁶)/0.01 = 1382 iterations. Heavy ball or CG: the multiplier ≈ (√κ − 1)/(√κ + 1) = 9/11 = 0.818, k ≈ ln(10⁶)/0.2 = 69 iterations.</p><p>For f(x) = (h/2)x²: xₖ₊₁ = (1 − αh)xₖ. For α &lt; 1/h it converges monotonically, 1/h &lt; α &lt; 2/h with oscillations, α = 2/h eternal oscillations, α &gt; 2/h it diverges.</p>"}, {"k": "quiz", "q": "κ = 100, GD with the step 1/L. What is the error multiplier per step?", "o": ["0.99", "0.9", "0.5", "0.01"], "a": 0, "why": "1 − 1/κ = 1 − 0.01 = 0.99."}, {"k": "quiz", "q": "Quadratic convergence is when", "o": ["φₖ₊₁ ≤ Cφₖ²", "φₖ₊₁ ≤ (1−σ)φₖ", "φₖ ≤ C/k", "φₖ ≤ C/√k"], "a": 0, "why": "The error is squared: the number of correct digits doubles."}, {"k": "exam", "h": "Model answers", "b": "<p><b>Rates:</b> sublinear C/√k, C/k, C/k² (O(1/ε²), O(1/ε), O(1/√ε) iterations); linear φₖ ≤ C(1−σ)ᵏ (O(log(1/ε)/σ)); superlinear φₖ₊₁/φₖ → 0; quadratic φₖ₊₁ ≤ Cφₖ² (O(log log(1/ε))).</p><p><b>Gradient descent with step 1/L:</b> L-smooth: min‖∇f‖ ≤ √(2L(f₀ − f̄)/T); + convex: f(x_T) − f* ≤ L‖x₀ − x*‖²/(2T); + m-strongly convex: linear rate (1 − m/L)ᵀ.</p><p><b>Condition number</b> κ = L/m = λ_max/λ_min; the number of iterations of GD is O(κ log(1/ε)), of heavy-ball/CG O(√κ log(1/ε)). For quadratics with exact line search the rate is ((κ−1)/(κ+1))².</p>"}], "id": "conv"}, {"title": "21. Heavy ball and the conjugate gradient method", "goal": "How to speed up gradient descent: momentum and conjugate directions.", "part": "Part 5 · Optimisation", "cards": [{"k": "story", "h": "The problem and the idea", "b": "<p>Gradient descent on an \"elongated\" function (λ_max ≫ λ_min, large κ) zigzags across the ravine and moves slowly along it. Two ideas for speeding up:</p><ul class=\"big\"><li><b>Heavy ball (Polyak):</b> add \"inertia\", that is take the previous step into account. Like a heavy ball rolling down a slope that does not jerk from side to side.</li><li><b>Conjugate gradient (CG):</b> choose directions so as not to spoil what has already been achieved in the previous directions (conjugate directions).</li></ul>"}, {"k": "formula", "h": "Formulas", "b": "<table class=\"sym\"><tr><td>heavy ball</td><td>x<sub>k+1</sub> = x<sub>k</sub> − α∇f(x<sub>k</sub>) + β(x<sub>k</sub> − x<sub>k−1</sub>); for a strongly convex f: α = 4/(√L + √m)², β = ((√L − √m)/(√L + √m))²</td></tr><tr><td>the rate of heavy ball</td><td>O(√κ · log(1/ε)) instead of O(κ · log(1/ε)) for plain GD; not a descent method (f may grow), m and L are needed</td></tr><tr><td>CG for Ax = b, A ≻ 0</td><td>minimises ½xᵀAx − bᵀx; the directions are A-conjugate: dᵢᵀ A dⱼ = 0 for i ≠ j</td></tr><tr><td>α<sub>k</sub> = r<sub>k</sub>ᵀr<sub>k</sub> / (d<sub>k</sub>ᵀ A d<sub>k</sub>)</td><td>the step length (exact line search), r = b − Ax is the residual</td></tr><tr><td>x<sub>k+1</sub> = x<sub>k</sub> + α<sub>k</sub> d<sub>k</sub>; r<sub>k+1</sub> = r<sub>k</sub> − α<sub>k</sub> A d<sub>k</sub></td><td>the update of the point and of the residual</td></tr><tr><td>β<sub>k</sub> = r<sub>k+1</sub>ᵀr<sub>k+1</sub> / r<sub>k</sub>ᵀr<sub>k</sub>; d<sub>k+1</sub> = r<sub>k+1</sub> + β<sub>k</sub>d<sub>k</sub></td><td>the new direction</td></tr><tr><td>convergence of CG</td><td>at most N steps; if A has only r distinct eigenvalues, then at most r steps; preconditioning improves the spectrum</td></tr><tr><td>nonlinear CG</td><td>Fletcher–Reeves (β = ‖g_{k+1}‖²/‖g_k‖², needs the strong Wolfe conditions c₂ &lt; ½), Polak–Ribière (β⁺ = max(β, 0)), Hestenes–Stiefel, Dai–Yuan, Hager–Zhang; restart every N steps</td></tr></table>"}, {"k": "story", "h": "Graph: three methods on the same stretched function", "b": "<div class=\"nb ex\"><div class=\"hd\">How to read the picture</div><div class=\"viz\" data-v=\"hb\"></div><p>The function is f = ½(x² + 16y²): very stretched ovals (κ = 16), the minimum in the centre (0, 0). All three methods start from (4; 1).</p><div class=\"ln\"><div class=\"fm\">red: plain gradient descent (step 2/(1+κ))</div><div class=\"nt\">zigzags back and forth across the \"bottom of the ravine\" and only slowly crawls to the centre</div></div><div class=\"ln\"><div class=\"fm\">orange: the heavy ball</div><div class=\"nt\">adds \"inertia\": follows the previous step, so oscillations across the steep direction are damped while speed builds up along the ravine</div></div><div class=\"ln\"><div class=\"fm\">green: conjugate gradients (CG)</div><div class=\"nt\">two steps and we are exactly at the minimum (for a function of two variables)</div></div><div class=\"hd\">Where the improvements come from</div><p>Gradient descent uses only the current slope and \"forgets\" the past. Because of that it jumps over the ravine. <b>The heavy ball</b> with the formula x<sub>k+1</sub> = x<sub>k</sub> − α·(df/dx) + β·(x<sub>k</sub> − x<sub>k−1</sub>) remembers the previous step: like a heavy ball rolling down a slope it does not jerk from side to side. The coefficient β = 0.36 here is the \"strength of inertia\".</p><p><b>CG</b> chooses each next direction so as not to spoil what was already achieved along the previous directions (conjugate directions). In two dimensions two steps are enough: after the first step we are on the axis of the ravine, the second goes exactly along it into the minimum.</p><div class=\"hd\">Numbers from the picture</div><div class=\"ln\"><div class=\"fm\">plain GD: the factor (κ−1)/(κ+1) = 15/17 = 0.88</div><div class=\"nt\">slow: hundreds of steps to a small error</div></div><div class=\"ln\"><div class=\"fm\">heavy ball: the factor (√κ−1)/(√κ+1) = 3/5 = 0.6</div><div class=\"nt\">much faster: complexity O(√κ) instead of O(κ)</div></div><div class=\"ln\"><div class=\"fm\">CG: 2 steps for 2 variables (at most N steps for N variables)</div><div class=\"nt\">exactly the minimum</div></div></div>"}, {"k": "num", "h": "Numbers: CG in two steps", "b": "<p>A = [[4,1],[1,3]], b = (1, 2), start x₀ = 0. The exact solution x* = A⁻¹b = (1/11, 7/11) = (0.0909, 0.6364).</p><table class=\"tbl\"><tr><th>step</th><th>r (residual)</th><th>d</th><th>α</th><th>x after the step</th></tr><tr><td>0</td><td>(1, 2)</td><td>(1, 2)</td><td>5/20 = 0.25</td><td>(0.25, 0.5)</td></tr><tr><td>1</td><td>(−0.5, 0.25)</td><td>(−0.4375, 0.375)</td><td>0.3125/0.859 = 0.3636</td><td><b>(0.0909, 0.6364)</b></td></tr></table><p>Explanations: dᵀAd at step 0: A·(1,2) = (6, 7), (1,2)·(6,7) = 20; α₀ = rᵀr/dᵀAd = 5/20. The new residual r₁ = r₀ − α₀Ad₀ = (1 − 1.5, 2 − 1.75) = (−0.5, 0.25). β₀ = r₁ᵀr₁/r₀ᵀr₀ = 0.3125/5 = 0.0625, d₁ = r₁ + β₀d₀ = (−0.4375, 0.375). After the second step we get <b>the exact solution</b>: N = 2 unknowns, so CG finished in N = 2 steps (in theory; in real computations with rounding more are made).</p>"}, {"k": "proof", "h": "Why CG is good (the idea)", "b": "<p>A step along the conjugate direction dⱼ does not spoil the minimisation done along the previous directions: if dᵢᵀAdⱼ = 0, then decreasing f along dⱼ does not change optimality along dᵢ. So in N steps along N conjugate directions we minimise f along all axes: the exact solution. If A has r distinct eigenvalues, the Krylov space is exhausted in r steps.</p><p>Why β is computed so simply: the residuals r<sub>k</sub> are mutually orthogonal, while the directions are conjugate; from this it follows that only the last direction needs to be stored (memory O(N)).</p>"}, {"k": "quiz", "q": "How many steps does CG need for an N×N system with A ≻ 0 (exact arithmetic)?", "o": ["at most N", "exactly N²", "infinitely many", "1"], "a": 0, "why": "N A-conjugate directions exhaust the space."}, {"k": "quiz", "q": "Heavy ball compared with GD:", "o": ["the rate O(√κ) instead of O(κ), but m and L are needed", "always simpler", "always slower", "no gradient is needed"], "a": 0, "why": "Inertia speeds things up, but does not guarantee a decrease of f at every step."}, {"k": "note", "h": "Notebook: model answers to the questions", "b": "<div class=\"nb\"><div class=\"hd\">Q: Heavy-ball method</div><div class=\"ln\"><div class=\"fm\">x<sub>k+1</sub> = x<sub>k</sub> − α∇f(x<sub>k</sub>) + β(x<sub>k</sub> − x<sub>k−1</sub>)</div><div class=\"nt\">inertia (momentum)</div></div><div class=\"ln\"><div class=\"fm\">α = <span class=\"fr\"><span>4</span><span>(√L + √m)²</span></span>,   β = (<span class=\"fr\"><span>√L − √m</span><span>√L + √m</span></span>)²</div><div class=\"nt\">the rate O(√κ·log 1/ε)</div></div><div class=\"hd\">Q: Conjugate gradient and convergence</div><div class=\"ln\"><div class=\"fm\">A ≻ 0:  Ax = b ⇔ min ½xᵀAx − bᵀx;  the directions are A-conjugate  d<sub>i</sub>ᵀAd<sub>j</sub> = 0</div></div><div class=\"ln\"><div class=\"fm\">α<sub>k</sub> = <span class=\"fr\"><span>r<sub>k</sub>ᵀr<sub>k</sub></span><span>d<sub>k</sub>ᵀAd<sub>k</sub></span></span>,   β<sub>k</sub> = <span class=\"fr\"><span>r<sub>k+1</sub>ᵀr<sub>k+1</sub></span><span>r<sub>k</sub>ᵀr<sub>k</sub></span></span>,   d<sub>k+1</sub> = r<sub>k+1</sub> + β<sub>k</sub>d<sub>k</sub></div><div class=\"nt\">r = b − Ax</div></div><div class=\"ln\"><div class=\"fm\">converges in at most N steps; in r steps if A has r distinct eigenvalues</div></div><div class=\"hd\">Q: Fletcher–Reeves vs Polak–Ribière</div><div class=\"ln\"><div class=\"fm\">FR: β = <span class=\"fr\"><span>‖g<sub>k+1</sub>‖²</span><span>‖g<sub>k</sub>‖²</span></span>;  PR: β = <span class=\"fr\"><span>g<sub>k+1</sub>ᵀ(g<sub>k+1</sub> − g<sub>k</sub>)</span><span>‖g<sub>k</sub>‖²</span></span></div><div class=\"nt\">g is the gradient</div></div><div class=\"ln\"><div class=\"fm\">FR needs strong Wolfe (c₂ &lt; ½); PR is better in practice, β⁺ = max(β, 0) guarantees descent; restart every N steps</div></div></div>"}, {"k": "exam", "h": "Model answers", "b": "<p><b>Heavy-ball:</b> x<sub>k+1</sub> = x<sub>k</sub> − α∇f(x<sub>k</sub>) + β(x<sub>k</sub> − x<sub>k−1</sub>), α = 4/(√L+√m)², β = ((√L−√m)/(√L+√m))²; rate O(√κ log 1/ε); not a descent method.</p><p><b>Conjugate gradient:</b> solves Ax = b, A ≻ 0, directions are A-conjugate (dᵢᵀAdⱼ = 0), α = rᵀr/(dᵀAd), β = r<sub>k+1</sub>ᵀr<sub>k+1</sub>/r<sub>k</sub>ᵀr<sub>k</sub>; converges in at most N steps, in r steps if A has r distinct eigenvalues; preconditioning improves the spectrum.</p><p><b>FR vs PR:</b> Fletcher–Reeves β = ‖g<sub>k+1</sub>‖²/‖g<sub>k</sub>‖² needs strong Wolfe line search (c₂ &lt; ½) for global convergence; Polak–Ribière uses β = g<sub>k+1</sub>ᵀ(g<sub>k+1</sub> − g<sub>k</sub>)/‖g<sub>k</sub>‖², usually performs better in practice, with β⁺ = max(β, 0) to guarantee descent; both restart every N steps.</p>"}], "id": "hb"}, {"id": "newton", "title": "22. Newton's method", "goal": "Derivation, fast (quadratic) convergence and comparison with gradient descent.", "cards": [{"k": "story", "h": "Descent that accounts for curvature", "b": "<p>Gradient descent knows only the slope. Newton's method also knows the <b>curvature</b> (second derivatives, the Hessian matrix H<sub>f</sub>) and approximates the function by a parabola, and finds the minimum of the parabola at once.</p>\n <p>In one dimension: <b>x<sub>k+1</sub> = x<sub>k</sub> − f′(x<sub>k</sub>)/f″(x<sub>k</sub>)</b>. In many dimensions: <b>x<sub>k+1</sub> = x<sub>k</sub> − [H<sub>f</sub>(x<sub>k</sub>)]⁻¹ ∇f(x<sub>k</sub>)</b>. The vector d = −H⁻¹∇f is called the Newton direction, the \"natural\" step is 1.</p>"}, {"k": "story", "h": "Graph: Newton's method replaces the function by a parabola", "b": "<div class=\"nb ex\"><div class=\"hd\">How to read the picture</div><div class=\"viz\" data-v=\"newton\"></div><p>We minimise f(x) = x − ln x (the blue curve, the true minimum at x = 1). We stand at x₀ = 0.5. Gradient descent knows only the <b>tangent</b> (grey): it says \"go right\", but not how far.</p><p>Newton's method also uses the <b>curvature</b> (the second derivative f″). It builds a <b>parabola</b> (orange) that at x₀ matches f in height, slope and curvature. The minimum of a parabola is computed instantly and we jump straight into it: this is the next point x₁ = 0.75. Then we build a new parabola (purple) at x₁ and jump to x₂ = 0.9375.</p><div class=\"hd\">Where the formula comes from</div><div class=\"ln\"><div class=\"fm\">m(x) = f(x<sub>0</sub>) + f′(x<sub>0</sub>)(x − x<sub>0</sub>) + ½f″(x<sub>0</sub>)(x − x<sub>0</sub>)²</div><div class=\"nt\">the parabola: the Taylor series up to second order</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>dm</span><span>dx</span></span> = f′(x<sub>0</sub>) + f″(x<sub>0</sub>)(x − x<sub>0</sub>) = 0</div><div class=\"nt\">the minimum of the parabola: the derivative is zero</div></div><div class=\"ln\"><div class=\"fm\">x<sub>1</sub> = x<sub>0</sub> − f′(x<sub>0</sub>) / f″(x<sub>0</sub>)</div><div class=\"nt\">the Newton step: the slope divided by the curvature</div></div><p>The larger the curvature (the \"steeper\" the parabola), the shorter the step, the smaller it is, the bolder the jump. Gradient descent makes no such difference, so it needs a choice of t.</p><div class=\"hd\">Numbers from the picture</div><div class=\"ln\"><div class=\"fm\">f′(x) = 1 − 1/x,   f″(x) = 1/x²</div><div class=\"nt\">the first and second derivatives</div></div><div class=\"ln\"><div class=\"fm\">x<sub>0</sub> = 0.5:  f′ = −1,  f″ = 4,  x<sub>1</sub> = 0.5 − (−1)/4 = 0.75</div><div class=\"nt\">the first jump</div></div><div class=\"ln\"><div class=\"fm\">x<sub>1</sub> = 0.75:  f′ = −0.333,  f″ = 1.778,  x<sub>2</sub> = 0.75 + 0.1875 = 0.9375</div><div class=\"nt\">the second jump</div></div><div class=\"ln\"><div class=\"fm\">errors: 0.5, 0.25, 0.0625: each is the square of the previous one</div><div class=\"nt\">this is quadratic convergence</div></div></div>"}, {"k": "num", "h": "Numbers 1: a quadratic function, one step", "b": "<p>f(x,y) = x² + 3y². ∇f = (2x, 6y), H = diag(2, 6), H⁻¹ = diag(1/2, 1/6). Start (1, 1): ∇f = (2, 6), d = −H⁻¹∇f = −(1, 1). x₁ = (1,1) − (1,1) = <b>(0, 0)</b>. We hit the minimum in <b>one</b> step (gradient descent from the previous topic needs infinitely many steps). For any quadratic function Newton converges in 1 step.</p>"}, {"k": "num", "h": "Numbers 2: minimise f(x) = x − ln x (the minimum at x = 1)", "b": "<p>f′ = 1 − 1/x, f″ = 1/x². The step: x − f′/f″ = x − (1 − 1/x)·x² = 2x − x². Start 0.5:</p>\n <table class=\"tbl\"><tr><th>k</th><th>x<sub>k</sub></th><th>the error |x<sub>k</sub> − 1|</th></tr><tr><td>0</td><td>0.5</td><td>0.5</td></tr><tr><td>1</td><td>0.75</td><td>0.25</td></tr><tr><td>2</td><td>0.9375</td><td>0.0625</td></tr><tr><td>3</td><td>0.99609</td><td>0.0039</td></tr></table>\n <p>The error is squared each time: 0.25 = 0.5², 0.0625 = 0.25², 0.0039 ≈ 0.0625². This is <b>quadratic convergence</b>: the number of correct digits doubles.</p>\n <p>The root √2 (we look for f(x) = x² − 2 = 0, the step x − f/f′ = x − (x²−2)/(2x)): 1 → 1.5 → 1.41667 → 1.414216 (√2 = 1.414214).</p>"}, {"k": "proof", "h": "Derivation of Newton's formula (as in the lecture)", "b": "<ol class=\"big\"><li>We take the second-order Taylor expansion around x<sub>k</sub>: f(x<sub>k</sub> + d) ≈ f(x<sub>k</sub>) + ∇f(x<sub>k</sub>)ᵀd + ½dᵀH<sub>f</sub>(x<sub>k</sub>)d =: m(d).</li>\n <li>If H is positive definite, m(d) is a convex parabola, the minimum is at the point where its gradient is zero: ∇m(d) = ∇f(x<sub>k</sub>) + H d = 0.</li>\n <li>Hence <b>d = −H⁻¹∇f(x<sub>k</sub>)</b>, and the next point x<sub>k+1</sub> = x<sub>k</sub> + d.</li>\n <li><b>This is a descent direction:</b> ∇fᵀd = −∇fᵀH⁻¹∇f &lt; 0, since H⁻¹ is positive definite.</li></ol>\n <p><b>If H is not positive definite</b> (lecture): the direction may not be a descent direction or H⁻¹ does not exist, so in such a region the method is modified (regularisation H + μI, line search).</p>"}, {"k": "proof", "h": "Derivation: why the convergence is quadratic (1D, the root of f(x) = 0)", "b": "<p>Let x* be the root, f′(x*) ≠ 0, e<sub>k</sub> = x<sub>k</sub> − x*. Taylor with the remainder term: 0 = f(x*) = f(x<sub>k</sub>) + f′(x<sub>k</sub>)(x* − x<sub>k</sub>) + ½f″(ξ)(x* − x<sub>k</sub>)².</p>\n <p>Divide by f′(x<sub>k</sub>) and rearrange: x<sub>k</sub> − f(x<sub>k</sub>)/f′(x<sub>k</sub>) − x* = (f″(ξ)/(2f′(x<sub>k</sub>)))·e<sub>k</sub>². The left side is x<sub>k+1</sub> − x*, so</p>\n <p><b>e<sub>k+1</sub> = [f″(ξ)/(2f′(x<sub>k</sub>))]·e<sub>k</sub>²</b>, that is |e<sub>k+1</sub>| ≤ C·e<sub>k</sub>².</p>\n <p>For minimisation we apply the same to f′ (we look for the root of f′ = 0). In the multidimensional case in the lecture: ‖x<sub>k+1</sub> − x*‖ ≤ (L/m)‖x<sub>k</sub> − x*‖², if the Hessian is Lipschitz (constant L), H(x*) ⪰ mI and the start is close enough: ‖x₀ − x*‖ ≤ m/(2L). The method converges quadratically <b>locally</b> ; globally without line search it may diverge.</p>"}, {"k": "formula", "h": "Newton versus gradient descent", "b": "<table class=\"tbl\"><tr><th></th><th>gradient descent</th><th>Newton</th></tr><tr><td>information</td><td>∇f</td><td>∇f and the Hessian H</td></tr><tr><td>rate</td><td>linear / sublinear</td><td>quadratic near the solution</td></tr><tr><td>cost of a step</td><td>cheap, O(n)</td><td>expensive: computing and solving a system with H, about O(n³)</td></tr><tr><td>stability</td><td>globally convergent for a small t</td><td>needs a good start and H positive definite</td></tr></table>\n <p><b>Link with the Jacobian:</b> for a system of equations F(x) = 0 Newton: x<sub>k+1</sub> = x<sub>k</sub> − J⁻¹F(x<sub>k</sub>) (J is the Jacobian of F). Minimising f is solving ∇f = 0, and the Jacobian of ∇f is exactly the Hessian H. Gauss–Newton (topic 7) = Newton for least squares with the second-derivative term dropped.</p>"}, {"k": "quiz", "q": "In how many steps does Newton minimise f = x² + 3y²?", "o": ["1", "2", "infinitely many", "10"], "a": 0, "why": "For quadratic functions the model m(d) coincides with f, so the minimum is reached in one step."}, {"k": "quiz", "q": "What does quadratic convergence mean?", "o": ["the error ~ the square of the previous error", "the error falls like 1/k²", "the step squared", "the square of the Hessian is needed"], "a": 0, "why": "e_{k+1} ≤ C·e_k²: the number of correct digits doubles."}, {"k": "quiz", "q": "The main drawback of Newton's method?", "o": ["the cost of the Hessian and its positive definiteness", "it is slower than GD", "only the gradient is needed", "it does not converge for quadratic functions"], "a": 0, "why": "Computing and solving a system with H is expensive, plus positive definiteness is needed."}, {"k": "note", "h": "Notebook: Newton's method", "b": "<div class=\"nb\"><div class=\"hd\">The quadratic model</div><div class=\"ln\"><div class=\"fm\">m(d) = f(x<sub>k</sub>) + ∇f(x<sub>k</sub>)ᵀd + ½ dᵀ H d</div><div class=\"nt\">2nd-order Taylor, H is the Hessian</div></div><div class=\"hd\">The minimum of the model</div><div class=\"ln\"><div class=\"fm\">∇m(d) = ∇f(x<sub>k</sub>) + H d = 0</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">d = − H⁻¹ ∇f(x<sub>k</sub>)</span></div><div class=\"nt\">the Newton direction</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">x<sub>k+1</sub> = x<sub>k</sub> − H⁻¹ ∇f(x<sub>k</sub>)</span></div></div><div class=\"ln\"><div class=\"fm\">1D:   x<sub>k+1</sub> = x<sub>k</sub> − <span class=\"fr\"><span>f′(x<sub>k</sub>)</span><span>f″(x<sub>k</sub>)</span></span></div></div><div class=\"hd\">The descent direction</div><div class=\"ln\"><div class=\"fm\">∇fᵀd = − ∇fᵀ H⁻¹ ∇f &lt; 0</div><div class=\"nt\">if H is positive definite</div></div><div class=\"hd\">Quadratic convergence (the root of f = 0)</div><div class=\"ln\"><div class=\"fm\">e<sub>k+1</sub> = <span class=\"fr\"><span>f″(ξ)</span><span>2f′(x<sub>k</sub>)</span></span>·e<sub>k</sub>²</div><div class=\"nt\">from Taylor with the remainder term</div></div><div class=\"ln\"><div class=\"fm\">‖x<sub>k+1</sub> − x*‖ ≤ <span class=\"fr\"><span>L</span><span>m</span></span> ‖x<sub>k</sub> − x*‖²</div><div class=\"nt\">the theorem of the lecture</div></div><div class=\"ln\"><div class=\"fm\">the condition on the start:  ‖x₀ − x*‖ ≤ m/(2L)</div></div></div>"}, {"k": "note", "h": "Notebook: model answers to the questions", "b": "<div class=\"nb\"><div class=\"hd\">Q: Derive the Newton direction</div><div class=\"ln\"><div class=\"fm\">f(x + d) ≈ f(x) + ∇fᵀd + ½ dᵀH d</div><div class=\"nt\">Taylor expansion up to the 2nd order</div></div><div class=\"ln\"><div class=\"fm\">derivative with respect to d: ∇f + H d = 0</div><div class=\"nt\">the minimum of the quadratic model</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">d = −H⁻¹∇f,   x<sub>k+1</sub> = x<sub>k</sub> − H⁻¹∇f</span></div><div class=\"nt\">the Newton direction</div></div><div class=\"hd\">Q: Local convergence theorem</div><div class=\"ln\"><div class=\"fm\">f is twice differentiable, H is Lipschitz, H(x*) ≻ 0, the start is close to x*</div><div class=\"nt\">conditions</div></div><div class=\"ln\"><div class=\"fm\">‖x<sub>k+1</sub> − x*‖ ≤ C‖x<sub>k</sub> − x*‖²</div><div class=\"nt\">quadratic convergence; for a quadratic f one step</div></div><div class=\"hd\">Q: What if the Hessian is not positive definite</div><div class=\"ln\"><div class=\"fm\">the Newton direction may not be a descent direction</div><div class=\"nt\">H⁻¹ may not exist</div></div><div class=\"ln\"><div class=\"fm\">remedy: H + μI (Levenberg–Marquardt), modified Cholesky decomposition, trust region, line search, or a gradient descent step</div></div></div>"}, {"k": "exam", "h": "Answer \"Newton method\"", "b": "<ol class=\"big\"><li>The idea: a quadratic model of the function (Taylor up to the 2nd order).</li><li>Derivation: ∇m = 0 ⇒ d = −H⁻¹∇f, x<sub>k+1</sub> = x<sub>k</sub> + αd (α = 1).</li><li>Conditions: H is positive definite (otherwise d is not a descent direction).</li><li>Rate: locally quadratic (the theorem with L and m), globally line search is needed (Wolfe).</li><li>Pros/cons relative to GD; a 1D example.</li></ol>"}, {"k": "exam", "h": "Model answer (this is how you can write in the exam)", "b": "<p><b>Newton method.</b> A second-order method. At the point x<sub>k</sub> t
