<script>
/* тема: auto | light | dark, хранится в study-theme (синхронизируется с Telegram) */
(function(){
  var R=document.documentElement, m='auto';
  try{m=localStorage.getItem('study-theme')||'auto'}catch(e){}
  function sys(){var w=window.Telegram&&Telegram.WebApp; if(w&&w.initData&&w.colorScheme) return w.colorScheme; return (window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light'}
  function apply(){
    var r=m==='auto'?sys():m; R.setAttribute('data-theme',r); R.style.colorScheme=r;
    var b=document.querySelector('.themebtn'); if(b){b.textContent=m==='auto'?'◐':(m==='dark'?'☾':'☀'); b.title={auto:'Тема: авто',light:'Тема: светлая',dark:'Тема: тёмная'}[m]; b.setAttribute('aria-label',b.title)}
    try{var w=window.Telegram&&Telegram.WebApp; if(w&&w.initData){w.setHeaderColor&&w.setHeaderColor(r==='dark'?'#121315':'#FBFBFA'); w.setBackgroundColor&&w.setBackgroundColor(r==='dark'?'#121315':'#FBFBFA')}}catch(e){}
  }
  window.__theme={get:function(){return m},apply:apply,cycle:function(){m=m==='auto'?'light':(m==='light'?'dark':'auto'); try{localStorage.setItem('study-theme',m)}catch(e){} apply()}};
  apply();
  function mount(){
    apply();
    if(document.querySelector('.themebtn')) return;
    var anchor=document.querySelector('[data-langsw]'); if(!anchor) return;
    var b=document.createElement('button'); b.type='button'; b.className='themebtn'; b.onclick=function(){window.__theme.cycle()};
    anchor.parentNode.insertBefore(b,anchor); apply();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',mount); else mount();
  window.addEventListener('load',apply);
  try{matchMedia('(prefers-color-scheme:dark)').addEventListener('change',apply)}catch(e){}
  /* если Telegram подтянул более новый study-theme из облака, страница перезагрузится синхронизацией */
})();
</script>

<script>
/* JulYera study sync: Telegram CloudStorage <-> localStorage, вход только через бота */
(function(){
  var BOT_URL='https://t.me/dsstudyhub_bot';                 // ссылка на бота, например https://t.me/ИМЯ_БОТА
  var PFX=/^(imsds-|mmmds-|aacm-|study-)/, CH=3500, tg=window.Telegram&&Telegram.WebApp;
  var inTg=!!(tg&&tg.initData);
  var dev=false; try{ if(/[?&]dev=1/.test(location.search)) sessionStorage.setItem('dev','1'); dev=sessionStorage.getItem('dev')==='1'; }catch(e){}
  var origSet=Storage.prototype.setItem;
  function gate(){
    if(inTg||dev) return;
    var s=document.createElement('style');
    s.textContent='#gate{position:fixed;inset:0;z-index:99999;background:#FBFBFA;color:#17181C;display:grid;place-items:center;padding:24px;text-align:center;font:16px/1.5 Onest,system-ui,sans-serif}#gate b{display:block;font:600 22px Unbounded,sans-serif;margin-bottom:10px}#gate p{max-width:34ch;margin:0 auto 18px;color:#5D5F69}#gate a{display:inline-block;background:#557546;color:#fff;text-decoration:none;padding:12px 22px;border-radius:999px;font-weight:600}';
    document.head.appendChild(s);
    function mk(){ var d=document.createElement('div'); d.id='gate'; d.innerHTML='<div><b>JulYera study hub</b><p>Обучалки открываются только через Telegram-бота: так прогресс привязан к твоему аккаунту.</p>'+(BOT_URL?'<a href="'+BOT_URL+'">Открыть бота</a>':'')+'</div>'; document.body.appendChild(d); document.body.style.overflow='hidden'; }
    if(document.body) mk(); else document.addEventListener('DOMContentLoaded',mk);
  }
  /* gate() отключён: сайт открывается и без бота, прогресс хранится в браузере, в Telegram синхронизируется */
  if(!inTg) return;
  try{ tg.ready(); tg.expand(); }catch(e){}
  var cs=tg.CloudStorage, timers={};
  function lsKeys(){ var o=[]; for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(PFX.test(k)) o.push(k); } return o; }
  function push(k){
    var v=localStorage.getItem(k); if(v==null) return;
    var ts=+localStorage.getItem('__ts_'+k)||Date.now(), n=Math.max(1,Math.ceil(v.length/CH));
    for(var i=0;i<n;i++) cs.setItem(k+'_'+i, v.slice(i*CH,(i+1)*CH));
    cs.setItem(k+'_m', JSON.stringify({n:n,ts:ts}));
  }
  Storage.prototype.setItem=function(k,v){
    origSet.call(this,k,v);
    if(this===localStorage && PFX.test(k) && k.indexOf('__ts_')!==0){
      origSet.call(this,'__ts_'+k,String(Date.now()));
      clearTimeout(timers[k]); timers[k]=setTimeout(function(){push(k)},1500);
    }
  };
  document.addEventListener('visibilitychange',function(){ if(document.hidden) lsKeys().forEach(push); });
  cs.getKeys(function(err,keys){
    if(err||!keys) return;
    var metas=keys.filter(function(x){return /_m$/.test(x)}), left=metas.length, changed=false, seen={};
    function finish(){
      lsKeys().forEach(function(k){ if(!seen[k]) push(k); });
      var done=false; try{ done=sessionStorage.getItem('synced')==='1'; }catch(e){}
      if(changed && !done){ try{sessionStorage.setItem('synced','1');}catch(e){} location.reload(); }
    }
    if(!left) return finish();
    metas.forEach(function(mk){
      var k=mk.slice(0,-2); seen[k]=1;
      cs.getItem(mk,function(e,mv){
        var m={}; try{m=JSON.parse(mv)}catch(x){}
        var lts=+localStorage.getItem('__ts_'+k)||0;
        if(m.ts>lts && m.n){
          var names=[]; for(var i=0;i<m.n;i++) names.push(k+'_'+i);
          cs.getItems(names,function(e2,vals){
            if(!e2&&vals){ var s=''; names.forEach(function(nm){ s+=vals[nm]||''; });
              if(s && s!==localStorage.getItem(k)){ origSet.call(localStorage,k,s); changed=true; }
              origSet.call(localStorage,'__ts_'+k,String(m.ts)); }
            if(--left===0) finish();
          });
        } else { if(lts>m.ts) push(k); if(--left===0) finish(); }
      });
    });
  });
})();
</script>

<script>
const ANS = {
reg:`<p><b>Linear regression.</b> Линейная регрессия моделирует зависимость y от x прямой y = αx + β + r, где α — наклон (slope), β — свободный член (intercept), r — остаток (ошибка).</p>
<p><b>Остаток</b> r<sub>i</sub> = y<sub>i</sub> − αx<sub>i</sub> − β. Параметры выбираются так, чтобы минимизировать сумму квадратов остатков E(α,β) = Σr<sub>i</sub>².</p>
<p><b>Вывод.</b> ∂E/∂β = 0 даёт β = ȳ − αx̄. ∂E/∂α = 0 после подстановки β даёт α = Σ(x<sub>i</sub>−x̄)(y<sub>i</sub>−ȳ) / Σ(x<sub>i</sub>−x̄)² = cov(x,y)/var(x). Гессиан положительно определён (определитель 4N·S<sub>xx</sub> &gt; 0), значит это единственный минимум.</p>
<p><b>Пример.</b> x = 1..5, y = 2,4,5,4,5: α = 6/10 = 0.6, β = 4 − 0.6·3 = 2.2, SSR = 2.4.</p>
<p><b>Alpha / Beta (в обозначениях лекции):</b> α = slope = cov(x,y)/var(x), β = intercept = mean(y) − α·mean(x). Прямая проходит через (x̄, ȳ).</p>`,
err:`<p><b>Sum of Squared Residuals (SSR/SSE).</b> SSR = Σ<sub>i=1..N</sub> r<sub>i</sub>² = Σ(y<sub>i</sub> − f(x<sub>i</sub>,α))² — функция E(α), которую минимизирует метод наименьших квадратов. Возведение в квадрат убирает знаки, штрафует большие ошибки сильнее и делает функцию гладкой и выпуклой (для линейной модели).</p>
<p><b>MSE</b> = SSR/N — средний квадрат ошибки (RMSE = √MSE в единицах y). Для тестовых данных это основной критерий качества прогноза.</p>
<p><b>R²</b> = 1 − SSR/SST, где SST = Σ(y<sub>i</sub>−ȳ)². Вывод: SST = SSR + Σ(ŷ<sub>i</sub>−ȳ)², потому что остатки ортогональны ŷ − ȳ.</p>
<p><b>Пример:</b> остатки −0.8; 0.6; 1.0; −0.6; −0.2 → SSR = 2.4, MSE = 0.48, SST = 6, R² = 0.6.</p>`,
ols:`<p><b>OLS (Ordinary Least Squares)</b> — метод наименьших квадратов: из всех параметров выбирается вектор a, минимизирующий E(a) = ‖y − Xa‖².</p>
<p><b>Вывод.</b> E = yᵀy − 2aᵀXᵀy + aᵀXᵀXa. Градиент: ∇E = −2Xᵀy + 2XᵀXa = 0 ⇒ нормальные уравнения <b>XᵀXa = Xᵀy</b> ⇒ <b>a = (XᵀX)⁻¹Xᵀy</b> (при rank X = p). Гессиан 2XᵀX положительно определён ⇒ единственный глобальный минимум.</p>
<p><b>Геометрия:</b> Xᵀ(y − Xa) = 0, остатки ортогональны столбцам X, ŷ = Xa — проекция y на пространство столбцов. В простой регрессии это даёт α = cov(x,y)/var(x), β = ȳ − αx̄.</p>
<p><b>Пример:</b> XᵀX = [[55,15],[15,5]], Xᵀy = [66,20] ⇒ α = 0.6, β = 2.2.</p>`,
poly:`<p><b>Polynomial regression.</b> Модель y = α<sub>0</sub> + α<sub>1</sub>x + … + α<sub>p</sub>x<sup>p</sup> + r нелинейна по x, но <b>линейна по параметрам α</b>, поэтому это частный случай множественной линейной регрессии.</p>
<p><b>Как считать:</b> 1) выбрать степень p; 2) построить матрицу Вандермонда X (X<sub>ij</sub> = x<sub>i</sub><sup>j</sup>, j = 0..p); 3) составить нормальные уравнения XᵀXα = Xᵀy; 4) решить α = (XᵀX)⁻¹Xᵀy; 5) вычислить SSR; 6) выбрать степень по cross-validation (на обучающих данных SSR падает с ростом p, при p = N−1 кривая проходит через все точки, но переобучена).</p>
<p><b>Пример:</b> точки (−1,2), (0,1), (1,2), (2,5), p = 2 ⇒ XᵀX = [[4,2,6],[2,6,8],[6,8,18]], Xᵀy = [10,10,24] ⇒ α = (1,0,1), y = x² + 1.</p>`,
res:`<p><b>Resampling</b> — повторное разбиение данных на обучающую и тестовую части для оценки способности модели предсказывать новые данные (ошибка на обучающих данных занижена и приводит к переобучению).</p>
<p><b>Методы (лекция):</b> holdout (одно разбиение); leave-p-out (все C(N,p) разбиений, слишком дорого); leave-one-out (N моделей); k-fold (данные на k частей, каждая по разу тест, k моделей; k = N совпадает с LOO). Оценка = среднее ошибок на тестовых частях.</p>
<p><b>Применение:</b> выбор степени полинома, числа признаков, гиперпараметров — берут вариант с минимальной CV-ошибкой.</p>
<p><b>Bootstrap</b> (общая теория): выборка с возвращением, каждая точка попадает с вероятностью 1 − (1 − 1/N)<sup>N</sup> → 1 − e<sup>−1</sup> ≈ 0.632.</p>`,
sel:`<p><b>Forward / backward selection</b> — жадные методы выбора признаков в регрессии, когда перебор всех 2<sup>p</sup> подмножеств невозможен.</p>
<p><b>Forward:</b> старт с пустой модели; на каждом шаге добавляем признак, дающий наибольшее улучшение критерия; останавливаемся, когда улучшения нет. <b>Backward:</b> старт со всех признаков; на каждом шаге удаляем наименее полезный; останавливаемся, когда удаление ухудшает критерий. <b>Stepwise</b> — комбинация.</p>
<p><b>Критерии:</b> adjusted R², AIC = N ln(SSR/N) + 2k, BIC = N ln(SSR/N) + k ln N, CV-ошибка, F-тест. Нельзя использовать обычные SSR/R² (они улучшаются при добавлении любого признака).</p>
<p><b>Минусы:</b> жадность (не гарантирует лучший набор), backward требует N &gt; p, мультиколлинеарность. (Тема не из слайдов, это общая теория.)</p>`,
jac:`<p><b>Jacobian.</b> Матрица первых частных производных. Для F: ℝⁿ → ℝᵐ: J<sub>ij</sub> = ∂F<sub>i</sub>/∂x<sub>j</sub> (m×n). В подгонке модели y = f(x,α): J<sub>ij</sub> = ∂f(x<sub>i</sub>,α)/∂α<sub>j</sub> (N×p). Даёт линейное приближение F(x+d) ≈ F(x) + J d.</p>
<p><b>Нелинейный МНК (Gauss–Newton).</b> Нормальные уравнения нелинейны по α, замкнутого решения нет ⇒ итерации α<sup>k+1</sup> = α<sup>k</sup> + Δα. Линеаризуем f по Тейлору: f(x<sub>i</sub>,α) ≈ f(x<sub>i</sub>,α<sup>k</sup>) + Σ J<sub>ij</sub>Δα<sub>j</sub>. Тогда r ≈ Δy − JΔα, Δy<sub>i</sub> = y<sub>i</sub> − f(x<sub>i</sub>,α<sup>k</sup>). Минимизация ‖Δy − JΔα‖² даёт <b>JᵀJ Δα = JᵀΔy</b>. J пересчитывается на каждой итерации (можно численно конечными разностями).</p>
<p><b>Проблемы:</b> нужен хороший начальный α⁰, возможны локальные минимумы и расходимость.</p>`,
gd:`<p><b>Gradient descent</b> — итерационный метод минимизации дифференцируемой f: <b>x<sub>k+1</sub> = x<sub>k</sub> − t·∇f(x<sub>k</sub>)</b>, t &gt; 0 — длина шага.</p>
<p><b>Вывод:</b> f(x+d) ≈ f(x) + ∇fᵀd; по неравенству Коши–Буняковского ∇fᵀd ≥ −‖∇f‖‖d‖ с равенством при d = −∇f/‖∇f‖, значит антиградиент — направление наискорейшего убывания.</p>
<p><b>Сходимость:</b> для квадратичной f ошибка умножается на (I − tA), сходимость при 0 &lt; t &lt; 2/λ<sub>max</sub>; скорость линейная с множителем (κ−1)/(κ+1), κ = λ<sub>max</sub>/λ<sub>min</sub>. Для L-гладкой выпуклой f при t = 1/L: f(x<sub>k</sub>) − f* ≤ L‖x<sub>0</sub>−x*‖²/(2k) (сублинейно).</p>
<p><b>Улучшения:</b> line search (Wolfe), heavy ball, conjugate gradient, метод Ньютона.</p>`,
newton:`<p><b>Newton method.</b> Метод второго порядка. В точке x<sub>k</sub> функцию заменяют квадратичной моделью m(d) = f + ∇fᵀd + ½dᵀHd. При H ≻ 0 минимум модели: ∇m = ∇f + Hd = 0 ⇒ <b>d = −H⁻¹∇f</b> (ньютоновское направление), x<sub>k+1</sub> = x<sub>k</sub> + αd, «естественный» шаг α = 1. Это направление убывания: ∇fᵀd = −∇fᵀH⁻¹∇f &lt; 0.</p>
<p><b>Сходимость:</b> если Гессиан липшицев (L), H(x*) ⪰ mI и ‖x₀−x*‖ ≤ m/(2L), то ‖x<sub>k+1</sub>−x*‖ ≤ (L/m)‖x<sub>k</sub>−x*‖² — квадратичная (локальная); глобально нужен line search с условиями Вольфе.</p>
<p><b>Плюсы/минусы:</b> быстро вблизи решения (для квадратичных функций за 1 шаг), но нужен Гессиан (дорого, O(n³)), требуется H ≻ 0.</p>
<p><b>1D:</b> x<sub>k+1</sub> = x<sub>k</sub> − f′/f″; пример √2: 1 → 1.5 → 1.4167 → 1.41422.</p>`,
pca:`<p><b>PCA</b> — линейное снижение размерности: новые ортогональные оси (главные компоненты), упорядоченные по убыванию объяснённой дисперсии.</p>
<p><b>Алгоритм:</b> центрировать (и при необходимости стандартизировать) данные; C = XᵀX/(N−1); найти собственные пары Cv = λv; упорядочить λ<sub>1</sub> ≥ λ<sub>2</sub> ≥ …; scores T = XV; оставить первые k компонент (по доле Σλ<sub>i</sub>/Σλ или scree plot).</p>
<p><b>Вывод:</b> дисперсия проекции на единичный w равна wᵀCw. Максимизируем при wᵀw = 1 (Лагранж): Cw = λw, значение дисперсии = λ ⇒ PC1 — собственный вектор с наибольшим λ; следующие ортогональны. Σλ = tr(C) — полная дисперсия. Эквивалентно SVD: X = UΣVᵀ, λ = σ²/(N−1).</p>
<p><b>Пример:</b> точки (1,2),(2,3),(3,5),(4,6): λ = 4.978 и 0.022, PC1 объясняет 99.5%.</p>`,
clu:`<p><b>Cluster analysis</b> — разбиение объектов на группы (кластеры) без заранее заданных меток так, чтобы внутри кластера объекты похожи, между кластерами различны. Основа — мера сходства/расстояние (евклидово, манхэттенское, косинусное…).</p>
<p><b>Методы:</b> <b>k-means</b> (число k задано; назначение к ближайшему центру, пересчёт центров как среднего; минимизирует Σ‖x−c<sub>j</sub>‖², сходится к локальному минимуму; варианты k-medians, k-medoids); <b>AHC</b> (иерархия слияний, linkage single/complete/average/Ward, дендрограмма); <b>DBSCAN</b> (ε, minPts; плотностные кластеры любой формы + шум); <b>fuzzy c-means</b> (степени принадлежности).</p>
<p><b>Качество:</b> silhouette s = (b−a)/max(a,b), elbow по SSE.</p>
<p><b>Пример:</b> точки 1,2,4,9,10,12, k = 2: центры 2.33 и 10.33, SSE = 9.33.</p>`,
surv:`<p><b>Survival analysis</b> — анализ времени до события T (смерть, поломка, отток) с учётом <b>цензурирования</b> (событие к концу наблюдения не произошло, известно лишь T &gt; t). (Не из присланных слайдов, стандартная теория.)</p>
<p><b>Функции:</b> S(t) = P(T &gt; t) (выживание, S(0)=1, не возрастает); F = 1 − S; f = −S′; hazard h(t) = f/S; H(t) = ∫h; S = e<sup>−H</sup> (вывод: h = −(ln S)′).</p>
<p><b>Каплан–Майер:</b> Ŝ(t) = Π<sub>t<sub>i</sub>≤t</sub>(1 − d<sub>i</sub>/n<sub>i</sub>).</p>
<p><b>Какие линии:</b> ступенчатая невозрастающая кривая KM (скачки вниз в моменты событий, тики для цензурированных), доверительные границы (Гринвуд), медиана на уровне S = 0.5, кривые кумулятивного риска (Nelson–Aalen) и функции риска; несколько кривых для групп, сравнение log-rank тестом; модель Кокса h(t|x) = h₀(t)e<sup>βx</sup>.</p>`
};

const TOPICS = [{"id": "reg", "title": "1. Линейная регрессия: α и β", "goal": "Прямая по точкам: что такое остаток, α, β, и как их вывести.", "cards": [{"k": "story", "h": "Что мы вообще делаем", "b": "<p>Есть облако точек (x<sub>i</sub>, y<sub>i</sub>): например, x — часы учёбы, y — оценка. Мы хотим <b>одну прямую</b>, которая проходит как можно ближе ко всем точкам, чтобы по новому x предсказывать y.</p>\n <p>Прямая в лекции профессора записана как <b>y = αx + β</b>. Запомни именно так: <b>α — наклон (slope)</b>, <b>β — сдвиг (intercept, значение при x = 0)</b>. (В других учебниках часто наоборот, β<sub>1</sub> — наклон. На экзамене пиши как на лекции и сразу подпиши, что есть что.)</p>\n <p><b>Остаток (residual)</b> точки: r<sub>i</sub> = y<sub>i</sub> − (αx<sub>i</sub> + β), то есть настоящий y минус предсказание. Это <b>вертикальное</b> расстояние до прямой, а не перпендикуляр (на лекции это отдельно подчёркнуто).</p>"}, {"k": "num", "h": "Числа: 5 точек", "b": "<p>x = 1, 2, 3, 4, 5; y = 2, 4, 5, 4, 5. Средние: x̄ = 3, ȳ = 4.</p>\n <table class=\"tbl\"><tr><th>x</th><th>y</th><th>x−x̄</th><th>y−ȳ</th><th>(x−x̄)(y−ȳ)</th><th>(x−x̄)²</th></tr>\n <tr><td>1</td><td>2</td><td>−2</td><td>−2</td><td>4</td><td>4</td></tr><tr><td>2</td><td>4</td><td>−1</td><td>0</td><td>0</td><td>1</td></tr><tr><td>3</td><td>5</td><td>0</td><td>1</td><td>0</td><td>0</td></tr><tr><td>4</td><td>4</td><td>1</td><td>0</td><td>0</td><td>1</td></tr><tr><td>5</td><td>5</td><td>2</td><td>1</td><td>2</td><td>4</td></tr><tr><th colspan=\"4\">сумма</th><th>6</th><th>10</th></tr></table>\n <p><b>α = 6/10 = 0.6</b> (на каждый лишний час +0.6 балла). <b>β = ȳ − αx̄ = 4 − 0.6·3 = 2.2</b>. Прямая: y = 0.6x + 2.2. Прогнозы 2.8; 3.4; 4.0; 4.6; 5.2, остатки −0.8; 0.6; 1.0; −0.6; −0.2 (их сумма равна 0, это не случайность, см. вывод).</p>"}, {"k": "formula", "h": "Формулы по буквам", "b": "<table class=\"sym\"><tr><td>α = S<sub>xy</sub> / S<sub>xx</sub></td><td>наклон = (сумма произведений отклонений) / (сумма квадратов отклонений x)</td></tr>\n <tr><td>S<sub>xy</sub> = Σ(x<sub>i</sub>−x̄)(y<sub>i</sub>−ȳ)</td><td>«как x и y отклоняются вместе»; делённая на N−1 это ковариация cov(x,y)</td></tr>\n <tr><td>S<sub>xx</sub> = Σ(x<sub>i</sub>−x̄)²</td><td>делённая на N−1 это дисперсия var(x)</td></tr>\n <tr><td>β = ȳ − αx̄</td><td>прямая всегда проходит через точку средних (x̄, ȳ)</td></tr>\n <tr><td>r = S<sub>xy</sub>/√(S<sub>xx</sub>S<sub>yy</sub>)</td><td>коэффициент корреляции, от −1 до 1; α = r·s<sub>y</sub>/s<sub>x</sub></td></tr></table>\n <p>В примере r = 6/√(10·6) = 0.775. В коде лекции: <code>alpha = cov(x,y)/cov(x,x); beta = mean(y) − alpha*mean(x)</code>.</p>"}, {"k": "proof", "h": "Вывод формул α и β (метод наименьших квадратов)", "b": "<p><b>Цель:</b> минимизировать сумму квадратов остатков E(α,β) = Σ(y<sub>i</sub> − αx<sub>i</sub> − β)². Квадрат нужен, чтобы плюсы и минусы не гасили друг друга и чтобы функция была гладкой.</p>\n <ol class=\"big\">\n <li><b>Производная по β</b> равна нулю: ∂E/∂β = −2Σ(y<sub>i</sub> − αx<sub>i</sub> − β) = 0. Раскрываем: Σy<sub>i</sub> = αΣx<sub>i</sub> + Nβ. Делим на N: <b>ȳ = αx̄ + β</b>, откуда β = ȳ − αx̄. (Заодно: сумма остатков равна 0.)</li>\n <li><b>Производная по α</b>: ∂E/∂α = −2Σ(y<sub>i</sub> − αx<sub>i</sub> − β)x<sub>i</sub> = 0.</li>\n <li>Подставляем β = ȳ − αx̄: Σ[(y<sub>i</sub>−ȳ) − α(x<sub>i</sub>−x̄)]·x<sub>i</sub> = 0.</li>\n <li>Трюк: Σ(y<sub>i</sub>−ȳ)x<sub>i</sub> = Σ(y<sub>i</sub>−ȳ)(x<sub>i</sub>−x̄) (потому что Σ(y<sub>i</sub>−ȳ)·x̄ = 0), и так же Σ(x<sub>i</sub>−x̄)x<sub>i</sub> = Σ(x<sub>i</sub>−x̄)². Получаем S<sub>xy</sub> − αS<sub>xx</sub> = 0, то есть <b>α = S<sub>xy</sub>/S<sub>xx</sub></b>.</li>\n <li><b>Это именно минимум:</b> матрица вторых производных [[2Σx<sub>i</sub>², 2Σx<sub>i</sub>],[2Σx<sub>i</sub>, 2N]] имеет определитель 4(NΣx<sub>i</sub>² − (Σx<sub>i</sub>)²) = 4N·S<sub>xx</sub> &gt; 0, если не все x одинаковы, и 2N &gt; 0. Значит положительно определена: решение единственно и является минимумом.</li></ol>\n <p>Два уравнения из шагов 1–2 называют <b>нормальными уравнениями</b>.</p>"}, {"k": "note", "h": "Тетрадь 1: что минимизируем", "b": "<div class=\"nb\"><div class=\"hd\">Модель и остаток</div><div class=\"ln\"><div class=\"fm\">ŷ<sub>i</sub> = <i>α</i>·<i>x</i><sub>i</sub> + <i>β</i></div><div class=\"nt\">предсказание прямой для точки i</div></div><div class=\"ln\"><div class=\"fm\">r<sub>i</sub> = <i>y</i><sub>i</sub> − <i>α</i><i>x</i><sub>i</sub> − <i>β</i></div><div class=\"nt\">остаток = настоящий y минус предсказание (вертикальное расстояние)</div></div><div class=\"hd\">Критерий МНК</div><div class=\"ln\"><div class=\"fm\">E(<i>α</i>,<i>β</i>) = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> r<sub>i</sub>² = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>y</i><sub>i</sub> − <i>α</i><i>x</i><sub>i</sub> − <i>β</i>)²</div><div class=\"nt\">сумма квадратов остатков (SSR). Квадрат убирает знаки</div></div><div class=\"ln\"><div class=\"fm\">min E(<i>α</i>,<i>β</i>)</div><div class=\"nt\">ищем α и β, при которых E наименьшая</div></div><div class=\"hd\">Два факта о среднем</div><div class=\"ln\"><div class=\"fm\"><span class=\"ov\"><i>x</i></span> = <span class=\"fr\"><span>1</span><span><i>N</i></span></span>·<span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub>  ⇒  <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub> = <i>N</i>·<span class=\"ov\"><i>x</i></span></div><div class=\"nt\">сумма = N · среднее</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"ov\"><i>y</i></span> = <span class=\"fr\"><span>1</span><span><i>N</i></span></span>·<span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>y</i><sub>i</sub>  ⇒  <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>y</i><sub>i</sub> = <i>N</i>·<span class=\"ov\"><i>y</i></span></div><div class=\"nt\">то же для y</div></div></div>"}, {"k": "note", "h": "Тетрадь 2: производные → нормальные уравнения", "b": "<div class=\"nb\"><div class=\"hd\">Правило: производная квадрата</div><div class=\"ln\"><div class=\"fm\">(u²)′ = 2u·u′</div><div class=\"nt\">u = y<sub>i</sub> − αx<sub>i</sub> − β</div></div><div class=\"ln\"><div class=\"fm\">∂u/∂<i>β</i> = −1,   ∂u/∂<i>α</i> = −<i>x</i><sub>i</sub></div><div class=\"nt\">β входит с минусом, α умножена на x<sub>i</sub></div></div><div class=\"hd\">Шаг 1: производная по <i>β</i></div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>∂E</span><span>∂<i>β</i></span></span> = −2 <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>y</i><sub>i</sub> − <i>α</i><i>x</i><sub>i</sub> − <i>β</i>) = 0</div><div class=\"nt\">=0, потому что минимум</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>y</i><sub>i</sub> − <i>α</i><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub> − <i>N</i><i>β</i> = 0</div><div class=\"nt\">Σβ = Nβ, делим на −2</div></div><div class=\"hd\">Шаг 2: производная по <i>α</i></div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>∂E</span><span>∂<i>α</i></span></span> = −2 <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>y</i><sub>i</sub> − <i>α</i><i>x</i><sub>i</sub> − <i>β</i>)·<i>x</i><sub>i</sub> = 0</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub><i>y</i><sub>i</sub> − <i>α</i><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub>² − <i>β</i><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub> = 0</div></div><div class=\"hd\">Нормальные уравнения (линейная система, неоднородная)</div><div class=\"ln\"><div class=\"fm\"><i>α</i><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub> + <i>N</i><i>β</i> = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>y</i><sub>i</sub></div><div class=\"nt\">(1)</div></div><div class=\"ln\"><div class=\"fm\"><i>α</i><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub>² + <i>β</i><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub> = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub><i>y</i><sub>i</sub></div><div class=\"nt\">(2)  справа не нули, поэтому «неоднородная»</div></div></div>"}, {"k": "note", "h": "Тетрадь 3: откуда средние и β", "b": "<div class=\"nb\"><div class=\"hd\">Берём уравнение (1)</div><div class=\"ln\"><div class=\"fm\"><i>α</i><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub> + <i>N</i><i>β</i> = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>y</i><sub>i</sub></div></div><div class=\"ln\"><div class=\"fm\"><i>α</i>·<i>N</i><span class=\"ov\"><i>x</i></span> + <i>N</i><i>β</i> = <i>N</i><span class=\"ov\"><i>y</i></span></div><div class=\"nt\">заменили суммы на N · среднее</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span><i>α</i>·<i>N</i><span class=\"ov\"><i>x</i></span> + <i>N</i><i>β</i></span><span><i>N</i></span></span> = <span class=\"fr\"><span><i>N</i><span class=\"ov\"><i>y</i></span></span><span><i>N</i></span></span></div><div class=\"nt\">делим обе части на N</div></div><div class=\"ln\"><div class=\"fm\"><i>α</i><span class=\"ov\"><i>x</i></span> + <i>β</i> = <span class=\"ov\"><i>y</i></span></div><div class=\"nt\">N сократилось</div></div><div class=\"hd\">Результат</div><div class=\"ln\"><div class=\"fm\"><span class=\"box\"><i>β</i> = <span class=\"ov\"><i>y</i></span> − <i>α</i><span class=\"ov\"><i>x</i></span></span></div><div class=\"nt\">формула для β</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"ov\"><i>y</i></span> = <i>α</i><span class=\"ov\"><i>x</i></span> + <i>β</i></div><div class=\"nt\">то же самое: точка (x̄, ȳ) лежит на прямой</div></div></div>"}, {"k": "note", "h": "Тетрадь 4: подставляем β → получается α", "b": "<div class=\"nb\"><div class=\"hd\">Берём уравнение (2) и подставляем β = ȳ − αx̄</div><div class=\"ln\"><div class=\"fm\"><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub><i>y</i><sub>i</sub> − <i>α</i><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub>² − (<span class=\"ov\"><i>y</i></span> − <i>α</i><span class=\"ov\"><i>x</i></span>)·<i>N</i><span class=\"ov\"><i>x</i></span> = 0</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub><i>y</i><sub>i</sub> − <i>N</i><span class=\"ov\"><i>x</i></span><span class=\"ov\"><i>y</i></span> = <i>α</i> ( <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub>² − <i>N</i><span class=\"ov\"><i>x</i></span>² )</div><div class=\"nt\">раскрыли скобку, члены с α собрали справа</div></div><div class=\"hd\">Два тождества (раскрой скобки и используй Σx = N·x̄)</div><div class=\"ln\"><div class=\"fm\"><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>x</i><sub>i</sub>−<span class=\"ov\"><i>x</i></span>)(<i>y</i><sub>i</sub>−<span class=\"ov\"><i>y</i></span>) = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub><i>y</i><sub>i</sub> − <i>N</i><span class=\"ov\"><i>x</i></span><span class=\"ov\"><i>y</i></span></div><div class=\"nt\">числитель</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>x</i><sub>i</sub>−<span class=\"ov\"><i>x</i></span>)² = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> <i>x</i><sub>i</sub>² − <i>N</i><span class=\"ov\"><i>x</i></span>²</div><div class=\"nt\">знаменатель</div></div><div class=\"hd\">Результат</div><div class=\"ln\"><div class=\"fm\"><span class=\"box\"><i>α</i> = <span class=\"fr\"><span><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>x</i><sub>i</sub>−<span class=\"ov\"><i>x</i></span>)(<i>y</i><sub>i</sub>−<span class=\"ov\"><i>y</i></span>)</span><span><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>x</i><sub>i</sub>−<span class=\"ov\"><i>x</i></span>)²</span></span></span></div><div class=\"nt\">сумма произведений отклонений / сумма квадратов отклонений</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\"><i>α</i> = <span class=\"fr\"><span>cov(<i>x</i>,<i>y</i>)</span><span>var(<i>x</i>)</span></span></span></div><div class=\"nt\">N−1 сверху и снизу сокращается</div></div></div>"}, {"k": "note", "h": "Тетрадь 5: дисперсия, ковариация, корреляция", "b": "<div class=\"nb\"><div class=\"hd\">Дисперсия: разброс одной величины</div><div class=\"ln\"><div class=\"fm\">var(<i>x</i>) = <span class=\"fr\"><span><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>x</i><sub>i</sub> − <span class=\"ov\"><i>x</i></span>)²</span><span><i>N</i> − 1</span></span></div><div class=\"nt\">отклонение от среднего, в квадрате, усреднили</div></div><div class=\"ln\"><div class=\"fm\">s<sub>x</sub> = √var(<i>x</i>)</div><div class=\"nt\">стандартное отклонение, в единицах x</div></div><div class=\"hd\">Ковариация: как две величины меняются вместе</div><div class=\"ln\"><div class=\"fm\">cov(<i>x</i>,<i>y</i>) = <span class=\"fr\"><span><span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>x</i><sub>i</sub> − <span class=\"ov\"><i>x</i></span>)(<i>y</i><sub>i</sub> − <span class=\"ov\"><i>y</i></span>)</span><span><i>N</i> − 1</span></span></div><div class=\"nt\">(+)(+) и (−)(−) дают плюс, (+)(−) даёт минус</div></div><div class=\"ln\"><div class=\"fm\">cov(<i>x</i>,<i>x</i>) = var(<i>x</i>)</div><div class=\"nt\">дисперсия: ковариация величины с самой собой</div></div><div class=\"hd\">Корреляция: ковариация без единиц измерения</div><div class=\"ln\"><div class=\"fm\">r = <span class=\"fr\"><span>cov(<i>x</i>,<i>y</i>)</span><span>s<sub>x</sub>·s<sub>y</sub></span></span></div><div class=\"nt\">всегда от −1 до 1</div></div><div class=\"ln\"><div class=\"fm\"><i>α</i> = <span class=\"fr\"><span>cov(<i>x</i>,<i>y</i>)</span><span>var(<i>x</i>)</span></span> = r·<span class=\"fr\"><span>s<sub>y</sub></span><span>s<sub>x</sub></span></span></div><div class=\"nt\">связь корреляции с наклоном</div></div><div class=\"hd\">Проверка на числах</div><div class=\"ln\"><div class=\"fm\">x: 1,2,3,4,5;  y: 2,4,5,4,5;  <span class=\"ov\"><i>x</i></span>=3,  <span class=\"ov\"><i>y</i></span>=4</div></div><div class=\"ln\"><div class=\"fm\">var(<i>x</i>) = <span class=\"fr\"><span>10</span><span>4</span></span> = 2.5,   cov = <span class=\"fr\"><span>6</span><span>4</span></span> = 1.5,   <i>α</i> = <span class=\"fr\"><span>1.5</span><span>2.5</span></span> = 0.6,   <i>β</i> = 4 − 0.6·3 = 2.2</div></div><div class=\"ln\"><div class=\"fm\">r = <span class=\"fr\"><span>1.5</span><span>1.581·1.225</span></span> = 0.775</div></div></div>"}, {"k": "quiz", "q": "В записи профессора y = αx + β что такое β?", "o": ["наклон прямой", "значение y при x = 0 (свободный член)", "коэффициент корреляции", "остаток"], "a": 1, "why": "В лекции α это наклон, β это свободный член (intercept). Прямая проходит через (x̄, ȳ), поэтому β = ȳ − αx̄."}, {"k": "quiz", "q": "Почему сумма остатков в МНК с свободным членом равна нулю?", "o": ["так получилось в примере", "из условия ∂E/∂β = 0", "из условия ∂E/∂α = 0", "потому что r = 1"], "a": 1, "why": "∂E/∂β = −2Σr<sub>i</sub> = 0, то есть Σr<sub>i</sub> = 0."}, {"k": "quiz", "q": "x̄ = 3, ȳ = 4, α = 0.6. Чему равен β?", "o": ["2.2", "1.8", "0.6", "4"], "a": 0, "why": "β = ȳ − αx̄ = 4 − 0.6·3 = 2.2."}, {"k": "exam", "h": "Как отвечать «Linear regression / Alpha, Beta»", "b": "<ol class=\"big\"><li>Модель y = αx + β + r, α наклон, β свободный член, r ошибка.</li><li>Остаток r<sub>i</sub> = y<sub>i</sub> − αx<sub>i</sub> − β, вертикальное расстояние.</li><li>Критерий: min E(α,β) = Σr<sub>i</sub>².</li><li>Нормальные уравнения (производные = 0) и их решение: α = cov(x,y)/var(x), β = ȳ − αx̄.</li><li>Проверка на минимум (Гессиан положительно определён).</li><li>Мини-пример с числами и r.</li></ol>"}, {"k": "exam", "h": "Эталонный ответ (так можно писать на экзамене)", "b": "<p><b>Linear regression.</b> Линейная регрессия моделирует зависимость y от x прямой y = αx + β + r, где α — наклон (slope), β — свободный член (intercept), r — остаток (ошибка).</p>\n<p><b>Остаток</b> r<sub>i</sub> = y<sub>i</sub> − αx<sub>i</sub> − β. Параметры выбираются так, чтобы минимизировать сумму квадратов остатков E(α,β) = Σr<sub>i</sub>².</p>\n<p><b>Вывод.</b> ∂E/∂β = 0 даёт β = ȳ − αx̄. ∂E/∂α = 0 после подстановки β даёт α = Σ(x<sub>i</sub>−x̄)(y<sub>i</sub>−ȳ) / Σ(x<sub>i</sub>−x̄)² = cov(x,y)/var(x). Гессиан положительно определён (определитель 4N·S<sub>xx</sub> &gt; 0), значит это единственный минимум.</p>\n<p><b>Пример.</b> x = 1..5, y = 2,4,5,4,5: α = 6/10 = 0.6, β = 4 − 0.6·3 = 2.2, SSR = 2.4.</p>\n<p><b>Обозначения:</b> у Gorgone α = наклон, β = свободный член; в слайдах Davide и ISLR наоборот: β<sub>0</sub> = intercept, β<sub>1</sub> = slope. На экзамене сразу скажи, какое обозначение берёшь, и подпиши, что есть что.</p><p><b>Alpha / Beta (в обозначениях лекции Gorgone):</b> α = slope = cov(x,y)/var(x), β = intercept = mean(y) − α·mean(x). Прямая проходит через (x̄, ȳ).</p>"}]}, {"id": "err", "title": "2. SSR, MSE, R²", "goal": "Ошибки модели: сумма квадратов остатков, MSE, качество подгонки.", "cards": [{"k": "story", "h": "Осторожно: SSR у профессора", "b": "<p>В лекции <b>SSR = Sum of Squared Residuals</b> = сумма квадратов остатков = E(α) = Σ(y<sub>i</sub> − f(x<sub>i</sub>, α))². Её же называют SSE (Sum of Squared Errors, лекция употребляет оба названия).</p>\n <p>Во многих других учебниках SSR значит наоборот «сумма квадратов, объяснённая регрессией». Поэтому на экзамене <b>пиши формулой</b>: «SSR = Σr<sub>i</sub>²».</p>\n <p><b>MSE</b> (Mean Squared Error) — это та же сумма, но усреднённая: MSE = SSR / N. Это «средний квадрат ошибки», удобно сравнивать между наборами разного размера.</p>"}, {"k": "num", "h": "Числа из прошлой темы", "b": "<p>Остатки: −0.8; 0.6; 1.0; −0.6; −0.2.</p><p><b>SSR</b> = 0.64 + 0.36 + 1 + 0.36 + 0.04 = <b>2.4</b>. <b>MSE</b> = 2.4/5 = <b>0.48</b>. <b>RMSE</b> = √0.48 ≈ 0.693 (в тех же единицах, что y).</p>\n <p><b>Полная вариация</b> SST = Σ(y<sub>i</sub> − ȳ)² = 4+0+1+0+1 = 6. <b>R² = 1 − SSR/SST = 1 − 2.4/6 = 0.6</b>: модель объясняет 60% разброса y (и r² = 0.775² = 0.6, это совпадение не случайно в простой регрессии).</p>"}, {"k": "formula", "h": "Формулы по буквам", "b": "<table class=\"sym\"><tr><td>SSR = Σr<sub>i</sub>²</td><td>сумма квадратов остатков (то, что МНК минимизирует)</td></tr><tr><td>MSE = SSR/N</td><td>средний квадрат ошибки; иногда делят на N−p (p параметров), чтобы оценка была несмещённой</td></tr><tr><td>RMSE = √MSE</td><td>типичная ошибка в единицах y</td></tr><tr><td>SST = Σ(y<sub>i</sub>−ȳ)²</td><td>полный разброс y вокруг среднего (ошибка «модели-константы» ȳ)</td></tr><tr><td>R² = 1 − SSR/SST</td><td>доля объяснённого разброса: 1 идеально, 0 как среднее</td></tr><tr><td>R²<sub>adj</sub> = 1 − (1−R²)(N−1)/(N−p−1)</td><td>R² со штрафом за лишние переменные (p предикторов)</td></tr></table>"}, {"k": "proof", "h": "Вывод: SST = SSR + (объяснённая часть)", "b": "<p>Пусть ŷ<sub>i</sub> — прогноз, r<sub>i</sub> = y<sub>i</sub> − ŷ<sub>i</sub>. Тогда y<sub>i</sub> − ȳ = (y<sub>i</sub> − ŷ<sub>i</sub>) + (ŷ<sub>i</sub> − ȳ). Возводим в квадрат и суммируем:</p>\n <p>Σ(y<sub>i</sub>−ȳ)² = Σr<sub>i</sub>² + Σ(ŷ<sub>i</sub>−ȳ)² + 2Σr<sub>i</sub>(ŷ<sub>i</sub>−ȳ).</p>\n <p>Смешанный член равен нулю: ŷ<sub>i</sub> − ȳ = α(x<sub>i</sub> − x̄), а из нормальных уравнений Σr<sub>i</sub> = 0 и Σr<sub>i</sub>x<sub>i</sub> = 0 (остатки ортогональны столбцам 1 и x). Значит Σr<sub>i</sub>(ŷ<sub>i</sub>−ȳ) = αΣr<sub>i</sub>x<sub>i</sub> − αx̄Σr<sub>i</sub> = 0.</p>\n <p><b>Итог:</b> SST = SSR + SS<sub>объяснённая</sub>, поэтому R² = 1 − SSR/SST = SS<sub>объяснённая</sub>/SST ∈ [0,1].</p>\n <p><b>Почему SSR не годится для выбора модели:</b> при добавлении переменных SSR только падает (R² растёт) даже на мусоре, поэтому нужны adj R² или проверка на новых данных (тема 5).</p>"}, {"k": "quiz", "q": "SSR = 2.4, N = 5. Чему равен MSE?", "o": ["0.48", "12", "2.4", "1.55"], "a": 0, "why": "MSE = SSR/N = 2.4/5 = 0.48."}, {"k": "quiz", "q": "SST = 6, SSR = 2.4. Чему равен R²?", "o": ["0.4", "0.6", "2.5", "3.6"], "a": 1, "why": "R² = 1 − 2.4/6 = 0.6."}, {"k": "note", "h": "Тетрадь: SSR, MSE, R²", "b": "<div class=\"nb\"><div class=\"hd\">Определения</div><div class=\"ln\"><div class=\"fm\">SSR = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> r<sub>i</sub>² = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>y</i><sub>i</sub> − ŷ<sub>i</sub>)²</div><div class=\"nt\">сумма квадратов остатков</div></div><div class=\"ln\"><div class=\"fm\">MSE = <span class=\"fr\"><span>SSR</span><span><i>N</i></span></span></div><div class=\"nt\">средний квадрат ошибки</div></div><div class=\"ln\"><div class=\"fm\">RMSE = √MSE</div><div class=\"nt\">в единицах y</div></div><div class=\"ln\"><div class=\"fm\">SST = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (<i>y</i><sub>i</sub> − <span class=\"ov\"><i>y</i></span>)²</div><div class=\"nt\">полный разброс y вокруг среднего</div></div><div class=\"hd\">Разложение</div><div class=\"ln\"><div class=\"fm\">(<i>y</i><sub>i</sub>−<span class=\"ov\"><i>y</i></span>) = (<i>y</i><sub>i</sub>−ŷ<sub>i</sub>) + (ŷ<sub>i</sub>−<span class=\"ov\"><i>y</i></span>)</div><div class=\"nt\">прибавили и вычли ŷ</div></div><div class=\"ln\"><div class=\"fm\">SST = SSR + <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> (ŷ<sub>i</sub>−<span class=\"ov\"><i>y</i></span>)²</div><div class=\"nt\">смешанный член = 0, потому что Σr = 0 и Σrx = 0</div></div><div class=\"hd\">Коэффициент детерминации</div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">R² = 1 − <span class=\"fr\"><span>SSR</span><span>SST</span></span></span></div><div class=\"nt\">доля объяснённого разброса, от 0 до 1</div></div><div class=\"ln\"><div class=\"fm\">R²<sub>adj</sub> = 1 − (1−R²)<span class=\"fr\"><span>N−1</span><span>N−p−1</span></span></div><div class=\"nt\">штраф за число предикторов p</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>2.4</span><span>6</span></span>=0.4,   R² = 1 − 0.4 = 0.6,   MSE = <span class=\"fr\"><span>2.4</span><span>5</span></span> = 0.48</div><div class=\"nt\">числа из нашего примера</div></div></div>"}, {"k": "exam", "h": "Ответ «Sum of squared residuals / MSE»", "b": "<ol class=\"big\"><li>Остаток r<sub>i</sub> = y<sub>i</sub> − f(x<sub>i</sub>,α).</li><li>SSR = Σr<sub>i</sub>², это функция E(α), которую минимизирует МНК.</li><li>MSE = SSR/N (RMSE = √MSE).</li><li>Связь с R² и SST.</li><li>Оценка ошибки на тестовых данных (cross-validation) честнее, чем на обучающих.</li></ol>"}, {"k": "exam", "h": "Эталонный ответ (так можно писать на экзамене)", "b": "<p><b>Sum of Squared Residuals (SSR/SSE).</b> SSR = Σ<sub>i=1..N</sub> r<sub>i</sub>² = Σ(y<sub>i</sub> − f(x<sub>i</sub>,α))² — функция E(α), которую минимизирует метод наименьших квадратов. Возведение в квадрат убирает знаки, штрафует большие ошибки сильнее и делает функцию гладкой и выпуклой (для линейной модели).</p>\n<p><b>MSE</b> = SSR/N — средний квадрат ошибки (RMSE = √MSE в единицах y). Для тестовых данных это основной критерий качества прогноза.</p>\n<p><b>R²</b> = 1 − SSR/SST, где SST = Σ(y<sub>i</sub>−ȳ)². Вывод: SST = SSR + Σ(ŷ<sub>i</sub>−ȳ)², потому что остатки ортогональны ŷ − ȳ.</p>\n<p><b>Пример:</b> остатки −0.8; 0.6; 1.0; −0.6; −0.2 → SSR = 2.4, MSE = 0.48, SST = 6, R² = 0.6.</p>"}]}, {"id": "ols", "title": "3. OLS в матричной форме", "goal": "Нормальные уравнения XᵀXα = Xᵀy и их вывод. Множественная регрессия.", "cards": [{"k": "story", "h": "Те же точки как система уравнений", "b": "<p>Каждая точка даёт уравнение: αx<sub>i</sub> + β ≈ y<sub>i</sub>. Всего N уравнений на 2 неизвестных: система <b>переопределена</b>, точного решения нет. OLS (Ordinary Least Squares) находит решение, дающее наименьшую сумму квадратов остатков.</p>\n <p>Записываем все уравнения разом: <b>X a ≈ y</b>, где X — матрица N×p (в первой колонке x<sub>i</sub>, во второй единицы), a = (α, β)<sup>T</sup>, y — вектор наблюдений. Для множественной регрессии просто больше колонок (по колонке на переменную).</p>"}, {"k": "num", "h": "Тот же пример в матрицах", "b": "<p>Столбцы X: x и единицы; N = 5. Считаем:</p><pre class=\"code\">XᵀX = [ Σx²  Σx ]   = [ 55  15 ]      Xᵀy = [ Σxy ] = [ 66 ]\n      [ Σx    N ]     [ 15   5 ]            [ Σy  ]   [ 20 ]</pre>\n <p>Σxy = 2+8+15+16+25 = 66. Решаем 55α + 15β = 66 и 15α + 5β = 20. Из второго β = 4 − 3α. В первое: 55α + 60 − 45α = 66, значит <b>α = 0.6, β = 2.2</b>. Тот же ответ.</p>"}, {"k": "formula", "h": "Формулы по буквам", "b": "<table class=\"sym\"><tr><td>E(a) = ‖y − Xa‖²</td><td>сумма квадратов остатков в векторной записи</td></tr><tr><td>XᵀX a = Xᵀy</td><td>нормальные уравнения</td></tr><tr><td>a = (XᵀX)⁻¹Xᵀy</td><td>решение; существует, если колонки X линейно независимы (rank X = p)</td></tr><tr><td>ŷ = X a = H y, H = X(XᵀX)⁻¹Xᵀ</td><td>прогнозы; H проектирует y на пространство колонок X</td></tr></table>"}, {"k": "proof", "h": "Вывод нормальных уравнений", "b": "<ol class=\"big\">\n <li>E(a) = (y − Xa)ᵀ(y − Xa) = yᵀy − 2aᵀXᵀy + aᵀXᵀX a.</li>\n <li>Градиент (правила: ∇(aᵀb) = b, ∇(aᵀMa) = 2Ma для симметричной M): <b>∇E = −2Xᵀy + 2XᵀX a</b>.</li>\n <li>Приравниваем к нулю: <b>XᵀX a = Xᵀy</b>. Это и есть p «нормальных» уравнений.</li>\n <li><b>Минимум и единственность:</b> матрица Гессе ∇²E = 2XᵀX. Для любого вектора v: vᵀXᵀXv = ‖Xv‖² ≥ 0, а при независимых колонках Xv ≠ 0, значит XᵀX положительно определена. Тогда XᵀX обратима, и решение a = (XᵀX)⁻¹Xᵀy единственное и E выпукла, т.е. это глобальный минимум (лекция: «closed-form solution unique, if N ≥ p»).</li>\n <li><b>Геометрия:</b> нормальные уравнения означают Xᵀ(y − Xa) = 0, то есть <b>вектор остатков ортогонален каждому столбцу X</b>. ŷ это ортогональная проекция y на пространство колонок. Поэтому, если есть колонка единиц, Σr<sub>i</sub> = 0.</li></ol>"}, {"k": "quiz", "q": "Что значит XᵀX a = Xᵀy геометрически?", "o": ["остатки ортогональны столбцам X", "остатки равны нулю", "a ортогонален y", "X квадратная"], "a": 0, "why": "Xᵀ(y − Xa) = 0: вектор остатков перпендикулярен всем столбцам X."}, {"k": "quiz", "q": "Когда XᵀX необратима?", "o": ["когда столбцы X линейно зависимы (мультиколлинеарность)", "когда N большое", "когда y константа", "никогда"], "a": 0, "why": "Нужен rank X = p; иначе решение не единственно."}, {"k": "note", "h": "Тетрадь: OLS в матрицах", "b": "<div class=\"nb\"><div class=\"hd\">Модель и критерий</div><div class=\"ln\"><div class=\"fm\">y = X<b>a</b> + r</div><div class=\"nt\">X: N×p, a: вектор параметров</div></div><div class=\"ln\"><div class=\"fm\">E(a) = (y − Xa)ᵀ(y − Xa) = yᵀy − 2aᵀXᵀy + aᵀXᵀXa</div><div class=\"nt\">раскрыли скобки</div></div><div class=\"hd\">Производная</div><div class=\"ln\"><div class=\"fm\">∇E = −2Xᵀy + 2XᵀXa = 0</div><div class=\"nt\">правила: ∇(aᵀb)=b, ∇(aᵀMa)=2Ma</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">XᵀX a = Xᵀy</span></div><div class=\"nt\">нормальные уравнения</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">a = (XᵀX)⁻¹ Xᵀ y</span></div><div class=\"nt\">если rank X = p</div></div><div class=\"hd\">Почему это минимум</div><div class=\"ln\"><div class=\"fm\">∇²E = 2XᵀX</div><div class=\"nt\">гессиан</div></div><div class=\"ln\"><div class=\"fm\">vᵀXᵀXv = ‖Xv‖² ≥ 0</div><div class=\"nt\">положительно определён ⇒ единственный минимум</div></div><div class=\"ln\"><div class=\"fm\">Xᵀ(y − Xa) = 0</div><div class=\"nt\">остатки ⟂ столбцам X</div></div></div>"}, {"k": "exam", "h": "Ответ «OLS»", "b": "<ol class=\"big\"><li>Модель y = Xa + r, критерий min ‖y − Xa‖².</li><li>Градиент и нормальные уравнения XᵀXa = Xᵀy.</li><li>Решение a = (XᵀX)⁻¹Xᵀy и условие rank X = p.</li><li>Минимум: Гессиан 2XᵀX положительно определён.</li><li>Геометрический смысл (проекция) и мини-пример 2×2.</li></ol>"}, {"k": "exam", "h": "Эталонный ответ (так можно писать на экзамене)", "b": "<p><b>OLS (Ordinary Least Squares)</b> — метод наименьших квадратов: из всех параметров выбирается вектор a, минимизирующий E(a) = ‖y − Xa‖².</p>\n<p><b>Вывод.</b> E = yᵀy − 2aᵀXᵀy + aᵀXᵀXa. Градиент: ∇E = −2Xᵀy + 2XᵀXa = 0 ⇒ нормальные уравнения <b>XᵀXa = Xᵀy</b> ⇒ <b>a = (XᵀX)⁻¹Xᵀy</b> (при rank X = p). Гессиан 2XᵀX положительно определён ⇒ единственный глобальный минимум.</p>\n<p><b>Геометрия:</b> Xᵀ(y − Xa) = 0, остатки ортогональны столбцам X, ŷ = Xa — проекция y на пространство столбцов. В простой регрессии это даёт α = cov(x,y)/var(x), β = ȳ − αx̄.</p>\n<p><b>Пример:</b> XᵀX = [[55,15],[15,5]], Xᵀy = [66,20] ⇒ α = 0.6, β = 2.2.</p>"}]}, {"id": "poly", "title": "4. Полиномиальная регрессия", "goal": "Как считать: та же линейная регрессия, но с колонками 1, x, x², ...", "cards": [{"k": "story", "h": "Кривая, но «линейная по параметрам»", "b": "<p>Модель: y = α<sub>0</sub> + α<sub>1</sub>x + α<sub>2</sub>x² + … + α<sub>p</sub>x<sup>p</sup>. Кривая, но неизвестные α<sub>j</sub> входят <b>линейно</b>. Поэтому всё как в OLS: просто новые «признаки» x², x³ становятся новыми колонками матрицы. Лекция прямо подчёркивает: «polynomial regression is a special case of multiple linear regression».</p>"}, {"k": "num", "h": "Числа: параболу через 4 точки", "b": "<p>Точки: (−1, 2), (0, 1), (1, 2), (2, 5), степень p = 2. Колонки: 1, x, x².</p>\n <pre class=\"code\">X = [1 −1 1]      y = [2]\n    [1  0 0]          [1]\n    [1  1 1]          [2]\n    [1  2 4]          [5]\n\nXᵀX = [ 4  2  6 ]    Xᵀy = [10]\n      [ 2  6  8 ]          [10]\n      [ 6  8 18 ]          [24]</pre>\n <p>Решаем XᵀXα = Xᵀy: получаем <b>α = (1, 0, 1)</b>, то есть y = 1 + 0·x + 1·x² = x² + 1. Остатки нулевые (ровно эти точки лежат на параболе). Для сравнения: прямая даёт y = 2 + x и SSR = 4. Парабола подходит лучше.</p>"}, {"k": "formula", "h": "Матрица Вандермонда и шаги", "b": "<table class=\"sym\"><tr><td>X<sub>ij</sub> = x<sub>i</sub><sup>j</sup>, j = 0..p</td><td>матрица Вандермонда, размер N×(p+1)</td></tr><tr><td>α = (XᵀX)⁻¹Xᵀy</td><td>те же нормальные уравнения</td></tr><tr><td>p ≤ N − 1</td><td>при p = N−1 кривая проходит через все точки (интерполяция, SSR = 0)</td></tr></table>\n <p><b>Алгоритм на экзамене:</b> 1) выбрать степень p; 2) построить X со столбцами 1, x, …, x<sup>p</sup>; 3) составить XᵀX и Xᵀy; 4) решить систему; 5) посчитать SSR и сравнить степени через cross-validation.</p>"}, {"k": "proof", "h": "Почему формулы те же и почему нельзя брать p слишком большим", "b": "<p><b>Те же:</b> f(x,α) = Σα<sub>j</sub>x<sup>j</sup> линейна по α, поэтому ∂f/∂α<sub>j</sub> = x<sup>j</sup> не зависит от α, и условия ∂E/∂α<sub>j</sub> = −2Σ(y<sub>i</sub> − f(x<sub>i</sub>))x<sub>i</sub><sup>j</sup> = 0 дают ровно XᵀXα = Xᵀy (см. тему 3).</p>\n <p><b>Переобучение:</b> при N различных точках система с p = N−1 имеет единственное решение (определитель Вандермонда Π(x<sub>j</sub>−x<sub>i</sub>) ≠ 0), кривая проходит через все точки и SSR = 0, но между ними она бешено колеблется и плохо предсказывает новые данные. Как выбрать степень: по ошибке на <b>тестовых</b> данных (holdout, k-fold, тема 5) или по adjusted R², а не по SSR на обучающих.</p>"}, {"k": "quiz", "q": "Почему полиномиальную регрессию считают линейной?", "o": ["линейна по параметрам α", "линейна по x", "потому что p = 1", "потому что график прямой"], "a": 0, "why": "Параметры входят линейно, поэтому работают нормальные уравнения."}, {"k": "quiz", "q": "У вас N = 9 различных точек. При какой степени полином пройдёт через все точки?", "o": ["p = 2", "p = 4", "p = 8", "p = 9"], "a": 2, "why": "p = N − 1 = 8: девять коэффициентов на девять точек."}, {"k": "note", "h": "Тетрадь: полиномиальная регрессия", "b": "<div class=\"nb\"><div class=\"hd\">Модель</div><div class=\"ln\"><div class=\"fm\">y = α<sub>0</sub> + α<sub>1</sub>x + α<sub>2</sub>x² + … + α<sub>p</sub>x<sup>p</sup></div><div class=\"nt\">линейна по α, не по x</div></div><div class=\"hd\">Матрица Вандермонда</div><div class=\"ln\"><div class=\"fm\">X<sub>ij</sub> = x<sub>i</sub><sup>j</sup>,   j = 0,…,p</div><div class=\"nt\">строки = точки, столбцы = 1, x, x², …</div></div><div class=\"hd\">Решение</div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">XᵀX α = Xᵀy</span></div><div class=\"nt\">те же нормальные уравнения</div></div><div class=\"ln\"><div class=\"fm\">α = (XᵀX)⁻¹ Xᵀ y</div></div><div class=\"hd\">Степень</div><div class=\"ln\"><div class=\"fm\">p ≤ N − 1</div><div class=\"nt\">при p = N−1 SSR = 0 (интерполяция, переобучение)</div></div><div class=\"ln\"><div class=\"fm\">выбор p: минимум CV-ошибки</div><div class=\"nt\">не по SSR на обучающих данных</div></div><div class=\"ln\"><div class=\"fm\">(−1,2), (0,1), (1,2), (2,5), p=2  ⇒  α = (1, 0, 1),   y = x² + 1</div><div class=\"nt\">пример</div></div></div>"}, {"k": "exam", "h": "Ответ «How to calculate polynomial regression?»", "b": "<ol class=\"big\"><li>Модель и почему она линейна по параметрам.</li><li>Матрица Вандермонда X.</li><li>Нормальные уравнения и решение α = (XᵀX)⁻¹Xᵀy.</li><li>Мини-пример (как выше).</li><li>Выбор степени: переобучение, cross-validation.</li></ol>"}, {"k": "exam", "h": "Эталонный ответ (так можно писать на экзамене)", "b": "<p><b>Polynomial regression.</b> Модель y = α<sub>0</sub> + α<sub>1</sub>x + … + α<sub>p</sub>x<sup>p</sup> + r нелинейна по x, но <b>линейна по параметрам α</b>, поэтому это частный случай множественной линейной регрессии.</p>\n<p><b>Как считать:</b> 1) выбрать степень p; 2) построить матрицу Вандермонда X (X<sub>ij</sub> = x<sub>i</sub><sup>j</sup>, j = 0..p); 3) составить нормальные уравнения XᵀXα = Xᵀy; 4) решить α = (XᵀX)⁻¹Xᵀy; 5) вычислить SSR; 6) выбрать степень по cross-validation (на обучающих данных SSR падает с ростом p, при p = N−1 кривая проходит через все точки, но переобучена).</p>\n<p><b>Пример:</b> точки (−1,2), (0,1), (1,2), (2,5), p = 2 ⇒ XᵀX = [[4,2,6],[2,6,8],[6,8,18]], Xᵀy = [10,10,24] ⇒ α = (1,0,1), y = x² + 1.</p>"}]}, {"id": "res", "title": "5. Resampling: cross-validation и bootstrap", "goal": "Как честно проверить модель на новых данных.", "cards": [{"k": "story", "h": "Зачем", "b": "<p>Модель, подогнанная под данные, на этих же данных всегда выглядит хорошо (высокий R², малый SSR). Но нужна способность <b>предсказывать новые</b> данные. Поэтому часть данных прячем: учим на одной части (training set), проверяем на другой (testing set). Повторное разбиение и усреднение называют <b>resampling</b>.</p>\n <p>(Если в списке вопросов было «Resembling», скорее всего имелось в виду resampling, и это cross-validation из лекции.)</p>"}, {"k": "formula", "h": "Методы из лекции", "b": "<table class=\"sym\"><tr><td>Holdout</td><td>один раз делим на train/test (часто 10–33% в test). Быстро, но результат зависит от случайного разбиения.</td></tr>\n <tr><td>Leave-p-out (LpO)</td><td>в test по p точек, перебираем ВСЕ способы: C(N,p) моделей. При N = 100, p = 30 это ≈ 2.9·10²⁵, нереально.</td></tr>\n <tr><td>Leave-one-out (LOO)</td><td>p = 1, всего N моделей. Дорого при большом N.</td></tr>\n <tr><td>k-fold</td><td>делим на k равных частей, каждая по разу служит тестом. Всего k моделей; k = N даёт LOO; 2-fold: train d1/test d2 и наоборот.</td></tr></table>\n <p>Итоговая оценка = среднее по всем тестовым ошибкам: CV = (1/k)·Σ MSE<sub>j</sub>.</p>"}, {"k": "num", "h": "Числа", "b": "<p>N = 8 точек. <b>LOO:</b> 8 моделей; каждая учится на 7 точках, проверяется на 1. <b>4-fold:</b> 4 части по 2 точки, 4 модели (каждая учится на 6, тестируется на 2); так в среднем быстрее и стабильнее, чем один holdout.</p>\n <p>Пример выбора степени: для полиномов p = 1..5 считаем 4-fold CV-ошибку, например 3.2; 0.9; 0.8; 2.5; 9.1. Берём p = 3: минимум тестовой ошибки (дальше начинается переобучение: на обучении ошибка падала бы всё время, а на тесте растёт).</p>"}, {"k": "proof", "h": "Вывод: bootstrap берёт ≈ 63.2% разных точек (ISLR гл. 5)", "b": "<p><b>Bootstrap</b> (ISLR гл. 5, не из слайдов Gorgone): из N точек N раз берём точку <b>с возвращением</b>, получаем новую выборку того же размера, считаем статистику, повторяем много раз и смотрим на разброс (оценка погрешности).</p>\n <p>Вероятность, что конкретная точка НЕ попала в выборку: (1 − 1/N)<sup>N</sup> → e<sup>−1</sup> ≈ 0.368 при N → ∞ (так как (1 − 1/N)<sup>N</sup> → e<sup>−1</sup>). Значит попала с вероятностью ≈ 0.632: в среднем 63.2% разных точек, остальные ≈ 36.8% («out-of-bag») используются как тест.</p>"}, {"k": "quiz", "q": "Что делает k-fold cross-validation при k = N?", "o": ["превращается в leave-one-out", "превращается в holdout", "ничего", "считает C(N,2) моделей"], "a": 0, "why": "Лекция: for k = N, k-fold CV equals leave-one-out."}, {"k": "quiz", "q": "Почему LpO CV почти не используют?", "o": ["число разбиений C(N,p) огромное", "она неточная", "она не для регрессии", "она всегда дороже bootstrap в 2 раза"], "a": 0, "why": "Пример лекции: C(100,30) ≈ 2.9·10²⁵ повторов."}, {"k": "exam", "h": "Ответ «Resampling / Cross-validation»", "b": "<ol class=\"big\"><li>Проблема: переобучение, оценка на обучающих данных завышена.</li><li>Идея: train/test, повтор и усреднение.</li><li>Методы: holdout, LpO, LOO, k-fold (плюсы и минусы).</li><li>Применение: выбор степени полинома, числа признаков.</li><li>Bootstrap кратко: выборка с возвращением, 63.2%.</li></ol>"}, {"k": "exam", "h": "Эталонный ответ (так можно писать на экзамене)", "b": "<p><b>Resampling</b> — повторное разбиение данных на обучающую и тестовую части для оценки способности модели предсказывать новые данные (ошибка на обучающих данных занижена и приводит к переобучению).</p>\n<p><b>Методы (лекция):</b> holdout (одно разбиение); leave-p-out (все C(N,p) разбиений, слишком дорого); leave-one-out (N моделей); k-fold (данные на k частей, каждая по разу тест, k моделей; k = N совпадает с LOO). Оценка = среднее ошибок на тестовых частях.</p>\n<p><b>Применение:</b> выбор степени полинома, числа признаков, гиперпараметров — берут вариант с минимальной CV-ошибкой.</p>\n<p><b>Bootstrap</b> (общая теория): выборка с возвращением, каждая точка попадает с вероятностью 1 − (1 − 1/N)<sup>N</sup> → 1 − e<sup>−1</sup> ≈ 0.632.</p>"}]}, {"id": "sel", "title": "6. Forward / backward selection", "goal": "Как выбирать признаки в регрессии.", "ext": true, "cards": [{"k": "story", "h": "Тема вне слайдов лекций", "b": "<p class=\"warn\"><b>Источник:</b> в слайдах Gorgone этого нет, но в программе Davide это ISLR гл. 6, раздел 6.1 (best subset, forward и backward stepwise). Текст ниже написан по ISLR и общей теории, не по слайдам.</p>\n <p>Есть p возможных признаков. Перебрать все подмножества (2<sup>p</sup> моделей) нельзя при большом p, поэтому используют жадные пошаговые методы:</p>\n <ul class=\"big\"><li><b>Forward selection:</b> начинаем с пустой модели (только свободный член). На каждом шаге добавляем тот признак, который больше всего улучшает критерий. Останавливаемся, когда добавление больше не помогает.</li><li><b>Backward elimination:</b> начинаем со всех признаков, на каждом шаге убираем самый бесполезный. Останавливаемся, когда удаление ухудшает критерий.</li><li><b>Stepwise:</b> комбинация (можно и добавлять, и убирать).</li></ul>"}, {"k": "formula", "h": "Критерии: чем измеряем «лучше»", "b": "<table class=\"sym\"><tr><td>adj R²</td><td>1 − (1−R²)(N−1)/(N−p−1): растёт, только если признак помогает больше, чем штраф</td></tr><tr><td>AIC</td><td>N·ln(SSR/N) + 2k: штраф 2 за каждый параметр (k параметров), меньше лучше</td></tr><tr><td>BIC</td><td>N·ln(SSR/N) + k·ln N: штраф сильнее</td></tr><tr><td>C<sub>p</sub> (ISLR 6.1)</td><td>(RSS + 2dσ̂²)/N, d числа предикторов; меньше лучше</td></tr><tr><td>CV-ошибка</td><td>тестовая MSE из k-fold</td></tr><tr><td>F-тест / p-value</td><td>значим ли добавляемый признак</td></tr></table>\n <p>Нельзя выбирать по обычному SSR или R²: они всегда улучшаются при добавлении признаков (см. тему 2).</p>"}, {"k": "num", "h": "Пример на условных числах", "b": "<p>Признаки x<sub>1</sub>, x<sub>2</sub>, x<sub>3</sub>. Условные значения SSR (числа придуманы для показа логики): пустая модель 100; {x<sub>1</sub>} 40; {x<sub>2</sub>} 70; {x<sub>3</sub>} 90.</p>\n <p><b>Forward, шаг 1:</b> лучший одиночный x<sub>1</sub> (SSR 40), берём. <b>Шаг 2:</b> пробуем {x<sub>1</sub>,x<sub>2</sub>} = 38 и {x<sub>1</sub>,x<sub>3</sub>} = 39.5. Улучшение с 40 до 38 малое: по AIC/CV это может не окупить лишний параметр, тогда останавливаемся на {x<sub>1</sub>}.</p>\n <p><b>Backward:</b> стартуем с {x<sub>1</sub>,x<sub>2</sub>,x<sub>3</sub>}, убираем признак, чьё удаление меньше всего ухудшает критерий, и так далее.</p>\n <p>Число всех моделей для p = 3: 2³ = 8; для p = 20 уже больше миллиона, поэтому жадный поиск.</p>"}, {"k": "proof", "h": "Почему жадный поиск не гарантирует лучшую модель", "b": "<p>Forward добавляет признаки по одному и не пересматривает прошлые решения: два признака могут быть полезны только вместе (по отдельности каждый слабый), и forward их пропустит. Backward стартует с полной модели, поэтому такие пары находит, но требует N &gt; p и ломается при мультиколлинеарности (XᵀX необратима). Чтобы не обмануть себя, финальную модель проверяют на отдельных данных (cross-validation).</p>"}, {"k": "quiz", "q": "С чего начинается forward selection?", "o": ["с пустой модели", "со всех признаков", "со случайных признаков", "с самого значимого"], "a": 0, "why": "Forward: пустая модель, затем добавляем по одному. Backward наоборот."}, {"k": "quiz", "q": "Можно ли выбирать признаки по минимуму SSR на обучающих данных?", "o": ["нет, SSR падает при добавлении любых признаков", "да, это лучший критерий", "только в backward", "только если N мало"], "a": 0, "why": "Поэтому нужны adj R², AIC/BIC или CV-ошибка."}, {"k": "exam", "h": "Ответ «Forward / backward selection»", "b": "<ol class=\"big\"><li>Зачем: много признаков, 2<sup>p</sup> подмножеств слишком много.</li><li>Forward: пусто → добавляем лучший; Backward: полная → убираем худший.</li><li>Критерий остановки: adj R², AIC/BIC, CV, F-тест.</li><li>Минусы: жадность, мультиколлинеарность, переобучение при выборе.</li></ol>"}, {"k": "exam", "h": "Эталонный ответ (так можно писать на экзамене)", "b": "<p><b>Forward / backward selection</b> — жадные методы выбора признаков в регрессии, когда перебор всех 2<sup>p</sup> подмножеств невозможен.</p>\n<p><b>Forward:</b> старт с пустой модели; на каждом шаге добавляем признак, дающий наибольшее улучшение критерия; останавливаемся, когда улучшения нет. <b>Backward:</b> старт со всех признаков; на каждом шаге удаляем наименее полезный; останавливаемся, когда удаление ухудшает критерий. <b>Stepwise</b> — комбинация.</p>\n<p><b>Критерии:</b> adjusted R², AIC = N ln(SSR/N) + 2k, BIC = N ln(SSR/N) + k ln N, CV-ошибка, F-тест. Нельзя использовать обычные SSR/R² (они улучшаются при добавлении любого признака).</p>\n<p><b>Минусы:</b> жадность (не гарантирует лучший набор), backward требует N &gt; p, мультиколлинеарность. (Тема не из слайдов, это общая теория.)</p>"}]}, {"id": "jac", "title": "7. Якобиан и нелинейный МНК (Gauss–Newton)", "goal": "Что такое Якобиан и как подгонять модель, нелинейную по параметрам.", "cards": [{"k": "story", "h": "Когда линейные формулы не работают", "b": "<p>Модель y = f(x, α), где α входит нелинейно, например y = e<sup>αx</sup>. Нормальные уравнения нелинейны по α и закрытого решения обычно нет. Идея: <b>на каждом шаге заменять функцию её линейным приближением</b> (первым членом ряда Тейлора) и решать уже линейную задачу МНК. Повторять, пока не сойдётся.</p>\n <p><b>Якобиан</b> — это матрица всех первых частных производных. Для подгонки: J<sub>ij</sub> = ∂f(x<sub>i</sub>, α)/∂α<sub>j</sub> (N×p): строка на каждую точку, столбец на каждый параметр. Для вектор-функции F: ℝⁿ→ℝᵐ: J<sub>ij</sub> = ∂F<sub>i</sub>/∂x<sub>j</sub>.</p>"}, {"k": "num", "h": "Числа: Якобиан вектор-функции", "b": "<p>F(x,y) = (x²y, 5x + sin y). Тогда</p><pre class=\"code\">J = [ ∂F₁/∂x  ∂F₁/∂y ]  =  [ 2xy   x² ]\n    [ ∂F₂/∂x  ∂F₂/∂y ]     [  5   cos y ]\n\nв точке (1, 0):  J = [ 0  1 ]\n                     [ 5  1 ]</pre><p>Якобиан даёт «линейную копию» функции рядом с точкой: F(p+d) ≈ F(p) + J·d.</p>"}, {"k": "proof", "h": "Вывод шага Gauss–Newton (как на лекции)", "b": "<ol class=\"big\">\n <li>Остатки r<sub>i</sub> = y<sub>i</sub> − f(x<sub>i</sub>, α). Хотим минимизировать E(α) = Σr<sub>i</sub>².</li>\n <li>Пусть текущее приближение α<sup>k</sup>. Линеаризуем: f(x<sub>i</sub>, α) ≈ f(x<sub>i</sub>, α<sup>k</sup>) + Σ<sub>j</sub> J<sub>ij</sub> Δα<sub>j</sub>, где Δα = α − α<sup>k</sup>, J<sub>ij</sub> = ∂f(x<sub>i</sub>, α<sup>k</sup>)/∂α<sub>j</sub>.</li>\n <li>Обозначим Δy<sub>i</sub> = y<sub>i</sub> − f(x<sub>i</sub>, α<sup>k</sup>) (текущий остаток). Тогда r<sub>i</sub> ≈ Δy<sub>i</sub> − Σ<sub>j</sub> J<sub>ij</sub>Δα<sub>j</sub>, то есть r ≈ Δy − JΔα.</li>\n <li>Это <b>линейная</b> задача МНК: min ‖Δy − JΔα‖². По теме 3 (X→J, y→Δy) нормальные уравнения: <b>JᵀJ Δα = JᵀΔy</b>.</li>\n <li>Решаем Δα = (JᵀJ)⁻¹JᵀΔy и обновляем <b>α<sup>k+1</sup> = α<sup>k</sup> + Δα</b>. Пересчитываем J в новой точке (он меняется на каждой итерации) и повторяем до тех пор, пока сумма квадратов перестанет убывать.</li></ol>"}, {"k": "num", "h": "Числа: y = e^{αx}", "b": "<p>Данные: (0,1), (1,2), (2,7). Начало α⁰ = 0.5. Здесь f = e<sup>αx</sup>, ∂f/∂α = x·e<sup>αx</sup>.</p>\n <table class=\"tbl\"><tr><th>x</th><th>f(x,0.5)</th><th>J = x·f</th><th>Δy = y−f</th></tr><tr><td>0</td><td>1.000</td><td>0</td><td>0</td></tr><tr><td>1</td><td>1.649</td><td>1.649</td><td>0.351</td></tr><tr><td>2</td><td>2.718</td><td>5.437</td><td>4.282</td></tr></table>\n <p>JᵀJ = 1.649² + 5.437² = 32.27; JᵀΔy = 1.649·0.351 + 5.437·4.282 = 23.86. Δα = 23.86/32.27 = <b>0.739</b>, значит α¹ = 1.239 (перелёт). Следующие итерации: α² ≈ 1.028, α³ ≈ 0.969, α⁴ ≈ 0.965 (сходится к ≈ 0.97). SSR по шагам: 18.46 → 26.34 → 1.31 → 0.41. Видно: Gauss–Newton может на первом шаге ухудшить, поэтому важно разумное начальное значение.</p>"}, {"k": "formula", "h": "Что нужно помнить", "b": "<table class=\"sym\"><tr><td>JᵀJ Δα = JᵀΔy</td><td>нормальные уравнения шага; при линейной модели J = X и получается обычный OLS за один шаг</td></tr><tr><td>Начальное α⁰</td><td>от него зависит сходимость, иначе возможна расходимость</td></tr><tr><td>Локальные минимумы</td><td>в нелинейном МНК их может быть много (в линейном минимум единственный)</td></tr><tr><td>Остановка</td><td>когда SSR перестаёт убывать или шаг Δα мал</td></tr><tr><td>Якобиан численно</td><td>конечными разностями (J<sub>ij</sub> ≈ [f(α+hε<sub>j</sub>) − f(α)]/h), если аналитически сложно</td></tr></table>"}, {"k": "quiz", "q": "Чему равен размер Якобиана J в подгонке N точек и p параметров?", "o": ["N×p", "p×p", "N×N", "p×N"], "a": 0, "why": "Строка на каждую точку, столбец на каждый параметр."}, {"k": "quiz", "q": "В какую задачу превращается каждый шаг Gauss–Newton?", "o": ["в линейный МНК для поправки Δα", "в сортировку", "в поиск корня", "в нулевую подгонку"], "a": 0, "why": "min‖Δy − JΔα‖², отсюда JᵀJ Δα = JᵀΔy."}, {"k": "note", "h": "Тетрадь: Якобиан и Gauss–Newton", "b": "<div class=\"nb\"><div class=\"hd\">Якобиан</div><div class=\"ln\"><div class=\"fm\">J<sub>ij</sub> = <span class=\"fr\"><span>∂f(x<sub>i</sub>, α)</span><span>∂α<sub>j</sub></span></span></div><div class=\"nt\">строка = точка, столбец = параметр, размер N×p</div></div><div class=\"hd\">Линеаризация (Тейлор)</div><div class=\"ln\"><div class=\"fm\">f(x<sub>i</sub>,α) ≈ f(x<sub>i</sub>,α<sup>k</sup>) + Σ<sub>j</sub> J<sub>ij</sub> Δα<sub>j</sub></div><div class=\"nt\">Δα = α − αᵏ</div></div><div class=\"ln\"><div class=\"fm\">Δy<sub>i</sub> = y<sub>i</sub> − f(x<sub>i</sub>, α<sup>k</sup>)</div><div class=\"nt\">текущий остаток</div></div><div class=\"ln\"><div class=\"fm\">r ≈ Δy − J Δα</div><div class=\"nt\">остаток после линеаризации</div></div><div class=\"hd\">Линейный МНК для поправки</div><div class=\"ln\"><div class=\"fm\">min ‖Δy − JΔα‖²</div><div class=\"nt\">как OLS: X → J, y → Δy</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">JᵀJ Δα = Jᵀ Δy</span></div><div class=\"nt\">нормальные уравнения шага</div></div><div class=\"ln\"><div class=\"fm\">α<sup>k+1</sup> = α<sup>k</sup> + Δα</div><div class=\"nt\">новое приближение, J пересчитываем</div></div></div>"}, {"k": "exam", "h": "Ответ «Jacobian / nonlinear least squares»", "b": "<ol class=\"big\"><li>Определение Якобиана и его размер.</li><li>Почему нужен итеративный метод (нет closed form).</li><li>Линеаризация по Тейлору и вывод JᵀJΔα = JᵀΔy.</li><li>Алгоритм: начальное α, шаг, обновление, критерий остановки.</li><li>Проблемы: начальное значение, локальные минимумы, необходимость J.</li></ol>"}, {"k": "exam", "h": "Эталонный ответ (так можно писать на экзамене)", "b": "<p><b>Jacobian.</b> Матрица первых частных производных. Для F: ℝⁿ → ℝᵐ: J<sub>ij</sub> = ∂F<sub>i</sub>/∂x<sub>j</sub> (m×n). В подгонке модели y = f(x,α): J<sub>ij</sub> = ∂f(x<sub>i</sub>,α)/∂α<sub>j</sub> (N×p). Даёт линейное приближение F(x+d) ≈ F(x) + J d.</p>\n<p><b>Нелинейный МНК (Gauss–Newton).</b> Нормальные уравнения нелинейны по α, замкнутого решения нет ⇒ итерации α<sup>k+1</sup> = α<sup>k</sup> + Δα. Линеаризуем f по Тейлору: f(x<sub>i</sub>,α) ≈ f(x<sub>i</sub>,α<sup>k</sup>) + Σ J<sub>ij</sub>Δα<sub>j</sub>. Тогда r ≈ Δy − JΔα, Δy<sub>i</sub> = y<sub>i</sub> − f(x<sub>i</sub>,α<sup>k</sup>). Минимизация ‖Δy − JΔα‖² даёт <b>JᵀJ Δα = JᵀΔy</b>. J пересчитывается на каждой итерации (можно численно конечными разностями).</p>\n<p><b>Проблемы:</b> нужен хороший начальный α⁰, возможны локальные минимумы и расходимость.</p>"}]}, {"id": "gd", "title": "8. Градиентный спуск", "goal": "Откуда формула шага, когда сходится и с какой скоростью.", "cards": [{"k": "story", "h": "Спуск с холма в тумане", "b": "<p>Хотим найти минимум функции f(x). Стоим в точке, видим только наклон (градиент ∇f). Идём в сторону, где круче всего вниз, то есть <b>−∇f</b>, небольшим шагом t. Повторяем.</p>\n <p><b>x<sub>k+1</sub> = x<sub>k</sub> − t·∇f(x<sub>k</sub>)</b>, t — длина шага (step size / learning rate).</p>"}, {"k": "num", "h": "Числа: f(x,y) = x² + 3y²", "b": "<p>∇f = (2x, 6y). Берём t = 0.1, старт (1, 1).</p>\n <table class=\"tbl\"><tr><th>шаг</th><th>точка</th><th>градиент</th></tr><tr><td>0</td><td>(1, 1)</td><td>(2, 6)</td></tr><tr><td>1</td><td>(1−0.2, 1−0.6) = (0.8, 0.4)</td><td>(1.6, 2.4)</td></tr><tr><td>2</td><td>(0.8−0.16, 0.4−0.24) = (0.64, 0.16)</td><td></td></tr><tr><td>3</td><td>(0.512, 0.064)</td><td></td></tr></table>\n <p>x умножается на 0.8 = 1 − 0.1·2, y на 0.4 = 1 − 0.1·6 на каждом шаге. Идём к (0, 0). Если взять t = 0.4, то множитель для y равен 1 − 0.4·6 = −1.4, |−1.4| &gt; 1: расходится! Ограничение на t видно из чисел.</p>"}, {"k": "proof", "h": "Вывод 1: почему именно −∇f", "b": "<p>Разложение Тейлора: f(x + d) ≈ f(x) + ∇f(x)ᵀd. Среди всех направлений единичной длины ‖d‖ = 1 хотим наименьшее значение ∇fᵀd. По неравенству Коши–Буняковского ∇fᵀd ≥ −‖∇f‖‖d‖, и равенство достигается при <b>d = −∇f/‖∇f‖</b>. Значит антиградиент — направление самого быстрого убывания.</p>\n <p>Условие убывания: ∇fᵀd &lt; 0. Для d = −∇f это −‖∇f‖² &lt; 0, пока градиент не равен нулю.</p>"}, {"k": "proof", "h": "Вывод 2: условие сходимости и скорость для квадратичной f", "b": "<p>Возьмём f(x) = ½xᵀAx − bᵀx с симметричной положительно определённой A (собственные числа 0 &lt; λ<sub>min</sub> ≤ … ≤ λ<sub>max</sub>). Минимум x*: Ax* = b. Градиент ∇f = Ax − b = A(x − x*).</p>\n <ol class=\"big\"><li>Ошибка e<sub>k</sub> = x<sub>k</sub> − x*. Шаг: e<sub>k+1</sub> = e<sub>k</sub> − tAe<sub>k</sub> = <b>(I − tA)e<sub>k</sub></b>.</li>\n <li>В базисе собственных векторов A компонента ошибки умножается на (1 − tλ<sub>i</sub>) на каждом шаге.</li>\n <li><b>Сходимость</b> ⇔ |1 − tλ<sub>i</sub>| &lt; 1 для всех i ⇔ <b>0 &lt; t &lt; 2/λ<sub>max</sub></b>. (В примере λ<sub>max</sub> = 6, значит t &lt; 1/3: 0.1 подходит, 0.4 нет.)</li>\n <li><b>Лучший шаг:</b> минимизируем max|1 − tλ|: t* = 2/(λ<sub>min</sub> + λ<sub>max</sub>), скорость ‖e<sub>k+1</sub>‖ ≤ ((κ − 1)/(κ + 1))‖e<sub>k</sub>‖, где κ = λ<sub>max</sub>/λ<sub>min</sub> — число обусловленности. Чем более «вытянуты» линии уровня (κ большое), тем медленнее спуск (линейная скорость сходимости).</li></ol>"}, {"k": "proof", "h": "Вывод 3: общий случай, L-гладкость (лемма о спуске)", "b": "<p>Пусть ∇f липшицев с константой L: ‖∇f(x) − ∇f(y)‖ ≤ L‖x − y‖. Тогда f(y) ≤ f(x) + ∇f(x)ᵀ(y−x) + (L/2)‖y−x‖². Подставляем y = x − t∇f(x):</p>\n <p><b>f(x − t∇f) ≤ f(x) − t(1 − Lt/2)‖∇f(x)‖²</b>.</p>\n <p>При t ≤ 1/L получаем f(x<sub>k+1</sub>) ≤ f(x<sub>k</sub>) − (t/2)‖∇f(x<sub>k</sub>)‖²: функция убывает на каждом шаге. Для выпуклой f с t = 1/L суммирование даёт f(x<sub>k</sub>) − f* ≤ L‖x<sub>0</sub> − x*‖²/(2k), то есть сублинейная скорость O(1/k); для сильно выпуклой f скорость линейная (геометрическая). Именно «linear or sublinear rates», как сказано на лекции.</p>"}, {"k": "formula", "h": "Резюме и улучшения", "b": "<table class=\"sym\"><tr><td>x<sub>k+1</sub> = x<sub>k</sub> − t∇f(x<sub>k</sub>)</td><td>базовый метод</td></tr><tr><td>выбор t</td><td>фиксированный (t &lt; 2/L), либо line search (Armijo/Wolfe: подбирать t на каждом шаге)</td></tr><tr><td>Heavy ball</td><td>добавляет «инерцию»: x<sub>k+1</sub> = x<sub>k</sub> − t∇f + β(x<sub>k</sub> − x<sub>k−1</sub>), ускоряет на «оврагах»</td></tr><tr><td>Conjugate gradient</td><td>для квадратичных f: сопряжённые направления, не больше n шагов</td></tr><tr><td>Критерий остановки</td><td>‖∇f‖ мало или f почти не меняется</td></tr></table>"}, {"k": "quiz", "q": "Почему шаг делается по −∇f?", "o": ["это направление наискорейшего убывания", "так проще считать", "это направление к максимуму", "так требует Ньютон"], "a": 0, "why": "Из Тейлора и неравенства Коши–Буняковского."}, {"k": "quiz", "q": "f = x² + 3y², λ_max = 6. При каком t гарантированно сходится?", "o": ["t < 1/3", "t < 3", "t = 1", "любой t"], "a": 0, "why": "0 < t < 2/λ_max = 1/3."}, {"k": "note", "h": "Тетрадь: градиентный спуск", "b": "<div class=\"nb\"><div class=\"hd\">Шаг</div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">x<sub>k+1</sub> = x<sub>k</sub> − t·∇f(x<sub>k</sub>)</span></div><div class=\"nt\">t — длина шага</div></div><div class=\"hd\">Почему −∇f</div><div class=\"ln\"><div class=\"fm\">f(x+d) ≈ f(x) + ∇f(x)ᵀ d</div><div class=\"nt\">Тейлор 1-го порядка</div></div><div class=\"ln\"><div class=\"fm\">∇fᵀd ≥ −‖∇f‖·‖d‖</div><div class=\"nt\">Коши–Буняковский</div></div><div class=\"ln\"><div class=\"fm\">равенство при  d = − <span class=\"fr\"><span>∇f</span><span>‖∇f‖</span></span></div><div class=\"nt\">антиградиент — самое быстрое убывание</div></div><div class=\"hd\">Квадратичная f(x) = ½xᵀAx − bᵀx</div><div class=\"ln\"><div class=\"fm\">∇f = Ax − b = A(x − x*)</div></div><div class=\"ln\"><div class=\"fm\">e<sub>k+1</sub> = (I − tA) e<sub>k</sub></div><div class=\"nt\">e = x − x*</div></div><div class=\"ln\"><div class=\"fm\">сходится ⇔ |1 − tλ<sub>i</sub>| &lt; 1 ⇔ 0 &lt; t &lt; <span class=\"fr\"><span>2</span><span>λ<sub>max</sub></span></span></div></div><div class=\"ln\"><div class=\"fm\">лучший шаг  t* = <span class=\"fr\"><span>2</span><span>λ<sub>min</sub>+λ<sub>max</sub></span></span>,   скорость  <span class=\"fr\"><span>κ−1</span><span>κ+1</span></span>,   κ = <span class=\"fr\"><span>λ<sub>max</sub></span><span>λ<sub>min</sub></span></span></div></div><div class=\"hd\">Общий случай (L-гладкость)</div><div class=\"ln\"><div class=\"fm\">f(x − t∇f) ≤ f(x) − t(1 − Lt/2)‖∇f‖²</div><div class=\"nt\">при t ≤ 1/L функция убывает</div></div></div>"}, {"k": "exam", "h": "Ответ «Gradient descent»", "b": "<ol class=\"big\"><li>Цель: min f(x), итерация x<sub>k+1</sub> = x<sub>k</sub> − t∇f(x<sub>k</sub>).</li><li>Вывод: Тейлор + направление наискорейшего убывания.</li><li>Выбор шага: условие t &lt; 2/L, line search.</li><li>Скорость: линейная при сильной выпуклости (κ), O(1/k) иначе.</li><li>Минусы: медленно при плохой обусловленности; улучшения: heavy ball, CG, Newton.</li></ol>"}, {"k": "exam", "h": "Эталонный ответ (так можно писать на экзамене)", "b": "<p><b>Gradient descent</b> — итерационный метод минимизации дифференцируемой f: <b>x<sub>k+1</sub> = x<sub>k</sub> − t·∇f(x<sub>k</sub>)</b>, t &gt; 0 — длина шага.</p>\n<p><b>Вывод:</b> f(x+d) ≈ f(x) + ∇fᵀd; по неравенству Коши–Буняковского ∇fᵀd ≥ −‖∇f‖‖d‖ с равенством при d = −∇f/‖∇f‖, значит антиградиент — направление наискорейшего убывания.</p>\n<p><b>Сходимость:</b> для квадратичной f ошибка умножается на (I − tA), сходимость при 0 &lt; t &lt; 2/λ<sub>max</sub>; скорость линейная с множителем (κ−1)/(κ+1), κ = λ<sub>max</sub>/λ<sub>min</sub>. Для L-гладкой выпуклой f при t = 1/L: f(x<sub>k</sub>) − f* ≤ L‖x<sub>0</sub>−x*‖²/(2k) (сублинейно).</p>\n<p><b>Улучшения:</b> line search (Wolfe), heavy ball, conjugate gradient, метод Ньютона.</p>"}]}, {"id": "newton", "title": "9. Метод Ньютона", "goal": "Вывод, быстрая (квадратичная) сходимость и сравнение с градиентным спуском.", "cards": [{"k": "story", "h": "Спуск с учётом кривизны", "b": "<p>Градиентный спуск знает только наклон. Метод Ньютона знает ещё <b>кривизну</b> (вторые производные, матрица Гессе H<sub>f</sub>) и приближает функцию параболой, а минимум параболы находит сразу.</p>\n <p>В одном измерении: <b>x<sub>k+1</sub> = x<sub>k</sub> − f′(x<sub>k</sub>)/f″(x<sub>k</sub>)</b>. В многомерном: <b>x<sub>k+1</sub> = x<sub>k</sub> − [H<sub>f</sub>(x<sub>k</sub>)]⁻¹ ∇f(x<sub>k</sub>)</b>. Вектор d = −H⁻¹∇f называют ньютоновским направлением, «естественный» шаг равен 1.</p>"}, {"k": "num", "h": "Числа 1: квадратичная функция, один шаг", "b": "<p>f(x,y) = x² + 3y². ∇f = (2x, 6y), H = diag(2, 6), H⁻¹ = diag(1/2, 1/6). Старт (1, 1): ∇f = (2, 6), d = −H⁻¹∇f = −(1, 1). x₁ = (1,1) − (1,1) = <b>(0, 0)</b>. Попали в минимум за <b>один</b> шаг (градиентному спуску из прошлой темы нужно бесконечно много шагов). Для любой квадратичной функции Ньютон сходится за 1 шаг.</p>"}, {"k": "num", "h": "Числа 2: минимизируем f(x) = x − ln x (минимум в x = 1)", "b": "<p>f′ = 1 − 1/x, f″ = 1/x². Шаг: x − f′/f″ = x − (1 − 1/x)·x² = 2x − x². Старт 0.5:</p>\n <table class=\"tbl\"><tr><th>k</th><th>x<sub>k</sub></th><th>ошибка |x<sub>k</sub> − 1|</th></tr><tr><td>0</td><td>0.5</td><td>0.5</td></tr><tr><td>1</td><td>0.75</td><td>0.25</td></tr><tr><td>2</td><td>0.9375</td><td>0.0625</td></tr><tr><td>3</td><td>0.99609</td><td>0.0039</td></tr></table>\n <p>Ошибка каждый раз возводится в квадрат: 0.25 = 0.5², 0.0625 = 0.25², 0.0039 ≈ 0.0625². Это и есть <b>квадратичная сходимость</b>: число верных цифр удваивается.</p>\n <p>Корень √2 (ищем f(x) = x² − 2 = 0, шаг x − f/f′ = x − (x²−2)/(2x)): 1 → 1.5 → 1.41667 → 1.414216 (√2 = 1.414214).</p>"}, {"k": "proof", "h": "Вывод формулы Ньютона (как на лекции)", "b": "<ol class=\"big\"><li>Берём разложение Тейлора второго порядка вокруг x<sub>k</sub>: f(x<sub>k</sub> + d) ≈ f(x<sub>k</sub>) + ∇f(x<sub>k</sub>)ᵀd + ½dᵀH<sub>f</sub>(x<sub>k</sub>)d =: m(d).</li>\n <li>Если H положительно определена, m(d) — выпуклая парабола, минимум в точке, где её градиент равен нулю: ∇m(d) = ∇f(x<sub>k</sub>) + H d = 0.</li>\n <li>Отсюда <b>d = −H⁻¹∇f(x<sub>k</sub>)</b>, и следующая точка x<sub>k+1</sub> = x<sub>k</sub> + d.</li>\n <li><b>Это направление убывания:</b> ∇fᵀd = −∇fᵀH⁻¹∇f &lt; 0, так как H⁻¹ положительно определена.</li></ol>\n <p><b>Если H не положительно определена</b> (лекция): направление может не быть направлением убывания или H⁻¹ не существует, поэтому в такой области метод модифицируют (регуляризация H + μI, line search).</p>"}, {"k": "proof", "h": "Вывод: почему сходимость квадратичная (1D, корень f(x) = 0)", "b": "<p>Пусть x* — корень, f′(x*) ≠ 0, e<sub>k</sub> = x<sub>k</sub> − x*. Тейлор с остаточным членом: 0 = f(x*) = f(x<sub>k</sub>) + f′(x<sub>k</sub>)(x* − x<sub>k</sub>) + ½f″(ξ)(x* − x<sub>k</sub>)².</p>\n <p>Делим на f′(x<sub>k</sub>) и переносим: x<sub>k</sub> − f(x<sub>k</sub>)/f′(x<sub>k</sub>) − x* = (f″(ξ)/(2f′(x<sub>k</sub>)))·e<sub>k</sub>². Левая часть это x<sub>k+1</sub> − x*, поэтому</p>\n <p><b>e<sub>k+1</sub> = [f″(ξ)/(2f′(x<sub>k</sub>))]·e<sub>k</sub>²</b>, то есть |e<sub>k+1</sub>| ≤ C·e<sub>k</sub>².</p>\n <p>Для минимизации применяем то же к f′ (ищем корень f′ = 0). В многомерном случае на лекции: ‖x<sub>k+1</sub> − x*‖ ≤ (L/m)‖x<sub>k</sub> − x*‖², если Гессиан липшицев (константа L), H(x*) ⪰ mI и старт достаточно близок: ‖x₀ − x*‖ ≤ m/(2L). Метод <b>локально</b> квадратично сходится; глобально без line search может расходиться.</p>"}, {"k": "formula", "h": "Ньютон против градиентного спуска", "b": "<table class=\"tbl\"><tr><th></th><th>градиентный спуск</th><th>Ньютон</th></tr><tr><td>информация</td><td>∇f</td><td>∇f и Гессиан H</td></tr><tr><td>скорость</td><td>линейная / сублинейная</td><td>квадратичная вблизи решения</td></tr><tr><td>цена шага</td><td>дёшево, O(n)</td><td>дорого: считать и решать систему с H, около O(n³)</td></tr><tr><td>устойчивость</td><td>глобально сходится при малом t</td><td>нужен хороший старт и H положительно определён</td></tr></table>\n <p><b>Связь с Якобианом:</b> для системы уравнений F(x) = 0 Ньютон: x<sub>k+1</sub> = x<sub>k</sub> − J⁻¹F(x<sub>k</sub>) (J — Якобиан F). Минимизация f это решение ∇f = 0, а Якобиан от ∇f это и есть Гессиан H. Gauss–Newton (тема 7) = Ньютон для МНК с отброшенным членом со вторыми производными.</p>"}, {"k": "quiz", "q": "За сколько шагов Ньютон минимизирует f = x² + 3y²?", "o": ["1", "2", "бесконечно много", "10"], "a": 0, "why": "Для квадратичных функций модель m(d) совпадает с f, поэтому минимум за один шаг."}, {"k": "quiz", "q": "Что значит квадратичная сходимость?", "o": ["ошибка ~ квадрат предыдущей ошибки", "ошибка падает как 1/k²", "шаг в квадрате", "нужен квадрат Гессиана"], "a": 0, "why": "e_{k+1} ≤ C·e_k²: число верных цифр удваивается."}, {"k": "quiz", "q": "Главный минус метода Ньютона?", "o": ["цена Гессиана и его положительная определённость", "он медленнее GD", "нужен только градиент", "он не сходится у квадратичных функций"], "a": 0, "why": "Вычисление и решение системы с H дорого, плюс нужна положительная определённость."}, {"k": "note", "h": "Тетрадь: метод Ньютона", "b": "<div class=\"nb\"><div class=\"hd\">Квадратичная модель</div><div class=\"ln\"><div class=\"fm\">m(d) = f(x<sub>k</sub>) + ∇f(x<sub>k</sub>)ᵀd + ½ dᵀ H d</div><div class=\"nt\">Тейлор 2-го порядка, H — гессиан</div></div><div class=\"hd\">Минимум модели</div><div class=\"ln\"><div class=\"fm\">∇m(d) = ∇f(x<sub>k</sub>) + H d = 0</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">d = − H⁻¹ ∇f(x<sub>k</sub>)</span></div><div class=\"nt\">ньютоновское направление</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">x<sub>k+1</sub> = x<sub>k</sub> − H⁻¹ ∇f(x<sub>k</sub>)</span></div></div><div class=\"ln\"><div class=\"fm\">1D:   x<sub>k+1</sub> = x<sub>k</sub> − <span class=\"fr\"><span>f′(x<sub>k</sub>)</span><span>f″(x<sub>k</sub>)</span></span></div></div><div class=\"hd\">Направление убывания</div><div class=\"ln\"><div class=\"fm\">∇fᵀd = − ∇fᵀ H⁻¹ ∇f &lt; 0</div><div class=\"nt\">если H положительно определён</div></div><div class=\"hd\">Квадратичная сходимость (корень f = 0)</div><div class=\"ln\"><div class=\"fm\">e<sub>k+1</sub> = <span class=\"fr\"><span>f″(ξ)</span><span>2f′(x<sub>k</sub>)</span></span>·e<sub>k</sub>²</div><div class=\"nt\">из Тейлора с остаточным членом</div></div><div class=\"ln\"><div class=\"fm\">‖x<sub>k+1</sub> − x*‖ ≤ <span class=\"fr\"><span>L</span><span>m</span></span> ‖x<sub>k</sub> − x*‖²</div>
