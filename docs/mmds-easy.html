грессия"}, {"id": "ols", "title": "6. OLS в матричной форме", "goal": "Нормальные уравнения XᵀXα = Xᵀy и их вывод. Множественная регрессия.", "cards": [{"k": "story", "h": "Те же точки как система уравнений", "b": "<p>Каждая точка даёт уравнение: αx<sub>i</sub> + β ≈ y<sub>i</sub>. Всего N уравнений на 2 неизвестных: система <b>переопределена</b>, точного решения нет. OLS (Ordinary Least Squares) находит решение, дающее наименьшую сумму квадратов остатков.</p>\n <p>Записываем все уравнения разом: <b>X a ≈ y</b>, где X — матрица N×p (в первой колонке x<sub>i</sub>, во второй единицы), a = (α, β)<sup>T</sup>, y — вектор наблюдений. Для множественной регрессии просто больше колонок (по колонке на переменную).</p>"}, {"k": "num", "h": "Тот же пример в матрицах", "b": "<p>Столбцы X: x и единицы; N = 5. Считаем:</p><pre class=\"code\">XᵀX = [ Σx²  Σx ]   = [ 55  15 ]      Xᵀy = [ Σxy ] = [ 66 ]\n      [ Σx    N ]     [ 15   5 ]            [ Σy  ]   [ 20 ]</pre>\n <p>Σxy = 2+8+15+16+25 = 66. Решаем 55α + 15β = 66 и 15α + 5β = 20. Из второго β = 4 − 3α. В первое: 55α + 60 − 45α = 66, значит <b>α = 0.6, β = 2.2</b>. Тот же ответ.</p>"}, {"k": "formula", "h": "Формулы по буквам", "b": "<table class=\"sym\"><tr><td>E(a) = ‖y − Xa‖²</td><td>сумма квадратов остатков в векторной записи</td></tr><tr><td>XᵀX a = Xᵀy</td><td>нормальные уравнения</td></tr><tr><td>a = (XᵀX)⁻¹Xᵀy</td><td>решение; существует, если колонки X линейно независимы (rank X = p)</td></tr><tr><td>ŷ = X a = H y, H = X(XᵀX)⁻¹Xᵀ</td><td>прогнозы; H проектирует y на пространство колонок X</td></tr></table>"}, {"k": "proof", "h": "Вывод нормальных уравнений", "b": "<ol class=\"big\">\n <li>E(a) = (y − Xa)ᵀ(y − Xa) = yᵀy − 2aᵀXᵀy + aᵀXᵀX a.</li>\n <li>Градиент (правила: d(aᵀb)/da = b, d(aᵀMa)/da = 2Ma для симметричной M): <b>dE/da = −2Xᵀy + 2XᵀX a</b>.</li>\n <li>Приравниваем к нулю: <b>XᵀX a = Xᵀy</b>. Это и есть p «нормальных» уравнений.</li>\n <li><b>Минимум и единственность:</b> матрица Гессе d²E/da² = 2XᵀX. Для любого вектора v: vᵀXᵀXv = ‖Xv‖² ≥ 0, а при независимых колонках Xv ≠ 0, значит XᵀX положительно определена. Тогда XᵀX обратима, и решение a = (XᵀX)⁻¹Xᵀy единственное и E выпукла, т.е. это глобальный минимум (лекция: «closed-form solution unique, if N ≥ p»).</li>\n <li><b>Геометрия:</b> нормальные уравнения означают Xᵀ(y − Xa) = 0, то есть <b>вектор остатков ортогонален каждому столбцу X</b>. ŷ это ортогональная проекция y на пространство колонок. Поэтому, если есть колонка единиц, Σr<sub>i</sub> = 0.</li></ol>"}, {"k": "quiz", "q": "Что значит XᵀX a = Xᵀy геометрически?", "o": ["остатки ортогональны столбцам X", "остатки равны нулю", "a ортогонален y", "X квадратная"], "a": 0, "why": "Xᵀ(y − Xa) = 0: вектор остатков перпендикулярен всем столбцам X."}, {"k": "quiz", "q": "Когда XᵀX необратима?", "o": ["когда столбцы X линейно зависимы (мультиколлинеарность)", "когда N большое", "когда y константа", "никогда"], "a": 0, "why": "Нужен rank X = p; иначе решение не единственно."}, {"k": "note", "h": "Тетрадь: OLS в матрицах", "b": "<div class=\"nb\"><div class=\"hd\">Модель и критерий</div><div class=\"ln\"><div class=\"fm\">y = X<b>a</b> + r</div><div class=\"nt\">X: N×p, a: вектор параметров</div></div><div class=\"ln\"><div class=\"fm\">E(a) = (y − Xa)ᵀ(y − Xa) = yᵀy − 2aᵀXᵀy + aᵀXᵀXa</div><div class=\"nt\">раскрыли скобки</div></div><div class=\"hd\">Производная</div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>dE</span><span>da</span></span> = −2Xᵀy + 2XᵀXa = 0</div><div class=\"nt\">правила: d(aᵀb)/da = b, d(aᵀMa)/da = 2Ma</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">XᵀX a = Xᵀy</span></div><div class=\"nt\">нормальные уравнения</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">a = (XᵀX)⁻¹ Xᵀ y</span></div><div class=\"nt\">если rank X = p</div></div><div class=\"hd\">Почему это минимум</div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>d²E</span><span>da²</span></span> = 2XᵀX</div><div class=\"nt\">гессиан</div></div><div class=\"ln\"><div class=\"fm\">vᵀXᵀXv = ‖Xv‖² ≥ 0</div><div class=\"nt\">положительно определён ⇒ единственный минимум</div></div><div class=\"ln\"><div class=\"fm\">Xᵀ(y − Xa) = 0</div><div class=\"nt\">остатки ⟂ столбцам X</div></div></div>"}, {"k": "note", "h": "Тетрадь: эталонные ответы на вопросы", "b": "<div class=\"nb\"><div class=\"hd\">Q: OLS (ordinary least squares) in matrix form</div><div class=\"ln\"><div class=\"fm\">y = X a + r</div><div class=\"nt\">X — матрица N×(p+1), первая колонка из единиц</div></div><div class=\"ln\"><div class=\"fm\">E(a) = (y − Xa)ᵀ(y − Xa) → min</div><div class=\"nt\">SSR в матричном виде</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>dE</span><span>da</span></span> = −2Xᵀ(y − Xa) = 0</div><div class=\"nt\">производная по вектору a</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">XᵀX a = Xᵀy  ⇒  a = (XᵀX)⁻¹Xᵀy</span></div><div class=\"nt\">нормальные уравнения</div></div><div class=\"ln\"><div class=\"fm\">XᵀX необратима, если столбцы X линейно зависимы (мультиколлинеарность) или N &lt; p + 1</div><div class=\"nt\">тогда регуляризация или псевдообратная</div></div></div>"}, {"k": "exam", "h": "Ответ «OLS»", "b": "<ol class=\"big\"><li>Модель y = Xa + r, критерий min ‖y − Xa‖².</li><li>Градиент и нормальные уравнения XᵀXa = Xᵀy.</li><li>Решение a = (XᵀX)⁻¹Xᵀy и условие rank X = p.</li><li>Минимум: Гессиан 2XᵀX положительно определён.</li><li>Геометрический смысл (проекция) и мини-пример 2×2.</li></ol>"}, {"k": "exam", "h": "Эталонный ответ (так можно писать на экзамене)", "b": "<p><b>OLS (Ordinary Least Squares)</b> — метод наименьших квадратов: из всех параметров выбирается вектор a, минимизирующий E(a) = ‖y − Xa‖².</p>\n<p><b>Вывод.</b> E = yᵀy − 2aᵀXᵀy + aᵀXᵀXa. Градиент: dE/da = −2Xᵀy + 2XᵀXa = 0 ⇒ нормальные уравнения <b>XᵀXa = Xᵀy</b> ⇒ <b>a = (XᵀX)⁻¹Xᵀy</b> (при rank X = p). Гессиан 2XᵀX положительно определён ⇒ единственный глобальный минимум.</p>\n<p><b>Геометрия:</b> Xᵀ(y − Xa) = 0, остатки ортогональны столбцам X, ŷ = Xa — проекция y на пространство столбцов. В простой регрессии это даёт α = cov(x,y)/var(x), β = ȳ − αx̄.</p>\n<p><b>Пример:</b> XᵀX = [[55,15],[15,5]], Xᵀy = [66,20] ⇒ α = 0.6, β = 2.2.</p>"}], "part": "Часть 2 · Регрессия"}, {"id": "poly", "title": "7. Полиномиальная регрессия", "goal": "Как считать: та же линейная регрессия, но с колонками 1, x, x², ...", "cards": [{"k": "story", "h": "Кривая, но «линейная по параметрам»: почему", "b": "<div class=\"nb ex\"><div class=\"hd\">Модель</div><div class=\"ln\"><div class=\"fm\">y = <i>α</i><sub>0</sub> + <i>α</i><sub>1</sub>·x + <i>α</i><sub>2</sub>·x² + … + <i>α</i><sub>p</sub>·x<sup>p</sup></div><div class=\"nt\">это кривая (парабола и т. д.) по x</div></div><p>Вопрос: почему это всё равно «линейная регрессия»? Потому что слово «линейная» относится к <b>параметрам α</b>, а не к x. Проверим это, взяв производную модели по каждому α.</p><div class=\"hd\">Шаг 1: производные по параметрам</div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>dy</span><span>d<i>α</i><sub>0</sub></span></span> = 1</div><div class=\"nt\">α₀ стоит сама по себе</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>dy</span><span>d<i>α</i><sub>1</sub></span></span> = x</div><div class=\"nt\">α₁ умножена на x</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>dy</span><span>d<i>α</i><sub>2</sub></span></span> = x²</div><div class=\"nt\">α₂ умножена на x²</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>dy</span><span>d<i>α</i><sub>j</sub></span></span> = x<sup>j</sup></div><div class=\"nt\">в общем виде</div></div><p><b>Вывод:</b> в ответах нет ни одной α. Значит, производная по α<sub>j</sub> не зависит от самих параметров. Это и есть определение «линейна по параметрам». Причина: x берётся из таблицы данных, то есть x<sup>j</sup> это просто известное число, а каждая α только умножается на такое число и складывается с остальными.</p><div class=\"hd\">Шаг 2: замена переменных</div><div class=\"ln\"><div class=\"fm\">z<sub>1</sub> = x,  z<sub>2</sub> = x²,  …,  z<sub>p</sub> = x<sup>p</sup></div><div class=\"nt\">новые столбцы, считаются заранее из x</div></div><div class=\"ln\"><div class=\"fm\">y = <i>α</i><sub>0</sub> + <i>α</i><sub>1</sub>z<sub>1</sub> + <i>α</i><sub>2</sub>z<sub>2</sub> + … + <i>α</i><sub>p</sub>z<sub>p</sub></div><div class=\"nt\">обычная множественная линейная регрессия</div></div><p>Поэтому все формулы OLS те же самые: <b>α = (XᵀX)⁻¹Xᵀy</b>. Условия минимума dE/dα<sub>j</sub> = 0 дают линейную систему на α, она решается за один шаг, без итераций. И это <b>одна</b> регрессия на нескольких признаках (x, x², x³), а не набор отдельных регрессий.</p><div class=\"hd\">Контрпример: когда модель НЕ линейна по параметрам</div><div class=\"ln\"><div class=\"fm\">y = <i>α</i><sub>0</sub> + x<sup><i>α</i><sub>1</sub></sup></div></div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>dy</span><span>d<i>α</i><sub>1</sub></span></span> = x<sup><i>α</i><sub>1</sub></sup>·ln x</div><div class=\"nt\">в ответе осталась α₁: зависит от параметра</div></div><p>Здесь α₁ стоит в показателе степени, уравнения dE/dα = 0 уже нелинейны и формулой не решаются: нужны итерации (Ньютон, Гаусс–Ньютон). Это нелинейная регрессия.</p><div class=\"hd\">Числа: три точки (0, 1), (1, 2), (2, 5), модель y = α₀ + α₁x + α₂x²</div><div class=\"ln\"><div class=\"fm\">x = 0:   <i>α</i><sub>0</sub> = 1</div><div class=\"nt\">подставили точку (0, 1)</div></div><div class=\"ln\"><div class=\"fm\">x = 1:   <i>α</i><sub>0</sub> + <i>α</i><sub>1</sub> + <i>α</i><sub>2</sub> = 2</div><div class=\"nt\">подставили (1, 2)</div></div><div class=\"ln\"><div class=\"fm\">x = 2:   <i>α</i><sub>0</sub> + 2<i>α</i><sub>1</sub> + 4<i>α</i><sub>2</sub> = 5</div><div class=\"nt\">подставили (2, 5)</div></div><div class=\"ln\"><div class=\"fm\"><i>α</i><sub>0</sub> = 1,  <i>α</i><sub>1</sub> = 0,  <i>α</i><sub>2</sub> = 1  ⇒  y = 1 + x²</div><div class=\"nt\">линейная система на α решена обычной алгеброй</div></div><p>Кривая получилась изогнутой (парабола), но найти α удалось как для прямой: так и работает «линейность по параметрам».</p></div>"}, {"k": "num", "h": "Числа: параболу через 4 точки", "b": "<p>Точки: (−1, 2), (0, 1), (1, 2), (2, 5), степень p = 2. Колонки: 1, x, x².</p>\n <pre class=\"code\">X = [1 −1 1]      y = [2]\n    [1  0 0]          [1]\n    [1  1 1]          [2]\n    [1  2 4]          [5]\n\nXᵀX = [ 4  2  6 ]    Xᵀy = [10]\n      [ 2  6  8 ]          [10]\n      [ 6  8 18 ]          [24]</pre>\n <p>Решаем XᵀXα = Xᵀy: получаем <b>α = (1, 0, 1)</b>, то есть y = 1 + 0·x + 1·x² = x² + 1. Остатки нулевые (ровно эти точки лежат на параболе). Для сравнения: прямая даёт y = 2 + x и SSR = 4. Парабола подходит лучше.</p>"}, {"k": "formula", "h": "Матрица Вандермонда и шаги", "b": "<table class=\"sym\"><tr><td>X<sub>ij</sub> = x<sub>i</sub><sup>j</sup>, j = 0..p</td><td>матрица Вандермонда, размер N×(p+1)</td></tr><tr><td>α = (XᵀX)⁻¹Xᵀy</td><td>те же нормальные уравнения</td></tr><tr><td>p ≤ N − 1</td><td>при p = N−1 кривая проходит через все точки (интерполяция, SSR = 0)</td></tr></table>\n <p><b>Алгоритм на экзамене:</b> 1) выбрать степень p; 2) построить X со столбцами 1, x, …, x<sup>p</sup>; 3) составить XᵀX и Xᵀy; 4) решить систему; 5) посчитать SSR и сравнить степени через cross-validation.</p>"}, {"k": "proof", "h": "Почему формулы те же и почему нельзя брать p слишком большим", "b": "<p><b>Те же:</b> f(x,α) = Σα<sub>j</sub>x<sup>j</sup> линейна по α, поэтому df/dα<sub>j</sub> = x<sup>j</sup> не зависит от α, и условия dE/dα<sub>j</sub> = −2Σ(y<sub>i</sub> − f(x<sub>i</sub>))x<sub>i</sub><sup>j</sup> = 0 дают ровно XᵀXα = Xᵀy (см. тему 3).</p>\n <p><b>Переобучение:</b> при N различных точках система с p = N−1 имеет единственное решение (определитель Вандермонда Π(x<sub>j</sub>−x<sub>i</sub>) ≠ 0), кривая проходит через все точки и SSR = 0, но между ними она бешено колеблется и плохо предсказывает новые данные. Как выбрать степень: по ошибке на <b>тестовых</b> данных (holdout, k-fold, тема 5) или по adjusted R², а не по SSR на обучающих.</p>"}, {"k": "quiz", "q": "Почему полиномиальную регрессию считают линейной?", "o": ["линейна по параметрам α", "линейна по x", "потому что p = 1", "потому что график прямой"], "a": 0, "why": "Параметры входят линейно, поэтому работают нормальные уравнения."}, {"k": "quiz", "q": "У вас N = 9 различных точек. При какой степени полином пройдёт через все точки?", "o": ["p = 2", "p = 4", "p = 8", "p = 9"], "a": 2, "why": "p = N − 1 = 8: девять коэффициентов на девять точек."}, {"k": "note", "h": "Тетрадь: полиномиальная регрессия", "b": "<div class=\"nb\"><div class=\"hd\">Модель</div><div class=\"ln\"><div class=\"fm\">y = α<sub>0</sub> + α<sub>1</sub>x + α<sub>2</sub>x² + … + α<sub>p</sub>x<sup>p</sup></div><div class=\"nt\">линейна по α, не по x</div></div><div class=\"hd\">Матрица Вандермонда</div><div class=\"ln\"><div class=\"fm\">X<sub>ij</sub> = x<sub>i</sub><sup>j</sup>,   j = 0,…,p</div><div class=\"nt\">строки = точки, столбцы = 1, x, x², …</div></div><div class=\"hd\">Решение</div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">XᵀX α = Xᵀy</span></div><div class=\"nt\">те же нормальные уравнения</div></div><div class=\"ln\"><div class=\"fm\">α = (XᵀX)⁻¹ Xᵀ y</div></div><div class=\"hd\">Степень</div><div class=\"ln\"><div class=\"fm\">p ≤ N − 1</div><div class=\"nt\">при p = N−1 SSR = 0 (интерполяция, переобучение)</div></div><div class=\"ln\"><div class=\"fm\">выбор p: минимум CV-ошибки</div><div class=\"nt\">не по SSR на обучающих данных</div></div><div class=\"ln\"><div class=\"fm\">(−1,2), (0,1), (1,2), (2,5), p=2  ⇒  α = (1, 0, 1),   y = x² + 1</div><div class=\"nt\">пример</div></div></div>"}, {"k": "note", "h": "Тетрадь: эталонные ответы на вопросы", "b": "<div class=\"nb\"><div class=\"hd\">Q: How can a non-linear model be linearised</div><div class=\"ln\"><div class=\"fm\">y = a·e<sup>bx</sup>  ⇒  ln y = ln a + b·x</div><div class=\"nt\">линейная регрессия ln y на x</div></div><div class=\"ln\"><div class=\"fm\">y = a·x<sup>b</sup>  ⇒  ln y = ln a + b·ln x</div><div class=\"nt\">log–log</div></div><div class=\"ln\"><div class=\"fm\">y = 1/(a + bx)  ⇒  1/y = a + bx</div><div class=\"nt\">замена переменной</div></div><div class=\"hd\">Q: Multiple linear regression in matrix form</div><div class=\"ln\"><div class=\"fm\">y = X a,  a = (XᵀX)⁻¹Xᵀy</div><div class=\"nt\">строки X — наблюдения, столбцы — признаки</div></div><div class=\"hd\">Q: Why polynomial regression is multiple regression</div><div class=\"ln\"><div class=\"fm\">y = a₀ + a₁x + a₂x² + … + a<sub>p</sub>x<sup>p</sup></div><div class=\"nt\">модель линейна по параметрам a</div></div><div class=\"ln\"><div class=\"fm\">X = [1, x, x², …, x<sup>p</sup>]  (матрица Вандермонда)</div><div class=\"nt\">степени x — «новые признаки»; дальше та же формула a = (XᵀX)⁻¹Xᵀy</div></div><div class=\"ln\"><div class=\"fm\">при N точках степень p ≤ N − 1: при p = N − 1 кривая проходит через все точки (переобучение)</div></div></div>"}, {"k": "exam", "h": "Ответ «How to calculate polynomial regression?»", "b": "<ol class=\"big\"><li>Модель и почему она линейна по параметрам.</li><li>Матрица Вандермонда X.</li><li>Нормальные уравнения и решение α = (XᵀX)⁻¹Xᵀy.</li><li>Мини-пример (как выше).</li><li>Выбор степени: переобучение, cross-validation.</li></ol>"}, {"k": "exam", "h": "Эталонный ответ (так можно писать на экзамене)", "b": "<p><b>Polynomial regression.</b> Модель y = α<sub>0</sub> + α<sub>1</sub>x + … + α<sub>p</sub>x<sup>p</sup> + r нелинейна по x, но <b>линейна по параметрам α</b>, поэтому это частный случай множественной линейной регрессии.</p>\n<p><b>Как считать:</b> 1) выбрать степень p; 2) построить матрицу Вандермонда X (X<sub>ij</sub> = x<sub>i</sub><sup>j</sup>, j = 0..p); 3) составить нормальные уравнения XᵀXα = Xᵀy; 4) решить α = (XᵀX)⁻¹Xᵀy; 5) вычислить SSR; 6) выбрать степень по cross-validation (на обучающих данных SSR падает с ростом p, при p = N−1 кривая проходит через все точки, но переобучена).</p>\n<p><b>Пример:</b> точки (−1,2), (0,1), (1,2), (2,5), p = 2 ⇒ XᵀX = [[4,2,6],[2,6,8],[6,8,18]], Xᵀy = [10,10,24] ⇒ α = (1,0,1), y = x² + 1.</p>"}], "part": "Часть 2 · Регрессия"}, {"id": "jac", "title": "8. Якобиан и нелинейный МНК (Gauss–Newton)", "goal": "Что такое Якобиан и как подгонять модель, нелинейную по параметрам.", "cards": [{"k": "story", "h": "Когда линейные формулы не работают", "b": "<p>Модель y = f(x, α), где α входит нелинейно, например y = e<sup>αx</sup>. Нормальные уравнения нелинейны по α и закрытого решения обычно нет. Идея: <b>на каждом шаге заменять функцию её линейным приближением</b> (первым членом ряда Тейлора) и решать уже линейную задачу МНК. Повторять, пока не сойдётся.</p>\n <p><b>Якобиан</b> — это матрица всех первых частных производных. Для подгонки: J<sub>ij</sub> = df(x<sub>i</sub>, α)/dα<sub>j</sub> (N×p): строка на каждую точку, столбец на каждый параметр. Для вектор-функции F: ℝⁿ→ℝᵐ: J<sub>ij</sub> = dF<sub>i</sub>/dx<sub>j</sub>.</p>"}, {"k": "num", "h": "Числа: Якобиан вектор-функции", "b": "<p>F(x,y) = (x²y, 5x + sin y). Тогда</p><pre class=\"code\">J = [ dF₁/dx  dF₁/dy ]  =  [ 2xy   x² ]\n    [ dF₂/dx  dF₂/dy ]     [  5   cos y ]\n\nв точке (1, 0):  J = [ 0  1 ]\n                     [ 5  1 ]</pre><p>Якобиан даёт «линейную копию» функции рядом с точкой: F(p+d) ≈ F(p) + J·d.</p>"}, {"k": "proof", "h": "Вывод шага Gauss–Newton (как на лекции)", "b": "<ol class=\"big\">\n <li>Остатки r<sub>i</sub> = y<sub>i</sub> − f(x<sub>i</sub>, α). Хотим минимизировать E(α) = Σr<sub>i</sub>².</li>\n <li>Пусть текущее приближение α<sup>k</sup>. Линеаризуем: f(x<sub>i</sub>, α) ≈ f(x<sub>i</sub>, α<sup>k</sup>) + Σ<sub>j</sub> J<sub>ij</sub> Δα<sub>j</sub>, где Δα = α − α<sup>k</sup>, J<sub>ij</sub> = df(x<sub>i</sub>, α<sup>k</sup>)/dα<sub>j</sub>.</li>\n <li>Обозначим Δy<sub>i</sub> = y<sub>i</sub> − f(x<sub>i</sub>, α<sup>k</sup>) (текущий остаток). Тогда r<sub>i</sub> ≈ Δy<sub>i</sub> − Σ<sub>j</sub> J<sub>ij</sub>Δα<sub>j</sub>, то есть r ≈ Δy − JΔα.</li>\n <li>Это <b>линейная</b> задача МНК: min ‖Δy − JΔα‖². По теме 3 (X→J, y→Δy) нормальные уравнения: <b>JᵀJ Δα = JᵀΔy</b>.</li>\n <li>Решаем Δα = (JᵀJ)⁻¹JᵀΔy и обновляем <b>α<sup>k+1</sup> = α<sup>k</sup> + Δα</b>. Пересчитываем J в новой точке (он меняется на каждой итерации) и повторяем до тех пор, пока сумма квадратов перестанет убывать.</li></ol>"}, {"k": "num", "h": "Числа: y = e^{αx}", "b": "<p>Данные: (0,1), (1,2), (2,7). Начало α⁰ = 0.5. Здесь f = e<sup>αx</sup>, df/dα = x·e<sup>αx</sup>.</p>\n <table class=\"tbl\"><tr><th>x</th><th>f(x,0.5)</th><th>J = x·f</th><th>Δy = y−f</th></tr><tr><td>0</td><td>1.000</td><td>0</td><td>0</td></tr><tr><td>1</td><td>1.649</td><td>1.649</td><td>0.351</td></tr><tr><td>2</td><td>2.718</td><td>5.437</td><td>4.282</td></tr></table>\n <p>JᵀJ = 1.649² + 5.437² = 32.27; JᵀΔy = 1.649·0.351 + 5.437·4.282 = 23.86. Δα = 23.86/32.27 = <b>0.739</b>, значит α¹ = 1.239 (перелёт). Следующие итерации: α² ≈ 1.028, α³ ≈ 0.969, α⁴ ≈ 0.965 (сходится к ≈ 0.97). SSR по шагам: 18.46 → 26.34 → 1.31 → 0.41. Видно: Gauss–Newton может на первом шаге ухудшить, поэтому важно разумное начальное значение.</p>"}, {"k": "formula", "h": "Что нужно помнить", "b": "<table class=\"sym\"><tr><td>JᵀJ Δα = JᵀΔy</td><td>нормальные уравнения шага; при линейной модели J = X и получается обычный OLS за один шаг</td></tr><tr><td>Начальное α⁰</td><td>от него зависит сходимость, иначе возможна расходимость</td></tr><tr><td>Локальные минимумы</td><td>в нелинейном МНК их может быть много (в линейном минимум единственный)</td></tr><tr><td>Остановка</td><td>когда SSR перестаёт убывать или шаг Δα мал</td></tr><tr><td>Якобиан численно</td><td>конечными разностями (J<sub>ij</sub> ≈ [f(α+hε<sub>j</sub>) − f(α)]/h), если аналитически сложно</td></tr></table>"}, {"k": "quiz", "q": "Чему равен размер Якобиана J в подгонке N точек и p параметров?", "o": ["N×p", "p×p", "N×N", "p×N"], "a": 0, "why": "Строка на каждую точку, столбец на каждый параметр."}, {"k": "quiz", "q": "В какую задачу превращается каждый шаг Gauss–Newton?", "o": ["в линейный МНК для поправки Δα", "в сортировку", "в поиск корня", "в нулевую подгонку"], "a": 0, "why": "min‖Δy − JΔα‖², отсюда JᵀJ Δα = JᵀΔy."}, {"k": "note", "h": "Тетрадь: Якобиан и Gauss–Newton", "b": "<div class=\"nb\"><div class=\"hd\">Якобиан</div><div class=\"ln\"><div class=\"fm\">J<sub>ij</sub> = <span class=\"fr\"><span>df(x<sub>i</sub>, α)</span><span>dα<sub>j</sub></span></span></div><div class=\"nt\">строка = точка, столбец = параметр, размер N×p</div></div><div class=\"hd\">Линеаризация (Тейлор)</div><div class=\"ln\"><div class=\"fm\">f(x<sub>i</sub>,α) ≈ f(x<sub>i</sub>,α<sup>k</sup>) + Σ<sub>j</sub> J<sub>ij</sub> Δα<sub>j</sub></div><div class=\"nt\">Δα = α − αᵏ</div></div><div class=\"ln\"><div class=\"fm\">Δy<sub>i</sub> = y<sub>i</sub> − f(x<sub>i</sub>, α<sup>k</sup>)</div><div class=\"nt\">текущий остаток</div></div><div class=\"ln\"><div class=\"fm\">r ≈ Δy − J Δα</div><div class=\"nt\">остаток после линеаризации</div></div><div class=\"hd\">Линейный МНК для поправки</div><div class=\"ln\"><div class=\"fm\">min ‖Δy − JΔα‖²</div><div class=\"nt\">как OLS: X → J, y → Δy</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">JᵀJ Δα = Jᵀ Δy</span></div><div class=\"nt\">нормальные уравнения шага</div></div><div class=\"ln\"><div class=\"fm\">α<sup>k+1</sup> = α<sup>k</sup> + Δα</div><div class=\"nt\">новое приближение, J пересчитываем</div></div></div>"}, {"k": "note", "h": "Тетрадь: эталонные ответы на вопросы", "b": "<div class=\"nb\"><div class=\"hd\">Q: Non-linear least squares</div><div class=\"ln\"><div class=\"fm\">r<sub>i</sub>(a) = <i>y</i><sub>i</sub> − f(<i>x</i><sub>i</sub>, a),   E(a) = <span class=\"sm\"><span>N</span><b>Σ</b><span>i=1</span></span> r<sub>i</sub>(a)² → min</div><div class=\"nt\">f нелинейна по параметрам a</div></div><div class=\"ln\"><div class=\"fm\">нормальные уравнения нелинейны, замкнутой формулы нет ⇒ итерации</div><div class=\"nt\">нужны стартовая точка и производные</div></div><div class=\"hd\">Q: Gauss–Newton algorithm</div><div class=\"ln\"><div class=\"fm\">J<sub>ij</sub> = dr<sub>i</sub>/da<sub>j</sub></div><div class=\"nt\">Якобиан остатков, размер N×p</div></div><div class=\"ln\"><div class=\"fm\">r(a + δ) ≈ r(a) + J·δ</div><div class=\"nt\">линеаризация остатков</div></div><div class=\"ln\"><div class=\"fm\">min ‖r + Jδ‖²  ⇒  JᵀJ δ = −Jᵀr</div><div class=\"nt\">на каждом шаге обычная линейная МНК-задача</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">a<sub>k+1</sub> = a<sub>k</sub> − (JᵀJ)⁻¹Jᵀr</span></div><div class=\"nt\">шаг Gauss–Newton</div></div><div class=\"hd\">Q: Compare linear and non-linear least squares</div><div class=\"ln\"><div class=\"fm\">линейная: один шаг, формула (XᵀX)⁻¹Xᵀy, единственный минимум</div><div class=\"nt\">выпуклая задача</div></div><div class=\"ln\"><div class=\"fm\">нелинейная: итерации, зависит от старта, возможны локальные минимумы, нужен Якобиан</div><div class=\"nt\">GN — квазиньютоновский: гессиан ≈ JᵀJ</div></div></div>"}, {"k": "exam", "h": "Ответ «Jacobian / nonlinear least squares»", "b": "<ol class=\"big\"><li>Определение Якобиана и его размер.</li><li>Почему нужен итеративный метод (нет closed form).</li><li>Линеаризация по Тейлору и вывод JᵀJΔα = JᵀΔy.</li><li>Алгоритм: начальное α, шаг, обновление, критерий остановки.</li><li>Проблемы: начальное значение, локальные минимумы, необходимость J.</li></ol>"}, {"k": "exam", "h": "Эталонный ответ (так можно писать на экзамене)", "b": "<p><b>Jacobian.</b> Матрица первых частных производных. Для F: ℝⁿ → ℝᵐ: J<sub>ij</sub> = dF<sub>i</sub>/dx<sub>j</sub> (m×n). В подгонке модели y = f(x,α): J<sub>ij</sub> = df(x<sub>i</sub>,α)/dα<sub>j</sub> (N×p). Даёт линейное приближение F(x+d) ≈ F(x) + J d.</p>\n<p><b>Нелинейный МНК (Gauss–Newton).</b> Нормальные уравнения нелинейны по α, замкнутого решения нет ⇒ итерации α<sup>k+1</sup> = α<sup>k</sup> + Δα. Линеаризуем f по Тейлору: f(x<sub>i</sub>,α) ≈ f(x<sub>i</sub>,α<sup>k</sup>) + Σ J<sub>ij</sub>Δα<sub>j</sub>. Тогда r ≈ Δy − JΔα, Δy<sub>i</sub> = y<sub>i</sub> − f(x<sub>i</sub>,α<sup>k</sup>). Минимизация ‖Δy − JΔα‖² даёт <b>JᵀJ Δα = JᵀΔy</b>. J пересчитывается на каждой итерации (можно численно конечными разностями).</p>\n<p><b>Проблемы:</b> нужен хороший начальный α⁰, возможны локальные минимумы и расходимость.</p>"}], "part": "Часть 2 · Регрессия"}, {"id": "res", "title": "9. Resampling: cross-validation и bootstrap", "goal": "Как честно проверить модель на новых данных.", "cards": [{"k": "story", "h": "Зачем", "b": "<p>Модель, подогнанная под данные, на этих же данных всегда выглядит хорошо (высокий R², малый SSR). Но нужна способность <b>предсказывать новые</b> данные. Поэтому часть данных прячем: учим на одной части (training set), проверяем на другой (testing set). Повторное разбиение и усреднение называют <b>resampling</b>.</p>\n <p>(Если в списке вопросов было «Resembling», скорее всего имелось в виду resampling, и это cross-validation из лекции.)</p>"}, {"k": "formula", "h": "Методы из лекции", "b": "<table class=\"sym\"><tr><td>Holdout</td><td>один раз делим на train/test (часто 10–33% в test). Быстро, но результат зависит от случайного разбиения.</td></tr>\n <tr><td>Leave-p-out (LpO)</td><td>в test по p точек, перебираем ВСЕ способы: C(N,p) моделей. При N = 100, p = 30 это ≈ 2.9·10²⁵, нереально.</td></tr>\n <tr><td>Leave-one-out (LOO)</td><td>p = 1, всего N моделей. Дорого при большом N.</td></tr>\n <tr><td>k-fold</td><td>делим на k равных частей, каждая по разу служит тестом. Всего k моделей; k = N даёт LOO; 2-fold: train d1/test d2 и наоборот.</td></tr></table>\n <p>Итоговая оценка = среднее по всем тестовым ошибкам: CV = (1/k)·Σ MSE<sub>j</sub>.</p>"}, {"k": "num", "h": "Числа", "b": "<p>N = 8 точек. <b>LOO:</b> 8 моделей; каждая учится на 7 точках, проверяется на 1. <b>4-fold:</b> 4 части по 2 точки, 4 модели (каждая учится на 6, тестируется на 2); так в среднем быстрее и стабильнее, чем один holdout.</p>\n <p>Пример выбора степени: для полиномов p = 1..5 считаем 4-fold CV-ошибку, например 3.2; 0.9; 0.8; 2.5; 9.1. Берём p = 3: минимум тестовой ошибки (дальше начинается переобучение: на обучении ошибка падала бы всё время, а на тесте растёт).</p>"}, {"k": "proof", "h": "Вывод: bootstrap берёт ≈ 63.2% разных точек (ISLR гл. 5)", "b": "<p><b>Bootstrap</b> (ISLR гл. 5, не из слайдов Gorgone): из N точек N раз берём точку <b>с возвращением</b>, получаем новую выборку того же размера, считаем статистику, повторяем много раз и смотрим на разброс (оценка погрешности).</p>\n <p>Вероятность, что конкретная точка НЕ попала в выборку: (1 − 1/N)<sup>N</sup> → e<sup>−1</sup> ≈ 0.368 при N → ∞ (так как (1 − 1/N)<sup>N</sup> → e<sup>−1</sup>). Значит попала с вероятностью ≈ 0.632: в среднем 63.2% разных точек, остальные ≈ 36.8% («out-of-bag») используются как тест.</p>"}, {"k": "quiz", "q": "Что делает k-fold cross-validation при k = N?", "o": ["превращается в leave-one-out", "превращается в holdout", "ничего", "считает C(N,2) моделей"], "a": 0, "why": "Лекция: for k = N, k-fold CV equals leave-one-out."}, {"k": "quiz", "q": "Почему LpO CV почти не используют?", "o": ["число разбиений C(N,p) огромное", "она неточная", "она не для регрессии", "она всегда дороже bootstrap в 2 раза"], "a": 0, "why": "Пример лекции: C(100,30) ≈ 2.9·10²⁵ повторов."}, {"k": "note", "h": "Тетрадь: эталонные ответы на вопросы", "b": "<div class=\"nb\"><div class=\"hd\">Q: What is cross-validation and why</div><div class=\"ln\"><div class=\"fm\">ошибка на обучающих данных занижена: модель подогнана под них</div><div class=\"nt\">переобучение</div></div><div class=\"ln\"><div class=\"fm\">CV оценивает ошибку на данных, которые модель не видела</div><div class=\"nt\">выбор модели и гиперпараметров</div></div><div class=\"hd\">Q: Holdout, LpO, LOO, k-fold</div><div class=\"ln\"><div class=\"fm\">holdout: одно разбиение train/test (быстро, но зависит от разбиения)</div></div><div class=\"ln\"><div class=\"fm\">k-fold: делим на k частей, k раз обучаем на k − 1 и тестируем на оставшейся,  CV = <span class=\"fr\"><span>1</span><span>k</span></span> <span class=\"sm\"><span>k</span><b>Σ</b><span>j=1</span></span> MSE<sub>j</sub></div><div class=\"nt\">обычно k = 5 или 10</div></div><div class=\"ln\"><div class=\"fm\">LOO: k = N (по одной точке); LpO: все наборы из p точек, C(N,p) моделей — слишком дорого</div></div><div class=\"hd\">Q: How to choose the degree of the polynomial</div><div class=\"ln\"><div class=\"fm\">ошибка на train всегда падает с ростом степени</div><div class=\"nt\">при p = N − 1 она равна 0</div></div><div class=\"ln\"><div class=\"fm\">считаем CV-ошибку для p = 1, 2, 3, … и берём p с минимумом (или самое простое в пределах шума)</div><div class=\"nt\">кривая CV имеет U-образную форму</div></div></div>"}, {"k": "exam", "h": "Ответ «Resampling / Cross-validation»", "b": "<ol class=\"big\"><li>Проблема: переобучение, оценка на обучающих данных завышена.</li><li>Идея: train/test, повтор и усреднение.</li><li>Методы: holdout, LpO, LOO, k-fold (плюсы и минусы).</li><li>Применение: выбор степени полинома, числа признаков.</li><li>Bootstrap кратко: выборка с возвращением, 63.2%.</li></ol>"}, {"k": "exam", "h": "Эталонный ответ (так можно писать на экзамене)", "b": "<p><b>Resampling</b> — повторное разбиение данных на обучающую и тестовую части для оценки способности модели предсказывать новые данные (ошибка на обучающих данных занижена и приводит к переобучению).</p>\n<p><b>Методы (лекция):</b> holdout (одно разбиение); leave-p-out (все C(N,p) разбиений, слишком дорого); leave-one-out (N моделей); k-fold (данные на k частей, каждая по разу тест, k моделей; k = N совпадает с LOO). Оценка = среднее ошибок на тестовых частях.</p>\n<p><b>Применение:</b> выбор степени полинома, числа признаков, гиперпараметров — берут вариант с минимальной CV-ошибкой.</p>\n<p><b>Bootstrap</b> (общая теория): выборка с возвращением, каждая точка попадает с вероятностью 1 − (1 − 1/N)<sup>N</sup> → 1 − e<sup>−1</sup> ≈ 0.632.</p>"}], "part": "Часть 2 · Регрессия"}, {"id": "sel", "title": "10. Forward / backward selection", "goal": "Как выбирать признаки в регрессии.", "ext": true, "cards": [{"k": "story", "h": "Тема вне слайдов лекций", "b": "<p class=\"warn\"><b>Источник:</b> в слайдах Gorgone этого нет, но в программе Davide это ISLR гл. 6, раздел 6.1 (best subset, forward и backward stepwise). Текст ниже написан по ISLR и общей теории, не по слайдам.</p>\n <p>Есть p возможных признаков. Перебрать все подмножества (2<sup>p</sup> моделей) нельзя при большом p, поэтому используют жадные пошаговые методы:</p>\n <ul class=\"big\"><li><b>Forward selection:</b> начинаем с пустой модели (только свободный член). На каждом шаге добавляем тот признак, который больше всего улучшает критерий. Останавливаемся, когда добавление больше не помогает.</li><li><b>Backward elimination:</b> начинаем со всех признаков, на каждом шаге убираем самый бесполезный. Останавливаемся, когда удаление ухудшает критерий.</li><li><b>Stepwise:</b> комбинация (можно и добавлять, и убирать).</li></ul>"}, {"k": "formula", "h": "Критерии: чем измеряем «лучше»", "b": "<table class=\"sym\"><tr><td>adj R²</td><td>1 − (1−R²)(N−1)/(N−p−1): растёт, только если признак помогает больше, чем штраф</td></tr><tr><td>AIC</td><td>N·ln(SSR/N) + 2k: штраф 2 за каждый параметр (k параметров), меньше лучше</td></tr><tr><td>BIC</td><td>N·ln(SSR/N) + k·ln N: штраф сильнее</td></tr><tr><td>C<sub>p</sub> (ISLR 6.1)</td><td>(RSS + 2dσ̂²)/N, d числа предикторов; меньше лучше</td></tr><tr><td>CV-ошибка</td><td>тестовая MSE из k-fold</td></tr><tr><td>F-тест / p-value</td><td>значим ли добавляемый признак</td></tr></table>\n <p>Нельзя выбирать по обычному SSR или R²: они всегда улучшаются при добавлении признаков (см. тему 2).</p>"}, {"k": "num", "h": "Пример на условных числах", "b": "<p>Признаки x<sub>1</sub>, x<sub>2</sub>, x<sub>3</sub>. Условные значения SSR (числа придуманы для показа логики): пустая модель 100; {x<sub>1</sub>} 40; {x<sub>2</sub>} 70; {x<sub>3</sub>} 90.</p>\n <p><b>Forward, шаг 1:</b> лучший одиночный x<sub>1</sub> (SSR 40), берём. <b>Шаг 2:</b> пробуем {x<sub>1</sub>,x<sub>2</sub>} = 38 и {x<sub>1</sub>,x<sub>3</sub>} = 39.5. Улучшение с 40 до 38 малое: по AIC/CV это может не окупить лишний параметр, тогда останавливаемся на {x<sub>1</sub>}.</p>\n <p><b>Backward:</b> стартуем с {x<sub>1</sub>,x<sub>2</sub>,x<sub>3</sub>}, убираем признак, чьё удаление меньше всего ухудшает критерий, и так далее.</p>\n <p>Число всех моделей для p = 3: 2³ = 8; для p = 20 уже больше миллиона, поэтому жадный поиск.</p>"}, {"k": "proof", "h": "Почему жадный поиск не гарантирует лучшую модель", "b": "<p>Forward добавляет признаки по одному и не пересматривает прошлые решения: два признака могут быть полезны только вместе (по отдельности каждый слабый), и forward их пропустит. Backward стартует с полной модели, поэтому такие пары находит, но требует N &gt; p и ломается при мультиколлинеарности (XᵀX необратима). Чтобы не обмануть себя, финальную модель проверяют на отдельных данных (cross-validation).</p>"}, {"k": "quiz", "q": "С чего начинается forward selection?", "o": ["с пустой модели", "со всех признаков", "со случайных признаков", "с самого значимого"], "a": 0, "why": "Forward: пустая модель, затем добавляем по одному. Backward наоборот."}, {"k": "quiz", "q": "Можно ли выбирать признаки по минимуму SSR на обучающих данных?", "o": ["нет, SSR падает при добавлении любых признаков", "да, это лучший критерий", "только в backward", "только если N мало"], "a": 0, "why": "Поэтому нужны adj R², AIC/BIC или CV-ошибка."}, {"k": "exam", "h": "Ответ «Forward / backward selection»", "b": "<ol class=\"big\"><li>Зачем: много признаков, 2<sup>p</sup> подмножеств слишком много.</li><li>Forward: пусто → добавляем лучший; Backward: полная → убираем худший.</li><li>Критерий остановки: adj R², AIC/BIC, CV, F-тест.</li><li>Минусы: жадность, мультиколлинеарность, переобучение при выборе.</li></ol>"}, {"k": "exam", "h": "Эталонный ответ (так можно писать на экзамене)", "b": "<p><b>Forward / backward selection</b> — жадные методы выбора признаков в регрессии, когда перебор всех 2<sup>p</sup> подмножеств невозможен.</p>\n<p><b>Forward:</b> старт с пустой модели; на каждом шаге добавляем признак, дающий наибольшее улучшение критерия; останавливаемся, когда улучшения нет. <b>Backward:</b> старт со всех признаков; на каждом шаге удаляем наименее полезный; останавливаемся, когда удаление ухудшает критерий. <b>Stepwise</b> — комбинация.</p>\n<p><b>Критерии:</b> adjusted R², AIC = N ln(SSR/N) + 2k, BIC = N ln(SSR/N) + k ln N, CV-ошибка, F-тест. Нельзя использовать обычные SSR/R² (они улучшаются при добавлении любого признака).</p>\n<p><b>Минусы:</b> жадность (не гарантирует лучший набор), backward требует N &gt; p, мультиколлинеарность. (Тема не из слайдов, это общая теория.)</p>"}], "part": "Часть 2 · Регрессия"}, {"title": "11. Матрицы, определитель, ранг, системы", "goal": "Определитель, ранг, теорема Руше–Капелли, методы Гаусса и Крамера.", "part": "Часть 3 · Линейная алгебра и PCA", "cards": [{"k": "story", "h": "Зачем в этом курсе линейная алгебра", "b": "<p>Регрессия (нормальные уравнения XᵀXa = Xᵀy), PCA (собственные векторы), Gauss–Newton, градиентные методы — всё это системы линейных уравнений и матрицы. Здесь минимум, который нужен для остального курса.</p><p><b>Определитель</b> det A — число, характеризующее квадратную матрицу. Он нулевой ⇔ матрица необратима (строки линейно зависимы). Системе Ax = b единственное решение гарантировано, если det A ≠ 0.</p>"}, {"k": "formula", "h": "Определитель и ранг: формулы", "b": "<table class=\"sym\"><tr><td>det(AB) = det A · det B</td><td>определитель произведения</td></tr><tr><td>det(λA) = λⁿ det A</td><td>для матрицы n×n</td></tr><tr><td>перестановка строк</td><td>меняет знак det</td></tr><tr><td>A⁻¹ = adj(A) / det A</td><td>обратная существует ⇔ det A ≠ 0</td></tr><tr><td>Лаплас O(n!), Гаусс O(n³)</td><td>сложность вычисления det</td></tr><tr><td>rank A</td><td>максимальный порядок ненулевого минора = число независимых строк = число опорных элементов после метода Гаусса</td></tr><tr><td>Кронекер</td><td>ранг ищут «окаймлением» миноров: ненулевой минор + проверка окаймляющих</td></tr></table>"}, {"k": "proof", "h": "Теорема Руше–Капелли и метод Гаусса", "b": "<p><b>Теорема.</b> Система Ax = b (n неизвестных) совместна ⇔ rank A = rank[A | b].</p><ul class=\"big\"><li>rank A &lt; rank[A | b]: вектор b не выражается через столбцы A, <b>решений нет</b>.</li><li>rank A = rank[A | b] = n: <b>ровно одно решение</b>.</li><li>rank A = rank[A | b] = r &lt; n: <b>бесконечно много решений</b>, n − r свободных параметров (∞<sup>n−r</sup>).</li></ul><p><b>Метод Гаусса:</b> элементарными операциями со строками (прибавить кратное одной строки к другой, переставить, умножить на число) приводим [A | b] к ступенчатому виду; потом обратная подстановка снизу вверх. Сложность O(n³). Ранг = число ненулевых строк после приведения.</p><p><b>Правило Крамера:</b> xᵢ = det Aᵢ / det A, где Aᵢ — матрица A с i-м столбцом, замененным на b. Подходит для малых n (для больших дорого).</p>"}, {"k": "num", "h": "Числа", "b": "<p><b>Крамер:</b> x + y = 3, 2x − y = 0. det A = 1·(−1) − 1·2 = −3. det A₁ (столбец x заменён на b = (3, 0)) = 3·(−1) − 1·0 = −3, значит x = −3/−3 = <b>1</b>. det A₂ (столбец y заменён) = 1·0 − 3·2 = −6, значит y = −6/−3 = <b>2</b>. Проверка: 1 + 2 = 3, 2·1 − 2 = 0.</p><p><b>Ранг:</b> матрица [[1,2,3],[2,4,6],[1,0,1]]: вторая строка = 2·первая, значит строки зависимы, det = 0, ранг = <b>2</b>.</p><p><b>Руше–Капелли:</b> x + y = 1 и 2x + 2y = 3: rank A = 1, rank[A | b] = 2, <b>решений нет</b>. А x + y = 1, 2x + 2y = 2: оба ранга 1 &lt; 2 = n, решений ∞¹ (x = 1 − y, любое y).</p>"}, {"k": "quiz", "q": "rank A = 2, rank[A|b] = 3. Что с системой?", "o": ["решений нет", "одно решение", "бесконечно много", "нельзя сказать"], "a": 0, "why": "rank A ≠ rank[A|b]: система несовместна."}, {"k": "quiz", "q": "n = 4 неизвестных, rank A = rank[A|b] = 3. Сколько решений?", "o": ["∞¹ (один свободный параметр)", "одно", "нет", "∞⁴"], "a": 0, "why": "n − r = 4 − 3 = 1 свободный параметр."}, {"k": "note", "h": "Тетрадь: эталонные ответы на вопросы", "b": "<div class=\"nb\"><div class=\"hd\">Q: Rouché–Capelli theorem</div><div class=\"ln\"><div class=\"fm\">Ax = b совместна ⇔ rank A = rank[A | b]</div></div><div class=\"ln\"><div class=\"fm\">rank = n  ⇒  одно решение;  rank = r &lt; n  ⇒  ∞<sup>n−r</sup> решений</div><div class=\"nt\">n — число неизвестных</div></div><div class=\"hd\">Q: How to compute the rank</div><div class=\"ln\"><div class=\"fm\">rank = наибольший порядок ненулевого минора = число независимых строк</div><div class=\"nt\">метод Гаусса: число ненулевых строк в ступенчатом виде</div></div><div class=\"ln\"><div class=\"fm\">метод окаймления миноров (Кронекер)</div></div><div class=\"hd\">Q: Gaussian elimination and Cramer</div><div class=\"ln\"><div class=\"fm\">Гаусс: [A | b] → ступенчатый вид элементарными операциями, затем подстановка снизу вверх, O(n³)</div></div><div class=\"ln\"><div class=\"fm\">Крамер: x<sub>i</sub> = <span class=\"fr\"><span>det A<sub>i</sub></span><span>det A</span></span>,  det A ≠ 0</div><div class=\"nt\">A<sub>i</sub>: i-й столбец заменён на b; для малых n</div></div></div>"}, {"k": "exam", "h": "Эталонные ответы", "b": "<p><b>Rouché–Capelli:</b> Ax = b is consistent iff rank A = rank[A|b]; if the common rank is n there is a unique solution, if r &lt; n there are ∞^(n−r) solutions.</p><p><b>Rank:</b> maximal order of a non-zero minor = number of independent rows = number of pivots after Gaussian elimination.</p><p><b>Gaussian elimination:</b> reduce [A|b] to row echelon form by elementary row operations, then back-substitution, O(n³). <b>Cramer:</b> xᵢ = det Aᵢ/det A, needs det A ≠ 0, practical for small n only.</p>"}], "id": "la1"}, {"title": "12. Векторные пространства, нормы, Грам–Шмидт", "goal": "Независимость, базис, размерность, нормы, скалярное произведение, ортогонализация.", "part": "Часть 3 · Линейная алгебра и PCA", "cards": [{"k": "story", "h": "Основные понятия по-простому", "b": "<ul class=\"big\"><li><b>Линейная независимость:</b> векторы v₁…v_k независимы, если из Σλᵢvᵢ = 0 следует, что все λᵢ = 0. Ни один вектор не выражается через остальные.</li><li><b>Базис:</b> независимая система, через которую выражается любой вектор пространства. <b>Размерность</b> = число векторов в базисе (в ℝⁿ это n).</li><li><b>Подпространство:</b> обязательно содержит 0 и замкнуто относительно сложения и умножения на число. Сумма и пересечение подпространств — подпространства, объединение — нет.</li><li><b>Формула Грассмана:</b> dim(U + V) = dim U + dim V − dim(U ∩ V).</li></ul>"}, {"k": "formula", "h": "Скалярное произведение и нормы", "b": "<table class=\"sym\"><tr><td>u·v = Σuᵢvᵢ</td><td>скалярное произведение (симметричная положительно определённая билинейная форма)</td></tr><tr><td>|u·v| ≤ ‖u‖·‖v‖</td><td>неравенство Коши–Шварца</td></tr><tr><td>‖v‖ₚ = (Σ|vᵢ|ᵖ)^(1/p), p ≥ 1</td><td>норма Lₚ: p = 1 сумма модулей, p = 2 евклидова, p → ∞ максимум</td></tr><tr><td>норма</td><td>‖v‖ ≥ 0, ‖v‖ = 0 ⇔ v = 0, ‖λv‖ = |λ|‖v‖, ‖u + v‖ ≤ ‖u‖ + ‖v‖</td></tr><tr><td>матричные нормы</td><td>‖A‖₁ = max по столбцам Σ|aᵢⱼ|, ‖A‖∞ = max по строкам, Фробениус ‖A‖_F = √(Σaᵢⱼ²)</td></tr><tr><td>d(x,y) = ‖x − y‖</td><td>каждая норма порождает расстояние</td></tr></table>"}, {"k": "proof", "h": "Процесс Грама–Шмидта", "b": "<p>Цель: из независимых v₁, …, v_k построить <b>ортонормированный</b> базис e₁, …, e_k (попарно перпендикулярные векторы длины 1).</p><ol class=\"big\"><li>e₁ = v₁ / ‖v₁‖.</li><li>u₂ = v₂ − (v₂·e₁)e₁ — вычитаем из v₂ его проекцию на e₁ (остаётся часть, перпендикулярная e₁). Тогда e₂ = u₂ / ‖u₂‖.</li><li>u_j = v_j − Σ_{i&lt;j}(v_j·eᵢ)eᵢ, e_j = u_j / ‖u_j‖.</li></ol><p><b>Почему работает:</b> проверим u₂ ⟂ e₁: u₂·e₁ = v₂·e₁ − (v₂·e₁)(e₁·e₁) = v₂·e₁ − v₂·e₁ = 0, так как e₁·e₁ = 1.</p>"}, {"k": "num", "h": "Числа", "b": "<p><b>Нормы:</b> v = (3, −4). L₁ = 3 + 4 = 7; L₂ = √(9 + 16) = 5; L∞ = max(3, 4) = 4.</p><p><b>Грам–Шмидт:</b> v₁ = (1, 1, 0), v₂ = (1, 0, 1). ‖v₁‖ = √2, e₁ = (1/√2, 1/√2, 0). v₂·e₁ = 1/√2. u₂ = v₂ − (1/√2)·e₁ = (1,0,1) − (1/2, 1/2, 0) = (1/2, −1/2, 1). ‖u₂‖ = √(1/4 + 1/4 + 1) = √1.5 = 1.2247. e₂ = (0.408, −0.408, 0.816). Проверка: e₁·e₂ = (0.408 − 0.408)/√2 + 0 = 0.</p><p><b>Размерность:</b> U = span{(1,0,0), (0,1,0)}, V = span{(0,1,0), (0,0,1)} в ℝ³. dim U = dim V = 2, U ∩ V = span{(0,1,0)} (dim 1), значит dim(U + V) = 2 + 2 − 1 = 3.</p>"}, {"k": "quiz", "q": "Векторы (1,2) и (2,4). Они независимы?", "o": ["нет, второй = 2·первый", "да", "зависит от базиса", "нельзя сказать"], "a": 0, "why": "2·(1,2) = (2,4), значит линейная комбинация даёт 0 с ненулевыми коэффициентами."}, {"k": "quiz", "q": "dim U = 3, dim V = 4, dim(U∩V) = 2. Чему равна dim(U+V)?", "o": ["5", "7", "9", "6"], "a": 0, "why": "Грассман: 3 + 4 − 2 = 5."}, {"k": "note", "h": "Тетрадь: эталонные ответы на вопросы", "b": "<div class=\"nb\"><div class=\"hd\">Q: Linear independence, basis, dimension</div><div class=\"ln\"><div class=\"fm\">Σλ<sub>i</sub>v<sub>i</sub> = 0 ⇒ все λ<sub>i</sub> = 0</div><div class=\"nt\">независимость</div></div><div class=\"ln\"><div class=\"fm\">базис: независимая система, порождающая пространство; dim = число векторов базиса</div></div><div class=\"ln\"><div class=\"fm\">dim(U + V) = dim U + dim V − dim(U ∩ V)</div><div class=\"nt\">формула Грассмана</div></div><div class=\"hd\">Q: What is a norm</div><div class=\"ln\"><div class=\"fm\">‖v‖ ≥ 0;  ‖v‖ = 0 ⇔ v = 0;  ‖λv‖ = |λ|‖v‖;  ‖u + v‖ ≤ ‖u‖ + ‖v‖</div><div class=\"nt\">аксиомы</div></div><div class=\"ln\"><div class=\"fm\">‖v‖<sub>p</sub> = (Σ|v<sub>i</sub>|<sup>p</sup>)<sup>1/p</sup>:  L₁, L₂, L∞;  матричные: ‖A‖₁, ‖A‖∞, Фробениус</div><div class=\"nt\">пример v = (3, −4): 7, 5, 4</div></div><div class=\"hd\">Q: Gram–Schmidt</div><div class=\"ln\"><div class=\"fm\">e₁ = v₁ / ‖v₁‖</div><div class=\"nt\">нормируем первый</div></div><div class=\"ln\"><div class=\"fm\">u<sub>j</sub> = v<sub>j</sub> − Σ<sub>i&lt;j</sub> (v<sub>j</sub>·e<sub>i</sub>) e<sub>i</sub>,   e<sub>j</sub> = u<sub>j</sub> / ‖u<sub>j</sub>‖</div><div class=\"nt\">вычитаем проекции и нормируем</div></div><div class=\"ln\"><div class=\"fm\">результат: ортонормированный базис</div><div class=\"nt\">u₂·e₁ = v₂·e₁ − v₂·e₁ = 0</div></div></div>"}, {"k": "exam", "h": "Эталонные ответы", "b": "<p><b>Linear independence:</b> Σλᵢvᵢ = 0 ⇒ all λᵢ = 0. <b>Basis:</b> independent spanning set; <b>dimension</b> = number of basis vectors.</p><p><b>Norm:</b> function with ‖v‖ ≥ 0, ‖v‖ = 0 ⇔ v = 0, ‖λv‖ = |λ|‖v‖, triangle inequality. Examples: L₁, L₂ (Euclidean), L∞ (max), Lₚ; matrix norms ‖A‖₁, ‖A‖∞, Frobenius.</p><p><b>Gram–Schmidt:</b> e₁ = v₁/‖v₁‖; uⱼ = vⱼ − Σ(vⱼ·eᵢ)eᵢ, eⱼ = uⱼ/‖uⱼ‖: subtract projections on previous vectors and normalise, giving an orthonormal basis.</p>"}], "id": "la2"}, {"title": "13. Собственные значения, диагонализация, квадратичные формы", "goal": "Av = λv, характеристическое уравнение, диагонализуемость, знакоопределённость.", "part": "Часть 3 · Линейная алгебра и PCA", "cards": [{"k": "story", "h": "Идея", "b": "<p>Матрица A действует на вектор как преобразование: поворачивает и растягивает. Но у большинства матриц есть особые направления, в которых вектор <b>только растягивается</b> (не меняя направления): Av = λv. Такой v называется <b>собственным вектором</b>, а множитель λ — <b>собственным значением</b>.</p><p>Это основа PCA (главные направления — собственные векторы ковариационной матрицы), исследования гессиана (минимум или нет) и скорости сходимости градиентного спуска (через λ_min и λ_max).</p>"}, {"k": "note", "h": "Тетрадь: как найти собственные значения", "b": "<div class=\"nb\"><div class=\"hd\">Определение</div><div class=\"ln\"><div class=\"fm\">A v = λ v,   v ≠ 0</div><div class=\"nt\">v — собственный вектор, λ — собственное значение</div></div><div class=\"ln\"><div class=\"fm\">(A − λI) v = 0</div><div class=\"nt\">перенесли λv влево</div></div><div class=\"hd\">Характеристическое уравнение</div><div class=\"ln\"><div class=\"fm\">нетривиальное v существует ⇔ (A − λI) вырождена</div><div class=\"nt\">иначе решение только v = 0</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">det(A − λI) = 0</span></div><div class=\"nt\">многочлен степени n по λ</div></div><div class=\"hd\">Связь с матрицей</div><div class=\"ln\"><div class=\"fm\">det A = λ₁·λ₂·…·λₙ</div><div class=\"nt\">произведение собственных значений</div></div><div class=\"ln\"><div class=\"fm\">tr A = λ₁ + λ₂ + … + λₙ</div><div class=\"nt\">сумма диагонали = сумма собственных значений</div></div><div class=\"hd\">Диагонализация</div><div class=\"ln\"><div class=\"fm\">A = P Λ P⁻¹</div><div class=\"nt\">столбцы P — собственные векторы, Λ — диагональ из λ</div></div><div class=\"ln\"><div class=\"fm\">симметричная A:  A = Q Λ Qᵀ</div><div class=\"nt\">Q ортогональна, λ вещественны</div></div></div>"}, {"k": "formula", "h": "Кратности, диагонализуемость, формы", "b": "<table class=\"sym\"><tr><td>алгебраическая кратность μₐ</td><td>кратность λ как корня характеристического многочлена</td></tr><tr><td>геометрическая кратность μ_g</td><td>n − rank(A − λI): размерность пространства собственных векторов; 1 ≤ μ_g ≤ μₐ</td></tr><tr><td>диагонализуема ⇔</td><td>все λ вещественны, Σμₐ = n и μₐ = μ_g для каждого λ</td></tr><tr><td>квадратичная форма q = xᵀAx</td><td>положительно определена (PD) ⇔ все λ &gt; 0 ⇔ все ведущие главные миноры &gt; 0 (Сильвестр)</td></tr><tr><td>PSD ⪰ 0 / ND / неопределённая</td><td>λ ≥ 0 / все λ &lt; 0 / λ разных знаков</td></tr></table>"}, {"k": "num", "h": "Числа", "b": "<p>A = [[2,1],[1,2]]. Характеристическое уравнение: det(A − λI) = (2−λ)² − 1 = λ² − 4λ + 3 = 0, корни <b>λ = 3 и λ = 1</b>. Проверка: произведение 3·1 = 3 = det A = 4 − 1; сумма 3 + 1 = 4 = tr A.</p><p>Вектор для λ = 3: (A − 3I)v = [[−1,1],[1,−1]]v = 0 ⇒ v = (1, 1). Для λ = 1: [[1,1],[1,1]]v = 0 ⇒ v = (1, −1). Они перпендикулярны (симметричная матрица). Диагонализация: A = QΛQᵀ, Λ = diag(3, 1).</p><p><b>Не диагонализуема:</b> A = [[1,1],[0,1]]: λ = 1 дважды (μₐ = 2), но rank(A − I) = 1, μ_g = 2 − 1 = 1 &lt; μₐ.</p><p><b>Знакоопределённость:</b> f(x,y) = x² + 3y² имеет матрицу diag(1,3) → λ = 1, 3 &gt; 0, форма положительно определена. Для [[1,2],[2,1]]: λ = 3 и −1, неопределённая (седло).</p>"}, {"k": "quiz", "q": "A = [[2,1],[1,2]]. Чему равны собственные значения?", "o": ["3 и 1", "2 и 1", "4 и 0", "3 и 3"], "a": 0, "why": "λ² − 4λ + 3 = 0."}, {"k": "quiz", "q": "Квадратичная форма с λ = 3 и −1. Какая она?", "o": ["неопределённая", "положительно определённая", "отрицательно определённая", "нулевая"], "a": 0, "why": "Собственные значения разных знаков."}, {"k": "note", "h": "Тетрадь: эталонные ответы на вопросы", "b": "<div class=\"nb\"><div class=\"hd\">Q: Eigenvalues and eigenvectors</div><div class=\"ln\"><div class=\"fm\">A v = λ v,  v ≠ 0</div><div class=\"nt\">собственная пара</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">det(A − λI) = 0</span>  затем  (A − λI)v = 0</div><div class=\"nt\">характеристическое уравнение, потом векторы</div></div><div class=\"ln\"><div class=\"fm\">det A = Πλ<sub>i</sub>,   tr A = Σλ<sub>i</sub></div><div class=\"nt\">проверка</div></div><div class=\"hd\">Q: When is a matrix diagonalisable</div><div class=\"ln\"><div class=\"fm\">все λ вещественны и μ<sub>a</sub> = μ<sub>g</sub> для каждого λ, Σμ<sub>a</sub> = n</div><div class=\"nt\">A = PΛP⁻¹</div></div><div class=\"ln\"><div class=\"fm\">симметричная всегда: A = QΛQᵀ, Q ортогональна</div></div><div class=\"hd\">Q: Definiteness of a quadratic form</div><div class=\"ln\"><div class=\"fm\">q = xᵀAx положительно определена ⇔ все λ &gt; 0 ⇔ все ведущие главные миноры &gt; 0 (Сильвестр)</div></div><div class=\"ln\"><div class=\"fm\">λ ≥ 0 — PSD;  λ &lt; 0 — ND;  разные знаки — неопределённая (седло)</div></div></div>"}, {"k": "exam", "h": "Эталонные ответы", "b": "<p><b>Eigenvalues/eigenvectors:</b> Av = λv, v ≠ 0. Compute λ from det(A − λI) = 0 (characteristic polynomial), then solve (A − λI)v = 0 for eigenvectors. det A = Πλᵢ, tr A = Σλᵢ.</p><p><b>Diagonalisable:</b> all eigenvalues real, algebraic multiplicities sum to n and equal geometric multiplicities (μₐ = μ_g); then A = PΛP⁻¹. Symmetric matrices are always diagonalisable with orthogonal Q: A = QΛQᵀ.</p><p><b>Definiteness of quadratic form xᵀAx:</b> positive definite iff all eigenvalues &gt; 0 (equivalently all leading principal minors &gt; 0, Sylvester); indefinite iff eigenvalues of both signs.</p>"}], "id": "la3"}, {"id": "pca", "title": "14. PCA", "goal": "Главные компоненты: что это, как считать и почему это собственные векторы.", "cards": [{"k": "story", "h": "Идея", "b": "<p>Данные в многих измерениях, но реально они «вытянуты» вдоль нескольких направлений. PCA (Principal Component Analysis) находит новые оси: первая ось идёт в направлении <b>наибольшего разброса</b>, вторая перпендикулярна ей и берёт наибольший оставшийся разброс, и т.д. Если несколько первых осей объясняют почти всю изменчивость, остальные можно выбросить: меньше измерений, почти без потерь.</p>\n <p><b>Алгоритм:</b> 1) центрировать данные (вычесть среднее каждой колонки; при разных единицах ещё и поделить на стандартное отклонение); 2) ковариационная матрица C = XᵀX/(N−1); 3) собственные числа λ и векторы v матрицы C; 4) отсортировать по убыванию λ; 5) проекции (scores) T = X V.</p>"}, {"k": "num", "h": "Числа: 4 точки в 2D", "b": "<p>Точки (1,2), (2,3), (3,5), (4,6). Средние (2.5; 4). Центрированные: (−1.5,−2), (−0.5,−1), (0.5,1), (1.5,2).</p>\n <pre class=\"code\">C = [ 1.667  2.333 ]    (var x = 1.667, var y = 3.333, cov = 2.333)\n    [ 2.333  3.333 ]</pre>\n <p>Собственные числа: <b>λ₁ = 4.978, λ₂ = 0.022</b> (проверка: сумма 5.0 = след C = 1.667 + 3.333). Собственный вектор для λ₁: <b>v₁ = (0.576; 0.817)</b>. Доля объяснённой дисперсии первой компонентой: 4.978/5.0 = <b>99.5%</b>: точки почти лежат на одной прямой. Scores (положение вдоль PC1): −2.50; −1.11; 1.11; 2.50.</p>\n <p>Как найти λ вручную: det(C − λI) = 0 ⇒ (1.667−λ)(3.333−λ) − 2.333² = 0 ⇒ λ² − 5λ + 0.111 = 0 ⇒ λ = (5 ± √(25−0.444))/2 = 4.978 или 0.022.</p>"}, {"k": "proof", "h": "Вывод: главные компоненты = собственные векторы ковариационной матрицы", "b": "<ol class=\"big\"><li>Проекция центрированных данных на единичный вектор w (‖w‖ = 1): z = Xw. Её дисперсия: Var(z) = (1/(N−1))‖Xw‖² = wᵀ[XᵀX/(N−1)]w = <b>wᵀCw</b>.</li>\n <li>Максимизируем wᵀCw при условии wᵀw = 1. Функция Лагранжа: L = wᵀCw − λ(wᵀw − 1).</li>\n <li>dL/dw = 2Cw − 2λw = 0 ⇒ <b>Cw = λw</b>: w — собственный вектор C.</li>\n <li>Тогда дисперсия wᵀCw = wᵀλw = <b>λ</b>. Чтобы дисперсия была максимальной, берём <b>наибольшее λ</b>: это PC1.</li>\n <li>Следующая компонента: максимизируем при дополнительном условии w ⟂ w₁. Так как C симметрична, её собственные векторы ортогональны, получаем второй по величине λ₂ и т.д.</li>\n <li><b>Итог:</b> сумма всех λ<sub>i</sub> = след C = полная дисперсия, а λ<sub>i</sub>/Σλ — доля объяснённой дисперсии i-й компонентой.</li></ol>\n <p><b>Связь с SVD:</b> если центрированная X = UΣVᵀ, то столбцы V — главные направления, а λ<sub>i</sub> = σ<sub>i</sub>²/(N−1); scores T = XV = UΣ.</p>"}, {"k": "formula", "h": "Термины", "b": "<table class=\"sym\"><tr><td>loadings</td><td>компоненты собственных векторов v: «вклад» исходных переменных в компоненту</td></tr><tr><td>scores</td><td>координаты наблюдений в новых осях: T = XV</td></tr><tr><td>explained variance</td><td>λ<sub>i</sub>/Σλ, кумулятивная доля для выбора числа компонент (напр. до 90–95%)</td></tr><tr><td>scree plot</td><td>график λ<sub>i</sub>, ищем «локоть»</td></tr><tr><td>масштаб</td><td>если переменные в разных единицах, стандартизировать (тогда C это матрица корреляций), иначе PCA «увидит» только переменную с наибольшим масштабом</td></tr></table>"}, {"k": "quiz", "q": "Чему равна сумма собственных чисел ковариационной матрицы?", "o": ["следу матрицы (полной дисперсии)", "определителю", "нулю", "единице"], "a": 0, "why": "Σλ = tr(C) = сумма дисперсий переменных."}, {"k": "quiz", "q": "Почему PC1 — собственный вектор с наибольшим λ?", "o": ["дисперсия проекции равна λ", "так принято", "он самый длинный", "у него определитель максимален"], "a": 0, "why": "Var = wᵀCw = λ для собственного вектора, поэтому максимум дисперсии это максимум λ."}, {"k": "note", "h": "Тетрадь: PCA", "b": "<div class=\"nb\"><div class=\"hd\">Данные и ковариационная матрица</div><div class=\"ln\"><div class=\"fm\">X — центрированные данные (вычли среднее)</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">C = <span class=\"fr\"><span>XᵀX</span><span>N − 1</span></span></span></div><div class=\"nt\">ковариационная матрица</div></div><div class=\"hd\">Дисперсия проекции на единичный w</div><div class=\"ln\"><div class=\"fm\">z = Xw,   Var(z) = <span class=\"fr\"><span>‖Xw‖²</span><span>N − 1</span></span> = wᵀ C w</div></div><div class=\"hd\">Максимизация (Лагранж)</div><div class=\"ln\"><div class=\"fm\">L(w,λ) = wᵀCw − λ(wᵀw − 1)</div></div><div class=\"ln\"><div class=\"fm\">dL/dw = 2Cw − 2λw = 0</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">C w = λ w</span></div><div class=\"nt\">w — собственный вектор C</div></div><div class=\"ln\"><div class=\"fm\">Var = wᵀCw = λ</div><div class=\"nt\">максимум дисперсии = наибольшее λ ⇒ PC1</div></div><div class=\"hd\">Итог</div><div class=\"ln\"><div class=\"fm\">доля i-й компоненты = <span class=\"fr\"><span>λ<sub>i</sub></span><span>Σ λ<sub>j</sub></span></span></div><div class=\"nt\"> Σλ = tr(C) — полная дисперсия</div></div><div class=\"ln\"><div class=\"fm\">scores:  T = X V</div></div><div class=\"ln\"><div class=\"fm\">пример: λ = 4.978 и 0.022,   <span class=\"fr\"><span>4.978</span><span>5.0</span></span> = 99.5%</div></div></div>"}, {"k": "note", "h": "Тетрадь: эталонные ответы на вопросы", "b": "<div class=\"nb\"><div class=\"hd\">Q: PCA algorithm step by step</div><div class=\"ln\"><div class=\"fm\">1. центрировать (и стандартизовать) данные: X → X − x̄</div></div><div class=\"ln\"><div class=\"fm\">2. ковариационная матрица  C = <span class=\"fr\"><span>XᵀX</span><span>N − 1</span></span></div><div class=\"nt\">p×p, симметричная</div></div><div class=\"ln\"><div class=\"fm\">3. собственное разложение  C = VΛVᵀ,  λ₁ ≥ λ₂ ≥ …</div><div class=\"nt\">столбцы V — главные направления</div></div><div class=\"ln\"><div class=\"fm\">4. оставить k векторов W<sub>k</sub> и спроецировать  Z = X·W<sub>k</sub></div><div class=\"nt\">новые координаты — главные компоненты</div></div><div class=\"hd\">Q: How many components to keep</div><div class=\"ln\"><div class=\"fm\">доля объяснённой дисперсии  <span class=\"fr\"><span>λ₁ + … + λ<sub>k</sub></span><span>λ₁ + … + λ<sub>p</sub></span></span> ≥ 90–95%</div><div class=\"nt\">накопленная</div></div><div class=\"ln\"><div class=\"fm\">график осыпи (scree plot): «локоть»; критерий Кайзера: λ &gt; среднего</div></div><div class=\"hd\">Q: Limitations of PCA</div><div class=\"ln\"><div class=\"fm\">линейна; чувствительна к масштабу признаков и выбросам</div><div class=\"nt\">стандартизуем</div></div><div class=\"ln\"><div class=\"fm\">большая дисперсия ≠ важность для задачи; компоненты трудно интерпретировать</div></div></div>"}, {"k": "exam", "h": "Ответ «PCA»", "b": "<ol class=\"big\"><li>Цель: снизить размерность, сохранив дисперсию.</li><li>Шаги: центрирование/стандартизация, C, собственные числа и векторы, сортировка.</li><li>Вывод через Лагранжа: Cw = λw.</li><li>Объяснённая дисперсия λ<sub>i</sub>/Σλ, выбор числа компонент (scree, кумулятивная доля).</li><li>Числовой пример 2D и связь с SVD.</li></ol>"}, {"k": "exam", "h": "Эталонный ответ (так можно писать на экзамене)", "b": "<p><b>PCA</b> — линейное снижение размерности: новые ортогональные оси (главные компоненты), упорядоченные по убыванию объяснённой дисперсии.</p>\n<p><b>Алгоритм:</b> центрировать (и при необходимости стандартизировать) данные; C = XᵀX/(N−1); найти собственные пары Cv = λv; упорядочить λ<sub>1</sub> ≥ λ<sub>2</sub> ≥ …; scores T = XV; оставить первые k компонент (по доле Σλ<sub>i</sub>/Σλ или scree plot).</p>\n<p><b>Вывод:</b> дисперсия проекции на единичный w равна wᵀCw. Максимизируем при wᵀw = 1 (Лагранж): Cw = λw, значение дисперсии = λ ⇒ PC1 — собственный вектор с наибольшим λ; следующие ортогональны. Σλ = tr(C) — полная дисперсия. Эквивалентно SVD: X = UΣVᵀ, λ = σ²/(N−1).</p>\n<p><b>Пример:</b> точки (1,2),(2,3),(3,5),(4,6): λ = 4.978 и 0.022, PC1 объясняет 99.5%.</p>"}], "part": "Часть 3 · Линейная алгебра и PCA"}, {"title": "15. Метрики и расстояния", "goal": "Что такое расстояние, какие бывают для векторов, множеств, строк и текстов.", "part": "Часть 4 · Кластеризация", "cards": [{"k": "story", "h": "Зачем", "b": "<p>Любая кластеризация начинается с вопроса «насколько два объекта похожи». <b>Метрика</b> d(x,y) — расстояние, удовлетворяющее аксиомам: 1) d ≥ 0; 2) d = 0 ⇔ x = y; 3) симметрия d(x,y) = d(y,x); 4) неравенство треугольника d(x,z) ≤ d(x,y) + d(y,z). Без аксиомы 2 — псевдометрика, без симметрии — квазиметрика, без треугольника — семиметрика. Любая норма даёт метрику d = ‖x − y‖.</p><p>Выбор метрики сильно влияет на результат кластеризации.</p>"}, {"k": "formula", "h": "Расстояния для векторов, множеств и строк", "b": "<table class=\"sym\"><tr><td>L₁ (Манхэттен)</td><td>Σ|xᵢ − yᵢ|</td></tr><tr><td>L₂ (Евклид)</td><td>√Σ(xᵢ − yᵢ)²; единственная Lₚ, инвариантная к поворотам</td></tr><tr><td>L∞ (Чебышёв)</td><td>max|xᵢ − yᵢ|</td></tr><tr><td>Хэмминг</td><td>число позиций, где значения различаются</td></tr><tr><td>Махаланобис</td><td>√((x − y)ᵀ Σ⁻¹ (x − y)), учитывает корреляции и масштабы признаков</td></tr><tr><td>косинусное</td><td>1 − cos θ = 1 − x·y/(‖x‖‖y‖); не метрика (нет неравенства треугольника), значения [0, 2]; угловое [0, π] — метрика</td></tr><tr><td>Жаккар</td><td>1 − |A ∩ B| / |A ∪ B| для множеств</td></tr><tr><td>Хаусдорф</td><td>max( sup_a inf_b d(a,b), sup_b inf_a d(a,b) ) между множествами</td></tr><tr><td>строки</td><td>Левенштейн (вставка, удаление, замена), Хэмминг, LCS, Дамерау–Левенштейн (+перестановка соседних)</td></tr><tr><td>тексты</td><td>bag-of-words + косинус, или k-граммы + Жаккар</td></tr></table>"}, {"k": "num", "h": "Числа", "b": "<p>Точки (1, 2) и (4, 6): разности (3, 4). L₁ = 7, L₂ = √(9 + 16) = <b>5</b>, L∞ = 4.</p><p><b>Жаккар:</b> A = {a, b, c}, B = {b, c, d}. |A ∩ B| = 2, |A ∪ B| = 4, расстояние 1 − 2/4 = <b>0.5</b>.</p><p><b>Косинусное:</b> x = (1, 0), y = (1, 1): cos θ = 1/√2 = 0.707, расстояние 1 − 0.707 = <b>0.293</b>. Косинусное сравнивает направления, а не длины: (1,1) и (5,5) дают расстояние 0.</p><p><b>Левенштейн:</b> kitten → sitting: k→s, e→i, вставить g, итого <b>3</b> операции.</p><p><b>Хэмминг:</b> 10110 и 11100 различаются в позициях 2 и 4, расстояние 2.</p>"}, {"k": "quiz", "q": "Какое расстояние не является метрикой?", "o": ["косинусное (1 − cos θ)", "L₁", "L₂", "Хэмминга"], "a": 0, "why": "Для 1 − cos θ не выполняется неравенство треугольника."}, {"k": "quiz", "q": "A = {1,2,3}, B = {3,4}. Расстояние Жаккара?", "o": ["0.75", "0.5", "0.25", "1"], "a": 0, "why": "|A∩B| = 1, |A∪B| = 4, 1 − 1/4 = 0.75."}, {"k": "note", "h": "Тетрадь: эталонные ответы на вопросы", "b": "<div class=\"nb\"><div class=\"hd\">Q: Define a metric</div><div class=\"ln\"><div class=\"fm\">d ≥ 0;  d(x,y) = 0 ⇔ x = y;  d(x,y) = d(y,x);  d(x,z) ≤ d(x,y) + d(y,z)</div><div class=\"nt\">аксиомы метрики</div></div><div class=\"ln\"><div class=\"fm\">L₁, L₂, L∞, Хэмминг, Махаланобис √((x−y)ᵀΣ⁻¹(x−y))</div><div class=\"nt\">примеры; косинусное 1 − cos θ не метрика</div></div><div class=\"hd\">Q: Hausdorff distance</div><div class=\"ln\"><div class=\"fm\">d<sub>H</sub>(A,B) = max( sup<sub>a∈A</sub> inf<sub>b∈B</sub> d(a,b),  sup<sub>b∈B</sub> inf<sub>a∈A</sub> d(a,b) )</div><div class=\"nt\">расстояние между множествами: насколько далеко худшая точка от другого множества</div></div><div class=\"hd\">Q: Distances for strings and texts</div><div class=\"ln\"><div class=\"fm\">Хэмминг (равная длина), Левенштейн (вставка, удаление, замена), LCS, Дамерау–Левенштейн</div><div class=\"nt\">kitten → sitting = 3</div></div><div class=\"ln\"><div class=\"fm\">тексты: bag-of-words + косинусное, k-граммы + Жаккар 1 − |A∩B|/|A∪B|</div></div></div>"}, {"k": "exam", "h": "Эталонные ответы", "b": "<p><b>Metric:</b> d ≥ 0; d(x,y) = 0 ⇔ x = y; symmetry; triangle inequality. Examples: Euclidean L₂, Manhattan L₁, Chebyshev L∞, Hamming, Mahalanobis.</p><p><b>Hausdorff distance:</b> distance between two sets, max of the largest distance from points of A to the nearest point of B and vice versa.</p><p><b>Strings:</b> Hamming, Levenshtein (insert/delete/substitute), LCS, Damerau–Levenshtein. <b>Texts:</b> bag-of-words + cosine distance, or k-grams + Jaccard.</p>"}], "id": "dist"}, {"id": "clu", "title": "16. Кластерный анализ", "goal": "k-means, иерархическая кластеризация, DBSCAN, оценка качества.", "cards": [{"k": "story", "h": "Идея", "b": "<p>Кластеризация (unsupervised) делит объекты на группы так, чтобы внутри группы объекты были похожи, а между группами различались. Правильных ответов заранее нет. Всё начинается с выбора <b>расстояния</b> (лекция Similarity): евклидово √Σ(a<sub>i</sub>−b<sub>i</sub>)², манхэттенское Σ|a<sub>i</sub>−b<sub>i</sub>|, косинусное и др. Выбор метрики влияет на результат.</p>\n <ul class=\"big\"><li><b>k-means:</b> число кластеров k задаёт пользователь; каждый кластер представлен центроидом (средним).</li><li><b>Иерархическая (AHC):</b> строим дерево слияний (дендрограмму), потом «режем» на нужном уровне.</li><li><b>DBSCAN:</b> кластеры = плотные области, шум выделяется; k не нужен.</li><li><b>Fuzzy c-means:</b> объект принадлежит нескольким кластерам с долями (степенями принадлежности).</li></ul>"}, {"k": "num", "h": "Числа: k-means на 1D, k = 2", "b": "<p>Точки 1, 2, 4, 9, 10, 12. Начальные центры c₁ = 1, c₂ = 9.</p>\n <table class=\"tbl\"><tr><th>итерация</th><th>назначение (к ближайшему)</th><th>новые центры</th></tr><tr><td>1</td><td>{1,2,4} → c₁; {9,10,12} → c₂</td><td>c₁ = 7/3 = 2.333; c₂ = 31/3 = 10.333</td></tr><tr><td>2</td><td>те же кластеры</td><td>центры не изменились: сошлось</td></tr></table>\n <p>Целевая функция (SSE) = Σ‖x − c‖² = (1.333²+0.333²+1.667²) + (1.333²+0.333²+1.667²) = 4.667 + 4.667 = <b>9.333</b>.</p>"}, {"k": "proof", "h": "Вывод k-means: почему центр = среднее и почему алгоритм сходится", "b": "<p>Цель: минимизировать J = Σ<sub>j</sub>Σ<sub>x∈C<sub>j</sub></sub>‖x − c<sub>j</sub>‖².</p>\n <ol class=\"big\"><li><b>Шаг назначения:</b> при фиксированных центрах каждая точка отнесена к ближайшему центру. Это минимизирует J по назначениям.</li>\n <li><b>Шаг обновления:</b> при фиксированных кластерах dJ/dc<sub>j</sub> = −2Σ<sub>x∈C<sub>j</sub></sub>(x − c<sub>j</sub>) = 0 ⇒ <b>c<sub>j</sub> = (1/|C<sub>j</sub>|)Σx</b>, то есть среднее точек кластера (J выпукла по c<sub>j</sub>, второй производной 2|C<sub>j</sub>| &gt; 0, это минимум).</li>\n <li>Каждый из двух шагов не увеличивает J, а число разбиений конечно, поэтому алгоритм сходится за конечное число шагов, но только к <b>локальному</b> минимуму: результат зависит от начальных центров (запускают несколько раз, k-means++).</li></ol>\n <p><b>Варианты из лекции:</b> k-medians (медиана вместо среднего, устойчивее к выбросам), k-medoids (центром служит реальная точка).</p>"}, {"k": "formula", "h": "Иерархическая, DBSCAN, качество", "b": "<table class=\"sym\"><tr><td>AHC: single / complete / average / Ward</td><td>расстояние между кластерами: минимум / максимум / среднее попарных / рост внутрикластерной дисперсии. Слияние ближайших пар снизу вверх, потом разрез дендрограммы.</td></tr>\n <tr><td>DBSCAN (ε, minPts)</td><td>core point: в ε-окрестности ≥ minPts точек; border: в окрестности core, но сам не core; остальные шум. Кластеры могут быть любой формы.</td></tr>\n <tr><td>Silhouette s = (b − a)/max(a, b)</td><td>a = среднее расстояние до своих, b = среднее расстояние до ближайшего другого кластера; s ∈ [−1,1], чем ближе к 1 тем лучше</td></tr>\n <tr><td>Elbow</td><td>график SSE от k, берём «локоть»</td></tr></table>\n <p><b>Числа:</b> в примере выше для точки 1: a = (1+3)/2 = 2, b = (8+9+11)/3 = 9.333, s = (9.333 − 2)/9.333 = <b>0.786</b>: точка хорошо сидит в своём кластере. Single linkage на тех же точках: сначала сливаются пары с расстоянием 1 ((1,2) и (9,10)), затем 4 с {1,2} и 12 с {9,10} (расстояние 2), последним сливаются два кластера на расстоянии 5 (между 4 и 9): на дендрограмме большой скачок высоты подсказывает k = 2.</p>"}, {"k": "formula", "h": "Иерархическая кластеризация (AHC): формулы связи", "b": "<p>Начинаем с N кластеров из одной точки и на каждом шаге сливаем два ближайших. «Расстояние между кластерами» A и B задают линкаж:</p><table class=\"sym\"><tr><td>single</td><td>d(A,B) = min d(a,b): ближайшие точки; склонен к «цепочкам»</td></tr><tr><td>complete</td><td>d(A,B) = max d(a,b): самые далёкие точки; компактные шарики</td></tr><tr><td>UPGMA (average)</td><td>d(A,B) = среднее всех попарных d(a,b)</td></tr><tr><td>WPGMA</td><td>d(A∪B, C) = (d(A,C) + d(B,C))/2: поровну независимо от размера</td></tr><tr><td>centroid</td><td>расстояние между центроидами (возможны инверсии на дендрограмме)</td></tr><tr><td>Ward</td><td>сливаем пару, дающую наименьший прирост внутрикластерной суммы квадратов</td></tr></table><p><b>Дендрограмма</b> — дерево слияний, высота = расстояние слияния; «срезая» её на нужной высоте, получаем кластеры. <b>Кофенетическая корреляция</b> — корреляция между исходными расстояниями и расстояниями на дендрограмме: чем ближе к 1, тем лучше дерево сохраняет структуру.</p>"}, {"k": "num", "h": "Числа: single и complete", "b": "<p>Точки на прямой: 1, 2, 6, 7, 15. Шаг 1: ближайшая пара (1,2) расстояние 1 (и (6,7)). Сливаем {1,2}, {6,7}. Далее: single: d({1,2},{6,7}) = min = 6 − 2 = 4; complete: max = 7 − 1 = 6. Точка 15 от {6,7}: single 8, complete 9. Слияние {1,2}+{6,7} происходит на высоте 4 (single) или 6 (complete), и только затем присоединяется 15.</p>"}, {"k": "formula", "h": "DBSCAN, fuzzy c-means и оценка качества", "b": "<table class=\"sym\"><tr><td>DBSCAN (ε, minPts)</td><td>core-точка: в её ε-окрестности ≥ minPts точек; border — в окрестности core, но сама не core; остальные noise. Кластер = связные через core-точки. Находит кластеры произвольной формы и выбросы, число кластеров не задаётся; плохо при разной плотности</td></tr><tr><td>fuzzy c-means</td><td>минимизирует Σᵢ Σⱼ uᵢⱼᵐ‖xᵢ − cⱼ‖², uᵢⱼ — степени принадлежности (Σⱼ uᵢⱼ = 1), m &gt; 1 — «размытость»; при m → 1 получаем k-means</td></tr><tr><td>Davies–Bouldin</td><td>среднее по кластерам max((sᵢ + sⱼ)/d(cᵢ,cⱼ)); меньше = лучше</td></tr><tr><td>Calinski–Harabasz</td><td>(межкластерный разброс/(k−1)) / (внутрикластерный/(N−k)); больше = лучше</td></tr><tr><td>силуэт</td><td>(b − a)/max(a,b): a — среднее до своих, b — до ближайшего чужого кластера; [−1, 1], больше = лучше</td></tr></table>"}, {"k": "formula", "h": "k-means: целевая функция, варианты и выбор k", "b": "<table class=\"sym\"><tr><td>WCSS = Σᵢ Σ_{x∈Cᵢ} ‖x − μᵢ‖²</td><td>внутрикластерная сумма квадратов (within-cluster sum of squares), которую минимизирует k-means; = Σ|Cᵢ|·var(Cᵢ) = ‖X − ZU‖²_F; NP-трудная задача</td></tr><tr><td>лемма 1</td><td>при фиксированном разбиении лучшие представители — центроиды (средние): минимум квадратичной функции в точке Σx/|C|</td></tr><tr><td>лемма 2</td><td>при фиксированных центрах лучшее разбиение — каждая точка к ближайшему центру</td></tr><tr><td>алгоритм Ллойда</td><td>повторяем «назначение — обновление»; WCSS не растёт и ограничена снизу 0, поэтому сходится (но к локальному минимуму, поэтому запускают несколько раз). Сложность O(N·k·p·i)</td></tr><tr><td>k-means++</td><td>новый стартовый центр выбирается с вероятностью ∝ d²(x, уже выбранные центры): разносит центры; результат O(log k)-конкурентен с оптимумом</td></tr><tr><td>k-medians</td><td>расстояние L1, центр — медиана: робастнее к выбросам</td></tr><tr><td>k-medoids (PAM)</td><td>центр — реальная точка данных, любая мера несходства; фазы BUILD и SWAP, O(k(N−k)²) на итерацию; CLARA, CLARANS для больших N</td></tr><tr><td>выбор k</td><td>метод локтя (график WCSS от k: ищем излом), силуэт, DB, CH</td></tr></table>"}, {"k": "num", "h": "Числа: назначение и центроиды (из лекции)", "b": "<p>Точка x₁ = (1, 0); центры μ₁ = (−2, 1), μ₂ = (−10, 10), μ₃ = (3, −1). Расстояния: √10 ≈ 3.16, √221 ≈ 14.9, √5 ≈ 2.24. Ближайший μ₃, значит x₁ ∈ C₃.</p><p>Обновление: для кластера C₃ = {1, 4, 6, 8} центр = среднее его точек, μ₃ = (7/4, −3/2); для C₁ = {2, 3, 7} получается μ₁ = (−7/3, 2/3).</p><p><b>Силуэт одной точки:</b> a = среднее расстояние до точек своего кластера, b = среднее расстояние до точек ближайшего чужого кластера, s = (b − a)/max(a, b). Например a = 1, b = 3: s = 2/3 (хорошо). a = 3, b = 1: s = −2/3 (точка скорее в чужом кластере).</p>"}, {"k": "quiz", "q": "Какой линкаж склонен к эффекту «цепочки»?", "o": ["single", "complete", "Ward", "centroid"], "a": 0, "why": "Single соединяет кластеры по одной близкой паре точек."}, {"k": "quiz", "q": "DBSCAN: точка с ≥ minPts соседей в ε-окрестности называется…", "o": ["core (ядровая)", "border", "noise", "centroid"], "a": 0, "why": "Ядровые точки задают кластеры."}, {"k": "quiz", "q": "Чему равен центроид k-means для кластера {1, 2, 4}?", "o": ["7/3 ≈ 2.33", "2", "4", "1"], "a": 0, "why": "Среднее: (1+2+4)/3 = 7/3."}, {"k": "quiz", "q": "Чем DBSCAN отличается от k-means?", "o": ["не требует k и находит шум и кластеры любой формы", "всегда быстрее", "работает только с 1D", "использует центроиды"], "a": 0, "why": "Параметры ε и minPts вместо k."}, {"k": "note", "h": "Тетрадь: k-means", "b": "<div class=\"nb\"><div class=\"hd\">Цель</div><div class=\"ln\"><div class=\"fm\">J = Σ<sub>j=1</sub><sup>k</sup> Σ<sub>x∈C<sub>j</sub></sub> ‖x − c<sub>j</sub>‖²</div><div class=\"nt\">сумма квадратов расстояний до центров</div></div><div class=\"hd\">Шаг обновления центра</div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>dJ</span><span>dc<sub>j</sub></span></span> = −2 Σ<sub>x∈C<sub>j</sub></sub> (x − c<sub>j</sub>) = 0</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">c<sub>j</sub> = <span class=\"fr\"><span>1</span><span>|C<sub>j</sub>|</span></span> Σ<sub>x∈C<sub>j</sub></sub> x</span></div><div class=\"nt\">центр = среднее точек кластера</div></div><div class=\"hd\">Silhouette</div><div class=\"ln\"><div class=\"fm\">s = <span class=\"fr\"><span>b − a</span><span>max(a, b)</span></span></div><div class=\"nt\">a — до своих, b — до ближайшего чужого кластера</div></div><div class=\"ln\"><div class=\"fm\">пример: a = 2, b = 9.33,   s = <span class=\"fr\"><span>9.33 − 2</span><span>9.33</span></span> = 0.786</div></div></div>"}, {"k": "note", "h": "Тетрадь: эталонные ответы на вопросы", "b": "<div class=\"nb\"><div class=\"hd\">Q: Agglomerative hierarchical clustering</div><div class=\"ln\"><div class=\"fm\">старт: N кластеров по одной точке; на каждом шаге сливаем два ближайших</div><div class=\"nt\">пока не останется один</div></div><div class=\"ln\"><div class=\"fm\">результат — дендрограмма; срез на высоте h даёт кластеры</div></div><div class=\"hd\">Q: Single, complete, average linkage</div><div class=\"ln\"><div class=\"fm\">single: d(A,B) = min d(a,b);  complete: max d(a,b);  average (UPGMA): среднее d(a,b)</div><div class=\"nt\">single даёт цепочки, complete — компактные шары</div></div><div class=\"hd\">Q: How to read a dendrogram</div><div class=\"ln\"><div class=\"fm\">высота слияния = расстояние между кластерами; длинная «ветка» без слияний = хорошо разделённые кластеры</div><div class=\"nt\">кофенетическая корреляция проверяет качество дерева</div></div><div class=\"hd\">Q: k-means as optimisation; Lloyd and its convergence</div><div class=\"ln\"><div class=\"fm\">WCSS = <span class=\"sm\"><span>k</span><b>Σ</b><span>i=1</span></span> <span class=\"sm\"><span></span><b>Σ</b><span>x∈C<sub>i</sub></span></span> ‖x − μ<sub>i</sub>‖² → min</div><div class=\"nt\">NP-трудно</div></div><div class=\"ln\"><div class=\"fm\">шаг 1: каждую точку к ближайшему центру (уменьшает WCSS, лемма о назначении)</div></div><div class=\"ln\"><div class=\"fm\">шаг 2: центр = среднее кластера (уменьшает WCSS, центроид минимизирует квадратичную функцию)</div></div><div class=\"ln\"><div class=\"fm\">WCSS не растёт и ≥ 0 ⇒ сходится; число разбиений конечно ⇒ конечное число шагов; результат — локальный минимум</div><div class=\"nt\">несколько стартов, k-means++</div></div><div class=\"hd\">Q: DBSCAN, hard vs soft, silhouette</div><div class=\"ln\"><div class=\"fm\">DBSCAN(ε, minPts): core / border / noise; кластер = связные core-точки; произвольная форма, выбросы</div><div class=\"nt\">k не нужно</div></div><div class=\"ln\"><div class=\"fm\">hard: каждая точка в одном кластере; soft (fuzzy c-means): степени принадлежности u<sub>ij</sub>, Σ<sub>j</sub>u<sub>ij</sub> = 1</div></div><div class=\"ln\"><div class=\"fm\">s = <span class=\"fr\"><span>b − a</span><span>max(a, b)</span></span></div><div class=\"nt\">a — до своих, b — до ближайшего чужого; [−1, 1], больше лучше</div></div></div>"}, {"k": "exam", "h": "Ответ «Cluster analysis»", "b": "<ol class=\"big\"><li>Цель и отсутствие меток; расстояния/сходство.</li><li>Основные семейства: разбиения (k-means, k-medoids), иерархические (AHC, linkage, дендрограмма), плотностные (DBSCAN), fuzzy.</li><li>k-means: шаги, целевая функция, вывод среднего, локальный минимум.</li><li>Оценка: silhouette, elbow; выбор k.</li><li>Мини-пример 1D (как выше).</li></ol>"}, {"k": "exam", "h": "Эталонный ответ (так можно писать на экзамене)", "b": "<p><b>Cluster analysis</b> — разбиение объектов на группы (кластеры) без заранее заданных меток так, чтобы внутри кластера объекты похожи, между кластерами различны. Основа — мера сходства/расстояние (евклидово, манхэттенское, косинусное…).</p>\n<p><b>Методы:</b> <b>k-means</b> (число k задано; назначение к ближайшему центру, пересчёт центров как среднего; минимизирует Σ‖x−c<sub>j</sub>‖², сходится к локальному минимуму; варианты k-medians, k-medoids); <b>AHC</b> (иерархия слияний, linkage single/complete/average/Ward, дендрограмма); <b>DBSCAN</b> (ε, minPts; плотностные кластеры любой формы + шум); <b>fuzzy c-means</b> (степени принадлежности).</p>\n<p><b>Качество:</b> silhouette s = (b−a)/max(a,b), elbow по SSE.</p>\n<p><b>Пример:</b> точки 1,2,4,9,10,12, k = 2: центры 2.33 и 10.33, SSE = 9.33.</p>"}], "part": "Часть 4 · Кластеризация"}, {"title": "17. Оптимальность и выпуклость", "goal": "Условия минимума, выпуклые множества и функции, почему выпуклость важна.", "part": "Часть 5 · Оптимизация", "cards": [{"k": "story", "h": "Для чего и как нужна оптимизация", "b": "<div class=\"nb ex\"><div class=\"hd\">Зачем нужна оптимизация</div><p>Почти любая модель в этом курсе обучается одним способом: мы задаём <b>функцию ошибки</b> E(параметры) и ищем параметры, при которых E наименьшая. Поиск наименьшего значения функции и называется <b>оптимизацией</b>. Без неё модель остаётся формулой с неизвестными числами.</p><div class=\"hd\">Где это уже встречалось</div><div class=\"ln\"><div class=\"fm\">E(α, β) = Σ (y − αx − β)²  →  min</div><div class=\"nt\">OLS: ищем α и β, сумма квадратов остатков</div></div><div class=\"ln\"><div class=\"fm\">J = Σ ‖x − c‖²  →  min</div><div class=\"nt\">k-means: ищем центры кластеров c</div></div><div class=\"ln\"><div class=\"fm\">−ln L(β)  →  min</div><div class=\"nt\">логистическая регрессия: ищем β (максимум правдоподобия = минимум минус логарифма)</div></div><div class=\"ln\"><div class=\"fm\">E(a) = Σ (y − f(x, a))²  →  min</div><div class=\"nt\">нелинейный МНК (Gauss–Newton)</div></div><div class=\"hd\">Как её решают: два случая</div><p><b>Случай 1.</b> Условие минимума dE/dα = 0 даёт <b>линейные</b> уравнения (так у OLS и полиномов). Тогда есть формула, и ответ находится за один шаг. Причина: E квадратична по параметрам, поэтому её производная линейна.</p><p><b>Случай 2.</b> Уравнения dE/dβ = 0 <b>нелинейны</b> (логистическая регрессия, нелинейный МНК, нейросети). Формулы нет, поэтому идём к минимуму шагами: x<sub>k+1</sub> = x<sub>k</sub> + t·d. Это итерационные методы.</p><div class=\"hd\">Что решает каждая следующая тема</div><div class=\"ln\"><div class=\"fm\">17. Выпуклость</div><div class=\"nt\">когда найденный минимум верный: у выпуклой E любой минимум глобальный, ловушек нет</div></div><div class=\"ln\"><div class=\"fm\">18. Градиентный спуск</div><div class=\"nt\">идём вниз по склону, против градиента</div></div><div class=\"ln\"><div class=\"fm\">19. Поиск шага</div><div class=\"nt\">какой длины шаг t, чтобы не перескочить и не ползти</div></div><div class=\"ln\"><div class=\"fm\">20. Скорость сходимости</div><div class=\"nt\">за сколько шагов дойдём, зависит от числа обусловленности κ</div></div><div class=\"ln\"><div class=\"fm\">21. Тяжёлый шар и CG</div><div class=\"nt\">ускорение за счёт «инерции» и сопряжённых направлений</div></div><div class=\"ln\"><div class=\"fm\">22. Метод Ньютона</div><div class=\"nt\">учитывает кривизну (вторые производные), сходится быстрее всех, но шаг дороже</div></div><div class=\"hd\">Числа: минимизируем E(a) = (a − 3)²</div><div class=\"ln\"><div class=\"fm\">dE/da = 2(a − 3)</div><div class=\"nt\">производная; равна нулю при a = 3, это ответ по формуле</div></div><div class=\"ln\"><div class=\"fm\">a₀ = 0:   dE/da = −6,   a₁ = 0 − 0.25·(−6) = 1.5</div><div class=\"nt\">шаг t = 0.25: идём против производной</div></div><div class=\"ln\"><div class=\"fm\">a₁ = 1.5:   dE/da = −3,   a₂ = 1.5 + 0.75 = 2.25</div></div><div class=\"ln\"><div class=\"fm\">a₂
