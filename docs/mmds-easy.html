<div class=\"nt\">теорема лекции</div></div><div class=\"ln\"><div class=\"fm\">условие старта:  ‖x₀ − x*‖ ≤ m/(2L)</div></div></div>"}, {"k": "exam", "h": "Ответ «Newton method»", "b": "<ol class=\"big\"><li>Идея: квадратичная модель функции (Тейлор до 2-го порядка).</li><li>Вывод: ∇m = 0 ⇒ d = −H⁻¹∇f, x<sub>k+1</sub> = x<sub>k</sub> + αd (α = 1).</li><li>Условия: H положительно определён (иначе d не убывающее).</li><li>Скорость: локально квадратичная (теорема с L и m), глобально нужен line search (Wolfe).</li><li>Плюсы/минусы относительно GD; пример 1D.</li></ol>"}, {"k": "exam", "h": "Эталонный ответ (так можно писать на экзамене)", "b": "<p><b>Newton method.</b> Метод второго порядка. В точке x<sub>k</sub> функцию заменяют квадратичной моделью m(d) = f + ∇fᵀd + ½dᵀHd. При H ≻ 0 минимум модели: ∇m = ∇f + Hd = 0 ⇒ <b>d = −H⁻¹∇f</b> (ньютоновское направление), x<sub>k+1</sub> = x<sub>k</sub> + αd, «естественный» шаг α = 1. Это направление убывания: ∇fᵀd = −∇fᵀH⁻¹∇f &lt; 0.</p>\n<p><b>Сходимость:</b> если Гессиан липшицев (L), H(x*) ⪰ mI и ‖x₀−x*‖ ≤ m/(2L), то ‖x<sub>k+1</sub>−x*‖ ≤ (L/m)‖x<sub>k</sub>−x*‖² — квадратичная (локальная); глобально нужен line search с условиями Вольфе.</p>\n<p><b>Плюсы/минусы:</b> быстро вблизи решения (для квадратичных функций за 1 шаг), но нужен Гессиан (дорого, O(n³)), требуется H ≻ 0.</p>\n<p><b>1D:</b> x<sub>k+1</sub> = x<sub>k</sub> − f′/f″; пример √2: 1 → 1.5 → 1.4167 → 1.41422.</p>"}]}, {"id": "pca", "title": "10. PCA", "goal": "Главные компоненты: что это, как считать и почему это собственные векторы.", "cards": [{"k": "story", "h": "Идея", "b": "<p>Данные в многих измерениях, но реально они «вытянуты» вдоль нескольких направлений. PCA (Principal Component Analysis) находит новые оси: первая ось идёт в направлении <b>наибольшего разброса</b>, вторая перпендикулярна ей и берёт наибольший оставшийся разброс, и т.д. Если несколько первых осей объясняют почти всю изменчивость, остальные можно выбросить: меньше измерений, почти без потерь.</p>\n <p><b>Алгоритм:</b> 1) центрировать данные (вычесть среднее каждой колонки; при разных единицах ещё и поделить на стандартное отклонение); 2) ковариационная матрица C = XᵀX/(N−1); 3) собственные числа λ и векторы v матрицы C; 4) отсортировать по убыванию λ; 5) проекции (scores) T = X V.</p>"}, {"k": "num", "h": "Числа: 4 точки в 2D", "b": "<p>Точки (1,2), (2,3), (3,5), (4,6). Средние (2.5; 4). Центрированные: (−1.5,−2), (−0.5,−1), (0.5,1), (1.5,2).</p>\n <pre class=\"code\">C = [ 1.667  2.333 ]    (var x = 1.667, var y = 3.333, cov = 2.333)\n    [ 2.333  3.333 ]</pre>\n <p>Собственные числа: <b>λ₁ = 4.978, λ₂ = 0.022</b> (проверка: сумма 5.0 = след C = 1.667 + 3.333). Собственный вектор для λ₁: <b>v₁ = (0.576; 0.817)</b>. Доля объяснённой дисперсии первой компонентой: 4.978/5.0 = <b>99.5%</b>: точки почти лежат на одной прямой. Scores (положение вдоль PC1): −2.50; −1.11; 1.11; 2.50.</p>\n <p>Как найти λ вручную: det(C − λI) = 0 ⇒ (1.667−λ)(3.333−λ) − 2.333² = 0 ⇒ λ² − 5λ + 0.111 = 0 ⇒ λ = (5 ± √(25−0.444))/2 = 4.978 или 0.022.</p>"}, {"k": "proof", "h": "Вывод: главные компоненты = собственные векторы ковариационной матрицы", "b": "<ol class=\"big\"><li>Проекция центрированных данных на единичный вектор w (‖w‖ = 1): z = Xw. Её дисперсия: Var(z) = (1/(N−1))‖Xw‖² = wᵀ[XᵀX/(N−1)]w = <b>wᵀCw</b>.</li>\n <li>Максимизируем wᵀCw при условии wᵀw = 1. Функция Лагранжа: L = wᵀCw − λ(wᵀw − 1).</li>\n <li>∂L/∂w = 2Cw − 2λw = 0 ⇒ <b>Cw = λw</b>: w — собственный вектор C.</li>\n <li>Тогда дисперсия wᵀCw = wᵀλw = <b>λ</b>. Чтобы дисперсия была максимальной, берём <b>наибольшее λ</b>: это PC1.</li>\n <li>Следующая компонента: максимизируем при дополнительном условии w ⟂ w₁. Так как C симметрична, её собственные векторы ортогональны, получаем второй по величине λ₂ и т.д.</li>\n <li><b>Итог:</b> сумма всех λ<sub>i</sub> = след C = полная дисперсия, а λ<sub>i</sub>/Σλ — доля объяснённой дисперсии i-й компонентой.</li></ol>\n <p><b>Связь с SVD:</b> если центрированная X = UΣVᵀ, то столбцы V — главные направления, а λ<sub>i</sub> = σ<sub>i</sub>²/(N−1); scores T = XV = UΣ.</p>"}, {"k": "formula", "h": "Термины", "b": "<table class=\"sym\"><tr><td>loadings</td><td>компоненты собственных векторов v: «вклад» исходных переменных в компоненту</td></tr><tr><td>scores</td><td>координаты наблюдений в новых осях: T = XV</td></tr><tr><td>explained variance</td><td>λ<sub>i</sub>/Σλ, кумулятивная доля для выбора числа компонент (напр. до 90–95%)</td></tr><tr><td>scree plot</td><td>график λ<sub>i</sub>, ищем «локоть»</td></tr><tr><td>масштаб</td><td>если переменные в разных единицах, стандартизировать (тогда C это матрица корреляций), иначе PCA «увидит» только переменную с наибольшим масштабом</td></tr></table>"}, {"k": "quiz", "q": "Чему равна сумма собственных чисел ковариационной матрицы?", "o": ["следу матрицы (полной дисперсии)", "определителю", "нулю", "единице"], "a": 0, "why": "Σλ = tr(C) = сумма дисперсий переменных."}, {"k": "quiz", "q": "Почему PC1 — собственный вектор с наибольшим λ?", "o": ["дисперсия проекции равна λ", "так принято", "он самый длинный", "у него определитель максимален"], "a": 0, "why": "Var = wᵀCw = λ для собственного вектора, поэтому максимум дисперсии это максимум λ."}, {"k": "note", "h": "Тетрадь: PCA", "b": "<div class=\"nb\"><div class=\"hd\">Данные и ковариационная матрица</div><div class=\"ln\"><div class=\"fm\">X — центрированные данные (вычли среднее)</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">C = <span class=\"fr\"><span>XᵀX</span><span>N − 1</span></span></span></div><div class=\"nt\">ковариационная матрица</div></div><div class=\"hd\">Дисперсия проекции на единичный w</div><div class=\"ln\"><div class=\"fm\">z = Xw,   Var(z) = <span class=\"fr\"><span>‖Xw‖²</span><span>N − 1</span></span> = wᵀ C w</div></div><div class=\"hd\">Максимизация (Лагранж)</div><div class=\"ln\"><div class=\"fm\">L(w,λ) = wᵀCw − λ(wᵀw − 1)</div></div><div class=\"ln\"><div class=\"fm\">∂L/∂w = 2Cw − 2λw = 0</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">C w = λ w</span></div><div class=\"nt\">w — собственный вектор C</div></div><div class=\"ln\"><div class=\"fm\">Var = wᵀCw = λ</div><div class=\"nt\">максимум дисперсии = наибольшее λ ⇒ PC1</div></div><div class=\"hd\">Итог</div><div class=\"ln\"><div class=\"fm\">доля i-й компоненты = <span class=\"fr\"><span>λ<sub>i</sub></span><span>Σ λ<sub>j</sub></span></span></div><div class=\"nt\"> Σλ = tr(C) — полная дисперсия</div></div><div class=\"ln\"><div class=\"fm\">scores:  T = X V</div></div><div class=\"ln\"><div class=\"fm\">пример: λ = 4.978 и 0.022,   <span class=\"fr\"><span>4.978</span><span>5.0</span></span> = 99.5%</div></div></div>"}, {"k": "exam", "h": "Ответ «PCA»", "b": "<ol class=\"big\"><li>Цель: снизить размерность, сохранив дисперсию.</li><li>Шаги: центрирование/стандартизация, C, собственные числа и векторы, сортировка.</li><li>Вывод через Лагранжа: Cw = λw.</li><li>Объяснённая дисперсия λ<sub>i</sub>/Σλ, выбор числа компонент (scree, кумулятивная доля).</li><li>Числовой пример 2D и связь с SVD.</li></ol>"}, {"k": "exam", "h": "Эталонный ответ (так можно писать на экзамене)", "b": "<p><b>PCA</b> — линейное снижение размерности: новые ортогональные оси (главные компоненты), упорядоченные по убыванию объяснённой дисперсии.</p>\n<p><b>Алгоритм:</b> центрировать (и при необходимости стандартизировать) данные; C = XᵀX/(N−1); найти собственные пары Cv = λv; упорядочить λ<sub>1</sub> ≥ λ<sub>2</sub> ≥ …; scores T = XV; оставить первые k компонент (по доле Σλ<sub>i</sub>/Σλ или scree plot).</p>\n<p><b>Вывод:</b> дисперсия проекции на единичный w равна wᵀCw. Максимизируем при wᵀw = 1 (Лагранж): Cw = λw, значение дисперсии = λ ⇒ PC1 — собственный вектор с наибольшим λ; следующие ортогональны. Σλ = tr(C) — полная дисперсия. Эквивалентно SVD: X = UΣVᵀ, λ = σ²/(N−1).</p>\n<p><b>Пример:</b> точки (1,2),(2,3),(3,5),(4,6): λ = 4.978 и 0.022, PC1 объясняет 99.5%.</p>"}]}, {"id": "clu", "title": "11. Кластерный анализ", "goal": "k-means, иерархическая кластеризация, DBSCAN, оценка качества.", "cards": [{"k": "story", "h": "Идея", "b": "<p>Кластеризация (unsupervised) делит объекты на группы так, чтобы внутри группы объекты были похожи, а между группами различались. Правильных ответов заранее нет. Всё начинается с выбора <b>расстояния</b> (лекция Similarity): евклидово √Σ(a<sub>i</sub>−b<sub>i</sub>)², манхэттенское Σ|a<sub>i</sub>−b<sub>i</sub>|, косинусное и др. Выбор метрики влияет на результат.</p>\n <ul class=\"big\"><li><b>k-means:</b> число кластеров k задаёт пользователь; каждый кластер представлен центроидом (средним).</li><li><b>Иерархическая (AHC):</b> строим дерево слияний (дендрограмму), потом «режем» на нужном уровне.</li><li><b>DBSCAN:</b> кластеры = плотные области, шум выделяется; k не нужен.</li><li><b>Fuzzy c-means:</b> объект принадлежит нескольким кластерам с долями (степенями принадлежности).</li></ul>"}, {"k": "num", "h": "Числа: k-means на 1D, k = 2", "b": "<p>Точки 1, 2, 4, 9, 10, 12. Начальные центры c₁ = 1, c₂ = 9.</p>\n <table class=\"tbl\"><tr><th>итерация</th><th>назначение (к ближайшему)</th><th>новые центры</th></tr><tr><td>1</td><td>{1,2,4} → c₁; {9,10,12} → c₂</td><td>c₁ = 7/3 = 2.333; c₂ = 31/3 = 10.333</td></tr><tr><td>2</td><td>те же кластеры</td><td>центры не изменились: сошлось</td></tr></table>\n <p>Целевая функция (SSE) = Σ‖x − c‖² = (1.333²+0.333²+1.667²) + (1.333²+0.333²+1.667²) = 4.667 + 4.667 = <b>9.333</b>.</p>"}, {"k": "proof", "h": "Вывод k-means: почему центр = среднее и почему алгоритм сходится", "b": "<p>Цель: минимизировать J = Σ<sub>j</sub>Σ<sub>x∈C<sub>j</sub></sub>‖x − c<sub>j</sub>‖².</p>\n <ol class=\"big\"><li><b>Шаг назначения:</b> при фиксированных центрах каждая точка отнесена к ближайшему центру. Это минимизирует J по назначениям.</li>\n <li><b>Шаг обновления:</b> при фиксированных кластерах ∂J/∂c<sub>j</sub> = −2Σ<sub>x∈C<sub>j</sub></sub>(x − c<sub>j</sub>) = 0 ⇒ <b>c<sub>j</sub> = (1/|C<sub>j</sub>|)Σx</b>, то есть среднее точек кластера (J выпукла по c<sub>j</sub>, второй производной 2|C<sub>j</sub>| &gt; 0, это минимум).</li>\n <li>Каждый из двух шагов не увеличивает J, а число разбиений конечно, поэтому алгоритм сходится за конечное число шагов, но только к <b>локальному</b> минимуму: результат зависит от начальных центров (запускают несколько раз, k-means++).</li></ol>\n <p><b>Варианты из лекции:</b> k-medians (медиана вместо среднего, устойчивее к выбросам), k-medoids (центром служит реальная точка).</p>"}, {"k": "formula", "h": "Иерархическая, DBSCAN, качество", "b": "<table class=\"sym\"><tr><td>AHC: single / complete / average / Ward</td><td>расстояние между кластерами: минимум / максимум / среднее попарных / рост внутрикластерной дисперсии. Слияние ближайших пар снизу вверх, потом разрез дендрограммы.</td></tr>\n <tr><td>DBSCAN (ε, minPts)</td><td>core point: в ε-окрестности ≥ minPts точек; border: в окрестности core, но сам не core; остальные шум. Кластеры могут быть любой формы.</td></tr>\n <tr><td>Silhouette s = (b − a)/max(a, b)</td><td>a = среднее расстояние до своих, b = среднее расстояние до ближайшего другого кластера; s ∈ [−1,1], чем ближе к 1 тем лучше</td></tr>\n <tr><td>Elbow</td><td>график SSE от k, берём «локоть»</td></tr></table>\n <p><b>Числа:</b> в примере выше для точки 1: a = (1+3)/2 = 2, b = (8+9+11)/3 = 9.333, s = (9.333 − 2)/9.333 = <b>0.786</b>: точка хорошо сидит в своём кластере. Single linkage на тех же точках: сначала сливаются пары с расстоянием 1 ((1,2) и (9,10)), затем 4 с {1,2} и 12 с {9,10} (расстояние 2), последним сливаются два кластера на расстоянии 5 (между 4 и 9): на дендрограмме большой скачок высоты подсказывает k = 2.</p>"}, {"k": "quiz", "q": "Чему равен центроид k-means для кластера {1, 2, 4}?", "o": ["7/3 ≈ 2.33", "2", "4", "1"], "a": 0, "why": "Среднее: (1+2+4)/3 = 7/3."}, {"k": "quiz", "q": "Чем DBSCAN отличается от k-means?", "o": ["не требует k и находит шум и кластеры любой формы", "всегда быстрее", "работает только с 1D", "использует центроиды"], "a": 0, "why": "Параметры ε и minPts вместо k."}, {"k": "note", "h": "Тетрадь: k-means", "b": "<div class=\"nb\"><div class=\"hd\">Цель</div><div class=\"ln\"><div class=\"fm\">J = Σ<sub>j=1</sub><sup>k</sup> Σ<sub>x∈C<sub>j</sub></sub> ‖x − c<sub>j</sub>‖²</div><div class=\"nt\">сумма квадратов расстояний до центров</div></div><div class=\"hd\">Шаг обновления центра</div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>∂J</span><span>∂c<sub>j</sub></span></span> = −2 Σ<sub>x∈C<sub>j</sub></sub> (x − c<sub>j</sub>) = 0</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">c<sub>j</sub> = <span class=\"fr\"><span>1</span><span>|C<sub>j</sub>|</span></span> Σ<sub>x∈C<sub>j</sub></sub> x</span></div><div class=\"nt\">центр = среднее точек кластера</div></div><div class=\"hd\">Silhouette</div><div class=\"ln\"><div class=\"fm\">s = <span class=\"fr\"><span>b − a</span><span>max(a, b)</span></span></div><div class=\"nt\">a — до своих, b — до ближайшего чужого кластера</div></div><div class=\"ln\"><div class=\"fm\">пример: a = 2, b = 9.33,   s = <span class=\"fr\"><span>9.33 − 2</span><span>9.33</span></span> = 0.786</div></div></div>"}, {"k": "exam", "h": "Ответ «Cluster analysis»", "b": "<ol class=\"big\"><li>Цель и отсутствие меток; расстояния/сходство.</li><li>Основные семейства: разбиения (k-means, k-medoids), иерархические (AHC, linkage, дендрограмма), плотностные (DBSCAN), fuzzy.</li><li>k-means: шаги, целевая функция, вывод среднего, локальный минимум.</li><li>Оценка: silhouette, elbow; выбор k.</li><li>Мини-пример 1D (как выше).</li></ol>"}, {"k": "exam", "h": "Эталонный ответ (так можно писать на экзамене)", "b": "<p><b>Cluster analysis</b> — разбиение объектов на группы (кластеры) без заранее заданных меток так, чтобы внутри кластера объекты похожи, между кластерами различны. Основа — мера сходства/расстояние (евклидово, манхэттенское, косинусное…).</p>\n<p><b>Методы:</b> <b>k-means</b> (число k задано; назначение к ближайшему центру, пересчёт центров как среднего; минимизирует Σ‖x−c<sub>j</sub>‖², сходится к локальному минимуму; варианты k-medians, k-medoids); <b>AHC</b> (иерархия слияний, linkage single/complete/average/Ward, дендрограмма); <b>DBSCAN</b> (ε, minPts; плотностные кластеры любой формы + шум); <b>fuzzy c-means</b> (степени принадлежности).</p>\n<p><b>Качество:</b> silhouette s = (b−a)/max(a,b), elbow по SSE.</p>\n<p><b>Пример:</b> точки 1,2,4,9,10,12, k = 2: центры 2.33 и 10.33, SSE = 9.33.</p>"}]}, {"id": "surv", "title": "12. Survival analysis (Davide)", "goal": "Цензурирование, S(t), Каплан–Майер, log-rank, hazard, модель Кокса. По слайдам Davide.", "cards": [{"k": "story", "h": "Что это и зачем", "b": "<p>Анализ выживаемости (= lifetime data analysis) изучает <b>время до события</b>: смерть, поломка, уход клиента (churn), конец брака. Нужно задать: <b>шкалу времени и точку отсчёта</b> (часы, мили пробега, число отпечатанных страниц) и <b>само событие</b>.</p>\n <p><b>Проблема — цензурирование (censoring).</b> Мы часто не видим всю жизнь объекта. Пример: лампочки тестируют 100 часов, часть не перегорела: мы знаем только «T &gt; 100». Пациентов наблюдают 5 лет, кто-то ещё жив или выбыл: известно «T ≥ 5 лет». Выбрасывать их нельзя, это полезная информация.</p>\n <p><b>Обозначения:</b> T — время события, C — время цензурирования, наблюдаем <b>Y = min(T, C)</b> и индикатор <b>δ = 1</b> если T ≤ C (событие наблюдено), <b>δ = 0</b> если цензурировано. Данные: (y<sub>i</sub>, δ<sub>i</sub>).</p>\n <p><b>Типы цензурирования:</b> right (событие ещё не произошло или объект потерян, T &gt; Y; основной тип); left (событие было до начала наблюдения, T ≤ Y); interval (событие в известном интервале, точный момент неизвестен).</p>\n <p><b>Предположение независимого цензурирования:</b> T ⊥ C | covariates. Если более больные выбывают раньше, а мы это игнорируем, выживаемость завышается и сравнение групп искажается.</p>"}, {"k": "num", "h": "Числа: почему простые доли неверны", "b": "<p>88 пациентов с опухолью мозга, 53 живы к концу. Хотим S(20) = P(T &gt; 20 мес.). Дожили после 20 мес: 48.</p>\n <ul class=\"big\"><li>Ошибка 1: 48/88 = 55%. Тем самым считаем всех цензурированных умершими до 20 мес., хотя это неизвестно.</li><li>Ошибка 2: 48/71 = 68% (71 нецензурированный к t = 20). Полностью игнорируем тех, кого цензурировали до 20 мес.</li></ul>\n <p>Нужен метод, использующий и события, и цензурированных: это Каплан–Майер.</p>\n <p><b>Мини-пример KM.</b> 6 пациентов: события в 2, 3, 5, 8; цензура в 4 и 7.</p>\n <table class=\"tbl\"><tr><th>t</th><th>r (в риске)</th><th>q (событий)</th><th>(r−q)/r</th><th>Ŝ(t)</th></tr><tr><td>2</td><td>6</td><td>1</td><td>5/6</td><td>0.833</td></tr><tr><td>3</td><td>5</td><td>1</td><td>4/5</td><td>0.667</td></tr><tr><td>4 (цензура)</td><td>4 → 3</td><td>0</td><td></td><td>0.667</td></tr><tr><td>5</td><td>3</td><td>1</td><td>2/3</td><td>0.444</td></tr><tr><td>7 (цензура)</td><td>2 → 1</td><td>0</td><td></td><td>0.444</td></tr><tr><td>8</td><td>1</td><td>1</td><td>0</td><td>0</td></tr></table>\n <p>Цензурированный остаётся в риске до момента цензурирования, потом удаляется. Медиана: первое t, где Ŝ ≤ 0.5, здесь t = 5.</p>"}, {"k": "proof", "h": "Вывод оценки Каплана–Майера (как у Davide)", "b": "<ol class=\"big\"><li>Пусть d<sub>1</sub> &lt; … &lt; d<sub>K</sub> — уникальные моменты смертей среди нецензурированных. В момент d<sub>k</sub>: <b>q<sub>k</sub></b> — число умерших, <b>r<sub>k</sub></b> — число «в риске» (risk set) непосредственно перед d<sub>k</sub>.</li>\n <li>Разложение по условной вероятности: S(d<sub>k</sub>) = P(T &gt; d<sub>k</sub> | T &gt; d<sub>k−1</sub>)·S(d<sub>k−1</sub>) (так как P(T &gt; d<sub>k</sub> | T ≤ d<sub>k−1</sub>) = 0).</li>\n <li>Повторяя: S(d<sub>k</sub>) = Π<sub>j≤k</sub> P(T &gt; d<sub>j</sub> | T &gt; d<sub>j−1</sub>).</li>\n <li>Каждый множитель оценивается долей выживших в risk set: (r<sub>j</sub> − q<sub>j</sub>)/r<sub>j</sub>.</li>\n <li><b>Итог:</b> Ŝ(t) = Π<sub>d<sub>j</sub> ≤ t</sub> (r<sub>j</sub> − q<sub>j</sub>)/r<sub>j</sub>. Это ступенчатая функция, падает только в моменты событий, между ними постоянна.</li></ol>\n <p>Кривая KM: на графике стартует с 1, ступеньки вниз, пунктирные линии вокруг — полосы стандартной ошибки; можно рисовать несколько кривых (мужчины и женщины).</p>"}, {"k": "formula", "h": "Hazard, плотность, S(t) и правдоподобие", "b": "<table class=\"sym\"><tr><td>S(t) = P(T &gt; t)</td><td>функция выживания, всегда убывающая</td></tr>\n <tr><td>h(t) = lim<sub>Δt→0</sub> P(t &lt; T ≤ t+Δt | T &gt; t)/Δt</td><td>hazard: мгновенный риск события в t для тех, кто дожил до t</td></tr>\n <tr><td>f(t) = lim P(t &lt; T ≤ t+Δt)/Δt</td><td>плотность</td></tr>\n <tr><td><b>h(t) = f(t)/S(t)</b></td><td>вывод: P(t&lt;T≤t+Δt | T&gt;t) = P(t&lt;T≤t+Δt)/P(T&gt;t) (событие t&lt;T≤t+Δt уже включает T&gt;t)</td></tr>\n <tr><td>L<sub>i</sub> = f(y<sub>i</sub>)<sup>δ<sub>i</sub></sup>·S(y<sub>i</sub>)<sup>1−δ<sub>i</sub></sup></td><td>вклад в правдоподобие: плотность если событие, S(y<sub>i</sub>) если цензура</td></tr>\n <tr><td>L = Π h(y<sub>i</sub>)<sup>δ<sub>i</sub></sup>·S(y<sub>i</sub>)</td><td>через hazard (подставили f = hS)</td></tr></table>\n <p><b>Параметрическая модель:</b> экспоненциальная f(t) = λe<sup>−λt</sup> (постоянный hazard), Weibull, Gamma; можно оценить λ максимизацией L. Hazard-модель h(t|x) = exp(β<sub>0</sub> + Σβ<sub>j</sub>x<sub>j</sub>) не зависит от t и слишком жёсткая. Поэтому Кокс.</p>\n <p><b>Почему нельзя регрессию log(Y):</b> для цензурированных Y — лишь нижняя граница T, это систематически занижает времена.</p>"}, {"k": "num", "h": "Числа: log-rank test", "b": "<p>Сравниваем две группы (например, мужчины и женщины) не по средним, а по тому, как идут события. В каждый момент d<sub>k</sub>: r<sub>1k</sub>, r<sub>2k</sub> — в риске по группам, q<sub>k</sub> — всего событий. При H<sub>0</sub> (кривые одинаковы) ожидаемое число событий в группе 1: <b>μ<sub>k</sub> = q<sub>k</sub>·r<sub>1k</sub>/r<sub>k</sub></b>.</p>\n <p>W = Σ(q<sub>1k</sub> − μ<sub>k</sub>) / √(Σ q<sub>k</sub>(r<sub>1k</sub>/r<sub>k</sub>)(1 − r<sub>1k</sub>/r<sub>k</sub>)(r<sub>k</sub>−q<sub>k</sub>)/(r<sub>k</sub>−1)); при больших выборках W ~ N(0,1).</p>\n <p>Мини-пример: три события. Момент 1: r<sub>1</sub>=5, r<sub>2</sub>=5, умер член группы 1: μ = 0.5, q<sub>1</sub>−μ = 0.5, дисперсия 0.25. Момент 2: r<sub>1</sub>=4, r<sub>2</sub>=5, умер из группы 2: μ = 4/9, q<sub>1</sub>−μ = −0.444, дисперсия 0.247. Момент 3: r<sub>1</sub>=4, r<sub>2</sub>=4, умер из группы 1: +0.5, дисперсия 0.25. Числитель 0.556, дисперсия 0.747, W = 0.556/0.864 = <b>0.64</b>, p ≈ 0.52: H<sub>0</sub> не отвергаем.</p>\n <p>В примере лекции (BrainCancer): W = 1.2, p = 0.2, H<sub>0</sub> не отвергается.</p>"}, {"k": "proof", "h": "Модель Кокса и частичное правдоподобие", "b": "<p><b>Модель:</b> h(t|x<sub>i</sub>) = h<sub>0</sub>(t)·exp(Σ<sub>j</sub> x<sub>ij</sub>β<sub>j</sub>). h<sub>0</sub>(t) — baseline hazard (для x = 0), форма не задана, exp(Σxβ) — relative risk. Ковариаты действуют мультипликативно: рост x<sub>j</sub> на 1 умножает hazard на exp(β<sub>j</sub>).</p>\n <p><b>Как оценить β без h<sub>0</sub>:</b></p>\n <ol class=\"big\"><li>В момент события y<sub>i</sub> risk set = {i′ : y<sub>i′</sub> ≥ y<sub>i</sub>}; у каждого hazard h<sub>0</sub>(y<sub>i</sub>)·exp(x<sub>i′</sub>β).</li>\n <li>Вероятность, что умирает именно i: h<sub>0</sub>(y<sub>i</sub>)e<sup>x<sub>i</sub>β</sup> / Σ<sub>i′∈риск</sub> h<sub>0</sub>(y<sub>i</sub>)e<sup>x<sub>i′</sub>β</sup>.</li>\n <li>h<sub>0</sub>(y<sub>i</sub>) общий для всех в risk set и <b>сокращается</b>: e<sup>x<sub>i</sub>β</sup> / Σ e<sup>x<sub>i′</sub>β</sup>.</li>\n <li>Перемножаем по всем событиям: <b>PL(β) = Π<sub>i: δ<sub>i</sub>=1</sub> e<sup>x<sub>i</sub>β</sup> / Σ<sub>i′: y<sub>i′</sub>≥y<sub>i</sub></sub> e<sup>x<sub>i′</sub>β</sup></b>. Не зависит от h<sub>0</sub>, использует только порядок событий.</li>\n <li>Максимизируем PL итеративно (как в логистической регрессии), затем тесты H<sub>0</sub>: β<sub>j</sub> = 0 и доверительные интервалы.</li></ol>\n <p><b>Числа:</b> три пациента, x = (1, 0, 0), события в моменты 1, 2, 3. PL(β) = [e<sup>β</sup>/(e<sup>β</sup>+2)]·[1/2]·[1]. При β = 0.5: 1.6487/3.6487 = 0.452, PL = 0.226.</p>\n <p><b>Пример лекции:</b> пол (мужчины): exp(0.18) ≈ 1.2 (риск на 20% выше, p = 0.61, незначимо); индекс Карновского: exp(−0.05) ≈ 0.95 за единицу (защитный эффект, значим). Это множители hazard, а не вероятности.</p>"}, {"k": "quiz", "q": "Что такое цензурирование справа?", "o": ["событие ещё не произошло к концу наблюдения или объект потерян: T > Y", "событие произошло до начала наблюдения", "событие в известном интервале", "ошибка измерения"], "a": 0, "why": "Right censoring: известно только, что T > Y."}, {"k": "quiz", "q": "Что значит δ = 0?", "o": ["наблюдение цензурировано, мы видим C", "мы видим истинное T", "пациент умер", "пропущенные данные"], "a": 0, "why": "δ = 1 если T ≤ C (событие наблюдено), δ = 0 если T > C."}, {"k": "quiz", "q": "Чему равен hazard h(t)?", "o": ["f(t)/S(t)", "S(t)/f(t)", "1 − S(t)", "f(t)·S(t)"], "a": 0, "why": "Условная плотность события среди доживших до t."}, {"k": "quiz", "q": "Почему в частичном правдоподобии Кокса не нужен h0(t)?", "o": ["он общий для всех в risk set и сокращается", "его задали экспонентой", "его оценили заранее", "он равен 1"], "a": 0, "why": "В числителе и знаменателе стоит один и тот же h0(y_i)."}, {"k": "note", "h": "Тетрадь: survival analysis", "b": "<div class=\"nb\"><div class=\"hd\">Hazard и плотность</div><div class=\"ln\"><div class=\"fm\">h(t) = lim<sub>Δt→0</sub> <span class=\"fr\"><span>P(t &lt; T ≤ t+Δt | T &gt; t)</span><span>Δt</span></span></div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">h(t) = <span class=\"fr\"><span>f(t)</span><span>S(t)</span></span></span></div><div class=\"nt\">условная вероятность = P(A∩B)/P(B)</div></div><div class=\"ln\"><div class=\"fm\">S(t) = P(T &gt; t),   f(t) = −S′(t)</div></div><div class=\"ln\"><div class=\"fm\">h(t) = − <span class=\"fr\"><span>d</span><span>dt</span></span> ln S(t)  ⇒  S(t) = e<sup>−∫h</sup></div></div><div class=\"hd\">Правдоподобие с цензурированием</div><div class=\"ln\"><div class=\"fm\">L<sub>i</sub> = f(y<sub>i</sub>)<sup>δ<sub>i</sub></sup> · S(y<sub>i</sub>)<sup>1−δ<sub>i</sub></sup></div></div><div class=\"ln\"><div class=\"fm\">L = Π h(y<sub>i</sub>)<sup>δ<sub>i</sub></sup> S(y<sub>i</sub>)</div><div class=\"nt\">подставили f = h·S</div></div><div class=\"hd\">Kaplan–Meier</div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">Ŝ(t) = Π<sub>d<sub>j</sub> ≤ t</sub> <span class=\"fr\"><span>r<sub>j</sub> − q<sub>j</sub></span><span>r<sub>j</sub></span></span></span></div><div class=\"nt\">r — в риске, q — событий</div></div><div class=\"hd\">Log-rank</div><div class=\"ln\"><div class=\"fm\">μ<sub>k</sub> = q<sub>k</sub> <span class=\"fr\"><span>r<sub>1k</sub></span><span>r<sub>k</sub></span></span></div><div class=\"nt\"> ожидаемое число событий в группе 1</div></div><div class=\"ln\"><div class=\"fm\">W = <span class=\"fr\"><span>Σ(q<sub>1k</sub> − μ<sub>k</sub>)</span><span>√Σ q<sub>k</sub>(r<sub>1k</sub>/r<sub>k</sub>)(1−r<sub>1k</sub>/r<sub>k</sub>)(r<sub>k</sub>−q<sub>k</sub>)/(r<sub>k</sub>−1)</span></span></div></div><div class=\"hd\">Cox</div><div class=\"ln\"><div class=\"fm\">h(t|x) = h<sub>0</sub>(t) · exp(Σ x<sub>j</sub>β<sub>j</sub>)</div></div><div class=\"ln\"><div class=\"fm\">PL(β) = Π<sub>i: δ<sub>i</sub>=1</sub> <span class=\"fr\"><span>exp(x<sub>i</sub>β)</span><span>Σ<sub>i′: y<sub>i′</sub> ≥ y<sub>i</sub></sub> exp(x<sub>i′</sub>β)</span></span></div><div class=\"nt\">h₀ сократился</div></div></div>"}, {"k": "exam", "h": "Вопросы Davide из конца лекции (кратко)", "b": "<ol class=\"big\"><li><b>Цель survival analysis:</b> моделировать время до события с учётом цензурирования (медицина, надёжность, churn).</li><li><b>Censoring:</b> событие не наблюдено, известно только T &gt; y; нельзя выбросить, нельзя считать событием; типы: right, left, interval.</li><li><b>S(t):</b> вероятность прожить дольше t, убывающая.</li><li><b>Risk set:</b> кто ещё под наблюдением непосредственно перед d<sub>k</sub> (цензурированные включены до момента цензурирования); основа KM, log-rank, Cox.</li><li><b>Hazard vs S:</b> hazard — мгновенная скорость события среди доживших, S — накопленная вероятность дожить.</li><li><b>h<sub>0</sub>(t) не задан:</b> модель гибкая, форма риска во времени любая, β оцениваются через partial likelihood.</li><li><b>Челлендж vs обычная регрессия:</b> Y = min(T,C) занижает T, нужны последовательные методы.</li><li><b>Интуиция Кокса:</b> общий baseline hazard, ковариаты умножают его на exp(xβ).</li></ol>"}]}, {"id": "lrm", "title": "13. Допущения линейной регрессии и их нарушения", "goal": "Что предполагает LRM, как увидеть нарушения и что делать (Davide).", "cards": [{"k": "story", "h": "Модель и допущения", "b": "<p>В этой части курса обозначения стандартные: <b>Y = β<sub>0</sub> + β<sub>1</sub>X + ε</b> (β<sub>0</sub> — свободный член, β<sub>1</sub> — наклон; не путай с α/β у Gorgone).</p>\n <p><b>Допущения (MLR):</b></p>\n <ul class=\"big\"><li><b>Linearity:</b> E[Y | X] = β<sub>0</sub> + β<sub>1</sub>X<sub>1</sub> + … + β<sub>k</sub>X<sub>k</sub>.</li><li><b>Independence (нет автокорреляции):</b> Cov(ε<sub>i</sub>, ε<sub>j</sub>) = 0 при i ≠ j.</li><li><b>Homoscedasticity:</b> Var(ε<sub>i</sub> | X) = σ² постоянна.</li><li><b>Zero conditional mean:</b> E[ε<sub>i</sub> | X] = 0, отсюда Cov(X<sub>j</sub>, ε) = 0. Означает: E(ε) = 0 и регрессоры не связаны с ошибкой.</li><li><b>No perfect multicollinearity:</b> ни один регрессор не есть точная линейная комбинация других.</li><li><b>Normality:</b> ε ~ N(0, σ²), нужна в основном для вывода (тесты, интервалы).</li></ul>\n <p><b>Что ломается при нарушении:</b> гетероскедастичность — оценки остаются несмещёнными, но перестают быть BLUE (минимальная дисперсия), стандартные ошибки смещены; мультиколлинеарность — растут SE, падают t-статистики; коррелированные ошибки — SE занижены, интервалы уже, p-value меньше.</p>\n <p><b>Simple vs multiple:</b> один предиктор против нескольких. <b>R²</b> — доля объяснённой вариации, 1 − SSR/SST; <b>adjusted R²</b> = 1 − (1−R²)(N−1)/(N−p−1) штрафует за лишние предикторы. Пример: R² = 0.6, N = 50, p = 3: adj = 1 − 0.4·49/46 = 0.574.</p>"}, {"k": "formula", "h": "Диагностика по пунктам", "b": "<table class=\"sym\"><tr><td>Residual plot</td><td>e<sub>i</sub> = y<sub>i</sub> − ŷ<sub>i</sub>. В простой регрессии строят e против x, в множественной против ŷ. Должно быть без паттерна. U-образность = нелинейность: добавь log X, √X, X².</td></tr>\n <tr><td>Tracking</td><td>соседние остатки движутся вместе: ошибки коррелированы (временные ряды); чем больше ρ, тем заметнее</td></tr>\n <tr><td>Funnel shape</td><td>воронка в residual plot: гетероскедастичность; лечат преобразованием Y (log Y, √Y)</td></tr>\n <tr><td>Outlier</td><td>необычное значение y<sub>i</sub> (далеко от предсказания). Увеличивает RSS, снижает R². Studentized residual = e<sub>i</sub>/оценка SE(e<sub>i</sub>); |значение| &gt; 3: возможный выброс</td></tr>\n <tr><td>High leverage</td><td>необычное значение предиктора x<sub>i</sub>. h<sub>i</sub> = 1/n + (x<sub>i</sub>−x̄)²/Σ(x<sub>j</sub>−x̄)²; h<sub>i</sub> ∈ [1/n, 1], среднее (p+1)/n; сильно сильнее среднего: высокий leverage, точка тянет прямую</td></tr>\n <tr><td>Collinearity</td><td>предикторы сильно коррелируют, трудно разделить эффекты; SE β̂<sub>j</sub> растёт, t падает; смотрим корреляции и <b>VIF</b></td></tr>\n <tr><td>VIF(β̂<sub>j</sub>) = 1/(1 − R²<sub>X<sub>j</sub>|X<sub>−j</sub></sub>)</td><td>R² регрессии X<sub>j</sub> на остальные предикторы; минимум 1; правило: &gt; 5 или 10 проблема</td></tr></table>"}, {"k": "num", "h": "Числа", "b": "<p><b>Leverage:</b> x = 1, 2, 3, 4, 10. x̄ = 4, S<sub>xx</sub> = 9+4+1+0+36 = 50. Для x = 10: h = 1/5 + 36/50 = <b>0.92</b>, среднее (p+1)/n = 2/5 = 0.4. Точка с x = 10 имеет огромный leverage.</p>\n <p><b>VIF:</b> если R² регрессии X<sub>1</sub> на остальные = 0.9, то VIF = 1/(1 − 0.9) = <b>10</b> (проблема); при 0.8 VIF = 5.</p>\n <p>VIF показывает, во сколько раз дисперсия β̂<sub>j</sub> в полной модели больше, чем была бы при отдельной подгонке.</p>"}, {"k": "quiz", "q": "Чем outlier отличается от high leverage point?", "o": ["outlier: необычный y; leverage: необычный x", "наоборот", "это одно и то же", "outlier только в множественной регрессии"], "a": 0, "why": "Outlier далёк по y от предсказания, leverage необычен по предикторам и сильно влияет на прямую."}, {"k": "quiz", "q": "VIF = 10. Что это значит?", "o": ["R² регрессии X_j на остальные = 0.9, сильная коллинеарность", "R² модели равен 10", "всё хорошо", "выброс"], "a": 0, "why": "VIF = 1/(1 − R²) = 10 ⇒ R² = 0.9."}, {"k": "quiz", "q": "Воронка на графике остатков означает:", "o": ["гетероскедастичность", "нелинейность", "автокорреляцию", "мультиколлинеарность"], "a": 0, "why": "Дисперсия ошибок меняется; лечат log Y или √Y."}, {"k": "note", "h": "Тетрадь: диагностика LRM", "b": "<div class=\"nb\"><div class=\"hd\">Leverage</div><div class=\"ln\"><div class=\"fm\">h<sub>i</sub> = <span class=\"fr\"><span>1</span><span>N</span></span> + <span class=\"fr\"><span>(<i>x</i><sub>i</sub> − <span class=\"ov\"><i>x</i></span>)²</span><span>Σ(<i>x</i><sub>j</sub> − <span class=\"ov\"><i>x</i></span>)²</span></span></div><div class=\"nt\">от 1/N до 1; среднее (p+1)/N</div></div><div class=\"hd\">VIF</div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">VIF(β̂<sub>j</sub>) = <span class=\"fr\"><span>1</span><span>1 − R²<sub>X<sub>j</sub>|X<sub>−j</sub></sub></span></span></span></div><div class=\"nt\">R² регрессии X_j на остальные предикторы</div></div><div class=\"ln\"><div class=\"fm\">R² = 0.9  ⇒  VIF = <span class=\"fr\"><span>1</span><span>0.1</span></span> = 10</div></div><div class=\"hd\">Studentized residual</div><div class=\"ln\"><div class=\"fm\">t<sub>i</sub> = <span class=\"fr\"><span>e<sub>i</sub></span><span>SE(e<sub>i</sub>)</span></span>,   |t<sub>i</sub>| &gt; 3 ⇒ возможный выброс</div></div></div>"}, {"k": "exam", "h": "Эталонный ответ: допущения LRM", "b": "<p>Модель Y = β<sub>0</sub> + Σβ<sub>j</sub>X<sub>j</sub> + ε. Допущения: линейность E[Y|X]; независимость ошибок; гомоскедастичность Var(ε|X) = σ²; нулевое условное среднее E[ε|X] = 0 (⇒ Cov(X,ε) = 0); отсутствие совершенной мультиколлинеарности; нормальность ε для вывода.</p>\n <p>Нарушения и диагностика: нелинейность видна на residual plot (лечится преобразованиями X); автокорреляция даёт tracking и заниженные SE; гетероскедастичность даёт воронку (лечится log/√ от Y), оценки несмещены, но не BLUE; outlier ищем по studentized residuals (|·| &gt; 3), leverage по h<sub>i</sub> (сравниваем с (p+1)/n); коллинеарность по VIF (&gt; 5–10), растут SE и падают t-статистики.</p>\n <p><b>E(ε<sub>i</sub>) = 0</b> означает, что в среднем ошибка не смещает модель: прямая правильно описывает среднее Y.</p>"}]}, {"id": "forms", "title": "14. Log-модели и типы данных", "goal": "Как читать β в log-linear, linear-log, log-log; cross-section, time series, panel, lifetime, hierarchical.", "cards": [{"k": "num", "h": "Числа: три формы", "b": "<ul class=\"big\"><li><b>Log-linear</b>: ln(wage) = 1.5 + 0.08·educ. Год образования ⇒ зарплата выше примерно на <b>8%</b> (точно e<sup>0.08</sup> − 1 = 8.3%).</li><li><b>Linear-log</b>: consumption = 2 + 0.5·ln(income). Рост дохода на 1% ⇒ потребление выше на 0.5/100 = <b>0.005</b> единицы.</li><li><b>Log-log</b>: ln(cons) = 0.5 + 0.6·ln(income). Рост дохода на 1% ⇒ потребление выше на <b>0.6%</b> (эластичность).</li></ul>"}, {"k": "formula", "h": "Правила чтения коэффициента", "b": "<table class=\"tbl\"><tr><th>Модель</th><th>Уравнение</th><th>Что значит β<sub>1</sub></th></tr><tr><td>Log-linear</td><td>ln Y = β<sub>0</sub> + β<sub>1</sub>X + ε</td><td>+1 к X ⇒ Y меняется примерно на 100·β<sub>1</sub>% (<b>semi-elasticity</b>)</td></tr><tr><td>Linear-log</td><td>Y = β<sub>0</sub> + β<sub>1</sub> ln X + ε</td><td>+1% к X ⇒ Y меняется примерно на β<sub>1</sub>/100 единиц (semi-elasticity)</td></tr><tr><td>Log-log</td><td>ln Y = β<sub>0</sub> + β<sub>1</sub> ln X + ε</td><td>+1% к X ⇒ Y меняется на β<sub>1</sub>% (<b>elasticity</b>), β<sub>1</sub> = %ΔY/%ΔX</td></tr></table>\n <p><b>Откуда:</b> d(ln Y) ≈ ΔY/Y, поэтому в log-linear Δln Y = β<sub>1</sub>ΔX — это относительное изменение Y. В log-log Δln Y = β<sub>1</sub>Δln X — отношение двух относительных изменений.</p>"}, {"k": "story", "h": "Типы данных", "b": "<ul class=\"big\"><li><b>Cross-sectional:</b> много объектов в один момент времени (доходы 1000 итальянцев в 2024). Нет временной вариации.</li><li><b>Time series:</b> один объект во времени (ВВП страны 2000–2025, цена акции).</li><li><b>Panel:</b> N объектов, каждый наблюдается T периодов; N·T наблюдений; есть и межобъектная, и временная вариация; более информативны, но сложнее. Модель: Y = Xβ + ε (Y: NT×1), или y<sub>it</sub> = x′<sub>it</sub>β + ε<sub>it</sub>, или по объекту y<sub>i</sub> = X<sub>i</sub>β + ε<sub>i</sub> (T×1).</li><li><b>Lifetime (survival):</b> время до события, возможно цензурированное (болезнь, поломка, churn).</li><li><b>Hierarchical (multilevel):</b> наблюдения вложены в группы (студенты в классах, пациенты в клиниках), не независимы, вариация на разных уровнях.</li></ul>\n <p>Пример panel: N = 100 человек, T = 5 лет ⇒ 500 наблюдений.</p>"}, {"k": "quiz", "q": "В какой модели β1 это эластичность?", "o": ["log-log", "log-linear", "linear-log", "линейной"], "a": 0, "why": "Обе переменные в логарифмах, β1 = %ΔY/%ΔX."}, {"k": "quiz", "q": "ln(wage) = 1.5 + 0.08·educ. Что значит 0.08?", "o": ["+1 год ⇒ примерно +8% зарплаты", "+1 год ⇒ +0.08 единицы", "+8% образования ⇒ +1 год", "+0.08%"], "a": 0, "why": "Log-linear: β1·100 процентов."}, {"k": "note", "h": "Тетрадь: log-модели", "b": "<div class=\"nb\"><div class=\"hd\">Три формы</div><div class=\"ln\"><div class=\"fm\"><b>log-linear:</b>   ln Y = β<sub>0</sub> + β<sub>1</sub>X + ε</div><div class=\"nt\">+1 к X ⇒ Y на ≈ 100·β₁ %</div></div><div class=\"ln\"><div class=\"fm\"><b>linear-log:</b>   Y = β<sub>0</sub> + β<sub>1</sub> ln X + ε</div><div class=\"nt\">+1% к X ⇒ Y на β₁/100 единиц</div></div><div class=\"ln\"><div class=\"fm\"><b>log-log:</b>   ln Y = β<sub>0</sub> + β<sub>1</sub> ln X + ε</div><div class=\"nt\">+1% к X ⇒ Y на β₁ %</div></div><div class=\"ln\"><div class=\"fm\">β<sub>1</sub> = <span class=\"fr\"><span>%ΔY</span><span>%ΔX</span></span></div><div class=\"nt\">эластичность</div></div><div class=\"ln\"><div class=\"fm\">e<sup>0.08</sup> − 1 = 0.083</div><div class=\"nt\">точный эффект для 0.08</div></div></div>"}, {"k": "exam", "h": "Эталонный ответ", "b": "<p><b>Функциональные формы:</b> log-linear (Y в логах, X в уровнях): +1 к X даёт примерно 100β<sub>1</sub>% к Y; linear-log (X в логах): +1% к X даёт β<sub>1</sub>/100 единиц Y; log-log: +1% к X даёт β<sub>1</sub>% к Y, β<sub>1</sub> — эластичность. Semi-elasticity в первых двух, elasticity в log-log.</p>\n <p><b>Типы данных:</b> cross-section (много объектов, один момент), time series (один объект, много моментов), panel (те же N объектов в T моментов, NT наблюдений, объединяет оба измерения и информативнее), lifetime (время до события с цензурированием), hierarchical (наблюдения вложены в группы, зависимы внутри группы).</p>"}]}, {"id": "cls", "title": "15. Классификация и логистическая регрессия", "goal": "Зачем логистическая регрессия, вывод p(X), логит, оценка по MLE, метрики.", "ext": true, "cards": [{"k": "story", "h": "Идея (ISLR гл. 4: 4.1, 4.2, 4.3, 4.6)", "b": "<p class=\"warn\"><b>Источник:</b> от Davide есть только список вопросов (Summary questions). Ответы ниже написаны по ISLR гл. 4 и общей теории.</p>\n <p><b>Классификация:</b> ответ Y качественный (категория: да/нет, вид болезни), задача предсказать класс объекта; в регрессии Y количественный. Примеры: пройдёт кредит или нет, спам или не спам.</p>\n <p><b>Почему не линейная регрессия:</b> (1) для бинарного Y она может давать «вероятности» вне [0,1] (−0.2, 1.3); (2) для &gt; 2 неупорядоченных классов кодирование 1,2,3 навязывает порядок и равные расстояния, который не имеет смысла.</p>\n <p><b>Логистическая регрессия</b> моделирует вероятность p(X) = P(Y = 1 | X) так, чтобы она всегда была в (0,1):</p>\n <p style=\"text-align:center;font-size:20px\"><b>p(X) = e<sup>β<sub>0</sub>+β<sub>1</sub>X</sup> / (1 + e<sup>β<sub>0</sub>+β<sub>1</sub>X</sup>)</b></p>\n <p>Это S-образная логистическая функция: при z → −∞ даёт 0, при z → +∞ даёт 1.</p>"}, {"k": "proof", "h": "Вывод: odds, логит, правдоподобие", "b": "<ol class=\"big\"><li>Из p = e<sup>z</sup>/(1+e<sup>z</sup>), z = β<sub>0</sub>+β<sub>1</sub>X: 1 − p = 1/(1+e<sup>z</sup>).</li><li><b>Odds</b> = p/(1−p) = e<sup>z</sup> ∈ (0, ∞).</li><li><b>Логит (log-odds)</b>: ln(p/(1−p)) = β<sub>0</sub> + β<sub>1</sub>X — <b>линейна по X</b>. Поэтому β<sub>1</sub>: +1 к X прибавляет β<sub>1</sub> к log-odds, т.е. умножает odds на e<sup>β<sub>1</sub></sup>. Прямая в p(X) не линейна: влияние X на p зависит от X.</li><li><b>Оценка — максимальное правдоподобие:</b> L(β) = Π<sub>y<sub>i</sub>=1</sub> p(x<sub>i</sub>) · Π<sub>y<sub>i</sub>=0</sub>(1 − p(x<sub>i</sub>)); выбираем β̂ максимизирующие L (логарифм: Σ[y<sub>i</sub> ln p + (1−y<sub>i</sub>) ln(1−p)]). Замкнутого решения нет, используют итерации (Ньютон/IRLS).</li><li>Предсказание: если p̂(x) &gt; 0.5 (порог можно менять), относим к классу 1.</li><li>Множественная: p(X) = e<sup>β<sub>0</sub>+β<sub>1</sub>X<sub>1</sub>+…+β<sub>p</sub>X<sub>p</sub></sup>/(1+…). Для &gt; 2 классов: multinomial logistic.</li></ol>"}, {"k": "num", "h": "Числа", "b": "<p>β<sub>0</sub> = −6, β<sub>1</sub> = 0.05. Для X = 100: z = −1, p = e<sup>−1</sup>/(1+e<sup>−1</sup>) = 0.269. Для X = 120: z = 0, p = 0.5. Для X = 160: z = 2, p = 0.881. Odds растут в e<sup>0.05</sup> = 1.051 раза за единицу X.</p>\n <p><b>Метрики по матрице ошибок:</b> TP = 40, FN = 10, FP = 5, TN = 45. Accuracy = 85/100 = 0.85; sensitivity (recall) = 40/50 = 0.80; specificity = 45/50 = 0.90; precision = 40/45 = 0.889. Меняя порог, получаем ROC-кривую (sensitivity против 1 − specificity), AUC — площадь под ней.</p>"}, {"k": "formula", "h": "GLM и счётные данные (sec. 4.6)", "b": "<p><b>Generalized linear model:</b> линейный предиктор η = Xβ связывается со средним ответа через link-функцию. Распределение ответа и link:</p>\n <table class=\"tbl\"><tr><th>Ответ</th><th>Распределение</th><th>Link</th></tr><tr><td>Количественный</td><td>Normal</td><td>identity</td></tr><tr><td>Бинарный / доля</td><td>Binomial</td><td>logit (или probit)</td></tr><tr><td>Счёт 0,1,2…</td><td>Poisson</td><td>log</td></tr></table>\n <p><b>Poisson regression:</b> E(n) = m, Var(n) = m (дисперсия равна среднему), ln m = β<sub>0</sub> + β<sub>1</sub>x ⇒ m = e<sup>β<sub>0</sub>+β<sub>1</sub>x</sup> &gt; 0. Пример: β<sub>0</sub> = 1, β<sub>1</sub> = 0.3, x = 2: m = e<sup>1.6</sup> = 4.95; +1 к x умножает среднее на e<sup>0.3</sup> = 1.35.</p>\n <p><b>Offset:</b> если счёт зависит от размера M: ln m = ln M + β<sub>0</sub> + β<sub>1</sub>x; ln M — предиктор с фиксированным коэффициентом 1 (моделируем частоту: 10 аварий на 100 учеников и на 2000 учеников — разные частоты).</p>"}, {"k": "quiz", "q": "Почему логистическая регрессия лучше линейной для бинарного Y?", "o": ["p(X) всегда в (0,1)", "она быстрее", "она не требует данных", "она линейна по p"], "a": 0, "why": "Логистическая функция ограничена (0,1)."}, {"k": "quiz", "q": "Что линейно по X в логистической регрессии?", "o": ["log-odds ln(p/(1−p))", "вероятность p", "odds", "p²"], "a": 0, "why": "ln(p/(1−p)) = β0 + β1X."}, {"k": "quiz", "q": "β1 = 0.05 в логистической регрессии. На что умножаются odds при +1 к X?", "o": ["e^0.05 ≈ 1.051", "0.05", "1.05 прибавляется к p", "1/0.05"], "a": 0, "why": "exp(β1) — множитель odds."}, {"k": "note", "h": "Тетрадь: логистическая регрессия", "b": "<div class=\"nb\"><div class=\"hd\">Модель</div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">p(X) = <span class=\"fr\"><span>e<sup>β<sub>0</sub>+β<sub>1</sub>X</sup></span><span>1 + e<sup>β<sub>0</sub>+β<sub>1</sub>X</sup></span></span></span></div><div class=\"nt\">всегда в (0,1)</div></div><div class=\"hd\">Odds и логит</div><div class=\"ln\"><div class=\"fm\">1 − p = <span class=\"fr\"><span>1</span><span>1 + e<sup>z</sup></span></span>,   z = β<sub>0</sub>+β<sub>1</sub>X</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"fr\"><span>p</span><span>1 − p</span></span> = e<sup>z</sup></div><div class=\"nt\">odds</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">ln <span class=\"fr\"><span>p</span><span>1 − p</span></span> = β<sub>0</sub> + β<sub>1</sub>X</span></div><div class=\"nt\">логит линеен по X</div></div><div class=\"hd\">Правдоподобие</div><div class=\"ln\"><div class=\"fm\">L(β) = Π<sub>y<sub>i</sub>=1</sub> p(x<sub>i</sub>) · Π<sub>y<sub>i</sub>=0</sub> (1 − p(x<sub>i</sub>))</div></div><div class=\"hd\">Poisson</div><div class=\"ln\"><div class=\"fm\">ln m = β<sub>0</sub> + β<sub>1</sub>x ⇒ m = e<sup>β<sub>0</sub>+β<sub>1</sub>x</sup></div></div><div class=\"ln\"><div class=\"fm\">offset:  ln m = ln M + β<sub>0</sub> + β<sub>1</sub>x</div></div></div>"}, {"k": "exam", "h": "Эталонные ответы на Summary questions", "b": "<ol class=\"big\"><li><b>Цель классификации:</b> предсказать категорию (качественный Y); в регрессии Y количественный и предсказываем число.</li><li><b>Качественный ответ:</b> принимает значения из набора категорий (спам/не спам, болезнь A/B/C, дефолт да/нет).</li><li><b>Почему не линейная регрессия:</b> вероятности вне [0,1], навязанный порядок классов при &gt; 2 категорий.</li><li><b>Логистическая регрессия:</b> моделирует P(Y=1|X) логистической функцией, оценка по максимальному правдоподобию, вероятность всегда в (0,1).</li><li><b>p(X) = e<sup>β<sub>0</sub>+β<sub>1</sub>X</sup>/(1+e<sup>β<sub>0</sub>+β<sub>1</sub>X</sup>)</b> — вероятность класса 1 при значении X; её логит линейный: ln(p/(1−p)) = β<sub>0</sub>+β<sub>1</sub>X; e<sup>β<sub>1</sub></sup> — множитель odds на единицу X.</li></ol>"}]}, {"id": "hier", "title": "16. Иерархические (multilevel) модели", "goal": "Вложенные данные, random effects, ICC/VPC, IGLS, shrinkage.", "cards": [{"k": "story", "h": "Зачем", "b": "<p>Данные вложены: студенты ⊂ школы, пациенты ⊂ клиники, повторные измерения одного человека. Объекты внутри группы <b>зависимы</b> (общий учитель, среда): Cov(Y<sub>i</sub>, Y<sub>j</sub>) ≠ 0. Обычная регрессия предполагает независимость, поэтому <b>занижает стандартные ошибки</b>, переоценивает информацию и даёт «ложную» значимость. 30 студентов в одном классе ≠ 30 студентов в 30 классах: группы сами являются статистическими единицами.</p>\n <p><b>Уровни:</b> level 1 — индивиды (студенты), level 2 — группы (школы), level 3 — ещё выше (учителя, регионы). Level 1 variation — разброс индивидов внутри группы; level 2 variation — разброс между группами (разные intercept и slope у школ).</p>"}, {"k": "proof", "h": "Построение двухуровневой модели", "b": "<ol class=\"big\"><li>Для одной школы: y<sub>i</sub> = α + βx<sub>i</sub> + e<sub>i</sub>. Для школы j: y<sub>ij</sub> = β<sub>0j</sub> + β<sub>1j</sub>x<sub>ij</sub> + e<sub>ij</sub>, e<sub>ij</sub> ~ N(0, σ<sub>e</sub>²).</li>\n <li><b>Random coefficients:</b> β<sub>0j</sub> = β<sub>0</sub> + u<sub>0j</sub>, β<sub>1j</sub> = β<sub>1</sub> + u<sub>1j</sub>; E(u) = 0, Var(u<sub>0j</sub>) = σ<sub>u0</sub>², Var(u<sub>1j</sub>) = σ<sub>u1</sub>², Cov(u<sub>0j</sub>,u<sub>1j</sub>) = σ<sub>u01</sub>.</li>\n <li>Подстановка: <b>y<sub>ij</sub> = β<sub>0</sub> + β<sub>1</sub>x<sub>ij</sub> + (u<sub>0j</sub> + u<sub>1j</sub>x<sub>ij</sub> + e<sub>ij</sub>)</b>: fixed part (β<sub>0</sub> + β<sub>1</sub>x) и random part (в скобках). E(Y) = Xβ.</li>\n <li>Простейшая <b>variance components model</b>: y<sub>ij</sub> = β<sub>0</sub> + u<sub>0j</sub> + e<sub>0ij</sub>. Var(y<sub>ij</sub>) = σ<sub>u0</sub>² + σ<sub>e0</sub>²; Cov двух студентов одной школы = σ<sub>u0</sub>² (общий u<sub>0j</sub>).</li>\n <li><b>ICC (intra-class correlation) = VPC:</b> ρ = σ<sub>u0</sub>²/(σ<sub>u0</sub>² + σ<sub>e0</sub>²) — корреляция двух студентов одной школы и доля общей дисперсии, приходящаяся на различия между группами.</li>\n <li>Ковариационная матрица <b>блочно-диагональна</b>: зависимость внутри группы, независимость между. Блок для группы: V = σ<sub>u0</sub>²J + σ<sub>e0</sub>²I (J — матрица единиц, I — единичная).</li></ol>"}, {"k": "num", "h": "Числа: ICC и поправка к SE", "b": "<p>Клиники: σ<sub>u</sub>² = 4.5, σ<sub>e</sub>² = 22 ⇒ VPC = 4.5/(4.5+22) = <b>0.17</b>: 17% остаточной вариации объясняются различиями клиник, 83% — различиями пациентов внутри клиники.</p>\n <p>Поправка OLS-ошибки: SE умножается на <b>√(1 + ρ<sub>y</sub>ρ<sub>x</sub>(n−1))</b>, ρ<sub>y</sub>, ρ<sub>x</sub> — ICC для Y и X, n — размер группы. При ρ<sub>y</sub> = ρ<sub>x</sub> = 0.2, n = 76: √(1 + 0.04·75) = √4 = <b>2</b> — OLS занижает SE вдвое. При n = 1 или ρ = 0 поправка 1 и OLS допустим.</p>\n <p><b>Shrinkage:</b> предсказанный эффект группы û<sub>0j</sub> = R<sub>j</sub>·ỹ<sub>j</sub>, R<sub>j</sub> = σ<sub>u0</sub>²/(σ<sub>u0</sub>² + σ<sub>e0</sub>²/n<sub>j</sub>). Среднее остатков группы ỹ<sub>j</sub> = 3: при n<sub>j</sub> = 1: R = 4.5/26.5 = 0.17, û = 0.51; при n<sub>j</sub> = 10: R = 0.67, û = 2.02; при n<sub>j</sub> = 100: R = 0.95, û = 2.86. Малые группы сильнее «подтягиваются» к общему среднему.</p>"}, {"k": "formula", "h": "Оценивание: GLS и IGLS", "b": "<p>Если дисперсии известны: <b>GLS</b> β̂ = (XᵀV⁻¹X)⁻¹XᵀV⁻¹Y (даёт больший вес надёжным наблюдениям, учитывает кластеризацию).</p>\n <p>Если неизвестны — <b>IGLS</b> (iterative generalized least squares):</p>\n <ol class=\"big\"><li>Старт с OLS, берём остатки ỹ<sub>ij</sub> = y<sub>ij</sub> − (β̂<sub>0</sub> + β̂<sub>1</sub>x<sub>ij</sub>).</li><li>Так как E(ỸỸᵀ) = V, оцениваем дисперсии <b>регрессией</b> квадратов и произведений остатков на матрицы структуры групп (получаем σ<sub>u0</sub>², σ<sub>e0</sub>²).</li><li>Fixed effects step: обновляем β по GLS при текущих дисперсиях; random effects step: обновляем дисперсии при текущем β.</li><li>Повторяем до сходимости ⇒ <b>MLE</b>.</li></ol>\n <p>ML в малых выборках занижает компоненты дисперсии; поправка — <b>REML</b>. Residuals: level 1 — для диагностики, level 2 — часто представляют самостоятельный интерес («borrowing strength»).</p>\n <p><b>Сложные дисперсии:</b> level-2 дисперсия при random slope: Var(u<sub>0j</sub> + u<sub>1j</sub>x) = σ<sub>u0</sub>² + 2σ<sub>u01</sub>x + σ<sub>u1</sub>²x² (квадратичная функция x). Level 1: Var = σ<sub>e0</sub>² + 2σ<sub>e01</sub>x + σ<sub>e1</sub>²x² (гетероскедастичность, например ceiling effect). Проблема отрицательных дисперсий решается нелинейными функциями (e<sup>f(x)</sup>) или ограничениями на σ<sub>e01</sub>.</p>\n <p><b>Multilevel GLM:</b> π<sub>ij</sub> = f(Xβ)<sub>ij</sub>; доли: Binomial + logit/probit; счёты: Poisson + log (+ offset ln M<sub>j</sub>); для категорий multinomial logit.</p>"}, {"k": "quiz", "q": "Что такое ICC/VPC?", "o": ["доля дисперсии, обусловленная различиями между группами", "корреляция X и Y", "доля объяснённой R²", "число уровней"], "a": 0, "why": "ρ = σ_u²/(σ_u² + σ_e²)."}, {"k": "quiz", "q": "Что делает OLS с кластеризованными данными?", "o": ["занижает стандартные ошибки", "завышает стандартные ошибки", "ничего", "делает оценки смещёнными всегда"], "a": 0, "why": "Игнорирует зависимость внутри групп: доверительные интервалы слишком узкие, тесты слишком либеральны."}, {"k": "quiz", "q": "Большая группа (n_j велико). Что происходит с shrinkage?", "o": ["почти нет, û ≈ среднему остатков группы", "сильное сжатие к 0", "û = 0", "û удваивается"], "a": 0, "why": "R_j → 1 при росте n_j."}, {"k": "note", "h": "Тетрадь: multilevel модель", "b": "<div class=\"nb\"><div class=\"hd\">Двухуровневая модель</div><div class=\"ln\"><div class=\"fm\">y<sub>ij</sub> = β<sub>0j</sub> + β<sub>1j</sub>x<sub>ij</sub> + e<sub>ij</sub></div></div><div class=\"ln\"><div class=\"fm\">β<sub>0j</sub> = β<sub>0</sub> + u<sub>0j</sub>,   β<sub>1j</sub> = β<sub>1</sub> + u<sub>1j</sub></div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">y<sub>ij</sub> = β<sub>0</sub> + β<sub>1</sub>x<sub>ij</sub> + (u<sub>0j</sub> + u<sub>1j</sub>x<sub>ij</sub> + e<sub>ij</sub>)</span></div><div class=\"nt\">fixed part + random part</div></div><div class=\"hd\">ICC / VPC</div><div class=\"ln\"><div class=\"fm\">Var(y<sub>ij</sub>) = σ<sub>u0</sub>² + σ<sub>e0</sub>²</div></div><div class=\"ln\"><div class=\"fm\"><span class=\"box\">ρ = <span class=\"fr\"><span>σ<sub>u0</sub>²</span><span>σ<sub>u0</sub>² + σ<sub>e0</sub>²</span></span></span></div><div class=\"nt\">доля дисперсии между группами</div></div><div class=\"hd\">Поправка SE и shrinkage</div><div class=\"ln\"><div class=\"fm\">SE<sub>true</sub> = SE<sub>OLS</sub> · √(1 + ρ<sub>y</sub>ρ<sub>x</sub>(n − 1))</div></div><div class=\"ln\"><div class=\"fm\">R<sub>j</sub> = <span class=\"fr\"><span>σ<sub>u0</sub>²</span><span>σ<sub>u0</sub>² + σ<sub>e0</sub>²/n<sub>j</sub></span></span>,   û<sub>0j</sub> = R<sub>j</sub>·ỹ<sub>j</sub></div></div><div class=\"hd\">GLS</div><div class=\"ln\"><div class=\"fm\">β̂ = (XᵀV⁻¹X)⁻¹ XᵀV⁻¹ Y</div></div></div>"}, {"k": "exam", "h": "Эталонный ответ: Hierarchical models", "b": "<p>Иерархические данные: единицы вложены в группы (студенты в школах), внутри группы коррелированы. OLS предполагает независимость и поэтому занижает SE, даёт ложно значимые результаты.</p>\n <p>Multilevel модель: y<sub>ij</sub> = β<sub>0</sub> + β<sub>1</sub>x<sub>ij</sub> + (u<sub>0j</sub> + u<sub>1j</sub>x<sub>ij</sub> + e<sub>ij</sub>); fixed part описывает среднюю зависимость, random part — вариацию на уровне групп (random intercept, random slope) и индивидов. ICC = σ<sub>u0</sub>²/(σ<sub>u0</sub>² + σ<sub>e0</sub>²). Оценка: GLS при известных дисперсиях; IGLS (итерации между β и дисперсиями) даёт ML, REML для малых выборок. Residuals уровня 2 предсказываются с shrinkage R<sub>j</sub> = σ<sub>u0</sub>²/(σ<sub>u0</sub>² + σ<sub>e0</sub>²/n<sub>j</sub>), малые группы сжимаются к среднему («borrowing strength»). Расширения: сложные дисперсии и multilevel GLM (logit, Poisson с offset).</p>"}]}];
const TOPICS_EN=TOPICS;
const UI={ru:{topics:'Темы',of:'Тема %1 из %2',kinds:{story:'Простыми словами',num:'Сначала числа',formula:'Формула по буквам',quiz:'Проверь себя',exam:'Как отвечать на экзамене',proof:'Вывод формулы',note:'Конспект в тетради'},sub:'16 тем: объяснения, числа, формулы и их вывод, эталонные ответы.',ttl:'MMMDS · полный курс',full:'← Подробный курс и тренажёр кода',hub:'← Study hub',prev:'← Назад',next:'Дальше →',finish:'Закончить тему',right:'Верно. ',wrong:'Не совсем. ',passed:'Тема «%1» пройдена',score:'Вопросы: %1 из %2 с первой попытки.',again:'Пройти заново',goto:'Дальше: %1 →'},
en:{topics:'Topics',of:'Topic %1 of %2',kinds:{story:'In plain words',num:'Numbers first',formula:'Formula symbol by symbol',quiz:'Check yourself',exam:'How to answer in the exam',proof:'Derivation',note:'Notebook page'},sub:'16 topics: explanations, numbers, formulas with derivations, model answers.',ttl:'MMMDS · full course',full:'← Full course and code trainer',hub:'← Study hub',prev:'← Back',next:'Next →',finish:'Finish topic',right:'Correct. ',wrong:'Not quite. ',passed:'Topic "%1" completed',score:'Questions: %1 of %2 right on the first try.',again:'Start over',goto:'Next: %1 →'}};
const f=(s,...a)=>s.replace(/%(\d)/g,(m,i)=>a[i-1]);
let lang='ru';try{lang=localStorage.getItem('study-lang')==='en'?'en':'ru'}catch(e){}
const KEY='mmmds-easy-v1';
let S={pos:{},quiz:{},done:{}};try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const T=()=>lang==='en'?TOPICS_EN:TOPICS, U=()=>UI[lang];
let cur=TOPICS[0].id;
const side=document.getElementById('side'),view=document.getElementById('view');
function qkey(t,i){return t.id+':'+i}
function renderSide(){
  side.innerHTML=`<div class="ttl">${U().ttl}</div>`+T().map((t,i)=>`<a data-id="${t.id}" class="${t.id===cur?'on':''} ${S.done[t.id]?'done':''}"><span class="n">${S.done[t.id]?'✓':i+1}</span>${t.title}</a>`).join('')+
  `<div class="links"><a href="mmds.html">${U().full}</a><a href="index.html">${U().hub}</a></div>`;
  side.querySelectorAll('a[data-id]').forEach(a=>a.onclick=()=>{go(a.dataset.id);side.classList.remove('open')});
  document.getElementById('menu').textContent='☰ '+U().topics;
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
  document.documentElement.lang=lang;
}
function go(id,keepScroll){cur=id;S.last=id;save();try{history.replaceState(null,'','#'+id)}catch(e){}render();renderSide();if(!keepScroll)window.scrollTo(0,0)}

function nbSplit(h,sep){let d=0,t=0,out=[],last=0;for(let i=0;i<h.length;i++){const c=h[i];if(c==='<')t++;else if(c==='>')t--;else if(!t){if(c==='(')d++;else if(c===')')d--;else if(!d&&h.startsWith(sep,i)){out.push(h.slice(last,i));last=i+sep.length;i+=sep.length-1}}}out.push(h.slice(last));return out}
function nbConv(h){
  h=h.replace(/([A-Za-zα-ωΑ-Ω])̄/g,'<span class="ov">$1</span>');
  const eq=nbSplit(h,' = ');let rhs=eq.pop();const p=nbSplit(rhs,' / ');
  if(p.length===2){rhs='<span class="fr"><span>'+p[0].trim()+'</span><span>'+p[1].trim()+'</span></span>'}
  h=eq.concat([rhs]).join(' = ');
  h=h.replace(/Σ<sub>([^<>]*)<\/sub>/g,'<span class="sm"><span style="visibility:hidden">.</span><b>Σ</b><span>$1</span></span>');
  return h}
function nbify(){document.querySelectorAll('.card:not(.fin) table.sym td:first-child').forEach(td=>{if(td.dataset.nb)return;td.dataset.nb=1;if(/[=Σ∇√]/.test(td.textContent)){td.innerHTML=nbConv(td.innerHTML);td.classList.add('nbf')}});
 document.querySelectorAll('.card:not(.fin) b').forEach(b=>{if(b.closest('.nb')||b.dataset.nb||!/ \/ /.test(b.textContent)||!/[=]/.test(b.textContent)||b.textContent.length>90)return;b.dataset.nb=1;b.innerHTML=nbConv(b.innerHTML);b.classList.add('nbf')})}
function render(){
  const Ts=T(),t=Ts.find(x=>x.id===cur),i=S.pos[t.id]||0,c=t.cards[Math.min(i,t.cards.length-1)],u=U();
  const dots=t.cards.map((_,j)=>`<i class="${j<i?'ok':j===i?'on':''}"></i>`).join('');
  const last=i>=t.cards.length;let body='';
  if(last){
    const nxt=Ts[Ts.indexOf(t)+1];
    const qs=t.cards.map((c,j)=>[c,j]).filter(x=>x[0].k==='quiz');
    const right=qs.filter(([c,j])=>S.quiz[qkey(t,j)]===c.a).length;
    body=`<div class="card fin"><div class="big">✓</div><h3>${f(u.passed,t.title)}</h3><p>${f(u.score,right,qs.length)}</p><div class="nav" style="justify-content:center"><button class="btn ghost" id="again">${u.again}</button>${nxt?`<button class="btn" id="nxt">${f(u.goto,nxt.title)}</button>`:''}</div></div>`;
  } else if(c.k==='quiz'){
    const a=S.quiz[qkey(t,i)];
    body=`<div class="card"><span class="kind k-quiz">${u.kinds.quiz}</span><div class="q">${c.q}</div>${c.o.map((o,j)=>`<button class="opt ${a!==undefined?(j===c.a?'good':j===a?'bad':''):''}" data-j="${j}" ${a!==undefined?'disabled':''}>${o}</button>`).join('')}${a!==undefined?`<div class="why"><b>${a===c.a?u.right:u.wrong}</b>${c.why}</div>`:''}</div>`;
  } else body=`<div class="card"><span class="kind k-${c.k}">${u.kinds[c.k]}</span><h3>${c.h}</h3>${c.b}</div>`;
  const canNext=last||!(c.k==='quiz'&&S.quiz[qkey(t,i)]===undefined);
  view.innerHTML=`<div class="tag">${f(u.of,Ts.indexOf(t)+1,Ts.length)}</div><h2 class="tp">${t.title}</h2><p class="goal">${t.goal}</p><div class="dots">${dots}</div>${body}${last?'':`<div class="nav"><button class="btn ghost" id="prev" ${i===0?'disabled':''}>${u.prev}</button><button class="btn" id="next" ${canNext?'':'disabled'}>${i===t.cards.length-1?u.finish:u.next}</button></div>`}`;
  nbify();
  view.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.quiz[qkey(t,i)]=+b.dataset.j;save();render()});
  const nx=document.getElementById('next');if(nx)nx.onclick=()=>{S.pos[t.id]=i+1;if(i+1>=t.cards.length)S.done[t.id]=true;save();render();renderSide();window.scrollTo(0,0)};
  const pv=document.getElementById('prev');if(pv)pv.onclick=()=>{S.pos[t.id]=Math.max(0,i-1);save();render()};
  const ag=document.getElementById('again');if(ag)ag.onclick=()=>{S.pos[t.id]=0;t.cards.forEach((c,j)=>delete S.quiz[qkey(t,j)]);save();render()};
  const nt=document.getElementById('nxt');if(nt)nt.onclick=()=>go(Ts[Ts.indexOf(t)+1].id);
}
document.getElementById('menu').onclick=()=>side.classList.toggle('open');
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem('study-lang',lang)}catch(e){}renderSide();render()});
const h=(location.hash||'').slice(1);
if(TOPICS.some(t=>t.id===h))cur=h;else if(S.last&&TOPICS.some(t=>t.id===S.last))cur=S.last;
window.addEventListener('hashchange',()=>{const x=location.hash.slice(1);if(TOPICS.some(t=>t.id===x)&&x!==cur)go(x)});
renderSide();render();
</script></body></html>
