= \\frac{J(i,j)}{\\min(k_i,k_j) + 1 - \\Theta(A_{ij})}\\]</div>"}, {"key": "Ф: Сложности алгоритмов", "title": "Сложности алгоритмов", "group": "Лист формул", "groupShort": "Лист формул", "html": "<div class=\"tw\"><table><tr><th><p>Алгоритм</p></th><th><p>Время</p></th></tr><tr><td><p>BFS, DFS, топологическая сортировка</p></td><td><p>O(n + m)</p></td></tr><tr><td><p>Dijkstra (с кучей)</p></td><td><p>O((n + m) log n)</p></td></tr><tr><td><p>Prim–Jarník, Kruskal</p></td><td><p>O(m log n)</p></td></tr><tr><td><p>Floyd–Warshall</p></td><td><p>O(n³)</p></td></tr><tr><td><p>Transitive closure (n обходов)</p></td><td><p>O(n(n + m))</p></td></tr></table></div>"}];

}

function showLesson(l) {
  let sec = holder.querySelector(`[data-lesson="${l.id}"]`);
  if (!sec) {
    sec = document.createElement('section'); sec.className = 'view'; sec.dataset.lesson = l.id; sec.innerHTML = lessonShell(l); holder.appendChild(sec);
    sec.querySelector('[data-orig]').onclick = () => { ST.orig = l.id.toUpperCase(); save(); };
    const db = sec.querySelector('[data-done]');
    const paint = () => { db.textContent = ST.done[l.id] ? '✓ Изучено' : 'Отметить как изучено'; db.classList.toggle('done', !!ST.done[l.id]); };
    paint(); db.onclick = () => { ST.done[l.id] = !ST.done[l.id]; save(); paint(); renderSide(l.id); };
  }
  sec.hidden = false;
  if (!inited[l.id]) { inited[l.id] = true; try { l.init(sec); } catch (e) { console.error(l.id, e); } }
  try { l.draw && l.draw(sec); } catch (e) { console.error(l.id, e); }
}

/* ---------- router ---------- */
let current = null;
function route() {
  const h = (location.hash || '#home').slice(1) || 'home';
  const r = byId[h] ? h : (['home', 'orig', 'trainer'].includes(h) ? h : 'home');
  if (current && byId[current] && byId[current].hide) try { byId[current].hide(); } catch (e) {}
  document.querySelectorAll('main > .view, #v-lessons > .view').forEach(v => v.hidden = true);
  current = r;
  closeMenu();
  renderSide(r);
  const t = document.getElementById('topTitle');
  if (r === 'home') { renderHome(); document.getElementById('v-home').hidden = false; t.textContent = 'AACM Exam Studio'; }
  else if (r === 'orig') { document.getElementById('v-orig').hidden = false; renderOrig(); t.textContent = 'Оригиналы текстов'; }
  else if (r === 'trainer') { document.getElementById('v-trainer').hidden = false; showTrainer(); t.textContent = 'Тренажёр кода'; }
  else { showLesson(byId[r]); t.textContent = r.toUpperCase() + ' · ' + byId[r].menu; }
  document.querySelectorAll('#pill a').forEach(a=>{ if(a.getAttribute('href')==='#'+r) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route);
const redraw = () => { if (current && byId[current] && byId[current].draw) { const sec = holder.querySelector(`[data-lesson="${current}"]`); if (sec && !sec.hidden) try { byId[current].draw(sec); } catch (e) { console.error(e); } } };
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(redraw, 150); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redraw);
new MutationObserver(redraw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
document.fonts && document.fonts.ready.then(redraw);
route();
})();

], 2: [1]}"], ["({1: [2], 2: [1]}, 2, 1)", "{1: [2], 2: [1]}"], ["({1: [], 2: []}, 1, 2)", "{1: [2], 2: [1]}"], ["({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]}, 1, 3)", "{1: [2, 5, 3], 2: [1, 3, 4, 5], 3: [2, 4, 1], 4: [2, 3, 5], 5: [1, 2, 4]}"]], "tests_py": "[('({1: [2], 2: [1]}, 2, 3)', '{1: [2], 2: [1, 3], 3: [2]}'), (\"({}, 'a', 'b')\", \"{'a': ['b'], 'b': ['a']}\"), ('({1: [2], 2: [1]}, 1, 2)', '{1: [2], 2: [1]}'), ('({1: [2], 2: [1]}, 2, 1)', '{1: [2], 2: [1]}'), ('({1: [], 2: []}, 1, 2)', '{1: [2], 2: [1]}'), ('({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]}, 1, 3)', '{1: [2, 5, 3], 2: [1, 3, 4, 5], 3: [2, 4, 1], 4: [2, 3, 5], 5: [1, 2, 4]}')]", "n": 6}, {"id": "1.5", "week": 1, "fname": "triangle", "title": "triangle(graph, u, v, z) — edgelist", "statement": "A graph is represented through an edgelist (list of tuples, undirected). Implement the Python function triangle(graph, u, v, z) that returns True if nodes u, v and z form a triangle, False otherwise. (On the exam you were also asked to discuss the computational complexity: building a set of edges costs O(m), each lookup O(1); scanning the list three times also costs O(m).)", "example": "triangle([(1, 2), (2, 3), (1, 3), (3, 4)], 1, 2, 3) → True\ntriangle([(1, 2), (2, 3), (1, 3), (3, 4)], 1, 2, 4) → False", "hint": "Ребро может быть записано как (u, v) или (v, u). Удобно положить оба направления в set.", "cmp": "exact", "src": "Sample question", "solution": "def triangle(graph, u, v, z):\n    edges = set()\n    for a, b in graph:\n        edges.add((a, b))\n        edges.add((b, a))\n    return (u, v) in edges and (v, z) in edges and (u, z) in edges\n", "tests": [["([(1, 2), (2, 3), (1, 3), (3, 4)], 1, 2, 3)", "True"], ["([(1, 2), (2, 3), (1, 3), (3, 4)], 1, 2, 4)", "False"], ["([(2, 1), (3, 2), (1, 3)], 3, 1, 2)", "True"], ["([(1, 2), (2, 3)], 1, 2, 3)", "False"], ["([], 1, 2, 3)", "False"], ["([('a', 'b'), ('c', 'b'), ('a', 'c'), ('c', 'd'), ('d', 'a')], 'a', 'c', 'd')", "True"]], "tests_py": "[('([(1, 2), (2, 3), (1, 3), (3, 4)], 1, 2, 3)', 'True'), ('([(1, 2), (2, 3), (1, 3), (3, 4)], 1, 2, 4)', 'False'), ('([(2, 1), (3, 2), (1, 3)], 3, 1, 2)', 'True'), ('([(1, 2), (2, 3)], 1, 2, 3)', 'False'), ('([], 1, 2, 3)', 'False'), (\"([('a', 'b'), ('c', 'b'), ('a', 'c'), ('c', 'd'), ('d', 'a')], 'a', 'c', 'd')\", 'True')]", "n": 6}, {"id": "1.6", "week": 1, "fname": "remove_node", "title": "remove_node(graph, u) — dict of lists", "statement": "A graph is represented as a dictionary of lists. Implement the Python function remove_node(graph, u) that removes the node u and all its edges: delete the key u and remove u from every list in which it appears. If u is not in the graph, return the graph unchanged. Return the graph.", "example": "remove_node({1: [2, 3], 2: [1, 3, 4], 3: [1, 2], 4: [1, 2]}, 1)\n→ {2: [3, 4], 3: [2], 4: [2]}", "hint": "Проходите по ВСЕМ спискам, а не только по соседям u: списки могут быть несимметричными (как в июльском графе).", "cmp": "adj", "src": "", "solution": "def remove_node(graph, u):\n    if u in graph:\n        del graph[u]\n    for v in graph:\n        graph[v] = [w for w in graph[v] if w != u]\n    return graph\n", "tests": [["({1: [2, 3], 2: [1, 3, 4], 3: [1, 2], 4: [1, 2]}, 1)", "{2: [3, 4], 3: [2], 4: [2]}"], ["({1: [2, 3], 2: [1, 3, 4], 3: [1, 2], 4: [1, 2]}, 9)", "{1: [2, 3], 2: [1, 3, 4], 3: [1, 2], 4: [1, 2]}"], ["({'a': ['b'], 'b': ['a']}, 'a')", "{'b': []}"], ["({'a': []}, 'a')", "{}"], ["({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]}, 2)", "{1: [5], 3: [4], 4: [3, 5], 5: [1, 4]}"]], "tests_py": "[('({1: [2, 3], 2: [1, 3, 4], 3: [1, 2], 4: [1, 2]}, 1)', '{2: [3, 4], 3: [2], 4: [2]}'), ('({1: [2, 3], 2: [1, 3, 4], 3: [1, 2], 4: [1, 2]}, 9)', '{1: [2, 3], 2: [1, 3, 4], 3: [1, 2], 4: [1, 2]}'), (\"({'a': ['b'], 'b': ['a']}, 'a')\", \"{'b': []}\"), (\"({'a': []}, 'a')\", '{}'), ('({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]}, 2)', '{1: [5], 3: [4], 4: [3, 5], 5: [1, 4]}')]", "n": 5}, {"id": "1.7", "week": 1, "fname": "edgelist_to_adj", "title": "edgelist_to_adj(edges)", "statement": "Implement the Python function edgelist_to_adj(edges) that converts an undirected edgelist (list of tuples) into a dictionary of lists: each node maps to the list of its neighbours.", "example": "edgelist_to_adj([(1, 2), (1, 3), (2, 3), (3, 4)])\n→ {1: [2, 3], 2: [1, 3], 3: [1, 2, 4], 4: [3]}", "hint": "Для каждого ребра (u, v): graph.setdefault(u, []).append(v) и наоборот.", "cmp": "adj", "src": "", "solution": "def edgelist_to_adj(edges):\n    graph = {}\n    for u, v in edges:\n        graph.setdefault(u, []).append(v)\n        graph.setdefault(v, []).append(u)\n    return graph\n", "tests": [["([(1, 2), (1, 3), (2, 3), (3, 4)],)", "{1: [2, 3], 2: [1, 3], 3: [1, 2, 4], 4: [3]}"], ["([],)", "{}"], ["([('x', 'y')],)", "{'x': ['y'], 'y': ['x']}"], ["([(1, 2), (2, 3), (3, 1), (3, 4), (4, 5)],)", "{1: [2, 3], 2: [1, 3], 3: [2, 1, 4], 4: [3, 5], 5: [4]}"]], "tests_py": "[('([(1, 2), (1, 3), (2, 3), (3, 4)],)', '{1: [2, 3], 2: [1, 3], 3: [1, 2, 4], 4: [3]}'), ('([],)', '{}'), (\"([('x', 'y')],)\", \"{'x': ['y'], 'y': ['x']}\"), ('([(1, 2), (2, 3), (3, 1), (3, 4), (4, 5)],)', '{1: [2, 3], 2: [1, 3], 3: [2, 1, 4], 4: [3, 5], 5: [4]}')]", "n": 4}, {"id": "1.8", "week": 1, "fname": "adj_to_edgelist", "title": "adj_to_edgelist(graph)", "statement": "A graph is represented as an undirected dictionary of lists (symmetric). Implement the Python function adj_to_edgelist(graph) that returns its edgelist: a SORTED list of tuples (u, v) with u < v, each edge exactly once.", "example": "adj_to_edgelist({1: [2, 3], 2: [1, 3], 3: [1, 2, 4], 4: [3]})\n→ [(1, 2), (1, 3), (2, 3), (3, 4)]", "hint": "Берите ребро только когда u < v — так каждое ребро попадёт один раз. В конце sorted().", "cmp": "exact", "src": "", "solution": "def adj_to_edgelist(graph):\n    edges = []\n    for u in graph:\n        for v in graph[u]:\n            if u < v:\n                edges.append((u, v))\n    return sorted(edges)\n", "tests": [["({1: [2, 3], 2: [1, 3], 3: [1, 2, 4], 4: [3]},)", "[(1, 2), (1, 3), (2, 3), (3, 4)]"], ["({},)", "[]"], ["({1: [], 2: []},)", "[]"], ["({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]},)", "[(1, 2), (1, 5), (2, 3), (2, 4), (2, 5), (3, 4), (4, 5)]"], ["({'b': ['a'], 'a': ['b', 'c'], 'c': ['a']},)", "[('a', 'b'), ('a', 'c')]"]], "tests_py": "[('({1: [2, 3], 2: [1, 3], 3: [1, 2, 4], 4: [3]},)', '[(1, 2), (1, 3), (2, 3), (3, 4)]'), ('({},)', '[]'), ('({1: [], 2: []},)', '[]'), ('({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]},)', '[(1, 2), (1, 5), (2, 3), (2, 4), (2, 5), (3, 4), (4, 5)]'), (\"({'b': ['a'], 'a': ['b', 'c'], 'c': ['a']},)\", \"[('a', 'b'), ('a', 'c')]\")]", "n": 5}, {"id": "2.1", "week": 2, "fname": "average_degree", "title": "average_degree(graph)", "statement": "A graph is represented as an undirected dictionary of lists. Implement the Python function average_degree(graph) that returns the average degree ⟨k⟩ = 2L/N as a float. For an empty graph return 0.", "example": "average_degree({1: [2, 3], 2: [1], 3: [1]}) → 1.3333333333333333", "hint": "Сумма длин всех списков = 2L. Не забудьте случай N = 0.", "cmp": "float", "src": "", "solution": "def average_degree(graph):\n    if len(graph) == 0:\n        return 0\n    return sum(len(graph[v]) for v in graph) / len(graph)\n", "tests": [["({1: [2, 3], 2: [1], 3: [1]},)", "1.3333333333333333"], ["({},)", "0"], ["({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]},)", "2.8"], ["({1: [2], 2: [1], 3: [], 4: []},)", "0.5"], ["({1: [2], 2: [1, 3], 3: [2], 4: [5], 5: [4], 6: []},)", "1.0"]], "tests_py": "[('({1: [2, 3], 2: [1], 3: [1]},)', '1.3333333333333333'), ('({},)', '0'), ('({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]},)', '2.8'), ('({1: [2], 2: [1], 3: [], 4: []},)', '0.5'), ('({1: [2], 2: [1, 3], 3: [2], 4: [5], 5: [4], 6: []},)', '1.0')]", "n": 5}, {"id": "2.2", "week": 2, "fname": "degree_distribution", "title": "degree_distribution(graph)", "statement": "A graph is represented as an undirected dictionary of lists. Implement the Python function degree_distribution(graph) that returns the degree distribution p_k = N_k / N as a dictionary {k: p_k}, containing only the degrees that actually occur.", "example": "degree_distribution({1: [2, 3], 2: [1], 3: [1], 4: []})\n→ {2: 0.25, 1: 0.5, 0: 0.25}", "hint": "Сначала посчитайте N_k (сколько узлов имеют степень k), потом разделите на N.", "cmp": "floatdict", "src": "", "solution": "def degree_distribution(graph):\n    n = len(graph)\n    counts = {}\n    for v in graph:\n        k = len(graph[v])\n        counts[k] = counts.get(k, 0) + 1\n    return {k: counts[k] / n for k in counts}\n", "tests": [["({1: [2, 3], 2: [1], 3: [1], 4: []},)", "{2: 0.25, 1: 0.5, 0: 0.25}"], ["({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]},)", "{2: 0.4, 4: 0.2, 3: 0.4}"], ["({1: [2], 2: [1, 3], 3: [2], 4: [5], 5: [4], 6: []},)", "{1: 0.6666666666666666, 2: 0.16666666666666666, 0: 0.16666666666666666}"], ["({'a': ['b'], 'b': ['a']},)", "{1: 1.0}"]], "tests_py": "[('({1: [2, 3], 2: [1], 3: [1], 4: []},)', '{2: 0.25, 1: 0.5, 0: 0.25}'), ('({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]},)', '{2: 0.4, 4: 0.2, 3: 0.4}'), ('({1: [2], 2: [1, 3], 3: [2], 4: [5], 5: [4], 6: []},)', '{1: 0.6666666666666666, 2: 0.16666666666666666, 0: 0.16666666666666666}'), (\"({'a': ['b'], 'b': ['a']},)\", '{1: 1.0}')]", "n": 4}, {"id": "2.3", "week": 2, "fname": "isolated_nodes", "title": "isolated_nodes(graph)", "statement": "A graph is represented as a dictionary of lists. Implement the Python function isolated_nodes(graph) that returns the sorted list of nodes with degree 0.", "example": "isolated_nodes({1: [2], 2: [1], 3: [], 4: []}) → [3, 4]", "hint": "Узел изолирован, если его список пуст. Не забудьте sorted().", "cmp": "exact", "src": "", "solution": "def isolated_nodes(graph):\n    return sorted(v for v in graph if len(graph[v]) == 0)\n", "tests": [["({1: [2], 2: [1], 3: [], 4: []},)", "[3, 4]"], ["({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]},)", "[]"], ["({},)", "[]"], ["({'z': [], 'a': [], 'm': ['a'], 'b': []},)", "['a', 'b', 'z']"]], "tests_py": "[('({1: [2], 2: [1], 3: [], 4: []},)', '[3, 4]'), ('({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]},)', '[]'), ('({},)', '[]'), (\"({'z': [], 'a': [], 'm': ['a'], 'b': []},)\", \"['a', 'b', 'z']\")]", "n": 4}, {"id": "2.4", "week": 2, "fname": "clustering", "title": "clustering(graph, u) — local clustering coefficient", "statement": "A graph is represented as an undirected dictionary of lists. Implement the Python function clustering(graph, u) that returns the local clustering coefficient C_u = 2·L_u / (k_u·(k_u − 1)), where L_u is the number of links between the neighbours of u. If k_u < 2 return 0.", "example": "clustering({'A': ['B', 'C'], 'B': ['A', 'C', 'D'], 'C': ['A', 'B', 'D'], 'D': ['B', 'C', 'E'], 'E': ['D']}, 'B')\n→ 0.6666666666666666", "hint": "Переберите пары соседей (i < j по индексу в списке) и посчитайте, сколько из них связаны.", "cmp": "float", "src": "", "solution": "def clustering(graph, u):\n    nb = graph[u]\n    k = len(nb)\n    if k < 2:\n        return 0\n    links = 0\n    for i in range(k):\n        for j in range(i + 1, k):\n            if nb[j] in graph[nb[i]]:\n                links += 1\n    return 2 * links / (k * (k - 1))\n", "tests": [["({'A': ['B', 'C'], 'B': ['A', 'C', 'D'], 'C': ['A', 'B', 'D'], 'D': ['B', 'C', 'E'], 'E': ['D']}, 'B')", "0.6666666666666666"], ["({'A': ['B', 'C'], 'B': ['A', 'C', 'D'], 'C': ['A', 'B', 'D'], 'D': ['B', 'C', 'E'], 'E': ['D']}, 'A')", "1.0"], ["({'A': ['B', 'C'], 'B': ['A', 'C', 'D'], 'C': ['A', 'B', 'D'], 'D': ['B', 'C', 'E'], 'E': ['D']}, 'E')", "0"], ["({'A': ['B', 'C'], 'B': ['A', 'C', 'D'], 'C': ['A', 'B', 'D'], 'D': ['B', 'C', 'E'], 'E': ['D']}, 'D')", "0.3333333333333333"], ["({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]}, 2)", "0.5"], ["({1: [], 2: []}, 1)", "0"]], "tests_py": "[(\"({'A': ['B', 'C'], 'B': ['A', 'C', 'D'], 'C': ['A', 'B', 'D'], 'D': ['B', 'C', 'E'], 'E': ['D']}, 'B')\", '0.6666666666666666'), (\"({'A': ['B', 'C'], 'B': ['A', 'C', 'D'], 'C': ['A', 'B', 'D'], 'D': ['B', 'C', 'E'], 'E': ['D']}, 'A')\", '1.0'), (\"({'A': ['B', 'C'], 'B': ['A', 'C', 'D'], 'C': ['A', 'B', 'D'], 'D': ['B', 'C', 'E'], 'E': ['D']}, 'E')\", '0'), (\"({'A': ['B', 'C'], 'B': ['A', 'C', 'D'], 'C': ['A', 'B', 'D'], 'D': ['B', 'C', 'E'], 'E': ['D']}, 'D')\", '0.3333333333333333'), ('({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]}, 2)', '0.5'), ('({1: [], 2: []}, 1)', '0')]", "n": 6}, {"id": "2.5", "week": 2, "fname": "common_neighbors", "title": "common_neighbors(graph, u, v)", "statement": "A graph is represented as an undirected dictionary of lists. Implement the Python function common_neighbors(graph, u, v) that returns the sorted list of the common neighbours of u and v (the basis of the Common Neighbours link-prediction score).", "example": "common_neighbors({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]}, 1, 4)\n→ [2, 5]", "hint": "Пересечение множеств: set(graph[u]) & set(graph[v]).", "cmp": "exact", "src": "", "solution": "def common_neighbors(graph, u, v):\n    return sorted(set(graph[u]) & set(graph[v]))\n", "tests": [["({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]}, 1, 4)", "[2, 5]"], ["({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]}, 1, 3)", "[2]"], ["({'A': ['B', 'C'], 'B': ['A', 'C', 'D'], 'C': ['A', 'B', 'D'], 'D': ['B', 'C', 'E'], 'E': ['D']}, 'A', 'D')", "['B', 'C']"], ["({'A': ['B', 'C'], 'B': ['A', 'C', 'D'], 'C': ['A', 'B', 'D'], 'D': ['B', 'C', 'E'], 'E': ['D']}, 'A', 'E')", "[]"], ["({1: [2], 2: [1], 3: [], 4: []}, 3, 4)", "[]"]], "tests_py": "[('({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]}, 1, 4)', '[2, 5]'), ('({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]}, 1, 3)', '[2]'), (\"({'A': ['B', 'C'], 'B': ['A', 'C', 'D'], 'C': ['A', 'B', 'D'], 'D': ['B', 'C', 'E'], 'E': ['D']}, 'A', 'D')\", \"['B', 'C']\"), (\"({'A': ['B', 'C'], 'B': ['A', 'C', 'D'], 'C': ['A', 'B', 'D'], 'D': ['B', 'C', 'E'], 'E': ['D']}, 'A', 'E')\", '[]'), ('({1: [2], 2: [1], 3: [], 4: []}, 3, 4)', '[]')]", "n": 5}, {"id": "2.6", "week": 2, "fname": "jaccard", "title": "jaccard(graph, u, v)", "statement": "A graph is represented as an undirected dictionary of lists. Implement the Python function jaccard(graph, u, v) that returns the Jaccard coefficient |Γ(u) ∩ Γ(v)| / |Γ(u) ∪ Γ(v)| as a float. If the union is empty return 0.", "example": "jaccard({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]}, 1, 4)\n→ 0.6666666666666666", "hint": "Γ(u) — множество соседей u. Деление на ноль — частая потеря баллов.", "cmp": "float", "src": "", "solution": "def jaccard(graph, u, v):\n    a, b = set(graph[u]), set(graph[v])\n    union = a | b\n    if len(union) == 0:\n        return 0\n    return len(a & b) / len(union)\n", "tests": [["({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]}, 1, 4)", "0.6666666666666666"], ["({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]}, 1, 3)", "0.3333333333333333"], ["({'A': ['B', 'C'], 'B': ['A', 'C', 'D'], 'C': ['A', 'B', 'D'], 'D': ['B', 'C', 'E'], 'E': ['D']}, 'A', 'D')", "0.6666666666666666"], ["({1: [2], 2: [1], 3: [], 4: []}, 3, 4)", "0"], ["({'A': ['B', 'C'], 'B': ['A', 'C', 'D'], 'C': ['A', 'B', 'D'], 'D': ['B', 'C', 'E'], 'E': ['D']}, 'B', 'C')", "0.5"]], "tests_py": "[('({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]}, 1, 4)', '0.6666666666666666'), ('({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]}, 1, 3)', '0.3333333333333333'), (\"({'A': ['B', 'C'], 'B': ['A', 'C', 'D'], 'C': ['A', 'B', 'D'], 'D': ['B', 'C', 'E'], 'E': ['D']}, 'A', 'D')\", '0.6666666666666666'), ('({1: [2], 2: [1], 3: [], 4: []}, 3, 4)', '0'), (\"({'A': ['B', 'C'], 'B': ['A', 'C', 'D'], 'C': ['A', 'B', 'D'], 'D': ['B', 'C', 'E'], 'E': ['D']}, 'B', 'C')\", '0.5')]", "n": 5}, {"id": "2.7", "week": 2, "fname": "average_clustering", "title": "average_clustering(graph)", "statement": "A graph is represented as an undirected dictionary of lists. Implement the Python function average_clustering(graph) that returns the average clustering coefficient ⟨C⟩ = (1/N) Σ C_i, where C_i = 0 for nodes with degree < 2. For an empty graph return 0.", "example": "average_clustering({'A': ['B', 'C'], 'B': ['A', 'C', 'D'], 'C': ['A', 'B', 'D'], 'D': ['B', 'C', 'E'], 'E': ['D']})\n→ 0.5333333333333333", "hint": "Напишите вспомогательную функцию для C_i (как в 2.4) и усредните.", "cmp": "float", "src": "", "solution": "def average_clustering(graph):\n    if len(graph) == 0:\n        return 0\n    total = 0\n    for u in graph:\n        nb = graph[u]\n        k = len(nb)\n        if k < 2:\n            continue\n        links = 0\n        for i in range(k):\n            for j in range(i + 1, k):\n                if nb[j] in graph[nb[i]]:\n                    links += 1\n        total += 2 * links / (k * (k - 1))\n    return total / len(graph)\n", "tests": [["({'A': ['B', 'C'], 'B': ['A', 'C', 'D'], 'C': ['A', 'B', 'D'], 'D': ['B', 'C', 'E'], 'E': ['D']},)", "0.5333333333333333"], ["({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]},)", "0.7666666666666666"], ["({},)", "0"], ["({1: [2], 2: [1], 3: [], 4: []},)", "0.0"], ["({1: [2, 3], 2: [1, 3], 3: [1, 2]},)", "1.0"]], "tests_py": "[(\"({'A': ['B', 'C'], 'B': ['A', 'C', 'D'], 'C': ['A', 'B', 'D'], 'D': ['B', 'C', 'E'], 'E': ['D']},)\", '0.5333333333333333'), ('({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]},)', '0.7666666666666666'), ('({},)', '0'), ('({1: [2], 2: [1], 3: [], 4: []},)', '0.0'), ('({1: [2, 3], 2: [1, 3], 3: [1, 2]},)', '1.0')]", "n": 5}, {"id": "3.1", "week": 3, "fname": "bfs", "title": "bfs(graph, s) — visit order", "statement": "A graph is represented as a dictionary of lists. Implement the Python function bfs(graph, s) that performs a Breadth-First Search from s and returns the list of nodes in the order they are visited. Explore the neighbours of each node in the order they appear in its list.", "example": "bfs({'A': ['B', 'C'], 'B': ['A', 'D', 'E'], 'C': ['A', 'F'], 'D': ['B'], 'E': ['B', 'F'], 'F': ['C', 'E']}, 'A')\n→ ['A', 'B', 'C', 'D', 'E', 'F']", "hint": "Очередь (list с pop(0) или collections.deque) + множество visited. Помечайте узел посещённым в момент добавления в очередь.", "cmp": "exact", "src": "July exam (BFS)", "solution": "def bfs(graph, s):\n    visited = [s]\n    seen = {s}\n    queue = [s]\n    while queue:\n        u = queue.pop(0)\n        for v in graph[u]:\n            if v not in seen:\n                seen.add(v)\n                visited.append(v)\n                queue.append(v)\n    return visited\n", "tests": [["({'A': ['B', 'C'], 'B': ['A', 'D', 'E'], 'C': ['A', 'F'], 'D': ['B'], 'E': ['B', 'F'], 'F': ['C', 'E']}, 'A')", "['A', 'B', 'C', 'D', 'E', 'F']"], ["({'A': ['B', 'C'], 'B': ['A', 'D', 'E'], 'C': ['A', 'F'], 'D': ['B'], 'E': ['B', 'F'], 'F': ['C', 'E']}, 'F')", "['F', 'C', 'E', 'A', 'B', 'D']"], ["({1: [2], 2: [1, 3], 3: [2], 4: [5], 5: [4], 6: []}, 1)", "[1, 2, 3]"], ["({1: [2], 2: [1, 3], 3: [2], 4: [5], 5: [4], 6: []}, 6)", "[6]"], ["({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]}, 3)", "[3, 2, 4, 1, 5]"], ["({1: [2, 3], 2: [4], 3: [4], 4: []}, 1)", "[1, 2, 3, 4]"]], "tests_py": "[(\"({'A': ['B', 'C'], 'B': ['A', 'D', 'E'], 'C': ['A', 'F'], 'D': ['B'], 'E': ['B', 'F'], 'F': ['C', 'E']}, 'A')\", \"['A', 'B', 'C', 'D', 'E', 'F']\"), (\"({'A': ['B', 'C'], 'B': ['A', 'D', 'E'], 'C': ['A', 'F'], 'D': ['B'], 'E': ['B', 'F'], 'F': ['C', 'E']}, 'F')\", \"['F', 'C', 'E', 'A', 'B', 'D']\"), ('({1: [2], 2: [1, 3], 3: [2], 4: [5], 5: [4], 6: []}, 1)', '[1, 2, 3]'), ('({1: [2], 2: [1, 3], 3: [2], 4: [5], 5: [4], 6: []}, 6)', '[6]'), ('({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]}, 3)', '[3, 2, 4, 1, 5]'), ('({1: [2, 3], 2: [4], 3: [4], 4: []}, 1)', '[1, 2, 3, 4]')]", "n": 6}, {"id": "3.2", "week": 3, "fname": "dfs", "title": "dfs(graph, s) — recursive visit order", "statement": "A graph is represented as a dictionary of lists. Implement the Python function dfs(graph, s) that performs a recursive Depth-First Search from s (as in the slides: for each neighbour in list order, if not visited, visit it recursively) and returns the list of nodes in the order they are first visited.", "example": "dfs({'A': ['B', 'C'], 'B': ['A', 'D', 'E'], 'C': ['A', 'F'], 'D': ['B'], 'E': ['B', 'F'], 'F': ['C', 'E']}, 'A')\n→ ['A', 'B', 'D', 'E', 'F', 'C']", "hint": "Вспомогательная рекурсивная функция visit(u) с общим списком order. Итеративная версия со стеком даст другой порядок!", "cmp": "exact", "src": "", "solution": "def dfs(graph, s):\n    order = []\n    def visit(u):\n        order.append(u)\n        for v in graph[u]:\n            if v not in order:\n                visit(v)\n    visit(s)\n    return order\n", "tests": [["({'A': ['B', 'C'], 'B': ['A', 'D', 'E'], 'C': ['A', 'F'], 'D': ['B'], 'E': ['B', 'F'], 'F': ['C', 'E']}, 'A')", "['A', 'B', 'D', 'E', 'F', 'C']"], ["({'A': ['B', 'C'], 'B': ['A', 'D', 'E'], 'C': ['A', 'F'], 'D': ['B'], 'E': ['B', 'F'], 'F': ['C', 'E']}, 'D')", "['D', 'B', 'A', 'C', 'F', 'E']"], ["({1: [2], 2: [1, 3], 3: [2], 4: [5], 5: [4], 6: []}, 2)", "[2, 1, 3]"], ["({1: [2], 2: [1, 3], 3: [2], 4: [5], 5: [4], 6: []}, 6)", "[6]"], ["({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]}, 1)", "[1, 2, 3, 4, 5]"], ["({1: [2, 3], 2: [4], 3: [4], 4: []}, 1)", "[1, 2, 4, 3]"]], "tests_py": "[(\"({'A': ['B', 'C'], 'B': ['A', 'D', 'E'], 'C': ['A', 'F'], 'D': ['B'], 'E': ['B', 'F'], 'F': ['C', 'E']}, 'A')\", \"['A', 'B', 'D', 'E', 'F', 'C']\"), (\"({'A': ['B', 'C'], 'B': ['A', 'D', 'E'], 'C': ['A', 'F'], 'D': ['B'], 'E': ['B', 'F'], 'F': ['C', 'E']}, 'D')\", \"['D', 'B', 'A', 'C', 'F', 'E']\"), ('({1: [2], 2: [1, 3], 3: [2], 4: [5], 5: [4], 6: []}, 2)', '[2, 1, 3]'), ('({1: [2], 2: [1, 3], 3: [2], 4: [5], 5: [4], 6: []}, 6)', '[6]'), ('({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]}, 1)', '[1, 2, 3, 4, 5]'), ('({1: [2, 3], 2: [4], 3: [4], 4: []}, 1)', '[1, 2, 4, 3]')]", "n": 6}, {"id": "3.3", "week": 3, "fname": "bfs_distances", "title": "bfs_distances(graph, s)", "statement": "A graph is represented as a dictionary of lists. Implement the Python function bfs_distances(graph, s) that returns a dictionary {node: distance} with the shortest-path distance (number of edges) from s to every node reachable from s (s itself has distance 0). Unreachable nodes are not included.", "example": "bfs_distances({'A': ['B', 'C'], 'B': ['A', 'D', 'E'], 'C': ['A', 'F'], 'D': ['B'], 'E': ['B', 'F'], 'F': ['C', 'E']}, 'A')\n→ {'A': 0, 'B': 1, 'C': 1, 'D': 2, 'E': 2, 'F': 2}", "hint": "BFS по уровням: dist[v] = dist[u] + 1 при первом обнаружении v.", "cmp": "exact", "src": "", "solution": "def bfs_distances(graph, s):\n    dist = {s: 0}\n    queue = [s]\n    while queue:\n        u = queue.pop(0)\n        for v in graph[u]:\n            if v not in dist:\n                dist[v] = dist[u] + 1\n                queue.append(v)\n    return dist\n", "tests": [["({'A': ['B', 'C'], 'B': ['A', 'D', 'E'], 'C': ['A', 'F'], 'D': ['B'], 'E': ['B', 'F'], 'F': ['C', 'E']}, 'A')", "{'A': 0, 'B': 1, 'C': 1, 'D': 2, 'E': 2, 'F': 2}"], ["({'A': ['B', 'C'], 'B': ['A', 'D', 'E'], 'C': ['A', 'F'], 'D': ['B'], 'E': ['B', 'F'], 'F': ['C', 'E']}, 'D')", "{'D': 0, 'B': 1, 'A': 2, 'E': 2, 'C': 3, 'F': 3}"], ["({1: [2], 2: [1, 3], 3: [2], 4: [5], 5: [4], 6: []}, 1)", "{1: 0, 2: 1, 3: 2}"], ["({1: [2], 2: [1, 3], 3: [2], 4: [5], 5: [4], 6: []}, 6)", "{6: 0}"], ["({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]}, 3)", "{3: 0, 2: 1, 4: 1, 1: 2, 5: 2}"]], "tests_py": "[(\"({'A': ['B', 'C'], 'B': ['A', 'D', 'E'], 'C': ['A', 'F'], 'D': ['B'], 'E': ['B', 'F'], 'F': ['C', 'E']}, 'A')\", \"{'A': 0, 'B': 1, 'C': 1, 'D': 2, 'E': 2, 'F': 2}\"), (\"({'A': ['B', 'C'], 'B': ['A', 'D', 'E'], 'C': ['A', 'F'], 'D': ['B'], 'E': ['B', 'F'], 'F': ['C', 'E']}, 'D')\", \"{'D': 0, 'B': 1, 'A': 2, 'E': 2, 'C': 3, 'F': 3}\"), ('({1: [2], 2: [1, 3], 3: [2], 4: [5], 5: [4], 6: []}, 1)', '{1: 0, 2: 1, 3: 2}'), ('({1: [2], 2: [1, 3], 3: [2], 4: [5], 5: [4], 6: []}, 6)', '{6: 0}'), ('({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]}, 3)', '{3: 0, 2: 1, 4: 1, 1: 2, 5: 2}')]", "n": 5}, {"id": "3.4", "week": 3, "fname": "count_components", "title": "count_components(graph)", "statement": "A graph is represented as an undirected dictionary of lists. Implement the Python function count_components(graph) that returns the number of connected components (an isolated node is a component of its own).", "example": "count_components({1: [2], 2: [1, 3], 3: [2], 4: [5], 5: [4], 6: []}) → 3", "hint": "Как DFS_complete в слайдах: запускайте обход из каждого ещё не посещённого узла и считайте запуски.", "cmp": "exact", "src": "", "solution": "def count_components(graph):\n    seen = set()\n    count = 0\n    for s in graph:\n        if s in seen:\n            continue\n        count += 1\n        stack = [s]\n        seen.add(s)\n        while stack:\n            u = stack.pop()\n            for v in graph[u]:\n                if v not in seen:\n                    seen.add(v)\n                    stack.append(v)\n    return count\n", "tests": [["({1: [2], 2: [1, 3], 3: [2], 4: [5], 5: [4], 6: []},)", "3"], ["({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]},)", "1"], ["({},)", "0"], ["({1: [2], 2: [1], 3: [], 4: []},)", "3"], ["({'a': [], 'b': [], 'c': []},)", "3"]], "tests_py": "[('({1: [2], 2: [1, 3], 3: [2], 4: [5], 5: [4], 6: []},)', '3'), ('({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]},)', '1'), ('({},)', '0'), ('({1: [2], 2: [1], 3: [], 4: []},)', '3'), (\"({'a': [], 'b': [], 'c': []},)\", '3')]", "n": 5}, {"id": "3.5", "week": 3, "fname": "is_connected", "title": "is_connected(graph)", "statement": "A graph is represented as an undirected, non-empty dictionary of lists. Implement the Python function is_connected(graph) that returns True if the graph is connected, False otherwise.", "example": "is_connected({1: [2], 2: [1, 3], 3: [2]}) → True\nis_connected({1: [2], 2: [1], 3: []}) → False", "hint": "Обход из любого узла; граф связный, если посещены все узлы: len(visited) == len(graph).", "cmp": "exact", "src": "", "solution": "def is_connected(graph):\n    start = next(iter(graph))\n    seen = {start}\n    stack = [start]\n    while stack:\n        u = stack.pop()\n        for v in graph[u]:\n            if v not in seen:\n                seen.add(v)\n                stack.append(v)\n    return len(seen) == len(graph)\n", "tests": [["({1: [2], 2: [1, 3], 3: [2]},)", "True"], ["({1: [2], 2: [1], 3: [], 4: []},)", "False"], ["({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]},)", "True"], ["({'solo': []},)", "True"], ["({1: [2], 2: [1, 3], 3: [2], 4: [5], 5: [4], 6: []},)", "False"]], "tests_py": "[('({1: [2], 2: [1, 3], 3: [2]},)', 'True'), ('({1: [2], 2: [1], 3: [], 4: []},)', 'False'), ('({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]},)', 'True'), (\"({'solo': []},)\", 'True'), ('({1: [2], 2: [1, 3], 3: [2], 4: [5], 5: [4], 6: []},)', 'False')]", "n": 5}, {"id": "3.6", "week": 3, "fname": "shortest_path", "title": "shortest_path(graph, s, t)", "statement": "A graph is represented as a dictionary of lists (unweighted). Implement the Python function shortest_path(graph, s, t) that returns a path from s to t with the minimum number of edges, as a list of nodes [s, ..., t]. If t is not reachable return an empty list. If several shortest paths exist, any of them is accepted.", "example": "shortest_path({'A': ['B', 'C'], 'B': ['A', 'D', 'E'], 'C': ['A', 'F'], 'D': ['B'], 'E': ['B', 'F'], 'F': ['C', 'E']}, 'A', 'F')\n→ ['A', 'C', 'F']", "hint": "BFS со словарём parent (как discovered в слайдах), затем идём назад от t к s и разворачиваем путь.", "cmp": "path", "src": "", "solution": "def shortest_path(graph, s, t):\n    parent = {s: None}\n    queue = [s]\n    while queue:\n        u = queue.pop(0)\n        if u == t:\n            break\n        for v in graph[u]:\n            if v not in parent:\n                parent[v] = u\n                queue.append(v)\n    if t not in parent:\n        return []\n    path = []\n    walk = t\n    while walk is not None:\n        path.append(walk)\n        walk = parent[walk]\n    path.reverse()\n    return path\n", "tests": [["({'A': ['B', 'C'], 'B': ['A', 'D', 'E'], 'C': ['A', 'F'], 'D': ['B'], 'E': ['B', 'F'], 'F': ['C', 'E']}, 'A', 'F')", "['A', 'C', 'F']"], ["({'A': ['B', 'C'], 'B': ['A', 'D', 'E'], 'C': ['A', 'F'], 'D': ['B'], 'E': ['B', 'F'], 'F': ['C', 'E']}, 'D', 'F')", "['D', 'B', 'E', 'F']"], ["({1: [2], 2: [1, 3], 3: [2], 4: [5], 5: [4], 6: []}, 1, 5)", "[]"], ["({1: [2], 2: [1, 3], 3: [2], 4: [5], 5: [4], 6: []}, 2, 2)", "[2]"], ["({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]}, 1, 3)", "[1, 2, 3]"]], "tests_py": "[(\"({'A': ['B', 'C'], 'B': ['A', 'D', 'E'], 'C': ['A', 'F'], 'D': ['B'], 'E': ['B', 'F'], 'F': ['C', 'E']}, 'A', 'F')\", \"['A', 'C', 'F']\"), (\"({'A': ['B', 'C'], 'B': ['A', 'D', 'E'], 'C': ['A', 'F'], 'D': ['B'], 'E': ['B', 'F'], 'F': ['C', 'E']}, 'D', 'F')\", \"['D', 'B', 'E', 'F']\"), ('({1: [2], 2: [1, 3], 3: [2], 4: [5], 5: [4], 6: []}, 1, 5)', '[]'), ('({1: [2], 2: [1, 3], 3: [2], 4: [5], 5: [4], 6: []}, 2, 2)', '[2]'), ('({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]}, 1, 3)', '[1, 2, 3]')]", "n": 5}, {"id": "3.7", "week": 3, "fname": "dijkstra", "title": "dijkstra(graph, s)", "statement": "A weighted graph is represented as a dictionary of dictionaries: graph[u][v] is the (non-negative) weight of the edge from u to v. Implement the Python function dijkstra(graph, s) that returns a dictionary {node: distance} with the shortest distance from s to every node reachable from s.", "example": "dijkstra({'s': {'a': 2, 'b': 1}, 'a': {'s': 3, 'b': 4, 'c': 8}, 'b': {'s': 4, 'a': 2, 'd': 2}, 'c': {'a': 2, 'd': 7, 't': 4}, 'd': {'b': 1, 'c': 11, 't': 5}, 't': {'c': 3, 'd': 5}}, 's')\n→ {'s': 0, 'a': 2, 'b': 1, 'c': 10, 'd': 3, 't': 8}", "hint": "D[s] = 0, остальные ∞. Каждый раз берите вершину вне «облака» с минимальным D и делайте relaxation её рёбер. heapq ускоряет, но min() по словарю тоже проходит.", "cmp": "floatdict", "src": "", "solution": "def dijkstra(graph, s):\n    D = {v: float('inf') for v in graph}\n    D[s] = 0\n    cloud = set()\n    while len(cloud) < len(graph):\n        u = None\n        for v in graph:\n            if v not in cloud and (u is None or D[v] < D[u]):\n                u = v\n        if D[u] == float('inf'):\n            break\n        cloud.add(u)\n        for v, w in graph[u].items():\n            if D[u] + w < D[v]:\n                D[v] = D[u] + w\n    return {v: D[v] for v in D if D[v] != float('inf')}\n", "tests": [["({'s': {'a': 2, 'b': 1}, 'a': {'s': 3, 'b': 4, 'c': 8}, 'b': {'s': 4, 'a': 2, 'd': 2}, 'c': {'a': 2, 'd': 7, 't': 4}, 'd': {'b': 1, 'c': 11, 't': 5}, 't': {'c': 3, 'd': 5}}, 's')", "{'s': 0, 'a': 2, 'b': 1, 'c': 10, 'd': 3, 't': 8}"], ["({'s': {'a': 2, 'b': 1}, 'a': {'s': 3, 'b': 4, 'c': 8}, 'b': {'s': 4, 'a': 2, 'd': 2}, 'c': {'a': 2, 'd': 7, 't': 4}, 'd': {'b': 1, 'c': 11, 't': 5}, 't': {'c': 3, 'd': 5}}, 't')", "{'s': 8, 'a': 5, 'b': 6, 'c': 3, 'd': 5, 't': 0}"], ["({1: {2: 7, 3: 9, 6: 14}, 2: {1: 7, 3: 10, 4: 15}, 3: {1: 9, 2: 10, 4: 11, 6: 2}, 4: {2: 15, 3: 11, 5: 6}, 5: {4: 6, 6: 9}, 6: {1: 14, 3: 2, 5: 9}}, 1)", "{1: 0, 2: 7, 3: 9, 4: 20, 5: 20, 6: 11}"], ["({'a': {'b': 1}, 'b': {}, 'c': {'a': 1}}, 'a')", "{'a': 0, 'b': 1}"], ["({'x': {}}, 'x')", "{'x': 0}"]], "tests_py": "[(\"({'s': {'a': 2, 'b': 1}, 'a': {'s': 3, 'b': 4, 'c': 8}, 'b': {'s': 4, 'a': 2, 'd': 2}, 'c': {'a': 2, 'd': 7, 't': 4}, 'd': {'b': 1, 'c': 11, 't': 5}, 't': {'c': 3, 'd': 5}}, 's')\", \"{'s': 0, 'a': 2, 'b': 1, 'c': 10, 'd': 3, 't': 8}\"), (\"({'s': {'a': 2, 'b': 1}, 'a': {'s': 3, 'b': 4, 'c': 8}, 'b': {'s': 4, 'a': 2, 'd': 2}, 'c': {'a': 2, 'd': 7, 't': 4}, 'd': {'b': 1, 'c': 11, 't': 5}, 't': {'c': 3, 'd': 5}}, 't')\", \"{'s': 8, 'a': 5, 'b': 6, 'c': 3, 'd': 5, 't': 0}\"), ('({1: {2: 7, 3: 9, 6: 14}, 2: {1: 7, 3: 10, 4: 15}, 3: {1: 9, 2: 10, 4: 11, 6: 2}, 4: {2: 15, 3: 11, 5: 6}, 5: {4: 6, 6: 9}, 6: {1: 14, 3: 2, 5: 9}}, 1)', '{1: 0, 2: 7, 3: 9, 4: 20, 5: 20, 6: 11}'), (\"({'a': {'b': 1}, 'b': {}, 'c': {'a': 1}}, 'a')\", \"{'a': 0, 'b': 1}\"), (\"({'x': {}}, 'x')\", \"{'x': 0}\")]", "n": 5}, {"id": "M1", "week": 0, "fname": "neighbors_at_distance_2", "title": "neighbors_at_distance_2(graph, u)", "statement": "A graph is represented as an undirected dictionary of lists. Implement the Python function neighbors_at_distance_2(graph, u) that returns the sorted list of nodes whose shortest-path distance from u is exactly 2 (neighbours of neighbours that are neither u nor a neighbour of u).", "example": "neighbors_at_distance_2({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]}, 1)\n→ [3, 4]", "hint": "", "cmp": "exact", "src": "Mock exam 1", "solution": "def neighbors_at_distance_2(graph, u):\n    first = set(graph[u])\n    result = set()\n    for v in first:\n        for w in graph[v]:\n            if w != u and w not in first:\n                result.add(w)\n    return sorted(result)\n", "tests": [["({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]}, 1)", "[3, 4]"], ["({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]}, 2)", "[]"], ["({'A': ['B', 'C'], 'B': ['A', 'D', 'E'], 'C': ['A', 'F'], 'D': ['B'], 'E': ['B', 'F'], 'F': ['C', 'E']}, 'A')", "['D', 'E', 'F']"], ["({1: [2], 2: [1, 3], 3: [2], 4: [5], 5: [4], 6: []}, 1)", "[3]"], ["({1: [2], 2: [1], 3: [], 4: []}, 3)", "[]"]], "tests_py": "[('({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]}, 1)', '[3, 4]'), ('({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]}, 2)', '[]'), (\"({'A': ['B', 'C'], 'B': ['A', 'D', 'E'], 'C': ['A', 'F'], 'D': ['B'], 'E': ['B', 'F'], 'F': ['C', 'E']}, 'A')\", \"['D', 'E', 'F']\"), ('({1: [2], 2: [1, 3], 3: [2], 4: [5], 5: [4], 6: []}, 1)', '[3]'), ('({1: [2], 2: [1], 3: [], 4: []}, 3)', '[]')]", "n": 5}, {"id": "M2", "week": 0, "fname": "count_triangles", "title": "count_triangles(graph)", "statement": "A graph is represented as an undirected dictionary of lists. Implement the Python function count_triangles(graph) that returns the total number of triangles in the graph (each triangle counted once).", "example": "count_triangles({'A': ['B', 'C'], 'B': ['A', 'C', 'D'], 'C': ['A', 'B', 'D'], 'D': ['B', 'C', 'E'], 'E': ['D']}) → 2", "hint": "", "cmp": "exact", "src": "Mock exam 2", "solution": "def count_triangles(graph):\n    nodes = list(graph)\n    count = 0\n    for i in range(len(nodes)):\n        for j in range(i + 1, len(nodes)):\n            for k in range(j + 1, len(nodes)):\n                a, b, c = nodes[i], nodes[j], nodes[k]\n                if b in graph[a] and c in graph[b] and a in graph[c]:\n                    count += 1\n    return count\n", "tests": [["({'A': ['B', 'C'], 'B': ['A', 'C', 'D'], 'C': ['A', 'B', 'D'], 'D': ['B', 'C', 'E'], 'E': ['D']},)", "2"], ["({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]},)", "3"], ["({},)", "0"], ["({1: [2, 3, 4], 2: [1, 3, 4], 3: [1, 2, 4], 4: [1, 2, 3]},)", "4"], ["({'A': ['B', 'C'], 'B': ['A', 'D', 'E'], 'C': ['A', 'F'], 'D': ['B'], 'E': ['B', 'F'], 'F': ['C', 'E']},)", "0"]], "tests_py": "[(\"({'A': ['B', 'C'], 'B': ['A', 'C', 'D'], 'C': ['A', 'B', 'D'], 'D': ['B', 'C', 'E'], 'E': ['D']},)\", '2'), ('({1: [2, 5], 2: [1, 3, 4, 5], 3: [2, 4], 4: [2, 3, 5], 5: [1, 2, 4]},)', '3'), ('({},)', '0'), ('({1: [2, 3, 4], 2: [1, 3, 4], 3: [1, 2, 4], 4: [1, 2, 3]},)', '4'), (\"({'A': ['B', 'C'], 'B': ['A', 'D', 'E'], 'C': ['A', 'F'], 'D': ['B'], 'E': ['B', 'F'], 'F': ['C', 'E']},)\", '0')]", "n": 5}, {"id": "M3", "week": 0, "fname": "has_cycle", "title": "has_cycle(graph)", "statement": "A graph is represented as an undirected dictionary of lists (simple graph, possibly disconnected). Implement the Python function has_cycle(graph) that returns True if the graph contains a cycle, False otherwise.", "example": "has_cycle({1: [2], 2: [1, 3], 3: [2]}) → False\nhas_cycle({1: [2, 3], 2: [1, 3], 3: [1, 2]}) → True", "hint": "", "cmp": "exact", "src": "Mock exam 3", "solution": "def has_cycle(graph):\n    seen = set()\n    for s in graph:\n        if s in seen:\n            continue\n        stack = [(s, None)]\n        seen.add(s)\n        while stack:\n            u, parent = stack.pop()\n            for v in graph[u]:\n                if v not in seen:\n                    seen.add(v)\n                    stack.append((v, u))\n                elif v != parent:\n                    return True\n    return False\n", "tests": [["({1: [2], 2: [1, 3], 3: [2]},)", "False"], ["({1: [2, 3], 2: [1, 3], 3: [1, 2]},)", "True"], ["({1: [2], 2: [1, 3], 3: [2], 4: [5], 5: [4], 6: []},)", "False"], ["({'A': ['B', 'C'], 'B': ['A', 'D', 'E'], 'C': ['A', 'F'], 'D': ['B'], 'E': ['B', 'F'], 'F': ['C', 'E']},)", "True"], ["({1: [2], 2: [1], 3: [4, 5], 4: [3, 5], 5: [3, 4]},)", "True"], ["({},)", "False"]], "tests_py": "[('({1: [2], 2: [1, 3], 3: [2]},)', 'False'), ('({1: [2, 3], 2: [1, 3], 3: [1, 2]},)', 'True'), ('({1: [2], 2: [1, 3], 3: [2], 4: [5], 5: [4], 6: []},)', 'False'), (\"({'A': ['B', 'C'], 'B': ['A', 'D', 'E'], 'C': ['A', 'F'], 'D': ['B'], 'E': ['B', 'F'], 'F': ['C', 'E']},)\", 'True'), ('({1: [2], 2: [1], 3: [4, 5], 4: [3, 5], 5: [3, 4]},)', 'True'), ('({},)', 'False')]", "n": 6}], "mocks": [{"id": 1, "code": "M1", "essays": [{"q": "Describe the reasons that led to the introduction of the Watts–Strogatz model and its main characteristics (at least 300 words).", "ref": "E4"}, {"q": "Describe the Breadth-First Search algorithm, its properties and its computational cost (at least 300 words).", "ref": "E11"}]}, {"id": 2, "code": "M2", "essays": [{"q": "Discuss the differences existing between the Erdős–Rényi and the Barabási–Albert models (at least 300 words).", "ref": "E8"}, {"q": "Describe the robustness of scale-free networks against random failures and targeted attacks (at least 300 words).", "ref": "R1"}]}, {"id": 3, "code": "M3", "essays": [{"q": "Describe the emergence of the giant connected component in random graphs (at least 300 words).", "ref": "E2"}, {"q": "Describe the Barabási–Albert model: growth, preferential attachment and degree dynamics (at least 300 words).", "ref": "E7"}]}]};
const HARNESS = "# Grading harness. Runs in Brython in the page and in CPython for verification.\n# Inputs: CODE (user source), FNAME, TESTS (list of (args_src, expected_src)), CMP.\n# Output: RESULT string: lines \"status\\x1finput\\x1fexpected\\x1fgot\" separated by \\x1e; first line is header.\n\ndef _norm(x):\n    if isinstance(x, tuple) or isinstance(x, list):\n        return [_norm(i) for i in x]\n    if isinstance(x, (set, frozenset)):\n        return sorted([_norm(i) for i in x], key=repr)\n    if isinstance(x, dict):\n        return {k: _norm(v) for k, v in x.items()}\n    return x\n\ndef _close(a, b):\n    try:\n        return abs(float(a) - float(b)) < 1e-6\n    except Exception:\n        return False\n\ndef _cmp(kind, got, exp, args):\n    if kind == \"exact\":\n        if isinstance(exp, bool) or isinstance(got, bool):\n            return type(got) == type(exp) and got == exp\n        return _norm(got) == _norm(exp)\n    if kind == \"adj\":\n        if not isinstance(got, dict) or set(got.keys()) != set(exp.keys()):\n            return False\n        for k in exp:\n            g = got[k]\n            if not isinstance(g, (list, tuple, set)):\n                return False\n            if sorted(list(g), key=repr) != sorted(list(exp[k]), key=repr):\n                return False\n        return True\n    if kind == \"float\":\n        if isinstance(got, bool):\n            return False\n        return _close(got, exp)\n    if kind == \"floatdict\":\n        if not isinstance(got, dict) or set(got.keys()) != set(exp.keys()):\n            return False\n        return all(_close(got[k], exp[k]) for k in exp)\n    if kind == \"path\":\n        graph, s, t = args[0], args[1], args[2]\n        if not isinstance(got, (list, tuple)):\n            return False\n        got = list(got)\n        if len(exp) == 0:\n            return len(got) == 0\n        if len(got) != len(exp) or got[0] != s or got[-1] != t:\n            return False\n        for i in range(len(got) - 1):\n            if got[i + 1] not in graph[got[i]]:\n                return False\n        return True\n    return False\n\ndef _short(s, n=300):\n    s = str(s)\n    return s if len(s) <= n else s[:n] + \" \u2026\"\n\ndef run_all(code, fname, tests, kind):\n    out = []\n    ns = {}\n    try:\n        exec(code, ns)\n    except Exception as e:\n        return \"ERROR\\x1f\" + type(e).__name__ + \": \" + str(e)\n    if fname not in ns or not callable(ns[fname]):\n        return \"ERROR\\x1f\" + \"Function \" + fname + \"() is not defined. Check the name.\"\n    f = ns[fname]\n    rows = []\n    for args_src, exp_src in tests:\n        args = eval(args_src)\n        call_args = eval(args_src)  # fresh copy, the function may mutate it\n        exp = eval(exp_src)\n        try:\n            got = f(*call_args)\n            ok = _cmp(kind, got, exp, args)\n            got_s = repr(got)\n        except Exception as e:\n            ok = False\n            got_s = \"*** \" + type(e).__name__ + \": \" + str(e)\n        call = fname + repr(tuple(args)) if len(args) != 1 else fname + \"(\" + repr(args[0]) + \")\"\n        rows.append((\"OK\" if ok else \"FAIL\") + \"\\x1f\" + _short(call) + \"\\x1f\" + _short(repr(exp)) + \"\\x1f\" + _short(got_s))\n    return \"DONE\\x1e\" + \"\\x1e\".join(rows)\n";
const PENALTY = 10;           // % per failed check, as on the exam
const VISIBLE_TESTS = 2;      // first tests shown in full, the rest are hidden
