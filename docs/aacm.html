ны. Модель BA даёт степенной закон <code>p_k ~ k^(-3)</code> с показателем γ = 3, не зависящим от m, N и t. В его длинном хвосте есть хабы, и самый большой хаб растёт полиномиально с размером сети. В модели BA степень узла растёт как <code>k_i(t) = m (t / t_i)^(1/2)</code>, поэтому хабами становятся самые старые узлы (first-mover advantage); в модели ER то, какой узел окажется самым большим, решает чистая случайность.</p><p>Структура влияет и на другие свойства. Расстояния в сетях ER масштабируются как ln N / ln ⟨k⟩ (тесный мир); в модели BA при γ = 3 — как ln N / ln ln N, немного короче благодаря хабам. Сети ER распадаются после случайного удаления конечной доли узлов, тогда как scale-free сети хорошо переносят случайные отказы, но уязвимы к атакам на хабы.</p><p>У обеих моделей общий недостаток: их коэффициент кластеризации убывает с размером сети и намного ниже, чем в реальных сетях. В целом модель ER — математически чистый эталон, а модель BA объясняет происхождение свойства scale-free, наблюдаемого в реальных сетях.</p><p><b>Формулы:</b> см. оригинал выше.</p>"}, {"key": "E9", "title": "E9. Are growth and preferential attachment both necessary? (Models A and B)", "group": "Неделя 2 — scale-free и модели роста (E5–E10)", "groupShort": "Неделя 2", "html": "<p><b>Как могут спросить:</b> Describe what happens in the absence of growth or of preferential attachment. / How can preferential attachment be measured?</p><p><b>Скелет:</b> question → Model A (growth only) → exponential distribution → Model B (PA only) → complete graph → conclusion → measuring PA (π(k), α regimes).</p><p><b>Model answer (~300 words):</b></p><p>The Barabási–Albert model combines two ingredients, growth and preferential attachment, so a natural question is whether both are needed for the scale-free property. Two reduced models answer it.</p><p>Model A keeps growth but removes preferential attachment. It starts with m0 nodes, and at each step a new node with m links is added, but each link chooses its target uniformly at random, independently of the degree. The continuum theory shows that a node&#x27;s degree then grows only logarithmically with time, and the degree distribution becomes exponential, <code>p(k) ~ e^(-k/m)</code>. An exponential decays much faster than a power law, so hubs disappear: without preferential attachment there is no rich-get-richer process.</p><p>Model B keeps preferential attachment but removes growth. It starts with N nodes and no new nodes are ever added; at each step a randomly selected node is linked to a node chosen with probability Pi(k_i). The number of links grows linearly with time, so every degree grows linearly as well. Early on the network behaves like the BA model, but after a transient all degrees converge to the average, the distribution develops a peak, and eventually the network becomes a complete graph in which every node has degree N-1. The distribution is not stationary.</p><p>Since Model A gives a stationary but exponential distribution and Model B loses stationarity, both ingredients are simultaneously necessary for the scale-free property.</p><p>Preferential attachment can also be measured. Comparing two maps of a network taken at times t and t + delta t, the change of degree of each node estimates Pi(k). To reduce noise we use the cumulative function pi(k), the sum of Pi up to k: without preferential attachment <code>pi(k) ~ k</code>, with linear attachment <code>pi(k) ~ k^2</code>. Fitting <code>Pi(k) ~ k^alpha</code> gives alpha = 1 for the Internet and citation networks and alpha = 0.9 (sublinear) for co-authorship and actor networks. alpha = 0 gives an exponential distribution, 0 &lt; alpha &lt; 1 fewer and smaller hubs, alpha = 1 the BA power law, and alpha &gt; 1 super-hubs that attract almost all the links.</p><p><b>Формулы:</b></p><div class=\"tex\">\\[\\text{Model A: } \\Pi(k_i) = \\frac{1}{m_0 + t - 1}, \\quad k_i(t) = m \\ln\\!\\left(e\\,\\frac{m_0 + t - 1}{m_0 + t_i - 1}\\right), \\quad p(k) = \\frac{e}{m}\\, e^{-k/m}\\]</div><div class=\"tex\">\\[\\text{Model B: } k_i(t) \\approx \\frac{2}{N}\\, t\\]</div><div class=\"tex\">\\[\\frac{\\Delta k_i}{\\Delta t} \\sim \\Pi(k_i), \\qquad \\pi(k) = \\sum_{k_i=0}^{k} \\Pi(k_i) \\sim \\begin{cases} k &amp; \\text{no PA} \\\\ k^2 &amp; \\text{linear PA} \\end{cases}, \\qquad \\Pi(k) \\sim k^{\\alpha}\\]</div>", "ru": "<p><b>Как могут спросить:</b> Опишите, что происходит в отсутствие роста или preferential attachment. / Как можно измерить preferential attachment?</p><p><b>Скелет:</b> вопрос → модель A (только рост) → экспоненциальное распределение → модель B (только PA) → полный граф → вывод → измерение PA (π(k), режимы α).</p><p><b>Образцовый ответ (~300 слов):</b></p><p>Модель Барабаши–Альберт сочетает два ингредиента, рост и preferential attachment, поэтому естественно спросить, нужны ли оба для свойства scale-free. На это отвечают две урезанные модели.</p><p>Модель A сохраняет рост, но убирает preferential attachment. Она начинается с m₀ узлов, и на каждом шаге добавляется новый узел с m связями, но каждая связь выбирает цель равномерно случайно, независимо от степени. Континуальная теория показывает, что степень узла тогда растёт лишь логарифмически со временем, а распределение степеней становится экспоненциальным, <code>p(k) ~ e^(-k/m)</code>. Экспонента убывает гораздо быстрее степенного закона, поэтому хабы исчезают: без preferential attachment нет процесса «богатые богатеют».</p><p>Модель B сохраняет preferential attachment, но убирает рост. Она начинается с N узлов, и новые узлы никогда не добавляются; на каждом шаге случайно выбранный узел соединяется с узлом, выбранным с вероятностью Π(k_i). Число связей растёт линейно со временем, поэтому каждая степень тоже растёт линейно. Сначала сеть ведёт себя как модель BA, но после переходного периода все степени сходятся к среднему, у распределения появляется пик, и в конце концов сеть становится полным графом, в котором у каждого узла степень N−1. Распределение не стационарно.</p><p>Поскольку модель A даёт стационарное, но экспоненциальное распределение, а модель B теряет стационарность, для свойства scale-free необходимы оба ингредиента одновременно.</p><p>Preferential attachment можно и измерить. Сравнивая две карты сети, снятые в моменты t и t + Δt, по изменению степени каждого узла оценивают Π(k). Чтобы уменьшить шум, используют кумулятивную функцию π(k), сумму Π до k: без preferential attachment π(k) ~ k, при линейном присоединении π(k) ~ k². Подгонка Π(k) ~ k^α даёт α = 1 для Интернета и сетей цитирования и α = 0.9 (сублинейное) для сетей соавторства и актёров. α = 0 даёт экспоненциальное распределение, 0 &lt; α &lt; 1 — меньше хабов и они мельче, α = 1 — степенной закон BA, а α &gt; 1 — супер-хабы, которые притягивают почти все связи.</p><p><b>Формулы:</b> см. оригинал выше.</p>"}, {"key": "E10", "title": "E10. The Bianconi–Barabási (fitness) model", "group": "Неделя 2 — scale-free и модели роста (E5–E10)", "groupShort": "Неделя 2", "html": "<p><b>Как могут спросить:</b> Describe the Bianconi–Barabási model. / What is fitness and how can it be measured?</p><p><b>Скелет:</b> limitation of BA (first-mover) → fitness η, Π_i = η_i k_i / Σ η_j k_j → β(η) = η/C → special cases (equal fitness → BA, uniform → γ ≈ 2.255) → measuring fitness.</p><p><b>Model answer (~300 words):</b></p><p>The Barabási–Albert model predicts that every node&#x27;s degree grows as t^(1/2), so the oldest node always has the most links. Real networks contradict this: Google was founded six years after the birth of the Web and still became its biggest hub, and later Facebook overtook it. A node&#x27;s growth rate therefore does not depend only on its age. The Bianconi–Barabási model introduces an intrinsic property called fitness, eta: the ability of a company to turn customers into loyal partners, of a webpage to attract visitors, of a person to turn encounters into lasting links.</p><p>The model has two steps. Growth: at each time step a new node with m links and a fitness eta is added, where eta is drawn from a fitness distribution rho(eta) and never changes. Preferential attachment: a link of the new node connects to node i with probability proportional to the product of its fitness and its degree:</p><p><code>Pi_i = eta_i k_i / sum_j eta_j k_j</code></p><p>The degree term captures visibility; the fitness term means that between two nodes of equal degree the fitter one is chosen more often, so a young but fit node can acquire links quickly.</p><p>With the continuum theory each node&#x27;s degree follows <code>k_i(t) = m (t / t_i)^beta(eta_i)</code>, with a dynamical exponent proportional to fitness, <code>beta(eta) = eta / C</code>, where the constant C depends on the fitness distribution. Each node has its own exponent, so a fitter node eventually overtakes older but less fit ones. The degree distribution is a weighted sum of power laws. If all fitnesses are equal, C = 2, beta = 1/2 and we recover the BA model with gamma = 3. If fitness is uniform between 0 and 1, C = 1.255 and the degree exponent is about 2.255.</p><p>Fitness can be measured from dynamics: on a log-log plot of k(t) against t, the slope of each node&#x27;s curve gives its beta, and the distribution of beta reproduces rho(eta). Measurements on the WWW and on citation data show exponentially bounded fitness distributions: small fitness differences are amplified by growth and preferential attachment into huge degree differences.</p><p><b>Формулы:</b></p><div class=\"tex\">\\[\\Pi_i = \\frac{\\eta_i k_i}{\\sum_j \\eta_j k_j}, \\qquad k(t, t_i, \\eta_i) = m\\left(\\frac{t}{t_i}\\right)^{\\beta(\\eta_i)}\\]</div><div class=\"tex\">\\[\\beta(\\eta) = \\frac{\\eta}{C}, \\qquad C = \\int \\rho(\\eta)\\, \\frac{\\eta}{1 - \\beta(\\eta)}\\, d\\eta\\]</div><div class=\"tex\">\\[p_k \\approx C \\int \\frac{\\rho(\\eta)}{\\eta} \\left(\\frac{m}{k}\\right)^{\\frac{C}{\\eta}+1} d\\eta\\]</div><div class=\"tex\">\\[\\rho(\\eta) = \\delta(\\eta - 1) \\Rightarrow C = 2,\\ \\beta = \\tfrac12,\\ \\gamma = 3; \\qquad \\eta \\sim U[0,1] \\Rightarrow C^* = 1.255,\\ \\gamma \\approx 2.255\\]</div>", "ru": "<p><b>Как могут спросить:</b> Опишите модель Бьянкони–Барабаши. / Что такое фитнес и как его можно измерить?</p><p><b>Скелет:</b> ограничение BA (преимущество первого) → фитнес η, Π_i = η_i k_i / Σ η_j k_j → β(η) = η/C → частные случаи (одинаковый фитнес → BA, равномерный → γ ≈ 2.255) → измерение фитнеса.</p><p><b>Образцовый ответ (~300 слов):</b></p><p>Модель Барабаши–Альберт предсказывает, что степень каждого узла растёт как t^(1/2), поэтому у самого старого узла всегда больше всего связей. Реальные сети этому противоречат: Google основали через шесть лет после рождения веба, и он всё равно стал его главным хабом, а позже его обогнал Facebook. Значит, скорость роста узла зависит не только от его возраста. Модель Бьянкони–Барабаши вводит внутреннее свойство, называемое фитнесом η: способность компании превращать клиентов в постоянных партнёров, веб-страницы — привлекать посетителей, человека — превращать встречи в прочные связи.</p><p>У модели два шага. Рост: на каждом шаге добавляется новый узел с m связями и фитнесом η, который берётся из распределения фитнеса ρ(η) и никогда не меняется. Preferential attachment: связь нового узла присоединяется к узлу i с вероятностью, пропорциональной произведению его фитнеса и степени:</p><p><code>Pi_i = eta_i k_i / sum_j eta_j k_j</code></p><p>Множитель степени отвечает за заметность; множитель фитнеса означает, что из двух узлов с одинаковой степенью чаще выбирают более сильный, поэтому молодой, но сильный узел может быстро набрать связи.</p><p>По континуальной теории степень каждого узла растёт как <code>k_i(t) = m (t / t_i)^beta(eta_i)</code> с динамическим показателем, пропорциональным фитнесу, <code>beta(eta) = eta / C</code>, где константа C зависит от распределения фитнеса. У каждого узла свой показатель, поэтому более сильный узел со временем обгоняет более старых, но менее сильных. Распределение степеней — взвешенная сумма степенных законов. Если все фитнесы одинаковы, C = 2, β = 1/2, и мы получаем модель BA с γ = 3. Если фитнес равномерно распределён между 0 и 1, C = 1.255, и показатель степени около 2.255.</p><p>Фитнес можно измерить по динамике: на log-log графике k(t) от t наклон кривой каждого узла даёт его β, а распределение β воспроизводит ρ(η). Измерения на WWW и на данных цитирования показывают экспоненциально ограниченные распределения фитнеса: маленькие различия в фитнесе рост и preferential attachment усиливают до огромных различий в степени.</p><p><b>Формулы:</b> см. оригинал выше.</p>"}, {"key": "E11", "title": "E11. Breadth-First Search (BFS) ⭐ (спрашивали в июле)", "group": "Неделя 3 — алгоритмы на графах (E11–E15)", "groupShort": "Неделя 3", "html": "<p><b>Как могут спросить:</b> Describe the BFS algorithm and its properties. / Compare BFS and DFS.</p><p><b>Скелет:</b> idea (levels, &quot;many explorers&quot;) → algorithm with discovered dictionary → properties (reachability, shortest paths in edges, non-tree edges) → complexity O(n+m) with adjacency list → applications.</p><p><b>Model answer (~300 words):</b></p><p>Breadth-First Search (BFS) is a graph traversal, a systematic procedure that visits all the vertices and edges reachable from a start vertex s. While DFS can be imagined as a single person exploring a maze, BFS is like sending many explorers who collectively spread out from s. The traversal proceeds in rounds and divides the vertices into levels: level 0 contains s; in the first round all vertices adjacent to s are marked as visited and placed in level 1; in the second round we examine the unvisited neighbours of level-1 vertices and place them in level 2, and so on. The algorithm stops when a round discovers no new vertices.</p><p>In the implementation we keep a list level with the current frontier and a dictionary discovered that maps every visited vertex to the edge used to discover it. For each vertex u in the current level and each incident edge e = (u, v), if v has not been discovered we store discovered[v] = e and append v to next_level. A simpler version uses a FIFO queue: pop a vertex from the front, mark it, append its unvisited neighbours to the back. The discovery edges form the BFS tree, and the dictionary allows us to reconstruct the path from s to any vertex by walking back from v to s.</p><p>BFS has three important properties. It visits every vertex reachable from s. For every vertex v at level i, the path in the BFS tree from s to v has exactly i edges, and every other path from s to v has at least i edges, so BFS computes shortest paths in unweighted graphs. For a non-tree edge (u, v), the level of v is at most one greater than the level of u; in undirected graphs all non-tree edges are cross edges.</p><p>Each vertex enters a level once and each edge is examined at most twice (undirected) or once (directed), so with an adjacency list BFS runs in O(n + m) time. It is used to test connectivity, find connected components, compute shortest paths by number of hops and measure distances and diameters in networks. For weighted graphs it fails, and Dijkstra&#x27;s algorithm is needed.</p><p><b>Факты:</b> O(n+m) with adjacency list · level i ⇒ shortest path = i edges · non-tree edges: cross (undirected), back or cross (directed)</p>", "ru": "<p><b>Как могут спросить:</b> Опишите алгоритм BFS и его свойства. / Сравните BFS и DFS.</p><p><b>Скелет:</b> идея (уровни, «много исследователей») → алгоритм со словарём discovered → свойства (достижимость, кратчайшие пути по числу рёбер, рёбра вне дерева) → сложность O(n+m) со списком смежности → применения.</p><p><b>Образцовый ответ (~300 слов):</b></p><p>Поиск в ширину (Breadth-First Search, BFS) — это обход графа, систематическая процедура, которая посещает все вершины и рёбра, достижимые из стартовой вершины s. Если DFS можно представить как одного человека, исследующего лабиринт, то BFS — это множество исследователей, которые вместе расходятся от s. Обход идёт раундами и делит вершины на уровни: уровень 0 содержит s; в первом раунде все вершины, смежные с s, помечаются как посещённые и попадают на уровень 1; во втором раунде мы смотрим непосещённых соседей вершин уровня 1 и помещаем их на уровень 2, и так далее. Алгоритм останавливается, когда раунд не находит новых вершин.</p><p>В реализации храним список level с текущим фронтом и словарь discovered, который сопоставляет каждой посещённой вершине ребро, по которому её нашли. Для каждой вершины u текущего уровня и каждого инцидентного ребра e = (u, v), если v ещё не найдена, записываем discovered[v] = e и добавляем v в next_level. Более простая версия использует очередь FIFO: достаём вершину из начала, помечаем её, добавляем её непосещённых соседей в конец. Рёбра обнаружения образуют дерево BFS, а словарь позволяет восстановить путь от s до любой вершины, идя назад от v к s.</p><p>У BFS три важных свойства. Он посещает каждую вершину, достижимую из s. Для каждой вершины v на уровне i путь в дереве BFS от s до v содержит ровно i рёбер, а любой другой путь от s до v содержит не меньше i рёбер, поэтому BFS вычисляет кратчайшие пути в невзвешенных графах. Для ребра (u, v), не входящего в дерево, уровень v больше уровня u не более чем на единицу; в неориентированных графах все рёбра вне дерева — cross edges (поперечные).</p><p>Каждая вершина попадает на уровень один раз, и каждое ребро рассматривается не более двух раз (неориентированный граф) или один раз (ориентированный), поэтому со списком смежности BFS работает за O(n + m). Его используют для проверки связности, поиска компонент связности, вычисления кратчайших путей по числу шагов и измерения расстояний и диаметров в сетях. Для взвешенных графов он не годится, и нужен алгоритм Дейкстры.</p><p><b>Факты:</b> O(n+m) со списком смежности · уровень i ⇒ кратчайший путь = i рёбер · рёбра вне дерева: cross (неориентированный), back или cross (ориентированный)</p>"}, {"key": "E12", "title": "E12. Depth-First Search (DFS)", "group": "Неделя 3 — алгоритмы на графах (E11–E15)", "groupShort": "Неделя 3", "html": "<p><b>Как могут спросить:</b> Describe the DFS algorithm, its properties and applications. / How can DFS detect cycles or test connectivity?</p><p><b>Скелет:</b> idea (one explorer, backtracking) → recursive algorithm → DFS tree and edge types → proposition + complexity → applications (path, connectivity, components, cycles).</p><p><b>Model answer (~300 words):</b></p><p>Depth-First Search (DFS) is a graph traversal that can be traced by a single person exploring a graph. We start at a vertex s and, being at a current vertex u, we consider an arbitrary incident edge (u, v). If v has already been visited the edge is ignored; otherwise v is marked as visited and becomes the current vertex. Eventually we reach a dead end, a vertex whose incident edges all lead to visited vertices. We then backtrack along the edge that brought us there and continue from the previous vertex with the edges not yet considered. The process ends when backtracking returns to s and no unexplored edges remain.</p><p>The algorithm is naturally recursive: DFS(G, u) considers each outgoing edge e = (u, v); if v is not in the dictionary discovered, it stores discovered[v] = e and calls DFS(G, v). The same dictionary lets us reconstruct the path from u to any discovered vertex by following the discovery edges backwards. An iterative version replaces recursion with a stack.</p><p>The edges used to discover new vertices are tree (discovery) edges and form the DFS tree rooted at s. In an undirected graph all other edges are back edges, connecting a vertex to an ancestor. In a directed graph non-tree edges can be back edges, forward edges (to a descendant) or cross edges (to a vertex that is neither). DFS visits all vertices in the connected component of s (or reachable from s, if directed), and the discovery edges form a spanning tree of that component.</p><p>DFS is called at most once per vertex and every edge is examined at most twice, so with an adjacency list it runs in O(n + m). With it we can, in O(n + m): compute a path between two vertices, test whether a graph is connected (check that len(discovered) == n), compute a spanning tree, find all connected components by restarting DFS from every undiscovered vertex (DFS_complete), and detect cycles, since a cycle exists if and only if there is a back edge. For directed graphs, two DFS runs (the second on reversed edges) test strong connectivity.</p><p><b>Факты:</b> O(n+m) · edge types: tree, back, forward, cross · cycle ⇔ back edge · connected ⇔ len(discovered) == n</p>", "ru": "<p><b>Как могут спросить:</b> Опишите алгоритм DFS, его свойства и применения. / Как с помощью DFS найти цикл или проверить связность?</p><p><b>Скелет:</b> идея (один исследователь, возврат назад) → рекурсивный алгоритм → дерево DFS и типы рёбер → утверждение + сложность → применения (путь, связность, компоненты, циклы).</p><p><b>Образцовый ответ (~300 слов):</b></p><p>Поиск в глубину (Depth-First Search, DFS) — это обход графа, который можно представить как путь одного человека по графу. Начинаем в вершине s и, находясь в текущей вершине u, берём произвольное инцидентное ребро (u, v). Если v уже посещена, ребро пропускаем; иначе помечаем v как посещённую, и она становится текущей. Рано или поздно мы попадаем в тупик — вершину, все инцидентные рёбра которой ведут в посещённые вершины. Тогда мы возвращаемся (backtrack) по ребру, которым сюда пришли, и продолжаем из предыдущей вершины с ещё не рассмотренными рёбрами. Процесс заканчивается, когда возврат приводит в s и неисследованных рёбер не остаётся.</p><p>Алгоритм естественно рекурсивен: DFS(G, u) рассматривает каждое исходящее ребро e = (u, v); если v нет в словаре discovered, он записывает discovered[v] = e и вызывает DFS(G, v). Тот же словарь позволяет восстановить путь от u до любой найденной вершины, идя по рёбрам обнаружения назад. Итеративная версия заменяет рекурсию стеком.</p><p>Рёбра, по которым находят новые вершины, — это рёбра дерева (discovery edges), они образуют дерево DFS с корнем в s. В неориентированном графе все остальные рёбра — обратные (back edges), они соединяют вершину с её предком. В ориентированном графе рёбра вне дерева могут быть обратными, прямыми (forward, к потомку) или поперечными (cross, к вершине, которая не предок и не потомок). DFS посещает все вершины компоненты связности s (или достижимые из s в ориентированном случае), и рёбра обнаружения образуют остовное дерево этой компоненты.</p><p>DFS вызывается не более одного раза на вершину, и каждое ребро рассматривается не более двух раз, поэтому со списком смежности он работает за O(n + m). С его помощью за O(n + m) можно: найти путь между двумя вершинами, проверить связность графа (проверить, что len(discovered) == n), построить остовное дерево, найти все компоненты связности, перезапуская DFS из каждой ненайденной вершины (DFS_complete), и найти цикл, поскольку цикл существует тогда и только тогда, когда есть обратное ребро. Для ориентированных графов два запуска DFS (второй по обращённым рёбрам) проверяют сильную связность.</p><p><b>Факты:</b> O(n+m) · типы рёбер: tree, back, forward, cross · цикл ⇔ back edge · связный ⇔ len(discovered) == n</p>"}, {"key": "E13", "title": "E13. Dijkstra's algorithm", "group": "Неделя 3 — алгоритмы на графах (E11–E15)", "groupShort": "Неделя 3", "html": "<p><b>Как могут спросить:</b> Describe Dijkstra&#x27;s algorithm and its computational cost. / What is edge relaxation?</p><p><b>Скелет:</b> weighted graphs, why BFS fails → greedy &quot;cloud&quot; idea → labels D[v] and relaxation → pseudocode with priority queue → complexity → shortest-path tree, limitations.</p><p><b>Model answer (~300 words):</b></p><p>BFS finds shortest paths only when every edge is as good as any other. In a weighted graph each edge (u, v) has a numeric weight w(u, v), the length of a path is the sum of its edge weights, and the distance d(u, v) is the length of a minimum-weight path. For example, in a flight network the route JFK–ORD–DFW–LAX (2777 miles) is shorter than JFK–MIA–LAX (3432 miles) even though it has more hops. Dijkstra&#x27;s algorithm solves the single-source shortest-path problem: it computes the distance from a source s to every other vertex.</p><p>Dijkstra&#x27;s algorithm applies the greedy method: at each iteration it selects the best available choice. It performs a &quot;weighted BFS&quot; from s, growing a cloud C of vertices that enter in order of their distance from s. Every vertex v has a label D[v], the length of the best path found so far from s to v. Initially D[s] = 0, D[v] = infinity for every other vertex, and C is empty. At each iteration the vertex u outside C with the smallest label is pulled into the cloud. Then, for each neighbour v of u outside C, we perform edge relaxation:</p><p><code>if D[u] + w(u, v) &lt; D[v] then D[v] = D[u] + w(u, v)</code></p><p>Relaxation takes an old estimate and checks whether going through u improves it. The algorithm ends when no vertices remain outside the cloud, or when those outside are unreachable.</p><p>In the implementation all vertices are stored in a priority queue keyed by D. We repeatedly call remove_min, relax the edges of the extracted vertex and update the keys of the changed vertices. There are n extractions and at most m key updates; with a heap-based priority queue each costs O(log n), so the running time is O((n + m) log n).</p><p>The final labels let us build the shortest-path tree: for each vertex v we keep the incoming edge (u, v) for which D[v] = D[u] + w(u, v). The greedy choice is correct only when weights are non-negative; with negative weights a vertex already in the cloud could later be reached more cheaply. For all-pairs shortest paths the Floyd–Warshall algorithm runs in O(n^3).</p><p><b>Факты:</b> relaxation · O((n+m) log n) with a heap · only non-negative weights · Floyd–Warshall O(n³) for all pairs</p><div class=\"tex\">\\[\\text{if } D[u] + w(u,v) &lt; D[v] \\text{ then } D[v] \\leftarrow D[u] + w(u,v)\\]</div>", "ru": "<p><b>Как могут спросить:</b> Опишите алгоритм Дейкстры и его вычислительную стоимость. / Что такое релаксация ребра?</p><p><b>Скелет:</b> взвешенные графы, почему BFS не работает → жадная идея «облака» → метки D[v] и релаксация → псевдокод с очередью с приоритетом → сложность → дерево кратчайших путей, ограничения.</p><p><b>Образцовый ответ (~300 слов):</b></p><p>BFS находит кратчайшие пути, только когда все рёбра равноценны. Во взвешенном графе у каждого ребра (u, v) есть числовой вес w(u, v), длина пути — сумма весов его рёбер, а расстояние d(u, v) — длина пути минимального веса. Например, в сети авиарейсов маршрут JFK–ORD–DFW–LAX (2777 миль) короче, чем JFK–MIA–LAX (3432 мили), хотя в нём больше перелётов. Алгоритм Дейкстры решает задачу о кратчайших путях из одного источника: он вычисляет расстояние от источника s до каждой другой вершины.</p><p>Алгоритм Дейкстры применяет жадный метод: на каждой итерации он выбирает лучший доступный вариант. Он выполняет «взвешенный BFS» из s, выращивая облако C из вершин, которые попадают в него в порядке удалённости от s. У каждой вершины v есть метка D[v] — длина лучшего найденного до сих пор пути от s до v. Сначала D[s] = 0, D[v] = ∞ для всех остальных вершин, и C пусто. На каждой итерации в облако втягивается вершина u вне C с наименьшей меткой. Затем для каждого соседа v вершины u вне C выполняется релаксация ребра:</p><p><code>if D[u] + w(u, v) &lt; D[v] then D[v] = D[u] + w(u, v)</code></p><p>Релаксация берёт старую оценку и проверяет, улучшает ли её путь через u. Алгоритм заканчивается, когда вне облака не остаётся вершин или оставшиеся недостижимы.</p><p>В реализации все вершины хранятся в очереди с приоритетом с ключом D. Мы повторно вызываем remove_min, релаксируем рёбра извлечённой вершины и обновляем ключи изменившихся вершин. Всего n извлечений и не более m обновлений ключа; с очередью на куче каждое стоит O(log n), поэтому время работы O((n + m) log n).</p><p>По итоговым меткам можно построить дерево кратчайших путей: для каждой вершины v храним входящее ребро (u, v), для которого D[v] = D[u] + w(u, v). Жадный выбор корректен только при неотрицательных весах; с отрицательными весами вершину, уже попавшую в облако, позже можно было бы достичь дешевле. Для кратчайших путей между всеми парами алгоритм Флойда–Уоршелла работает за O(n³).</p><p><b>Факты:</b> релаксация · O((n+m) log n) с кучей · только неотрицательные веса · Флойд–Уоршелл O(n³) для всех пар</p>"}, {"key": "E14", "title": "E14. Data structures for graphs", "group": "Неделя 3 — алгоритмы на графах (E11–E15)", "groupShort": "Неделя 3", "html": "<p><b>Как могут спросить:</b> Describe the data structures used to represent graphs and their performance. / Compare the adjacency list and the adjacency matrix.</p><p><b>Скелет:</b> Graph ADT → edge list → adjacency list → adjacency map → adjacency matrix → comparison table, space O(n+m) vs O(n²), when to use which.</p><p><b>Model answer (~300 words):</b></p><p>A graph G = (V, E) with n vertices and m edges can be modelled as an abstract data type with Vertex, Edge and Graph classes. The Graph ADT offers methods such as vertex_count(), edges(), get_edge(u, v), degree(v), incident_edges(v), insert_vertex(x), insert_edge(u, v, x), remove_vertex(v) and remove_edge(e). Four data structures implement it, with different costs.</p><p>The edge list is the minimal structure: an unordered list of all edges. Counting and iterating are efficient, and inserting a vertex or an edge or removing an edge take O(1). But since edges are not organized by vertex, get_edge(u, v), degree(v) and incident_edges(v) must inspect every edge, costing O(m), and removing a vertex also takes O(m), because all its incident edges must be found.</p><p>The adjacency list keeps, for each vertex v, a secondary collection I(v) of the edges incident to v (for directed graphs, separate outgoing and incoming collections). Now incident_edges(v) takes O(deg(v)), degree(v) O(1), get_edge(u, v) O(min(deg(u), deg(v))) and remove_vertex(v) O(deg(v)). In Python it is often written as a dictionary of sets or lists, e.g. {1: {2, 5}, 2: {1, 3}}. The adjacency map replaces each secondary list with a map keyed by the adjacent vertex, so get_edge(u, v) becomes O(1) expected time.</p><p>The adjacency matrix stores an n × n matrix A where A[i][j] references the edge (i, j) or is None; for undirected graphs it is symmetric. Its advantage is worst-case O(1) access to any edge. Its disadvantages: finding the edges incident to v requires scanning a whole row, O(n); adding or removing vertices requires resizing the matrix, O(n²); and it uses O(n²) space.</p><p>The adjacency list and map use O(n + m) space, which is far better for sparse graphs, and real networks are sparse (L ≪ Lmax = N(N−1)/2). They also give the O(deg(v)) neighbour iteration that BFS and DFS need to run in O(n + m). The adjacency matrix is preferable only for dense graphs or when constant-time edge lookup dominates.</p><div class=\"tw\"><table><tr><th><p>Операция</p></th><th><p>Edge list</p></th><th><p>Adj. list</p></th><th><p>Adj. map</p></th><th><p>Adj. matrix</p></th></tr><tr><td><p>get_edge(u,v)</p></td><td><p>O(m)</p></td><td><p>O(min(du,dv))</p></td><td><p>O(1) exp.</p></td><td><p>O(1)</p></td></tr><tr><td><p>degree(v)</p></td><td><p>O(m)</p></td><td><p>O(1)</p></td><td><p>O(1)</p></td><td><p>O(n)</p></td></tr><tr><td><p>incident_edges(v)</p></td><td><p>O(m)</p></td><td><p>O(dv)</p></td><td><p>O(dv)</p></td><td><p>O(n)</p></td></tr><tr><td><p>insert_vertex</p></td><td><p>O(1)</p></td><td><p>O(1)</p></td><td><p>O(1)</p></td><td><p>O(n²)</p></td></tr><tr><td><p>remove_vertex(v)</p></td><td><p>O(m)</p></td><td><p>O(dv)</p></td><td><p>O(dv)</p></td><td><p>O(n²)</p></td></tr><tr><td><p>insert_edge / remove_edge</p></td><td><p>O(1)</p></td><td><p>O(1)</p></td><td><p>O(1) exp.</p></td><td><p>O(1)</p></td></tr><tr><td><p>Память</p></td><td><p>O(n+m)</p></td><td><p>O(n+m)</p></td><td><p>O(n+m)</p></td><td><p>O(n²)</p></td></tr></table></div>", "ru": "<p><b>Как могут спросить:</b> Опишите структуры данных для представления графов и их производительность. / Сравните список смежности и матрицу смежности.</p><p><b>Скелет:</b> Graph ADT → список рёбер → список смежности → словарь смежности → матрица смежности → сравнительная таблица, память O(n+m) против O(n²), когда что использовать.</p><p><b>Образцовый ответ (~300 слов):</b></p><p>Граф G = (V, E) с n вершинами и m рёбрами можно смоделировать как абстрактный тип данных с классами Vertex, Edge и Graph. Graph ADT предоставляет методы вроде vertex_count(), edges(), get_edge(u, v), degree(v), incident_edges(v), insert_vertex(x), insert_edge(u, v, x), remove_vertex(v) и remove_edge(e). Его реализуют четыре структуры данных с разной стоимостью операций.</p><p>Список рёбер (edge list) — минимальная структура: неупорядоченный список всех рёбер. Подсчёт и перебор эффективны, а вставка вершины или ребра и удаление ребра занимают O(1). Но поскольку рёбра не сгруппированы по вершинам, get_edge(u, v), degree(v) и incident_edges(v) должны просмотреть каждое ребро, что стоит O(m), и удаление вершины тоже занимает O(m), ведь нужно найти все её инцидентные рёбра.</p><p>Список смежности (adjacency list) хранит для каждой вершины v вторичную коллекцию I(v) инцидентных ей рёбер (для ориентированных графов — отдельные коллекции исходящих и входящих). Теперь incident_edges(v) занимает O(deg(v)), degree(v) — O(1), get_edge(u, v) — O(min(deg(u), deg(v))), а remove_vertex(v) — O(deg(v)). В Python его часто пишут как словарь множеств или списков, например {1: {2, 5}, 2: {1, 3}}. Словарь смежности (adjacency map) заменяет каждый вторичный список словарём с ключом по смежной вершине, поэтому get_edge(u, v) становится O(1) в среднем.</p><p>Матрица смежности (adjacency matrix) хранит матрицу A размером n × n, где A[i][j] ссылается на ребро (i, j) или равно None; для неориентированных графов она симметрична. Её преимущество — доступ к любому ребру за O(1) в худшем случае. Её недостатки: поиск рёбер, инцидентных v, требует просмотра всей строки, O(n); добавление или удаление вершин требует изменения размера матрицы, O(n²); и она занимает O(n²) памяти.</p><p>Список и словарь смежности занимают O(n + m) памяти, что намного лучше для разреженных графов, а реальные сети разреженные (L ≪ Lmax = N(N−1)/2). Они также дают перебор соседей за O(deg(v)), который нужен BFS и DFS, чтобы работать за O(n + m). Матрица смежности предпочтительнее только для плотных графов или когда главное — доступ к ребру за постоянное время.</p><p><b>Таблица сложностей:</b> см. оригинал выше (названия операций те же).</p>"}, {"key": "E15", "title": "E15. Asymptotic analysis (O, Θ, Ω)", "group": "Неделя 3 — алгоритмы на графах (E11–E15)", "groupShort": "Неделя 3", "html": "<p><b>Как могут спросить:</b> Describe the asymptotic notations. / Analyse the running time of an algorithm (prefix averages).</p><p><b>Скелет:</b> primitive operations → growth rate → definitions Θ, O, Ω → theorem → polynomial example → prefix averages O(n²) vs O(n).</p><p><b>Model answer (~300 words):</b></p><p>To analyse an algorithm without running experiments, we count primitive operations: low-level instructions with constant execution time, such as assigning an identifier to an object, performing an arithmetic operation, comparing two numbers, accessing a list element by index, calling or returning from a function. The running time is expressed as a function f(n) of the input size n. Rather than counting operations exactly, which would depend on language and hardware, asymptotic analysis focuses on the growth rate of f(n) for large n, ignoring constant factors and lower-order terms.</p><p>Three notations are used. f(n) = Theta(g(n)) if there exist positive constants c1, c2 and n0 such that <code>c1 g(n) &lt;= f(n) &lt;= c2 g(n)</code> for all n &gt;= n0: f is &quot;sandwiched&quot; between two multiples of g, a tight bound. f(n) = O(g(n)) if <code>f(n) &lt;= c g(n)</code> for all n &gt;= n0: an asymptotic upper bound, used to bound the worst-case running time on every input. f(n) = Omega(g(n)) if <code>c g(n) &lt;= f(n)</code>: an asymptotic lower bound. A theorem connects them: f(n) = Theta(g(n)) if and only if f(n) = O(g(n)) and f(n) = Omega(g(n)). For example, any quadratic an^2 + bn + c with a &gt; 0 is Theta(n^2), a polynomial of degree d is Theta(n^d), and a constant is Theta(1).</p><p>The prefix averages problem illustrates the analysis: given a sequence S of n numbers, compute A[j], the average of S[0], ..., S[j]. The first implementation recomputes each sum in an inner loop executed j + 1 times, so the inner statement runs <code>1 + 2 + ... + n = n(n+1)/2</code> times: O(n^2). The second uses sum(S[0:j+1]), but slicing and summing still cost O(j + 1), so it is again O(n^2). The third keeps a running total updated once per iteration, giving a single loop and O(n) time. The same problem can thus be solved with very different growth rates, which is what asymptotic analysis captures.</p><p><b>Формулы:</b></p><div class=\"tex\">\\[\\Theta(g(n)) = \\{ f(n) : \\exists\\, c_1, c_2, n_0 &gt; 0 \\text{ such that } 0 \\le c_1 g(n) \\le f(n) \\le c_2 g(n)\\ \\ \\forall n \\ge n_0 \\}\\]</div><div class=\"tex\">\\[O(g(n)):\\ 0 \\le f(n) \\le c\\,g(n), \\qquad \\Omega(g(n)):\\ 0 \\le c\\,g(n) \\le f(n)\\]</div><div class=\"tex\">\\[f = \\Theta(g) \\iff f = O(g) \\text{ and } f = \\Omega(g), \\qquad 1 + 2 + \\dots + n = \\frac{n(n+1)}{2} = O(n^2)\\]</div>", "ru": "<p><b>Как могут спросить:</b> Опишите асимптотические обозначения. / Проанализируйте время работы алгоритма (prefix averages).</p><p><b>Скелет:</b> элементарные операции → темп роста → определения Θ, O, Ω → теорема → пример с полиномом → prefix averages O(n²) против O(n).</p><p><b>Образцовый ответ (~300 слов):</b></p><p>Чтобы анализировать алгоритм без экспериментов, мы считаем элементарные операции (primitive operations): низкоуровневые инструкции с постоянным временем выполнения, такие как присваивание идентификатора объекту, арифметическая операция, сравнение двух чисел, доступ к элементу списка по индексу, вызов функции или возврат из неё. Время работы выражается функцией f(n) от размера входа n. Вместо точного подсчёта операций, который зависел бы от языка и железа, асимптотический анализ смотрит на темп роста f(n) при больших n, отбрасывая константные множители и младшие члены.</p><p>Используют три обозначения. f(n) = Θ(g(n)), если существуют положительные константы c1, c2 и n0, такие что c1 g(n) ≤ f(n) ≤ c2 g(n) для всех n ≥ n0: f «зажата» между двумя кратными g, это точная оценка. f(n) = O(g(n)), если f(n) ≤ c g(n) для всех n ≥ n0: асимптотическая верхняя оценка, которой ограничивают время работы в худшем случае на любом входе. f(n) = Ω(g(n)), если c g(n) ≤ f(n): асимптотическая нижняя оценка. Их связывает теорема: f(n) = Θ(g(n)) тогда и только тогда, когда f(n) = O(g(n)) и f(n) = Ω(g(n)). Например, любой квадратный трёхчлен an² + bn + c с a &gt; 0 есть Θ(n²), многочлен степени d есть Θ(n^d), а константа — Θ(1).</p><p>Задача prefix averages иллюстрирует анализ: дана последовательность S из n чисел, нужно вычислить A[j] — среднее S[0], ..., S[j]. Первая реализация пересчитывает каждую сумму во внутреннем цикле, который выполняется j + 1 раз, поэтому внутренняя инструкция выполняется 1 + 2 + ... + n = n(n+1)/2 раз: O(n²). Вторая использует sum(S[0:j+1]), но срез и суммирование всё равно стоят O(j + 1), так что это снова O(n²). Третья хранит текущую сумму, обновляемую один раз за итерацию, что даёт один цикл и время O(n). Таким образом, одну и ту же задачу можно решить с очень разным темпом роста, и именно это улавливает асимптотический анализ.</p><p><b>Формулы:</b> см. оригинал выше.</p>"}, {"key": "R1", "title": "R1. Network robustness: random failures and targeted attacks", "group": "Только прочитать (R1–R6)", "groupShort": "Только прочитать", "html": "<p>Network robustness is the ability of a system to keep functioning when some of its nodes or links fail. It is studied with percolation theory. In classical percolation, the sites of a lattice are occupied with probability p; below a critical threshold p_c there are only small clusters, while above it a giant cluster spans the system. The transition is described by universal critical exponents for the average cluster size, the size of the giant cluster and the correlation length. Robustness corresponds to inverse percolation: we start from a complete network and remove a fraction f = 1 - p of the nodes; at a critical fraction f_c the giant component collapses.</p><p>For networks, the Molloy–Reed criterion states that a giant component exists if <code>&lt;k^2&gt; / &lt;k&gt; &gt; 2</code>. From it we get the critical fraction of randomly removed nodes:</p><p><code>f_c = 1 - 1 / (&lt;k^2&gt;/&lt;k&gt; - 1)</code></p><p>For a random network this gives <code>f_c = 1 - 1/&lt;k&gt;</code>, a finite value: removing a finite fraction of the nodes fragments the network. For scale-free networks with 2 &lt; gamma &lt; 3, &lt;k^2&gt; diverges and f_c goes to 1: the network stays connected until almost all of its nodes are removed. For example, about 97% of the Internet&#x27;s nodes must fail randomly to fragment it.</p><p>The reason is that random failures mostly hit the numerous small-degree nodes, while the few hubs that hold the network together are rarely selected. The situation is reversed for targeted attacks, which remove nodes in order of decreasing degree. Removing a few hubs deprives many nodes of their connections, and the giant component collapses at a much smaller f_c. This &quot;Achilles&#x27; heel&quot; means that the Internet and other infrastructures are robust to errors but fragile to attacks, while in medicine hub proteins can be drug targets. Failures can also propagate along links as cascading failures, as in power-grid blackouts, with avalanche sizes following a power law. Designs with more redundancy and decentralization, as in Paul Baran&#x27;s distributed networks, reduce this vulnerability.</p><p><b>Формулы:</b></p><div class=\"tex\">\\[\\kappa = \\frac{\\langle k^2\\rangle}{\\langle k\\rangle} &gt; 2 \\qquad (\\text{Molloy--Reed})\\]</div><div class=\"tex\">\\[f_c = 1 - \\frac{1}{\\frac{\\langle k^2\\rangle}{\\langle k\\rangle} - 1}; \\qquad \\text{ER: } f_c = 1 - \\frac{1}{\\langle k\\rangle}; \\qquad \\text{SF } (\\gamma &lt; 3): f_c \\to 1\\]</div><div class=\"tex\">\\[\\langle s\\rangle \\propto |p - p_c|^{-\\gamma_p}, \\quad P_\\infty \\propto (p - p_c)^{\\beta_p}, \\quad \\xi \\propto |p - p_c|^{-\\nu}\\]</div>", "ru": "<p>Устойчивость сети (robustness) — это способность системы продолжать работать, когда часть её узлов или связей выходит из строя. Её изучают с помощью теории перколяции. В классической перколяции узлы решётки заняты с вероятностью p; ниже критического порога p_c есть только маленькие кластеры, а выше него гигантский кластер пронизывает всю систему. Переход описывается универсальными критическими показателями для среднего размера кластера, размера гигантского кластера и корреляционной длины. Устойчивости соответствует обратная перколяция: начинаем с полной сети и удаляем долю f = 1 − p узлов; при критической доле f_c гигантская компонента разрушается.</p><p>Для сетей критерий Моллоя–Рида гласит, что гигантская компонента существует, если <code>&lt;k^2&gt; / &lt;k&gt; &gt; 2</code>. Из него получаем критическую долю случайно удалённых узлов:</p><p><code>f_c = 1 - 1 / (&lt;k^2&gt;/&lt;k&gt; - 1)</code></p><p>Для случайной сети это даёт <code>f_c = 1 - 1/&lt;k&gt;</code>, конечное значение: удаление конечной доли узлов раздробляет сеть. Для scale-free сетей с 2 &lt; γ &lt; 3 ⟨k²⟩ расходится, и f_c стремится к 1: сеть остаётся связной, пока не удалены почти все узлы. Например, чтобы раздробить Интернет, должно случайно выйти из строя около 97% его узлов.</p><p>Причина в том, что случайные отказы в основном поражают многочисленные узлы с малой степенью, а немногие хабы, которые держат сеть вместе, выбираются редко. При целенаправленных атаках, которые удаляют узлы в порядке убывания степени, ситуация обратная. Удаление нескольких хабов лишает связей множество узлов, и гигантская компонента разрушается при гораздо меньшем f_c. Эта «ахиллесова пята» означает, что Интернет и другие инфраструктуры устойчивы к ошибкам, но хрупки к атакам, а в медицине белки-хабы могут быть мишенями для лекарств. Отказы могут также распространяться по связям как каскадные отказы, как при блэкаутах в электросетях, причём размеры лавин подчиняются степенному закону. Конструкции с большей избыточностью и децентрализацией, как распределённые сети Пола Бэрана, снижают эту уязвимость.</p><p><b>Формулы:</b> см. оригинал выше.</p>"}, {"key": "R2", "title": "R2. Spreading phenomena: SI, SIS, SIR and network epidemics", "group": "Только прочитать (R1–R6)", "groupShort": "Только прочитать", "html": "<p>Epidemic models rest on two hypotheses. Compartmentalization classifies each individual by disease stage: susceptible (S), infectious (I) or recovered (R). Homogeneous mixing assumes that everybody has the same chance of meeting an infected individual.</p><p>In the SI model an infected person meets &lt;k&gt; individuals per unit time, a fraction of whom are susceptible, and infects each with rate beta. For the fraction of infected individuals i this gives:</p><p><code>di/dt = beta &lt;k&gt; i (1 - i)</code></p><p>Its solution is a logistic curve: exponential growth at first, then saturation as fewer susceptibles remain, until everyone is infected.</p><p>The SIS model lets infected individuals recover with rate mu and become susceptible again: <code>di/dt = beta &lt;k&gt; i (1 - i) - mu i</code>. If mu &lt; beta &lt;k&gt;, the system reaches an endemic state in which a constant fraction <code>i = 1 - mu / (beta &lt;k&gt;)</code> is infected. If mu &gt; beta &lt;k&gt;, the infection dies out exponentially. The basic reproductive number <code>R0 = beta &lt;k&gt; / mu</code>, the number of new infections caused by one infected individual in a fully susceptible population, separates the two regimes: measles has R0 = 12-18, influenza 2-3. In the SIR model recovered individuals become immune and are removed from the population: the infected fraction first grows and then disappears.</p><p>These models ignore network structure, but real contacts form scale-free networks where &lt;k&gt; alone is not enough. In the degree-block approximation nodes with the same degree are treated as equivalent, and each degree class gets its own equation. Early in the epidemic the number of infected grows exponentially with characteristic time:</p><p><code>tau = &lt;k&gt; / (beta (&lt;k^2&gt; - &lt;k&gt;))</code></p><p>For a random network tau = 1 / (beta &lt;k&gt;), but for scale-free networks with gamma &lt; 3, &lt;k^2&gt; diverges and tau goes to zero: the spread is practically instantaneous, because hubs act as super-spreaders, like the physician in the 2003 SARS outbreak.</p><p><b>Формулы:</b></p><div class=\"tex\">\\[\\text{SI: } \\frac{di}{dt} = \\beta\\langle k\\rangle\\, i(1-i), \\qquad i(t) = \\frac{i_0\\, e^{\\beta\\langle k\\rangle t}}{1 - i_0 + i_0\\, e^{\\beta\\langle k\\rangle t}}\\]</div><div class=\"tex\">\\[\\text{SIS: } \\frac{di}{dt} = \\beta\\langle k\\rangle\\, i(1-i) - \\mu i, \\qquad i(\\infty) = 1 - \\frac{\\mu}{\\beta\\langle k\\rangle}, \\qquad R_0 = \\frac{\\beta\\langle k\\rangle}{\\mu}\\]</div><div class=\"tex\">\\[\\text{SIR: } \\frac{ds}{dt} = -\\beta\\langle k\\rangle i(1-r-i), \\quad \\frac{di}{dt} = -\\mu i + \\beta\\langle k\\rangle i(1-r-i), \\quad \\frac{dr}{dt} = \\mu i\\]</div><div class=\"tex\">\\[\\frac{di_k}{dt} = \\beta(1 - i_k)\\, k\\, \\Theta_k, \\qquad \\tau^{SI} = \\frac{\\langle k\\rangle}{\\beta(\\langle k^2\\rangle - \\langle k\\rangle)}\\]</div>", "ru": "<p>Эпидемические модели опираются на две гипотезы. Компартментализация относит каждого человека к стадии болезни: восприимчивый (S), заразный (I) или выздоровевший (R). Однородное перемешивание предполагает, что у всех одинаковый шанс встретить заражённого.</p><p>В модели SI заражённый встречает ⟨k⟩ человек за единицу времени, часть из которых восприимчивы, и заражает каждого со скоростью β. Для доли заражённых i это даёт:</p><p><code>di/dt = beta &lt;k&gt; i (1 - i)</code></p><p>Решение — логистическая кривая: сначала экспоненциальный рост, затем насыщение, поскольку восприимчивых остаётся всё меньше, пока не заразятся все.</p><p>Модель SIS позволяет заражённым выздоравливать со скоростью μ и снова становиться восприимчивыми: <code>di/dt = beta &lt;k&gt; i (1 - i) - mu i</code>. Если μ &lt; β⟨k⟩, система приходит в эндемическое состояние, в котором заражена постоянная доля <code>i = 1 - mu / (beta &lt;k&gt;)</code>. Если μ &gt; β⟨k⟩, инфекция экспоненциально затухает. Базовое репродуктивное число <code>R0 = beta &lt;k&gt; / mu</code> — число новых заражений, которые вызывает один заражённый в полностью восприимчивой популяции, — разделяет эти два режима: у кори R0 = 12–18, у гриппа 2–3. В модели SIR выздоровевшие получают иммунитет и выбывают из популяции: доля заражённых сначала растёт, а потом исчезает.</p><p>Эти модели игнорируют структуру сети, но реальные контакты образуют scale-free сети, где одного ⟨k⟩ недостаточно. В приближении блоков по степени (degree-block approximation) узлы с одинаковой степенью считаются эквивалентными, и для каждого класса степеней пишется своё уравнение. В начале эпидемии число заражённых растёт экспоненциально с характерным временем:</p><p><code>tau = &lt;k&gt; / (beta (&lt;k^2&gt; - &lt;k&gt;))</code></p><p>Для случайной сети τ = 1 / (β⟨k⟩), но для scale-free сетей с γ &lt; 3 ⟨k²⟩ расходится и τ стремится к нулю: распространение практически мгновенное, потому что хабы работают как суперраспространители, как врач во вспышке SARS 2003 года.</p><p><b>Формулы:</b> см. оригинал выше.</p>"}, {"key": "R3", "title": "R3. Communities: hierarchical clustering and modularity", "group": "Только прочитать (R1–R6)", "groupShort": "Только прочитать", "html": "<p>A community is a group of nodes that are more likely to connect to each other than to nodes of other communities, like coworkers in a social network (Zachary&#x27;s Karate Club split into two groups after a conflict) or proteins involved in the same disease. Defining a community as a clique (a complete subgraph) is too restrictive, since large cliques are rare. A strong community is a connected subgraph whose nodes each have more links inside than to any other community; in a weak community the total internal degree exceeds the total external degree.</p><p>Finding communities by brute force is hopeless. Even graph bisection, splitting a network into two groups with the minimum cut size, requires checking N! / (N1! N2!) partitions: 252 for 10 nodes, about 10^29 for 100. Hierarchical clustering works in polynomial time from a similarity matrix and produces a dendrogram. The agglomerative Ravasz algorithm uses the topological overlap, which is high for nodes that are linked and share many neighbours. Each node starts as its own community; the most similar pair is merged repeatedly, with group similarity measured by average cluster similarity, until one community remains. The divisive Girvan–Newman algorithm uses link betweenness, the number of shortest paths passing through a link, which is high for links between communities. It repeatedly computes the betweenness of every link, removes the link with the highest value and recomputes, until no links remain.</p><p>The dendrogram does not tell where to cut. Modularity answers this by comparing each community&#x27;s internal links with the number expected if the network were wired randomly with the same degrees:</p><p><code>M = sum over communities of [L_c / L - (k_c / 2L)^2]</code></p><p>where L_c is the number of links inside community c and k_c its total degree. Higher modularity indicates a better partition. Newman&#x27;s greedy algorithm starts with every node as its own community, repeatedly merges the connected pair that gives the largest increase of M (always computed for the whole network), records M at each step, and selects the partition with maximal M.</p><p><b>Формулы:</b></p><div class=\"tex\">\\[x^0_{ij} = \\frac{J(i,j)}{\\min(k_i, k_j) + 1 - \\Theta(A_{ij})}\\]</div><div class=\"tex\">\\[M_c = \\frac{1}{2L}\\sum_{(i,j)\\in C_c} (A_{ij} - p_{ij}), \\quad p_{ij} = \\frac{k_i k_j}{2L}, \\qquad M = \\sum_{c=1}^{n_c} \\left[ \\frac{L_c}{L} - \\left(\\frac{k_c}{2L}\\right)^2 \\right]\\]</div><div class=\"tex\">\\[\\text{bisection: } \\frac{N!}{N_1!\\, N_2!} \\text{ partitions}\\]</div>", "ru": "<p>Сообщество — это группа узлов, которые с большей вероятностью соединяются друг с другом, чем с узлами других сообществ, как коллеги в социальной сети (каратэ-клуб Закари раскололся на две группы после конфликта) или белки, связанные с одной болезнью. Определять сообщество как клику (полный подграф) слишком строго, поскольку большие клики редки. Сильное сообщество — связный подграф, у каждого узла которого больше связей внутри, чем с любым другим сообществом; в слабом сообществе суммарная внутренняя степень больше суммарной внешней.</p><p>Искать сообщества перебором безнадёжно. Даже разбиение графа на две группы (bisection) с минимальным разрезом требует проверить N! / (N1! N2!) разбиений: 252 для 10 узлов, около 10²⁹ для 100. Иерархическая кластеризация работает за полиномиальное время по матрице сходства и строит дендрограмму. Агломеративный алгоритм Раваса использует топологическое перекрытие, которое велико для узлов, связанных между собой и имеющих много общих соседей. Каждый узел начинает как отдельное сообщество; самая похожая пара многократно объединяется, а сходство групп измеряется средним сходством кластеров, пока не останется одно сообщество. Разделительный алгоритм Гирвана–Ньюмана использует посредничество связи (link betweenness) — число кратчайших путей, проходящих через связь, которое велико для связей между сообществами. Он многократно вычисляет посредничество каждой связи, удаляет связь с наибольшим значением и пересчитывает, пока связей не останется.</p><p>Дендрограмма не говорит, где её резать. Ответ даёт модулярность, которая сравнивает внутренние связи каждого сообщества с числом, ожидаемым, если бы сеть была соединена случайно с теми же степенями:</p><p><code>M = sum over communities of [L_c / L - (k_c / 2L)^2]</code></p><p>где L_c — число связей внутри сообщества c, а k_c — его суммарная степень. Более высокая модулярность означает лучшее разбиение. Жадный алгоритм Ньюмана начинает с того, что каждый узел — отдельное сообщество, многократно объединяет связанную пару, дающую наибольший прирост M (всегда вычисляемый для всей сети), записывает M на каждом шаге и выбирает разбиение с максимальным M.</p><p><b>Формулы:</b> см. оригинал выше.</p>"}, {"key": "R4a", "title": "R4a. Link prediction: heuristics (common neighbours, preferential attachment)", "group": "Только прочитать (R1–R6)", "groupShort": "Только прочитать", "html": "<p>Link prediction estimates which pairs of currently unconnected nodes are likely to become connected in the future, or which links are missing from incomplete data. Applications include friend recommendation, predicting protein interactions and recommending products. Heuristic methods do not require training: they assign each pair (u, v) a similarity score computed from the graph structure, rank all non-connected pairs by score, and predict the top-ranked pairs as new links.</p><p>Common Neighbours is based on triadic closure: two people with many friends in common are likely to meet. The score is the number of shared neighbours, <code>CN(u, v) = |N(u) intersect N(v)|</code>, where N(u) is the set of neighbours of u. It is simple and works well in social networks with high clustering, but it favours high-degree nodes, which naturally share more neighbours.</p><p>The Jaccard coefficient normalizes this score by the size of the union of the two neighbourhoods, giving a value between 0 and 1. The Adamic–Adar index weights each common neighbour by the inverse logarithm of its degree, because sharing a rare neighbour is more informative than sharing a hub; the resource allocation index uses the inverse degree instead.</p><p>Preferential Attachment follows the Barabási–Albert mechanism: the probability of a new link is proportional to the degrees of its endpoints, so <code>PA(u, v) = k_u * k_v</code>. It needs no information about the neighbourhood, can be computed in constant time from the degrees and works well in scale-free networks, where hubs keep attracting links, but it ignores whether the two nodes are close in the network.</p><p>These local heuristics are fast and interpretable, but each assumes one particular mechanism of link formation. Global indices such as the Katz index, which counts all the paths between u and v with weights decreasing with their length, and learned methods such as node embeddings can capture more complex patterns. Performance is evaluated by hiding a fraction of the existing links and measuring how well the method ranks them, for example with precision or AUC.</p>", "ru": "<p>Предсказание связей (link prediction) оценивает, какие пары сейчас не связанных узлов, скорее всего, соединятся в будущем или какие связи пропущены в неполных данных. Применения: рекомендации друзей, предсказание взаимодействий белков и рекомендации товаров. Эвристические методы не требуют обучения: они присваивают каждой паре (u, v) оценку сходства, вычисленную по структуре графа, ранжируют все несвязанные пары по оценке и предсказывают пары с наивысшим рангом как новые связи.</p><p>Метод общих соседей (Common Neighbours) основан на триадическом замыкании: два человека со множеством общих друзей, скорее всего, познакомятся. Оценка — число общих соседей, <code>CN(u, v) = |N(u) intersect N(v)|</code>, где N(u) — множество соседей u. Метод простой и хорошо работает в социальных сетях с высокой кластеризацией, но благоволит узлам с большой степенью, у которых естественно больше общих соседей.</p><p>Коэффициент Жаккара нормирует эту оценку на размер объединения двух окрестностей, давая значение от 0 до 1. Индекс Адамик–Адара взвешивает каждого общего соседа обратным логарифмом его степени, потому что общий редкий сосед информативнее общего хаба; индекс распределения ресурсов (resource allocation) использует вместо этого обратную степень.</p><p>Preferential Attachment следует механизму Барабаши–Альберт: вероятность новой связи пропорциональна степеням её концов, поэтому <code>PA(u, v) = k_u * k_v</code>. Ему не нужна информация об окрестности, он вычисляется за постоянное время по степеням и хорошо работает в scale-free сетях, где хабы продолжают притягивать связи, но игнорирует, близки ли два узла в сети.</p><p>Эти локальные эвристики быстрые и интерпретируемые, но каждая предполагает один конкретный механизм образования связей. Глобальные индексы, такие как индекс Каца, который считает все пути между u и v с весами, убывающими с их длиной, и обучаемые методы, такие как векторные представления узлов (node embeddings), могут улавливать более сложные закономерности. Качество оценивают, скрывая долю существующих связей и измеряя, насколько хорошо метод их ранжирует, например по precision или AUC.</p>"}, {"key": "R4b", "title": "R4b. Link prediction: node embeddings", "group": "Только прочитать (R1–R6)", "groupShort": "Только прочитать", "html": "<p>Node embeddings represent every node of a graph as a low-dimensional vector z_u ∈ R^d, learned so that nodes close or similar in the network have similar vectors. Instead of hand-crafted heuristics such as common neighbours, embeddings automatically encode structural information from local neighbourhoods up to global position, and they can be fed to standard machine-learning models.</p><p>Random-walk methods are the most popular. DeepWalk generates short random walks from every node and treats them as sentences, with nodes as words; the Skip-gram model of word2vec then learns vectors that maximize the probability of observing a node&#x27;s neighbours in its walks, so nodes that co-occur on walks get similar embeddings. Node2vec generalizes DeepWalk with biased second-order random walks controlled by two parameters: the return parameter p, which controls the probability of going back to the previous node, and the in-out parameter q, which balances BFS-like local exploration (capturing structural roles) and DFS-like outward exploration (capturing communities and homophily). LINE explicitly preserves first-order proximity (direct links) and second-order proximity (shared neighbours). Matrix-factorization approaches obtain embeddings by factorizing the adjacency matrix or related similarity matrices, and graph neural networks, such as graph convolutional networks and graph autoencoders, compute embeddings by aggregating the features of neighbouring nodes and can also use node attributes.</p><p>For link prediction, the embeddings of two nodes are combined into a score or an edge feature. The simplest score is the dot product or cosine similarity z_u · z_v, which a graph autoencoder decodes into a link probability with a sigmoid. Alternatively, an edge representation is built with an operator such as the Hadamard (element-wise) product, the average or the L1/L2 distance of the two vectors, and a classifier, for example logistic regression, is trained on existing links as positive examples and non-links as negative examples. To evaluate, a fraction of edges is removed before learning the embeddings and the model must recover them, measured by AUC or precision. Embeddings usually outperform simple heuristics but are less interpretable and more expensive to compute.</p>", "ru": "<p>Векторные представления узлов (node embeddings) задают каждый узел графа вектором малой размерности z_u ∈ R^d, который обучают так, чтобы близкие или похожие в сети узлы имели похожие векторы. Вместо придуманных вручную эвристик вроде общих соседей эмбеддинги автоматически кодируют структурную информацию — от локальных окрестностей до глобального положения — и их можно подавать в стандартные модели машинного обучения.</p><p>Самые популярные — методы на случайных блужданиях. DeepWalk генерирует короткие случайные блуждания из каждого узла и считает их предложениями, а узлы — словами; затем модель Skip-gram из word2vec обучает векторы, максимизирующие вероятность увидеть соседей узла в его блужданиях, так что узлы, встречающиеся вместе в блужданиях, получают похожие эмбеддинги. Node2vec обобщает DeepWalk смещёнными случайными блужданиями второго порядка с двумя параметрами: параметр возврата p управляет вероятностью вернуться в предыдущий узел, а параметр in-out q балансирует между локальным исследованием в стиле BFS (улавливает структурные роли) и уходом вглубь в стиле DFS (улавливает сообщества и гомофилию). LINE явно сохраняет близость первого порядка (прямые связи) и второго порядка (общие соседи). Подходы на основе разложения матриц получают эмбеддинги, раскладывая матрицу смежности или связанные с ней матрицы сходства, а графовые нейросети, такие как графовые свёрточные сети и графовые автоэнкодеры, вычисляют эмбеддинги, агрегируя признаки соседних узлов, и могут также использовать атрибуты узлов.</p><p>Для предсказания связей эмбеддинги двух узлов объединяют в оценку или признак ребра. Простейшая оценка — скалярное произведение или косинусное сходство z_u · z_v, которое графовый автоэнкодер превращает в вероятность связи с помощью сигмоиды. Другой вариант — построить представление ребра оператором вроде произведения Адамара (поэлементного), среднего или расстояния L1/L2 между двумя векторами и обучить классификатор, например логистическую регрессию, на существующих связях как положительных примерах и отсутствующих как отрицательных. Для оценки часть рёбер удаляют до обучения эмбеддингов, и модель должна их восстановить; качество измеряют по AUC или precision. Эмбеддинги обычно превосходят простые эвристики, но менее интерпретируемы и дороже в вычислении.</p>"}, {"key": "R5", "title": "R5. Network basics: degree, adjacency matrix, weighted and bipartite networks, paths, connectedness, clustering", "group": "Только прочитать (R1–R6)", "groupShort": "Только прочитать", "html": "<p><b>Как могут спросить:</b> Define degree, average degree and degree distribution. / What is an adjacency matrix? / What are weighted and bipartite networks? / Define distance, diameter, connectedness and the clustering coefficient.</p><p><b>Скелет:</b> degree, ⟨k⟩ = 2L/N, p_k → adjacency matrix and sparsity → weighted and bipartite networks → paths, distance, diameter, ⟨d⟩ → connectedness, components, bridge → clustering coefficient C_i and ⟨C⟩.</p><p><b>Model answer (~300 words):</b></p><p>The degree k_i of node i is the number of links it has. In an undirected network the number of links is <code>L = (1/2) sum_i k_i</code>, because every link is counted twice, and the average degree is <code>&lt;k&gt; = (1/N) sum_i k_i = 2L/N</code>. In a directed network we distinguish the incoming degree and the outgoing degree; the total degree is their sum and <code>&lt;k_in&gt; = &lt;k_out&gt; = L/N</code>. The degree distribution p_k is the probability that a randomly selected node has degree k. It is the normalized histogram <code>p_k = N_k/N</code>, where N_k is the number of nodes of degree k, and <code>&lt;k&gt; = sum_k k p_k</code>. Its functional form determines many phenomena, from robustness to the spread of viruses.</p><p>A network is described by its adjacency matrix A, with A_ij = 1 if i and j are linked. In an undirected network it is symmetric, A_ii = 0, k_i = sum_j A_ij and 2L = sum_ij A_ij: the number of nonzero entries is twice the number of links. Real networks are sparse: L is much smaller than L_max = N(N-1)/2, the number of links of a complete graph.</p><p>In a weighted network each link (i, j) has a weight w_ij, for example the number of calls or minutes between two people in a mobile call network. A bipartite network has two disjoint sets of nodes U and V, and every link joins a U-node to a V-node. It has two projections: the first links two U-nodes that share a V-node, the second links two V-nodes that share a U-node.</p><p>Physical distance is meaningless in networks and is replaced by path length, the number of links in a path. The distance d_ij is the length of the shortest path between i and j (there may be several). In an undirected network d_ij = d_ji; in a directed one a path from i to j does not guarantee a path from j to i. The diameter d_max is the largest distance between any pair of nodes, and the average path length &lt;d&gt; is the average distance over all pairs.</p><p>Two nodes are connected if a path exists between them; otherwise d_ij is infinite. A network is connected if all pairs are connected; otherwise it splits into components (clusters), and a properly placed link that joins two components is called a bridge.</p><p>The local clustering coefficient of node i is <code>C_i = 2 L_i / (k_i (k_i - 1))</code>, where L_i is the number of links among its k_i neighbours. It is the probability that two neighbours of i are linked and measures local density: C_i = 0 if no neighbours are linked and C_i = 1 if they form a complete graph. The average clustering coefficient is <code>&lt;C&gt; = (1/N) sum_i C_i</code>.</p><p><b>Формулы:</b></p><div class=\"tex\">\\[L = \\frac12\\sum_{i=1}^{N} k_i, \\qquad \\langle k\\rangle = \\frac{2L}{N}, \\qquad p_k = \\frac{N_k}{N}, \\qquad L_{max} = \\frac{N(N-1)}{2}\\]</div><div class=\"tex\">\\[2L = \\sum_{i,j} A_{ij}, \\qquad k_i = \\sum_j A_{ij}, \\qquad C_i = \\frac{2L_i}{k_i(k_i-1)}, \\qquad \\langle C\\rangle = \\frac1N\\sum_i C_i\\]</div>", "ru": "<p>Степень k_i узла i — число его связей. В неориентированной сети число связей <code>L = (1/2) sum_i k_i</code>, потому что каждая связь учитывается дважды, а средняя степень <code>&lt;k&gt; = (1/N) sum_i k_i = 2L/N</code>. В ориентированной сети различают входящую и исходящую степень; полная степень — их сумма, а <code>&lt;k_in&gt; = &lt;k_out&gt; = L/N</code>. Распределение степеней p_k — вероятность того, что случайно выбранный узел имеет степень k. Это нормированная гистограмма <code>p_k = N_k/N</code>, где N_k — число узлов степени k, и <code>&lt;k&gt; = sum_k k p_k</code>. Его вид определяет многие явления, от устойчивости до распространения вирусов.</p><p>Сеть описывает матрица смежности A: A_ij = 1, если i и j связаны. В неориентированной сети она симметрична, A_ii = 0, k_i = sum_j A_ij и 2L = sum_ij A_ij: число ненулевых элементов вдвое больше числа связей. Реальные сети разреженные: L много меньше L_max = N(N-1)/2 — числа связей полного графа.</p><p>В взвешенной сети у каждой связи (i, j) есть вес w_ij, например число звонков или минут разговора между двумя людьми в сети мобильных звонков. В двудольной сети два непересекающихся множества узлов U и V, и каждая связь соединяет узел из U с узлом из V. У неё две проекции: первая соединяет два U-узла, у которых есть общий V-узел, вторая — два V-узла с общим U-узлом.</p><p>Физическое расстояние в сетях бессмысленно, его заменяет длина пути — число связей в пути. Расстояние d_ij — длина кратчайшего пути между i и j (их может быть несколько). В неориентированной сети d_ij = d_ji; в ориентированной путь из i в j не гарантирует путь из j в i. Диаметр d_max — наибольшее расстояние между парой узлов, а средняя длина пути &lt;d&gt; — среднее расстояние по всем парам.</p><p>Два узла связаны, если между ними есть путь; иначе d_ij бесконечно. Сеть связна, если связаны все пары; иначе она распадается на компоненты (кластеры), а удачно поставленная связь, соединяющая две компоненты, называется мостом.</p><p>Локальный коэффициент кластеризации узла i: <code>C_i = 2 L_i / (k_i (k_i - 1))</code>, где L_i — число связей между его k_i соседями. Это вероятность того, что два соседа i связаны, то есть локальная плотность: C_i = 0, если ни одна пара соседей не связана, и C_i = 1, если они образуют полный граф. Средний коэффициент кластеризации <code>&lt;C&gt; = (1/N) sum_i C_i</code>.</p>"}, {"key": "R6", "title": "R6. Degree correlations: assortative, neutral and disassortative networks", "group": "Только прочитать (R1–R6)", "groupShort": "Только прочитать", "html": "<p><b>Как могут спросить:</b> What are degree correlations? / Define assortative, neutral and disassortative networks. / How are degree correlations measured?</p><p><b>Скелет:</b> hubs linking to hubs or avoiding them (celebrities vs yeast proteins) → random expectation k k'/2L → correlation matrix e_ij → k_nn(k) → neutral / assortative / disassortative → exponent mu.</p><p><b>Model answer (~300 words):</b></p><p>Degree correlations describe how the degrees of nodes that link to each other are related. In social networks hubs tend to link to other hubs: celebrities marry celebrities. If partners were chosen at random from about 10^8 eligible people, the chance that the mate of a celebrity is one of 1,000 other celebrities would be only about 10^-5, so the observed pattern reveals the structure of the network. The protein interaction network of yeast behaves the other way: it is scale-free, with many degree-1 and degree-2 proteins and a few hubs, but the hubs avoid linking to each other. Both patterns differ from random linking, where the probability that nodes of degrees k and k' are linked is <code>p_{k,k'} = k k' / 2L</code>, which makes hubs more likely to connect to each other.</p><p>All the information is contained in the degree correlation matrix e_ij, the probability of finding a node of degree i and a node of degree j at the two ends of a randomly selected edge; it is normalized, <code>sum_ij e_ij = 1</code>. The matrix has too many elements to be inspected visually, so we measure the average degree of the neighbours of node i, <code>k_nn(k_i) = (1/k_i) sum_j A_ij k_j</code>. The degree correlation function <code>k_nn(k) = sum_k' k' P(k'|k)</code> gives the average degree of the neighbours of all degree-k nodes, where P(k'|k) is the conditional probability that following a link of a degree-k node we reach a degree-k' node.</p><p>There are three cases. In a neutral network k_nn(k) = &lt;k^2&gt;/&lt;k&gt; does not depend on k, so the plot is a horizontal line. In an assortative network hubs link to hubs, so k_nn(k) increases with k. In a disassortative network hubs link to low-degree nodes, so k_nn(k) decreases with k. The function is approximated as <code>k_nn(k) = a k^mu</code>, and the sign of the correlation exponent mu decides the type: mu &gt; 0 assortative (science collaboration network, mu = 0.37 +- 0.11), mu = 0 neutral (power grid, mu = 0.04 +- 0.05), mu &lt; 0 disassortative (metabolic network, mu = -0.76 +- 0.04).</p><p><b>Формулы:</b></p><div class=\"tex\">\\[\\sum_{i,j} e_{ij} = 1, \\qquad p_{k,k'} = \\frac{k k'}{2L}\\]</div><div class=\"tex\">\\[k_{nn}(k_i) = \\frac{1}{k_i}\\sum_{j=1}^{N} A_{ij}k_j, \\qquad k_{nn}(k) = \\sum_{k'} k'\\,P(k'|k), \\qquad k_{nn}(k)=\\frac{\\langle k^2\\rangle}{\\langle k\\rangle}\\ (\\text{neutral})\\]</div><div class=\"tex\">\\[k_{nn}(k) = a\\,k^{\\mu}: \\quad \\mu>0\\ \\text{assortative}, \\quad \\mu=0\\ \\text{neutral}, \\quad \\mu<0\\ \\text{disassortative}\\]</div>", "ru": "<p>Корреляции степеней описывают, как связаны степени узлов, соединённых между собой. В социальных сетях хабы обычно связаны с другими хабами: знаменитости женятся на знаменитостях. Если бы пары выбирались случайно из примерно 10^8 людей, шанс того, что супруг знаменитости — одна из 1000 других знаменитостей, был бы всего около 10^-5, так что наблюдаемая картина отражает структуру сети. Сеть белковых взаимодействий дрожжей ведёт себя наоборот: она scale-free, с множеством белков степени 1 и 2 и несколькими хабами, но хабы избегают связей друг с другом. Оба случая отличаются от случайного выбора, где вероятность связи узлов степеней k и k' равна <code>p_{k,k'} = k k' / 2L</code>, то есть хабы чаще соединялись бы между собой.</p><p>Вся информация содержится в матрице корреляций степеней e_ij — вероятности найти узлы степеней i и j на двух концах случайно выбранного ребра; она нормирована: <code>sum_ij e_ij = 1</code>. В матрице слишком много элементов для визуального анализа, поэтому считают среднюю степень соседей узла i: <code>k_nn(k_i) = (1/k_i) sum_j A_ij k_j</code>. Функция корреляции степеней <code>k_nn(k) = sum_k' k' P(k'|k)</code> даёт среднюю степень соседей всех узлов степени k, где P(k'|k) — условная вероятность того, что по связи узла степени k мы попадём в узел степени k'.</p><p>Возможны три случая. В нейтральной сети k_nn(k) = &lt;k^2&gt;/&lt;k&gt; не зависит от k, график — горизонтальная прямая. В ассортативной сети хабы связаны с хабами, и k_nn(k) растёт с k. В дизассортативной сети хабы связаны с узлами малой степени, и k_nn(k) убывает с k. Функцию приближают как <code>k_nn(k) = a k^mu</code>, и тип определяет знак показателя mu: mu &gt; 0 — ассортативная (сеть научных соавторств, mu = 0.37 +- 0.11), mu = 0 — нейтральная (электросеть, mu = 0.04 +- 0.05), mu &lt; 0 — дизассортативная (метаболическая сеть, mu = -0.76 +- 0.04).</p>"}, {"key": "Ф: Основы графов", "title": "Основы графов", "group": "Лист формул", "groupShort": "Лист формул", "html": "<div class=\"tex\">\\[L = \\frac{1}{2}\\sum_{i=1}^{N} k_i, \\qquad \\langle k\\rangle = \\frac{2L}{N} \\qquad (\\text{directed: } \\langle k^{in}\\rangle = \\langle k^{out}\\rangle = \\tfrac{L}{N})\\]</div><div class=\"tex\">\\[L_{\\max} = \\frac{N(N-1)}{2}, \\qquad p_k = \\frac{N_k}{N}, \\qquad \\langle k\\rangle = \\sum_k k\\, p_k\\]</div><div class=\"tex\">\\[C_i = \\frac{2L_i}{k_i(k_i-1)}, \\qquad \\langle C\\rangle = \\frac{1}{N}\\sum_{i=1}^{N} C_i\\]</div><div class=\"tex\">\\[\\sum_{v} \\deg(v) = 2m, \\qquad \\text{directed: } \\sum_v \\text{indeg}(v) = \\sum_v \\text{outdeg}(v) = m\\]</div>"}, {"key": "Ф: Случайные сети (ER)", "title": "Случайные сети (ER)", "group": "Лист формул", "groupShort": "Лист формул", "html": "<div class=\"tex\">\\[\\langle L\\rangle = p\\,\\frac{N(N-1)}{2}, \\qquad \\langle k\\rangle = p(N-1)\\]</div><div class=\"tex\">\\[p_k = \\binom{N-1}{k} p^k (1-p)^{N-1-k} \\approx e^{-\\langle k\\rangle}\\frac{\\langle k\\rangle^k}{k!}, \\qquad \\sigma_k = \\sqrt{\\langle k\\rangle}\\]</div><div class=\"tex\">\\[\\text{binomial: } \\langle x\\rangle = Np, \\quad \\langle x^2\\rangle = p(1-p)N + p^2N^2, \\quad \\sigma = \\sqrt{Np(1-p)}\\]</div><div class=\"tex\">\\[S = 1 - e^{-\\langle k\\rangle S}, \\qquad \\langle k\\rangle_c = 1, \\qquad p_c \\approx \\frac{1}{N}, \\qquad \\text{connected: } \\langle k\\rangle &gt; \\ln N\\]</div><div class=\"tex\">\\[\\langle d\\rangle \\approx \\frac{\\ln N}{\\ln\\langle k\\rangle} \\quad (\\text{social network: } 3.28), \\qquad C = p = \\frac{\\langle k\\rangle}{N}\\]</div><div class=\"tex\">\\[\\text{Watts--Strogatz ring: } \\langle C\\rangle = \\tfrac{3}{4}\\]</div>"}, {"key": "Ф: Scale-free", "title": "Scale-free", "group": "Лист формул", "groupShort": "Лист формул", "html": "<div class=\"tex\">\\[p_k \\sim k^{-\\gamma}, \\qquad p_k = \\frac{k^{-\\gamma}}{\\zeta(\\gamma)}, \\qquad p(k) = (\\gamma-1)\\,k_{\\min}^{\\gamma-1}\\,k^{-\\gamma} \\qquad (\\text{WWW: } \\gamma_{in} \\approx 2.1,\\ \\gamma_{out} \\approx 2.45)\\]</div><div class=\"tex\">\\[k_{\\max} = k_{\\min} N^{\\frac{1}{\\gamma-1}}, \\qquad \\langle k^n\\rangle = C\\,\\frac{k_{\\max}^{\\,n-\\gamma+1} - k_{\\min}^{\\,n-\\gamma+1}}{n-\\gamma+1}\\]</div><div class=\"tex\">\\[\\langle d\\rangle \\sim \\text{const}\\ (\\gamma=2), \\quad \\ln\\ln N\\ (2&lt;\\gamma&lt;3), \\quad \\frac{\\ln N}{\\ln\\ln N}\\ (\\gamma=3), \\quad \\ln N\\ (\\gamma&gt;3)\\]</div>"}, {"key": "Ф: Модели роста (BA и fitness)", "title": "Модели роста (BA и fitness)", "group": "Лист формул", "groupShort": "Лист формул", "html": "<div class=\"tex\">\\[\\Pi(k_i) = \\frac{k_i}{\\sum_j k_j}, \\qquad \\frac{dk_i}{dt} = \\frac{k_i}{2t}, \\qquad k_i(t) = m\\left(\\frac{t}{t_i}\\right)^{1/2}\\]</div><div class=\"tex\">\\[p_k = 2m^2 k^{-3}, \\quad \\gamma = 3, \\qquad \\text{exact: } p_k = \\frac{2m(m+1)}{k(k+1)(k+2)}\\]</div><div class=\"tex\">\\[\\text{Model A: } p(k) = \\frac{e}{m}\\,e^{-k/m}, \\qquad \\text{Model B: } k_i(t) = \\frac{2t}{N}\\]</div><div class=\"tex\">\\[\\pi(k) \\sim k \\text{ (no PA)}, \\quad \\pi(k) \\sim k^2 \\text{ (linear PA)}, \\quad \\Pi(k) \\sim k^{\\alpha}; \\qquad q_k = \\frac{k\\,p_k}{\\langle k\\rangle}, \\quad \\Pi(k) = \\frac{p}{N} + \\frac{1-p}{2L}\\,k\\]</div><div class=\"tex\">\\[\\Pi_i = \\frac{\\eta_i k_i}{\\sum_j \\eta_j k_j}, \\qquad \\beta(\\eta) = \\frac{\\eta}{C}; \\qquad \\text{equal fitness: } \\gamma = 3, \\quad \\text{uniform: } \\gamma \\approx 2.255\\]</div>"}, {"key": "Ф: Degree correlations, robustness, epidemics, communities", "title": "Degree correlations, robustness, epidemics, communities", "group": "Лист формул", "groupShort": "Лист формул", "html": "<div class=\"tex\">\\[k_{nn}(k_i) = \\frac{1}{k_i}\\sum_j A_{ij} k_j, \\qquad \\text{neutral: } k_{nn}(k) = \\frac{\\langle k^2\\rangle}{\\langle k\\rangle}, \\qquad k_{nn}(k) = a\\,k^{\\mu}\\]</div><div class=\"tex\">\\[\\frac{\\langle k^2\\rangle}{\\langle k\\rangle} &gt; 2, \\qquad f_c = 1 - \\frac{1}{\\frac{\\langle k^2\\rangle}{\\langle k\\rangle} - 1}, \\qquad \\text{ER: } f_c = 1 - \\frac{1}{\\langle k\\rangle}\\]</div><div class=\"tex\">\\[\\text{SI: } \\frac{di}{dt} = \\beta\\langle k\\rangle i(1-i), \\qquad \\text{SIS: } i(\\infty) = 1 - \\frac{\\mu}{\\beta\\langle k\\rangle}, \\qquad R_0 = \\frac{\\beta\\langle k\\rangle}{\\mu}\\]</div><div class=\"tex\">\\[\\tau^{SI} = \\frac{\\langle k\\rangle}{\\beta(\\langle k^2\\rangle - \\langle k\\rangle)}\\]</div><div class=\"tex\">\\[M = \\sum_{c} \\left[\\frac{L_c}{L} - \\left(\\frac{k_c}{2L}\\right)^2\\right], \\qquad x^0_{ij}
