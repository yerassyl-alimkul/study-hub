<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AACM · JulYera study hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Caveat:wght@600&display=swap">
<style>
/* Layout: study app — fixed menu on the left (drawer on phones), one view at a time on grid paper.
   Each lesson = short summary card + numbered boards (drawing + 2–3 lines) + exam path. */
:root{
  --paper:#f6f8fb; --grid:#e3e9f2; --board:#ffffff; --ink:#1b2a44; --muted:#5d6b84;
  --blue:#2457d6; --marker:#f08a00; --hi:#ffe08a; --ok:#1f9d63; --bad:#d23c3c; --edge:#9fb0cc; --iso:#b7c2d6; --violet:#7a4fd0;
  --side:#eef2f8;
  --f-display:"Unbounded","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --f-hand:"Caveat","Comic Sans MS",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1522; --grid:#1a2335; --board:#151d2e; --ink:#e4ebf7; --muted:#9aa8c2;
  --blue:#6f9bff; --marker:#ffa53a; --hi:#5a4a12; --ok:#3fcf8e; --bad:#ff6b6b; --edge:#4a5a78; --iso:#3a4760; --violet:#b296ff; --side:#121a29; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1522; --grid:#1a2335; --board:#151d2e; --ink:#e4ebf7; --muted:#9aa8c2;
  --blue:#6f9bff; --marker:#ffa53a; --hi:#5a4a12; --ok:#3fcf8e; --bad:#ff6b6b; --edge:#4a5a78; --iso:#3a4760; --violet:#b296ff; --side:#121a29; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.6 var(--f-body);margin:0}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
/* ---- side menu ---- */
.side{background:var(--side);border-right:1.5px solid var(--edge);position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 12px 32px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px}
.brand{display:flex;flex-direction:column;gap:2px;padding:4px 8px 12px}
.brand b{font:700 17px/1.2 var(--f-display)}
.brand span{font-size:13px;color:var(--muted)}
.prog{margin:0 8px 10px;height:6px;border-radius:3px;background:var(--grid);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.side h4{margin:14px 8px 4px;font:600 11px/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.side a{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.3}
.side a:hover{background:var(--board)}
.side a[aria-current="page"]{background:var(--board);box-shadow:inset 3px 0 0 var(--blue);font-weight:600}
.side a .id{font:600 12px var(--f-mono);color:var(--blue);min-width:30px}
.side a .t{flex:1;min-width:0}
.side a .ck{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--edge);flex:none;display:grid;place-items:center;font-size:10px;color:var(--board)}
.side a .ck.on{background:var(--ok);border-color:var(--ok)}
.side a .star{color:var(--marker);font-size:12px}
.side a.big{font-weight:600;font-size:15px}
.side a.big .ic{width:22px;text-align:center;color:var(--blue);font:600 15px var(--f-mono)}
/* ---- top bar (phones) ---- */
.topbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--side);border-bottom:1.5px solid var(--edge);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--side)}
  .topbar b{font:700 15px var(--f-display);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side{position:fixed;z-index:30;left:0;top:0;bottom:0;width:min(300px,86vw);height:auto;transform:translateX(-105%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
}
/* ---- main ---- */
main{min-width:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 72px}
.view{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.view.wide{max-width:1180px}
.vhead{display:flex;flex-direction:column;gap:6px}
.tag{font:600 12px/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}
h1{font:700 clamp(24px,4.6vw,36px)/1.15 var(--f-display);margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--marker)}
.en{color:var(--muted);font-size:14px;margin:0}
.board{background:var(--board);border:1.5px solid var(--edge);border-radius:6px;padding:20px clamp(16px,3vw,26px);display:flex;flex-direction:column;gap:14px;min-width:0}
.short{border-color:var(--blue);border-width:2px}
.short h2{font:700 16px var(--f-display);margin:0;color:var(--blue)}
.short ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.step{display:flex;align-items:baseline;gap:12px}
.num{font:700 15px/1 var(--f-display);color:var(--board);background:var(--blue);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;flex:none}
.board h2{font:700 clamp(17px,2.8vw,21px)/1.25 var(--f-display);margin:0;text-wrap:balance}
.board p{margin:0;max-width:68ch}
.hand{font:600 22px/1.2 var(--f-hand);color:var(--marker)}
mark{background:var(--hi);color:inherit;padding:0 3px;border-radius:2px}
.f{font-family:var(--f-mono);font-size:.93em;white-space:nowrap}
.formula{font:600 clamp(15px,2.4vw,19px)/1.55 var(--f-mono);background:var(--paper);border:1.5px dashed var(--edge);border-radius:6px;padding:12px 16px;overflow-x:auto;text-align:center}
.formula small{display:block;font:400 13px/1.4 var(--f-body);color:var(--muted);margin-top:4px}
.formula.key{border:2px solid var(--marker)}
sup,sub{font-size:.7em}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.row>*,.row3>*{min-width:0}
@media (max-width:680px){.row,.row3{grid-template-columns:1fr}}
canvas,svg{display:block;width:100%;max-width:100%}
.scroll-x{overflow-x:auto}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
label{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
input[type=range]{accent-color:var(--blue);width:180px;max-width:56vw}
select{font:14px var(--f-body);padding:5px 8px;border-radius:6px;border:1.5px solid var(--edge);background:var(--paper);color:var(--ink)}
button{font:600 14px var(--f-body);color:var(--ink);background:var(--paper);border:1.5px solid var(--edge);border-radius:6px;padding:7px 14px;cursor:pointer}
button:hover{border-color:var(--blue);color:var(--blue)}
button.primary{background:var(--blue);border-color:var(--blue);color:var(--board)}
button.primary:hover{filter:brightness(1.1);color:var(--board)}
button.on{background:var(--hi);border-color:var(--marker)}
:focus-visible{outline:2px solid var(--marker);outline-offset:2px}
.readout{font:400 14px/1.5 var(--f-mono);display:flex;flex-wrap:wrap;gap:6px 18px;font-variant-numeric:tabular-nums}
.readout b{color:var(--blue)}
.msg{font:600 15px/1.45 var(--f-mono);min-height:1.45em}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.mini{border:1.5px solid var(--edge);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--paper);min-width:0}
.mini h3{margin:0;font:700 14px var(--f-display)}
.mini p{font-size:14px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:680px){.facts{grid-template-columns:1fr}}
.fact{border-left:4px solid var(--bad);padding:6px 12px;background:var(--paper);border-radius:0 6px 6px 0}
.fact.good{border-color:var(--ok)}
.fact .big{font:700 21px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.fact p{font-size:14px;color:var(--muted)}
ol.path{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
ol.path li{background:var(--paper);border:1.5px solid var(--edge);border-radius:20px;padding:6px 12px;font-size:14px;font-weight:500}
ol.path li+li::before{content:"→";margin-right:8px;color:var(--marker);font-weight:700}
.asks{color:var(--muted);font-size:14px;font-style:italic}
.chain{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:680px){.chain{grid-template-columns:1fr}}
.chain>div{background:var(--paper);border:1.5px solid var(--edge);border-radius:6px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.chain .f{font-weight:600;color:var(--blue);white-space:normal}
.cards4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:780px){.cards4{grid-template-columns:repeat(2,1fr)}}
.card{border:1.5px solid var(--edge);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--paper);min-width:0}
.card h3{margin:0;font:700 14px var(--f-display)}
.card .cond{font:600 13px var(--f-mono);color:var(--marker)}
.card p{font-size:13px;color:var(--muted);line-height:1.45}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{border-bottom:1px solid var(--grid);padding:7px 8px;text-align:left;vertical-align:top}
table.t th{font:600 12px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
table.t td.mono{font-family:var(--f-mono);font-size:13px;white-space:nowrap}
table.t tr.hl td{background:var(--hi)}
.ds{font:13px/1.5 var(--f-mono);background:var(--paper);border:1.5px solid var(--edge);border-radius:6px;padding:8px 10px;white-space:pre;overflow-x:auto;min-height:3em}
.ds .h{background:var(--hi);border-radius:2px}
.ds .s{color:var(--marker);font-weight:600}
.pill{display:inline-block;font:600 12px var(--f-mono);padding:2px 8px;border-radius:20px;background:var(--hi)}
.code{font:13px/1.55 var(--f-mono);background:var(--paper);border:1.5px solid var(--edge);border-radius:6px;padding:10px 12px;white-space:pre;overflow-x:auto;margin:0}
.code .hl{background:var(--hi);display:inline-block;width:100%}
/* svg chart classes (theme-aware without redraw) */
.ax text{fill:var(--muted);font:12px var(--f-mono)}
.ax .lab{font:13px var(--f-body)}
.gl{stroke:var(--grid)}
.axl{stroke:var(--edge);stroke-width:1.5}
svg .note{fill:var(--marker);font:600 20px var(--f-hand)}
svg .note.b{fill:var(--blue)} svg .note.g{fill:var(--ok)} svg .note.r{fill:var(--bad)} svg .note.v{fill:var(--violet)} svg .note.m{fill:var(--muted)}
svg .small{fill:var(--muted);font:12px var(--f-body)}
svg .ink{fill:var(--ink)}
.s-b{stroke:var(--blue);stroke-width:2.5}.s-o{stroke:var(--marker);stroke-width:3}.s-g{stroke:var(--ok);stroke-width:2.5}.s-v{stroke:var(--violet);stroke-width:2.5}.s-r{stroke:var(--bad);stroke-width:2.5}
.s-m{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}.s-d{stroke-dasharray:6 5}
.f-b{fill:var(--blue)}.f-o{fill:var(--marker)}.f-g{fill:var(--ok)}.f-v{fill:var(--violet)}.f-r{fill:var(--bad)}.f-hi{fill:var(--hi)}.f-grid{fill:var(--grid)}.f-board{fill:var(--board)}.f-ink{fill:var(--ink)}
/* pager */
.pager{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.pager .mid{display:flex;gap:10px;flex-wrap:wrap}
.pager a,.btnlink{font:600 14px var(--f-body);color:var(--ink);background:var(--board);border:1.5px solid var(--edge);border-radius:6px;padding:8px 14px;text-decoration:none}
.pager a:hover,.btnlink:hover{border-color:var(--blue);color:var(--blue)}
.pager [hidden]{display:none}
button.done{background:var(--ok);border-color:var(--ok);color:var(--board)}
/* home */
.homegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:780px){.homegrid{grid-template-columns:1fr}}
.hcard{background:var(--board);border:1.5px solid var(--edge);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink)}
.hcard:hover{border-color:var(--blue)}
.hcard b{font:700 16px var(--f-display)}
.hcard span{font-size:14px;color:var(--muted)}
.weekrow{display:flex;flex-wrap:wrap;gap:8px}
.weekrow a{font:600 13px var(--f-mono);text-decoration:none;color:var(--ink);background:var(--board);border:1.5px solid var(--edge);border-radius:20px;padding:5px 12px}
.weekrow a.on{border-color:var(--ok);background:var(--ok);color:var(--board)}
/* originals */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:600 12px var(--f-mono);padding:5px 10px;border-radius:20px}
.chips button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--board)}
.chips .sep{width:100%;font:600 11px var(--f-mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.orig{font-size:16px;line-height:1.7}
.orig h2{font:700 clamp(18px,3vw,24px)/1.25 var(--f-display);margin:0 0 6px;text-wrap:balance}
.orig p{margin:0 0 12px;max-width:72ch}
.orig code{font:14px var(--f-mono);background:var(--paper);padding:1px 5px;border-radius:3px;border:1px solid var(--grid)}
.orig .tex{background:var(--paper);border:1.5px dashed var(--edge);border-radius:6px;padding:10px 14px;margin:0 0 10px;overflow-x:auto;font:13px var(--f-mono);white-space:pre-wrap}
.orig pre.codeb{font:13px var(--f-mono);background:var(--paper);border-radius:6px;padding:10px;overflow-x:auto}
.orig .tw{overflow-x:auto;margin-bottom:12px}
.orig table{border-collapse:collapse;font-size:14px;min-width:100%}
.orig th,.orig td{border:1px solid var(--grid);padding:6px 8px;text-align:left;vertical-align:top}
.orig th{background:var(--paper)}
.orig th p,.orig td p{margin:0}
.orig ul{margin:0 0 12px}
.orig b{font-weight:600}
.orig.ru{border-color:var(--ok);border-width:2px}
.orig.ru .tag{color:var(--ok)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
<style>#trainer{
  --tr-paper: #f4f6f9;
  --panel: #ffffff;
  --tr-ink: #172030;
  --tr-muted: #5b6577;
  --line: #dde2ea;
  --accent: #2f56c9;
  --accent-soft: #e6ecfb;
  --ok: #1d8049;
  --ok-soft: #e3f3e9;
  --bad: #bf3a30;
  --bad-soft: #fbe9e7;
  --warn: #a8701a;
  --warn-soft: #fbf1df;
  --code-bg: #eef1f6;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #trainer{
    --tr-paper: #0f131a; --panel: #161c26; --tr-ink: #e5e9f0; --tr-muted: #9aa4b5; --line: #273041;
    --accent: #86a2ff; --accent-soft: #1d2740; --ok: #52c483; --ok-soft: #14291d; --bad: #f07b70; --bad-soft: #321a18;
    --warn: #e2b155; --warn-soft: #2e2615; --code-bg: #0b0f15; color-scheme: dark;
  }}
:root[data-theme="dark"] #trainer{
  --tr-paper: #0f131a; --panel: #161c26; --tr-ink: #e5e9f0; --tr-muted: #9aa4b5; --line: #273041;
  --accent: #86a2ff; --accent-soft: #1d2740; --ok: #52c483; --ok-soft: #14291d; --bad: #f07b70; --bad-soft: #321a18;
  --warn: #e2b155; --warn-soft: #2e2615; --code-bg: #0b0f15; color-scheme: dark;
}
#trainer *{ box-sizing: border-box; }
#trainer{ background: var(--tr-paper); color: var(--tr-ink); font: 16px/1.5 var(--body); }
#trainer .wrap{ max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
#trainer header.top{ display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; margin-bottom: 18px; }
#trainer h1{ font: 700 1.7rem/1.1 var(--display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
#trainer .sub{ color: var(--tr-muted); margin: 4px 0 0; font-size: 0.95rem; }
#trainer .stats{ display: flex; gap: 18px; font-size: 0.9rem; color: var(--tr-muted); font-variant-numeric: tabular-nums; }
#trainer .stats b{ color: var(--tr-ink); font-size: 1.15rem; display: block; font-family: var(--display); }
#trainer nav.tabs{ display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
#trainer nav.tabs button{ font: 600 0.98rem var(--body); background: none; border: 0; color: var(--tr-muted); padding: 10px 14px; border-bottom: 3px solid transparent; cursor: pointer; margin-bottom: -1px; }
#trainer nav.tabs button[aria-selected="true"]{ color: var(--tr-ink); border-bottom-color: var(--accent); }
#trainer nav.tabs button:focus-visible,#trainer button:focus-visible,#trainer textarea:focus-visible,#trainer summary:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
#trainer .grid{ display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 20px; align-items: start; }
#trainer .rail{ background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
#trainer .rail h3{ font: 600 0.72rem var(--body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--tr-muted); margin: 10px 8px 4px; }
#trainer .rail h3:first-child{ margin-top: 2px; }
#trainer .rail button{ display: flex; width: 100%; align-items: center; gap: 8px; text-align: left; background: none; border: 0; border-radius: 7px; padding: 6px 8px; font: 0.92rem var(--mono); color: var(--tr-ink); cursor: pointer; }
#trainer .rail button:hover{ background: var(--code-bg); }
#trainer .rail button[aria-current="true"]{ background: var(--accent-soft); }
#trainer .rail .nm{ flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#trainer .dot{ flex: none; width: 34px; text-align: right; font: 600 0.75rem var(--body); color: var(--tr-muted); font-variant-numeric: tabular-nums; }
#trainer .dot.ok{ color: var(--ok); }
#trainer .dot.part{ color: var(--warn); }
#trainer .dot.bad{ color: var(--bad); }
#trainer .card{ background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; min-width: 0; }
#trainer .qhead{ display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 8px; }

<script>
/* тема: auto | light | dark, хранится в study-theme (синхронизируется с Telegram) */
(function(){
  var R=document.documentElement, m='auto';
  try{m=localStorage.getItem('study-theme')||'auto'}catch(e){}
  function sys(){var w=window.Telegram&&Telegram.WebApp; if(w&&w.initData&&w.colorScheme) return w.colorScheme; return (window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light'}
  function apply(){
    var r=m==='auto'?sys():m; R.setAttribute('data-theme',r); R.style.colorScheme=r;
    var b=document.querySelector('.themebtn'); if(b){b.textContent=m==='auto'?'◐':(m==='dark'?'☾':'☀'); b.title={auto:'Тема: авто',light:'Тема: светлая',dark:'Тема: тёмная'}[m]; b.setAttribute('aria-label',b.title)}
    try{var w=window.Telegram&&Telegram.WebApp; if(w&&w.initData){w.setHeaderColor&&w.setHeaderColor(r==='dark'?'#121315':'#FBFBFA'); w.setBackgroundColor&&w.setBackgroundColor(r==='dark'?'#121315':'#FBFBFA')}}catch(e){}
  }
  window.__theme={get:function(){return m},apply:apply,cycle:function(){m=m==='auto'?'light':(m==='light'?'dark':'auto'); try{localStorage.setItem('study-theme',m)}catch(e){} apply()}};
  apply();
  function mount(){
    apply();
    if(document.querySelector('.themebtn')) return;
    var anchor=document.querySelector('[data-langsw]'); if(!anchor) return;
    var b=document.createElement('button'); b.type='button'; b.className='themebtn'; b.onclick=function(){window.__theme.cycle()};
    anchor.parentNode.insertBefore(b,anchor); apply();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',mount); else mount();
  window.addEventListener('load',apply);
  try{matchMedia('(prefers-color-scheme:dark)').addEventListener('change',apply)}catch(e){}
  /* если Telegram подтянул более новый study-theme из облака, страница перезагрузится синхронизацией */
})();
</script>

<script>
/* JulYera study sync: Telegram CloudStorage <-> localStorage, вход только через бота */
(function(){
  var BOT_URL='https://t.me/dsstudyhub_bot';                 // ссылка на бота, например https://t.me/ИМЯ_БОТА
  var PFX=/^(imsds-|mmmds-|aacm-|study-)/, CH=3500, tg=window.Telegram&&Telegram.WebApp;
  var inTg=!!(tg&&tg.initData);
  var dev=false; try{ if(/[?&]dev=1/.test(location.search)) sessionStorage.setItem('dev','1'); dev=sessionStorage.getItem('dev')==='1'; }catch(e){}
  var origSet=Storage.prototype.setItem;
  function gate(){
    if(inTg||dev) return;
    var s=document.createElement('style');
    s.textContent='#gate{position:fixed;inset:0;z-index:99999;background:#FBFBFA;color:#17181C;display:grid;place-items:center;padding:24px;text-align:center;font:16px/1.5 Onest,system-ui,sans-serif}#gate b{display:block;font:600 22px Unbounded,sans-serif;margin-bottom:10px}#gate p{max-width:34ch;margin:0 auto 18px;color:#5D5F69}#gate a{display:inline-block;background:#557546;color:#fff;text-decoration:none;padding:12px 22px;border-radius:999px;font-weight:600}';
    document.head.appendChild(s);
    function mk(){ var d=document.createElement('div'); d.id='gate'; d.innerHTML='<div><b>JulYera study hub</b><p>Обучалки открываются только через Telegram-бота: так прогресс привязан к твоему аккаунту.</p>'+(BOT_URL?'<a href="'+BOT_URL+'">Открыть бота</a>':'')+'</div>'; document.body.appendChild(d); document.body.style.overflow='hidden'; }
    if(document.body) mk(); else document.addEventListener('DOMContentLoaded',mk);
  }
  /* gate() отключён: сайт открывается и без бота, прогресс хранится в браузере, в Telegram синхронизируется */
  if(!inTg) return;
  try{ tg.ready(); tg.expand(); }catch(e){}
  var cs=tg.CloudStorage, timers={};
  function lsKeys(){ var o=[]; for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(PFX.test(k)) o.push(k); } return o; }
  function push(k){
    var v=localStorage.getItem(k); if(v==null) return;
    var ts=+localStorage.getItem('__ts_'+k)||Date.now(), n=Math.max(1,Math.ceil(v.length/CH));
    for(var i=0;i<n;i++) cs.setItem(k+'_'+i, v.slice(i*CH,(i+1)*CH));
    cs.setItem(k+'_m', JSON.stringify({n:n,ts:ts}));
  }
  Storage.prototype.setItem=function(k,v){
    origSet.call(this,k,v);
    if(this===localStorage && PFX.test(k) && k.indexOf('__ts_')!==0){
      origSet.call(this,'__ts_'+k,String(Date.now()));
      clearTimeout(timers[k]); timers[k]=setTimeout(function(){push(k)},1500);
    }
  };
  document.addEventListener('visibilitychange',function(){ if(document.hidden) lsKeys().forEach(push); });
  cs.getKeys(function(err,keys){
    if(err||!keys) return;
    var metas=keys.filter(function(x){return /_m$/.test(x)}), left=metas.length, changed=false, seen={};
    function finish(){
      lsKeys().forEach(function(k){ if(!seen[k]) push(k); });
      var done=false; try{ done=sessionStorage.getItem('synced')==='1'; }catch(e){}
      if(changed && !done){ try{sessionStorage.setItem('synced','1');}catch(e){} location.reload(); }
    }
    if(!left) return finish();
    metas.forEach(function(mk){
      var k=mk.slice(0,-2); seen[k]=1;
      cs.getItem(mk,function(e,mv){
        var m={}; try{m=JSON.parse(mv)}catch(x){}
        var lts=+localStorage.getItem('__ts_'+k)||0;
        if(m.ts>lts && m.n){
          var names=[]; for(var i=0;i<m.n;i++) names.push(k+'_'+i);
          cs.getItems(names,function(e2,vals){
            if(!e2&&vals){ var s=''; names.forEach(function(nm){ s+=vals[nm]||''; });
              if(s && s!==localStorage.getItem(k)){ origSet.call(localStorage,k,s); changed=true; }
              origSet.call(localStorage,'__ts_'+k,String(m.ts)); }
            if(--left===0) finish();
          });
        } else { if(lts>m.ts) push(k); if(--left===0) finish(); }
      });
    });
  });
})();
</script>

L.fit = cv => { const r = cv.getBoundingClientRect(); const d = window.devicePixelRatio || 1; if (!cv.dataset.h) cv.dataset.h = cv.getAttribute('height'); const h = +cv.dataset.h; cv.width = Math.max(1, Math.round(r.width * d)); cv.height = Math.round(h * d); cv.style.height = h + 'px'; const x = cv.getContext('2d'); x.setTransform(d, 0, 0, d, 0, 0); return { x, w: r.width, h }; };

  const text = (x, y, s, cls = 'note', extra = {}) => L.el('text', Object.assign({ x, y, class: cls }, extra), svg, s);
  return { X, Y, pw, ph, T, B, Lm, Rm, W, H, path, text, clipY: v => Math.max(T, Math.min(T + ph, Y(v))) };
};

/* graphs */
L.uf = n => { const p = Array.from({ length: n }, (_, i) => i), s = Array(n).fill(1); const f = a => { while (p[a] !== a) { p[a] = p[p[a]]; a = p[a]; } return a; }; return { f, u(a, b) { a = f(a); b = f(b); if (a === b) return false; if (s[a] < s[b]) [a, b] = [b, a]; p[b] = a; s[a] += s[b]; return true; }, size: a => s[f(a)] }; };
L.comps = (n, E) => { const u = L.uf(n); E.forEach(([a, b]) => u.u(a, b)); const root = [], size = {}; for (let i = 0; i < n; i++) { root[i] = u.f(i); size[root[i]] = (size[root[i]] || 0) + 1; } let g = root[0]; for (const k in size) if (size[k] > size[g]) g = +k; return { root, size, g, gs: n ? size[g] : 0 }; };
L.er = (n, k, r) => { const p = k / (n - 1), E = []; for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) if (r() < p) E.push([i, j]); return E; };
L.ba = (n, m, r) => { const E = [], T = []; const m0 = m + 1; for (let i = 0; i < m0; i++) for (let j = i + 1; j < m0; j++) { E.push([i, j]); T.push(i, j); } for (let i = m0; i < n; i++) { const ch = new Set(); while (ch.size < m) ch.add(T[Math.floor(r() * T.length)]); ch.forEach(t => { E.push([i, t]); T.push(i, t); }); } return E; };
L.degs = (n, E) => { const d = Array(n).fill(0); E.forEach(([a, b]) => { d[a]++; d[b]++; }); return d; };
L.adj = (n, E) => { const A = Array.from({ length: n }, () => []); E.forEach(([a, b]) => { A[a].push(b); A[b].push(a); }); return A; };
L.bfsDist = (A, s) => { const d = new Int32Array(A.length).fill(-1); d[s] = 0; const q = [s]; for (let h = 0; h < q.length; h++) { const u = q[h]; for (const v of A[u]) if (d[v] < 0) { d[v] = d[u] + 1; q.push(v); } } return d; };
L.layout = (n, E, r, it = 300, opt = {}) => {
  const P = [...Array(n)].map(() => [r() - .5, r() - .5]);
  const rep = opt.rep ?? 0.0025, len = opt.len ?? 0.12, grav = opt.grav ?? 0.06;
  for (let s = 0; s < it; s++) {
    const F = P.map(() => [0, 0]); const t = 0.1 * (1 - s / it) + 0.005;
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) { const dx = P[i][0] - P[j][0], dy = P[i][1] - P[j][1], d2 = dx * dx + dy * dy + 1e-4, f = rep / d2; F[i][0] += dx * f; F[i][1] += dy * f; F[j][0] -= dx * f; F[j][1] -= dy * f; }
    E.forEach(([a, b]) => { const dx = P[a][0] - P[b][0], dy = P[a][1] - P[b][1], d = Math.sqrt(dx * dx + dy * dy) + 1e-4, f = (d - len) * 0.5; F[a][0] -= dx / d * f; F[a][1] -= dy / d * f; F[b][0] += dx / d * f; F[b][1] += dy / d * f; });
    for (let i = 0; i < n; i++) { F[i][0] -= P[i][0] * grav; F[i][1] -= P[i][1] * grav; const m = Math.hypot(F[i][0], F[i][1]) || 1, k = Math.min(m, t) / m; P[i][0] += F[i][0] * k; P[i][1] += F[i][1] * k; }
  }
  return P;
};
/* draw a network into a canvas, sized to fit */
L.drawNet = (cv, n, E, P, opt = {}) => {
  const { x, w, h } = L.fit(cv); const c = L.C();
  const xs = P.map(p => p[0]), ys = P.map(p => p[1]); const a0 = Math.min(...xs), a1 = Math.max(...xs), b0 = Math.min(...ys), b1 = Math.max(...ys);
  const pad = opt.pad ?? 18, sc = Math.min((w - 2 * pad) / (a1 - a0 || 1), (h - 2 * pad) / (b1 - b0 || 1)); const ox = (w - (a1 - a0) * sc) / 2, oy = (h - (b1 - b0) * sc) / 2;
  const pt = p => [ox + (p[0] - a0) * sc, oy + (p[1] - b0) * sc];
  const deg = L.degs(n, E);
  x.strokeStyle = c.edge; x.lineWidth = opt.lw ?? 1.1; E.forEach(([a, b]) => { x.beginPath(); x.moveTo(...pt(P[a])); x.lineTo(...pt(P[b])); x.stroke(); });
  for (let i = 0; i < n; i++) { const [X, Y] = pt(P[i]); const r = opt.size ? opt.size(deg[i], i) : 3.5; x.beginPath(); x.arc(X, Y, r, 0, 7); x.fillStyle = opt.color ? opt.color(deg[i], i, c) : c.blue; x.fill(); }
  if (opt.label) { x.fillStyle = c.muted; x.font = '12px "JetBrains Mono",monospace'; x.textAlign = 'left'; x.textBaseline = 'top'; x.fillText(opt.label(deg), 4, 4); }
  return { pt, deg, x, c };
};
/* a tiny step player: drives step() on a timer */
L.player = (root, step, reset, speed = 700) => {
  let timer = null;
  const btn = root.querySelector('[data-r="auto"]');
  const stop = () => { clearInterval(timer); timer = null; if (btn) btn.textContent = 'Авто'; };
  const api = {

    toggle() { if (timer) { stop(); return; } if (btn) btn.textContent = 'Пауза'; timer = setInterval(() => { if (!step()) stop(); }, matchMedia('(prefers-reduced-motion: reduce)').matches ? 120 : speed); },
  };

  btn?.addEventListener('click', api.toggle);
  root.querySelector('[data-r="reset"]')?.addEventListener('click', () => { stop(); reset(); });
  return api;
};
/* log-binned degree distribution: returns [[k, p_k], ...] */
L.logbin = (degs, base = 1.5) => { const n = degs.length; const mx = Math.max(...degs); const out = []; let lo = 1; while (lo <= mx) { const hi = Math.max(lo + 1, Math.floor(lo * base)); let c = 0; degs.forEach(d => { if (d >= lo && d < hi) c++; }); if (c) out.push([Math.sqrt(lo * (hi - 1 || 1)), c / n / (hi - lo)]); lo = hi; } return out; };
L.hist = degs => { const n = degs.length, m = {}; degs.forEach(d => m[d] = (m[d] || 0) + 1); return Object.keys(m).map(Number).sort((a, b) => a - b).map(k => [k, m[k] / n]); };
L.dots = (svg, ch, pts, cls, r = 3) => pts.forEach(([a, b]) => { const y = ch.Y(b), x = ch.X(a); if (isFinite(x) && isFinite(y) && y >= ch.T - 1 && y <= ch.T + ch.ph + 1) L.el('circle', { cx: x, cy: y, r, class: cls }, svg); });

      <div class="mini"><h3>G(N, L) · Эрдёш и Реньи</h3><svg data-r="gnl" viewBox="0 0 260 150"></svg><p>Число связей <b>L задано</b>. Раскладываем ровно L связей по случайным парам.</p></div>

    </div>
  </section>

        <p>Всего пар: <span class="f">N(N−1)/2</span>. Каждая становится связью с вероятностью p:</p>
        <div class="formula">⟨L⟩ = p · N(N−1)/2</div>

        <div class="formula">⟨k⟩ = 2⟨L⟩/N = p(N−1)<small>вероятность × максимум возможных связей</small></div>
      </div>
    </div>
    <p class="hand">Двойка в 2⟨L⟩/N: каждая связь даёт +1 степени двум узлам сразу.</p>
  </section>
  <section class="board"><div class="step"><span class="num">4</span><h2>Распределение степеней: бином → Пуассон</h2></div>
    <p>Чтобы у узла было ровно <b>k</b> связей: выбрать, какие k из N−1 горят, все k горят (p<sup>k</sup>), остальные нет ((1−p)<sup>N−1−k</sup>). Это <b>бином</b>.</p>

    </div>
    <div class="facts">
      <div class="fact"><div class="big">816 … 1185</div><p>Если бы соцсеть была случайной с ⟨k⟩ = 1000, у самого популярного было бы ~1185 друзей, у самого одинокого ~816. Выбросов нет.</p></div>
      <div class="fact"><div class="big">~20 vs ~1000</div><p>Интернет: модель предсказывает максимум около 20 связей у роутера, а в реальности есть роутеры с ~1000.</p></div>
    </div>
    <svg data-r="loglog"></svg>
    <p><b>Вывод:</b> у реальных сетей распределение степеней гораздо шире Пуассона. Это мотивирует <mark>scale-free модели</mark> (E5–E9).</p>
  </section>`,
  init(root) {

      <div class="card"><h3>Θ(g) — точно</h3><span class="cond">c₁g ≤ f ≤ c₂g</span><p>Θ ⇔ одновременно O и Ω</p></div></div>

  <section class="board"><div class="step"><span class="num">3</span><h2>Prefix averages: три реализации</h2></div>
    <p>Дана последовательность S из n чисел. Нужно A[j] = среднее S[0..j]. Каждая клетка ниже — одна операция сложения.</p>
    <div class="controls"><label>n = <b data-r="nV">8</b><input data-r="n" type="range" min="3" max="20" step="1" value="8"></label></div>
    <div class="row"><div class="mini"><h3>prefix_average1 / 2 · O(n²)</h3><pre class="code">for j in range(n):
    total = 0
    for i in range(j + 1):   # j+1 раз
        total += S[i]
    A[j] = total / (j + 1)
# 2-я версия: sum(S[0:j+1]) — тоже O(j+1)</pre><canvas data-r="tri" height="220"></canvas><p data-r="c1"></p></div>

for j in range(n):

    A[j] = total / (j + 1)

  init(root) {
    const $ = n => root.querySelector(`[data-r="${n}"]`); const f = n => 3 * n * n + 10 * n + 40;
    const sw = () => { const a = +$('a').value, b = +$('b').value; $('aV').textContent = a.toFixed(1); $('bV').textContent = b.toFixed(1);
      let n0 = null; for (let n = 1; n <= 60; n++) { let ok = true; for (let k = n; k <= 200; k++) if (!(a * k * k <= f(k) && f(k) <= b * k * k)) { ok = false; break; } if (ok) { n0 = n; break; } }
      const s = $('sw'); const ch = L.chart(s, { W: 600, H: 290, x0: 0, x1: 20, y0: 0, y1: 1600, xticks: [0, 5, 10, 15, 20], yticks: [0, 400, 800, 1200, 1600], xlabel: 'n', ylabel: 'операции' });
      if (n0 != null && n0 <= 20) s.insertBefore(L.el('rect', { x: ch.X(n0), y: ch.T, width: ch.X(20) - ch.X(n0), height: ch.ph, class: 'f-hi', opacity: .45 }), s.firstChild);
      const P = fn => { const p = []; for (let n = 0; n <= 20; n += .2) p.push([n, fn(n)]); return p; };
      ch.path(P(n => b * n * n), 's-r'); ch.path(P(n => a * n * n), 's-g'); ch.path(P(f), 's-o', { style: 'stroke-width:4' });
      ch.text(ch.X(15.5), ch.clipY(b * 15.5 * 15.5) - 8, 'c₂n²', 'note r'); ch.text(ch.X(18), ch.Y(a * 18 * 18) + 24, 'c₁n²', 'note g'); ch.text(ch.X(9), ch.Y(f(9)) - 12, 'f(n)', 'note');
      if (n0 != null && n0 <= 20) { L.el('line', { x1: ch.X(n0), x2: ch.X(n0), y1: ch.T, y2: ch.T + ch.ph, class: 's-m' }, s); ch.text(ch.X(n0) + 4, ch.T + 16, 'n₀ = ' + n0, 'small'); }
      $('msg').innerHTML = n0 != null ? `Начиная с n₀ = <b>${n0}</b> функция зажата: f(n) = Θ(n²) ✓` : 'С такими c₁, c₂ функцию не зажать — попробуйте другие.'; };
    $('a').oninput = sw; $('b').oninput = sw;
    const race = () => { const s = $('race'); const ch = L.chart(s, { W: 600, H: 290, x0: 1, x1: 40, y0: 1, y1: 1e6, logy: true, xticks: [1, 10, 20, 30, 40], yticks: [1, 10, 100, 1e3, 1e4, 1e5, 1e6], yfmt: v => v >= 1e3 ? '10^' + Math.log10(v) : v, xlabel: 'n', ylabel: 'f(n), лог. шкала' });
      const fns = [['1', n => 1, 's-m'], ['log n', n => Math.max(1, Math.log2(n)), 's-g'], ['n', n => n, 's-b'], ['n log n', n => n * Math.max(1, Math.log2(n)), 's-v'], ['n²', n => n * n, 's-o'], ['n³', n => n ** 3, 's-r'], ['2ⁿ', n => 2 ** n, 's-r s-d']];
      fns.forEach(([nm, fn, cls]) => { const p = []; for (let n = 1; n <= 40; n += .25) p.push([n, fn(n)]); ch.path(p, cls); let xe = 40; if (fn(40) > 1e6) { xe = 1; while (fn(xe) < 1e6 && xe < 40) xe += .25; } ch.text(ch.X(xe) - 4, ch.clipY(fn(xe)) - 6, nm, 'small', { 'text-anchor': 'end', style: 'font:600 13px var(--f-mono);fill:var(--ink)' }); }); };
    const tri = () => { const n = +$('n').value; $('nV').textContent = n; const c = L.C();
      [['tri', true], ['lin', false]].forEach(([id, sq]) => { const { x, w, h } = L.fit($(id)); const cell = Math.min((w - 20) / n, (h - 10) / n, 22);
        for (let j = 0; j < n; j++) { const cnt = sq ? j + 1 : 1; for (let i = 0; i < cnt; i++) { x.fillStyle = sq ? c.marker : c.ok; x.fillRect(10 + i * cell, 5 + j * cell, cell - 2, cell - 2); } x.fillStyle = c.muted; x.font = '10px "JetBrains Mono",monospace'; x.textBaseline = 'middle'; x.textAlign = 'left'; } });
      $('c1').innerHTML = `сложений: 1 + 2 + … + ${n} = <b>${n * (n + 1) / 2}</b> → O(n²)`; $('c3').innerHTML = `сложений: <b>${n}</b> → O(n)`; };
    $('n').oninput = tri;
    this._d = () => { sw(); race(); tri(); };
  },
  draw() { this._d && this._d(); },
});

const ORIG = [{"key": "E1", "title": "E1. The Erdős–Rényi random network model", "group": "Неделя 1 — случайные сети (E1–E4)", "groupShort": "Неделя 1", "html": "<p><b>Как могут спросить:</b> Describe the random network model. / What is the degree distribution of a random network? / Why are real networks not Poisson?</p><p><b>Скелет:</b> construction (G(N,p) vs G(N,L)) → number of links and ⟨k⟩ → binomial → Poisson degree distribution → why real networks are not Poisson.</p><p><b>Model answer (~300 words):</b></p><p>The random network model, studied by Erdős and Rényi, is the simplest attempt to reproduce real networks: links are placed completely at random. There are two equivalent definitions. In the G(N, L) model, N labeled nodes are connected by L randomly placed links. In the G(N, p) model, introduced by Gilbert, each of the N(N-1)/2 node pairs is connected with probability p. The construction is simple: start with N isolated nodes, pick a pair, draw a random number between 0 and 1, and connect the pair if the number is smaller than p; repeat for every pair.</p><p>Because the network is random, the number of links changes from one realization to another. Its expected value is <code>&lt;L&gt; = p N(N-1)/2</code>, the probability of a link times the number of pairs. Hence the average degree is <code>&lt;k&gt; = 2&lt;L&gt;/N = p(N-1)</code>: the probability p times the maximum number of links a node can have.</p><p>The probability that a node has exactly k links follows a binomial distribution: the node must have k of its N-1 possible links present and all the others missing. Since real networks are sparse (&lt;k&gt; much smaller than N), the binomial is well approximated by a Poisson distribution, <code>p_k = e^(-&lt;k&gt;) &lt;k&gt;^k / k!</code>, which depends only on &lt;k&gt; and not on N. Its standard deviation is <code>sigma_k = sqrt(&lt;k&gt;)</code>, so most nodes have a degree close to the average.</p><p>This is exactly where the model fails. If the social network were random with &lt;k&gt; = 1000, the most connected person would have only about 1185 friends and the least connected about 816: there would be no outliers. The k! in the denominator makes high-degree nodes extremely rare. Real networks, however, contain hubs: routers with about 1000 links in the Internet, where the random model predicts about 20, and people with thousands of contacts. Real networks therefore have much broader degree distributions than the Poisson form, which motivates the scale-free models.</p><p><b>Формулы:</b></p><div class=\"tex\">\\[\\langle L\\rangle = p\\,\\frac{N(N-1)}{2}, \\qquad \\langle k\\rangle = \\frac{2\\langle L\\rangle}{N} = p(N-1)\\]</div><div class=\"tex\">\\[p_k = \\binom{N-1}{k}\\, p^k (1-p)^{N-1-k} \\;\\approx\\; e^{-\\langle k\\rangle}\\,\\frac{\\langle k\\rangle^k}{k!}\\]</div><div class=\"tex\">\\[\\sigma_k = \\sqrt{\\langle k\\rangle}\\]</div>", "ru": "<p><b>Как могут спросить:</b> Опишите модель случайной сети. / Каково распределение степеней случайной сети? / Почему реальные сети не пуассоновские?</p><p><b>Скелет:</b> построение (G(N,p) и G(N,L)) → число связей и ⟨k⟩ → бином → пуассоновское распределение степеней → почему реальные сети не пуассоновские.</p><p><b>Образцовый ответ (~300 слов):</b></p><p>Модель случайной сети, изученная Эрдёшем и Реньи, — это простейшая попытка воспроизвести реальные сети: связи расставляются совершенно случайно. Есть два равносильных определения. В модели G(N, L) N пронумерованных узлов соединяются L случайно расставленными связями. В модели G(N, p), предложенной Гилбертом, каждая из N(N−1)/2 пар узлов соединяется с вероятностью p. Построение простое: начинаем с N изолированных узлов, берём пару, вытягиваем случайное число от 0 до 1 и соединяем пару, если число меньше p; повторяем для каждой пары.</p><p>Поскольку сеть случайная, число связей меняется от одной реализации к другой. Его ожидаемое значение <code>&lt;L&gt; = p N(N-1)/2</code> — вероятность связи, умноженная на число пар. Отсюда средняя степень <code>&lt;k&gt; = 2&lt;L&gt;/N = p(N-1)</code>: вероятность p, умноженная на максимальное число связей, которое может иметь узел.</p><p>Вероятность того, что у узла ровно k связей, подчиняется биномиальному распределению: у узла должны присутствовать k из N−1 возможных связей, а все остальные отсутствовать. Поскольку реальные сети разреженные (⟨k⟩ намного меньше N), бином хорошо приближается распределением Пуассона <code>p_k = e^(-&lt;k&gt;) &lt;k&gt;^k / k!</code>, которое зависит только от ⟨k⟩, а не от N. Его стандартное отклонение <code>sigma_k = sqrt(&lt;k&gt;)</code>, поэтому у большинства узлов степень близка к средней.</p><p>Именно здесь модель ломается. Если бы социальная сеть была случайной с ⟨k⟩ = 1000, у самого общительного человека было бы всего около 1185 друзей, а у самого замкнутого около 816: выбросов не было бы. k! в знаменателе делает узлы с большой степенью крайне редкими. В реальных же сетях есть хабы: роутеры примерно с 1000 связей в Интернете, где случайная модель предсказывает около 20, и люди с тысячами контактов. Поэтому у реальных сетей распределение степеней гораздо шире пуассоновского, и это мотивирует scale-free модели.</p><p><b>Формулы:</b> см. оригинал выше.</p>"}, {"key": "E2", "title": "E2. Emergence of the giant connected component ⭐ (был в примерах)", "group": "Неделя 1 — случайные сети (E1–E4)", "groupShort": "Неделя 1", "html": "<p><b>Как могут спросить:</b> Describe the emergence of the giant connected component in random graphs. / What are the regimes of a random network? / Are real networks supercritical?</p><p><b>Скелет:</b> what happens as ⟨k⟩ grows → derivation S = 1 − e^(−⟨k⟩S) → threshold ⟨k⟩ = 1 → four regimes → real networks are supercritical.</p><p><b>Model answer (~300 words):</b></p><p>In a random network the size of the largest connected component, N_G, changes with the average degree &lt;k&gt;. For p = 0 all nodes are isolated and N_G/N goes to zero; for p = 1 the network is complete and N_G/N = 1. One could expect N_G to grow gradually between these extremes, but this does not happen: N_G/N stays zero for small &lt;k&gt; and then, once &lt;k&gt; passes a critical value, a giant component suddenly appears. This is a phase transition, similar to water freezing or to the magnetic transition in physics.</p><p>The threshold can be derived. Let u be the fraction of nodes that are not in the giant component. A node is outside it if, for every other node, either there is no link between them or there is a link but the other node is also outside. Writing this probability for all N-1 other nodes, using p = &lt;k&gt;/(N-1) and taking the logarithm, we obtain a simple equation for the fraction of nodes in the giant component, S = 1 - u:</p><p><code>S = 1 - e^(-&lt;k&gt; S)</code></p><p>It has a non-zero solution only when &lt;k&gt; &gt; 1. The Erdős–Rényi condition for the giant component is therefore <code>&lt;k&gt; = 1</code>, i.e. <code>p_c = 1/N</code>: a giant component exists if, on average, each node has more than one link.</p><p>We can distinguish four regimes. Subcritical (&lt;k&gt; &lt; 1): only tiny clusters. Critical point (&lt;k&gt; = 1): many components of very different sizes coexist and the largest one is still a vanishing fraction of the nodes. Supercritical (&lt;k&gt; &gt; 1): a giant component containing a finite fraction of the nodes coexists with small isolated clusters, and it grows as we move away from the threshold. Connected regime (&lt;k&gt; &gt; ln N): the giant component absorbs every node.</p><p>Real networks such as the Internet (&lt;k&gt; = 6.34, ln N = 12.17) or the power grid (&lt;k&gt; = 2.67, ln N = 8.51) have &lt;k&gt; &gt; 1 but &lt;k&gt; &lt; ln N, so the model predicts that they are supercritical: one giant component plus some disconnected pieces.</p><p><b>Формулы:</b></p><div class=\"tex\">\\[u = (1 - p + pu)^{N-1} \\;\\Rightarrow\\; u = e^{-\\langle k\\rangle (1-u)} \\;\\Rightarrow\\; S = 1 - e^{-\\langle k\\rangle S}\\]</div><div class=\"tex\">\\[\\langle k\\rangle_c = 1, \\qquad p_c = \\frac{1}{N-1} \\approx \\frac{1}{N}\\]</div><div class=\"tex\">\\[\\text{connected regime: } \\langle k\\rangle &gt; \\ln N \\quad \\left(p &gt; \\frac{\\ln N}{N}\\right)\\]</div>", "ru": "<p><b>Как могут спросить:</b> Опишите появление гигантской связной компоненты в случайных графах. / Какие режимы есть у случайной сети? / Являются ли реальные сети сверхкритическими?</p><p><b>Скелет:</b> что происходит при росте ⟨k⟩ → вывод S = 1 − e^(−⟨k⟩S) → порог ⟨k⟩ = 1 → четыре режима → реальные сети сверхкритические.</p><p><b>Образцовый ответ (~300 слов):</b></p><p>В случайной сети размер самой большой связной компоненты N_G меняется вместе со средней степенью ⟨k⟩. При p = 0 все узлы изолированы и N_G/N стремится к нулю; при p = 1 сеть полная и N_G/N = 1. Можно было бы ожидать, что между этими крайностями N_G растёт постепенно, но этого не происходит: N_G/N остаётся нулевой при малых ⟨k⟩, а затем, как только ⟨k⟩ превышает критическое значение, внезапно появляется гигантская компонента. Это фазовый переход, похожий на замерзание воды или на магнитный переход в физике.</p><p>Порог можно вывести. Пусть u — доля узлов, не входящих в гигантскую компоненту. Узел находится вне её, если для каждого другого узла либо между ними нет связи, либо связь есть, но другой узел тоже снаружи. Записав эту вероятность для всех N−1 других узлов, подставив p = ⟨k⟩/(N−1) и взяв логарифм, получаем простое уравнение для доли узлов в гигантской компоненте S = 1 − u:</p><p><code>S = 1 - e^(-&lt;k&gt; S)</code></p><p>Ненулевое решение у него есть только при ⟨k⟩ &gt; 1. Поэтому условие Эрдёша–Реньи для гигантской компоненты — <code>&lt;k&gt; = 1</code>, то есть <code>p_c = 1/N</code>: гигантская компонента существует, если в среднем у каждого узла больше одной связи.</p><p>Можно выделить четыре режима. Подкритический (⟨k⟩ &lt; 1): только крошечные кластеры. Критическая точка (⟨k⟩ = 1): сосуществует много компонент очень разного размера, а самая большая всё ещё составляет исчезающе малую долю узлов. Сверхкритический (⟨k⟩ &gt; 1): гигантская компонента, содержащая конечную долю узлов, сосуществует с маленькими изолированными кластерами и растёт по мере удаления от порога. Связный режим (⟨k⟩ &gt; ln N): гигантская компонента поглощает все узлы.</p><p>Реальные сети, такие как Интернет (⟨k⟩ = 6.34, ln N = 12.17) или электросеть (⟨k⟩ = 2.67, ln N = 8.51), имеют ⟨k⟩ &gt; 1, но ⟨k⟩ &lt; ln N, поэтому модель предсказывает, что они сверхкритические: одна гигантская компонента плюс несколько оторванных кусков.</p><p><b>Формулы:</b> см. оригинал выше.</p>"}, {"key": "E3", "title": "E3. The small-world property and clustering in random networks", "group": "Неделя 1 — случайные сети (E1–E4)", "groupShort": "Неделя 1", "html": "<p><b>Как могут спросить:</b> Describe the small-world phenomenon. / Derive the average distance in a random network. / What is the clustering coefficient of a random network?</p><p><b>Скелет:</b> six degrees / Milgram → counting nodes at distance d → ⟨d⟩ ≈ ln N / ln⟨k⟩ → numerical example → clustering C = p = ⟨k⟩/N fails for real networks.</p><p><b>Model answer (~300 words):</b></p><p>The small-world phenomenon states that any two people on Earth are connected by a short chain of acquaintances; the popular version is &quot;six degrees of separation&quot;. It goes back to Stanley Milgram&#x27;s 1967 experiment: residents of Wichita and Omaha were asked to forward a letter, through people they knew personally, to a target person in Massachusetts. Of 296 letters, 64 arrived, and the first one passed through only two intermediaries. In network terms the property means that the distance between two randomly chosen nodes is short.</p><p>The random network model explains why. A node with average degree &lt;k&gt; has about &lt;k&gt; nodes at distance 1, &lt;k&gt;^2 at distance 2 and &lt;k&gt;^d at distance d. The number of nodes within distance d grows exponentially with d, but it cannot exceed the network size N. Setting &lt;k&gt;^d_max = N and taking logarithms gives the maximum distance, and the same estimate holds for the average distance:</p><p><code>&lt;d&gt; ~ ln N / ln &lt;k&gt;</code></p><p>&quot;Small&quot; means that distances grow only logarithmically with the network size, so they are orders of magnitude smaller than N; moreover, the denser the network, the shorter the distances. For the world&#x27;s social network, with N = 7 x 10^9 and &lt;k&gt; = 1000, we get &lt;d&gt; = 3.28: three to four handshakes, even fewer than six.</p><p>The random model is less successful with clustering. The local clustering coefficient <code>C_i = 2 L_i / (k_i (k_i - 1))</code> measures what fraction of the possible links among the neighbours of node i actually exist. In a random network any two neighbours are linked with probability p, so the clustering coefficient is simply <code>C = p = &lt;k&gt;/N</code>. The model therefore predicts that clustering decreases as 1/N and does not depend on the node&#x27;s degree. Real networks have far higher clustering than a random network with the same N and L, and their C(k) decreases with k. This failure motivated the Watts–Strogatz model.</p><p><b>Формулы:</b></p><div class=\"tex\">\\[N(d) \\approx 1 + \\langle k\\rangle + \\langle k\\rangle^2 + \\dots + \\langle k\\rangle^d = \\frac{\\langle k\\rangle^{d+1} - 1}{\\langle k\\rangle - 1}\\]</div><div class=\"tex\">\\[\\langle d\\rangle \\approx \\frac{\\ln N}{\\ln \\langle k\\rangle}\\]</div><div class=\"tex\">\\[C_i = \\frac{2L_i}{k_i(k_i-1)}, \\qquad C_{\\text{random}} = p = \\frac{\\langle k\\rangle}{N}\\]</div>", "ru": "<p><b>Как могут спросить:</b> Опишите феномен «тесного мира». / Выведите среднее расстояние в случайной сети. / Каков коэффициент кластеризации случайной сети?</p><p><b>Скелет:</b> шесть рукопожатий / Милгрэм → считаем узлы на расстоянии d → ⟨d⟩ ≈ ln N / ln⟨k⟩ → числовой пример → кластеризация C = p = ⟨k⟩/N не работает для реальных сетей.</p><p><b>Образцовый ответ (~300 слов):</b></p><p>Феномен тесного мира (small world) утверждает, что любых двух людей на Земле связывает короткая цепочка знакомых; популярная версия — «шесть рукопожатий». Он восходит к эксперименту Стэнли Милгрэма 1967 года: жителей Уичито и Омахи попросили переслать письмо через лично знакомых людей адресату в Массачусетсе. Из 296 писем дошло 64, и первое прошло всего через двух посредников. На языке сетей это свойство означает, что расстояние между двумя случайно выбранными узлами мало.</p><p>Модель случайной сети объясняет почему. У узла со средней степенью ⟨k⟩ около ⟨k⟩ узлов на расстоянии 1, ⟨k⟩² на расстоянии 2 и ⟨k⟩^d на расстоянии d. Число узлов в пределах расстояния d растёт экспоненциально с d, но не может превысить размер сети N. Приравняв ⟨k⟩^d_max = N и взяв логарифмы, получаем максимальное расстояние, и та же оценка верна для среднего расстояния:</p><p><code>&lt;d&gt; ~ ln N / ln &lt;k&gt;</code></p><p>«Малое» означает, что расстояния растут лишь логарифмически с размером сети, поэтому они на порядки меньше N; кроме того, чем плотнее сеть, тем короче расстояния. Для мировой социальной сети с N = 7 × 10⁹ и ⟨k⟩ = 1000 получаем ⟨d⟩ = 3.28: три-четыре рукопожатия, даже меньше шести.</p><p>С кластеризацией случайная модель справляется хуже. Локальный коэффициент кластеризации <code>C_i = 2 L_i / (k_i (k_i - 1))</code> показывает, какая доля возможных связей между соседями узла i реально существует. В случайной сети любые два соседа связаны с вероятностью p, поэтому коэффициент кластеризации просто <code>C = p = &lt;k&gt;/N</code>. Значит, модель предсказывает, что кластеризация убывает как 1/N и не зависит от степени узла. У реальных сетей кластеризация гораздо выше, чем у случайной сети с теми же N и L, а их C(k) убывает с ростом k. Этот провал мотивировал модель Уоттса–Строгаца.</p><p><b>Формулы:</b> см. оригинал выше.</p>"}, {"key": "E4", "title": "E4. The Watts–Strogatz model ⭐ (был в примерах)", "group": "Неделя 1 — случайные сети (E1–E4)", "groupShort": "Неделя 1", "html": "<p><b>Как могут спросить:</b> Describe the reasons that led to the introduction of the Watts–Strogatz model and its main characteristics.</p><p><b>Скелет:</b> two observations (small distances, high clustering) → lattice vs random network → rewiring construction → small-world regime → limitations (no hubs, Poisson degrees, C(k) constant).</p><p><b>Model answer (~300 words):</b></p><p>The Watts–Strogatz model was proposed by Duncan Watts and Steven Strogatz in 1998 as an extension of the random network model. It was motivated by two empirical observations. First, in real networks the average distance between nodes grows logarithmically with N, as in random networks (<code>&lt;d&gt; ~ ln N / ln &lt;k&gt;</code>), and not polynomially, as in regular lattices. Second, the average clustering coefficient of real networks is much higher than the one expected for a random network with the same N and L. Neither classical model reproduces both facts: a regular lattice has high clustering but large distances, while a random network has short distances but a clustering coefficient <code>C = &lt;k&gt;/N</code>, which vanishes for large networks.</p><p>The model interpolates between these two extremes. We start from a ring of N nodes in which every node is connected to its immediate and next neighbours; this lattice has a high average clustering coefficient, <code>&lt;C&gt; = 3/4</code>, but long paths. Then each link is rewired with probability p to a randomly chosen node. For p = 0 we keep the regular lattice; for p = 1 every link has been rewired and the network becomes a random network.</p><p>The interesting behaviour appears for small p. Numerical simulations show that already a few rewired links act as long-range shortcuts that drastically reduce the average path length, while most local triangles survive, so the clustering coefficient stays high. In a broad range of p the network therefore shows both high clustering and the small-world property, as real networks do. This is why the model became the standard explanation of their coexistence.</p><p>The model, however, has important limitations. Its degree distribution is Poisson-like and bounded, as in the random model, so high-degree nodes (hubs) are absent, while real networks are often scale-free. Moreover, it predicts a clustering coefficient C(k) independent of the degree, whereas in real networks C(k) decreases with k. Explaining hubs required a different mechanism: growth and preferential attachment in the Barabási–Albert model.</p><p><b>Формулы:</b></p><div class=\"tex\">\\[\\text{ring lattice: } \\langle C\\rangle = \\tfrac{3}{4}; \\qquad p = 0 \\to \\text{lattice}, \\quad p = 1 \\to \\text{random network}\\]</div>", "ru": "<p><b>Как могут спросить:</b> Опишите причины, которые привели к появлению модели Уоттса–Строгаца, и её основные характеристики.</p><p><b>Скелет:</b> два наблюдения (малые расстояния, высокая кластеризация) → решётка против случайной сети → построение с перекидыванием связей → режим small world → ограничения (нет хабов, пуассоновские степени, C(k) постоянна).</p><p><b>Образцовый ответ (~300 слов):</b></p><p>Модель Уоттса–Строгаца предложили Дункан Уоттс и Стивен Строгац в 1998 году как расширение модели случайной сети. Её мотивировали два эмпирических наблюдения. Во-первых, в реальных сетях среднее расстояние между узлами растёт логарифмически с N, как в случайных сетях (<code>&lt;d&gt; ~ ln N / ln &lt;k&gt;</code>), а не полиномиально, как в регулярных решётках. Во-вторых, средний коэффициент кластеризации реальных сетей гораздо выше ожидаемого для случайной сети с теми же N и L. Ни одна из классических моделей не воспроизводит оба факта: у регулярной решётки высокая кластеризация, но большие расстояния, а у случайной сети короткие расстояния, но коэффициент кластеризации <code>C = &lt;k&gt;/N</code>, который исчезает для больших сетей.</p><p>Модель интерполирует между этими двумя крайностями. Начинаем с кольца из N узлов, в котором каждый узел соединён с ближайшими и следующими за ними соседями; у этой решётки высокий средний коэффициент кластеризации <code>&lt;C&gt; = 3/4</code>, но длинные пути. Затем каждая связь с вероятностью p перекидывается на случайно выбранный узел. При p = 0 остаётся регулярная решётка; при p = 1 перекинуты все связи, и сеть становится случайной.</p><p>Интересное поведение возникает при малых p. Численные симуляции показывают, что уже несколько перекинутых связей работают как дальние «короткие пути», резко уменьшая среднюю длину пути, тогда как большинство локальных треугольников сохраняется, и коэффициент кластеризации остаётся высоким. Поэтому в широком диапазоне p сеть обладает и высокой кластеризацией, и свойством тесного мира, как реальные сети. Поэтому модель стала стандартным объяснением их сосуществования.</p><p>Однако у модели есть важные ограничения. Её распределение степеней похоже на пуассоновское и ограничено, как в случайной модели, поэтому узлов с большой степенью (хабов) нет, тогда как реальные сети часто scale-free. Кроме того, она предсказывает коэффициент кластеризации C(k), не зависящий от степени, тогда как в реальных сетях C(k) убывает с k. Чтобы объяснить хабы, понадобился другой механизм: рост и preferential attachment в модели Барабаши–Альберт.</p><p><b>Формулы:</b> см. оригинал выше.</p>"}, {"key": "E5", "title": "E5. The scale-free property: power laws and hubs", "group": "Неделя 2 — scale-free и модели роста (E5–E10)", "groupShort": "Неделя 2", "html": "<p><b>Как могут спросить:</b> What is a scale-free network? / Describe hubs in scale-free networks. / Compare a Poisson and a power-law degree distribution.</p><p><b>Скелет:</b> WWW map → p_k ~ k^(−γ), straight line on log-log → discrete/continuous form → hubs: tail comparison, WWW numbers → natural cutoff kmax.</p><p><b>Model answer (~300 words):</b></p><p>The scale-free property was discovered when the first maps of the World Wide Web were compared with the random network model. If the Web were random, the degrees of its documents would follow a Poisson distribution. Instead, on a log-log plot the degree distribution forms an approximately straight line, which means that it follows a power law:</p><p><code>p_k ~ k^(-gamma)</code></p><p>where gamma is the degree exponent, the slope of the line on the log-log plot. A scale-free network is defined as a network whose degree distribution follows a power law. For the WWW both the in-degree and the out-degree distributions are power laws, with gamma_in = 2.1 and gamma_out = 2.45. The constant in front of the power law is fixed by normalization, using the Riemann zeta function in the discrete formalism or k_min in the continuous one.</p><p>The main difference from a random network lies in the tail of the distribution. For small k the power law lies above the Poisson curve, so a scale-free network has many small-degree nodes; around &lt;k&gt; the Poisson curve is higher; for large k the power law is again far above it. The consequences are dramatic. In the WWW the probability of a node with 100 links is about 10^(-94) under a Poisson distribution, but about 4 x 10^(-4) under the power law. A random Web with 10^12 documents would have essentially no node with 100 or more links, while the real Web has about 4 x 10^9 of them. These highly connected nodes are called hubs.</p><p>The size of the largest hub, the natural cutoff, is obtained by requiring that at most one node has a degree above k_max. For an exponential distribution k_max grows only logarithmically with N, and for a Poisson distribution even more slowly. For a scale-free network, instead:</p><p><code>k_max = k_min * N^(1/(gamma-1))</code></p><p>so the largest hub grows polynomially with the network size. For a Web sample of 300,000 nodes an exponential distribution predicts k_max = 14, while a power law with gamma = 2.1 predicts about 95,000. In random networks hubs are effectively forbidden; in scale-free networks they are natural.</p><p><b>Формулы:</b></p><div class=\"tex\">\\[p_k \\sim k^{-\\gamma}, \\qquad \\log p_k \\sim -\\gamma \\log k\\]</div><div class=\"tex\">\\[\\text{discrete: } p_k = \\frac{k^{-\\gamma}}{\\zeta(\\gamma)}, \\qquad \\text{continuous: } p(k) = (\\gamma - 1)\\, k_{\\min}^{\\gamma-1}\\, k^{-\\gamma}\\]</div><div class=\"tex\">\\[k_{\\max} = k_{\\min}\\, N^{\\frac{1}{\\gamma-1}} \\quad (\\text{exponential: } k_{\\max} = k_{\\min} + \\tfrac{\\ln N}{\\lambda})\\]</div>", "ru": "<p><b>Как могут спросить:</b> Что такое scale-free сеть? / Опишите хабы в scale-free сетях. / Сравните пуассоновское и степенное распределения степеней.</p><p><b>Скелет:</b> карта WWW → p_k ~ k^(−γ), прямая на log-log → дискретная и непрерывная формы → хабы: сравнение хвостов, числа WWW → natural cutoff k_max.</p><p><b>Образцовый ответ (~300 слов):</b></p><p>Свойство scale-free было открыто, когда первые карты Всемирной паутины сравнили с моделью случайной сети. Если бы веб был случайным, степени его документов подчинялись бы распределению Пуассона. Вместо этого на log-log графике распределение степеней образует почти прямую линию, а значит, следует степенному закону:</p><p><code>p_k ~ k^(-gamma)</code></p><p>где γ — показатель степени (degree exponent), наклон прямой на log-log графике. Scale-free сетью называют сеть, распределение степеней которой подчиняется степенному закону. Для WWW и входящие, и исходящие степени распределены по степенному закону, с γ_in = 2.1 и γ_out = 2.45. Константа перед степенным законом определяется нормировкой: через дзета-функцию Римана в дискретном формализме или через k_min в непрерывном.</p><p>Главное отличие от случайной сети — в хвосте распределения. При малых k степенной закон лежит выше пуассоновской кривой, поэтому в scale-free сети много узлов с малой степенью; около ⟨k⟩ выше пуассоновская кривая; при больших k степенной закон снова намного выше. Последствия огромны. В WWW вероятность узла со 100 связями около 10^(−94) при распределении Пуассона, но около 4 × 10^(−4) при степенном законе. Случайный веб из 10¹² документов практически не имел бы узлов со 100 и более связями, а в реальном вебе их около 4 × 10⁹. Такие сильно связанные узлы называются хабами.</p><p>Размер самого большого хаба, natural cutoff, получают из условия, что степень выше k_max имеет не более одного узла. Для экспоненциального распределения k_max растёт лишь логарифмически с N, а для пуассоновского ещё медленнее. Для scale-free сети же:</p><p><code>k_max = k_min * N^(1/(gamma-1))</code></p><p>то есть самый большой хаб растёт полиномиально с размером сети. Для выборки веба из 300 000 узлов экспоненциальное распределение предсказывает k_max = 14, а степенной закон с γ = 2.1 — около 95 000. В случайных сетях хабы фактически запрещены; в scale-free сетях они естественны.</p><p><b>Формулы:</b> см. оригинал выше.</p>"}, {"key": "E6", "title": "E6. The meaning of \"scale-free\", the degree exponent and ultra-small worlds", "group": "Неделя 2 — scale-free и модели роста (E5–E10)", "groupShort": "Неделя 2", "html": "<p><b>Как могут спросить:</b> Explain the meaning of the term scale-free. / How do distances depend on γ? / Why don&#x27;t we observe networks with γ &lt; 2?</p><p><b>Скелет:</b> moments ⟨kⁿ⟩ and their divergence → why &quot;scale-free&quot; → ⟨d⟩ for different γ → three regimes of γ.</p><p><b>Model answer (~300 words):</b></p><p>The term scale-free comes from the theory of phase transitions, and its meaning becomes clear from the moments of the degree distribution, <code>&lt;k^n&gt; = sum of k^n p_k</code>. The first moment is the average degree, the second gives the variance <code>sigma^2 = &lt;k^2&gt; - &lt;k&gt;^2</code>, and the third the skewness. For a power law the n-th moment depends on k_max, which grows with the network size. Letting k_max go to infinity, all the moments with n &lt;= gamma - 1 stay finite, while the higher ones diverge.</p><p>For most real networks 2 &lt; gamma &lt; 3, so &lt;k&gt; is finite but &lt;k^2&gt; diverges. In a random network <code>sigma_k = sqrt(&lt;k&gt;)</code> is smaller than &lt;k&gt;, so nodes have degrees in the range &lt;k&gt; +/- sqrt(&lt;k&gt;): the average degree is the &quot;scale&quot; of the network. When &lt;k^2&gt; diverges, the fluctuations around the average can be arbitrarily large: a randomly chosen node can have a tiny degree or a huge one. Such a network has no meaningful internal scale, hence the name scale-free.</p><p>Hubs also change distances. The average distance is constant for gamma = 2, grows as ln ln N for 2 &lt; gamma &lt; 3 (the ultra-small world), as ln N / ln ln N at the critical point gamma = 3, and as ln N for gamma &gt; 3, as in random networks. Hubs act as bridges between many small-degree nodes: for the social network ln N = 22.7, but ln ln N = 3.1.</p><p>The exponent also defines three regimes. For gamma &lt; 2 (anomalous regime) the exponent 1/(gamma-1) in <code>k_max = k_min * N^(1/(gamma-1))</code> is larger than one, so the largest hub would need more links than there are nodes in the network, and &lt;k&gt; diverges: large networks of this kind cannot exist. For 2 &lt; gamma &lt; 3 (scale-free regime) the network is ultra-small and the fraction of nodes connected to the largest hub decreases with N. For gamma &gt; 3 (random regime) both &lt;k&gt; and &lt;k^2&gt; are finite, hubs are small and rare, and the network is practically indistinguishable from a random one.</p><p><b>Формулы:</b></p><div class=\"tex\">\\[\\langle k^n\\rangle = C\\,\\frac{k_{\\max}^{\\,n-\\gamma+1} - k_{\\min}^{\\,n-\\gamma+1}}{n-\\gamma+1}\\]</div><div class=\"tex\">\\[\\langle d\\rangle \\sim \\begin{cases} \\text{const} &amp; \\gamma = 2 \\\\ \\ln\\ln N &amp; 2 &lt; \\gamma &lt; 3 \\\\ \\dfrac{\\ln N}{\\ln\\ln N} &amp; \\gamma = 3 \\\\ \\ln N &amp; \\gamma &gt; 3 \\end{cases}\\]</div>", "ru": "<p><b>Как могут спросить:</b> Объясните смысл термина scale-free. / Как расстояния зависят от γ? / Почему мы не наблюдаем сетей с γ &lt; 2?</p><p><b>Скелет:</b> моменты ⟨kⁿ⟩ и их расходимость → почему «scale-free» → ⟨d⟩ при разных γ → три режима γ.</p><p><b>Образцовый ответ (~300 слов):</b></p><p>Термин scale-free пришёл из теории фазовых переходов, и его смысл становится ясен из моментов распределения степеней <code>&lt;k^n&gt; = sum of k^n p_k</code>. Первый момент — средняя степень, второй даёт дисперсию <code>sigma^2 = &lt;k^2&gt; - &lt;k&gt;^2</code>, третий — асимметрию. Для степенного закона n-й момент зависит от k_max, который растёт с размером сети. Если устремить k_max к бесконечности, все моменты с n ≤ γ − 1 остаются конечными, а старшие расходятся.</p><p>У большинства реальных сетей 2 &lt; γ &lt; 3, поэтому ⟨k⟩ конечно, а ⟨k²⟩ расходится. В случайной сети sigma_k = sqrt(⟨k⟩) меньше ⟨k⟩, поэтому степени узлов лежат в диапазоне ⟨k⟩ ± sqrt(⟨k⟩): средняя степень и есть «масштаб» сети. Когда ⟨k²⟩ расходится, отклонения от среднего могут быть сколь угодно большими: случайно выбранный узел может иметь крошечную степень или огромную. У такой сети нет осмысленного внутреннего масштаба, отсюда название scale-free.</p><p>Хабы также меняют расстояния. Среднее расстояние постоянно при γ = 2, растёт как ln ln N при 2 &lt; γ &lt; 3 (ультрамалый мир), как ln N / ln ln N в критической точке γ = 3 и как ln N при γ &gt; 3, как в случайных сетях. Хабы работают как мосты между множеством узлов с малой степенью: для социальной сети ln N = 22.7, а ln ln N = 3.1.</p><p>Показатель также задаёт три режима. При γ &lt; 2 (аномальный режим) показатель 1/(γ−1) в <code>k_max = k_min * N^(1/(gamma-1))</code> больше единицы, поэтому самому большому хабу понадобилось бы больше связей, чем узлов в сети, и ⟨k⟩ расходится: большие сети такого вида существовать не могут. При 2 &lt; γ &lt; 3 (scale-free режим) сеть ультрамалая, а доля узлов, связанных с самым большим хабом, уменьшается с N. При γ &gt; 3 (случайный режим) и ⟨k⟩, и ⟨k²⟩ конечны, хабы малы и редки, и сеть практически неотличима от случайной.</p><p><b>Формулы:</b> см. оригинал выше.</p>"}, {"key": "E7", "title": "E7. The Barabási–Albert model", "group": "Неделя 2 — scale-free и модели роста (E5–E10)", "groupShort": "Неделя 2", "html": "<p><b>Как могут спросить:</b> Describe the Barabási–Albert model. / Derive the degree dynamics of the BA model. / Explain growth and preferential attachment.</p><p><b>Скелет:</b> two hidden assumptions of ER → definition (m0, m, Π(k)) → degree dynamics k_i(t) = m(t/t_i)^(1/2) → degree distribution γ = 3 → consequences (first-mover advantage, independence of N and m).</p><p><b>Model answer (~300 words):</b></p><p>The Barabási–Albert model (1999) answers the question of why hubs and power laws are absent in random networks. It points to two hidden assumptions of the Erdős–Rényi model. First, the ER model has a fixed number of nodes, while real networks grow: the WWW went from a single page in 1991 to over 10^12 documents. Second, in the ER model partners are chosen randomly, while in real networks new nodes prefer to link to well-connected nodes: we link to web pages we know, cite papers that are already highly cited, and casting directors choose well-known actors. This is preferential attachment.</p><p>The model starts with m0 nodes, each with at least one link. At every time step a new node with m &lt;= m0 links is added (growth), and each link connects to an existing node i with probability proportional to its degree (preferential attachment):</p><p><code>Pi(k_i) = k_i / sum_j k_j</code></p><p>After t steps the network has N = t + m0 nodes and m0 + mt links.</p><p>The degree dynamics can be computed in the continuum approximation. Node i gains links at a rate proportional to its own degree, and since the total degree of the network is about 2mt, the rate becomes <code>dk_i/dt = k_i / 2t</code>. Integrating, with the initial condition that node i arrives at time t_i with m links, gives:</p><p><code>k_i(t) = m (t / t_i)^(1/2)</code></p><p>All nodes follow the same sublinear law with dynamical exponent beta = 1/2, and older nodes have more links: hubs are hubs because they arrived first (first-mover advantage). The rate at which a node acquires links decreases with time.</p><p>From this law we can compute the fraction of nodes with degree smaller than k, which is the cumulative distribution, and its derivative gives the degree distribution: <code>p_k ~ 2m^2 k^(-3)</code>, a power law with gamma = 3. The exponent does not depend on m, and the distribution does not depend on t or N, which is consistent with real networks of very different age and size.</p><p><b>Формулы:</b></p><div class=\"tex\">\\[\\Pi(k_i) = \\frac{k_i}{\\sum_j k_j}, \\qquad \\frac{dk_i}{dt} = m\\,\\frac{k_i}{m(2t-1)} \\approx \\frac{k_i}{2t}\\]</div><div class=\"tex\">\\[k_i(t) = m\\left(\\frac{t}{t_i}\\right)^{\\beta}, \\quad \\beta = \\tfrac{1}{2}\\]</div><div class=\"tex\">\\[P(k) = 1 - \\left(\\frac{m}{k}\\right)^{1/\\beta} \\;\\Rightarrow\\; p_k = 2m^2 k^{-3}, \\quad \\gamma = \\frac{1}{\\beta} + 1 = 3\\]</div><div class=\"tex\">\\[\\text{exact: } p_k = \\frac{2m(m+1)}{k(k+1)(k+2)}\\]</div>", "ru": "<p><b>Как могут спросить:</b> Опишите модель Барабаши–Альберт. / Выведите динамику степени в модели BA. / Объясните рост и preferential attachment.</p><p><b>Скелет:</b> две скрытые предпосылки ER → определение (m₀, m, Π(k)) → динамика степени k_i(t) = m(t/t_i)^(1/2) → распределение степеней γ = 3 → следствия (преимущество первого, независимость от N и m).</p><p><b>Образцовый ответ (~300 слов):</b></p><p>Модель Барабаши–Альберт (1999) отвечает на вопрос, почему в случайных сетях нет хабов и степенных законов. Она указывает на две скрытые предпосылки модели Эрдёша–Реньи. Во-первых, в модели ER число узлов фиксировано, а реальные сети растут: WWW выросла от одной страницы в 1991 году до более чем 10¹² документов. Во-вторых, в модели ER партнёры выбираются случайно, а в реальных сетях новые узлы предпочитают соединяться с хорошо связанными: мы ставим ссылки на известные нам страницы, цитируем статьи, которые уже много цитируют, а режиссёры по кастингу выбирают известных актёров. Это preferential attachment (предпочтительное присоединение).</p><p>Модель начинается с m₀ узлов, у каждого хотя бы одна связь. На каждом шаге добавляется новый узел с m ≤ m₀ связями (рост), и каждая связь присоединяется к существующему узлу i с вероятностью, пропорциональной его степени (preferential attachment):</p><p><code>Pi(k_i) = k_i / sum_j k_j</code></p><p>Через t шагов в сети N = t + m₀ узлов и m₀ + mt связей.</p><p>Динамику степени можно вычислить в континуальном приближении. Узел i получает связи со скоростью, пропорциональной его собственной степени, а поскольку суммарная степень сети около 2mt, скорость становится <code>dk_i/dt = k_i / 2t</code>. Интегрируя с начальным условием, что узел i приходит в момент t_i с m связями, получаем:</p><p><code>k_i(t) = m (t / t_i)^(1/2)</code></p><p>Все узлы растут по одному и тому же сублинейному закону с динамическим показателем β = 1/2, и у более старых узлов больше связей: хабы — хабы потому, что пришли первыми (first-mover advantage). Скорость, с которой узел набирает связи, со временем падает.</p><p>Из этого закона можно вычислить долю узлов со степенью меньше k, то есть кумулятивное распределение, а его производная даёт распределение степеней: <code>p_k ~ 2m^2 k^(-3)</code>, степенной закон с γ = 3. Показатель не зависит от m, а распределение не зависит от t и N, что согласуется с реальными сетями очень разного возраста и размера.</p><p><b>Формулы:</b> см. оригинал выше.</p>"}, {"key": "E8", "title": "E8. Differences between the Erdős–Rényi and the Barabási–Albert models ⭐⭐ (спрашивали дважды)", "group": "Неделя 2 — scale-free и модели роста (E5–E10)", "groupShort": "Неделя 2", "html": "<p><b>Как могут спросить:</b> Discuss the differences existing between the Erdős–Rényi and the Barabási–Albert models. / Difference between BA model and ER model.</p><p><b>Скелет:</b> definitions side by side → static vs growing, random vs preferential → degree distribution Poisson vs power law, hubs → distances → robustness → common limitation (clustering) → conclusion.</p><p><b>Model answer (~300 words):</b></p><p>The Erdős–Rényi (ER) and the Barabási–Albert (BA) models are the two reference models of network science, but they rely on opposite assumptions. In the ER model, N labeled nodes are fixed from the start and every pair is connected independently with probability p. In the BA model the network grows: starting from m0 nodes, at each time step a new node arrives with m links, and each link attaches to an existing node i with probability <code>Pi(k_i) = k_i / sum_j k_j</code>. So the first difference is static versus growing networks, and the second is random versus preferential choice of partners.</p><p>These assumptions produce very different degree distributions. In the ER model the degree follows a binomial distribution, well approximated by a Poisson distribution peaked around the average degree <code>&lt;k&gt; = p(N-1)</code>, with standard deviation sqrt(&lt;k&gt;). Almost all nodes have similar degrees and hubs are practically forbidden. The BA model produces a power law, <code>p_k ~ k^(-3)</code>, with degree exponent gamma = 3 independent of m, N and t. Its long tail contains hubs, and the largest hub grows polynomially with the network size. In the BA model a node&#x27;s degree grows as <code>k_i(t) = m (t / t_i)^(1/2)</code>, so the oldest nodes become the hubs (first-mover advantage); in the ER model, which node is the biggest is decided purely by chance.</p><p>The structure affects other properties. Distances in ER networks scale as ln N / ln &lt;k&gt; (small world); in the BA model, with gamma = 3, they scale as ln N / ln ln N, slightly shorter thanks to the hubs. ER networks fragment after the random removal of a finite fraction of nodes, whereas scale-free networks tolerate random failures well but are vulnerable to attacks on their hubs.</p><p>Both models share a limitation: their clustering coefficient decreases with network size and is much lower than in real networks. Overall, the ER model is a mathematically clean benchmark, while the BA model explains the origin of the scale-free property observed in real networks.</p><p><b>Формулы:</b></p><div class=\"tex\">\\[\\text{ER: } \\langle k\\rangle = p(N-1), \\quad p_k \\approx e^{-\\langle k\\rangle}\\frac{\\langle k\\rangle^k}{k!}, \\quad \\langle d\\rangle \\approx \\frac{\\ln N}{\\ln\\langle k\\rangle}\\]</div><div class=\"tex\">\\[\\text{BA: } \\Pi(k_i) = \\frac{k_i}{\\sum_j k_j}, \\quad k_i(t) = m\\left(\\frac{t}{t_i}\\right)^{1/2}, \\quad p_k \\approx 2m^2 k^{-3}, \\quad \\langle d\\rangle \\sim \\frac{\\ln N}{\\ln\\ln N}\\]</div>", "ru": "<p><b>Как могут спросить:</b> Обсудите различия между моделями Эрдёша–Реньи и Барабаши–Альберт. / Чем модель BA отличается от модели ER.</p><p><b>Скелет:</b> определения рядом → статика против роста, случай против предпочтения → Пуассон против степенного закона, хабы → расстояния → устойчивость → общий недостаток (кластеризация) → вывод.</p><p><b>Образцовый ответ (~300 слов):</b></p><p>Модели Эрдёша–Реньи (ER) и Барабаши–Альберт (BA) — две эталонные модели науки о сетях, но они опираются на противоположные предпосылки. В модели ER N пронумерованных узлов заданы с самого начала, и каждая пара соединяется независимо с вероятностью p. В модели BA сеть растёт: начиная с m₀ узлов, на каждом шаге приходит новый узел с m связями, и каждая связь присоединяется к существующему узлу i с вероятностью <code>Pi(k_i) = k_i / sum_j k_j</code>. Итак, первое отличие — статические сети против растущих, второе — случайный выбор партнёров против предпочтительного.</p><p>Эти предпосылки дают очень разные распределения степеней. В модели ER степень подчиняется биномиальному распределению, хорошо приближаемому пуассоновским, с пиком около средней степени <code>&lt;k&gt; = p(N-1)</code> и стандартным отклонением sqrt(⟨k⟩). Почти у всех узлов похожие степени, а хабы практически запреще
