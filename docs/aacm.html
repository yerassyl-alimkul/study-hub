const WEEK_NAMES = {1: "Неделя 1 · dict и edgelist", 2: "Неделя 2 · метрики", 3: "Неделя 3 · обходы и пути"};
const ESSAY_NAMES = {E2: "E2 Giant component", E4: "E4 Watts–Strogatz", E7: "E7 Barabási–Albert", E8: "E8 ER vs BA", E11: "E11 BFS", R1: "R1 Robustness"};

const EXTRA = {"1.1": {"explain": "Граф хранится как словарь списков: ключ — узел, значение — список соседей. Нужно, чтобы <b>u<\/b> стал соседом <b>всех остальных<\/b> узлов в обе стороны. Главная ловушка: исходный граф может быть несимметричным (у 4 есть сосед 1, а у 1 нет соседа 4), поэтому нельзя полагаться на чужие списки — проверяем каждую сторону отдельно через <code>if ... not in<\/code>. Список «остальных» узлов собираем <b>до<\/b> добавления u, иначе u попадёт в собственный список. Сложность O(n·d) из-за проверки <code>in<\/code> по списку.", "sols": [{"title": "Вариант 1 · сначала собрать остальных", "note": "Шаг 1: собираем все узлы, кроме u. Шаг 2: создаём u, если его нет. Шаг 3: связываем в обе стороны без дубликатов.", "code": "def connect_node(graph, u):\n    # шаг 1: все узлы, кроме u\n    others = []\n    for v in graph:\n        if v != u:\n            others.append(v)\n\n    # шаг 2: создаём u, если его нет\n    if u not in graph:\n        graph[u] = []\n\n    # шаг 3: связываем u с каждым в обе стороны\n    for v in others:\n        if v not in graph[u]:\n            graph[u].append(v)\n        if u not in graph[v]:\n            graph[v].append(u)\n    return graph\n"}, {"title": "Вариант 2 · пропускаем u прямо в цикле", "note": "Отдельный список не строим: в цикле просто пропускаем сам u через continue. list(graph) делает копию ключей, потому что словарь меняется внутри цикла.", "code": "def connect_node(graph, u):\n    if u not in graph:\n        graph[u] = []\n\n    for v in list(graph):\n        if v == u:\n            continue          # сам с собой не соединяем\n        if v not in graph[u]:\n            graph[u].append(v)\n        if u not in graph[v]:\n            graph[v].append(u)\n    return graph\n"}, {"title": "Вариант 3 · две отдельные половины", "note": "Сначала заполняем список u, потом отдельным циклом добавляем u в чужие списки. Так проще проверить каждую сторону.", "code": "def connect_node(graph, u):\n    if u not in graph:\n        graph[u] = []\n\n    # половина 1: все узлы попадают в список u\n    for v in graph:\n        if v != u and v not in graph[u]:\n            graph[u].append(v)\n\n    # половина 2: u попадает в список каждого узла\n    for v in graph:\n        if v != u and u not in graph[v]:\n            graph[v].append(u)\n    return graph\n"}]}, "1.2": {"explain": "Граф — список рёбер (edgelist). Удалить узел значит выбросить <b>все рёбра, где он встречается с любой стороны<\/b>: и (u, x), и (x, u). Остальные рёбра должны остаться в исходном порядке, поэтому просто проходим по списку и копируем подходящие рёбра, ничего не сортируя. Если узла нет, ничего не выкинется. Сложность O(m): один проход по рёбрам.", "sols": [{"title": "Вариант 1 · копируем подходящие рёбра", "note": "Ребро оставляем, только если u не равен ни одному концу.", "code": "def delete_node(graph, u):\n    result = []\n    for a, b in graph:\n        if a != u and b != u:\n            result.append((a, b))\n    return result\n"}, {"title": "Вариант 2 · проверка «u в ребре»", "note": "Ребро — это кортеж из двух узлов, поэтому можно спросить: «есть ли u в этом ребре?»", "code": "def delete_node(graph, u):\n    result = []\n    for edge in graph:\n        if u in edge:\n            continue          # ребро касается u — пропускаем\n        result.append(edge)\n    return result\n"}, {"title": "Вариант 3 · явный флаг", "note": "Самый подробный вариант: отдельная переменная говорит, оставляем ли ребро.", "code": "def delete_node(graph, u):\n    result = []\n    for edge in graph:\n        a = edge[0]\n        b = edge[1]\n        keep = True\n        if a == u:\n            keep = False\n        if b == u:\n            keep = False\n        if keep:\n            result.append(edge)\n    return result\n"}]}, "1.3": {"explain": "Каждое ребро (u, v) добавляет <b>1 к степени обоих концов<\/b>. Поэтому идём по рёбрам и увеличиваем счётчики в словаре. <code>deg.get(x, 0) + 1<\/code> берёт текущее значение или 0, если узла ещё нет — так не нужен отдельный <code>if<\/code>. Для пустого списка рёбер вернётся пустой словарь. Сложность O(m).", "sols": [{"title": "Вариант 1 · dict.get", "note": "get(u, 0) возвращает текущую степень или 0, если узла ещё нет.", "code": "def degree(graph):\n    deg = {}\n    for u, v in graph:\n        deg[u] = deg.get(u, 0) + 1\n        deg[v] = deg.get(v, 0) + 1\n    return deg\n"}, {"title": "Вариант 2 · явная проверка", "note": "То же через if: если узла нет в словаре, сначала кладём 0.", "code": "def degree(graph):\n    deg = {}\n    for u, v in graph:\n        if u not in deg:\n            deg[u] = 0\n        if v not in deg:\n            deg[v] = 0\n        deg[u] = deg[u] + 1\n        deg[v] = deg[v] + 1\n    return deg\n"}, {"title": "Вариант 3 · два прохода", "note": "Первый проход создаёт все узлы со степенью 0, второй считает. Длиннее, зато очень наглядно.", "code": "def degree(graph):\n    deg = {}\n    # проход 1: все узлы со степенью 0\n    for u, v in graph:\n        deg[u] = 0\n        deg[v] = 0\n    # проход 2: каждое ребро +1 обоим концам\n    for u, v in graph:\n        deg[u] += 1\n        deg[v] += 1\n    return deg\n"}]}, "1.4": {"explain": "Добавить неориентированное ребро значит положить v в список u <b>и<\/b> u в список v. Если узла ещё нет, его надо создать. Проверка <code>if v not in graph[u]<\/code> защищает от дубликатов, если ребро уже есть (в том числе записанное в обратном порядке). Сложность O(deg) из-за проверки <code>in<\/code> по списку.", "sols": [{"title": "Вариант 1 · setdefault", "note": "setdefault(u, []) создаёт пустой список для u, только если u ещё нет.", "code": "def add_edge(graph, u, v):\n    graph.setdefault(u, [])\n    graph.setdefault(v, [])\n    if v not in graph[u]:\n        graph[u].append(v)\n    if u not in graph[v]:\n        graph[v].append(u)\n    return graph\n"}, {"title": "Вариант 2 · явные if", "note": "Без setdefault: создаём узел вручную, если его нет.", "code": "def add_edge(graph, u, v):\n    if u not in graph:\n        graph[u] = []\n    if v not in graph:\n        graph[v] = []\n    if v not in graph[u]:\n        graph[u].append(v)\n    if u not in graph[v]:\n        graph[v].append(u)\n    return graph\n"}, {"title": "Вариант 3 · цикл по двум направлениям", "note": "Направления (u→v) и (v→u) обрабатываем одним и тем же кодом.", "code": "def add_edge(graph, u, v):\n    pairs = [(u, v), (v, u)]\n    for pair in pairs:\n        a = pair[0]\n        b = pair[1]\n        if a not in graph:\n            graph[a] = []\n        if b not in graph[a]:\n            graph[a].append(b)\n    return graph\n"}]}, "1.5": {"explain": "Три узла образуют треугольник, если есть <b>все три ребра<\/b>: u–v, v–z, u–z. В edgelist ребро может быть записано как (a, b) или (b, a), поэтому кладём в множество оба направления. Построение множества стоит O(m), каждая проверка <code>in<\/code> по множеству — O(1). Без множества пришлось бы сканировать список рёбер для каждой проверки (тоже O(m), но медленнее). Это и надо было обсудить на экзамене.", "sols": [{"title": "Вариант 1 · множество из двух направлений", "note": "Каждое ребро кладём дважды: (a, b) и (b, a). Потом три проверки.", "code": "def triangle(graph, u, v, z):\n    edges = set()\n    for a, b in graph:\n        edges.add((a, b))\n        edges.add((b, a))\n    return (u, v) in edges and (v, z) in edges and (u, z) in edges\n"}, {"title": "Вариант 2 · проверки по отдельности", "note": "То же множество, но три проверки записаны отдельными if — легче отлаживать.", "code": "def triangle(graph, u, v, z):\n    edges = set()\n    for a, b in graph:\n        edges.add((a, b))\n        edges.add((b, a))\n\n    if (u, v) not in edges:\n        return False\n    if (v, z) not in edges:\n        return False\n    if (u, z) not in edges:\n        return False\n    return True\n"}, {"title": "Вариант 3 · без множества", "note": "Вспомогательная функция ищет ребро в списке перебором. O(m) на каждую проверку, зато ничего не строим.", "code": "def triangle(graph, u, v, z):\n    def has_edge(a, b):\n        for x, y in graph:\n            if x == a and y == b:\n                return True\n            if x == b and y == a:\n                return True\n        return False\n\n    return has_edge(u, v) and has_edge(v, z) and has_edge(u, z)\n"}]}, "1.6": {"explain": "Нужно удалить ключ u <b>и<\/b> убрать u из всех списков соседей. Ловушка: списки могут быть несимметричными, поэтому чистим <b>все<\/b> списки, а не только списки соседей u. Если u нет в графе, <code>del<\/code> вызвал бы ошибку — поэтому сначала проверяем <code>if u in graph<\/code>. Сложность O(n + m).", "sols": [{"title": "Вариант 1 · новый список для каждого узла", "note": "Удаляем ключ, затем для каждого узла собираем новый список соседей без u.", "code": "def remove_node(graph, u):\n    if u in graph:\n        del graph[u]\n\n    for v in graph:\n        new_list = []\n        for w in graph[v]:\n            if w != u:\n                new_list.append(w)\n        graph[v] = new_list\n    return graph\n"}, {"title": "Вариант 2 · remove в цикле while", "note": "pop(u, None) не падает, если ключа нет. while удаляет u, пока он встречается в списке.", "code": "def remove_node(graph, u):\n    graph.pop(u, None)\n    for v in graph:\n        while u in graph[v]:\n            graph[v].remove(u)\n    return graph\n"}, {"title": "Вариант 3 · собрать новый словарь", "note": "Строим новый граф с нуля, просто не копируя u. Исходный граф не меняется.", "code": "def remove_node(graph, u):\n    new_graph = {}\n    for v in graph:\n        if v == u:\n            continue\n        new_graph[v] = []\n        for w in graph[v]:\n            if w != u:\n                new_graph[v].append(w)\n    return new_graph\n"}]}, "1.7": {"explain": "Каждое ребро (u, v) кладёт v в список u и u в список v. <code>graph.setdefault(u, []).append(v)<\/code> одним выражением создаёт список, если его нет, и добавляет соседа. Порядок соседей в тесте не важен. Сложность O(m).", "sols": [{"title": "Вариант 1 · setdefault", "note": "Создаём и дополняем список одной строкой.", "code": "def edgelist_to_adj(edges):\n    graph = {}\n    for u, v in edges:\n        graph.setdefault(u, []).append(v)\n        graph.setdefault(v, []).append(u)\n    return graph\n"}, {"title": "Вариант 2 · явные if", "note": "Самый «школьный» вариант без вспомогательных методов.", "code": "def edgelist_to_adj(edges):\n    graph = {}\n    for u, v in edges:\n        if u not in graph:\n            graph[u] = []\n        if v not in graph:\n            graph[v] = []\n        graph[u].append(v)\n        graph[v].append(u)\n    return graph\n"}, {"title": "Вариант 3 · defaultdict", "note": "defaultdict(list) сам создаёт пустой список для нового ключа; в конце превращаем в обычный dict.", "code": "from collections import defaultdict\n\ndef edgelist_to_adj(edges):\n    graph = defaultdict(list)\n    for u, v in edges:\n        graph[u].append(v)\n        graph[v].append(u)\n    return dict(graph)\n"}]}, "1.8": {"explain": "В симметричном словаре каждое ребро записано дважды: v в списке u и u в списке v. Чтобы взять ребро <b>ровно один раз<\/b>, берём его только когда <code>u < v<\/code>. В конце сортируем, потому что результат должен быть отсортирован. Сложность O(m log m) из-за сортировки.", "sols": [{"title": "Вариант 1 · условие u < v", "note": "Каждое ребро попадает один раз, затем сортируем.", "code": "def adj_to_edgelist(graph):\n    edges = []\n    for u in graph:\n        for v in graph[u]:\n            if u < v:\n                edges.append((u, v))\n    return sorted(edges)\n"}, {"title": "Вариант 2 · через множество пар", "note": "Записываем пару как (меньший, больший) и кладём в множество — дубликаты исчезнут сами.", "code": "def adj_to_edgelist(graph):\n    edges = set()\n    for u in graph:\n        for v in graph[u]:\n            if u < v:\n                edges.add((u, v))\n            else:\n                edges.add((v, u))\n    return sorted(edges)\n"}, {"title": "Вариант 3 · проверка «уже добавлено»", "note": "Без условия u < v: перед добавлением проверяем, нет ли уже этого ребра в любом порядке.", "code": "def adj_to_edgelist(graph):\n    edges = []\n    for u in graph:\n        for v in graph[u]:\n            if (u, v) in edges or (v, u) in edges:\n                continue\n            if u < v:\n                edges.append((u, v))\n            else:\n                edges.append((v, u))\n    edges.sort()\n    return edges\n"}]}, "2.1": {"explain": "⟨k⟩ = 2L/N. В словаре списков сумма длин всех списков — это сумма степеней, то есть 2L. Делим на N = len(graph). Отдельно обрабатываем пустой граф, иначе деление на ноль. Сложность O(n).", "sols": [{"title": "Вариант 1 · сумма степеней / N", "note": "Считаем сумму длин всех списков (это 2L) и делим на число узлов.", "code": "def average_degree(graph):\n    if len(graph) == 0:\n        return 0\n    total = 0\n    for v in graph:\n        total = total + len(graph[v])\n    return total / len(graph)\n"}, {"title": "Вариант 2 · через L явно", "note": "Сначала L = (сумма степеней) / 2, потом формула 2L/N из лекций.", "code": "def average_degree(graph):\n    n = len(graph)\n    if n == 0:\n        return 0\n    degree_sum = 0\n    for v in graph:\n        degree_sum += len(graph[v])\n    L = degree_sum / 2\n    return 2 * L / n\n"}, {"title": "Вариант 3 · список степеней", "note": "Сначала выписываем степени в список, потом считаем их среднее.", "code": "def average_degree(graph):\n    degrees = []\n    for v in graph:\n        degrees.append(len(graph[v]))\n    if len(degrees) == 0:\n        return 0\n    return sum(degrees) / len(degrees)\n"}]}, "2.2": {"explain": "p_k = N_k / N: доля узлов со степенью k. Сначала считаем N_k — сколько узлов имеют каждую степень, потом делим на N. В словарь попадают только встречающиеся степени. Сложность O(n).", "sols": [{"title": "Вариант 1 · счётчик, потом деление", "note": "Шаг 1: считаем N_k. Шаг 2: делим каждый счётчик на N.", "code": "def degree_distribution(graph):\n    n = len(graph)\n    counts = {}\n    for v in graph:\n        k = len(graph[v])\n        counts[k] = counts.get(k, 0) + 1\n\n    result = {}\n    for k in counts:\n        result[k] = counts[k] / n\n    return result\n"}, {"title": "Вариант 2 · явные if", "note": "Тот же подсчёт, но без get.", "code": "def degree_distribution(graph):\n    n = len(graph)\n    counts = {}\n    for v in graph:\n        k = len(graph[v])\n        if k not in counts:\n            counts[k] = 0\n        counts[k] += 1\n\n    for k in counts:\n        counts[k] = counts[k] / n\n    return counts\n"}, {"title": "Вариант 3 · сразу доли", "note": "Каждый узел добавляет 1/N к своей степени — получаем доли без отдельного деления.", "code": "def degree_distribution(graph):\n    n = len(graph)\n    p = {}\n    for v in graph:\n        k = len(graph[v])\n        if k not in p:\n            p[k] = 0\n        p[k] = p[k] + 1 / n\n    return p\n"}]}, "2.3": {"explain": "Изолированный узел — узел со степенью 0, то есть с пустым списком соседей. Собираем такие узлы и сортируем (тест требует отсортированный список). Сложность O(n log n) из-за сортировки.", "sols": [{"title": "Вариант 1 · проверка длины", "note": "Узел изолирован, если длина его списка равна 0.", "code": "def isolated_nodes(graph):\n    result = []\n    for v in graph:\n        if len(graph[v]) == 0:\n            result.append(v)\n    result.sort()\n    return result\n"}, {"title": "Вариант 2 · пустой список = False", "note": "В Python пустой список считается ложным, поэтому можно писать if not graph[v].", "code": "def isolated_nodes(graph):\n    result = []\n    for v in graph:\n        if not graph[v]:\n            result.append(v)\n    return sorted(result)\n"}, {"title": "Вариант 3 · через степени", "note": "Сначала считаем степени, потом выбираем узлы со степенью 0.", "code": "def isolated_nodes(graph):\n    deg = {}\n    for v in graph:\n        deg[v] = len(graph[v])\n\n    result = []\n    for v in deg:\n        if deg[v] == 0:\n            result.append(v)\n    return sorted(result)\n"}]}, "2.4": {"explain": "C_u = 2·L_u / (k_u(k_u − 1)), где L_u — число связей <b>между соседями<\/b> u. Перебираем все пары соседей (i < j, чтобы каждая пара один раз) и считаем, сколько из них связаны. Если соседей меньше двух, пар нет и по условию возвращаем 0 (иначе деление на ноль). Сложность O(k²·d).", "sols": [{"title": "Вариант 1 · пары по индексам", "note": "Двойной цикл: i от 0, j от i+1 — каждая пара соседей ровно один раз.", "code": "def clustering(graph, u):\n    nb = graph[u]\n    k = len(nb)\n    if k < 2:\n        return 0\n    links = 0\n    for i in range(k):\n        for j in range(i + 1, k):\n            if nb[j] in graph[nb[i]]:\n                links += 1\n    return 2 * links / (k * (k - 1))\n"}, {"title": "Вариант 2 · все пары, потом делим на 2", "note": "Перебираем все упорядоченные пары (a, b) с a ≠ b; каждая связь посчитается дважды, поэтому делим на 2.", "code": "def clustering(graph, u):\n    nb = graph[u]\n    k = len(nb)\n    if k < 2:\n        return 0\n    count = 0\n    for a in nb:\n        for b in nb:\n            if a != b and b in graph[a]:\n                count += 1\n    links = count / 2\n    return 2 * links / (k * (k - 1))\n"}, {"title": "Вариант 3 · сначала выписать пары", "note": "Отдельным шагом собираем список пар соседей, потом проверяем каждую. Длиннее, но видно, что происходит.", "code": "def clustering(graph, u):\n    nb = graph[u]\n    k = len(nb)\n    if k < 2:\n        return 0\n\n    pairs = []\n    for i in range(k):\n        for j in range(i + 1, k):\n            pairs.append((nb[i], nb[j]))\n\n    links = 0\n    for a, b in pairs:\n        if b in graph[a]:\n            links += 1\n\n    possible = k * (k - 1) / 2\n    return links / possible\n"}]}, "2.5": {"explain": "Общие соседи — те, кто есть и в списке u, и в списке v. Короче всего через пересечение множеств (оператор <code>&<\/code>), но можно и обычным циклом. Результат сортируем.", "sols": [{"title": "Вариант 1 · пересечение множеств", "note": "set(...) & set(...) оставляет только общие элементы. Цикла нет вообще.", "code": "def common_neighbors(graph, u, v):\n    a = set(graph[u])\n    b = set(graph[v])\n    common = a & b\n    return sorted(common)\n"}, {"title": "Вариант 2 · цикл с проверкой", "note": "Идём по соседям u и оставляем тех, кто есть и у v.", "code": "def common_neighbors(graph, u, v):\n    result = []\n    for w in graph[u]:\n        if w in graph[v] and w not in result:\n            result.append(w)\n    result.sort()\n    return result\n"}, {"title": "Вариант 3 · двойной цикл", "note": "Сравниваем каждого соседа u с каждым соседом v.", "code": "def common_neighbors(graph, u, v):\n    result = []\n    for a in graph[u]:\n        for b in graph[v]:\n            if a == b and a not in result:\n                result.append(a)\n    return sorted(result)\n"}]}, "2.6": {"explain": "Коэффициент Жаккара = |пересечение| / |объединение| соседей. Это нормированная версия общих соседей: значение от 0 до 1. Если у обоих узлов нет соседей, объединение пусто — по условию возвращаем 0, иначе деление на ноль (частая потеря баллов).", "sols": [{"title": "Вариант 1 · множества", "note": "Пересечение через &, объединение через |.", "code": "def jaccard(graph, u, v):\n    a = set(graph[u])\n    b = set(graph[v])\n    union = a | b\n    if len(union) == 0:\n        return 0\n    inter = a & b\n    return len(inter) / len(union)\n"}, {"title": "Вариант 2 · |A ∪ B| = |A| + |B| − |A ∩ B|", "note": "Объединение отдельно не строим, считаем по формуле.", "code": "def jaccard(graph, u, v):\n    a = set(graph[u])\n    b = set(graph[v])\n    inter = len(a & b)\n    union = len(a) + len(b) - inter\n    if union == 0:\n        return 0\n    return inter / union\n"}, {"title": "Вариант 3 · циклами без операторов множеств", "note": "Пересечение и объединение собираем вручную в списки.", "code": "def jaccard(graph, u, v):\n    union = []\n    for w in graph[u]:\n        if w not in union:\n            union.append(w)\n    for w in graph[v]:\n        if w not in union:\n            union.append(w)\n\n    inter = []\n    for w in union:\n        if w in graph[u] and w in graph[v]:\n            inter.append(w)\n\n    if len(union) == 0:\n        return 0\n    return len(inter) / len(union)\n"}]}, "2.7": {"explain": "⟨C⟩ — среднее локальных коэффициентов по <b>всем<\/b> N узлам, причём узлы со степенью меньше 2 дают C_i = 0, но всё равно входят в знаменатель N. Удобно написать вспомогательную функцию для C_i (как в 2.4) и усреднить. Пустой граф → 0.", "sols": [{"title": "Вариант 1 · всё в одной функции", "note": "Для каждого узла считаем L_i двойным циклом и прибавляем C_i к сумме.", "code": "def average_clustering(graph):\n    if len(graph) == 0:\n        return 0\n    total = 0\n    for u in graph:\n        nb = graph[u]\n        k = len(nb)\n        if k < 2:\n            continue          # C_i = 0, к сумме ничего не добавляем\n        links = 0\n        for i in range(k):\n            for j in range(i + 1, k):\n                if nb[j] in graph[nb[i]]:\n                    links += 1\n        total += 2 * links / (k * (k - 1))\n    return total / len(graph)\n"}, {"title": "Вариант 2 · вспомогательная функция", "note": "Отдельная функция local(u) считает C_i — код читается как формула ⟨C⟩ = сумма C_i / N.", "code": "def average_clustering(graph):\n    def local(u):\n        nb = graph[u]\n        k = len(nb)\n        if k < 2:\n            return 0\n        links = 0\n        for i in range(k):\n            for j in range(i + 1, k):\n                if nb[j] in graph[nb[i]]:\n                    links += 1\n        return 2 * links / (k * (k - 1))\n\n    if len(graph) == 0:\n        return 0\n    total = 0\n    for u in graph:\n        total += local(u)\n    return total / len(graph)\n"}, {"title": "Вариант 3 · список всех C_i", "note": "Сначала выписываем все C_i в список, потом берём среднее.", "code": "def average_clustering(graph):\n    values = []\n    for u in graph:\n        nb = graph[u]\n        k = len(nb)\n        if k < 2:\n            values.append(0)\n            continue\n        links = 0\n        for a in nb:\n            for b in nb:\n                if a != b and b in graph[a]:\n                    links += 1\n        links = links / 2      # каждая связь посчитана дважды\n        values.append(2 * links / (k * (k - 1)))\n    if len(values) == 0:\n        return 0\n    return sum(values) / len(values)\n"}]}, "3.1": {"explain": "BFS идёт <b>по уровням<\/b>: очередь FIFO гарантирует, что сначала обработаются все узлы уровня 1, потом уровня 2 и т.д. Узел помечаем посещённым <b>в момент добавления в очередь<\/b>, иначе он может попасть в очередь дважды и порядок испортится. Соседей перебираем в порядке списка. <code>pop(0)<\/code> у списка стоит O(n); с <code>collections.deque<\/code> и <code>popleft()<\/code> — O(1), итого O(n + m).", "sols": [{"title": "Вариант 1 · список как очередь", "note": "pop(0) берёт первый элемент — это и есть FIFO.", "code": "def bfs(graph, s):\n    visited = [s]\n    seen = {s}\n    queue = [s]\n    while queue:\n        u = queue.pop(0)\n        for v in graph[u]:\n            if v not in seen:\n                seen.add(v)\n                visited.append(v)\n                queue.append(v)\n    return visited\n"}, {"title": "Вариант 2 · collections.deque", "note": "deque.popleft() работает за O(1), поэтому весь BFS честно O(n + m).", "code": "from collections import deque\n\ndef bfs(graph, s):\n    order = [s]\n    seen = {s}\n    q = deque([s])\n    while q:\n        u = q.popleft()\n        for v in graph[u]:\n            if v not in seen:\n                seen.add(v)\n                order.append(v)\n                q.append(v)\n    return order\n"}, {"title": "Вариант 3 · по уровням, как в слайдах", "note": "Храним текущий уровень и строим следующий — точь-в-точь алгоритм из лекции с level / next_level.", "code": "def bfs(graph, s):\n    order = [s]\n    seen = {s}\n    level = [s]\n    while level:\n        next_level = []\n        for u in level:\n            for v in graph[u]:\n                if v not in seen:\n                    seen.add(v)\n                    order.append(v)\n                    next_level.append(v)\n        level = next_level\n    return order\n"}]}, "3.2": {"explain": "DFS из слайдов рекурсивный: заходим в узел, записываем его, и для каждого соседа по порядку, если он ещё не посещён, сразу <b>рекурсивно<\/b> уходим в него. Порядок важен: итеративная версия со стеком, которая кладёт всех соседей сразу, даёт <b>другой<\/b> порядок, и тесты не пройдут. <code>v not in order<\/code> по списку стоит O(n); с отдельным множеством visited — O(1).", "sols": [{"title": "Вариант 1 · вложенная функция", "note": "Вспомогательная visit(u) и общий список order.", "code": "def dfs(graph, s):\n    order = []\n    def visit(u):\n        order.append(u)\n        for v in graph[u]:\n            if v not in order:\n                visit(v)\n    visit(s)\n    return order\n"}, {"title": "Вариант 2 · множество visited", "note": "Отдельное множество ускоряет проверку «уже был» до O(1); порядок тот же.", "code": "def dfs(graph, s):\n    order = []\n    visited = set()\n    def visit(u):\n        visited.add(u)\n        order.append(u)\n        for v in graph[u]:\n            if v not in visited:\n                visit(v)\n    visit(s)\n    return order\n"}, {"title": "Вариант 3 · итеративно со стеком", "note": "Чтобы получить тот же порядок, что у рекурсии, кладём соседей в стек в <b>обратном<\/b> порядке и отмечаем узел при снятии со стека.", "code": "def dfs(graph, s):\n    order = []\n    visited = set()\n    stack = [s]\n    while stack:\n        u = stack.pop()\n        if u in visited:\n            continue\n        visited.add(u)\n        order.append(u)\n        for v in reversed(graph[u]):\n            if v not in visited:\n                stack.append(v)\n    return order\n"}]}, "3.3": {"explain": "Это BFS, где вместо множества seen используется словарь dist: если узел в словаре, он уже найден. При первом обнаружении v ставим <code>dist[v] = dist[u] + 1<\/code> — по свойству BFS это и есть кратчайшее расстояние в рёбрах. Недостижимые узлы просто не попадут в словарь. Сложность O(n + m).", "sols": [{"title": "Вариант 1 · очередь + dist", "note": "dist одновременно хранит расстояния и служит отметкой «посещён».", "code": "def bfs_distances(graph, s):\n    dist = {s: 0}\n    queue = [s]\n    while queue:\n        u = queue.pop(0)\n        for v in graph[u]:\n            if v not in dist:\n                dist[v] = dist[u] + 1\n                queue.append(v)\n    return dist\n"}, {"title": "Вариант 2 · deque", "note": "То же с быстрой очередью.", "code": "from collections import deque\n\ndef bfs_distances(graph, s):\n    dist = {s: 0}\n    q = deque([s])\n    while q:\n        u = q.popleft()\n        for v in graph[u]:\n            if v not in dist:\n                dist[v] = dist[u] + 1\n                q.append(v)\n    return dist\n"}, {"title": "Вариант 3 · по уровням", "note": "Номер текущего уровня и есть расстояние для всех узлов на нём.", "code": "def bfs_distances(graph, s):\n    dist = {s: 0}\n    level = [s]\n    d = 0\n    while level:\n        d += 1\n        next_level = []\n        for u in level:\n            for v in graph[u]:\n                if v not in dist:\n                    dist[v] = d\n                    next_level.append(v)\n        level = next_level\n    return dist\n"}]}, "3.4": {"explain": "Как DFS_complete в слайдах: идём по всем узлам, и если узел ещё не посещён — это <b>новая компонента<\/b>: увеличиваем счётчик и обходом помечаем всю её. Изолированный узел — отдельная компонента (обход сразу закончится). Тип обхода не важен (стек, очередь, рекурсия). Сложность O(n + m).", "sols": [{"title": "Вариант 1 · стек", "note": "Итеративный DFS из каждого непосещённого узла.", "code": "def count_components(graph):\n    seen = set()\n    count = 0\n    for s in graph:\n        if s in seen:\n            continue\n        count += 1\n        stack = [s]\n        seen.add(s)\n        while stack:\n            u = stack.pop()\n            for v in graph[u]:\n                if v not in seen:\n                    seen.add(v)\n                    stack.append(v)\n    return count\n"}, {"title": "Вариант 2 · рекурсивный DFS", "note": "Рекурсия помечает всю компоненту; число запусков = число компонент.", "code": "def count_components(graph):\n    seen = set()\n\n    def visit(u):\n        seen.add(u)\n        for v in graph[u]:\n            if v not in seen:\n                visit(v)\n\n    count = 0\n    for s in graph:\n        if s not in seen:\n            count += 1\n            visit(s)\n    return count\n"}, {"title": "Вариант 3 · BFS с очередью", "note": "То же, но обход очередью. Результат не зависит от вида обхода.", "code": "def count_components(graph):\n    seen = set()\n    count = 0\n    for s in graph:\n        if s in seen:\n            continue\n        count += 1\n        queue = [s]\n        seen.add(s)\n        while queue:\n            u = queue.pop(0)\n            for v in graph[u]:\n                if v not in seen:\n                    seen.add(v)\n                    queue.append(v)\n    return count\n"}]}, "3.5": {"explain": "Граф связный, если обход из <b>любого<\/b> узла доходит до всех узлов. Берём первый узел, обходим, и сравниваем число посещённых с числом узлов: <code>len(seen) == len(graph)<\/code> — ровно то, что сказано в слайдах про DFS. Граф из одного узла связный. Сложность O(n + m).", "sols": [{"title": "Вариант 1 · стек", "note": "next(iter(graph)) берёт первый ключ словаря. Обходим и сравниваем размеры.", "code": "def is_connected(graph):\n    start = next(iter(graph))\n    seen = {start}\n    stack = [start]\n    while stack:\n        u = stack.pop()\n        for v in graph[u]:\n            if v not in seen:\n                seen.add(v)\n                stack.append(v)\n    return len(seen) == len(graph)\n"}, {"title": "Вариант 2 · первый узел через цикл", "note": "Если next(iter(...)) непонятен: берём первый узел обычным for с break. Обход очередью.", "code": "def is_connected(graph):\n    for node in graph:\n        start = node\n        break\n\n    seen = {start}\n    queue = [start]\n    while queue:\n        u = queue.pop(0)\n        for v in graph[u]:\n            if v not in seen:\n                seen.add(v)\n                queue.append(v)\n\n    if len(seen) == len(graph):\n        return True\n    return False\n"}, {"title": "Вариант 3 · через число компонент", "note": "Связный ⇔ ровно одна компонента связности (идея из 3.4).", "code": "def is_connected(graph):\n    seen = set()\n    comps = 0\n    for s in graph:\n        if s in seen:\n            continue\n        comps += 1\n        stack = [s]\n        seen.add(s)\n        while stack:\n            u = stack.pop()\n            for v in graph[u]:\n                if v not in seen:\n                    seen.add(v)\n                    stack.append(v)\n    return comps == 1\n"}]}, "3.6": {"explain": "BFS находит кратчайшие пути по числу рёбер. Храним словарь <b>parent<\/b> (в слайдах discovered): для каждого найденного узла — откуда мы в него пришли. Когда дошли до t, идём назад по parent от t к s и разворачиваем список. Если t так и не найден, возвращаем пустой список. Случай s == t даёт путь [s]. Сложность O(n + m).", "sols": [{"title": "Вариант 1 · parent + восстановление пути", "note": "Ранний выход, когда достали t из очереди, затем шагаем назад по parent.", "code": "def shortest_path(graph, s, t):\n    parent = {s: None}\n    queue = [s]\n    while queue:\n        u = queue.pop(0)\n        if u == t:\n            break\n        for v in graph[u]:\n            if v not in parent:\n                parent[v] = u\n                queue.append(v)\n\n    if t not in parent:\n        return []\n\n    path = []\n    walk = t\n    while walk is not None:\n        path.append(walk)\n        walk = parent[walk]\n    path.reverse()\n    return path\n"}, {"title": "Вариант 2 · путь целиком в очереди", "note": "В очереди лежат сами пути; проще писать, но тратит больше памяти.", "code": "def shortest_path(graph, s, t):\n    queue = [[s]]\n    seen = {s}\n    while queue:\n        path = queue.pop(0)\n        u = path[-1]\n        if u == t:\n            return path\n        for v in graph[u]:\n            if v not in seen:\n                seen.add(v)\n                new_path = path + [v]\n                queue.append(new_path)\n    return []\n"}, {"title": "Вариант 3 · расстояния, потом шаги назад", "note": "Сначала BFS-расстояния, потом от t шагаем к соседу с расстоянием на 1 меньше.", "code": "def shortest_path(graph, s, t):\n    dist = {s: 0}\n    queue = [s]\n    while queue:\n        u = queue.pop(0)\n        for v in graph[u]:\n            if v not in dist:\n                dist[v] = dist[u] + 1\n                queue.append(v)\n\n    if t not in dist:\n        return []\n\n    path = [t]\n    current = t\n    while current != s:\n        for w in graph:\n            if w in dist and dist[w] == dist[current] - 1 and current in graph[w]:\n                current = w\n                break\n        path.append(current)\n    path.reverse()\n    return path\n"}]}, "3.7": {"explain": "Жадный алгоритм с «облаком»: D[s] = 0, остальные ∞. Каждый раз берём вершину <b>вне облака с минимальной D<\/b>, кладём в облако и делаем <b>relaxation<\/b> её рёбер: если D[u] + w < D[v], обновляем D[v]. Если минимум равен ∞, остальные вершины недостижимы — останавливаемся. В ответ кладём только достижимые. Поиск минимума перебором даёт O(n²); с кучей heapq — O((n + m) log n), как в лекции. Работает только с неотрицательными весами.", "sols": [{"title": "Вариант 1 · минимум перебором", "note": "Самый прямой перевод «облака» из лекции в код.", "code": "def dijkstra(graph, s):\n    INF = float('inf')\n    D = {}\n    for v in graph:\n        D[v] = INF\n    D[s] = 0\n    cloud = set()\n\n    while len(cloud) < len(graph):\n        # ищем вершину вне облака с минимальной D\n        u = None\n        for v in graph:\n            if v not in cloud:\n                if u is None or D[v] < D[u]:\n                    u = v\n        if D[u] == INF:\n            break                 # остальные недостижимы\n        cloud.add(u)\n\n        # relaxation рёбер u\n        for v in graph[u]:\n            w = graph[u][v]\n            if D[u] + w < D[v]:\n                D[v] = D[u] + w\n\n    result = {}\n    for v in D:\n        if D[v] != INF:\n            result[v] = D[v]\n    return result\n"}, {"title": "Вариант 2 · heapq (очередь с приоритетом)", "note": "В куче лежат пары (расстояние, вершина). heappop всегда достаёт пару с наименьшим расстоянием. Устаревшие записи пропускаем.", "code": "import heapq\n\ndef dijkstra(graph, s):\n    D = {s: 0}\n    done = set()\n    heap = [(0, s)]\n    while heap:\n        d, u = heapq.heappop(heap)\n        if u in done:\n            continue          # устаревшая запись\n        done.add(u)\n        for v in graph[u]:\n            w = graph[u][v]\n            if v not in D or d + w < D[v]:\n                D[v] = d + w\n                heapq.heappush(heap, (D[v], v))\n    return D\n"}, {"title": "Вариант 3 · множество «ещё не обработаны»", "note": "Вместо облака храним множество необработанных вершин и удаляем из него выбранную.", "code": "def dijkstra(graph, s):\n    INF = float('inf')\n    D = {}\n    for v in graph:\n        D[v] = INF\n    D[s] = 0\n\n    todo = set()\n    for v in graph:\n        todo.add(v)\n\n    while len(todo) > 0:\n        u = None\n        for v in todo:\n            if u is None or D[v] < D[u]:\n                u = v\n        if D[u] == INF:\n            break\n        todo.remove(u)\n        for v in graph[u]:\n            if D[u] + graph[u][v] < D[v]:\n                D[v] = D[u] + graph[u][v]\n\n    result = {}\n    for v in D:\n        if D[v] < INF:\n            result[v] = D[v]\n    return result\n"}]}, "M1": {"explain": "Узлы на расстоянии ровно 2 — это соседи соседей, которые <b>не являются<\/b> ни самим u, ни его прямыми соседями (у тех расстояние 0 или 1). Собираем их во множество (чтобы не было повторов) и сортируем.", "sols": [{"title": "Вариант 1 · соседи соседей минус первый круг", "note": "Проверяем w != u и w not in first.", "code": "def neighbors_at_distance_2(graph, u):\n    first = set(graph[u])\n    result = set()\n    for v in first:\n        for w in graph[v]:\n            if w != u and w not in first:\n                result.add(w)\n    return sorted(result)\n"}, {"title": "Вариант 2 · через BFS-расстояния", "note": "Считаем BFS-расстояния (не дальше 2) и берём узлы с расстоянием 2 — легко обобщить на любое d.", "code": "def neighbors_at_distance_2(graph, u):\n    dist = {u: 0}\n    queue = [u]\n    while queue:\n        x = queue.pop(0)\n        if dist[x] == 2:\n            continue\n        for y in graph[x]:\n            if y not in dist:\n                dist[y] = dist[x] + 1\n                queue.append(y)\n\n    result = []\n    for v in dist:\n        if dist[v] == 2:\n            result.append(v)\n    return sorted(result)\n"}, {"title": "Вариант 3 · операции с множествами", "note": "Объединяем списки соседей соседей и вычитаем первый круг и сам u.", "code": "def neighbors_at_distance_2(graph, u):\n    first = set(graph[u])\n    second = set()\n    for v in first:\n        for w in graph[v]:\n            second.add(w)\n    second = second - first\n    second.discard(u)\n    return sorted(second)\n"}]}, "M2": {"explain": "Треугольник — три попарно связанных узла. Перебираем тройки i < j < k, чтобы каждый треугольник посчитать один раз. Это O(n³). Быстрее: для каждого ребра считать общих соседей его концов — тогда каждый треугольник посчитается 3 раза (по разу на каждое ребро), и делим на 3.", "sols": [{"title": "Вариант 1 · перебор троек", "note": "Простой и надёжный O(n³).", "code": "def count_triangles(graph):\n    nodes = list(graph)\n    n = len(nodes)\n    count = 0\n    for i in range(n):\n        for j in range(i + 1, n):\n            for k in range(j + 1, n):\n                a = nodes[i]\n                b = nodes[j]\n                c = nodes[k]\n                if b in graph[a] and c in graph[b] and a in graph[c]:\n                    count += 1\n    return count\n"}, {"title": "Вариант 2 · общие соседи каждого ребра", "note": "Каждый треугольник содержит 3 ребра, поэтому сумму делим на 3.", "code": "def count_triangles(graph):\n    total = 0\n    for u in graph:\n        for v in graph[u]:\n            if u < v:\n                common = set(graph[u]) & set(graph[v])\n                total += len(common)\n    return total // 3\n"}, {"title": "Вариант 3 · тройки u < v < w по рёбрам", "note": "Идём только по существующим рёбрам и требуем порядок u < v < w — каждый треугольник ровно один раз.", "code": "def count_triangles(graph):\n    count = 0\n    for u in graph:\n        for v in graph[u]:\n            if v <= u:\n                continue\n            for w in graph[v]:\n                if w > v and w in graph[u]:\n                    count += 1\n    return count\n"}]}, "M3": {"explain": "В неориентированном графе цикл есть тогда и только тогда, когда при DFS встречается <b>back edge<\/b>: ребро к уже посещённой вершине, которая не является родителем текущей. Поэтому в стеке храним пару (вершина, родитель). Граф может быть несвязным, поэтому запускаем обход из каждой непосещённой вершины. Сложность O(n + m).", "sols": [{"title": "Вариант 1 · итеративный DFS с родителем", "note": "Back edge = посещённый сосед, который не родитель.", "code": "def has_cycle(graph):\n    seen = set()\n    for s in graph:\n        if s in seen:\n            continue\n        stack = [(s, None)]\n        seen.add(s)\n        while stack:\n            u, parent = stack.pop()\n            for v in graph[u]:\n                if v not in seen:\n                    seen.add(v)\n                    stack.append((v, u))\n                elif v != parent:\n                    return True\n    return False\n"}, {"title": "Вариант 2 · рекурсивный DFS", "note": "То же правило, но рекурсией.", "code": "def has_cycle(graph):\n    seen = set()\n\n    def visit(u, parent):\n        seen.add(u)\n        for v in graph[u]:\n            if v not in seen:\n                if visit(v, u):\n                    return True\n            elif v != parent:\n                return True\n        return False\n\n    for s in graph:\n        if s not in seen:\n            if visit(s, None):\n                return True\n    return False\n"}, {"title": "Вариант 3 · считаем рёбра и узлы компонент", "note": "В дереве из n узлов ровно n − 1 рёбер. Если в какой-то компоненте рёбер больше, там есть цикл.", "code": "def has_cycle(graph):\n    seen = set()\n    for s in graph:\n        if s in seen:\n            continue\n        # собираем компоненту обходом\n        comp = [s]\n        seen.add(s)\n        stack = [s]\n        while stack:\n            u = stack.pop()\n            for v in graph[u]:\n                if v not in seen:\n                    seen.add(v)\n                    comp.append(v)\n                    stack.append(v)\n        # считаем рёбра компоненты (каждое записано дважды)\n        degree_sum = 0\n        for u in comp:\n            degree_sum += len(graph[u])\n        edges = degree_sum // 2\n        if edges > len(comp) - 1:\n            return True\n    return False\n"}]}};
function solHTML(t) {
  const x = EXTRA[t.id];
  if (!x) return `<div class="solution"><b>Эталонное решение</b><pre>${esc(t.solution)}</pre></div>`;
  return `<div class="solution sols"><div class="expl"><b>Почему так</b><p>${x.explain}</p></div>` +
    x.sols.map(s => `<div class="var"><b>${s.title}</b><p class="note">${s.note}</p><pre>${esc(s.code)}</pre></div>`).join("") +
    `<p class="note">Все варианты проходят тесты этой задачи. На экзамене достаточно одного: выбирайте тот, который понятнее вам.</p></div>`;
}
const TASKS = DATA.tasks.filter(t => t.week > 0);
const MOCK_TASKS = Object.fromEntries(DATA.tasks.filter(t => t.week === 0).map(t => [t.id, t]));
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

/* ---------- storage (per-browser convenience only) ---------- */
const KEY = "aacm-trainer-v1";
let S = {tasks: {}, mocks: {}, current: TASKS[0].id, tab: "tasks"};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function tstate(id) { return S.tasks[id] || (S.tasks[id] = {code: null, fails: 0, passed: false, score: null, gaveUp: false}); }

/* ---------- Python runner (Brython) ---------- */
let pyReady = false;
function initPython() {
  const st = $("#pystatus");
  try {
    brython({debug: 0});
    pyReady = true;
    st.textContent = "Python готов";
    st.classList.add("ready");
  } catch (e) {
    st.textContent = "Python не загрузился — обновите страницу";
    st.classList.add("fail");
  }
  document.querySelectorAll("[data-needs-py]").forEach(b => b.disabled = !pyReady);
}
let runCounter = 0;
function runPython(code, task) {
  window.__aacm_code = code;
  window.__aacm_fname = task.fname;
  window.__aacm_tests = task.tests_py;
  window.__aacm_cmp = task.cmp;
  window.__aacm_result = null;
  const src = HARNESS + "\nfrom browser import window\nwindow.__aacm_result = run_all(window.__aacm_code, window.__aacm_fname, eval(window.__aacm_tests), window.__aacm_cmp)\n";
  try {
    __BRYTHON__.runPythonSource(src, {name: "aacm_run_" + (++runCounter)});
  } catch (e) {
    return {error: "Ошибка выполнения: " + (e && e.message ? e.message : e)};
  }
  const r = window.__aacm_result;
  if (typeof r !== "string") return {error: "Не удалось получить результат проверки."};
  if (r.startsWith("ERROR")) return {error: r.split("\x1f")[1]};
  const rows = r.split("\x1e").slice(1).map(line => {
    const [st, inp, exp, got] = line.split("\x1f");
    return {ok: st === "OK", inp, exp, got};
  });
  return {rows};
}

/* ---------- shared code-question widget ---------- */
function starter(task) { return "def " + task.title.split(")")[0] + "):\n    # your code here\n    pass\n"; }
function wireEditor(ta, onChange) {
  ta.addEventListener("keydown", e => {
    if (e.key === "Tab" && !e.shiftKey) {
      e.preventDefault();
      const s = ta.selectionStart, en = ta.selectionEnd;
      ta.setRangeText("    ", s, en, "end");
      onChange();
    } else if (e.key === "Enter") {
      const s = ta.selectionStart;
      const lineStart = ta.value.lastIndexOf("\n", s - 1) + 1;
      const line = ta.value.slice(lineStart, s);
      let indent = (line.match(/^ */) || [""])[0];
      if (/:\s*(#.*)?$/.test(line)) indent += "    ";
      e.preventDefault();
      ta.setRangeText("\n" + indent, s, ta.selectionEnd, "end");
      onChange();
    }
  });
  ta.addEventListener("input", onChange);
}
function resultsHTML(res) {
  if (res.error) return `<div class="verdict err">${esc(res.error)}</div>`;
  const passed = res.rows.filter(r => r.ok).length;
  const all = passed === res.rows.length;
  let html = `<div class="verdict ${all ? "ok" : "bad"}">${all ? "Все тесты пройдены" : `Пройдено ${passed} из ${res.rows.length} тестов`}</div>`;
  html += `<div class="tablewrap"><table class="res"><thead><tr><th></th><th>Test</th><th>Expected</th><th>Got</th></tr></thead><tbody>`;
  res.rows.forEach((r, i) => {
    if (i < VISIBLE_TESTS) {
      html += `<tr class="${r.ok ? "ok" : "fail"}"><td class="mark">${r.ok ? "✓" : "✗"}</td><td>${esc(r.inp)}</td><td>${esc(r.exp)}</td><td class="got">${esc(r.got)}</td></tr>`;
    } else {
      html += `<tr class="${r.ok ? "ok" : "fail"} hiddenrow"><td class="mark">${r.ok ? "✓" : "✗"}</td><td colspan="3">Скрытый тест ${i + 1}${r.ok ? "" : " — не пройден"}</td></tr>`;
    }
  });
  return html + "</tbody></table></div>";
}

/* ---------- tasks view ---------- */
function scoreLabel(st) {
  if (st.passed) return {txt: st.score + "%", cls: st.score >= 80 ? "ok" : "part"};
  if (st.gaveUp) return {txt: "0%", cls: "bad"};
  if (st.fails) return {txt: "−" + st.fails * PENALTY + "%", cls: "bad"};
  return {txt: "", cls: ""};
}
function renderRail() {
  const rail = $("#rail");
  let html = "";
  [1, 2, 3].forEach(w => {
    html += `<h3>${WEEK_NAMES[w]}</h3>`;
    TASKS.filter(t => t.week === w).forEach(t => {
      const sl = scoreLabel(tstate(t.id));
      html += `<button data-id="${t.id}" aria-current="${S.current === t.id}"><span class="nm">${t.id} ${esc(t.fname)}</span><span class="dot ${sl.cls}">${sl.txt}</span></button>`;
    });
  });
  rail.innerHTML = html;
  rail.querySelectorAll("button").forEach(b => b.onclick = () => { S.current = b.dataset.id; save(); renderRail(); renderTask(); });
  const done = TASKS.filter(t => tstate(t.id).passed);
  $("#st-solved").textContent = done.length + "/" + TASKS.length;
  const scored = TASKS.map(t => tstate(t.id)).filter(s => s.passed || s.gaveUp);
  $("#st-avg").textContent = scored.length ? Math.round(scored.reduce((a, s) => a + (s.score || 0), 0) / scored.length) + "%" : "—";
}
function renderTask() {
  const t = TASKS.find(x => x.id === S.current) || TASKS[0];
  const st = tstate(t.id);
  if (st.code === null) st.code = starter(t);
  const maxNow = Math.max(0, 100 - st.fails * PENALTY);
  const pane = $("#taskpane");
  pane.innerHTML = `
  <article class="card">
    <div class="qhead"><h2><code>${esc(t.title)}</code></h2>${t.src ? `<span class="tag src">${esc(t.src)}</span>` : ""}<span class="tag">${t.n} тестов</span></div>
    <p class="statement">${esc(t.statement)}</p>
    <pre class="example">${esc(t.example)}</pre>
    <details class="hint"><summary>Подсказка</summary><p>${esc(t.hint)}</p></details>
    <p class="penalty">Penalty regime: 0, 10, 20, … % · ${st.passed ? `<b>Решено: ${st.score}%</b>` : st.gaveUp ? "<b>Сдались: 0%</b>" : `неудачных проверок: <b>${st.fails}</b> · сейчас можно получить <b>${maxNow}%</b>`}</p>
    <textarea class="code" id="code-${t.id}" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Ваш код">${esc(st.code)}</textarea>
    <div class="actions">
      <button class="btn primary" id="check" data-needs-py ${pyReady ? "" : "disabled"}>Check</button>
      <button class="btn" id="reset">Сбросить код</button>
      ${st.passed || st.gaveUp ? `<button class="btn" id="showsol">Эталонные решения и разбор</button>` : `<button class="btn danger" id="giveup">Сдаться и посмотреть решение</button>`}
      <span class="status" id="status"></span>
    </div>
    <div id="giveupconfirm"></div>
    <div id="results"></div>
    <div id="sol"></div>
    <p class="note">Как на экзамене: без подсказок IDE, и каждая неудачная проверка стоит 10%. Перед Check мысленно прогоните пример и граничные случаи. Бесконечный цикл подвесит вкладку — тогда просто обновите страницу, код сохранится.</p>
  </article>`;
  const ta = document.getElementById("code-" + t.id);
  wireEditor(ta, () => { st.code = ta.value; save(); });
  $("#reset").onclick = () => { st.code = starter(t); save(); renderTask(); };
  $("#check").onclick = () => {
    $("#status").textContent = "Проверяю…";
    setTimeout(() => {
      const res = runPython(ta.value, t);
      const allOk = !res.error && res.rows.every(r => r.ok);
      if (!st.passed && !st.gaveUp) {
        if (allOk) { st.passed = true; st.score = Math.max(0, 100 - st.fails * PENALTY); }
        else st.fails += 1;
      }
      save(); renderRail();
      const keep = resultsHTML(res);
      renderTask();
      $("#results").innerHTML = keep;
      $("#status").textContent = allOk ? "" : "Исправьте и проверьте снова";
    }, 20);
  };
  const showSol = () => { $("#sol").innerHTML = solHTML(t); };
  if ($("#showsol")) $("#showsol").onclick = showSol;
  if ($("#giveup")) $("#giveup").onclick = () => {
    $("#giveupconfirm").innerHTML = `<div class="confirm">Задача будет засчитана на 0%. Решение откроется сразу. <button class="btn danger" id="gu-yes">Да, сдаться</button> <button class="btn" id="gu-no">Отмена</button></div>`;
    $("#gu-yes").onclick = () => { st.gaveUp = true; st.score = 0; save(); renderRail(); renderTask(); showSol(); };
    $("#gu-no").onclick = () => { $("#giveupconfirm").innerHTML = ""; };
  };
}

/* ---------- mock exam view ---------- */
function mstate(id) { return S.mocks[id] || (S.mocks[id] = {start: null, finished: false, code: null, fails: 0, passed: false, score: null, essays: ["", ""], lastRes: null}); }
const WHEN = {1: "Неделя 4 · 13–19 ноября", 2: "25 ноября · утро", 3: "25 ноября · после разбора мока 2"};
let timerHandle = null;
let openMock = null;
function words(s) { return (s.trim().match(/\S+/g) || []).length; }
function remaining(ms) { return Math.max(0, ms.start + MOCK_MINUTES * 60000 - Date.now()); }
function fmt(ms) { const s = Math.ceil(ms / 1000); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }
function renderMockList() {
  clearInterval(timerHandle);
  const pane = $("#mockpane");
  let html = `<p class="note" style="margin-top:0">Как настоящий экзамен: 60 минут, 1 задача на код и 2 эссе на английском (не меньше 300 слов). Вопросы открываются только после старта. Эталоны для самопроверки — в документе «AACM — банк ответов».</p><div class="mocks">`;
  DATA.mocks.forEach(m => {
    const ms = mstate(m.id);
    let state = "Не начат";
    if (ms.finished) state = `Завершён · код ${ms.passed ? ms.score : 0}% · эссе ${words(ms.essays[0])} и ${words(ms.essays[1])} слов`;
    else if (ms.start) state = `Идёт · осталось ${fmt(remaining(ms))}`;
    html += `<article class="card mock"><h3>Пробный экзамен ${m.id}</h3><p class="when">${WHEN[m.id]}</p><p class="state">${state}</p>
      <div class="actions">${ms.start ? `<button class="btn primary" data-open="${m.id}">${ms.finished ? "Результаты" : "Продолжить"}</button>` : `<button class="btn primary" data-start="${m.id}">Начать</button>`}
      ${ms.finished ? `<button class="btn" data-reset="${m.id}">Пройти заново</button>` : ""}</div><div data-confirm="${m.id}"></div></article>`;
  });
  pane.innerHTML = html + "</div>";
  pane.querySelectorAll("[data-start]").forEach(b => b.onclick = () => {
    const id = +b.dataset.start;
    pane.querySelector(`[data-confirm="${id}"]`).innerHTML = `<div class="confirm">Таймер на 60 минут запустится сразу. Отложите телефон и закройте документ с ответами. <div class="actions"><button class="btn primary" data-go="${id}">Старт</button><button class="btn" data-cancel="${id}">Отмена</button></div></div>`;
    pane.querySelector(`[data-go="${id}"]`).onclick = () => { const ms = mstate(id); ms.start = Date.now(); save(); renderMockExam(id); };
    pane.querySelector(`[data-cancel="${id}"]`).onclick = () => renderMockList();
  });
  pane.querySelectorAll("[data-open]").forEach(b => b.onclick = () => renderMockExam(+b.dataset.open));
  pane.querySelectorAll("[data-reset]").forEach(b => b.onclick = () => {
    const id = +b.dataset.reset;
    pane.querySelector(`[data-confirm="${id}"]`).innerHTML = `<div class="confirm">Ответы этого мока удалятся. <div class="actions"><button class="btn danger" data-rs="${id}">Удалить и начать заново</button><button class="btn" data-cancel="${id}">Отмена</button></div></div>`;
    pane.querySelector(`[data-rs="${id}"]`).onclick = () => { delete S.mocks[id]; save(); renderMockList(); };
    pane.querySelector(`[data-cancel="${id}"]`).onclick = () => renderMockList();
  });
}
function finishMock(id) { const ms = mstate(id); ms.finished = true; save(); renderMockExam(id); }
function renderMockExam(id) {
  openMock = id;
  clearInterval(timerHandle);
  const m = DATA.mocks.find(x => x.id === id);
  const ms = mstate(id);
  const t = MOCK_TASKS[m.code];
  if (ms.code === null) ms.code = starter(t);
  if (!ms.finished && remaining(ms) <= 0) { ms.finished = true; save(); }
  const ro = ms.finished ? "readonly" : "";
  const pane = $("#mockpane");
  pane.innerHTML = `
    <div class="timerbar">
      <div><span class="qno">Пробный экзамен ${id}</span><div class="clock" id="clock">${ms.finished ? "Завершён" : fmt(remaining(ms))}</div></div>
      <div class="actions" style="margin:0">
        <button class="btn" id="m-back">К списку</button>
        ${ms.finished ? "" : `<button class="btn primary" id="m-finish">Сдать работу</button>`}
      </div>
    </div>
    <div id="m-finishconfirm"></div>
    ${ms.finished ? summaryHTML(m, ms, t) : ""}
    <article class="card qblock">
      <p class="qno">Вопрос 1 · код</p>
      <div class="qhead"><h2><code>${esc(t.title)}</code></h2><span class="tag">${t.n} тестов</span></div>
      <p class="statement">${esc(t.statement)}</p>
      <pre class="example">${esc(t.example)}</pre>
      <p class="penalty">Penalty regime: 0, 10, 20, … % · ${ms.passed ? `<b>Решено: ${ms.score}%</b>` : `неудачных проверок: <b>${ms.fails}</b>`}</p>
      <textarea class="code" id="m-code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Ваш код" ${ro}>${esc(ms.code)}</textarea>
      ${ms.finished ? "" : `<div class="actions"><button class="btn primary" id="m-check" data-needs-py ${pyReady ? "" : "disabled"}>Check</button><span class="status" id="m-status"></span></div>`}
      <div id="m-results">${ms.lastRes ? resultsHTML(ms.lastRes) : ""}</div>
      ${ms.finished ? solHTML(t) : ""}
    </article>
    ${m.essays.map((e, i) => `
    <article class="card qblock">
      <p class="qno">Вопрос ${i + 2} · эссе</p>
      <p class="statement" style="font-weight:600">${esc(e.q)}</p>
      <textarea class="essay" id="m-essay-${i}" spellcheck="true" lang="en" aria-label="Эссе ${i + 1}" ${ro}>${esc(ms.essays[i])}</textarea>
      <div class="wc" id="m-wc-${i}"></div>
    </article>`).join("")}`;
  $("#m-back").onclick = () => { openMock = null; renderMockList(); };
  const updWc = i => { const n = words(ms.essays[i]); const el = $("#m-wc-" + i); el.textContent = n + " слов · цель 300"; el.classList.toggle("ok", n >= 300); };
  [0, 1].forEach(i => { updWc(i); if (!ms.finished) $("#m-essay-" + i).addEventListener("input", ev => { ms.essays[i] = ev.target.value; save(); updWc(i); }); });
  if (!ms.finished) {
    const ta = $("#m-code");
    wireEditor(ta, () => { ms.code = ta.value; save(); });
    $("#m-check").onclick = () => {
      $("#m-status").textContent = "Проверяю…";
      setTimeout(() => {
        const res = runPython(ta.value, t);
        const allOk = !res.error && res.rows.every(r => r.ok);
        if (!ms.passed) { if (allOk) { ms.passed = true; ms.score = Math.max(0, 100 - ms.fails * PENALTY); } else ms.fails += 1; }
        ms.lastRes = res; save();
        const y = window.scrollY; renderMockExam(id); window.scrollTo(0, y);
      }, 20);
    };
    $("#m-finish").onclick = () => {
      $("#m-finishconfirm").innerHTML = `<div class="confirm">Сдать работу сейчас? Редактировать ответы будет нельзя. <div class="actions"><button class="btn primary" id="m-yes">Сдать</button><button class="btn" id="m-no">Продолжить писать</button></div></div>`;
      $("#m-yes").onclick = () => finishMock(id);
      $("#m-no").onclick = () => { $("#m-finishconfirm").innerHTML = ""; };
    };
    timerHandle = setInterval(() => {
      const left = remaining(ms);
      const c = $("#clock");
      if (!c) { clearInterval(timerHandle); return; }
      c.textContent = fmt(left);
      c.classList.toggle("low", left < 5 * 60000);
      if (left <= 0) { clearInterval(timerHandle); finishMock(id); }
    }, 1000);
  } else {
    const cp = $("#m-copy");
    if (cp) cp.onclick = async () => {
      const txt = copyText(m, ms, t);
      try { await navigator.clipboard.writeText(txt); $("#m-copied").textContent = "Скопировано — вставьте в чат с Claude."; }
      catch (e) { const area = $("#m-copyarea"); area.hidden = false; area.value = txt; area.focus(); area.select(); $("#m-copied").textContent = "Не удалось скопировать автоматически — текст выделен, нажмите Ctrl+C."; }
    };
  }
}
function summaryHTML(m, ms, t) {
  const w = ms.essays.map(words);
  return `<article class="card qblock"><p class="qno">Итог</p><ul class="summary">
    <li>Код: <b>${ms.passed ? ms.score + "%" : "0% (тесты не пройдены)"}</b>, неудачных проверок ${ms.fails}</li>
    ${m.essays.map((e, i) => `<li>Эссе ${i + 1}: <b>${w[i]} слов</b>${w[i] < 300 ? " — меньше 300" : ""} · сверьте с эталоном <b>${ESSAY_NAMES[e.ref] || e.ref}</b> в документе</li>`).join("")}
  </ul>
  <p class="note">Пришлите ответы мне на проверку: я оценю эссе по содержанию, формулам и структуре и скажу, что добрать.</p>
  <div class="actions"><button class="btn primary" id="m-copy">Скопировать ответы для Claude</button><span class="status" id="m-copied"></span></div>
  <textarea class="essay" id="m-copyarea" hidden aria-label="Текст для копирования" style="min-height:140px"></textarea></article>`;
}
function copyText(m, ms, t) {
  return `Пробный экзамен ${m.id} (AACM). Проверь, пожалуйста.\n\nQ1 (код, ${ms.passed ? ms.score + "%" : "не пройден"}, неудачных проверок ${ms.fails}): ${t.title}\n${ms.code}\n\n` +
    m.essays.map((e, i) => `Q${i + 2}: ${e.q}\n[${words(ms.essays[i])} words]\n${ms.essays[i]}`).join("\n\n");
}

function showTab(name) {
  S.tab = name; save();

ber ·", "Загружаю Python…": "Loading Python…", "решено": "solved", "средний балл": "average score", "Задачи": "Tasks", "Пробный экзамен": "Mock exam", "Неделя # · dict и edgelist": "Week # · dict and edgelist", "Неделя # · метрики": "Week # · metrics", "Неделя # · обходы и пути": "Week # · traversals and paths", "# тестов": "# tests", "Подсказка": "Hint", "Ловушка июльского экзамена: у узла # есть сосед #, но у # нет соседа # — не полагайтесь на симметрию. Порядок соседей в списках не важен, дубликаты — ошибка.": "July exam trap: node # has neighbour #, but # does not have neighbour # — do not rely on symmetry. The order of neighbours in lists does not matter, duplicates are an error.", "Penalty regime: #, … % · неудачных проверок:": "Penalty regime: #, … % · failed checks:", "· сейчас можно получить": "· can currently earn", "Сбросить код": "Reset code", "Сдаться и посмотреть решение": "Give up and see the solution", "Как на экзамене: без подсказок IDE, и каждая неудачная проверка стоит #%. Перед Check мысленно прогоните пример и граничные случаи. Бесконечный цикл подвесит вкладку — тогда просто обновите страницу, код сохранится.": "Like the exam: no IDE hints, and every failed check costs #%. Before Check, mentally run the example and edge cases. An infinite loop will hang the tab — just refresh the page, your code is saved.", "Как настоящий экзамен: # минут, # задача на код и # эссе на английском (не меньше # слов). Вопросы открываются только после старта. Эталоны для самопроверки — в документе «AACM — банк ответов».": "Like the real exam: # minutes, # coding task and # essay in English (at least # words). Questions open only after the start. Reference answers for self-checking are in the document “AACM — answer bank”.", "Пробный экзамен #": "Mock exam #", "Неделя # · #–# ноября": "Week # · # – # November", "Не начат": "Not started", "Начать": "Start", "# ноября · утро": "# November · morning", "# ноября · после разбора мока #": "# November · after reviewing mock #", "Удалить узел = убрать все рёбра, где он встречается с любой стороны. Если узла нет — вернуть рёбра как есть.": "Delete node = remove all edges where it appears on either side. If the node does not exist, return the edges as they are.", "Каждое ребро добавляет # к степени ОБОИХ концов. dict.get(x, #) + #.": "Each edge adds # to the degree of BOTH endpoints. dict.get(x, #) + #.", "setdefault(u, []) создаёт узел, если его нет. Проверка `if v not in graph[u]` защищает от дубликатов.": "setdefault(u, []) creates the node if it is missing. The check `if v not in graph[u]` protects against duplicates.", "Ребро может быть записано как (u, v) или (v, u). Удобно положить оба направления в set.": "An edge may be written as (u, v) or (v, u). It is convenient to put both directions into a set.", "Проходите по ВСЕМ спискам, а не только по соседям u: списки могут быть несимметричными (как в июльском графе).": "Go through ALL lists, not only the neighbours of u: lists may be asymmetric (as in the July graph).", "Для каждого ребра (u, v): graph.setdefault(u, []).append(v) и наоборот.": "For each edge (u, v): graph.setdefault(u, []).append(v) and vice versa.", "Берите ребро только когда u < v — так каждое ребро попадёт один раз. В конце sorted().": "Take an edge only when u < v — that way each edge is counted once. Finish with sorted().", "Сумма длин всех списков = #L. Не забудьте случай N = #.": "The sum of all list lengths = #L. Do not forget the case N = #.", "Сначала посчитайте N_k (сколько узлов имеют степень k), потом разделите на N.": "First count N_k (how many nodes have degree k), then divide by N.", "Узел изолирован, если его список пуст. Не забудьте sorted().": "A node is isolated if its list is empty. Do not forget sorted().", "Переберите пары соседей (i < j по индексу в списке) и посчитайте, сколько из них связаны.": "Go over pairs of neighbours (i < j by index in the list) and count how many of them are connected.", "Пересечение множеств: set(graph[u]) & set(graph[v]).": "Set intersection: set(graph[u]) & set(graph[v]).", "Γ(u) — множество соседей u. Деление на ноль — частая потеря баллов.": "Γ(u) is the set of neighbours of u. Division by zero is a common way to lose points.", "Напишите вспомогательную функцию для C_i (как в #) и усредните.": "Write a helper function for C_i (as in #) and average.", "Очередь (list с pop(#) или collections.deque) + множество visited. Помечайте узел посещённым в момент добавления в очередь.": "Queue (list with pop(#) or collections.deque) + a visited set. Mark a node as visited when it is added to the queue.", "Вспомогательная рекурсивная функция visit(u) с общим списком order. Итеративная версия со стеком даст другой порядок!": "A helper recursive function visit(u) with a shared list order. An iterative version with a stack gives a different order!", "BFS по уровням: dist[v] = dist[u] + # при первом обнаружении v.": "BFS by levels: dist[v] = dist[u] + # when v is first discovered.", "Как DFS_complete в слайдах: запускайте обход из каждого ещё не посещённого узла и считайте запуски.": "As DFS_complete in the slides: start a traversal from every not-yet-visited node and count the launches.", "Обход из любого узла; граф связный, если посещены все узлы: len(visited) == len(graph).": "Traversal from any node; the graph is connected if all nodes were visited: len(visited) == len(graph).", "BFS со словарём parent (как discovered в слайдах), затем идём назад от t к s и разворачиваем путь.": "BFS with a parent dictionary (like discovered in the slides), then walk back from t to s and reverse the path.", "D[s] = #, остальные ∞. Каждый раз берите вершину вне «облака» с минимальным D и делайте relaxation её рёбер. heapq ускоряет, но min() по словарю тоже проходит.": "D[s] = #, the rest ∞. Each time take the vertex outside the “cloud” with minimum D and relax its edges. heapq speeds it up, but min() over the dictionary also passes.", "Задача будет засчитана на #%. Решение откроется сразу.": "The task will be scored at #%. The solution opens immediately.", "Да, сдаться": "Yes, give up", "Отмена": "Cancel", "Таймер на # минут запустится сразу. Отложите телефон и закройте документ с ответами.": "The # minute timer starts right away. Put your phone away and close the document with the answers.", "Старт": "Start", "Почему так": "Why it works", "Граф хранится как словарь списков: ключ — узел, значение — список соседей. Нужно, чтобы": "The graph is stored as a dictionary of lists: key is a node, value is the list of its neighbours. We need", "стал соседом": "to become a neighbour", "всех остальных": "of all the others", "узлов в обе стороны. Главная ловушка: исходный граф может быть несимметричным (у # есть сосед #, а у # нет соседа #), поэтому нельзя полагаться на чужие списки — проверяем каждую сторону отдельно через": "nodes in both directions. The main trap: the original graph may be asymmetric (# has neighbour #, but # does not have neighbour #), so we cannot rely on other nodes' lists — we check each side separately via", ". Список «остальных» узлов собираем": ". The list of “others” is collected", "до": "before", "добавления u, иначе u попадёт в собственный список. Сложность O(n·d) из-за проверки": "adding u, otherwise u ends up in its own list. Complexity O(n·d) because of the check", "по списку.": "on a list.", "Вариант # · сначала собрать остальных": "Option # · collect the others first", "Шаг #: собираем все узлы, кроме u. Шаг #: создаём u, если его нет. Шаг #: связываем в обе стороны без дубликатов.": "Step #: collect all nodes except u. Step #: create u if it is missing. Step #: link in both directions without duplicates.", "шаг #: все узлы, кроме u": "step #: all nodes except u", "шаг #: создаём u, если его нет": "step #: create u if it is missing", "шаг #: связываем u с каждым в обе стороны": "step #: link u with each node in both directions", "Вариант # · пропускаем u прямо в цикле": "Option # · skip u right in the loop", "Отдельный список не строим: в цикле просто пропускаем сам u через continue. list(graph) делает копию ключей, потому что словарь меняется внутри цикла.": "We do not build a separate list: in the loop we simply skip u itself via continue. list(graph) makes a copy of the keys because the dictionary changes inside the loop.", "сам с собой не соединяем": "do not connect it to itself", "Вариант # · две отдельные половины": "Option # · two separate halves", "Сначала заполняем список u, потом отдельным циклом добавляем u в чужие списки. Так проще проверить каждую сторону.": "First fill u's list, then add u to the other lists in a separate loop. This makes each side easier to check.", "половина #: все узлы попадают в список u": "half #: all nodes go into u's list", "половина #: u попадает в список каждого узла": "half #: u goes into every node's list", "Все варианты проходят тесты этой задачи. На экзамене достаточно одного: выбирайте тот, который понятнее вам.": "All options pass this task's tests. On the exam one is enough: choose the one that is clearer to you.", "Сдались: #%": "Gave up: #%", "Эталонные решения и разбор": "Reference solutions and walkthrough", "К списку": "Back to list", "Сдать работу": "Submit work", "Вопрос # · код": "Question # · code", "Вопрос # · эссе": "Question # · essay", "# слов · цель #": "# words · target #", "Идёт · осталось #:#": "In progress · left #:#", "Продолжить": "Continue", "Оригиналы · банк ответов": "Originals · answer bank", "Оригинальные тексты": "Original texts", "Тексты из документа «AACM — банк ответов к экзамену #». Выберите тему.": "Texts from the document “AACM — answer bank for exam #”. Choose a topic.", "Неделя #": "Week #", "Только прочитать": "Read only", "Лист формул": "Formula sheet", "Ф: Основы графов": "F: Graph basics", "Ф: Случайные сети (ER)": "F: Random networks (ER)", "Ф: Scale-free": "F: Scale-free", "Ф: Модели роста (BA и fitness)": "F: Growth models (BA and fitness)", "Ф: Degree correlations, robustness, epidemics, communities": "F: Degree cor Алгоритм": "Algorithm", "Время": "Time", "BFS, DFS, топологическая сортировка": "BFS, DFS, topological sort", "Dijkstra (с кучей)": "Dijkstra (with a heap)", "Transitive closure (n обходов)": "Transitive closure (n traversals)", "← Ф: Degree correlations, robustness, epidemics, communities": "← F: Degree correlations, robustness, epidemics, communities", "Жадный алгоритм с «облаком»: D[s] = #, остальные ∞. Каждый раз берём вершину": "A greedy algorithm with a “cloud”: D[s] = #, the rest ∞. Each time take the vertex", "вне облака с минимальной D": "outside the cloud with minimum D", ", кладём в облако и делаем": ", put it into the cloud and perform", "её рёбер: если D[u] + w < D[v], обновляем D[v]. Если минимум равен ∞, остальные вершины недостижимы — останавливаемся. В ответ кладём только достижимые. Поиск минимума перебором даёт O(n²); с кучей heapq — O((n + m) log n), как в лекции. Работает только с неотрицательными весами.": "relaxation of its edges: if D[u] + w < D[v], update D[v]. If the minimum is ∞, the remaining vertices are unreachable — stop. Put only the reachable ones into the answer. Finding the minimum by scanning gives O(n²); with a heapq heap — O((n + m) log n), as in the lecture. Works only with non-negative weights.", "Вариант # · минимум перебором": "Option # · minimum by scanning", "Самый прямой перевод «облака» из лекции в код.": "The most direct translation of the lecture's “cloud” into code.", "ищем вершину вне облака с минимальной D": "find the vertex outside the cloud with minimum D", "остальные недостижимы": "the rest are unreachable", "relaxation рёбер u": "relaxation of the edges of u", "Вариант # · heapq (очередь с приоритетом)": "Option # · heapq (priority queue)", "В куче лежат пары (расстояние, вершина). heappop всегда достаёт пару с наименьшим расстоянием. Устаревшие записи пропускаем.": "The heap holds pairs (distance, vertex). heappop always returns the pair with the smallest distance. Stale entries are skipped.", "устаревшая запись": "stale entry", "Вариант # · множество «ещё не обработаны»": "Option # · set of “not yet processed”", "Вместо облака храним множество необработанных вершин и удаляем из него выбранную.": "Instead of the cloud we keep a set of unprocessed vertices and remove the chosen one from it.", "E# · Неделя # · Случайные сети": "E# · Week # · Random networks", "Случайная сеть:": "Random network:", "монетка": "a coin", "для каждой пары": "for every pair", "Кратко": "In short", "Модель:": "Model:", "N узлов, каждая пара соединяется с вероятностью p, независимо от других (G(N,p), Гилберт). Вариант Эрдёша–Реньи G(N,L): ровно L связей по случайным парам.": "N nodes, each pair is connected with probability p, independently of the others (G(N,p), Gilbert). The Erdős–Rényi variant G(N,L): exactly L links on random pairs.", "Числа:": "Numbers:", "в среднем ⟨L⟩ = p·N(N−#)/# связей, средняя степень ⟨k⟩ = p(N−#).": "on average ⟨L⟩ = p·N(N−#)/# links, average degree ⟨k⟩ = p(N−#).", "Степени:": "Degrees:", "биномиальное распределение, а для разреженных сетей Пуассон. Почти все узлы имеют степень около ⟨k⟩, разброс σ = √⟨k⟩.": "binomial distribution, and Poisson for sparse networks. Almost all nodes have degree around ⟨k⟩, spread σ = √⟨k⟩.", "Главный вывод:": "Main conclusion:", "хабов нет. В реальных сетях они есть, поэтому реальные сети не пуассоновские.": "no hubs. Real networks have them, so real networks are not Poisson.", "Как строится сеть G(N, p)": "How the network G(N, p) is built", "Берём": "Take", "узлов без связей. Для": "nodes without links. For", "каждой пары": "each pair", "бросаем случайное число от # до #. Если оно": "draw a random number from # to #. If it is", "меньше p": "smaller than p", ", рисуем связь, иначе пропускаем.": ", draw a link, otherwise skip.", "Нажмите «Следующая пара» или «Авто».": "Press “Next pair” or “Auto”.", "Следующая пара": "Next pair", "Авто": "Auto", "Заново": "Reset", "пар проверено:": "pairs checked:", "связей L:": "links L:", "ожидаем ⟨L⟩ = #
