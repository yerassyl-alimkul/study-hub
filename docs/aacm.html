il", "модель A": "model A", "Модель B: предпочтение есть, роста нет": "Model B: preference, no growth", "N = # узлов, новых не добавляется. На каждом шаге случайный узел соединяется с узлом, выбранным по Π(k). Двигайте время t (число добавленных связей).": "N = # nodes, none are added. At each step a random node connects to a node chosen by Π(k). Move time t (number of links added).", "распределение меняется со временем (не стационарно)": "the distribution changes over time (not stationary)", "Сначала похоже на BA, потом все степени стягиваются к среднему, и в конце полный граф: у всех N − # = #.": "At first it looks like BA, then all degrees converge to the average, and in the end a complete graph: everyone has N − # = #.", "Как измерить preferential attachment": "How to measure preferential attachment", "Берём два снимка сети в моменты t и t + Δt. Прирост степени узла Δk": "Take two snapshots of the network at times t and t + Δt. The degree increase of a node Δk", "). Чтобы убрать шум, смотрят кумулятивную π(k) = Σ Π(k": "). To remove noise, look at the cumulative π(k) = Σ Π(k", "степень k": "degree k", "Π(k) (норм.)": "Π(k) (norm.)", "нет PA": "no PA", "экспоненциальное распределение, как модель A": "exponential distribution, like model A", "сублинейное": "sublinear", "меньше и мельче хабы (соавторы, актёры α ≈ #)": "smaller and shallower hubs (co-authors, actors α ≈ #)", "линейное": "linear", "степенной закон BA (Интернет, цитирования)": "BA power law (Internet, citations)", "суперлинейное": "superlinear", "супер-хабы забирают почти все связи": "super-hubs take almost all links", "вопрос": "question", "модель A: только рост → экспонента": "model A: growth only → exponential", "модель B: только PA → полный граф": "model B: PA only → complete graph", "вывод: нужны оба": "conclusion: both are needed", "измерение PA: π(k), режимы α": "PA measurement: π(k), regimes of α", "Как могут спросить: Describe what happens in the absence of growth or of preferential attachment. / How can preferential attachment be measured?": "How they may ask: Describe what happens in the absence of growth or of preferential attachment. / How can preferential attachment be measured?", "← E# ER против BA": "← E# ER vs BA", "E# Модель фитнеса →": "E# Fitness model →", "полный граф: все степени #": "complete graph: all degrees #", "Фитнес:": "Fitness:", "молодой, но сильный": "young but strong", "обгоняет старого": "overtakes the old one", "Проблема BA:": "BA problem:", "старейший узел всегда самый большой. Но Google появился на # лет позже веба и стал главным хабом, потом его обогнал Facebook.": "the oldest node is always the biggest. But Google appeared # years after the web and became the main hub, then Facebook overtook it.", "Фитнес η:": "Fitness η:", "врождённая привлекательность узла. Узел получает η из распределения ρ(η) навсегда. Связь идёт к i с вероятностью Π": "innate attractiveness of a node. A node receives η from the distribution ρ(η) forever. A link goes to i with probability Π", "Динамика:": "Dynamics:", ", β(η) = η/C. У каждого узла свой показатель, и более сильный со временем обгоняет старых.": ", β(η) = η/C. Each node has its own exponent, and a stronger one eventually overtakes the old ones.", "Частные случаи:": "Special cases:", "все η равны → C = #, β = #/#, BA с γ = #. η равномерно на [#] → C = #, γ ≈ #. Фитнес измеряют по наклону log k(t) от log t.": "all η equal → C = #, β = #/#, BA with γ = #. η uniform on [#] → C = #, γ ≈ #. Fitness is measured from the slope of log k(t) against log t.", "Гонка: старый узел против молодого и сильного": "Race: old node vs young and strong", "Узел «старик» пришёл в t = # с фитнесом η = #. «Новичок» пришёл позже, но его фитнес выше. Степени по формуле k = m(t/t": "The node “old” arrived at t = # with fitness η = #. The “newcomer” arrived later, but its fitness is higher. Degrees by the formula k = m(t/t", "новичок приходит в t": "the newcomer arrives at t", "его η =": "its η =", "время t": "time t", "старик, η = #": "old, η = #", "новичок": "newcomer", "Новичок обгоняет старика в момент t ≈ #: его β = # больше, чем #.": "The newcomer overtakes the old node at t ≈ #: its β = # is greater than #.", "Симуляция: кто стал хабом": "Simulation: who became a hub", "N = #, m = #. Каждая точка — узел: по горизонтали время прихода, по вертикали итоговая степень. Цвет — фитнес.": "N = #, m = #. Each point is a node: horizontally the arrival time, vertically the final degree. Colour is fitness.", "BA (фитнес одинаковый)": "BA (same fitness)", "время прихода": "arrival time", "Чем раньше пришёл, тем больше степень (точки ложатся на одну убывающую полосу).": "The earlier a node arrived, the larger its degree (the points lie on one falling band).", "Фитнес-модель, η ~ U[#]": "Fitness model, η ~ U[#]", "Красные": "The red ones", "— узлы с η > #: даже поздние поднимаются выше старых.": "are nodes with η > #: even late ones rise above old ones.", "Частные случаи и измерение": "Special cases and measurement", "все одинаковые: C = #, β = #/#, γ = # — это модель BA": "all equal: C = #, β = #/#, γ = # — this is the BA model", "— взвешенная сумма степенных законов": "— a weighted sum of power laws", "Как измерить фитнес:": "How to measure fitness:", "на log-log графике k(t) от t наклон кривой каждого узла даёт его β, а распределение β повторяет ρ(η). В WWW и цитированиях распределение фитнеса экспоненциально ограничено: маленькие различия в η рост и PA превращают в огромные различия в степени.": "on the log-log plot of k(t) against t, the slope of each node's curve gives its β, and the distribution of β repeats ρ(η). In the WWW and citations the fitness distribution is exponentially bounded: growth and PA turn small differences in η into huge differences in degree.", "минус BA: first-mover": "BA drawback: first-mover", "фитнес η, Π": "fitness η, Π", "частные случаи: BA и равномерный": "special cases: BA and uniform", "измерение фитнеса": "fitness measurement", "Как могут спросить: Describe the Bianconi–Barabási model. / What is fitness and how can it be measured?": "How they may ask: Describe the Bianconi–Barabási model. / What is fitness and how can it be measured?", "← E# Модели A и B": "← E# Models A and B", "E# BFS — поиск в ширину →": "E# BFS — breadth-first search →", "Обгонит, но позже, чем видно на графике: попробуйте больше η.": "It will overtake, but later than the plot shows: try a larger η.", "Новичок обгоняет старика в момент t ≈ #e+#: его β = # больше, чем #.": "The newcomer overtakes the old node at t ≈ #e+#: its β = # is greater than #.", "При η ≤ # новичок никогда не обгонит: его β не больше.": "For η ≤ # the newcomer never overtakes: its β is not larger.", "E# · Неделя # · Алгоритмы на графах · ★ было на экзамене": "E# · Week # · Graph algorithms · ★ was on the exam", "BFS: обход": "BFS: traversal", "по уровням": "by levels", ", как круги на воде": ", like circles on water", "Идея:": "Idea:", "из стартовой вершины s расходится «много исследователей». Уровень # — сама s, уровень # — её соседи, уровень # — непосещённые соседи уровня #, и так далее.": "“many explorers” spread out from the start vertex s. Level # is s itself, level # its neighbours, level # the unvisited neighbours of level #, and so on.", "Реализация:": "Implementation:", "очередь FIFO (или список текущего уровня) и словарь discovered[v] = ребро, по которому v нашли. Эти рёбра образуют дерево BFS, по нему восстанавливается путь.": "a FIFO queue (or a list of the current level) and a dictionary discovered[v] = the edge through which v was found. These edges form the BFS tree, from which the path is reconstructed.", "Свойства:": "Properties:", "посещает всё достижимое из s; путь в дереве до вершины уровня i имеет ровно i рёбер, и короче не бывает, то есть BFS даёт кратчайшие пути в невзвешенном графе. Нетривиальные рёбра (не в дереве) соединяют уровни, отличающиеся максимум на #; в неориентированном графе это cross edges.": "visits everything reachable from s; the path in the tree to a vertex of level i has exactly i edges, and there is no shorter one, i.e. BFS gives shortest paths in an unweighted graph. Non-tree edges connect levels that differ by at most #; in an undirected graph these are cross edges.", "Сложность:": "Complexity:", "O(n + m) со списком смежности. Применения: связность, компоненты, кратчайшие пути по числу шагов, расстояния и диаметр. Для весов нужен Дейкстра.": "O(n + m) with an adjacency list. Applications: connectivity, components, shortest paths by number of steps, distances and diameter. For weights Dijkstra is needed.", "Пошаговый BFS": "Step-by-step BFS", "Шаг = достаём вершину из начала очереди и смотрим всех её соседей. Новых соседей помечаем и ставим в конец очереди. Цвет вершины = уровень.": "A step = take a vertex from the front of the queue and look at all its neighbours. Mark new neighbours and put them at the end of the queue. Vertex colour = level.", "старт": "start", "Шаг": "Step", "Старт: A на уровне #, кладём в очередь.": "Start: A at level #, put it in the queue.", "Очередь (FIFO)": "Queue (FIFO)", "A: None (старт)": "A: None (start)", "уровень #": "level #", "синие толстые = рёбра дерева, оранжевый пунктир = cross edge": "thick blue = tree edges, dashed orange = cross edge", "Код и почему O(n + m)": "Code and why O(n + m)", "ребро ≤ # раз": "edge ≤ # times", "вершина # раз": "vertex # time", "каждая вершина попадает в уровень один раз, каждое ребро смотрим не больше двух раз (неориентированный граф)": "each vertex enters a level once, each edge is looked at at most twice (undirected graph)", "уровень i = i рёбер": "level i = i edges", "путь в дереве BFS от s до вершины уровня i — кратчайший": "the path in the BFS tree from s to a vertex of level i is the shortest", "не для весов": "not for weights", "BFS считает только число шагов; для весов нужен Дейкстра (E#)": "BFS counts only the number of steps; for weights Dijkstra is needed (E#)", "BFS против DFS": "BFS vs DFS", "Образ": "Image", "много исследователей, волна": "many explorers, a wave", "один исследователь в лабиринте": "one explorer in a maze", "Структура": "Structure", "очередь (FIFO), уровни": "queue (FIFO), levels", "рекурсия или стек (LIFO)": "recursion or stack (LIFO)", "Кратчайший путь (по шагам)": "Shortest path (by steps)", "да": "yes", "нет": "no", "Non-tree рёбра (неориент.)": "Non-tree edges (undirected)", "Сложность": "Complexity", "идея: уровни, «много исследователей»": "idea: levels, “many explorers”", "алгоритм: очередь + discovered": "algorithm: queue + discovered", "свойства: достижимость, кратчайшие пути, non-tree edges": "properties: reachability, shortest paths, non-tree edges", "O(n + m) со списком смежности": "O(n + m) with an adjacency list", "применения": "applications", "Как могут спросить: Describe the BFS algorithm and its properties. / Compare BFS and DFS.": "How they may ask: Describe the BFS algorithm and its properties. / Compare BFS and DFS.", "← E# Модель фитнеса": "← E# Fitness model", "E# DFS — поиск в глубину →": "E# DFS — depth-first search →", "Достали A (уровень #). Новые: B, C → уровень #.": "Took A (level #). New: B, C → level #.", "A: None (старт) B: (A, B) C: (A, C)": "A: None (start) B: (A, B) C: (A, C)", "Старт: B на уровне #, кладём в очередь.": "Start: B at level #, put it in the queue.", "B: None (старт)": "B: None (start)", "Старт: C на уровне #, кладём в очередь.": "Start: C at level #, put it in the queue.", "C: None (старт)": "C: None (start)", "Старт: D на уровне #, кладём в очередь.": "Start: D at level #, put it in the queue.", "D: None (старт)": "D: None (start)", "Старт: E на уровне #, кладём в очередь.": "Start: E at level #, put it in the queue.", "E: None (старт)": "E: None (start)", "Старт: F на уровне #, кладём в очередь.": "Start: F at level #, put it in the queue.", "F: None (старт)": "F: None (start)", "Старт: G на уровне #, кладём в очередь.": "Start: G at level #, put it in the queue.", "G: None (старт)": "G: None (start)", "Старт: H на уровне #, кладём в очередь.": "Start: H at level #, put it in the queue.", "H: None (старт)": "H: None (start)", "Достали H (уровень #). Новые: F, G → уровень #.": "Took H (level #). New: F, G → level #.", "H: None (старт) F: (H, F) G: (H, G)": "H: None (start) F: (H, F) G: (H, G)", "E# · Неделя # · Алгоритмы на графах": "E# · Week # · Graph algorithms", "один исследователь": "one explorer", "идёт до тупика и возвращается": "goes to a dead end and comes back", "из текущей вершины u берём ребро (u, v). Если v уже посещена, ребро пропускаем. Иначе идём в v. В тупике (все соседи посещены) возвращаемся назад (backtracking) по ребру, которым пришли.": "from the current vertex u we take an edge (u, v). If v is already visited, we skip the edge. Otherwise we go to v. At a dead end (all neighbours visited) we return (backtracking) along the edge we came by.", "рекурсия DFS(G, u): для каждого ребра (u, v), если v нет в discovered, discovered[v] = e и DFS(G, v). Итеративно — со стеком.": "recursion DFS(G, u): for each edge (u, v), if v is not in discovered, discovered[v] = e and DFS(G, v). Iteratively — with a stack.", "Типы рёбер:": "Edge types:", "tree (discovery) образуют дерево DFS. В неориентированном графе остальные — back edges (к предку). В ориентированном ещё forward и cross.": "tree (discovery) edges form the DFS tree. In an undirected graph the rest are back edges (to an ancestor). In a directed one there are also forward and cross edges.", "путь между вершинами, проверка связности (len(discovered) == n), остовное дерево, все компоненты (DFS_complete), поиск цикла: цикл есть ⇔ есть back edge.": "a path between vertices, connectivity test (len(discovered) == n), spanning tree, all components (DFS_complete), cycle detection: a cycle exists ⇔ there is a back edge.", "Пошаговый DFS": "Step-by-step DFS", "Шаг = смотрим одно ребро или возвращаемся. Число над вершиной — порядок посещения. Справа стек вызовов рекурсии.": "A step = look at one edge or backtrack. The number above a vertex is the visiting order. On the right is the recursion call stack.", "Старт в A.": "Start at A.", "Стек вызовов (верх = текущий)": "Call stack (top = current)", "Порядок посещения": "Visiting order", "синие толстые = tree edges": "thick blue = tree edges", "красный пунктир = back edge (значит, есть цикл)": "red dashed = back edge (means there is a cycle)", "в стеке": "on the stack", "завершена": "finished", "Код и применения": "Code and applications", "иначе: back edge (неориент.)": "otherwise: back edge (undirected)", "Путь u → v": "Path u → v", "идём назад по discovered от v к u": "walk back along discovered from v to u", "Связность": "Connectivity", "Компоненты": "Components", "DFS_complete: перезапуск из каждой непосещённой вершины": "DFS_complete: restart from every unvisited vertex", "Цикл": "Cycle", "цикл есть ⇔ есть back edge": "a cycle exists ⇔ there is a back edge", "Остовное дерево": "Spanning tree", "tree edges образуют spanning tree компоненты": "tree edges form a spanning tree of the components", "Сильная связность": "Strong connectivity", "ориент. граф: два DFS, второй по обратным рёбрам": "directed graph: two DFS runs, the second along reversed edges", "идея: один исследователь, backtracking": "idea: one explorer, backtracking", "рекурсивный алгоритм": "recursive algorithm", "дерево DFS и типы рёбер": "DFS tree and edge types", "свойство + O(n + m)": "property + O(n + m)", "применения: путь, связность, компоненты, циклы": "applications: path, connectivity, components, cycles", "Как могут спросить: Describe the DFS algorithm, its properties and applications. / How can DFS detect cycles or test connectivity?": "How they may ask: Describe the DFS algorithm, its properties and applications. / How can DFS detect cycles or test connectivity?", "← E# BFS — поиск в ширину": "← E# BFS — breadth-first search", "E# Алгоритм Дейкстры →": "E# Dijkstra's algorithm →", "Идём в B по ребру (A, B) — tree edge.": "Go to B along edge (A, B) </script><script>(function(){
const CYR=/[А-Яа-яЁё]/, NUM=/\d+(?:[.,]\d+)?(?:, \d+(?:[.,]\d+)?)*/g;
const norm=s=>s.replace(/\s+/g,' ').trim();
const key=s=>norm(s).replace(NUM,'#');
function tr(s){ const k=key(s); const en=DICT[k]; if(en===undefined) return null; const nums=norm(s).match(NUM)||[]; let i=0;
  const body=en.replace(/#/g,()=>nums[i]!==undefined?nums[i++]:'#'); return s.match(/^\s*/)[0]+body+s.match(/\s*$/)[0]; }
const orig=new WeakMap(), touched=new Set(), aOrig=new WeakMap(), aTouched=new Set();
const ATTRS=['placeholder','title','aria-label'];
let lang='ru'; try{ lang=localStorage.getItem('study-lang')||'ru'; }catch(e){}
const miss=()=>window.__miss;
function trCode(t){ return t.split('\n').map(function(L){ const i=L.indexOf('#'); if(i<0||!CYR.test(L.slice(i))) { if(CYR.test(L)){ const r0=tr(L); if(r0!==null) return r0; if(miss()) miss().add(key(L)); } return L; } const c=L.slice(i+1); const r=tr(c); if(r===null){ if(miss()) miss().add(key(c)); return L; } return L.slice(0,i+1)+' '+r.trim(); }).join('\n'); }
function doText(n){ if(!CYR.test(n.data)) return; if(n.parentElement&&n.parentElement.closest('pre,code')){ const rc=trCode(n.data); if(rc!==n.data){ orig.set(n,n.data); touched.add(n); n.data=rc; } return; } const r=tr(n.data); if(r===null){ if(miss()) miss().add(key(n.data)); return; } orig.set(n,n.data); touched.add(n); n.data=r; }
function doAttr(el){ if(!el.getAttribute) return; for(const a of ATTRS){ const v=el.getAttribute(a); if(!v||!CYR.test(v)) continue; const r=tr(v); if(r===null){ if(miss()) miss().add(key(v)); continue; }
  let m=aOrig.get(el); if(!m){ m={}; aOrig.set(el,m); } m[a]=v; aTouched.add(el); el.setAttribute(a,r); } }
const BAD=n=>{ const t=n.tagName; return n.hasAttribute('data-nt')||t==='SCRIPT'||t==='STYLE'||t==='TEXTAREA'; };
function inNT(n){ const e=n.nodeType===1?n:n.parentElement; return !!(e&&e.closest('[data-nt],script,style,textarea,#ruBody')); }
function walk(root){
  if(root.nodeType===3){ if(!inNT(root)) doText(root); return; }
  if(root.nodeType!==1||inNT(root)) return;
  doAttr(root);
  const list=[]; const tw=document.createTreeWalker(root,NodeFilter.SHOW_ELEMENT|NodeFilter.SHOW_TEXT,{acceptNode(n){ if(n.nodeType===1){ if(BAD(n)) return NodeFilter.FILTER_REJECT; doAttr(n); return NodeFilter.FILTER_SKIP; } return CYR.test(n.data)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_SKIP; }});
  let n; while((n=tw.nextNode())) list.push(n); list.forEach(doText);
}
function restore(){ touched.forEach(n=>{ const o=orig.get(n); if(o!==undefined&&!CYR.test(n.data)) n.data=o; }); touched.clear(); aTouched.forEach(el=>{ const m=aOrig.get(el); if(m) for(const a in m) el.setAttribute(a,m[a]); }); aTouched.clear(); }
const mo=new MutationObserver(ms=>{ if(lang!=='en') return; for(const m of ms){ if(m.type==='childList') m.addedNodes.forEach(walk); else if(m.type==='characterData'){ if(!inNT(m.target)) doText(m.target); } else if(m.type==='attributes') doAttr(m.target); } });
function paintSw(){ document.querySelectorAll('[data-langsw] [data-l]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang)); }
function setLang(l){ lang=l; try{ localStorage.setItem('study-lang',l); }catch(e){}
  const h=document.documentElement; h.dataset.lang=l; h.lang=l;
  if(l==='en') walk(document.body); else restore(); paintSw(); }
document.addEventListener('click',e=>{ const b=e.target.closest('[data-langsw] [data-l]'); if(b){ e.preventDefault(); if(b.dataset.l!==lang) setLang(b.dataset.l); } });
mo.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:ATTRS});
new MutationObserver(paintSw).observe(document.getElementById('side'),{childList:true});
setLang(lang);

window.__i18n={key,setLang,get lang(){return lang;},walk};
})();
</script>
