<script>
/* тема: auto | light | dark, хранится в study-theme (синхронизируется с Telegram) */
(function(){
  var R=document.documentElement, m='auto';
  try{m=localStorage.getItem('study-theme')||'auto'}catch(e){}
  function sys(){var w=window.Telegram&&Telegram.WebApp; if(w&&w.initData&&w.colorScheme) return w.colorScheme; return (window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light'}
  function apply(){
    var r=m==='auto'?sys():m; R.setAttribute('data-theme',r); R.style.colorScheme=r;
    var b=document.querySelector('.themebtn'); if(b){b.textContent=m==='auto'?'◐':(m==='dark'?'☾':'☀'); b.title={auto:'Тема: авто',light:'Тема: светлая',dark:'Тема: тёмная'}[m]; b.setAttribute('aria-label',b.title)}
    try{var w=window.Telegram&&Telegram.WebApp; if(w&&w.initData){w.setHeaderColor&&w.setHeaderColor(r==='dark'?'#121315':'#FBFBFA'); w.setBackgroundColor&&w.setBackgroundColor(r==='dark'?'#121315':'#FBFBFA')}}catch(e){}
  }
  window.__theme={get:function(){return m},apply:apply,cycle:function(){m=m==='auto'?'light':(m==='light'?'dark':'auto'); try{localStorage.setItem('study-theme',m)}catch(e){} apply()}};
  apply();
  function mount(){
    apply();
    if(document.querySelector('.themebtn')) return;
    var anchor=document.querySelector('[data-langsw]'); if(!anchor) return;
    var b=document.createElement('button'); b.type='button'; b.className='themebtn'; b.onclick=function(){window.__theme.cycle()};
    anchor.parentNode.insertBefore(b,anchor); apply();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',mount); else mount();
  window.addEventListener('load',apply);
  try{matchMedia('(prefers-color-scheme:dark)').addEventListener('change',apply)}catch(e){}
  /* если Telegram подтянул более новый study-theme из облака, страница перезагрузится синхронизацией */
})();
</script>

<script>
/* JulYera study sync: Telegram CloudStorage <-> localStorage, вход только через бота */
(function(){
  var BOT_URL='https://t.me/dsstudyhub_bot';                 // ссылка на бота, например https://t.me/ИМЯ_БОТА
  var PFX=/^(imsds-|mmmds-|aacm-|study-)/, CH=3500, tg=window.Telegram&&Telegram.WebApp;
  var inTg=!!(tg&&tg.initData);
  var dev=false; try{ if(/[?&]dev=1/.test(location.search)) sessionStorage.setItem('dev','1'); dev=sessionStorage.getItem('dev')==='1'; }catch(e){}
  var origSet=Storage.prototype.setItem;
  function gate(){
    if(inTg||dev) return;
    var s=document.createElement('style');
    s.textContent='#gate{position:fixed;inset:0;z-index:99999;background:#FBFBFA;color:#17181C;display:grid;place-items:center;padding:24px;text-align:center;font:16px/1.5 Onest,system-ui,sans-serif}#gate b{display:block;font:600 22px Unbounded,sans-serif;margin-bottom:10px}#gate p{max-width:34ch;margin:0 auto 18px;color:#5D5F69}#gate a{display:inline-block;background:#557546;color:#fff;text-decoration:none;padding:12px 22px;border-radius:999px;font-weight:600}';
    document.head.appendChild(s);
    function mk(){ var d=document.createElement('div'); d.id='gate'; d.innerHTML='<div><b>JulYera study hub</b><p>Обучалки открываются только через Telegram-бота: так прогресс привязан к твоему аккаунту.</p>'+(BOT_URL?'<a href="'+BOT_URL+'">Открыть бота</a>':'')+'</div>'; document.body.appendChild(d); document.body.style.overflow='hidden'; }
    if(document.body) mk(); else document.addEventListener('DOMContentLoaded',mk);
  }
  /* gate() отключён: сайт открывается и без бота, прогресс хранится в браузере, в Telegram синхронизируется */
  if(!inTg) return;
  try{ tg.ready(); tg.expand(); }catch(e){}
  var cs=tg.CloudStorage, timers={};
  function lsKeys(){ var o=[]; for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(PFX.test(k)) o.push(k); } return o; }
  function push(k){
    var v=localStorage.getItem(k); if(v==null) return;
    var ts=+localStorage.getItem('__ts_'+k)||Date.now(), n=Math.max(1,Math.ceil(v.length/CH));
    for(var i=0;i<n;i++) cs.setItem(k+'_'+i, v.slice(i*CH,(i+1)*CH));
    cs.setItem(k+'_m', JSON.stringify({n:n,ts:ts}));
  }
  Storage.prototype.setItem=function(k,v){
    origSet.call(this,k,v);
    if(this===localStorage && PFX.test(k) && k.indexOf('__ts_')!==0){
      origSet.call(this,'__ts_'+k,String(Date.now()));
      clearTimeout(timers[k]); timers[k]=setTimeout(function(){push(k)},1500);
    }
  };
  document.addEventListener('visibilitychange',function(){ if(document.hidden) lsKeys().forEach(push); });
  cs.getKeys(function(err,keys){
    if(err||!keys) return;
    var metas=keys.filter(function(x){return /_m$/.test(x)}), left=metas.length, changed=false, seen={};
    function finish(){
      lsKeys().forEach(function(k){ if(!seen[k]) push(k); });
      var done=false; try{ done=sessionStorage.getItem('synced')==='1'; }catch(e){}
      if(changed && !done){ try{sessionStorage.setItem('synced','1');}catch(e){} location.reload(); }
    }
    if(!left) return finish();
    metas.forEach(function(mk){
      var k=mk.slice(0,-2); seen[k]=1;
      cs.getItem(mk,function(e,mv){
        var m={}; try{m=JSON.parse(mv)}catch(x){}
        var lts=+localStorage.getItem('__ts_'+k)||0;
        if(m.ts>lts && m.n){
          var names=[]; for(var i=0;i<m.n;i++) names.push(k+'_'+i);
          cs.getItems(names,function(e2,vals){
            if(!e2&&vals){ var s=''; names.forEach(function(nm){ s+=vals[nm]||''; });
              if(s && s!==localStorage.getItem(k)){ origSet.call(localStorage,k,s); changed=true; }
              origSet.call(localStorage,'__ts_'+k,String(m.ts)); }
            if(--left===0) finish();
          });
        } else { if(lts>m.ts) push(k); if(--left===0) finish(); }
      });
    });
  });
})();
</script>

{id:'py', title:'Python для экзамена', goal:'Уметь читать и писать короткие функции про графы.', cards:[
 {k:'story', h:'Четыре «коробки» Python', b:`<p>Забудь про синтаксис. Запомни четыре коробки:</p>
 <ul class="big"><li><b>список</b> <code>[3, 1, 2]</code> — ряд пронумерованных ячеек. Порядок есть, повторы можно.</li>
 <li><b>множество</b> <code>{1, 2, 3}</code> — мешок без повторов. Очень быстро отвечает «есть ли тут X?».</li>
 <li><b>словарь</b> <code>{'A': ['B','C']}</code> — записная книжка: имя → значение.</li>

for u in graph:               # u по очереди: 'A', 'B', 'C'

 <p><code>graph['A']</code> — это список <code>['B','C']</code>, значит у A два соседа. Степень узла = <code>len(graph[u])</code>. Число рёбер = сумма степеней / 2 = (2+1+1)/2 = <b>2</b>.</p>`},

 {k:'num', h:'Те же числа в таблице', b:`<table class="tbl"><tr><th>n</th><th>n</th><th>n log n</th><th>n²</th></tr><tr><td>10</td><td>10</td><td>~33</td><td>100</td></tr><tr><td>1000</td><td>1000</td><td>~10 000</td><td>1 000 000</td></tr></table>
 <p>Для n = 1000 алгоритм n² делает миллион шагов, а n log n всего десять тысяч. Вот почему сложность важна.</p>`},
 {k:'formula', h:'Что значат O, Ω, Θ', b:`<table class="sym"><tr><td><b>O(f)</b></td><td>«не хуже чем f» — потолок. Время ≤ c·f(n).</td></tr><tr><td><b>Ω(f)</b></td><td>«не лучше чем f» — пол. Время ≥ c·f(n).</td></tr><tr><td><b>Θ(f)</b></td><td>«ровно порядка f» — и потолок, и пол.</td></tr></table>
 <p><b>Как упрощать:</b> 3n² + 5n + 7 → оставляем самое большое слагаемое n², выбрасываем константу 3 → <b>Θ(n²)</b>.</p>`},
 {k:'quiz', q:'Алгоритм делает 4n + 10 шагов. Какая у него сложность?', o:['O(1)','Θ(n)','Θ(n²)','Θ(4n+10)'], a:1, why:'Константы и малые слагаемые выбрасываем, остаётся порядок n.'},
 {k:'quiz', q:'Два вложенных цикла по n узлов: для каждой пары (u, v) проверяем ребро. Сколько?', o:['O(n)','O(n log n)','O(n²)','O(2ⁿ)'], a:2, why:'n × n пар = n² проверок.'},
 {k:'exam', h:'Как отвечать про сложность', b:`<p>Не говори просто «O(n)». Говори <b>почему</b>: «внешний цикл идёт по n узлам, внутренний в сумме по всем соседям, то есть 2m раз, значит всего O(n + m)».</p><p>Сначала главное слагаемое, потом вывод.</p>`}
]},
{id:'alg', title:'Алгоритмы на графах', goal:'BFS, DFS, Дейкстра, перевод списков.', cards:[
 {k:'story', h:'Три способа бродить по графу', b:`<ul class="big"><li><b>BFS (в ширину)</b> — круги на воде. Сначала соседи, потом соседи соседей. Нужна <b>очередь</b>. Находит кратчайшие пути (по числу рёбер).</li>
 <li><b>DFS (в глубину)</b> — лабиринт с ниткой. Идём вглубь до тупика, потом назад. Нужен <b>стек</b>.</li>
 <li><b>Дейкстра</b> — кратчайший путь, когда у рёбер есть <b>цены</b>.</li></ul>`},
 {k:'num', h:'BFS на маленьком графе', b:`<p>Граф: A–B, A–C, B–D, C–D. Стартуем из A.</p>
 <table class="tbl"><tr><th>шаг</th><th>очередь</th><th>что делаем</th></tr><tr><td>0</td><td>[A]</td><td>берём A, добавляем B, C</td></tr><tr><td>1</td><td>[B, C]</td><td>берём B, добавляем D</td></tr><tr><td>2</td><td>[C, D]</td><td>берём C (D уже есть)</td></tr><tr><td>3</td><td>[D]</td><td>берём D</td></tr></table>
 <p>Расстояния от A: A=0, B=1, C=1, D=2. Цена: каждый узел и каждое ребро по разу, <b>O(n + m)</b>.</p>`},
 {k:'num', h:'Дейкстра на числах', b:`<p>A→B стоит 4, A→C стоит 1, C→B стоит 2. Прямая дорога в B стоит 4, но через C только 1 + 2 = <b>3</b>.</p>
 <p>Алгоритм: берём ближайший ещё не готовый узел и «подтягиваем» его соседей: если через него дешевле, обновляем расстояние. Работает только если цены не отрицательные.</p>`},
 {k:'num', h:'Список смежности → список рёбер', b:`<pre class="code">def convert(graph):
    edges = []
    for u in graph:
        for v in graph[u]:
            edges.append((u, v))
    return sorted(edges)</pre>
 <p>Берём каждого соседа каждого узла и записываем пару. Время: проход O(n + m) плюс сортировка O(m log m). В неориентированном графе каждое ребро появится дважды (u,v) и (v,u): чтобы взять один раз, добавляй только когда u &lt; v.</p>`},
 {k:'quiz', q:'Нужно найти путь с наименьшим числом рёбер в графе без цен. Что берём?', o:['DFS','BFS','Дейкстру с отрицательными весами','сортировку'], a:1, why:'BFS идёт слоями, поэтому первый раз встреченный узел достигнут кратчайшим путём.'},
 {k:'quiz', q:'Какая структура нужна для BFS и какая для DFS?', o:['BFS стек, DFS очередь','BFS очередь, DFS стек','обоим очередь','обоим стек'], a:1, why:'Очередь: первым пришёл, первым вышел (идём слоями). Стек: последним пришёл, первым вышел (идём вглубь).'},
 {k:'exam', h:'Ответ про BFS на странице', b:`<ol class="big"><li>Что делает: обходит граф слоями от s, находит расстояния.</li><li>Как: очередь + множество посещённых.</li><li>Свойства: кратчайшие пути в графе без весов, находит компоненты.</li><li>Цена: O(n + m) со списком смежности, O(n²) с матрицей.</li><li>Пример на 4 узлах (как выше).</li></ol>`}
]},
{id:'net', title:'Основы сетей', goal:'Степень, пути, связность, кластеризация.', cards:[
 {k:'story', h:'Сеть = узлы и связи', b:`<p>Узлы — люди, связи — дружба. Всё, что нам нужно, чтобы описать сеть, это шесть понятий: <b>степень</b> (сколько друзей), <b>расстояние</b> (цепочка знакомых), <b>диаметр</b> (самая длинная из кратчайших цепочек), <b>компонента</b> (кусок, внутри которого все достижимы), <b>гигантская компонента</b> (самый большой кусок), <b>кластеризация</b> (дружат ли мои друзья между собой).</p>`},
 {k:'num', h:'Один граф, посчитаем всё', b:`<p>Узлы A,B,C,D,E. Связи: A–B, A–C, B–C, C–D, D–E.</p>
 <pre class="code">A — B
 \\ /
  C — D — E</pre>
 <table class="tbl"><tr><th>узел</th><th>k</th></tr><tr><td>A</td><td>2</td></tr><tr><td>B</td><td>2</td></tr><tr><td>C</td><td>3</td></tr><tr><td>D</td><td>2</td></tr><tr><td>E</td><td>1</td></tr></table>
 <p>Сумма степеней = 10 = 2 × 5 рёбер. Средняя степень ⟨k⟩ = 10/5 = <b>2</b>. Расстояние A→E = 3 (A–C–D–E), диаметр = 3.</p>`},
 {k:'formula', h:'Кластеризация по шагам', b:`<p><b>C<sub>i</sub> = L<sub>i</sub> / [k<sub>i</sub>(k<sub>i</sub>−1)/2]</b></p><table class="sym"><tr><td>L<sub>i</sub></td><td>сколько связей реально есть между соседями узла i</td></tr><tr><td>k<sub>i</sub>(k<sub>i</sub>−1)/2</td><td>сколько их могло бы быть (все пары соседей)</td></tr></table>
 <p>Узел C: соседи A, B, D. Пар 3 (A-B, A-D, B-D). Есть только A–B. C<sub>C</sub> = 1/3. Узел A: соседи B, C, и они связаны → C<sub>A</sub> = 1/1 = 1. Узел E: один сосед, пар нет → 0.</p>`},
 {k:'quiz', q:'У четырёх узлов степени 3, 2, 2, 1. Сколько в графе рёбер?', o:['8','4','2','3'], a:1, why:'Сумма степеней 3+2+2+1 = 8, а рёбер вдвое меньше: 4.'},
 {k:'quiz', q:'У узла 4 соседа, и между ними всего 2 связи. Чему равна его кластеризация?', o:['2/4','2/6','2/12','1/2'], a:1, why:'Возможных пар соседей 4·3/2 = 6, есть 2, значит C = 2/6 = 1/3.'},
 {k:'exam', h:'Что написать', b:`<p>Определи каждый термин в одну фразу, дай формулу (k, ⟨k⟩ = 2L/N, C<sub>i</sub>), приведи мини-пример. Скажи: в реальных сетях кластеризация высокая, расстояния короткие («малый мир»).</p>`}
]},
{id:'er', title:'Случайные сети (ER)', goal:'Модель G(N,p), степени, гигантская компонента.', cards:[
 {k:'story', h:'Монетка для каждой пары', b:`<p>Берём N людей. Для каждой пары бросаем «кривую» монетку: с вероятностью p они дружат. Всё. Это модель Эрдёша–Реньи <b>G(N, p)</b>.</p><p>Так как все пары равноправны, у большинства людей друзей примерно поровну, и людей с 50 друзьями почти не бывает. <b>Хабов нет.</b></p>`},
 {k:'num', h:'Считаем на 10 людях', b:`<p>N = 10, p = 0.3. Пар = 10·9/2 = 45. Ожидаемое число связей ⟨L⟩ = 45 × 0.3 = <b>13.5</b>. У каждого 9 возможных друзей, поэтому ⟨k⟩ = 9 × 0.3 = <b>2.7</b>.</p>`},
 {k:'formula', h:'Формулы по буквам', b:`<table class="sym"><tr><td>⟨L⟩ = p·N(N−1)/2</td><td>p × число пар</td></tr><tr><td>⟨k⟩ = p(N−1)</td><td>p × число возможных друзей</td></tr><tr><td>P(k) — Пуассон</td><td>колокол около ⟨k⟩, разброс √⟨k⟩</td></tr></table>`},
 {k:'story', h:'Гигантская компонента: переход при ⟨k⟩ = 1', b:`<p>Пока у человека в среднем меньше одного друга, сеть — россыпь мелких кучек. Как только в среднем больше одного, кучки слипаются в <b>одну гигантскую компоненту</b>. Это резкий переход, как замерзание воды.</p><p>Пример: N = 1000, при ⟨k⟩ = 0.5 самый большой кусок это десятки узлов, при ⟨k⟩ = 2 в нём уже ~80% всех узлов.</p>`},
 {k:'quiz', q:'N = 101, p = 0.05. Какова средняя степень ⟨k⟩?', o:['0.05','5','101','2.5'], a:1, why:'⟨k⟩ = p(N−1) = 0.05 × 100 = 5.'},
 {k:'quiz', q:'При ⟨k⟩ = 0.5 в случайной сети гигантская компонента…', o:['есть','нет','всегда 50%','зависит от p только'], a:1, why:'Порог ⟨k⟩ = 1. Ниже порога сеть состоит из мелких кусков.'},
 {k:'exam', h:'Ответ «Describe the random network model»', b:`<ol class="big"><li>Определение G(N,p).</li><li>⟨L⟩ и ⟨k⟩ с числами.</li><li>P(k): биномиальное → Пуассон.</li><li>Гигантская компонента при ⟨k⟩ = 1.</li><li>Минус модели: нет хабов, низкая кластеризация C ≈ p.</li></ol>`}
]},
{id:'sw', title:'Малый мир и Watts–Strogatz', goal:'Почему расстояния короткие, а кластеризация высокая.', cards:[
 {k:'story', h:'Шесть рукопожатий', b:`<p>В реальных соцсетях любые двое знакомы через пару-тройку цепочек, но при этом <b>друзья друзей часто дружат между собой</b>. Случайная сеть умеет первое, но не умеет второе. Уоттс и Строгац придумали, как получить оба.</p>`},
 {k:'num', h:'Числа для случайной сети', b:`<p>N = 1000, ⟨k⟩ = 10. Расстояние ⟨d⟩ ≈ ln N / ln⟨k⟩ = ln 1000 / ln 10 = <b>3</b>. Для N = 1 000 000 всего <b>6</b>. Вот что значит «логарифм».</p><p>Но кластеризация случайной сети C = ⟨k⟩/N = 10/1000 = <b>0.01</b>, а у реальных соцсетей C порядка 0.1–0.5.</p>`},
 {k:'story', h:'Рецепт Уоттса–Строгаца', b:`<ol class="big"><li>Поставь узлы в <b>кольцо</b> и свяжи каждого с ближайшими соседями. Получится большая кластеризация (друзья рядом), но длинные пути.</li><li>Каждое ребро с вероятностью p <b>перебрось</b> в случайное место.</li></ol><p>Даже малое p (около 1%) создаёт несколько «шорткатов» через всё кольцо: расстояние резко падает, а кластеризация почти не страдает.</p>`},
 {k:'num', h:'Кольцо в числах', b:`<p>N = 1000, у каждого 10 соседей. d(0) ≈ N/(2·10) = 50, C(0) ≈ 0.67. После p = 0.01: d падает в несколько раз, C ≈ 0.65. Именно этот график C(p)/C(0) и d(p)/d(0) рисуют на экзамене: d падает быстро, C держится.</p>`},
 {k:'quiz', q:'Что происходит с кольцом, когда p мало (около 0.01)?', o:['Расстояние растёт, C падает','Расстояние резко падает, C почти не меняется','C резко растёт','Ничего'], a:1, why:'Несколько шорткатов сжимают сеть, но почти все соседства остаются, и кластеризация сохраняется.'},
 {k:'quiz', q:'Почему случайная сеть не описывает соцсети?', o:['У неё нет путей','У неё слишком большая кластеризация','У неё слишком малая кластеризация','У неё нет узлов'], a:2, why:'В ER C ≈ ⟨k⟩/N очень мало, а в реальных сетях высока.'},
 {k:'exam', h:'Ответ «Describe the Watts–Strogatz model»', b:`<ol class="big"><li>Зачем: ER не даёт высокую C, решётка не даёт короткие пути.</li><li>Построение: кольцо → перебрасываем рёбра с вероятностью p.</li><li>Результат: диапазон p, где d мало, а C велика.</li><li>График C(p)/C(0), d(p)/d(0).</li><li>Минус: P(k) близко к Пуассону, хабов нет.</li></ol>`}
]},
{id:'sf', title:'Scale-free сети', goal:'Степенной закон, хабы, значение γ.', cards:[
 {k:'story', h:'Почти все мелкие, но есть гиганты', b:`<p>Рост людей: почти все 160–190 см, великанов нет. Богатство или число ссылок на сайт: почти все мелкие, но есть чудовищные гиганты. Первое — колокол, второе — <b>степенной закон</b>: P(k) ∼ k<sup>−γ</sup>. Сети с таким законом называют scale-free («без масштаба»), а гигантов в них называют <b>хабами</b>.</p>`},
 {k:'num', h:'Размер самого большого хаба', b:`<p>N = 10⁶, γ = 2.5, минимальная степень 1. k<sub>max</sub> ≈ N<sup>1/(γ−1)</sup> = 10<sup>6/1.5</sup> = <b>10 000</b>. В случайной сети с тем же ⟨k⟩ самый большой узел был бы порядка 15. Вот это и называют хабами.</p>`},
 {k:'formula', h:'Что значит γ', b:`<table class="sym"><tr><td>γ &gt; 3</td><td>почти обычная сеть, d ∼ ln N</td></tr><tr><td>2 &lt; γ &lt; 3</td><td>ультрамалый мир d ∼ ln ln N, ⟨k²⟩ расходится</td></tr><tr><td>γ ≤ 2</td><td>почти всё в нескольких хабах</td></tr></table><p>Чем меньше γ, тем толще хвост и тем больше хабов. Для N = 10⁶: ln N ≈ 13.8, а ln ln N ≈ 2.6.</p>`},
 {k:'quiz', q:'Как выглядит степенной закон на графике с логарифмическими осями?', o:['Колокол','Прямая линия с наклоном −γ','Горизонталь','Парабола'], a:1, why:'Если P ∼ k^−γ, то log P = −γ·log k + const, а это прямая.'},
 {k:'quiz', q:'Какая сеть имеет хабы?', o:['Случайная ER','Решётка','Scale-free','Кольцо'], a:2, why:'У ER и у решётки степени примерно одинаковы, а хабы возникают при степенном хвосте.'},
 {k:'exam', h:'Ответ «Discuss the scale-free property»', b:`<ol class="big"><li>Определение P(k) ∼ k<sup>−γ</sup> и log-log график.</li><li>Хабы и сравнение с Пуассоном.</li><li>Значение γ и режимы (γ &gt; 3, 2 &lt; γ &lt; 3).</li><li>Примеры: интернет, WWW, соцсети, белковые сети.</li><li>Последствия: устойчивость и эпидемии (темы 11, 13).</li></ol>`}
]},
{id:'ba', title:'Модель Барабаши–Альберт', goal:'Рост + предпочтительное присоединение.', cards:[
 {k:'story', h:'Богатые становятся богаче', b:`<p>Сеть не появляется сразу. Она <b>растёт</b>: приходит новый узел и подключается к m старым. Но не к случайным, а <b>чаще к тем, у кого уже много связей</b>: популярную страницу чаще цитируют, известного человека чаще добавляют в друзья. Это <b>предпочтительное присоединение</b>.</p>`},
 {k:'num', h:'Вероятность на числах', b:`<p>В сети 4 узла со степенями 3, 1, 1, 1. Сумма степеней = 6. Новый узел выберет первого с вероятностью 3/6 = <b>0.5</b>, каждого из остальных с вероятностью 1/6.</p>`},
 {k:'formula', h:'Формула Π(k)', b:`<p><b>Π(k<sub>i</sub>) = k<sub>i</sub> / Σ<sub>j</sub> k<sub>j</sub></b></p><table class="sym"><tr><td>k<sub>i</sub></td><td>степень узла i</td></tr><tr><td>Σ k<sub>j</sub></td><td>сумма степеней всех узлов (= 2L)</td></tr><tr><td>Π</td><td>вероятность, что новый узел выберет i</td></tr></table><p>Результат модели: P(k) ∼ k<sup>−3</sup> при любом m, то есть γ = 3.</p>`},
 {k:'story', h:'Что если убрать рост или предпочтение', b:`<ul class="big"><li><b>Модель A</b>: рост есть, предпочтения нет (цель случайная) → хвост экспоненциальный, хабов нет.</li><li><b>Модель B</b>: роста нет, предпочтение есть → сеть постепенно становится почти полной.</li></ul><p>Вывод: нужны <b>оба</b> ингредиента. Именно это спрашивают на экзамене.</p>`},
 {k:'quiz', q:'Степени 2, 2, 1, 1. Вероятность, что новый узел выберет первого?', o:['1/2','1/3','1/6','2/3'], a:1, why:'Сумма степеней 2+2+1+1 = 6, у первого степень 2, вероятность 2/6 = 1/3.'},
 {k:'quiz', q:'Нужен ли рост, чтобы получить scale-free?', o:['Нет, хватит предпочтения','Да, нужны и рост, и предпочтение','Нужен только рост','Не нужно ни того ни другого'], a:1, why:'Без роста (Model B) закон не стационарен, без предпочтения (Model A) хвост экспоненциальный.'},
 {k:'exam', h:'Ответ «Describe the BA model»', b:`<ol class="big"><li>Начальное ядро и рост: новый узел приносит m связей.</li><li>Предпочтительное присоединение Π(k) = k/Σk.</li><li>Результат γ = 3, хабы, «first mover advantage».</li><li>Модели A и B: зачем нужны оба ингредиента.</li><li>Ограничения: γ всегда 3, нет высокой кластеризации.</li></ol>`}
]},
{id:'fit', title:'Эволюция: fitness (Bianconi–Barabási)', goal:'Почему новички иногда обгоняют старых.', cards:[
 {k:'story', h:'Новичок побеждает старожила', b:`<p>В BA побеждают те, кто пришёл раньше. А в жизни Google пришёл позже Yahoo и всё равно победил: он был «лучше». Значит, кроме возраста нужна ещё <b>привлекательность</b> η (fitness).</p>`},
 {k:'num', h:'Сравним двоих', b:`<p>Старый узел: k = 10, η = 0.2 → вес <b>2.0</b>. Новичок: k = 3, η = 1 → вес <b>3.0</b>. Новичок привлекательнее, хотя у него меньше связей.</p>`},
 {k:'formula', h:'Формула', b:`<p><b>Π<sub>i</sub> = η<sub>i</sub>·k<sub>i</sub> / Σ<sub>j</sub> η<sub>j</sub>·k<sub>j</sub></b></p><p>Это BA, но каждая степень умножается на привлекательность. Если все η равны, получаем обычную BA. Если у одного узла η огромно, он забирает долю всех новых связей («конденсация Бозе–Эйнштейна»).</p>`},
 {k:'quiz', q:'Если все η одинаковы, модель Bianconi–Barabási превращается в…', o:['ER','Watts–Strogatz','модель Барабаши–Альберт','решётку'], a:2, why:'Одинаковые η сокращаются в числителе и знаменателе.'},
 {k:'exam', h:'Ответ «Describe the Bianconi–Barabási model»', b:`<ol class="big"><li>Проблема BA: решает только возраст.</li><li>Новое: fitness η, Π ∝ η·k.</li><li>Результат: поздние узлы с большим η догоняют.</li><li>Динамика k(t) ∼ t<sup>β(η)</sup>, распределение степеней — взвешенная сумма степенных.</li><li>Пример: Google против Yahoo.</li></ol>`}
]},
{id:'dc', title:'Корреляция степеней', goal:'Дружат ли хабы с хабами.', cards:[
 {k:'story', h:'С кем дружат популярные', b:`<p>В соцсетях популярные дружат с популярными (<b>ассортативная</b> сеть). В интернете и в белках хабы подключены к мелочи (<b>дизассортативная</b>). Вопрос: зависит ли степень соседа от моей степени?</p>`},
 {k:'num', h:'Звезда', b:`<p>Центр 0 соединён с 1, 2, 3, 4. Степень центра 4, листьев 1. Для листа сосед это центр со степенью 4, значит k<sub>nn</sub>(1) = <b>4</b>. Для центра соседи листья, значит k<sub>nn</sub>(4) = <b>1</b>. С ростом k значение падает: сеть <b>дизассортативная</b>.</p>`},
 {k:'formula', h:'k_nn по шагам', b:`<p><b>k<sub>nn</sub>(i) = (1/k<sub>i</sub>) · Σ<sub>j — сосед i</sub> k<sub>j</sub></b>: сложи степени всех соседей и раздели на их количество, то есть найди среднее.</p><p><b>k<sub>nn</sub>(k)</b> — то же среднее по всем узлам степени k. Растёт с k → ассортативная (r &gt; 0). Падает → дизассортативная (r &lt; 0).</p>`},
 {k:'quiz', q:'k_nn(k) растёт с k. Что это за сеть?', o:['Дизассортативная','Ассортативная','Случайная ER','Пустая'], a:1, why:'У узлов с большим k соседи тоже с большим k: хабы дружат с хабами.'},
 {k:'exam', h:'Что написать', b:`<p>Определение, формула k<sub>nn</sub>(i), k<sub>nn</sub>(k) и как читать график, коэффициент Пирсона r, 2 примера (соцсети ассортативные, интернет дизассортативный).</p>`}
]},
{id:'rob', title:'Устойчивость сетей', goal:'Отказы против атак, порог разрушения.', cards:[
 {k:'story', h:'Сломать случайный узел или самый главный?', b:`<p><b>Отказ</b> — выходит из строя случайный узел. <b>Атака</b> — специально удаляют самых связанных (хабы). Смотрим, как быстро разваливается гигантская компонента.</p>`},
 {k:'num', h:'Звезда', b:`<p>Степени 1, 1, 1, 1, 4. ⟨k⟩ = 1.6, ⟨k²⟩ = 4, κ = ⟨k²⟩/⟨k⟩ = 2.5 &gt; 2, значит гигантская компонента есть. Удалили центр (атака): остались 4 одиночки. Удалили лист (отказ): осталась звезда из 4 узлов. Хаб решает всё.</p>`},
 {k:'formula', h:'Порог разрушения', b:`<p><b>f<sub>c</sub> = 1 − 1/(κ − 1)</b>, где κ = ⟨k²⟩/⟨k⟩ (критерий Моллоя–Рида: гигантская компонента есть, пока κ &gt; 2).</p><p>ER: κ = ⟨k⟩ + 1, значит f<sub>c</sub> = 1 − 1/⟨k⟩. Пример ⟨k⟩ = 4 → f<sub>c</sub> = <b>0.75</b>. Scale-free при γ &lt; 3: ⟨k²⟩ огромно, f<sub>c</sub> → <b>1</b>: случайными отказами сеть почти не сломать.</p>`},
 {k:'quiz', q:'ER-сеть со ⟨k⟩ = 4. Какую долю узлов нужно случайно убрать, чтобы гигантская компонента исчезла?', o:['25%','50%','75%','100%'], a:2, why:'f_c = 1 − 1/⟨k⟩ = 1 − 1/4 = 0.75.'},
 {k:'quiz', q:'Почему scale-free сеть «устойчива к отказам, но уязвима к атакам»?', o:['У неё нет хабов','Случайный узел почти всегда мелкий, а удаление хабов рвёт сеть','Она очень маленькая','У неё много компонент'], a:1, why:'Случайный выбор попадает в мелкий узел, а хабы держат всю связность.'},
 {k:'exam', h:'Ответ «Robustness and attacks»', b:`<ol class="big"><li>Определения отказа и атаки; гигантская компонента как мера.</li><li>Критерий Моллоя–Рида и f<sub>c</sub>.</li><li>ER: плавный распад; scale-free: устойчив/хрупок.</li><li>Виды атак: по степени, по betweenness, с пересчётом.</li><li>Пример: интернет, электросеть.</li></ol>`}
]},
{id:'com', title:'Сообщества', goal:'Girvan–Newman и модулярность.', cards:[
 {k:'story', h:'Группы внутри сети', b:`<p><b>Сообщество</b> — группа узлов, внутри которой связей плотнее, чем наружу. Как найти? <b>Girvan–Newman</b>: найди ребро, через которое проходит больше всего кратчайших путей (это «мост»), удали его, повтори. Сеть распадается на группы.</p>`},
 {k:'num', h:'Два треугольника и мост', b:`<p>Узлы 1,2,3 — треугольник, 4,5,6 — треугольник, плюс ребро 3–4. Рёбер L = 7. Все пути между «левыми» и «правыми» идут через ребро 3–4, таких пар 3×3 = 9, это максимум. Удаляем мост, получаем два треугольника.</p>`},
 {k:'formula', h:'Модулярность Q', b:`<p><b>Q = Σ<sub>c</sub> [ L<sub>c</sub>/L − (k<sub>c</sub>/2L)² ]</b></p><table class="sym"><tr><td>L<sub>c</sub>/L</td><td>какая доля всех рёбер лежит внутри группы c</td></tr><tr><td>(k<sub>c</sub>/2L)²</td><td>какая доля лежала бы внутри случайно</td></tr></table><p>Считаем: группа {1,2,3}: L<sub>c</sub> = 3, k<sub>c</sub> = 2+2+3 = 7. 3/7 − (7/14)² = 0.429 − 0.25 = 0.179. Две группы дают <b>Q ≈ 0.357</b>. Все узлы в одной группе дают Q = 0.</p>`},
 {k:'quiz', q:'Чему равна модулярность, если все узлы в одной группе?', o:['1','0','−1','0.5'], a:1, why:'L_c/L = 1 и (k_c/2L)² = 1, значит Q = 0.'},
 {k:'quiz', q:'Какое ребро удаляет Girvan–Newman на каждом шаге?', o:['с наименьшим весом','с наибольшим edge betweenness','случайное','соединяющее хабы'], a:1, why:'Мосты между группами несут больше всего кратчайших путей.'},
 {k:'exam', h:'Ответ «How are communities detected?»', b:`<ol class="big"><li>Определение сообщества.</li><li>GN: betweenness ребра → удалить → пересчитать → дендрограмма.</li><li>Выбор разбиения по максимуму Q, формула Q.</li><li>Greedy Newman: слияния с наибольшим приростом Q.</li><li>Сложность GN ≈ O(L²N), поэтому медленный.</li></ol>`}
]},
{id:'sp', title:'Эпидемии: SI, SIS, SIR', goal:'Модели распространения и порог.', cards:[
 {k:'story', h:'Три модели', b:`<ul class="big"><li><b>SI</b>: здоровый → больной, выздоровления нет, в конце больны все.</li><li><b>SIS</b>: здоровый → больной → снова здоровый (простуда). Есть порог: ниже него болезнь вымирает.</li><li><b>SIR</b>: здоровый → больной → переболел с иммунитетом. Вспышка сама затухает.</li></ul><p>β — вероятность заразить по одной связи, μ — вероятность выздороветь.</p>`},
 {k:'num', h:'SI на цепочке', b:`<p>Цепочка 1–2–3–4–5, заражён узел 1, β = 1. Шаг 1: {1,2}. Шаг 2: {1,2,3}. Шаг 3: {1,2,3,4}. За t шагов заражены все на расстоянии ≤ t, это просто BFS слоями.</p>`},
 {k:'num', h:'Порог SIS на числах', b:`<p>β = 0.2, μ = 0.1, значит λ = β/μ = 2. Случайная сеть ⟨k⟩ = 4, порог λ<sub>c</sub> = 1/⟨k⟩ = <b>0.25</b>. Так как 2 &gt; 0.25, болезнь распространяется. При λ = 0.1 &lt; 0.25 она вымерла бы.</p><p>Для сети с хабами порог λ<sub>c</sub> = ⟨k⟩/⟨k²⟩. При γ ≤ 3 момент ⟨k²⟩ огромен, порог ≈ 0: болезнь живёт при любой заразности.</p>`},
 {k:'quiz', q:'В какой модели в конце заразятся все (в связной сети)?', o:['SI','SIS','SIR','ни в какой'], a:0, why:'В SI выздоровления нет, значит болезнь доходит до каждого.'},
 {k:'quiz', q:'Почему в scale-free сети порог эпидемии почти нулевой?', o:['Там нет хабов','⟨k²⟩ огромно из-за хабов','Там мало узлов','Там нет связей'], a:1, why:'λ_c = ⟨k⟩/⟨k²⟩, а при γ ≤ 3 знаменатель расходится.'},
 {k:'exam', h:'Ответ «Describe the epidemic models»', b:`<ol class="big"><li>Компартменты S, I, R и параметры β, μ.</li><li>Три модели и их циклы.</li><li>Порог: λ<sub>c</sub> = 1/⟨k⟩ (однородная), ⟨k⟩/⟨k²⟩ (гетерогенная).</li><li>Вывод про хабы и вакцинацию хабов.</li></ol>`}
]}
];

const TOPICS_EN = [
{id:'py', title:'Python for the exam', goal:'Read and write short graph functions with confidence.', cards:[
 {k:'story', h:'Four "boxes" of Python', b:`<p>Forget syntax. Remember four boxes:</p>
 <ul class="big"><li><b>list</b> <code>[3, 1, 2]</code>: a row of numbered cells. Order matters, repeats allowed.</li>
 <li><b>set</b> <code>{1, 2, 3}</code>: a bag without repeats. Answers "is X in here?" very fast.</li>
 <li><b>dictionary</b> <code>{'A': ['B','C']}</code>: a notebook, name → value.</li>
 <li><b>tuple</b> <code>(u, v)</code>: a sealed pair. This is how an edge is written.</li></ul>
 <p>Our graph is always a <b>dictionary of lists</b>: every node stores the list of its neighbours.</p>`},
 {k:'num', h:'Reading a graph as a dictionary', b:`<pre class="code">graph = {'A': ['B', 'C'],
         'B': ['A'],
         'C': ['A']}

for u in graph:               # u in turn: 'A', 'B', 'C'
    print(u, len(graph[u]))   # A 2 / B 1 / C 1</pre>
 <p><code>graph['A']</code> is the list <code>['B','C']</code>, so A has two neighbours. Degree of a node = <code>len(graph[u])</code>. Number of edges = sum of degrees / 2 = (2+1+1)/2 = <b>2</b>.</p>`},
 {k:'quiz', q:'How do you get the degree of node u if the graph is stored in a dictionary graph?', o:['graph[u]','len(graph[u])','len(graph)','graph.degree(u)'], a:1, why:'graph[u] is the list of neighbours. Its length is the degree. len(graph) is the number of nodes.'},
 {k:'quiz', q:'You must check many times "have I already visited this node?". What do you store?', o:['a list','a set','a tuple','a string'], a:1, why:'In a set the check takes one operation; in a list you scan all elements.'},
 {k:'exam', h:'How to write a function in the exam', b:`<ol class="big"><li>Read what goes in and what must come out.</li><li>Run the example by hand.</li><li>Say the idea in one sentence.</li><li>Write the code with clear variable names.</li><li>Test on an empty graph and on an isolated node.</li><li>State the complexity in words.</li></ol>`}
]},
{id:'cx', title:'Complexity: O, Θ, Ω', goal:'Understand how running time grows and name the complexity.', cards:[
 {k:'story', h:'How many steps if the input grows 10 times?', b:`<p>Complexity answers one question: <b>if there is more data, how much slower does the program get</b>.</p>
 <p>You look for a friend in a list of n people. Checking one by one takes n steps in the worst case, so time <b>grows with n</b>: O(n). If you check every pair of people for friendship, you do about n² steps, and a 10× bigger input takes 100× longer.</p>`},
 {k:'num', h:'The same numbers in a table', b:`<table class="tbl"><tr><th>n</th><th>n</th><th>n log n</th><th>n²</th></tr><tr><td>10</td><td>10</td><td>~33</td><td>100</td></tr><tr><td>1000</td><td>1000</td><td>~10 000</td><td>1 000 000</td></tr></table>
 <p>For n = 1000 an n² algorithm makes a million steps, n log n only ten thousand. That is why complexity matters.</p>`},
 {k:'formula', h:'What O, Ω, Θ mean', b:`<table class="sym"><tr><td><b>O(f)</b></td><td>"no worse than f": a ceiling. Time ≤ c·f(n).</td></tr><tr><td><b>Ω(f)</b></td><td>"no better than f": a floor. Time ≥ c·f(n).</td></tr><tr><td><b>Θ(f)</b></td><td>"exactly of order f": both ceiling and floor.</td></tr></table>
 <p><b>How to simplify:</b> 3n² + 5n + 7 → keep the biggest term n², drop the constant 3 → <b>Θ(n²)</b>.</p>`},
 {k:'quiz', q:'An algorithm makes 4n + 10 steps. What is its complexity?', o:['O(1)','Θ(n)','Θ(n²)','Θ(4n+10)'], a:1, why:'Drop constants and small terms: the order is n.'},
 {k:'quiz', q:'Two nested loops over n nodes: for each pair (u, v) check the edge. How many steps?', o:['O(n)','O(n log n)','O(n²)','O(2ⁿ)'], a:2, why:'n × n pairs = n² checks.'},
 {k:'exam', h:'How to answer about complexity', b:`<p>Do not just say "O(n)". Say <b>why</b>: "the outer loop goes over n nodes, the inner one over all neighbours, 2m in total, so overall O(n + m)".</p><p>Main term first, then the conclusion.</p>`}
]},
{id:'alg', title:'Graph algorithms', goal:'BFS, DFS, Dijkstra, converting representations.', cards:[
 {k:'story', h:'Three ways to walk a graph', b:`<ul class="big"><li><b>BFS (breadth-first)</b>: ripples on water. Neighbours first, then neighbours of neighbours. Needs a <b>queue</b>. Finds shortest paths (by number of edges).</li>
 <li><b>DFS (depth-first)</b>: a maze with a thread. Go deep to a dead end, then back. Needs a <b>stack</b>.</li>
 <li><b>Dijkstra</b>: shortest path when edges have <b>costs</b>.</li></ul>`},
 {k:'num', h:'BFS on a tiny graph', b:`<p>Graph: A–B, A–C, B–D, C–D. Start from A.</p>
 <table class="tbl"><tr><th>step</th><th>queue</th><th>what we do</th></tr><tr><td>0</td><td>[A]</td><td>take A, add B, C</td></tr><tr><td>1</td><td>[B, C]</td><td>take B, add D</td></tr><tr><td>2</td><td>[C, D]</td><td>take C (D already there)</td></tr><tr><td>3</td><td>[D]</td><td>take D</td></tr></table>
 <p>Distances from A: A=0, B=1, C=1, D=2. Cost: every node and edge once, <b>O(n + m)</b>.</p>`},
 {k:'num', h:'Dijkstra with numbers', b:`<p>A→B costs 4, A→C costs 1, C→B costs 2. The direct road to B costs 4, but via C only 1 + 2 = <b>3</b>.</p>
 <p>Algorithm: take the closest node not finished yet and "relax" its neighbours: if going through it is cheaper, update their distance. Works only with non-negative costs.</p>`},
 {k:'num', h:'Adjacency list → edge list', b:`<pre class="code">def convert(graph):
    edges = []
    for u in graph:
        for v in graph[u]:
            edges.append((u, v))
    return sorted(edges)</pre>
 <p>Take every neighbour of every node and write the pair. Time: one pass O(n + m) plus sorting O(m log m). In an undirected graph each edge appears twice, (u,v) and (v,u): to take it once, add only when u &lt; v.</p>`},
 {k:'quiz', q:'You need the path with the fewest edges in an unweighted graph. What do you use?', o:['DFS','BFS','Dijkstra with negative weights','sorting'], a:1, why:'BFS goes layer by layer, so the first time a node is reached it is by a shortest path.'},
 {k:'quiz', q:'Which structure does BFS need and which does DFS need?', o:['BFS stack, DFS queue','BFS queue, DFS stack','both a queue','both a stack'], a:1, why:'Queue: first in, first out (layers). Stack: last in, first out (deep).'},
 {k:'exam', h:'A BFS answer on the page', b:`<ol class="big"><li>What it does: explores the graph by layers from s, finds distances.</li><li>How: queue + set of visited nodes.</li><li>Properties: shortest paths in unweighted graphs, finds components.</li><li>Cost: O(n + m) with an adjacency list, O(n²) with a matrix.</li><li>An example on 4 nodes (as above).</li></ol>`}
]},
{id:'net', title:'Network basics', goal:'Degree, paths, connectedness, clustering.', cards:[
 {k:'story', h:'A network = nodes and links', b:`<p>Nodes are people, links are friendships. To describe a network we need six notions: <b>degree</b> (how many friends), <b>distance</b> (chain of acquaintances), <b>diameter</b> (the longest shortest chain), <b>component</b> (a piece where everyone is reachable), <b>giant component</b> (the biggest piece), <b>clustering</b> (do my friends know each other).</p>`},
 {k:'num', h:'One graph, compute everything', b:`<p>Nodes A,B,C,D,E. Links: A–B, A–C, B–C, C–D, D–E.</p>
 <pre class="code">A — B
 \\ /
  C — D — E</pre>
 <table class="tbl"><tr><th>node</th><th>k</th></tr><tr><td>A</td><td>2</td></tr><tr><td>B</td><td>2</td></tr><tr><td>C</td><td>3</td></tr><tr><td>D</td><td>2</td></tr><tr><td>E</td><td>1</td></tr></table>
 <p>Sum of degrees = 10 = 2 × 5 links. Average degree ⟨k⟩ = 10/5 = <b>2</b>. Distance A→E = 3 (A–C–D–E), diameter = 3.</p>`},
 {k:'formula', h:'Clustering step by step', b:`<p><b>C<sub>i</sub> = L<sub>i</sub> / [k<sub>i</sub>(k<sub>i</sub>−1)/2]</b></p><table class="sym"><tr><td>L<sub>i</sub></td><td>how many links really exist among the neighbours of i</td></tr><tr><td>k<sub>i</sub>(k<sub>i</sub>−1)/2</td><td>how many could exist (all pairs of neighbours)</td></tr></table>
 <p>Node C: neighbours A, B, D. 3 pairs (A-B, A-D, B-D). Only A–B exists. C<sub>C</sub> = 1/3. Node A: neighbours B, C and they are linked → C<sub>A</sub> = 1/1 = 1. Node E: one neighbour, no pairs → 0.</p>`},
 {k:'quiz', q:'Four nodes have degrees 3, 2, 2, 1. How many links does the graph have?', o:['8','4','2','3'], a:1, why:'Sum of degrees 3+2+2+1 = 8, links are half of it: 4.'},
 {k:'quiz', q:'A node has 4 neighbours and only 2 links among them. What is its clustering?', o:['2/4','2/6','2/12','1/2'], a:1, why:'Possible pairs 4·3/2 = 6, 2 exist, so C = 2/6 = 1/3.'},
 {k:'exam', h:'What to write', b:`<p>Define each term in one phrase, give the formula (k, ⟨k⟩ = 2L/N, C<sub>i</sub>), add a mini example. Say: real networks have high clustering and short distances ("small world").</p>`}
]},
{id:'er', title:'Random networks (ER)', goal:'The G(N,p) model, degrees, giant component.', cards:[
 {k:'story', h:'A coin for every pair', b:`<p>Take N people. For every pair flip a biased coin: with probability p they are friends. That is all. This is the Erdős–Rényi model <b>G(N, p)</b>.</p><p>All pairs are equal, so most people have about the same number of friends and almost nobody has 50. <b>No hubs.</b></p>`},
 {k:'num', h:'Counting with 10 people', b:`<p>N = 10, p = 0.3. Pairs = 10·9/2 = 45. Expected links ⟨L⟩ = 45 × 0.3 = <b>13.5</b>. Everyone has 9 possible friends, so ⟨k⟩ = 9 × 0.3 = <b>2.7</b>.</p>`},
 {k:'formula', h:'Formulas letter by letter', b:`<table class="sym"><tr><td>⟨L⟩ = p·N(N−1)/2</td><td>p × number of pairs</td></tr><tr><td>⟨k⟩ = p(N−1)</td><td>p × number of possible friends</td></tr><tr><td>P(k) is Poisson</td><td>a bell around ⟨k⟩, spread √⟨k⟩</td></tr></table>`},
 {k:'story', h:'Giant component: transition at ⟨k⟩ = 1', b:`<p>While a person has fewer than one friend on average, the network is a scatter of small clumps. When the average passes one, the clumps merge into <b>one giant component</b>. It is a sharp transition, like water freezing.</p><p>Example: N = 1000; at ⟨k⟩ = 0.5 the biggest piece is tens of nodes, at ⟨k⟩ = 2 it already holds ~80% of all nodes.</p>`},
 {k:'quiz', q:'N = 101, p = 0.05. What is the average degree ⟨k⟩?', o:['0.05','5','101','2.5'], a:1, why:'⟨k⟩ = p(N−1) = 0.05 × 100 = 5.'},
 {k:'quiz', q:'At ⟨k⟩ = 0.5 a random network has a giant component…', o:['yes','no','always 50%','depends on p only'], a:1, why:'The threshold is ⟨k⟩ = 1. Below it the network is small pieces.'},
 {k:'exam', h:'Answer "Describe the random network model"', b:`<ol class="big"><li>Definition of G(N,p).</li><li>⟨L⟩ and ⟨k⟩ with numbers.</li><li>P(k): binomial → Poisson.</li><li>Giant component at ⟨k⟩ = 1.</li><li>Weakness: no hubs, low clustering C ≈ p.</li></ol>`}
]},
{id:'sw', title:'Small world and Watts–Strogatz', goal:'Why distances are short while clustering is high.', cards:[
 {k:'story', h:'Six handshakes', b:`<p>In real social networks any two people are linked through a few acquaintances, yet <b>friends of friends are often friends with each other</b>. A random network gives the first but not the second. Watts and Strogatz found a way to get both.</p>`},
 {k:'num', h:'Numbers for a random network', b:`<p>N = 1000, ⟨k⟩ = 10. Distance ⟨d⟩ ≈ ln N / ln⟨k⟩ = ln 1000 / ln 10 = <b>3</b>. For N = 1 000 000 only <b>6</b>. That is what "logarithm" means.</p><p>But clustering of a random network is C = ⟨k⟩/N = 10/1000 = <b>0.01</b>, while real social networks have C around 0.1–0.5.</p>`},
 {k:'story', h:'The Watts–Strogatz recipe', b:`<ol class="big"><li>Put the nodes on a <b>ring</b> and link each to its nearest neighbours. You get high clustering (friends sit close) but long paths.</li><li>With probability p <b>rewire</b> each edge to a random place.</li></ol><p>Even small p (about 1%) creates a few "shortcuts" across the ring: distance drops sharply and clustering barely suffers.</p>`},
 {k:'num', h:'The ring in numbers', b:`<p>N = 1000, 10 neighbours each. d(0) ≈ N/(2·10) = 50, C(0) ≈ 0.67. After p = 0.01: d drops several times, C ≈ 0.65. This is the plot of C(p)/C(0) and d(p)/d(0) you draw in the exam: d falls fast, C holds.</p>`},
 {k:'quiz', q:'What happens to the ring when p is small (about 0.01)?', o:['Distance grows, C drops','Distance drops sharply, C barely changes','C grows sharply','Nothing'], a:1, why:'A few shortcuts shrink the network, but nearly all neighbourhoods stay, so clustering is kept.'},
 {k:'quiz', q:'Why does a random network not describe social networks?', o:['It has no paths','Its clustering is too high','Its clustering is too low','It has no nodes'], a:2, why:'In ER, C ≈ ⟨k⟩/N is tiny while real networks have high C.'},
 {k:'exam', h:'Answer "Describe the Watts–Strogatz model"', b:`<ol class="big"><li>Why: ER does not give high C, a lattice does not give short paths.</li><li>Construction: ring → rewire edges with probability p.</li><li>Result: a range of p where d is small and C is large.</li><li>Plot C(p)/C(0), d(p)/d(0).</li><li>Weakness: P(k) is close to Poisson, no hubs.</li></ol>`}
]},
{id:'sf', title:'Scale-free networks', goal:'Power law, hubs, the meaning of γ.', cards:[
 {k:'story', h:'Almost all small, but there are giants', b:`<p>Human height: almost everyone is 160–190 cm, no giants. Wealth or links to a website: almost all small, but there are monstrous giants. The first is a bell, the second a <b>power law</b>: P(k) ∼ k<sup>−γ</sup>. Networks with such a law are called scale-free, and the giants are <b>hubs</b>.</p>`},
 {k:'num', h:'Size of the biggest hub', b:`<p>N = 10⁶, γ = 2.5, minimum degree 1. k<sub>max</sub> ≈ N<sup>1/(γ−1)</sup> = 10<sup>6/1.5</sup> = <b>10 000</b>. In a random network with the same ⟨k⟩ the biggest node would be about 15. That is what hubs are.</p>`},
 {k:'formula', h:'What γ means', b:`<table class="sym"><tr><td>γ &gt; 3</td><td>almost an ordinary network, d ∼ ln N</td></tr><tr><td>2 &lt; γ &lt; 3</td><td>ultra-small world d ∼ ln ln N, ⟨k²⟩ diverges</td></tr><tr><td>γ ≤ 2</td><td>almost everything sits in a few hubs</td></tr></table><p>The smaller γ, the fatter the tail and the more hubs. For N = 10⁶: ln N ≈ 13.8, ln ln N ≈ 2.6.</p>`},
 {k:'quiz', q:'What does a power law look like on log–log axes?', o:['A bell','A straight line with slope −γ','A horizontal line','A parabola'], a:1, why:'If P ∼ k^−γ then log P = −γ·log k + const, a straight line.'},
 {k:'quiz', q:'Which network has hubs?', o:['Random ER','Lattice','Scale-free','Ring'], a:2, why:'ER and lattice have nearly equal degrees; hubs appear with a power-law tail.'},
 {k:'exam', h:'Answer "Discuss the scale-free property"', b:`<ol class="big"><li>Definition P(k) ∼ k<sup>−γ</sup> and log–log plot.</li><li>Hubs and comparison with Poisson.</li><li>Value of γ and regimes (γ &gt; 3, 2 &lt; γ &lt; 3).</li><li>Examples: Internet, WWW, social networks, protein networks.</li><li>Consequences: robustness and epidemics (topics 11, 13).</li></ol>`}
]},
{id:'ba', title:'Barabási–Albert model', goal:'Growth + preferential attachment.', cards:[
 {k:'story', h:'The rich get richer', b:`<p>A network does not appear at once. It <b>grows</b>: a new node arrives and links to m old ones. But not to random ones: <b>more often to those that already have many links</b>. A popular page is cited more, a famous person gets more friend requests. This is <b>preferential attachment</b>.</p>`},
 {k:'num', h:'Probability with numbers', b:`<p>The network has 4 nodes with degrees 3, 1, 1, 1. Sum of degrees = 6. The new node picks the first with probability 3/6 = <b>0.5</b>, each other node with probability 1/6.</p>`},
 {k:'formula', h:'The formula Π(k)', b:`<p><b>Π(k<sub>i</sub>) = k<sub>i</sub> / Σ<sub>j</sub> k<sub>j</sub></b></p><table class="sym"><tr><td>k<sub>i</sub></td><td>degree of node i</td></tr><tr><td>Σ k<sub>j</sub></td><td>sum of all degrees (= 2L)</td></tr><tr><td>Π</td><td>probability that the new node picks i</td></tr></table><p>Result of the model: P(k) ∼ k<sup>−3</sup> for any m, i.e. γ = 3.</p>`},
 {k:'story', h:'What if growth or preference is removed', b:`<ul class="big"><li><b>Model A</b>: growth, no preference (random target) → exponential tail, no hubs.</li><li><b>Model B</b>: no growth, preference → the network slowly becomes almost complete.</li></ul><p>Conclusion: <b>both</b> ingredients are needed. This is what the exam asks.</p>`},
 {k:'quiz', q:'Degrees 2, 2, 1, 1. Probability that the new node picks the first?', o:['1/2','1/3','1/6','2/3'], a:1, why:'Sum of degrees 2+2+1+1 = 6, the first has degree 2, probability 2/6 = 1/3.'},
 {k:'quiz', q:'Is growth needed to get a scale-free network?', o:['No, preference is enough','Yes, both growth and preference are needed','Only growth is needed','Neither is needed'], a:1, why:'Without growth (Model B) the law is not stationary, without preference (Model A) the tail is exponential.'},
 {k:'exam', h:'Answer "Describe the BA model"', b:`<ol class="big"><li>Initial core and growth: each new node brings m links.</li><li>Preferential attachment Π(k) = k/Σk.</li><li>Result γ = 3, hubs, first-mover advantage.</li><li>Models A and B: why both ingredients are needed.</li><li>Limits: γ is always 3, no high clustering.</li></ol>`}
]},
{id:'fit', title:'Evolution: fitness (Bianconi–Barabási)', goal:'Why newcomers sometimes overtake old nodes.', cards:[
 {k:'story', h:'The newcomer beats the veteran', b:`<p>In BA those who came earlier win. In life Google came after Yahoo and still won: it was "better". So besides age we need <b>attractiveness</b> η (fitness).</p>`},
 {k:'num', h:'Compare two nodes', b:`<p>Old node: k = 10, η = 0.2 → weight <b>2.0</b>. Newcomer: k = 3, η = 1 → weight <b>3.0</b>. The newcomer is more attractive although it has fewer links.</p>`},
 {k:'formula', h:'The formula', b:`<p><b>Π<sub>i</sub> = η<sub>i</sub>·k<sub>i</sub> / Σ<sub>j</sub> η<sub>j</sub>·k<sub>j</sub></b></p><p>This is BA, but each degree is multiplied by attractiveness. If all η are equal we get plain BA. If one node has a huge η it takes a share of all new links ("Bose–Einstein condensation").</p>`},
 {k:'quiz', q:'If all η are equal, the Bianconi–Barabási model turns into…', o:['ER','Watts–Strogatz','the Barabási–Albert model','a lattice'], a:2, why:'Equal η cancel in numerator and denominator.'},
 {k:'exam', h:'Answer "Describe the Bianconi–Barabási model"', b:`<ol class="big"><li>Problem of BA: only age decides.</li><li>New: fitness η, Π ∝ η·k.</li><li>Result: late nodes with large η catch up.</li><li>Dynamics k(t) ∼ t<sup>β(η)</sup>, degree distribution is a weighted sum of power laws.</li><li>Example: Google vs Yahoo.</li></ol>`}
]},
{id:'dc', title:'Degree correlation', goal:'Do hubs befriend hubs.', cards:[
 {k:'story', h:'Whom the popular befriend', b:`<p>In social networks popular people befriend popular people (<b>assortative</b> network). On the Internet and in proteins hubs link to small nodes (<b>disassortative</b>). The question: does my neighbour's degree depend on my degree?</p>`},
 {k:'num', h:'The star', b:`<p>Centre 0 is linked to 1, 2, 3, 4. Degree of the centre 4, of leaves 1. For a leaf the neighbour is the centre with degree 4, so k<sub>nn</sub>(1) = <b>4</b>. For the centre the neighbours are leaves, so k<sub>nn</sub>(4) = <b>1</b>. The value falls as k grows: the network is <b>disassortative</b>.</p>`},
 {k:'formula', h:'k_nn step by step', b:`<p><b>k<sub>nn</sub>(i) = (1/k<sub>i</sub>) · Σ<sub>j neighbour of i</sub> k<sub>j</sub></b>: add up the degrees of all neighbours and divide by their number, i.e. take the average.</p><p><b>k<sub>nn</sub>(k)</b> is the same average over all nodes of degree k. Grows with k → assortative (r &gt; 0). Falls → disassortative (r &lt; 0).</p>`},
 {k:'quiz', q:'k_nn(k) grows with k. What network is it?', o:['Disassortative','Assortative','Random ER','Empty'], a:1, why:'Nodes with large k have neighbours with large k: hubs befriend hubs.'},
 {k:'exam', h:'What to write', b:`<p>Definition, formula k<sub>nn</sub>(i), k<sub>nn</sub>(k) and how to read the plot, Pearson coefficient r, 2 examples (social networks assortative, Internet disassortative).</p>`}
]},
{id:'rob', title:'Network robustness', goal:'Failures vs attacks, breakdown threshold.', cards:[
 {k:'story', h:'Break a random node or the most important one?', b:`<p><b>Failure</b>: a random node breaks. <b>Attack</b>: the most connected nodes (hubs) are removed on purpose. We watch how fast the giant component falls apart.</p>`},
 {k:'num', h:'The star', b:`<p>Degrees 1, 1, 1, 1, 4. ⟨k⟩ = 1.6, ⟨k²⟩ = 4, κ = ⟨k²⟩/⟨k⟩ = 2.5 &gt; 2, so a giant component exists. Remove the centre (attack): 4 isolated nodes remain. Remove a leaf (failure): a star of 4 nodes remains. The hub decides everything.</p>`},
 {k:'formula', h:'Breakdown threshold', b:`<p><b>f<sub>c</sub> = 1 − 1/(κ − 1)</b>, where κ = ⟨k²⟩/⟨k⟩ (Molloy–Reed criterion: a giant component exists while κ &gt; 2).</p><p>ER: κ = ⟨k⟩ + 1, so f<sub>c</sub> = 1 − 1/⟨k⟩. Example ⟨k⟩ = 4 → f<sub>c</sub> = <b>0.75</b>. Scale-free with γ &lt; 3: ⟨k²⟩ is huge, f<sub>c</sub> → <b>1</b>: random failures can hardly break it.</p>`},
 {k:'quiz', q:'An ER network with ⟨k⟩ = 4. What fraction of nodes must be removed at random to destroy the giant component?', o:['25%','50%','75%','100%'], a:2, why:'f_c = 1 − 1/⟨k⟩ = 1 − 1/4 = 0.75.'},
 {k:'quiz', q:'Why is a scale-free network "robust to failures but vulnerable to attacks"?', o:['It has no hubs','A random node is almost always small, but removing hubs tears the network','It is very small','It has many components'], a:1, why:'A random pick hits a small node, while hubs hold the whole connectivity.'},
 {k:'exam', h:'Answer "Robustness and attacks"', b:`<ol class="big"><li>Definitions of failure and attack; giant component as the measure.</li><li>Molloy–Reed criterion and f<sub>c</sub>.</li><li>ER: gradual breakdown; scale-free: robust/fragile.</li><li>Kinds of attack: by degree, by betweenness, with recalculation.</li><li>Example: Internet, power grid.</li></ol>`}
]},
{id:'com', title:'Communities', goal:'Girvan–Newman and modularity.', cards:[
 {k:'story', h:'Groups inside a network', b:`<p>A <b>community</b> is a group of nodes with more links inside than outside. How to find it? <b>Girvan–Newman</b>: find the edge that carries the most shortest paths (a "bridge"), delete it, repeat. The network falls into groups.</p>`},
 {k:'num', h:'Two triangles and a bridge', b:`<p>Nodes 1,2,3 form a triangle, 4,5,6 another, plus the edge 3–4. Links L = 7. All paths between "left" and "right" nodes pass through edge 3–4, there are 3×3 = 9 such pairs, the maximum. Delete the bridge and you get two triangles.</p>`},
 {k:'formula', h:'Modularity Q', b:`<p><b>Q = Σ<sub>c</sub> [ L<sub>c</sub>/L − (k<sub>c</sub>/2L)² ]</b></p><table class="sym"><tr><td>L<sub>c</sub>/L</td><td>what share of all links lies inside group c</td></tr><tr><td>(k<sub>c</sub>/2L)²</td><td>what share would lie inside by chance</td></tr></table><p>Compute: group {1,2,3}: L<sub>c</sub> = 3, k<sub>c</sub> = 2+2+3 = 7. 3/7 − (7/14)² = 0.429 − 0.25 = 0.179. Two groups give <b>Q ≈ 0.357</b>. All nodes in one group give Q = 0.</p>`},
 {k:'quiz', q:'What is the modularity if all nodes are in one group?', o:['1','0','−1','0.5'], a:1, why:'L_c/L = 1 and (k_c/2L)² = 1, so Q = 0.'},
 {k:'quiz', q:'Which edge does Girvan–Newman remove at each step?', o:['the lowest weight','the highest edge betweenness','a random one','one joining hubs'], a:1, why:'Bridges between groups carry the most shortest paths.'},
 {k:'exam', h:'Answer "How are communities detected?"', b:`<ol class="big"><li>Definition of a community.</li><li>GN: edge betweenness → delete → recompute → dendrogram.</li><li>Pick the partition with maximum Q, formula of Q.</li><li>Greedy Newman: merges with the largest gain of Q.</li><li>GN complexity ≈ O(L²N), so it is slow.</li></ol>`}
]},
{id:'sp', title:'Epidemics: SI, SIS, SIR', goal:'Spreading models and the threshold.', cards:[
 {k:'story', h:'Three models', b:`<ul class="big"><li><b>SI</b>: healthy → sick, no recovery, in the end everyone is sick.</li><li><b>SIS</b>: healthy → sick → healthy again (a cold). There is a threshold: below it the disease dies out.</li><li><b>SIR</b>: healthy → sick → recovered with immunity. The outbreak dies out by itself.</li></ul><p>β is the probability of infecting along one link, μ the probability of recovering.</p>`},
 {k:'num', h:'SI on a chain', b:`<p>Chain 1–2–3–4–5, node 1 infected, β = 1. Step 1: {1,2}. Step 2: {1,2,3}. Step 3: {1,2,3,4}. After t steps everyone at distance ≤ t is infected: it is BFS by layers.</p>`},
 {k:'num', h:'SIS threshold with numbers', b:`<p>β = 0.2, μ = 0.1, so λ = β/μ = 2. Random network ⟨k⟩ = 4, threshold λ<sub>c</sub> = 1/⟨k⟩ = <b>0.25</b>. Since 2 &gt; 0.25, the disease spreads. At λ = 0.1 &lt; 0.25 it would die out.</p><p>For a network with hubs the threshold is λ<sub>c</sub> = ⟨k⟩/⟨k²⟩. For γ ≤ 3 the moment ⟨k²⟩ is huge, the threshold ≈ 0: the disease lives at any infectiousness.</p>`},
 {k:'quiz', q:'In which model does everyone get infected in the end (in a connected network)?', o:['SI','SIS','SIR','none'], a:0, why:'In SI there is no recovery, so the disease reaches everyone.'},
 {k:'quiz', q:'Why is the epidemic threshold almost zero in a scale-free network?', o:['It has no hubs','⟨k²⟩ is huge because of hubs','It has few nodes','It has no links'], a:1, why:'λ_c = ⟨k⟩/⟨k²⟩ and for γ ≤ 3 the denominator diverges.'},
 {k:'exam', h:'Answer "Describe the epidemic models"', b:`<ol class="big"><li>Compartments S, I, R and parameters β, μ.</li><li>Three models and their cycles.</li><li>Threshold: λ<sub>c</sub> = 1/⟨k⟩ (homogeneous), ⟨k⟩/⟨k²⟩ (heterogeneous).</li><li>Conclusion about hubs and vaccinating hubs.</li></ol>`}
]}
];

const UI={ru:{topics:'Темы',of:'Тема %1 из %2',kinds:{story:'Простыми словами',num:'Сначала числа',formula:'Формула по буквам',quiz:'Проверь себя',exam:'Как отвечать на экзамене'},sub:'13 тем по программе курса. Один экран = одна мысль.',ttl:'AACM · лёгкий курс',full:'← Подробный курс и тренажёр кода',hub:'← Study hub',prev:'← Назад',next:'Дальше →',finish:'Закончить тему',right:'Верно. ',wrong:'Не совсем. ',passed:'Тема «%1» пройдена',score:'Вопросы: %1 из %2 с первой попытки.',again:'Пройти заново',goto:'Дальше: %1 →'},
en:{topics:'Topics',of:'Topic %1 of %2',kinds:{story:'In plain words',num:'Numbers first',formula:'Formula symbol by symbol',quiz:'Check yourself',exam:'How to answer in the exam'},sub:'13 syllabus topics. One screen = one idea.',ttl:'AACM · easy course',full:'← Full course and code trainer',hub:'← Study hub',prev:'← Back',next:'Next →',finish:'Finish topic',right:'Correct. ',wrong:'Not quite. ',passed:'Topic "%1" completed',score:'Questions: %1 of %2 right on the first try.',again:'Start over',goto:'Next: %1 →'}};
const f=(s,...a)=>s.replace(/%(\d)/g,(m,i)=>a[i-1]);
let lang='ru';try{lang=localStorage.getItem('study-lang')==='en'?'en':'ru'}catch(e){}
const KEY='aacm-easy-v1';
let S={pos:{},quiz:{},done:{}};try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const T=()=>lang==='en'?TOPICS_EN:TOPICS, U=()=>UI[lang];
let cur=TOPICS[0].id;
const side=document.getElementById('side'),view=document.getElementById('view');
function qkey(t,i){return t.id+':'+i}
function renderSide(){
  side.innerHTML=`<div class="ttl">${U().ttl}</div>`+T().map((t,i)=>`<a data-id="${t.id}" class="${t.id===cur?'on':''} ${S.done[t.id]?'done':''}"><span class="n">${S.done[t.id]?'✓':i+1}</span>${t.title}</a>`).join('')+
  `<div class="links"><a href="aacm.html">${U().full}</a><a href="index.html">${U().hub}</a></div>`;
  side.querySelectorAll('a[data-id]').forEach(a=>a.onclick=()=>{go(a.dataset.id);side.classList.remove('open')});
  document.getElementById('menu').textContent='☰ '+U().topics;
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
  document.documentElement.lang=lang;
}
function go(id,keepScroll){cur=id;S.last=id;save();try{history.replaceState(null,'','#'+id)}catch(e){}render();renderSide();if(!keepScroll)window.scrollTo(0,0)}
function render(){
  const Ts=T(),t=Ts.find(x=>x.id===cur),i=S.pos[t.id]||0,c=t.cards[Math.min(i,t.cards.length-1)],u=U();
  const dots=t.cards.map((_,j)=>`<i class="${j<i?'ok':j===i?'on':''}"></i>`).join('');
  const last=i>=t.cards.length;let body='';
  if(last){
    const nxt=Ts[Ts.indexOf(t)+1];
    const qs=t.cards.map((c,j)=>[c,j]).filter(x=>x[0].k==='quiz');
    const right=qs.filter(([c,j])=>S.quiz[qkey(t,j)]===c.a).length;
    body=`<div class="card fin"><div class="big">✓</div><h3>${f(u.passed,t.title)}</h3><p>${f(u.score,right,qs.length)}</p><div class="nav" style="justify-content:center"><button class="btn ghost" id="again">${u.again}</button>${nxt?`<button class="btn" id="nxt">${f(u.goto,nxt.title)}</button>`:''}</div></div>`;
  } else if(c.k==='quiz'){
    const a=S.quiz[qkey(t,i)];
    body=`<div class="card"><span class="kind k-quiz">${u.kinds.quiz}</span><div class="q">${c.q}</div>${c.o.map((o,j)=>`<button class="opt ${a!==undefined?(j===c.a?'good':j===a?'bad':''):''}" data-j="${j}" ${a!==undefined?'disabled':''}>${o}</button>`).join('')}${a!==undefined?`<div class="why"><b>${a===c.a?u.right:u.wrong}</b>${c.why}</div>`:''}</div>`;
  } else body=`<div class="card"><span class="kind k-${c.k}">${u.kinds[c.k]}</span><h3>${c.h}</h3>${c.b}</div>`;
  const canNext=last||!(c.k==='quiz'&&S.quiz[qkey(t,i)]===undefined);
  view.innerHTML=`<div class="tag">${f(u.of,Ts.indexOf(t)+1,Ts.length)}</div><h2 class="tp">${t.title}</h2><p class="goal">${t.goal}</p><div class="dots">${dots}</div>${body}${last?'':`<div class="nav"><button class="btn ghost" id="prev" ${i===0?'disabled':''}>${u.prev}</button><button class="btn" id="next" ${canNext?'':'disabled'}>${i===t.cards.length-1?u.finish:u.next}</button></div>`}`;
  view.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.quiz[qkey(t,i)]=+b.dataset.j;save();render()});
  const nx=document.getElementById('next');if(nx)nx.onclick=()=>{S.pos[t.id]=i+1;if(i+1>=t.cards.length)S.done[t.id]=true;save();render();renderSide();window.scrollTo(0,0)};
  const pv=document.getElementById('prev');if(pv)pv.onclick=()=>{S.pos[t.id]=Math.max(0,i-1);save();render()};
  const ag=document.getElementById('again');if(ag)ag.onclick=()=>{S.pos[t.id]=0;t.cards.forEach((c,j)=>delete S.quiz[qkey(t,j)]);save();render()};
  const nt=document.getElementById('nxt');if(nt)nt.onclick=()=>go(Ts[Ts.indexOf(t)+1].id);
}
document.getElementById('menu').onclick=()=>side.classList.toggle('open');
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem('study-lang',lang)}catch(e){}renderSide();render()});
