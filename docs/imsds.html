<!DOCTYPE html>
<html lang="ru" data-lang="ru">
<head>
<meta charset="utf-8">
<script>
/* тема: auto | light | dark, хранится в study-theme (синхронизируется с Telegram) */
(function(){
  var R=document.documentElement, m='auto';
  try{m=localStorage.getItem('study-theme')||'auto'}catch(e){}
  function sys(){var w=window.Telegram&&Telegram.WebApp; if(w&&w.initData&&w.colorScheme) return w.colorScheme; return (window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light'}
  function apply(){
    var r=m==='auto'?sys():m; R.setAttribute('data-theme',r); R.style.colorScheme=r;
    var b=document.querySelector('.themebtn'); if(b){b.textContent=m==='auto'?'◐':(m==='dark'?'☾':'☀'); b.title={auto:'Тема: авто',light:'Тема: светлая',dark:'Тема: тёмная'}[m]; b.setAttribute('aria-label',b.title)}
    try{var w=window.Telegram&&Telegram.WebApp; if(w&&w.initData){w.setHeaderColor&&w.setHeaderColor(r==='dark'?'#121315':'#FBFBFA'); w.setBackgroundColor&&w.setBackgroundColor(r==='dark'?'#121315':'#FBFBFA')}}catch(e){}
  }
  window.__theme={get:function(){return m},apply:apply,cycle:function(){m=m==='auto'?'light':(m==='light'?'dark':'auto'); try{localStorage.setItem('study-theme',m)}catch(e){} apply()}};
  apply();
  function mount(){
    apply();
    if(document.querySelector('.themebtn')) return;
    var anchor=document.querySelector('[data-langsw]'); if(!anchor) return;
    var b=document.createElement('button'); b.type='button'; b.className='themebtn'; b.onclick=function(){window.__theme.cycle()};
    anchor.parentNode.insertBefore(b,anchor); apply();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',mount); else mount();
  window.addEventListener('load',apply);
  try{matchMedia('(prefers-color-scheme:dark)').addEventListener('change',apply)}catch(e){}
  /* если Telegram подтянул более новый study-theme из облака, страница перезагрузится синхронизацией */
})();
</script>

:root[data-theme="dark"] .short + .board{--board:#E2D47E}
:root[data-theme="dark"] .ex .controls label,:root[data-theme="dark"] .ex p,:root[data-theme="dark"] .ex li{color:#17181C}

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
/* JulYera study sync: Telegram CloudStorage <-> localStorage, вход только через бота */
(function(){
  var BOT_URL='https://t.me/dsstudyhub_bot';                 // ссылка на бота, например https://t.me/ИМЯ_БОТА
  var PFX=/^(imsds-|mmmds-|aacm-|study-)/, CH=3500, tg=window.Telegram&&Telegram.WebApp;
  var inTg=!!(tg&&tg.initData);
  var dev=false; try{ if(/[?&]dev=1/.test(location.search)) sessionStorage.setItem('dev','1'); dev=sessionStorage.getItem('dev')==='1'; }catch(e){}
  var origSet=Storage.prototype.setItem;
  function gate(){
    if(inTg||dev) return;
    var s=document.createElement('style');
    s.textContent='#gate{position:fixed;inset:0;z-index:99999;background:#FBFBFA;color:#17181C;display:grid;place-items:center;padding:24px;text-align:center;font:16px/1.5 Onest,system-ui,sans-serif}#gate b{display:block;font:600 22px Unbounded,sans-serif;margin-bottom:10px}#gate p{max-width:34ch;margin:0 auto 18px;color:#5D5F69}#gate a{display:inline-block;background:#557546;color:#fff;text-decoration:none;padding:12px 22px;border-radius:999px;font-weight:600}';
    document.head.appendChild(s);
    function mk(){ var d=document.createElement('div'); d.id='gate'; d.innerHTML='<div><b>JulYera study hub</b><p>Обучалки открываются только через Telegram-бота: так прогресс привязан к твоему аккаунту.</p>'+(BOT_URL?'<a href="'+BOT_URL+'">Открыть бота</a>':'')+'</div>'; document.body.appendChild(d); document.body.style.overflow='hidden'; }
    if(document.body) mk(); else document.addEventListener('DOMContentLoaded',mk);
  }
  gate();
  if(!inTg) return;
  try{ tg.ready(); tg.expand(); }catch(e){}
  var cs=tg.CloudStorage, timers={};
  function lsKeys(){ var o=[]; for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(PFX.test(k)) o.push(k); } return o; }
  function push(k){
    var v=localStorage.getItem(k); if(v==null) return;
    var ts=+localStorage.getItem('__ts_'+k)||Date.now(), n=Math.max(1,Math.ceil(v.length/CH));
    for(var i=0;i<n;i++) cs.setItem(k+'_'+i, v.slice(i*CH,(i+1)*CH));
    cs.setItem(k+'_m', JSON.stringify({n:n,ts:ts}));
  }
  Storage.prototype.setItem=function(k,v){
    origSet.call(this,k,v);
    if(this===localStorage && PFX.test(k) && k.indexOf('__ts_')!==0){
      origSet.call(this,'__ts_'+k,String(Date.now()));
      clearTimeout(timers[k]); timers[k]=setTimeout(function(){push(k)},1500);
    }
  };
  document.addEventListener('visibilitychange',function(){ if(document.hidden) lsKeys().forEach(push); });
  cs.getKeys(function(err,keys){
    if(err||!keys) return;
    var metas=keys.filter(function(x){return /_m$/.test(x)}), left=metas.length, changed=false, seen={};
    function finish(){
      lsKeys().forEach(function(k){ if(!seen[k]) push(k); });
      var done=false; try{ done=sessionStorage.getItem('synced')==='1'; }catch(e){}
      if(changed && !done){ try{sessionStorage.setItem('synced','1');}catch(e){} location.reload(); }
    }
    if(!left) return finish();
    metas.forEach(function(mk){
      var k=mk.slice(0,-2); seen[k]=1;
      cs.getItem(mk,function(e,mv){
        var m={}; try{m=JSON.parse(mv)}catch(x){}
        var lts=+localStorage.getItem('__ts_'+k)||0;
        if(m.ts>lts && m.n){
          var names=[]; for(var i=0;i<m.n;i++) names.push(k+'_'+i);
          cs.getItems(names,function(e2,vals){
            if(!e2&&vals){ var s=''; names.forEach(function(nm){ s+=vals[nm]||''; });
              if(s && s!==localStorage.getItem(k)){ origSet.call(localStorage,k,s); changed=true; }
              origSet.call(localStorage,'__ts_'+k,String(m.ts)); }
            if(--left===0) finish();
          });
        } else { if(lts>m.ts) push(k); if(--left===0) finish(); }
      });
    });
  });
})();
</script>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMSDS Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* IMSDS Studio, JulYera look: warm white paper, ink, one green accent, pastel category blocks, dark pill nav.
   Layout: header pill nav + lesson sidebar (drawer on phones) + one view at a time. */
:root{
  --bg:#FBFBFA; --card:#FFFFFF; --ink:#17181C; --muted:#5D5F69; --line:#E6E6E1; --soft:#F1F1EE;
  --green:#557546; --green-soft:#E4EDDF; --yellow:#E2D47E; --lav:#DCE5FB; --blue:#85AACB; --mint:#A9C89D;
  --bad:#B3402F; --bad-soft:#F6E3DF; --ok:#3E6B33; --ok-soft:#E4EDDF; --hi:#F3E9A8; --pastel-ink:#17181C;
  --f-d:"Unbounded","Segoe UI",system-ui,sans-serif; --f-b:"Onest","Segoe UI",system-ui,sans-serif; --f-m:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121315; --card:#1B1C20; --ink:#F1F1EE; --muted:#A5A7B0; --line:#2C2E34; --soft:#23252B;
  --green:#8DB57B; --green-soft:#223020; --lav:#2B3552; --yellow:#E2D47E; --bad:#F0907F; --bad-soft:#3A2420; --ok:#9BCB89; --ok-soft:#223020; --hi:#5A4F1C;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121315; --card:#1B1C20; --ink:#F1F1EE; --muted:#A5A7B0; --line:#2C2E34; --soft:#23252B;
  --green:#8DB57B; --green-soft:#223020; --lav:#2B3552; --yellow:#E2D47E; --bad:#F0907F; --bad-soft:#3A2420; --ok:#9BCB89; --ok-soft:#223020; --hi:#5A4F1C;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-b);-webkit-text-size-adjust:100%}
a{color:var(--green)}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100vh}
/* header */
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand b{font:600 15px var(--f-d);white-space:nowrap}
.brand b span{color:var(--muted);font-weight:500}
.pill{display:flex;gap:4px;padding:5px;border-radius:26px;background:#17181C;margin-left:auto}
.pill a,.pill button{border:0;background:transparent;color:#D5D6DC;font:500 14px var(--f-b);padding:8px 14px;border-radius:20px;text-decoration:none;cursor:pointer;white-space:nowrap}
.pill a[aria-current="page"]{background:#fff;color:#17181C;font-weight:600}
.pill a:hover{color:#fff}.pill a[aria-current="page"]:hover{color:#17181C}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--card)}
.lang button{border:0;background:transparent;color:var(--muted);font:600 12px var(--f-b);padding:7px 11px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
#menuBtn{display:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;height:40px;padding:0 14px;font:600 14px var(--f-b);cursor:pointer}
/* sidebar */
.side{border-right:1px solid var(--line);padding:16px 12px 40px max(12px,env(safe-area-inset-left,0px));position:sticky;top:65px;height:calc(100vh - 65px);overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.side h4{margin:16px 8px 6px;font:600 11px var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.side h4 i{width:10px;height:10px;border-radius:50%;display:inline-block}
.side a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;text-decoration:none;color:var(--ink);font-size:14px;line-height:1.3}
.side a:hover{background:var(--soft)}
.side a[aria-current="page"]{background:var(--card);box-shadow:0 0 0 1px var(--line);font-weight:600}
.side .n{font:600 11px var(--f-m);color:var(--muted);min-width:24px}
.side .t{flex:1;min-width:0}
.side .ck{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:10px;color:#fff}
.side .ck.on{background:var(--green);border-color:var(--green)}
.side .soon{opacity:.55}
.prog{margin:2px 10px 6px;height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
/* main */
main{min-width:0;padding:28px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px))}
.view{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.view.wide{max-width:1100px}
.tag{font:600 11px/1.3 var(--f-m);letter-spacing:.12em;text-transform:uppercase;color:var(--green)}
h1{font:600 clamp(24px,4.4vw,36px)/1.15 var(--f-d);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 em{font-style:normal;color:var(--green)}
.en{color:var(--muted);font-size:14px;margin:4px 0 0}
.vhead{display:flex;flex-direction:column;gap:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px clamp(16px,3vw,26px);display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{font:600 clamp(17px,2.6vw,20px)/1.25 var(--f-d);margin:0;text-wrap:balance}
.card p{margin:0;max-width:70ch}
.card ul,.card ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.step{display:flex;align-items:center;gap:12px}
.num{font:600 14px/1 var(--f-d);background:var(--ink);color:var(--bg);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;flex:none}
.short{background:var(--lav);border-color:transparent;color:var(--pastel-ink)}
:root[data-theme="dark"] .short,:root:not([data-theme="light"]) .short{color:var(--ink)}
@media (prefers-color-scheme:light){.short{color:var(--pastel-ink)}}
.short h2{font:600 12px var(--f-m);letter-spacing:.12em;text-transform:uppercase}
.ex{background:var(--yellow);border-color:transparent;color:#17181C}
.ex .num{background:#17181C;color:#fff}
.ex p,.ex li{color:#17181C}
.ex .controls label{color:#33353D}
mark{background:var(--hi);color:inherit;padding:0 4px;border-radius:4px}
.hand{font:500 15px/1.5 var(--f-b);color:var(--green);border-left:3px solid var(--green);padding-left:12px;margin:0}
.f{font-family:var(--f-m);font-size:.92em;white-space:nowrap}
.formula{font:600 clamp(14px,2.2vw,17px)/1.6 var(--f-m);background:var(--soft);border-radius:14px;padding:12px 16px;overflow-x:auto;text-align:center}
.formula small{display:block;font:400 13px/1.4 var(--f-b);color:var(--muted);margin-top:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.row>*,.row3>*,.row4>*{min-width:0}
@media (max-width:760px){.row,.row3{grid-template-columns:1fr}.row4{grid-template-columns:repeat(2,1fr)}}
.mini{border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:var(--bg);min-width:0}
.mini h3{margin:0;font:600 14px var(--f-d)}
.mini p{font-size:14px;color:var(--muted)}
.mini .k{font:600 12px var(--f-m);color:var(--green)}
.tint-lav{background:var(--lav);border-color:transparent;color:var(--pastel-ink)}
.tint-yel{background:var(--yellow);border-color:transparent;color:#17181C}
.tint-blue{background:var(--blue);border-color:transparent;color:#17181C}
.tint-mint{background:var(--mint);border-color:transparent;color:#17181C}
.tint-lav h3,.tint-lav p,.tint-yel p,.tint-blue p,.tint-mint p{color:inherit}
:root[data-theme="dark"] .tint-lav,:root:not([data-theme="light"]) .tint-lav{color:var(--ink)}
@media (prefers-color-scheme:light){.tint-lav{color:var(--pastel-ink)}}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:left;vertical-align:top}
table.t th{font:600 11px var(--f-m);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
table.t td.m,.mono{font-family:var(--f-m);font-size:13px}
table.t tr.hl td{background:var(--hi)}
.scroll-x{overflow-x:auto}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
label{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
input[type=range]{accent-color:var(--green);width:170px;max-width:56vw}
input[type=text],input[type=number],textarea,select{font:14px var(--f-m);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 11px}
textarea{width:100%;resize:vertical}
button{font:600 14px var(--f-b);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 15px;cursor:pointer}
button:hover{border-color:var(--green)}
button.primary{background:var(--green);border-color:var(--green);color:#fff}
button.on,button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.readout{font:400 14px/1.5 var(--f-m);display:flex;flex-wrap:wrap;gap:6px 18px;font-variant-numeric:tabular-nums}
.readout b{color:var(--green)}
.ex .readout b{color:#17181C}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}

.sw{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
svg{display:block;width:100%;max-width:100%}
.ax text{fill:var(--muted);font:11px var(--f-m)}
.gl{stroke:var(--line)}
.axl{stroke:var(--muted);stroke-width:1}
.lbl{fill:var(--ink);font:600 12px var(--f-b)}
.small{fill:var(--muted);font:11px var(--f-b)}

/* ===== helpers ===== */
const LESSONS = [];
const BI = (ru, en) => '<span class="l-ru">' + ru + '</span><span class="l-en">' + en + '</span>';
const $ = (s, r = document) => r.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const SV = (t, a = {}, p, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; if (p) p.appendChild(e); return e; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sum = a => a.reduce((s, x) => s + x, 0);
const mean = a => sum(a) / a.length;
const fmt = (v, d = 2) => { if (v === null || v === undefined || Number.isNaN(v)) return '—'; return (+v.toFixed(d)).toString().replace('-', '−'); };
const rng = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const gauss = r => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const tipEl = document.getElementById('tip');
const hover = (el, f) => { el.addEventListener('mousemove', e => { tipEl.textContent = f(); tipEl.style.display = 'block'; tipEl.style.left = (e.clientX + 12) + 'px'; tipEl.style.top = (e.clientY + 12) + 'px'; }); el.addEventListener('mouseleave', () => tipEl.style.display = 'none'); };
const niceStep = raw => { const p = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw / p; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p; };
const ticks = (a, b, n = 5) => { const st = niceStep((b - a) / n); const o = []; for (let v = Math.ceil(a / st - 1e-9) * st; v <= b + 1e-9; v += st) o.push(+v.toFixed(10)); return o; };
/* chart frame */
function chart(svg, o) {
  svg.innerHTML = '';
  const W = o.W || 600, H = o.H || 280, Lm = o.L ?? 48, Rm = o.R ?? 14, T = o.T ?? 14, B = o.B ?? 34;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const pw = W - Lm - Rm, ph = H - T - B;
  const X = v => Lm + (v - o.x0) / (o.x1 - o.x0) * pw, Y = v => T + ph - (v - o.y0) / (o.y1 - o.y0) * ph;
  const g = SV('g', { class: 'ax' }, svg);
  (o.yticks || ticks(o.y0, o.y1, 5)).forEach(v => { SV('line', { x1: Lm, x2: W - Rm, y1: Y(v), y2: Y(v), class: 'gl' }, g); SV('text', { x: Lm - 6, y: Y(v) + 4, 'text-anchor': 'end' }, g, o.yfmt ? o.yfmt(v) : fmt(v, 1)); });
  (o.xticks || []).forEach(v => { SV('text', { x: X(v), y: T + ph + 16, 'text-anchor': 'middle' }, g, o.xfmt ? o.xfmt(v) : fmt(v, 1)); });
  SV('line', { x1: Lm, x2: W - Rm, y1: T + ph, y2: T + ph, class: 'axl' }, g);
  if (o.xlabel) SV('text', { x: Lm + pw / 2, y: H - 3, 'text-anchor': 'middle', class: 'small' }, g, o.xlabel);
  if (o.ylabel) SV('text', { x: 11, y: T + ph / 2, 'text-anchor': 'middle', class: 'small', transform: `rotate(-90 11 ${T + ph / 2})` }, g, o.ylabel);
  return { X, Y, pw, ph, T, B, Lm, Rm, W, H, svg };
}

/* control chart with rule detection */
W.control = n => {
  const SC = [['ok', 'Под контролем'], ['out', 'Выход за пределы'], ['shift', 'Сдвиг: 7 подряд по одну сторону'], ['trend', 'Тренд из 7 точек'], ['zone', '2 из 3 и 4 из 7 у предела'], ['cyc', 'Периодичность'], ['tight', 'Слишком близко к центру']];
  n.innerHTML = `<div class="chips" data-ch></div><div class="scroll-x"><svg data-svg></svg></div><div class="kv" data-kv></div><ul data-msg></ul>`;
  let cur = 'ok', seed = 11;
  const series = () => {
    const R = rng(seed), N = 30; let z = Array.from({ length: N }, () => Math.max(-1.9, Math.min(1.9, gauss(R) * .8)));
    if (cur === 'out') { z[6] = -3.5; z[19] = 3.6; }
    if (cur === 'shift') for (let i = 10; i < 19; i++) z[i] = .3 + R() * .9;
    if (cur === 'trend') for (let i = 0; i < 9; i++) z[12 + i] = -1.4 + i * .42 + R() * .05;
    if (cur === 'zone') { z[7] = 2.3; z[9] = 2.6; [19, 20, 22, 24].forEach((i, k) => z[i] = 2.2 + k * .15); z[21] = .2; z[23] = -.3; }
    if (cur === 'cyc') z = z.map((_, i) => 1.8 * Math.sin((i + .5) * Math.PI / 3));
    if (cur === 'tight') z = z.map(() => (R() - .5) * 1.1);
    return z;
  };
  const rules = z => {
    const N = z.length, fl = new Set(), msgs = []; const add = (a, m) => { a.forEach(i => fl.add(i)); msgs.push(m); };
    const o = z.map((v, i) => Math.abs(v) > 3 ? i : -1).filter(i => i >= 0); if (o.length) add(o, `Точки за пределами контрольных границ: №${o.map(i => i + 1).join(', ')}.`);
    let run = [], any = false; const sg = v => v > 0 ? 1 : -1;
    for (let i = 0; i <= N; i++) { if (i < N && run.length && sg(z[i]) === sg(z[run[0]])) run.push(i); else { if (run.length >= 7) { add(run, `${run.length} точек подряд по одну сторону от центральной линии (№${run[0] + 1}–${run[run.length - 1] + 1}).`); any = true; } run = i < N ? [i] : []; } }
    if (!any) for (const [k, w] of [[10, 11], [12, 14], [16, 20]]) for (let s = 0; s + w <= N; s++) { const win = z.slice(s, s + w); const pos = win.filter(v => v > 0).length; if (pos >= k || w - pos >= k) { add([...Array(w).keys()].map(j => s + j), `${k} точек из ${w} по одну сторону от центра.`); s = N; break; } }
    for (let s = 0; s + 7 <= N; s++) { let up = true, dn = true; for (let j = s + 1; j < s + 7; j++) { if (!(z[j] > z[j - 1])) up = false; if (!(z[j] < z[j - 1])) dn = false; } if (up || dn) { add([...Array(7).keys()].map(j => s + j), `Тренд: 7 подряд ${up ? 'растущих' : 'убывающих'} точек (с №${s + 1}).`); break; } }
    let done = false; for (const sd of [1, -1]) { for (let s = 0; s + 3 <= N && !done; s++) { const idx = [0, 1, 2].map(j => s + j).filter(i => z[i] * sd > 2); if (idx.length >= 2) { add(idx, `2 точки из 3 между 2/3 предела и самим пределом (№${idx.map(i => i + 1).join(', ')}).`); done = true; } } }
    done = false; for (const sd of [1, -1]) { for (let s = 0; s + 7 <= N && !done; s++) { const idx = [...Array(7).keys()].map(j => s + j).filter(i => z[i] * sd > 2); if (idx.length >= 4) { add(idx, `4 точки из 7 в зоне 2/3…предел (№${idx.map(i => i + 1).join(', ')}).`); done = true; } } }
    const rl = []; let c = 1; for (let i = 1; i < N; i++) { if (sg(z[i]) === sg(z[i - 1])) c++; else { rl.push(c); c = 1; } } rl.push(c);
    if (rl.length >= 6 && Math.max(...rl) <= 4 && Math.min(...rl) >= 2 && Math.max(...rl) - Math.min(...rl) <= 1) msgs.push('Периодический ход точек: волна с постоянным шагом.');
    if (N >= 15 && z.every(v => Math.abs(v) < 1.5)) msgs.push('Почти все точки в пределах половины контрольных границ: данные «слишком кучные» (возможно, смешаны разные источники или неверно рассчитаны пределы).');
    return { fl, msgs };
  };
  const draw = () => {
    const z = series(), mu = 50, sd = 2, val = z.map(v => mu + sd * v); const { fl, msgs } = rules(z);
    const c = chart($('[data-svg]', n), { W: 640, H: 280, x0: 0, x1: 31, y0: 42, y1: 58, xticks: [1, 5, 10, 15, 20, 25, 30], yticks: [44, 47, 50, 53, 56], xfmt: v => v, xlabel: 'номер измерения', L: 40 });

/* ===== lesson helpers ===== */
const wd = (name, attrs = '') => `<div data-w="${name}" ${attrs}></div>`;
const pk = k => `<div data-w="pick" data-k="${k}"></div>`;
const card = (h, b, cls = '') => `<section class="card ${cls}"><h2>${h}</h2>${b}</section>`;
const exc = (h, b) => `<section class="card ex"><div class="step"><span class="num">1</span><h2>${h}</h2></div>${b}</section>`;
const F = (t, s = '') => `<div class="formula">${t}${s ? `<small>${s}</small>` : ''}</div>`;
const facts = a => `<div class="facts">${a.map(([t, p, g]) => `<div class="fact ${g ? 'good' : ''}"><b>${t}</b><p>${p}</p></div>`).join('')}</div>`;
const minis = a => `<div class="row3">${a.map(([k, t, p]) => `<div class="mini"><span class="k">${k}</span><h3>${t}</h3><p>${p}</p></div>`).join('')}</div>`;
const tbl = (head, rows) => `<div class="scroll-x"><table class="t"><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
const hand = t => `<p class="hand">${t}</p>`;
const trap = (title, arr) => card(title, facts(arr));
function mk(d) {
  d.html = `<div class="vhead"><span class="tag">${d.group}</span><h1>${d.title}</h1>${d.en ? `<p class="en">${d.en}</p>` : ''}${d.asks ? `<p class="asks">${d.asks}</p>` : ''}</div>` +
    `<section class="card short"><h2>Коротко</h2><p>${d.short}</p></section>` + d.body;
  LESSONS.push(d);
}

      <div class="mini"><span class="k">UNI EN ISO 9000:2026</span><h3>Действующее</h3><p>Степень, в которой набор присущих (inherent) характеристик объекта выполняет требования. Можно говорить «плохое, хорошее, отличное». «Присущий» противоположен «присвоенному»: существует в самом объекте.</p></div></div>
      ${hand('Два взгляда: «пригодность к использованию» (рынок) и «соответствие спецификации» (производство). Организация изучает рынок, превращает потребности в спецификации, продукт обязан им соответствовать.')}`) +
    card('Базовые понятия до начала', minis([['Organization', 'Организация', 'человек или группа с функциями, ответственностью, полномочиями и отношениями для достижения целей'], ['Market', 'Рынок', 'место обмена благами и услугами между покупателями и продавцами'], ['Goods / Services', 'Блага и услуги', 'блага осязаемы, услуги это работа в пользу получателя']]) + `<p>Consumer: лицо, покупающее товары и услуги для собственного использования.</p>`) +
    card('Reliability и Maintainability', `<div class="row"><div class="mini"><h3>Reliability (надёжность)</h3><p>Способность объекта выполнять требуемые функции при определённых нагрузках в течение заданного времени.</p></div><div class="mini"><h3>Maintainability (ремонтопригодность)</h3><p>Способность продукта легко и быстро подвергаться обслуживанию и ремонту.</p></div></div><p>Оба были фундаментальными требованиями к продукту в фазе «система качества» (1930–1950, военная сфера).</p>`) +
    trap('Ловушки', [['Quality assurance сегодня', 'Это часть менеджмента качества, нацеленная на повышение способности выполнять требования (9000:2015 в лекции). Родилась в ядерной отрасли.', 0], ['Total Quality', 'Включает всё, создающее удовлетворённость потребителя: сервис, соответствие, цену, сроки.', 1], ['Даты', 'Инспекция 1900–1920, QC 1920–1930, система 1930–1950, QA и TQ с 1960.', 0]])
});

mk({
  id: 'q03', group: 'Часть 1 · Качество', menu: 'Total Quality: TQC и CWQC', title: 'Total Quality Control и Company Wide Quality Control', en: 'TQC, CWQC, 9M of Feigenbaum',
  asks: '9M Фейгенбаума, чем TQC отличается от CWQC (Исикава), принципы и политики Total Quality.',
  short: 'TQC (Feigenbaum) интегрирует технологии качества во все функции ради удовлетворённости потребителя. CWQC (Ishikawa) различается культурой: хорошая продукция по низкой цене, выгода делится между потребителями, сотрудниками и акционерами.',
  body:
    exc('9M: девять слов на M', `<p>Markets, Money, Management, Men, Motivation, Materials, Machines and mechanization, Modern information methods, Mounting product requirements. Это ровно девять факторов. Нажмите, чтобы прочитать суть каждого.</p>${pk('nineM')}`) +
    card('TQC и CWQC: в чём разница', `<div class="row"><div class="mini"><span class="k">TQC · Feigenbaum, США</span><h3>Система интеграции</h3><p>Интегрирует технологии качества во все бизнес-функции для удовлетворённости потребителя. Total Quality System: организационная структура, документированная в интегрированной системе, чтобы координировать людей, машины и информацию при минимальных затратах.</p></div>
      <div class="mini"><span class="k">CWQC · Ishikawa, Япония</span><h3>Культурная перспектива</h3><p>Хорошие продукты по низкой цене, выгода делится между потребителями, сотрудниками и акционерами, чтобы повысить качество жизни.</p></div></div><p>Главное отличие не в факторах и инструментах, а в культуре. В CWQC весь персонал обучен базовым статистическим инструментам. В «старой» схеме (AQL, zero defects) качеством занимаются специалисты, остальные не вовлечены.</p>`) +
    card('Восемь принципов «ментальности» Total Quality', `<ol><li>Высокая забота о людях: человек в центре.</li><li>Приоритет качества.</li><li>Больше контактов компании и рынка.</li><li>Внутренние цепочки производитель-потребитель.</li><li>Работа с данными.</li><li>Умение выделять приоритеты.</li><li>Контроль процессов, а не только продуктов.</li><li>Организационная лояльность.</li></ol>`) +
    card('Четыре базовые политики', pk('tqcPolicies')) +
    trap('Ловушки', [['Качество создают те, кто работает', 'Не те, кто контролирует: система держится на вовлечённости, профессионализме и мотивации.', 1], ['Money в 9M', 'Цикл перестраивают ради снижения затрат, продажи растут без изменения цены или с более высокой ценой (цена = качество).', 0], ['AQL', 'Acceptable Quality Level это логика «допустимого брака», специалисты вместо всех сотрудников.', 0]])
});

mk({
  id: 'q04', group: 'Часть 1 · Качество', menu: 'PDCA, Quality circle, CEDAC', title: 'Цикл Деминга, Quality circle и CEDAC', en: 'PDCA, quality circle, CEDAC',
  asks: 'Фазы PDCA, maintenance vs improvement, кто в quality circle, как строится CEDAC.',
  short: 'PDCA это цикл непрерывного улучшения. Quality circle: 8–10 добровольцев из одной зоны решают операционные проблемы. CEDAC: диаграмма «причины-следствия» с карточками для проблем всей компании, видимая всем, с индикаторами на стороне следствий.',
  body:
    exc('Цифры quality circle', `<p>Группа 8–10 человек из одной производственной зоны, собираются периодически и добровольно, обычно 5–6 встреч. Лекция даёт пропорцию 80% и 20%: операционные проблемы (чёрным шрифтом на схеме) охватывают подавляющую часть тем кружка.</p><p>CEDAC шире: решает проблемы, затрагивающие все функциональные зоны, не только операционные.</p>`) +
    card('PDCA, фазы по порядку', pk('pdca') + `<p>В Act два сценария: <b>maintenance</b> (результат устраивает: стандартизируем и распространяем) и <b>improvement</b> (не устраивает: открываем новый цикл PDCA).</p>`) +
    card('Quality circle', `<ul><li>Добровольность участия. Руководство отвечает за финансирование, помещения, подготовку лидера и информирование сотрудников.</li><li>Лидер: умеет вовлекать, оставляет место творчеству, даёт критерии отбора проблем, сильная личность. Координирует, обеспечивает информацией и инструментами, представляет предложения руководству в кодифицированном виде.</li><li>Обучение: PDCA и семь статистических инструментов.</li><li>Предложения идут с экономическим анализом «затраты / выгода».</li><li>Если руководство принимает, готовит план внедрения и информирует всех, от какого кружка идея. Если отклоняет, обязано публично объяснить причину.</li><li>Эффект: развитие способностей, самоуважение, больше уважения руководителя к подчинённым и контактов между людьми.</li></ul>`) +
    card('CEDAC: Cause and Effect Diagram with the Addition of Cards', wd('cedac') + `<ul><li>Выглядит как плакат в месте обсуждения проблемы, виден и доступен всем. Слева причины, справа эффекты с непрерывно обновляемыми индикаторами (графики, таблицы, гистограммы).</li><li>Проблему поручает топ-менеджмент CEDAC Leader, он собирает команду. Встречи короткие, но частые.</li></ul>
      <ol><li>Определить параметры измерения результатов (индикаторы).</li><li>Определить частоту сбора.</li><li>Определить целевые значения.</li><li>Собрать карточки причин.</li><li>Собрать карточки идей улучшения.</li><li>Отобрать и протестировать идеи.</li><li>Определить и внедрить новые стандарты.</li></ol>`) +
    card('Сильные стороны CEDAC', `<ul><li>Много вовлечённых людей, знания и идеи всех, видно каждому.</li><li>Метод закрепляет культуру улучшений и привычку к причинно-следственным связям, мгновенная обратная связь.</li><li>Улучшение интегрируется с операционной работой каждый день.</li></ul>`) +
    trap('Ловушки', [['Circle ≠ CEDAC', 'Circle: малая группа и операционные проблемы. CEDAC: проблемы всех функций, ходит по всей компании через плакат.', 0], ['Act', 'Не просто «действуй»: два исхода, стандартизация или новый цикл.', 0], ['Check', 'Учитывает не только технико-экономические, но и человеческие и экологические эффекты.', 1]])
});
mk({
  id: 'q05', group: 'Часть 1 · Качество', menu: 'Затраты на качество', title: 'Затраты на качество', en: 'Costs of quality',
  asks: 'Шесть видов затрат, что к каким относится, как ведут себя кривые при росте внедрения системы качества.',
  short: 'Затраты качества это расходы на обеспечение и поддержание качества плюс расходы, возникающие, когда качество не достигнуто. Шесть видов: prevention, appraisal, internal failure, external failure, indirect, intangible.',
  body:
    exc('Двигаем внедрение системы качества', `<p>Сдвигайте ползунок от 0% до 100%. Prevention растёт, appraisal чуть растёт, failure падает сильнее, итоговые затраты уменьшаются. На схеме лекции: на оси 0%, 50%, 100% внедрения.</p>${wd('cost')}`) +
    card('Шесть видов затрат', `<div class="row3">
      <div class="mini tint-mint"><span class="k">Prevention</span><h3>Предотвращение</h3><p>Расходы на изучение, предотвращение и снижение риска несоответствий или дефектов. Технические гонорары по контролю качества, разработка измерительного и испытательного оборудования, отбор поставщиков, обучение качеству.</p></div>
      <div class="mini tint-blue"><span class="k">Appraisal</span><h3>Оценка</h3><p>Расходы на проверку степени соответствия заданным требованиям. Оценка поставщика и входящих материалов, лабораторные приёмочные испытания.</p></div>
      <div class="mini tint-yel"><span class="k">Internal failure</span><h3>Внутренние потери</h3><p>Несоответствия, найденные до выхода на рынок. Брак, труд и материалы на ремонт, переделку, повторные испытания.</p></div>
      <div class="mini tint-lav"><span class="k">External failure</span><h3>Внешние потери</h3><p>Несоответствия, найденные после выхода на рынок. Обработка рекламаций, возврат дефектных изделий.</p></div>
      <div class="mini"><span class="k">Indirect</span><h3>Косвенные</h3><p>Следствие нерациональности продукта или неверной организации. Например, избыточный запас на складе на случай отбраковки партий.</p></div>
      <div class="mini"><span class="k">Intangible</span><h3>Нематериальные</h3><p>Прямо влияют на имидж, связаны с неудовлетворённостью клиентов. Трудно оценить, нет прямого денежного оттока.</p></div></div>`) +
    card('Как запомнить', `<p>Prevention и appraisal это деньги, которые платят, чтобы качество было (&laquo;costs to guarantee and maintain quality&raquo;). Failure это деньги, которые платят, потому что качества нет. Внутренние потери найдены до рынка, внешние после.</p>`) +
    trap('Ловушки', [['Внутренние и внешние', 'Граница «до или после выхода на рынок». Рекламации всегда внешние.', 0], ['Склад как косвенные затраты', 'Лишний запас на случай брака это косвенные затраты, не внутренние потери.', 0], ['Нематериальные', 'Их сложно оценить именно потому, что нет прямого денежного оттока.', 1]])
});

mk({
  id: 'q06', group: 'Часть 1 · Качество', menu: 'Статинструменты I: лист проверки, гистограмма, рассеяние', title: 'Семь статистических инструментов, часть I', en: 'Check sheet, histogram, scatter diagram',
  asks: 'Шесть фаз построения гистограммы, формулы K, H, R; что такое check sheet; сколько пар для scatter.',
  short: 'Семь basic tools: check sheet, histogram, scatter, control chart, Pareto, Ishikawa, stratification. Они дают операторам научную методику поиска проблем.',
  body:
    exc('Строим гистограмму цифрами', `<p>Пусть N = 36 измерений. K ≈ √36 = 6 классов. Если max = 10,18 и min = 9,84, то R = 10,18 − 9,84 = 0,34, ширина класса H = R/K = 0,34 / 6 ≈ 0,0567. Нижняя граница первого класса = m = 9,84, верхняя = m + H ≈ 9,897 и так далее. Попробуйте с другим N.</p>${wd('histogram')}
      ${F('K ≈ √N      R = M − m      H = R / K', 'значение на границе класса записывают в верхний класс')}`) +
    card('Check sheet', `${wd('check')}<ul><li>Отправная точка: определить, что наблюдать, объём выборки, куда записывать.</li><li>Данные бывают: непрерывные измерения, счётные дискретные, оценки важности, порядковые данные, шкальные оценки.</li><li>Цель сбора определяется точно, метод записи наименее подверженный ошибкам, допускающий агрегацию.</li><li>Любое решение принимается только на основе собранного.</li></ul><p class="small" style="color:var(--muted)">Пример выше: прерывания телефонных звонков по неделям, штрихи по пять.</p>`) +
    card('Scatter diagram', `${wd('scatter')}<ul><li>Выбрать две переменные, провести <b>не менее 30 пар</b> измерений, нанести точки, добавить легенду (период сбора, число данных, среднее, стандартное отклонение).</li><li>Виды: положительная, отрицательная, нет корреляции, возможная положительная, возможная отрицательная, нет линейной корреляции.</li></ul>`) +
    card('Шесть фаз гистограммы', `<ol><li>Max M, min m, размах R = M − m.</li><li>Число классов K ≈ √N.</li><li>Ширина класса H = R/K.</li><li>Границы от минимума: нижняя = m, верхняя = m + H, далее прибавляем H.</li><li>Таблица частот.</li><li>Рисуем гистограмму.</li></ol><p>Понятия: <b>class</b> (интервал), <b>frequency</b> (число элементов в классе), <b>dispersion</b> (размах между max и min).</p>`) +
    trap('Ловушки', [['Dispersion в лекции', 'Это размах R, а не дисперсия σ².', 0], ['Минимум 30 пар', 'Для scatter, чтобы снизить статистическую неопределённость.', 1], ['Граничное значение', 'Идёт в верхний класс.', 0]])
});

mk({
  id: 'q07', group: 'Часть 1 · Качество', menu: 'Статинструменты II: карты, Парето, Исикава', title: 'Семь статистических инструментов, часть II', en: 'Control chart, Pareto, Ishikawa, stratification',
  asks: 'Правила контрольной карты, общие и особые причины, Парето, ветви Исикавы, стратификация.',
  short: 'Контрольная карта показывает, под контролем ли процесс: все точки внутри границ и расположены случайно. Парето выделяет приоритетные причины, Исикава структурирует причины, стратификация разделяет данные по источникам.',
  body:
    exc('Контрольная карта: ищем сигналы', `<p>Среднее 50, границы 44 и 56. Выберите сценарий: красные точки показывают, какое правило сработало. Под контролем только когда <b>нет</b> ни выходов за границы, ни закономерностей.</p>${wd('control')}`) +
    card('Правила из лекции', `<ul><li>7 подряд точек по одну сторону от центральной линии, а также 10 из 11, 12 из 14, 16 из 20.</li><li>Возрастающий или убывающий тренд не менее чем из 7 подряд точек.</li><li>2 точки из 3 или 4 из 7 в диапазоне между 2/3 границы и самой границей.</li><li>Периодический ход точек.</li><li>Почти все точки в диапазоне между половиной верхней и половиной нижней границы (слишком «кучно»).</li></ul>
      <p><b>Common causes</b>: присутствуют всегда, даже при стандартных материалах и методах. <b>Special causes</b>: посторонние элементы, нужно анализировать и устранять, вводя предупреждающие действия.</p><p>Цели карты: степень контроля процесса, прогноз потерь, оценка производительности.</p>`) +
    card('Pareto', `<p>Меняйте числа и смотрите, сколько причин покрывают 80%. Зелёные столбцы это приоритетные причины.</p>${wd('pareto')}`) +
    card('Cause-and-effect (Ishikawa)', `<p>Выявляет множество возможных причин эффекта, структурирует мозговой штурм и сразу сортирует идеи по категориям. Основные ветви в лекции: <b>Methods, Manpower, Materials, Machines</b>, справа проблема (effect).</p>`) +
    card('Stratification', `<p>Анализ явления не целиком, а с разбиением и повторной агрегацией по признакам. В лекции пример с абсентеизмом. Смотрите, как меняется картина при разных срезах.</p>${wd('strat')}<p class="small" style="color:var(--muted)">В лекции стратификация названа также «Flowchart». Для экзамена запомните оба названия.</p>`) +
    trap('Ловушки', [['Под контролем ≠ все точки внутри границ', 'Нужно ещё случайное распределение точек.', 0], ['Special causes', 'Результат несоблюдения стандартов или применения неверных. Их устраняют.', 0], ['Слишком кучные точки', 'Тоже сигнал, а не «идеальный процесс».', 1]])
});

mk({
  id: 'q08', group: 'Часть 1 · Качество', menu: 'Инструменты менеджмента (7 new tools)', title: 'Управленческие инструменты качества', en: 'Management tools of quality',
  asks: 'Почему нужны, кто разработал, три группы по семи инструментам.',
  short: 'Статистические инструменты реактивны: убирают причины проблем. Управленческие инструменты подходят для проектного, качественного подхода и нацелены на менеджеров. Их разработал комитет JUSE в 1972–1976.',
  body:
    exc('Три группы, семь инструментов: 2 + 3 + 2', `<p>Группа 1 «Анализ и формулировка» = 2 инструмента. Группа 2 «Меры для решения» = 3 инструмента. Группа 3 «План решения» = 2 инструмента. Всего 7.</p>`) +
    card('Группа 1: анализ и формулировка проблемы', pk('mgmt1')) + card('Группа 2: определить меры решения', pk('mgmt2')) + card('Группа 3: планировать решение', pk('mgmt3')) +
    card('Почему статистических инструментов мало', `<ol><li>Жалобы лишь верхушка айсберга неудовлетворённости.</li><li>Решается только часть качества, «негативное качество» (разница между текущей ситуацией и идеальной).</li><li>Только числами нельзя выразить реальность многих процессов, нужен глубокий анализ.</li></ol>
      <p>JUSE (Japanese Union of Scientists and Engineers), комитет под руководством Yoshinobu Natayami, создан в 1972, завершил работу в конце 1976. Свойства инструментов: простые, интегрированный пакет, стандартизированная процедура, графический язык, обработка словесной информации, «думать руками».</p>`)
});

mk({
  id: 'q09', group: 'Часть 1 · Качество', menu: 'ISO 9000: принципы', title: 'ISO 9000:2026: принципы и концепции качества', en: 'ISO 9000 principles',
  asks: 'Семь принципов, десять основных и двенадцать дополнительных концепций, как соотносятся ISO 9000, 9001 и 9004.',
  short: 'ISO 9000 даёт фундамент и словарь менеджмента качества, не содержит требований для сертификации. Семь принципов: ориентация на потребителя, лидерство, вовлечённость людей, процессный подход, улучшение, решения на фактах, управление взаимоотношениями.',
  body:
    exc('7 + 10 + 12', `<p>Раздел 4 «Quality fundamentals» в ISO 9000:2026 различает: <b>7</b> принципов, <b>10</b> основных (fundamental) концепций (4.3.1–4.3.10) и <b>12</b> дополнительных значимых концепций (4.4.1–4.4.12). Раньше фундамент был в разделе 2, теперь в разделе 4.</p>`) +

    card('Десять основных концепций (4.3)', pk('concepts')) +
    card('Двенадцать дополнительных (4.4)', pk('concepts2')) +

mk({
  id: 'q10', group: 'Часть 1 · Качество', menu: 'ISO 9004: самооценка', title: 'ISO 9004:2018', en: 'Guidance to achieve sustained success',
  asks: 'Что даёт ISO 9004, как устроена самооценка: 30 таблиц, 5 уровней зрелости.',
  short: 'ISO 9004:2018 это руководство по повышению способности организации достигать устойчивого успеха. Приложение A содержит инструмент самооценки зрелости.',
  body:
    exc('Самооценка в цифрах', `<p>30 таблиц самооценки. В каждой таблице 5 уровней зрелости, на каждом уровне несколько пунктов, отвечаем «да» или «нет». Уровни 3–5 это прогрессия мышления на основе руководства подпункта. Таблицами пользуются гибко: все или выборочно, адаптируя.</p><p>Пример подпункта 5.2 Relevant interested parties: уровень 1 стороны определены ad hoc, уровень 5 потребности всех релевантных сторон анализируются, оцениваются и пересматриваются, есть устойчивое улучшение.</p>`) +
    card('Что даёт', `<ul><li>Руководства для повышения способности достигать устойчивого успеха в сложной, меняющейся среде.</li><li>Метод самооценки (Appendix A) полноты внедрения концепций.</li><li>Единые термины с ISO 9000:2026 и ISO 9001:2026.</li><li>Увязка стратегии и политики с идентичностью организации: миссия, видение, ценности, стиль управления и культура.</li><li>Фокус на «качестве организации»: способность отвечать на потребности клиентов и других сторон.</li></ul>
      <p class="hand">Определение: устойчивый успех достигается способностью удовлетворять потребности клиентов и других сторон долгосрочно и сбалансированно.</p>`) +
    card('Зачем самооценка', `<ul><li>Находить возможности для улучшения и инноваций.</li><li>Задавать приоритеты и планы действий.</li><li>Видеть сильные и слабые стороны.</li><li>Фиксировать прогресс через периодические повторения.</li><li>Использовать как входные данные management review.</li><li>Учиться и вовлекать заинтересованные стороны.</li></ul>`)
});

mk({
  id: 'q11', group: 'Часть 1 · Качество', menu: 'ISO 9001:2026: разделы', title: 'ISO 9001:2026', en: 'Clauses 4–10 and main changes',
  asks: 'Структура разделов 4–10, что требует каждый, что изменилось в редакции 2026.',
  short: 'ISO 9001 определяет требования к QMS и по нему сертифицируют. Структура повторяет HS: разделы 1–3 вводные, 4–10 требования по PDCA. Редакция 2026 вводит культуру качества, раздельные риски и возможности, детальное планирование изменений.',
  body:
    exc('Что изменилось: пять пунктов и два приложения', `<ol><li>Раздел 3 содержит термины, общие для систем менеджмента.</li><li>Требования охватывают культуру качества и этичное поведение.</li><li>Риски и возможности разделены (6.1.2 и 6.1.3).</li><li>Планирование изменений детальнее (6.3).</li><li>Включена климатическая поправка 2024.</li></ol><p>Annex A расширен, Annex B удалён.</p>`) +
    card('Карта разделов ISO 9001:2026', `<p class="asks">Нажмите раздел: внутри подпункты. Цвета: Plan, Do, Check, Act.</p>${wd('clauses', 'data-k="iso"')}`) +
    card('Intent: зачем нужен каждый пункт (по слайдам)', `<p>На слайдах каждый пункт снабжён блоком «Intent of the requirement»: смысл требования, а не его буква. Так про пункты и спрашивают в открытых вопросах: «зачем это нужно».</p>${tbl(['Пункт','Зачем требование (intent)'],[["4.1 Контекст организации", "Контекст задаёт рамки: от него зависят область, планирование и пересмотр QMS. Факторы бывают благоприятными и неблагоприятными и меняются со временем."], ["4.2 Заинтересованные стороны", "Организация понимает, какие ожидания влияют на соответствие и удовлетворённость клиентов. Эта информация идёт в область и планирование."], ["4.3 Область QMS", "Область показывает, какие виды деятельности, продукты и услуги входят в систему. Решения о применимости должны согласовываться с ответственностью организации."], ["4.4 QMS и процессы", "Процессы работают как единая система. Документированная информация поддерживает работу и служит доказательством, что дела выполнены по плану."], ["5.1.1 Лидерство и приверженность", "Приверженность руководства видна по решениям и поведению. Культура качества проявляется в общих ценностях, отношении и повседневных действиях."], ["5.1.2 Ориентация на клиента", "Ориентация на клиента направляет решения руководства и управление процессами. Это и соответствие того, что поставляется, и способность со временем повышать удовлетворённость."], ["5.2 Политика качества", "Политика выражает намерения руководства и направляет цели и решения. Её ценность зависит от применения в процессах и от того, понимают ли её люди."], ["5.3 Роли и полномочия", "Люди должны знать, кто решает, кто действует и кто отчитывается. Ясные обязанности поддерживают работу QMS и управление изменениями."], ["6.1.1 Определение рисков и возможностей", "Планирование предвосхищает эффекты неопределённости: учитываются и возможные негативные последствия, и благоприятные условия, дающие выгоду."], ["6.1.2 Действия в отношении рисков", "Организация решает, как обращаться с риском в своём контексте: избежать, снизить, разделить или принять осознанно (retain)."], ["6.1.3 Действия в отношении возможностей", "Управление возможностями помогает осознанно улучшать результаты. Примеры в стандарте помогают увидеть возможности, отвечающие меняющимся потребностям."], ["6.2 Цели качества", "Цели переводят политику в проверяемые результаты. Планирование связывает каждую цель с действиями и ресурсами, нужными для её достижения."], ["6.3 Планирование изменений", "Управление изменениями должно позволять QMS достигать результатов во время и после перемен. Разбор результатов помогает оценить последствия решений."], ["7.1 Ресурсы, люди и среда процессов", "Ресурсы должны обеспечивать эффективную работу процессов. Условия труда и поведение в организации влияют на качество результата."], ["7.1.5 Ресурсы мониторинга и измерений", "Надёжные результаты требуют ресурсов, подходящих по назначению. Метрологическая прослеживаемость даёт уверенность в измерениях, когда она требуется."], ["7.1.6 Знания организации", "Знания поддерживают непрерывность и эффективность процессов. Когда ими делятся и применяют, меньше зависимости от отдельных людей и легче справляться с изменениями."], ["7.2 Компетентность", "Организация проверяет, что люди могут выполнять порученное. Прохождение курса само по себе компетентность не доказывает."], ["7.3 Осведомлённость", "Люди понимают, как их работа связана с результатами QMS. Осведомлённость связывает требования, обязанности и повседневное поведение."], ["7.4 Коммуникация", "Коммуникация доносит информацию QMS до нужных людей и сторон. Определённые ответственные и способы повышают её эффективность."], ["7.5 Документированная информация", "Документы поддерживают работу и показывают результаты. Объём зависит от размера организации, видов деятельности, сложности процессов и компетентности людей."], ["8.1 Планирование и управление операциями", "План превращается в управляемые условия работы. Критерии и свидетельства позволяют убедиться, что процессы идут по плану, а выходы соответствуют требованиям."], ["8.2 Требования к продуктам и услугам", "Организация берёт только те обязательства, которые может выполнить. Диалог с клиентом помогает уточнить требования и изменения и справиться с ситуациями, угрожающими поставке."], ["8.3 Проектирование и разработка", "Проектирование переводит потребности в продукты и услуги, пригодные для предполагаемого использования. Процесс может быть итеративным: циклы разработки, контроля и обратной связи."], ["8.4 Внешние поставщики", "Контроль внешних поставщиков соразмерен их влиянию на соответствие. Ответственность за поставку клиентам соответствующих продуктов и услуг остаётся на организации."], ["8.5 Производство и предоставление услуг", "Управление операциями поддерживает соответствие на всём протяжении поставки. Сюда входят предотвращение человеческой ошибки и валидация процессов, результат которых нельзя проверить позже."], ["8.6 и 8.7 Выпуск и несоответствующие выходы", "Запланированные проверки проходят до поставки, если иное не разрешено должным образом. Управление несоответствующими выходами ограничивает последствия, в том числе проблемы после поставки."], ["9.1 Мониторинг, измерение, анализ и оценка", "Надёжные данные поддерживают решения. Оценка показывает, достигают ли процессы, действия и система запланированных результатов."], ["9.2 Внутренний аудит", "Аудиты дают надёжную информацию о работе системы. Свидетельства помогают руководству увидеть слабые места и возможности улучшения."], ["9.3 Анализ со стороны руководства", "Анализ связывает свидетельства результативности с решениями руководства. Приоритеты и ресурсы обновляются в ответ на результаты и значимые перемены."], ["10.1 Постоянное улучшение", "Информация о результативности должна приводить к действиям на пользу системе. Улучшать можно продукты, услуги, процессы и способность достигать намеченных результатов."], ["10.2 Несоответствие и корректирующее действие", "Коррекция устраняет обнаруженную проблему. Корректирующее действие устраняет её причины, чтобы не допустить повторения или появления в другом месте; действия соразмерны последствиям."]])}`) +
    card('Три вещи, которые чаще всего спрашивают', `<ul><li><b>8.7 Nonconforming outputs</b>: управление несоответствиями, документированная информация о коррекции и уступках.</li><li><b>9.2 Internal audit</b>: программа с учётом важности процессов, изменений и прошлых результатов, объективность и беспристрастность.</li><li><b>10.2</b>: коррекция (исправить последствие) ≠ корректирующее действие (устранить причину).</li></ul>`)
});

mk({
  id: 'q12', group: 'Часть 1 · Качество', menu: 'Риск-ориентированное мышление', title: 'Risk-based thinking в ISO 9001', en: 'Risk-based thinking, 4 T',
  asks: 'Где в ISO 9001 риски, риск ≠ возможность, вероятность × тяжесть, четыре T.',
  short: 'Risk-based thinking это системный учёт рисков и возможностей в каждом решении. Оценка риска: вероятность и тяжесть. Реакции: Tolerate, Treat, Transfer, Terminate. Формальный риск-менеджмент стандарт не требует.',
  body:
    exc('Оцениваем риск числом', `<p>Вероятность оцениваем от 1 до 5, тяжесть от 1 до 5. Например, P = 2 (маловероятно), S = 4 (серьёзно): оценка 2 × 4 = 8, средний уровень, обычно Treat. Двигайте ползунки.</p>${wd('risk')}`) +
    card('Риск и возможность', `<ul><li>У риска последствия могут быть как отрицательными, так и положительными.</li><li>Opportunity не «положительная сторона риска», а набор обстоятельств, позволяющий что-то сделать. Брать или не брать возможность связано с разным уровнем риска.</li><li>Пример лекции: перейти дорогу напрямую быстрее, но выше риск травмы; мост вдоль дороги безопаснее, но дольше.</li><li>Между вероятностью и тяжестью нет корреляции: риск не катастрофичен лишь потому, что вероятен.</li></ul>`) +
    card('4 T', minis([['Tolerate', 'Принять', 'устранение нерентабельно или вероятность крайне мала'], ['Treat', 'Обработать', 'снизить вероятность или тяжесть'], ['Transfer', 'Передать', 'страхование, оговорки об ответственности'], ['Terminate', 'Прекратить', 'убрать рискованную деятельность или процесс']])) +
    card('Где риски в ISO 9001', `<ul><li>Раздел 4: определить процессы QMS и учесть риски и возможности.</li><li>Раздел 5: руководство поддерживает осознанность risk-based thinking и определяет риски, влияющие на соответствие.</li><li>Раздел 6: определить риски и возможности и действия по ним.</li><li>Раздел 7 и 8: ресурсы и операционные процессы; риск подразумевается, когда сказано «подходящий».</li><li>Раздел 9: оценить результативность действий. Раздел 10: исправлять, предотвращать и обновлять риски.</li></ul><p>ISO 31000 полезен как справочник для формального подхода, но необязателен.</p>`) +
    card('Дорожная карта', `<ol><li>Определить риски (зависит от контекста).</li><li>Приоритизировать управление процессами.</li><li>Сбалансировать риски и возможности: что приемлемо, что неприемлемо.</li><li>Спланировать действия.</li><li>Внедрить.</li><li>Проверить результативность.</li><li>Учиться на опыте и улучшать.</li></ol>`)
});

let TS = { tab: 'practice', lesson: 'all', idx: 0, seq: [], mock: null, oralIdx: 0, oralShow: false, seed: 1 };
const shuffle = (a, r) => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
function genItem(g, seed) { const o = g.make(rng(seed)); return { id: g.id + ':' + seed, gen: g.id, lesson: g.lesson, type: 'num', q: o.q, a: o.a, tol: o.tol, why: o.why }; }

function startMock() {
  const r = rng(Date.now() & 0xffff);
  const mcs = shuffle(BANK, r).slice(0, 20), gens = shuffle(GEN, r).slice(0, 4).map(g => genItem(g, 1 + Math.floor(r() * 9000)));
  const items = shuffle(mcs.concat(gens), r); TS.mock = { items, ans: {}, left: 30 * 60, done: false };
}
function tMock(el) {
  const M = TS.mock;
  if (!M) { el.innerHTML = `<section class="card"><h2>Мок-тест</h2><p>24 вопроса: 20 тестовых и 4 числовых задачи. 30 минут. Результат пересчитывается в шкалу 30, порог 18. Ошибки попадают в разбор.</p><div class="mocks"><button class="primary" id="go">Начать</button></div></section>`; $('#go').onclick = () => { startMock(); tMock(el); }; return; }
  if (M.done) { const ok = M.items.filter(it => M.ans[it.id] && M.ans[it.id].ok).length, sc = Math.round(ok / M.items.length * 30);
    el.innerHTML = `<section class="card"><h2>Результат: ${sc}/30 ${sc >= 18 ? '(порог пройден)' : '(ниже порога 18)'}</h2><p>Верных ответов: ${ok} из ${M.items.length}.</p>${M.items.map((it, i) => { const a = M.ans[it.id]; return `<div class="fact ${a && a.ok ? 'good' : ''}"><b><span>${i + 1}.</span> ${esc(it.q)}</b><p>${a ? (a.ok ? 'Верно. ' : 'Неверно. ') : 'Без ответа. '}${esc(it.why)}</p></div>`; }).join('')}<div class="pager"><button class="primary" id="again">Ещё раз</button></div></section>`; $('#again').onclick = () => { TS.mock = null; tMock(el); }; return; }
  el.innerHTML = `<div class="timerbar"><span class="clock" id="clk"></span><span>Отвечено: <b id="cnt">0</b> / ${M.items.length}</span><button class="primary" id="fin">Завершить</button></div>` + M.items.map((it, i) => `<section class="card" data-q="${i}">${qHtml(it, i, M.items.length, false)}</section>`).join('');
  const upd = () => { $('#cnt').textContent = Object.keys(M.ans).length; };
  el.querySelectorAll('[data-q]').forEach(c => { const i = +c.dataset.q, it = M.items[i];
    if (it.type === 'mc') c.querySelectorAll('.opt').forEach((b, k) => b.onclick = () => { M.ans[it.id] = { ok: k === it.a, v: k }; c.querySelectorAll('.opt').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); upd(); });
    else { const inp = c.querySelector('#numIn'), btn = c.querySelector('#chk'); inp.removeAttribute('id'); btn.removeAttribute('id'); btn.textContent = 'Записать'; btn.onclick = () => { const v = parseFloat(inp.value.replace(',', '.')); if (Number.isNaN(v)) return; M.ans[it.id] = { ok: Math.abs(v - it.a) <= it.tol, v }; btn.textContent = 'Записано'; upd(); }; } });
  const clock = () => { const m = Math.floor(M.left / 60), s = M.left % 60; const c = $('#clk'); if (!c) return; c.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0'); c.classList.toggle('low', M.left < 300); };
  const end = () => { stopTimer(); M.done = true; M.items.forEach(it => { const a = M.ans[it.id]; if (!it.gen && !(a && a.ok)) { TR.res[it.id] = { ok: false, ts: Date.now() }; } else if (!it.gen) TR.res[it.id] = { ok: true, ts: Date.now() }; }); const sc = Math.round(M.items.filter(it => M.ans[it.id] && M.ans[it.id].ok).length / M.items.length * 30); TR.mocks.push({ ts: Date.now(), sc }); save(KT, TR); tMock(el); };
  $('#fin').onclick = end; clock(); stopTimer(); timer = setInterval(() => { M.left--; clock(); if (M.left <= 0) end(); }, 1000);
}
/* oral */
function tOral(el) {
  const pool = ORAL.filter(o => TS.lesson === 'all' || o[0] === TS.lesson); const i = Math.min(TS.oralIdx, pool.length - 1), it = pool[i];
  el.innerHTML = `<div class="tgrid">${trail()}<section class="card">${it ? `<p class="qno">${lessonName(it[0])} · устный вопрос ${i + 1} из ${pool.length}</p><p class="statement">${esc(it[1])}</p>${TS.oralShow ? `<p class="solution">${esc(it[2])}</p><div class="ans"><button id="kn">Знаю</button><button id="dk">Не знаю</button></div>` : '<div class="ans"><button class="primary" id="sh">Показать ответ</button></div>'}<p class="small" style="color:var(--muted)">Сначала скажите ответ вслух, потом проверьте.</p><div class="pager"><button id="pv" ${i ? '' : 'disabled'}>← Назад</button><button id="nx" ${i < pool.length - 1 ? '' : 'disabled'}>Дальше →</button></div>` : '<p>В этой теме нет устных вопросов.</p>'}</section></div>`;
  el.querySelectorAll('.trail [data-l]').forEach(b => b.onclick = () => { TS.lesson = b.dataset.l; TS.oralIdx = 0; TS.oralShow = false; tOral(el); });
  if (!it) return;
  const go = d => { TS.oralIdx = i + d; TS.oralShow = false; tOral(el); };
  $('#pv').onclick = () => go(-1); $('#nx').onclick = () => go(1);
  if ($('#sh')) $('#sh').onclick = () => { TS.oralShow = true; tOral(el); };
  if ($('#kn')) { $('#kn').onclick = () => { TR.oral[it[1]] = 1; save(KT, TR); if (i < pool.length - 1) go(1); }; $('#dk').onclick = () => { TR.oral[it[1]] = 0; save(KT, TR); if (i < pool.length - 1) go(1); }; }
}
/* review */
function tReview(el) {
  const ids = Object.entries(TR.res).filter(([, r]) => !r.ok).map(([id]) => id); const items = ids.map(id => BANK.find(b => b.id === id)).filter(Boolean);
  if (!items.length) { el.innerHTML = '<section class="card"><h2>Разбор ошибок</h2><p>Пока нет ошибок. Ответьте на вопросы в практике или мок-тесте.</p></section>'; return; }
  TS.revIdx = Math.min(TS.revIdx || 0, items.length - 1); const it = items[TS.revIdx];
  el.innerHTML = `<section class="card" id="qcard">${qHtml(it, TS.revIdx, items.length, false)}<div class="pager"><button id="pv" ${TS.revIdx ? '' : 'disabled'}>← Назад</button><button id="nx" ${TS.revIdx < items.length - 1 ? '' : 'disabled'}>Дальше →</button></div></section>`;
  $('#pv').onclick = () => { TS.revIdx--; tReview(el); }; $('#nx').onclick = () => { TS.revIdx++; tReview(el); };
  const card = $('#qcard'); card.querySelectorAll('.opt').forEach((b, k) => b.onclick = () => { const ok = k === it.a; record(it, ok); $('#vd').innerHTML = verdict(it, ok) + (ok ? '<p class="small">Вопрос убран из разбора.</p>' : ''); card.querySelectorAll('.opt').forEach((x, j) => { x.disabled = true; if (j === it.a) x.classList.add('right'); else if (j === k) x.classList.add('wrong'); }); });
}
