const DICT={"# Контекст организации": "# Context of the organization", "Контекст задаёт рамки: от него зависят область, планирование и пересмотр QMS. Факторы бывают благоприятными и неблагоприятными и меняются со временем.": "Understanding the context guides the scope, planning and review of the QMS. Issues can have favourable or unfavourable effects and may change over time.", "# Заинтересованные стороны": "# Interested parties", "Организация понимает, какие ожидания влияют на соответствие и удовлетворённость клиентов. Эта информация идёт в область и планирование.": "The organization understands which expectations can affect conformity and customer satisfaction. This information informs the scope and planning.", "# Область QMS": "# QMS scope", "Область показывает, какие виды деятельности, продукты и услуги входят в систему. Решения о применимости должны согласовываться с ответственностью организации.": "The scope clarifies which activities, products and services are included in the system. Applicability decisions must be consistent with the organization’s responsibilities.", "# QMS и процессы": "# QMS and processes", "Процессы работают как единая система. Документированная информация поддерживает работу и служит доказательством, что дела выполнены по плану.": "Processes should operate as a coherent system. Documented information supports work and provides evidence that activities are carried out as planned.", "#.# Лидерство и приверженность": "#.# Leadership and commitment", "Приверженность руководства видна по решениям и поведению. Культура качества проявляется в общих ценностях, отношении и повседневных действиях.": "Management commitment is demonstrated through observable decisions and behaviours. Quality culture is reflected in shared values, attitudes and daily actions.", "#.# Ориентация на клиента": "#.# Customer focus", "Ориентация на клиента направляет решения руководства и управление процессами. Это и соответствие того, что поставляется, и способность со временем повышать удовлетворённость.": "Customer focus guides management decisions and process management. It concerns both the conformity of what is provided and the ability to improve satisfaction over time.", "# Политика качества": "# Quality policy", "Политика выражает намерения руководства и направляет цели и решения. Её ценность зависит от применения в процессах и от того, понимают ли её люди.": "The policy expresses management’s intentions and guides objectives and decisions. Its value depends on application within processes and understanding by people.", "# Роли и полномочия": "# Roles and authorities", "Люди должны знать, кто решает, кто действует и кто отчитывается. Ясные обязанности поддерживают работу QMS и управление изменениями.": "People need to know who decides, who acts and who reports results. Clear responsibilities support QMS operation and the management of changes.", "#.# Определение рисков и возможностей": "#.# Determining risks and opportunities", "Планирование предвосхищает эффекты неопределённости: учитываются и возможные негативные последствия, и благоприятные условия, дающие выгоду.": "Planning anticipates the effects of uncertainty. The organization considers both potential negative consequences and favourable conditions that may deliver benefits.", "#.# Действия в отношении рисков": "#.# Actions to address risks", "Организация решает, как обращаться с риском в своём контексте: избежать, снизить, разделить или принять осознанно (retain).": "The organization decides how to address risks in its context. It may avoid, reduce, share or retain a risk through an informed decision.", "#.# Действия в отношении возможностей": "#.# Actions to address opportunities", "Управление возможностями помогает осознанно улучшать результаты. Примеры в стандарте помогают увидеть возможности, отвечающие меняющимся потребностям.": "Managing opportunities supports informed choices to improve results. The standard’s examples help identify possibilities aligned with changing needs and expectations.", "# Цели качества": "# Quality objectives", "Цели переводят политику в проверяемые результаты. Планирование связывает каждую цель с действиями и ресурсами, нужными для её достижения.": "Objectives translate the policy into verifiable results. Planning connects each objective to the actions and resources needed to achieve it.", "# Планирование изменений": "# Planning of changes", "Управление изменениями должно позволять QMS достигать результатов во время и после перемен. Разбор результатов помогает оценить последствия решений.": "Change management should enable the QMS to achieve intended results during and after a change. Reviewing results helps assess the effects of decisions.", "# Ресурсы, люди и среда процессов": "# Resources, people and the process environment", "Ресурсы должны обеспечивать эффективную работу процессов. Условия труда и поведение в организации влияют на качество результата.": "Resources must support effective process operation. Working conditions and organizational behaviours can influence the quality of results.", "#.# Ресурсы мониторинга и измерений": "#.# Monitoring and measuring resources", "Надёжные результаты требуют ресурсов, подходящих по назначению. Метрологическая прослеживаемость даёт уверенность в измерениях, когда она требуется.": "Reliable results require resources suitable for their intended purpose. Metrological traceability supports confidence in measurements when required or essential for valid results.", "#.# Знания организации": "#.# Organizational knowledge", "Знания поддерживают непрерывность и эффективность процессов. Когда ими делятся и применяют, меньше зависимости от отдельных людей и легче справляться с изменениями.": "Knowledge supports process continuity and effectiveness. Sharing and applying it reduces reliance on individuals and helps address change.", "# Компетентность": "# Competence", "Организация проверяет, что люди могут выполнять порученное. Прохождение курса само по себе компетентность не доказывает.": "The organization verifies that people can perform their assigned activities. Attendance at a training course alone does not automatically demonstrate competence.", "# Осведомлённость": "# Awareness", "Люди понимают, как их работа связана с результатами QMS. Осведомлённость связывает требования, обязанности и повседневное поведение.": "People understand how their work relates to QMS results. Awareness connects requirements, responsibilities and daily behaviours.", "# Коммуникация": "# Communication", "Коммуникация доносит информацию QMS до нужных людей и сторон. Определённые ответственные и способы повышают её эффективность.": "Communication enables QMS information to reach relevant people and interested parties. Defined responsibilities and methods support its effectiveness.", "# Документированная информация": "# Documented information", "Документы поддерживают работу и показывают результаты. Объём зависит от размера организации, видов деятельности, сложности процессов и компетентности людей.": "Documented information supports work and demonstrates results. Its extent depends on size, activities, process complexity and people’s competence.", "# Планирование и управление операциями": "# Operational planning and control", "План превращается в управляемые условия работы. Критерии и свидетельства позволяют убедиться, что процессы идут по плану, а выходы соответствуют требованиям.": "Planning is translated into controlled operating conditions. Criteria and evidence allow the organization to verify that processes operate as planned and outputs conform.", "# Требования к продуктам и услугам": "# Requirements for products and services", "Организация берёт только те обязательства, которые может выполнить. Диалог с клиентом помогает уточнить требования и изменения и справиться с ситуациями, угрожающими поставке.": "The organization makes commitments it can fulfil. Customer dialogue helps clarify requirements and changes and manage situations that may affect supply.", "# Проектирование и разработка": "# Design and development", "Проектирование переводит потребности в продукты и услуги, пригодные для предполагаемого использования. Процесс может быть итеративным: циклы разработки, контроля и обратной связи.": "Design translates needs into products and services suitable for their intended use. The text clarifies that the process may be iterative, with cycles of development, control and feedback.", "# Внешние поставщики": "# External providers", "Контроль внешних поставщиков соразмерен их влиянию на соответствие. Ответственность за поставку клиентам соответствующих продуктов и услуг остаётся на организации.": "External providers require controls consistent with their influence on conformity. The organization remains responsible for providing conforming products and services to customers.", "# Производство и предоставление услуг": "# Production and service provision", "Управление операциями поддерживает соответствие на всём протяжении поставки. Сюда входят предотвращение человеческой ошибки и валидация процессов, результат которых нельзя проверить позже.": "Operational control supports conformity throughout provision. It includes prevention of human error and validation of processes whose results cannot be verified later.", "# и # Выпуск и несоответствующие выходы": "# and # Release and nonconforming outputs", "Запланированные проверки проходят до поставки, если иное не разрешено должным образом. Управление несоответствующими выходами ограничивает последствия, в том числе проблемы после поставки.": "Release ensures planned checks precede delivery, unless appropriately authorized otherwise. Managing nonconforming outputs limits consequences, including when problems arise after delivery.", "# Мониторинг, измерение, анализ и оценка": "# Monitoring, measurement, analysis and evaluation", "Надёжные данные поддерживают решения. Оценка показывает, достигают ли процессы, действия и система запланированных результатов.": "Reliable data and information support decisions. Evaluation helps determine whether processes, actions and the system achieve planned results.", "# Внутренний аудит": "# Internal audit", "Аудиты дают надёжную информацию о работе системы. Свидетельства помогают руководству увидеть слабые места и возможности улучшения.": "Audits provide reliable information on how the system operates. Evidence helps management identify weaknesses and opportunities for improvement.", "# Анализ со стороны руководства": "# Management review", "Анализ связывает свидетельства результативности с решениями руководства. Приоритеты и ресурсы обновляются в ответ на результаты и значимые перемены.": "Review connects performance evidence to management decisions. It enables priorities and resources to be updated in response to results and relevant changes.", "# Постоянное улучшение": "# Continual improvement", "Информация о результативности должна приводить к действиям на пользу системе. Улучшать можно продукты, услуги, процессы и способность достигать намеченных результатов.": "Performance information should lead to actions that benefit the system. Improvement may address products, services, processes and the ability to achieve intended results.", "# Несоответствие и корректирующее действие": "# Nonconformity and corrective action", "Коррекция устраняет обнаруженную проблему. Корректирующее действие устраняет её причины, чтобы не допустить повторения или появления в другом месте; действия соразмерны последствиям.": "Correction addresses the detected problem. Corrective action addresses its causes to prevent recurrence or occurrence elsewhere, with actions proportionate to the effects.", "Пункт": "Clause", "Зачем требование (intent)": "Why the requirement exists (intent)", "Intent: зачем нужен каждый пункт (по слайдам)": "Intent: why every clause exists (from the slides)", "На слайдах каждый пункт снабжён блоком «Intent of the requirement»: смысл требования, а не его буква. Так про пункты и спрашивают в открытых вопросах: «зачем это нужно».": "On the slides every clause carries an “Intent of the requirement” block: the meaning of the requirement, not its letter. This is how clauses are asked about in open questions: “why is this needed”.", "# (искл.)": "# (excl.)", "# T: какой вариант означает страхование?": "# T: which option means insurance?", "# · Границы считаем от минимума: нижняя = m, верхняя = m + H, далее добавляем H. Значение на границе относим в верхний класс. # · Таблица частот. # · Рисуем столбцы.": "# · Compute the bounds from the minimum: lower = m, upper = m + H, then keep adding H. A value on a boundary goes to the upper class. # · Frequency table. # · Draw the bars.", "# · Классов K ≈ √N": "# · Classes K ≈ √N", "# · Размах R = M − m": "# · Range R = M − m", "# · Ширина H = R/K": "# · Width H = R/K", "# записей об отсутствии (человеко-дни). Одни и те же данные, разные срезы.": "# records of absence (person-days). Same data, different cuts.", "# и #": "# and #", "# из # и # из # у предела": "# of # and # of # near the limit", "# мая #": "May # #", "# основных разделов.": "# main sections.", "# основных, # дополнительных.": "# main, # additional.", "# подряд (а также # из # из # из #).": "# in a row (and also # of # of # of #).", "# подряд точек по одну сторону от центральной линии, а также # из # из # из #.": "# points in a row on one side of the center line, and also # of # of # of #.", "# подряд точек по одну сторону от центральной линии, а также # из #, # из #, # из #.": "# points in a row on one side of the center line, and also # of #, # of #, # of #.", "# разделов, не #": "# sections, not #", "# таблиц самооценки. В каждой таблице # уровней зрелости, на каждом уровне несколько пунктов, отвечаем «да» или «нет». Уровни #–# это прогрессия мышления на основе руководства подпункта. Таблицами пользуются гибко: все или выборочно, адаптируя.": "# self-assessment tables. Each table has # maturity levels, each level has several items, answered \"yes\" or \"no\". Levels #–# are a progression of thinking based on the guidance of the subclause. The tables are used flexibly: all or selectively, adapting them.", "# таблиц.": "# tables.", "# тестовых вопросов, числовые задачи, мок-тест на время, устные вопросы.": "# test questions, numeric problems, a timed mock test, oral questions.", "# точек": "# points", "# точек подряд по одну сторону от центральной линии (№#–#).": "# points in a row on one side of the center line (no. #–#).", "# точки": "# points", "# точки из # в зоне #/#…предел (№#).": "# points of # in the #/#…limit zone (no. #).", "# точки из # в зоне #/#…предел (№#, #, #, #).": "# points of # in the #/#…limit zone (no. #, #, #, #).", "# точки из # или # из # в диапазоне между #/# границы и самой границей.": "# points of # or # of # in the range between #/# of the limit and the limit itself.", "# точки из # между #/# предела и самим пределом (№#).": "# points of # between #/# of the limit and the limit itself (no. #).", "# точки из # между #/# предела и самим пределом (№#, #).": "# points of # between #/# of the limit and the limit itself (no. #, #).", "# уроков с живыми виджетами: гистограмма, контрольная карта, Парето, матрица рисков.": "# lessons with live widgets: histogram, control chart, Pareto, risk matrix.", "# человек": "# people", "# шагов цикла стандарта; # свойства стандарта.": "# steps of the standard's cycle; # properties of the standard.", "#/# предела": "#/# of the limit", "#/#: порог; итог = среднее письменного и устного.": "#/#: pass mark; result = average of written and oral.", "#M Фейгенбаума, чем TQC отличается от CWQC (Исикава), принципы и политики Total Quality.": "#M of Feigenbaum, how TQC differs from CWQC (Ishikawa), principles and policies of Total Quality.", "#M Фейгенбаума; # статинструментов; # управленческих (#+#+#).": "#M of Feigenbaum; # statistical tools; # management tools (#+#+#).", "#M: девять слов на M": "#M: nine words starting with M", "#–# человек": "#–# people", "#–# человек из одной зоны.": "#–# people from the same zone.", "#–# человека": "#–# people", "(интервал),": "(interval),", "(не устраивает: открываем новый цикл PDCA).": "(not satisfactory: open a new PDCA cycle).", "(размах между max и min).": "(range between max and min).", "(результат устраивает: стандартизируем и распространяем) и": "(result is satisfactory: standardize and spread) and", "(число элементов в классе),": "(number of elements in the class),", ", декабрь #.": ", December #.", ", затем Plan =": ", then Plan =", ", резолюция от # мая #, и": ", resolution of May # #, and", ", справа проблема (effect).": ", the problem (effect) on the right.", ". Process decision program chart. Выбирает альтернативы при разработке плана действий, помогает увидеть, что может пойти не так.": ". Process decision program chart. Chooses among alternatives when developing an action plan and helps see what might go wrong.", ". Автор Jiro Kawakita. Прояснить сложную ситуацию через классификацию, структурирование и синтез множества идей.": ". Author: Jiro Kawakita. Clarify a complex situation through classification, structuring and synthesis of many ideas.", ". Важен выбор поставщиков и входной контроль: хороший продукт зависит от качества сырья.": ". Supplier selection and incoming inspection matter: a good product depends on the quality of raw materials.", ". Весь путь взаимодействия потребителя с организацией.": ". The whole path of the consumer's interaction with the organization.", ". Внутренние и внешние факторы, влияющие на цели и способности организации.": ". Internal and external factors that affect the organization's goals and abilities.", ". Вовлечена вся компания. В Японии CWQC, в США TQC. Качество включает всё, что создаёт удовлетворённость потребителя: сервис, соответствие, цену, сроки поставки.": ". The whole company is involved. CWQC in Japan, TQC in the USA. Quality includes everything that creates consumer satisfaction: service, conformity, price, delivery times.", ". Военный сектор и его стандарты. Системный взгляд, качество охватывает всю компанию. Ключевые требования к изделию: надёжность (reliability) и ремонтопригодность (maintainability).": ". The military sector and its standards. A systems view, quality covers the whole company. Key product requirements: reliability and maintainability.", ". Возможности улучшения вместе с эффектами и неопределённостью.": ". Improvement opportunities together with their effects and uncertainty.", ". Вчерашнее новое сегодня норма, завтра недостаточно. Малые улучшения на всех фазах сильно сокращают дефекты и потери.": ". What is new yesterday is the norm today and not enough tomorrow. Small improvements in all phases greatly cut defects and losses.", ". Выбор сертификатора → оформление заявки → внешний аудит. Орган по сертификации должен быть аккредитован для данного сектора.": ". Choose a certification body → submit the application → external audit. The certification body must be accredited for the given sector.", ". Высшее руководство берёт на себя инициативу «достичь качества».": ". Top management takes the initiative to \"achieve quality\".", ". Выявить и прояснить причинно-следственные связи в сложной ситуации.": ". Identify and clarify cause-and-effect links in a complex situation.", ". Выявить потребности. Есть ли уже стандарт выше уровня данной отрасли? Достаточно ли знаний для проекта?": ". Identify the needs. Is there already a standard above the level of this industry? Is there enough knowledge for the project?", ". Даёт потребителям уверенность, что требования и ожидания будут выполнены. Уверенность строится на объективных свидетельствах, мониторинге и измерениях.": ". Gives consumers confidence that requirements and expectations will be met. The confidence is built on objective evidence, monitoring and measurement.", ". Детализирует от общего к частному, чтобы определить действия для цели. Помогает увидеть естественные связи.": ". Breaks down from the general to the specific to define actions for a goal. Helps see natural links.", ". Деятельность по планированию, управлению, обеспечению и улучшению качества. Основана на семи принципах.": ". Activities of planning, controlling, assuring and improving quality. Based on seven principles.", ". Деятельность, определяющая цели, процессы и ресурсы. Даёт руководству оптимизировать ресурсы с учётом краткосрочных и долгосрочных последствий.": ". An activity that defines goals, processes and resources. Lets management optimize resources considering short- and long-term consequences.", ". Единство цели и направления, условия для вклада людей в цели качества. Основание: руководство направляет решения и делает ожидаемое поведение понятным.": ". Unity of purpose and direction, conditions for people to contribute to quality goals. Basis: leadership directs decisions and makes expected behavior clear.", ". Если результат устраивает: стандартизировать и распространить (maintenance). Если нет: новый цикл PDCA (improvement).": ". If the result is satisfactory: standardize and spread (maintenance). If not: a new PDCA cycle (improvement).", ". Заинтересованные стороны и их эксперты в комиссии по стандартизации готовят проект стандарта.": ". Stakeholders and their experts on the standardization committee prepare the draft standard.", ". Изменение продуктов, услуг, процессов или моделей ради ценности.": ". A change in products, services, processes or models for the sake of value.", ". Индустриализация. Появляется testing: бригадиры проверяют изделия и замечают дефекты.": ". Industrialization. Testing appears: foremen check products and notice defects.", ". Их потребности и ожидания порождают риски и возможности.": ". Their needs and expectations give rise to risks and opportunities.", ". Качество создают те, кто работает, а не те, кто контролирует. Система держится на вовлечённости, профессионализме и мотивации.": ". Quality is created by those who work, not by those who inspect. The system rests on involvement, professionalism and motivation.", ". Количественно анализирует связи, выраженные числовыми данными.": ". Quantitatively analyzes links expressed by numeric data.", ". Компетентность, коммуникация и вовлечённость людей.": ". Competence, communication and involvement of people.", ". Компетентные, наделённые полномочиями и вовлечённые люди на всех уровнях создают ценность. Основание: человек понимает свою роль и может улучшать.": ". Competent, empowered and engaged people at all levels create value. Basis: a person understands their role and can improve.", ". Контроль продукта на эстетических и «на глаз» правилах мастера.": ". Product inspection by aesthetic rules and the master's \"by eye\" judgment.", ". Координирует процессы, ресурсы и цели разных дисциплин.": ". Coordinates the processes, resources and goals of different disciplines.", ". Культура поведения, установок, действий и процессов, создающих ценность. Ценность = потребности и ожидания потребителей и других сторон.": ". A culture of behavior, attitudes, actions and processes that create value. Value = needs and expectations of consumers and other parties.", ". Максимум приоритетных ресурсов (людей) на качество и улучшение. Опирается на веру в ценность людей.": ". The maximum of priority resources (people) on quality and improvement. Relies on belief in the value of people.", ". Мониторинг, инспекция, верификация: продукты, услуги и процессы соответствуют требованиям.": ". Monitoring, inspection, verification: products, services and processes meet requirements.", ". Мотивированные и обученные работники выполняют работу оптимально.": ". Motivated and trained workers do the job optimally.", ". Облегчает внедрение через планирование, коммуникацию, вовлечение людей.": ". Eases implementation through planning, communication and involvement of people.", ". Оборудование должно быть пригодным, чтобы не ухудшать результат процесса.": ". Equipment must be fit so as not to worsen the process result.", ". Обучить исполнителей, выполнить действия, зафиксировать работу и результаты.": ". Train the performers, carry out the actions, record the work and the results.", ". Общие ценности, поведение и убеждения, ведущие людей к качеству. Руководство распространяет её видимой приверженностью.": ". Shared values, behavior and beliefs that lead people to quality. Leadership spreads it by visible commitment.", ". Определить проблему, цели улучшения, возможные причины, действия улучшения.": ". Define the problem, improvement goals, possible causes, improvement actions.", ". Определяет процессы, действия и ресурсы для целей качества. Учитывает контекст, стороны, риски и возможности.": ". Defines processes, actions and resources for quality objectives. Takes into account context, parties, risks and opportunities.", ". Орган выбирает группу аудиторов. Проверка документов и на месте. Подробный отчёт о наблюдаемой системе, на его основе решение: выдавать сертификат или нет.": ". The body selects a team of auditors. Document review and on-site review. A detailed report on the observed system, and on its basis the decision: issue the certificate or not.", ". Организация шлёт формальную заявку в аккредитованный орган с документами: описание деятельности, ассортимент и др. Если документы полны, заключается договор.": ". The organization sends a formal application to an accredited body with documents: description of activities, product range, etc. If the documents are complete, a contract is concluded.", ". Осмысление потребностей и приоритетов, определённых всеми партнёрами. Решения вносят в рабочую программу организации.": ". Understanding the needs and priorities defined by all partners. The decisions go into the organization's work program.", ". Перестроить производственный цикл, чтобы снизить затраты и удовлетворить потребителя. Продажи растут без изменения цены или с более высокой ценой (цена = качество).": ". Rebuild the production cycle to cut costs and satisfy the consumer. Sales grow with no change in price or at a higher price (price = quality).", ". Планирование, реализация, контроль и улучшение процессов. Управляется система целиком.": ". Planning, implementation, control and improvement of processes. The system is managed as a whole.", ". Планирует выполняемые работы и позволяет их мониторить.": ". Plans the work to be done and makes it possible to monitor it.", ". Повторяющаяся деятельность по повышению результативности через выявление и реализацию возможностей улучшения.": ". A recurring activity to raise performance by identifying and implementing improvement opportunities.", ". Получение, сохранение, применение и обмен знаниями.": ". Acquiring, keeping, applying and sharing knowledge.", ". Постоянный фокус на улучшении: удержать результаты, реагировать на изменения контекста, управлять рисками, создавать возможности. Включает малые шаги и крупные изменения, опирается на обучение.": ". A constant focus on improvement: hold the results, respond to changes in context, manage risks, create opportunities. Includes small steps and big changes, and is based on learning.", ". Предсказуемый результат, когда деятельность понимается и управляется как взаимосвязанные процессы одной системы. Основание: улучшение одного процесса не должно ухудшать общий результат.": ". A predictable result when activities are understood and managed as interrelated processes of one system. Basis: improving one process must not worsen the overall result.", ". Регулярная оценка всеми заинтересованными сторонами. Итог: стандарт подтверждён без изменений, уходит в пересмотр или отзывается.": ". A regular review by all stakeholders. Outcome: the standard is confirmed unchanged, goes to revision, or is withdrawn.", ". Решения на анализе данных и информации вероятнее дают желаемый результат. Факты повышают объективность, но не отменяют интерпретацию и суждение.": ". Decisions based on analysis of data and information are more likely to give the desired result. Facts raise objectivity but do not replace interpretation and judgment.", ". Родилось в ядерной отрасли. «Систематические и запланированные действия, дающие уверенность в соответствии». Теперь часть менеджмента качества, нацеленная на повышение способности выполнять требования. Нужна интеграция всех функций.": ". Born in the nuclear industry. \"Systematic and planned actions giving confidence of conformity\". Now a part of quality management aimed at increasing the ability to meet requirements. Requires integration of all functions.", ". Сбор данных и диагноз → операционный план → описание и формализация процессов (руководство, процедуры) → информирование и обучение (базовое и специальное) → самооценка и внутренний аудит. Если «нет», возвращаемся; если «да», система проверена и сертифицируема.": ". Data collection and diagnosis → operational plan → description and formalization of processes (manual, procedures) → information and training (basic and specialized) → self-assessment and internal audit. If \"no\", go back; if \"yes\", the system is verified and certifiable.", ". Сертификат действует несколько лет. В этот срок орган проводит надзорные визиты (surveillance), по окончании договор продлевают.": ". The certificate is valid for several years. During that time the body makes surveillance visits, and at the end the contract is renewed.", ". Сертифицированная система → поддержание и непрерывное улучшение. Регулярные внутренние аудиты и надзорные внешние аудиты, затем обновление сертификата.": ". A certified system → maintenance and continual improvement. Regular internal audits and surveillance external audits, then certificate renewal.", ". Системный учёт рисков и возможностей в решениях и действиях на каждом уровне.": ". Systematic consideration of risks and opportunities in decisions and actions at every level.", ". Сопоставляет ряд факторов, чтобы оценить, выбрать и решить. Показывает характер связи.": ". Compares a number of factors to evaluate, choose and decide. Shows the nature of the link.", ". Сохранение пользы и ценности ресурсов через повторное использование, ремонт, восстановление, переработку.": ". Preserving the usefulness and value of resources through reuse, repair, refurbishment and recycling.", ". Способность продолжать поставки во время и после сбоя.": ". The ability to keep supplying during and after a disruption.", ". Сравнить результаты с исходными данными. Учесть технико-экономические, человеческие и экологические эффекты.": ". Compare the results with the baseline data. Take into account technical-economic, human and environmental effects.", ". Статистический контроль. Специалисты вводят внутренние правила и процедуры, создаются отделы «quality control».": ". Statistical control. Specialists introduce internal rules and procedures, \"quality control\" departments are created.", ". Текст одобряют к публикации как стандарт.": ". The text is approved for publication as a standard.", ". Точка отсчёта для компании и действий сотрудников всех уровней.": ". A reference point for the company and for the actions of staff at all levels.", ". Точная, доступная и защищённая информация для надёжных решений.": ". Accurate, accessible and protected information for reliable decisions.", ". Удовлетворять спрос по характеристикам и по времени выхода на рынок (time to market).": ". Meet demand in characteristics and in time to market.", ". Удовлетворять требования и стремиться превзойти ожидания. Понимание нынешних и будущих потребностей строит доверие. Основание: влияет на удовлетворённость, лояльность, репутацию.": ". Meet requirements and strive to exceed expectations. Understanding current and future needs builds trust. Basis: affects satisfaction, loyalty, reputation.", ". Успех зависит от отношений с заинтересованными сторонами. Поставщики и партнёры влияют на результат, обмен знаниями и ресурсами.": ". Success depends on relationships with stakeholders. Suppliers and partners affect the result, the exchange of knowledge and resources.", ". Функциональным зонам нужна эффективная информационная система для координации.": ". Functional areas need an effective information system for coordination.", ". Характеристики изделия быстро меняются вслед за потребностями потребителей.": ". Product characteristics change quickly following consumer needs.", ". Центральная цель; касается каждой фазы до выхода на рынок. «Делать правильно и хорошо».": ". The central goal; it concerns every phase up to market launch. \"Do it right and well\".", ". Широкая консультация на национальном и международном уровнях в форме публичной заявки. Разбор замечаний, финальный текст.": ". Broad consultation at national and international level as a public inquiry. Review of comments, final text.", ". Эксперты приходят к согласию по проекту выбранного стандарта.": ". Experts reach agreement on the draft of the chosen standard.", ": все точки внутри границ и случайно.": ": all points inside the limits and random.", ": коррекция (исправить последствие) ≠ корректирующее действие (устранить причину).": ": correction (fix the consequence) ≠ corrective action (eliminate the cause).", ": независимая третья сторона подтверждает соответствие.": ": an independent third party confirms conformity.", ": обстоятельства, позволяющие что-то сделать.": ": circumstances that make it possible to do something.", ": орган подтверждает компетентность органа по сертификации.": ": the body confirms the competence of the certification body.", ": посторонние элементы, нужно анализировать и устранять, вводя предупреждающие действия.": ": extraneous elements that must be analyzed and eliminated by introducing preventive actions.", ": присутствуют всегда, даже при стандартных материалах и методах.": ": always present, even with standard materials and methods.", ": программа с учётом важности процессов, изменений и прошлых результатов, объективность и беспристрастность.": ": a program that takes into account the importance of processes, changes and pa mation: #.# общие; #.# создание и обновление; #.# управление документами.": "Documented information: #.# general; #.# creating and updating; #.# control of documents.", "Documented information: Требуемая стандартом и необходимая организации.": "Documented information: Required by the standard and necessary for the organization.", "External provision: #.# общие; #.# вид и степень управления; #.# информация для поставщиков.": "External provision: #.# general; #.# type and extent of control; #.# information for providers.", "Fairness: нет консультаций, в том числе через связанные компании.": "Fairness: no consultations, including through related companies.", "HLS введена в # в Annex SL.": "HLS was introduced in # in Annex SL.", "HLS это единая основа для всех стандартов систем менеджмента: одни и те же # разделов, одинаковые вводные тексты и общие термины. Пункты #–# общие вводные, #–# образуют цикл PDCA.": "HLS is a single basis for all management system standards: the same # clauses, identical introductory texts and common terms. Clauses #–# are general introductory ones, #–# form the PDCA cycle.", "HS: # разделов; # HLS, # Annex L, # HS, # климат.": "HS: # clauses; # HLS, # Annex L, # HS, # climate.", "Harmonised Structure (HLS) · вопрос # из #": "Harmonised Structure (HLS) · question # of #", "Harmonized это европейский стандарт, принятый по запросу Комиссии для применения законодательства по гармонизации.": "Harmonized is a European standard adopted at the request of the Commission for applying harmonization legislation.", "High Level Structure и Harmonised Structure": "High Level Structure and Harmonised Structure", "IEC принимает подход, Annex L": "IEC adopts the approach, Annex L", "IEC/CENELEC/CEI для электричества, ISO/CEN/UNI для остального.": "IEC/CENELEC/CEI for electricity, ISO/CEN/UNI for the rest.", "IMSDS Studio, главная": "IMSDS Studio, home", "ISO # даёт фундамент и словарь менеджмента качества, не содержит требований для сертификации. Семь принципов ffectiveness.", "Management system: Создать, внедрить, поддерживать и постоянно улучшать систему, включая процессы и их взаимодействия.": "Management system: Establish, implement, maintain and continually improve the system, including the processes and their interactions.", "Markets, Money, Management, Men, Motivation, Materials, Machines and mechanization, Modern information methods, Mounting product requirements. TQC (Feigenbaum) интегрирует технологии качества во все функции. CWQC (Ishikawa) отличается культурой: выгода делится между потребителями, сотрудниками и акционерами.": "Markets, Money, Management, Men, Motivation, Materials, Machines and mechanization, Modern information methods, Mounting product requirements. TQC (Feigenbaum) integrates quality technologies into all functions. CWQC (Ishikawa) differs by culture: the benefit is shared among consumers, employees and shareholders.", "Markets, Money, Management, Men, Motivation, Materials, Machines and mechanization, Modern information methods, Mounting product requirements. Это ровно девять факторов. Нажмите, чтобы прочитать суть каждого.": "Markets, Money, Management, Men, Motivation, Materials, Machines and mechanization, Modern information methods, Mounting product requirements. That is exactly nine factors. Click to read the gist of each.", "Max M, min m, размах R = M − m.": "Max M, min m, range R = M − m.", "Max и min, размах R = M − m, число классов K ≈ √N, ширина H = R/K, границы от минимума с шагом H (граничное значение в верхний класс), таблица частот, рисунок.": "Max and min, range R = M − m, number of classes K ≈ √N, width H = R/K, bounds from the minimum in steps of H (a boundary value goes to the upper class), frequency table, plot.", "Money в #M": "Money in the #M", "Money: перестроить цикл, цена = качество.": "Money: rebuild the cycle, price = quality.", "Monitoring and evaluation: #.# общие; #.# удовлетворённость потребителя; #.# анализ и оценка (риски и возможности оцениваются отдельно).": "Monitoring and evaluation: #.# general; #.# customer satisfaction; #.# analysis and evaluation (risks and opportunities are assessed separately).", "Monitoring, measurement, analysis: Что, как, когда измерять и анализировать; свидетельства.": "Monitoring, measurement, analysis: What, how, when to measure and analyze; evidence.", "New Approach # мая #, Global Approach декабрь #.": "New Approach May # #, Global Approach December #.", "New Approach (резолюция ЕС) датируется:": "The New Approach (EU resolution) dates from:", "Nonconforming outputs: #.# управление (коррекция, изоляция, уведомление, уступки); #.# документированная информация.": "Nonconforming outputs: #.# control (correction, segregation, notification, concessions); #.# documented information.", "Nonconformity and corrective action: #.# реакция и действия (коррекция ≠ корректирующее действие); #.# документированная информация.": "Nonconformity and corrective action: #.# reaction and actions (correction ≠ corrective action); #.# documented information.", "Nonconformity and corrective action: Реагировать, исправлять, устранять причину, проверять результативность, менять систему при необходимости.": "Nonconformity and corrective action: React, correct, eliminate the cause, verify effectiveness, change the system if needed.", "Objectives: Согласованы с политикой, измеримы (если возможно), мониторятся, доведены, обновляются, документированы. Что, ресурсы, кто, когда, как оценить.": "Objectives: Consistent with the policy, measurable (if possible), monitored, communicated, updated, documented. What, resources, who, when, how to evaluate.", "Operational planning and control: Критерии процессов, контроль по критериям, управление изменениями и внешними процессами.": "Operational planning and control: Process criteria, control against the criteria, management of changes and external processes.", "Opportunity в ISO # это:": "Opportunity in ISO # is:", "Opportunity не «положительная сторона риска», а набор обстоятельств, позволяющий что-то сделать. Брать или не брать возможность связано с разным уровнем риска.": "Opportunity is not \"the positive side of risk\" but a set of circumstances that makes it possible to do something. Taking or not taking an opportunity is tied to different levels of risk.", "PDCA это цикл непрерывного улучшения. Quality circle: #–# добровольцев из одной зоны решают операционные проблемы. CEDAC: диаграмма «причины-следствия» с карточками для проблем всей компании, видимая всем, с индикаторами на стороне следствий.": "PDCA is a cycle of continual improvement. Quality circle: #–# volunteers from one area solve operational problems. CEDAC: a \"cause-and-effect\" diagram with cards for company-wide problems, visible to all, with indicators on the effect side.", "PDCA, фазы по порядку": "PDCA, phases in order", "PDPC помогает:": "PDPC helps to:", "Pareto chart нужна, чтобы:": "A Pareto chart is needed to:", "Plan: проблема, цели, причины, действия. Do: обучение, выполнение, запись результатов. Check: сравнение с исходными данными, учёт всех эффектов. Act: либо maintenance (стандартизация и распространение), либо improvement (новый цикл).": "Plan: problem, goals, causes, actions. Do: training, execution, recording results. Check: comparison with the baseline data, accounting for all effects. Act: either maintenance (standardize and spread) or improvement (a new cycle).", "Planning and control: Требования, критерии приёмки, управление, ресурсы, изменения.": "Planning and control: Requirements, acceptance criteria, control, resources, changes.", "Planning of changes: Изменения системы проводятся запланированно.": "Planning of changes: Changes to the system are carried out in a planned way.", "Planning of changes: Цель, последствия, целостность системы, ресурсы, перераспределение ответственности, коммуникация, мониторинг.": "Planning of changes: Purpose, consequences, integrity of the system, resources, reallocation of responsibilities, communication, monitoring.", "Policy: Соответствует назначению, рамка для целей, обязательство выполнять требования и улучшать. Документирована, доведена, доступна сторонам.": "Policy: Appropriate to the purpose, a framework for objectives, a commitment to meet requirements and to improve. Documented, communicated, available to parties.", "Prevention #, appraisal #, failure # (тыс. €). Суммарные затраты качества?": "Prevention #, appraisal #, failure # (thousand €). Total quality costs?", "Prevention (обучение, отбор поставщиков), appraisal (оценка поставщиков, приёмочные испытания), internal failure (брак, переделка), external failure (рекламации, возвраты), indirect (избыточные запасы), intangible (имидж, неудовлетворённость клиентов). С ростом внедрения системы качества failure падает и итог снижается.": "Prevention (training, supplier selection), appraisal (supplier assessment, acceptance tests), internal failure (scrap, rework), external failure (complaints, returns), indirect (excess stock), intangible (image, customer dissatisfaction). As the quality system is adopted, failure falls and the total drops.", "Prevention и appraisal это деньги, которые платят, чтобы качество было («costs to guarantee and maintain quality»). Failure это деньги, которые платят, потому что качества нет. Внутренние потери найдены до рынка, внешние после.": "Prevention and appraisal are money paid so that quality exists (\"costs to guarantee and maintain quality\"). Failure is money paid because quality is missing. Internal losses are found before the market, external ones after.", "Probability и severity.": "Probability and severity.", "Product/service requirements: #.# коммуникация с потребителем; #.# определение; #.# анализ; #.# изменения требований.": "Product/service requirements: #.# communication with the customer; #.# determination; #.# review; #.# changes to requirements.", "Production and provision: #.# управляемые условия; #.# идентификация и прослеживаемость; #.# собственность потребителя/поставщика; #.# сохранение; #.# деятельность после поставки; #.# управление изменениями.": "Production and provision: #.# controlled conditions; #.# identification and traceability; #.# customer/provider property; #.# preservation; #.# post-delivery activities; #.# control of changes.", "QMS and processes: #.# процессы и взаимодействия (входы, выходы, последовательность, критерии, показатели, ресурсы, риски); #.# документированная информация.": "QMS and processes: #.# processes and interactions (inputs, outputs, sequence, criteria, indicators, resources, risks); #.# documented information.", "Quality assurance сегодня": "Quality assurance today", "Quality circle: #–# человек, #–# встреч; CEDAC: # шагов.": "Quality circle: #–# people, #–# meetings; CEDAC: # steps.", "Quality control, отделы контроля качества.": "Quality control, quality control departments.", "Quality objectives: #.# характеристики целей; #.# планирование действий.": "Quality objectives: #.# characteristics of objectives; #.# planning of actions.", "Quality policy: #.# разработка; #.# доведение и применение.": "Quality policy: #.# development; #.# communication and application.", "Release: Перед выпуском проверить критерии приёмки; документировать соответствие и кто разрешил.": "Release: Before release verify the acceptance criteria; document conformity and who authorized it.", "Reliability (надёжность)": "Reliability", "Reliability и Maintainability": "Reliability and Maintainability", "Reliability и maintainability": "Reliability and maintainability", "Resources: #.# общие; #.# люди; #.# инфраструктура; #.# среда процессов (социальные, психологические, физические факторы); #.# мониторинг и измерение; #.# знания организации.": "Resources: #.# general; #.# people; #.# infrastructure; #.# environment for processes (social, psychological, physical factors); #.# monitoring and measuring; #.# organizational knowledge.", "Resources: Определить и обеспечить ресурсы.": "Resources: Determine and provide the resources.", "Risk-based thinking в ISO #": "Risk-based thinking in ISO #", "Risk-based thinking это системный учёт рисков и возможностей в каждом решении. Оценка риска: вероятность и тяжесть. Реакции: Tolerate, Treat, Transfer, Terminate. Формальный риск-менеджмент стандарт не требует.": "Risk-based thinking is the systematic consideration of risks and opportunities in every decision. Risk assessment: probability and severity. Responses: Tolerate, Treat, Transfer, Terminate. The standard does not require formal risk management.", "Risks and opportunities: #.# определение; #.# действия по рискам; #.# действия по возможностям (разделены в новой редакции).": "Risks and opportunities: #.# determination; #.# actions on risks; #.# actions on opportunities (separated in the new edition).", "Risks and opportunities: Гарантия достижения результатов, предотвращение нежелательных эффектов, улучшение. Планировать действия и оценку их результативности.": "Risks and opportunities: Assurance of achieving results, prevention of undesired effects, improvement. Plan actions and the evaluation of their effectiveness.", "Roles, responsibilities, authorities: Назначить и довести ответственность за соответствие системы и за отчёт о её работе.": "Roles, responsibilities, authorities: Assign and communicate responsibility for conformity of the system and for reporting on its performance.", "Roles, responsibilities, authorities: Соответствие QMS, результаты процессов, отчёт, целостность при изменениях.": "Roles, responsibilities, authorities: QMS conformity, process results, reporting, integrity during changes.", "Scope, normative references, terms: Общие для всех стандартов: сфера, нормативные ссылки, термины. Общая структура и общие определения.": "Scope, normative references, terms: Common to all standards: scope, normative references, terms. A common structure and common definitions.", "Scope, references, terms: Область, нормативная ссылка на ISO #, термины общие для систем менеджмента (org ards. The standards are developed by tens of thousands of experts.", "В верхний.": "Into the upper one.", "В выборке N = # измерений. Сколько классов K гистограммы по правилу K ≈ √N?": "The sample has N = # measurements. How many classes K should the histogram have by the rule K ≈ √N?", "В других странах: BSI (UK), AFNOR (Франция), DIN (Германия). ISO действует через рекомендации, на которые часто ссылаются государства.": "In other countries: BSI (UK), AFNOR (France), DIN (Germany). ISO works through recommendations that states often refer to.", "В лекции стратификация названа также «Flowchart». Для экзамена запомните оба названия.": "In the lecture stratification is also called \"Flowchart\". For the exam remember both names.", "В нём нет требований для сертификации QMS.": "It has no requirements for QMS certification.", "Валидация": "Validation", "Валидация (широкая консультация)": "Validation (broad consultation)", "Введена ISO в": "Introduced by ISO in", "Введение в понятие качества": "Introduction to the concept of quality", "Вердикт": "Verdict", "Верных ответов: # из #.": "Correct answers: # of #.", "Вероятность": "Probability", "Вероятность и тяжесть": "Probability and severity", "Вероятность оцениваем от # до #, тяжесть от # до #. Например, P = # (маловероятно), S = # (серьёзно): оценка # × # = #, средний уровень, обычно Treat. Двигайте ползунки.": "We rate probability from # to #, severity from # to #. For example, P = # (unlikely), S = # (serious): score # × # = #, medium level, usually Treat. Move the sliders.", "Вероятность риска #, тяжесть # (шкала #–#). Чему равна оценка P × S?": "Risk probability #, severity # (scale #–#). What is the P × S score?", "Верхний класс": "Upper class", "Верхняя граница": "Upper bound", "Видеть сильные и слабые стороны.": "See strengths and weaknesses.", "Видеть, что может пойти не так в плане": "See what might go wrong in the plan", "Виды: положительная, отрицательная, нет корреляции, возможная положительная, возможная отр
