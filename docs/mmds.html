      <div class="fact"><div class="big">Минусы</div><p>Нужен гессиан (дорого, ошибки), решение системы на каждом шаге; далеко от решения направление может не быть спуском.</p></div>
    </div>
    <div class="formula key">‖x<sub>k+1</sub> − x*‖ ≤ (L/m)·‖x<sub>k</sub> − x*‖², &nbsp; если ‖x₀ − x*‖ ≤ m/(2L)</div>
    <p>Вблизи решения условия Вольфе принимают α = 1, поэтому реализация «сначала пробуем единичный шаг» сохраняет квадратичную скорость.</p>
  </section>
  <section class="board"><div class="step"><span class="num">3</span><h2>Починка неположительного гессиана</h2></div>
    <p>Собственные значения H: одно отрицательное. Сравните две модификации с минимальной нормой: <b>замена</b> λ<sub>i</sub> &lt; δ на δ (минимум по Фробениусу, не диагональная) и <b>сдвиг</b> H + τI, τ = max(0, δ − λ<sub>min</sub>) (минимум по евклидовой норме, сдвигает все λ).</p>
    <svg data-r="hm" viewBox="0 0 600 260"></svg>
    <div class="controls"><label>δ = <b data-r="dV">0.5</b><input data-r="d" type="range" min="0.05" max="2" step="0.05" value="0.5"></label></div>
    <p>Холецкий с добавкой: τ₀ = 0, если min a<sub>ii</sub> &gt; 0, иначе −min a<sub>ii</sub> + β; пробуем LLᵀ = A + τI, при неудаче τ ← max(2τ, β). Модифицированный Холецкий (Гилл–Мюррей–Райт): d<sub>j</sub> = max(|c<sub>jj</sub>|, (θ<sub>j</sub>/β)², δ).</p>
  </section>`,
  init(sec) {
    const f = x => x - Math.log(x), df = x => 1 - 1 / x, d2 = x => 1 / (x * x); let xs = [];
    const draw = () => { const ch = L.chart(L.q(sec, 'nw'), { W: 600, H: 300, x0: 0, x1: 2.6, y0: .8, y1: 3.2, xlabel: 'x', ylabel: 'f(x)' }); ch.path([...Array(200)].map((_, i) => { const x = .02 + i * 2.58 / 199; return [x, f(x)]; }), 's-b');
      const xk = xs[xs.length - 1]; if (xk > 0 && isFinite(xk)) { ch.path([...Array(200)].map((_, i) => { const x = i * 2.6 / 199; return [x, f(xk) + df(xk) * (x - xk) + .5 * d2(xk) * (x - xk) ** 2]; }), 's-o s-d'); }
      xs.forEach((x, i) => { if (x > 0 && x < 2.6) ch.dot(x, f(x), i === xs.length - 1 ? 'f-o' : 'f-ink', i === xs.length - 1 ? 6 : 4, `x${i} = ${x}`); }); ch.line(1, .8, 1, 3.2, 's-m');
      L.q(sec, 'tb').textContent = 'k   x_k                  e_k = x_k − 1\n' + xs.map((x, i) => `${String(i).padEnd(4)}${(isFinite(x) ? x.toPrecision(15) : '—').padEnd(21)}${isFinite(x) ? (x - 1).toExponential(3) : ''}`).join('\n') + (xs[xs.length - 1] <= 0 ? '\nx ≤ 0: вне области определения — расходится' : ''); };
    const reset = () => { const x0 = +L.q(sec, 'x0').value; L.q(sec, 'x0V').textContent = x0; xs = [x0]; draw(); };
    L.q(sec, 'step').onclick = () => { const x = xs[xs.length - 1]; if (x <= 0 || xs.length > 8) return; xs.push(x - df(x) / d2(x)); draw(); }; L.q(sec, 'reset').onclick = reset; L.q(sec, 'x0').oninput = reset; reset();
    const lam = [3.2, 1.4, .3, -.8]; const dh = () => { const d = +L.q(sec, 'd').value; L.q(sec, 'dV').textContent = d; const rep = lam.map(l => Math.max(l, d)), tau = Math.max(0, d - Math.min(...lam)), sh = lam.map(l => l + tau);
      const ch = L.chart(L.q(sec, 'hm'), { W: 600, H: 260, x0: 0, x1: 12.6, y0: -1.2, y1: 4.8, xticks: [], ylabel: 'λ' }); ch.line(0, 0, 12.6, 0, 's-i'); ch.line(0, d, 12.6, d, 's-m');
      [[lam, 'f-muted', 0, 'H'], [rep, 'f-b', 4.2, 'замена λ < δ'], [sh, 'f-o', 8.4, `H + τI, τ = ${L.fmt(tau, 2)}`]].forEach(([v, c, x0, t]) => { v.forEach((l, i) => { const x = x0 + .4 + i * .95; L.el('rect', { x: ch.X(x), y: ch.Y(Math.max(l, 0)), width: ch.X(.75) - ch.X(0), height: Math.abs(ch.Y(l) - ch.Y(0)), rx: 2, class: c }, ch.plot); }); ch.text(ch.X(x0 + 2), ch.H - 10, t, 'small', { 'text-anchor': 'middle' }); }); ch.text(ch.X(12.4), ch.Y(d) - 5, 'δ', 'note', { 'text-anchor': 'end' }); };
    L.q(sec, 'd').oninput = dh; dh();
  }
});
</script>

<script>
/* ===== model answers (EN) + Russian translation ===== */
const ORIG_RAW = [
['S1','1. Introduction: data analysis and modelling','B1',
`Data analysis is the mathematical process of collecting, cleaning, transforming and modelling data to discover useful, compact information that supports decisions. It can describe and summarise data, find relationships between variables, compare them and forecast outcomes. The choice of method depends on the scale of measurement: nominal (named categories with arbitrary order, e.g. eye colour), ordinal (categories with a natural order, e.g. ratings) and numerical (numbers with quantifiable differences). Numerical variables are discrete when their values form a finite or countable set, and continuous when they fill an interval of R. The process has six phases: requirement gathering, data collection (keeping a log of sources and dates), data cleaning (duplicates, errors, outliers, done before the analysis), analysis and modelling, interpretation and visualisation. Modelling follows the paradigm <code>Data = Model + Error</code>; when many models are tested at once, the significance level must be adjusted. Types of analysis are text analysis (data mining), statistical analysis (descriptive and inferential), diagnostic (why did it happen), predictive (what is likely to happen) and prescriptive (which action to take).`,
`Анализ данных — математический процесс сбора, очистки, преобразования и моделирования данных, чтобы получить полезную компактную информацию для принятия решений. Он описывает и обобщает данные, ищет связи между переменными, сравнивает их и прогнозирует. Выбор метода зависит от шкалы: номинальная (именованные категории без порядка, цвет глаз), порядковая (категории с естественным порядком, оценки) и числовая (числа с измеримой разностью). Числовая переменная дискретна, если множество значений конечно или счётно, и непрерывна, если заполняет интервал R. Процесс из шести этапов: сбор требований, сбор данных (с журналом источников и дат), очистка (дубликаты, ошибки, выбросы — до анализа), анализ и моделирование, интерпретация и визуализация. Моделирование следует парадигме <code>Данные = Модель + Ошибка</code>; при проверке многих моделей нужно корректировать уровень значимости. Типы анализа: текстовый (data mining), статистический (описательный и инференциальный), диагностический (почему), предиктивный (что будет) и предписывающий (что делать).`],
['S2','2. Frequencies, histograms, box plot, quantiles','B1',
`For N observations we count the absolute frequency f_k of each value or class and the relative frequency f_k/N; they sum to N and to 1, and cumulative frequencies are their running totals. Numerical data are grouped into classes; common rules for the number of classes are sqrt(N), Sturges <code>1 + log2 N</code> and Rice <code>2 N^(1/3)</code>, while Freedman–Diaconis fixes the width <code>2 IQR / N^(1/3)</code>. A histogram shows continuous data with adjacent rectangles (with unequal widths the height is the frequency density), a bar chart shows categories with separated bars, and a pie chart uses angles proportional to percentages. The empirical distribution function F(x) is the share of observations not larger than x: a step function jumping 1/N at each point, with F(median) = 1/2. The median is the middle value of the ordered list; the first and third quartiles are the medians of the lower and upper halves; IQR = Q3 − Q1. The box plot displays the five-number summary, and points beyond <code>Q1 − 1.5 IQR</code> or <code>Q3 + 1.5 IQR</code> are outliers. Median and quartiles are robust.`,
`Для N наблюдений считаем абсолютную частоту f_k каждого значения или класса и относительную f_k/N; суммы равны N и 1, накопленные частоты — бегущие суммы. Числовые данные группируем в классы; правила числа классов: √N, Стёрджес <code>1 + log₂N</code>, Райс <code>2∛N</code>, а Фридман–Диаконис задаёт ширину <code>2·IQR/∛N</code>. Гистограмма показывает непрерывные данные смежными прямоугольниками (при разной ширине высота — плотность частоты), столбчатая — категории раздельными столбцами, круговая — углы пропорционально процентам. Эмпирическая функция распределения F(x) — доля наблюдений не больше x: ступенька 1/N в каждой точке, F(медиана) = 1/2. Медиана — среднее значение упорядоченного списка; первый и третий квартили — медианы нижней и верхней половин; IQR = Q3 − Q1. Box plot показывает пятичисловую сводку, а точки за <code>Q1 − 1.5·IQR</code> и <code>Q3 + 1.5·IQR</code> — выбросы. Медиана и квартили робастны.`],
['S3','3. Mean, other means, variance, standardisation','B1',
`The arithmetic mean <code>μ = (1/N) Σ x_k</code> is the centre of mass of the data: deviations sum to zero, it lies between min and max, and mean(ax + b) = aμ + b, while for a non-linear f the mean of f(x) is generally not f(μ). It can be updated recursively, <code>μ_{k+1} = k/(k+1) μ_k + x_{k+1}/(k+1)</code>. The mean is not robust to outliers. The weighted mean uses non-negative weights; the geometric mean suits multiplicative quantities such as growth or inflation rates; the harmonic mean suits average rates such as km per litre; for positive data <code>H ≤ G ≤ μ</code>. Dispersion is measured by the variance <code>σ² = (1/N) Σ (x_k − μ)² = mean(x²) − μ²</code>. For a sample we use Bessel's correction N/(N−1), because the data have N − 1 degrees of freedom once the mean is used. var(ax + b) = a²σ²; the standard deviation has the units of the data. Other descriptors are the mode, the coefficient of variation σ/|μ| (dimensionless), the range and the robust MAD. Standardisation <code>z = (x − μ)/σ</code> gives mean 0 and variance 1.`,
`Среднее <code>μ = (1/N)Σx_k</code> — центр масс данных: отклонения в сумме дают ноль, оно между min и max, mean(ax + b) = aμ + b, а для нелинейной f среднее f(x) в общем не равно f(μ). Есть рекуррентная формула <code>μ_{k+1} = k/(k+1)·μ_k + x_{k+1}/(k+1)</code>. Среднее не робастно. Взвешенное среднее использует неотрицательные веса; геометрическое подходит для перемножаемых величин (темпы роста, инфляция); гармоническое — для средних норм (км на литр); для положительных данных <code>H ≤ G ≤ μ</code>. Разброс измеряет дисперсия <code>σ² = (1/N)Σ(x_k − μ)² = mean(x²) − μ²</code>. Для выборки — поправка Бесселя N/(N−1): после использования среднего у данных N − 1 степеней свободы. var(ax + b) = a²σ²; σ в единицах данных. Другие дескрипторы: мода, коэффициент вариации σ/|μ| (безразмерный), размах и робастный MAD. Стандартизация <code>z = (x − μ)/σ</code> даёт среднее 0 и дисперсию 1.`],
['S4','4. Covariance and correlation','B1',
`The covariance of two variables, <code>cov(x, y) = (1/N) Σ (x_k − x̄)(y_k − ȳ) = mean(xy) − x̄ȳ</code>, measures how they vary together: positive means y tends to grow with x, negative means it decreases, zero means no linear relationship. It is symmetric, cov(x, x) = σ²(x), cov(ax + b, cy + d) = ac cov(x, y), and σ²(ax + by) = a²σ²(x) + b²σ²(y) + 2ab cov(x, y). By the Cauchy–Schwarz inequality <code>cov² ≤ σ²(x)σ²(y)</code>: the variance of x + ay is a non-negative quadratic in a, so its discriminant is not positive. Hence the correlation coefficient <code>ρ = cov/(σ_x σ_y)</code> lies in [−1, 1]; it equals the covariance of the standardised data and does not depend on the scale; |ρ| = 1 means the points lie on a line. Limitations: zero covariance does not exclude a non-linear relation (y = x² on a symmetric set), correlation does not imply causation (spurious correlations), and a single outlier can change ρ a lot. For p variables the covariance and correlation matrices are symmetric and positive semi-definite, which is the starting point of PCA.`,
`Ковариация <code>cov(x, y) = (1/N)Σ(x_k − x̄)(y_k − ȳ) = mean(xy) − x̄ȳ</code> показывает, как переменные меняются вместе: плюс — y растёт с x, минус — убывает, ноль — нет линейной связи. Она симметрична, cov(x, x) = σ²(x), cov(ax + b, cy + d) = ac·cov(x, y), σ²(ax + by) = a²σ²(x) + b²σ²(y) + 2ab·cov(x, y). По неравенству Коши–Шварца <code>cov² ≤ σ²(x)σ²(y)</code>: дисперсия x + ay — неотрицательный квадратный трёхчлен по a, его дискриминант не положителен. Поэтому коэффициент корреляции <code>ρ = cov/(σ_x σ_y)</code> лежит в [−1, 1]; это ковариация стандартизованных данных, он не зависит от масштаба; |ρ| = 1 — точки на прямой. Ограничения: нулевая ковариация не исключает нелинейную связь (y = x² на симметричном наборе), корреляция не означает причинность (ложные корреляции), один выброс сильно меняет ρ. Для p переменных матрицы ковариаций и корреляций симметричны и положительно полуопределены — отсюда начинается PCA.`],
['R1','5. Simple linear regression and least squares','B2',
`Simple linear regression models a response y as <code>y = αx + β + error</code>. The residual <code>r_i = y_i − αx_i − β</code> is the vertical distance between the observation and the line at the same x, because the goal is prediction; the orthogonal distance is what PCA minimises. The least squares method minimises the sum of squared residuals <code>E(α, β) = Σ r_i²</code>; squares avoid cancellation of positive and negative errors. Setting the partial derivatives to zero gives the normal equations <code>α mean(x²) + β x̄ = mean(xy)</code> and <code>α x̄ + β = ȳ</code>, whose solution is <code>α = cov(x, y)/σ²(x)</code> and <code>β = ȳ − α x̄</code>. Consequently the line passes through the centre (x̄, ȳ) and the residuals sum to zero. The residual variance is <code>σ²(r) = σ²(y)(1 − ρ²)</code>, so the fit is better the closer |ρ| is to 1. For the cherry trees, volume = 5.07·diameter − 36.94 with ρ = 0.97; for the 2014–15 Serie A, score = 0.71·goal difference + 50.65 with ρ = 0.98.`,
`Простая линейная регрессия: <code>y = αx + β + ошибка</code>. Остаток <code>r_i = y_i − αx_i − β</code> — вертикальное расстояние от наблюдения до прямой при том же x, потому что цель — предсказание; ортогональное расстояние минимизирует PCA. Метод наименьших квадратов минимизирует сумму квадратов остатков <code>E(α, β) = Σr_i²</code>; квадраты не дают положительным и отрицательным ошибкам гасить друг друга. Приравнивая частные производные к нулю, получаем нормальные уравнения <code>α·mean(x²) + β·x̄ = mean(xy)</code> и <code>α·x̄ + β = ȳ</code>, их решение <code>α = cov(x, y)/σ²(x)</code>, <code>β = ȳ − αx̄</code>. Поэтому прямая проходит через (x̄, ȳ), а сумма остатков равна нулю. Дисперсия остатков <code>σ²(r) = σ²(y)(1 − ρ²)</code>: чем ближе |ρ| к 1, тем лучше. Вишни: объём = 5.07·диаметр − 36.94, ρ = 0.97; Серия A 2014–15: очки = 0.71·разница мячей + 50.65, ρ = 0.98.`],
['R2','6. Linearisation, multiple and polynomial regression','B2',
`Least squares applies to every model that is linear in its parameters, f(y) = α g(x) + β, not only in the variables. Some non-linear models can be linearised: <code>y = η x^λ</code> becomes <code>log y = λ log x + log η</code> and <code>y = α e^(βx)</code> becomes <code>log y = βx + log α</code>; the transformation changes the error structure, so it needs care. For the cherry trees the straight line predicts negative volumes for small diameters; geometry suggests volume ~ diameter^(γ+1), and the log–log fit gives y = 0.095 x^2.2. Multiple linear regression uses p explanatory variables: <code>y = Xα + r</code>, where X is N×(p+1) with a first column of ones. Minimising <code>‖Xα − y‖²</code> gives <code>XᵀXα = Xᵀy</code>, so <code>α = (XᵀX)⁻¹Xᵀy</code> when XᵀX is invertible. Multivariate regression instead has several responses. Polynomial regression treats x, x², …, x^p as separate regressors, so it is a special case of multiple regression with a Vandermonde matrix; it needs p &lt; N and distinct x_i, and for high degree XᵀX becomes ill-conditioned and coefficients are hard to interpret.`,
`МНК применим к любой модели, линейной по параметрам, f(y) = α·g(x) + β, а не только по переменным. Некоторые нелинейные модели линеаризуются: <code>y = ηx^λ</code> → <code>log y = λ log x + log η</code>, <code>y = αe^(βx)</code> → <code>log y = βx + log α</code>; преобразование меняет структуру ошибок, нужна осторожность. Для вишен прямая даёт отрицательный объём при малом диаметре; геометрия подсказывает объём ~ диаметр^(γ+1), и подгонка в log–log даёт y = 0.095·x^2.2. Множественная регрессия с p предикторами: <code>y = Xα + r</code>, X размера N×(p+1) с первым столбцом из единиц. Минимизация <code>‖Xα − y‖²</code> даёт <code>XᵀXα = Xᵀy</code>, то есть <code>α = (XᵀX)⁻¹Xᵀy</code>, если XᵀX обратима. Multivariate-регрессия — это несколько откликов. Полиномиальная регрессия считает x, x², …, x^p отдельными регрессорами — частный случай множественной с матрицей Вандермонда; нужно p &lt; N и различные x_i, при большой степени XᵀX плохо обусловлена, а коэффициенты трудно интерпретировать.`],
['R3','7. Non-linear least squares (Gauss–Newton)','B2',
`In non-linear regression the model y = f(x, α) + r is non-linear in the parameters, so the normal equations <code>Σ (y_i − f(x_i, α)) ∂f/∂α_j = 0</code> are non-linear and generally have no closed-form solution. The parameters are refined iteratively from initial values: <code>α^(k+1) = α^k + Δα</code>. At each iteration the model is linearised by a first-order Taylor expansion around α^k, <code>f(x_i, α) ≈ f(x_i, α^k) + Σ_j J_ij Δα_j</code>, where J is the Jacobian. Substituting into the gradient equations gives the linear system <code>(JᵀJ) Δα = Jᵀ Δy</code> with Δy_i = y_i − f(x_i, α^k): the Gauss–Newton step. Good initial estimates come from simulation, transformations or linearisation. Common stopping rules are a relative decrease of the sum of squares below 10⁻⁴ or relative parameter changes below 10⁻³. If the Jacobian is hard to derive it is approximated by finite differences. Compared with linear least squares, the non-linear problem needs initial values, may fail to converge, may have several minima (parameters raised to powers, interchangeable parameters, trigonometric functions) and gives generally biased estimates.`,
`В нелинейной регрессии модель y = f(x, α) + r нелинейна по параметрам, поэтому нормальные уравнения <code>Σ(y_i − f(x_i, α))·∂f/∂α_j = 0</code> нелинейны и обычно не решаются в замкнутом виде. Параметры уточняются итерациями от начальных значений: <code>α^(k+1) = α^k + Δα</code>. На каждой итерации модель линеаризуется рядом Тейлора первого порядка около α^k: <code>f(x_i, α) ≈ f(x_i, α^k) + Σ_j J_ij Δα_j</code>, J — якобиан. Подстановка в уравнения градиента даёт линейную систему <code>(JᵀJ)Δα = JᵀΔy</code>, Δy_i = y_i − f(x_i, α^k) — шаг Гаусса–Ньютона. Хорошие старты дают симуляция, преобразования или линеаризация. Типичные критерии остановки: относительное уменьшение суммы квадратов меньше 10⁻⁴ или относительное изменение параметров меньше 10⁻³. Если якобиан трудно вывести, его приближают конечными разностями. В отличие от линейного МНК, нелинейному нужны начальные значения, он может не сойтись, иметь несколько минимумов (параметры в степени, взаимозаменяемые параметры, тригонометрия) и обычно даёт смещённые оценки.`],
['R4','8. Cross-validation','B2',
`A polynomial of degree N − 1 interpolates all N points, so the training sum of squares is zero and says nothing about prediction. Cross-validation estimates how a model generalises to unseen data and detects overfitting: the data are split into a training set, used to fit the model, and a test set, used to evaluate it, and several rounds are averaged. Exhaustive methods try every split: leave-p-out uses p points for testing and needs C(N, p) fits (for N = 100 and p = 30, about 2.9·10²⁵), and leave-one-out is the case p = 1 with N fits. Non-exhaustive methods include holdout (one random split, typically 10–33 % for testing, fast but split-dependent), k-fold (k equal folds, each point tested exactly once and trained on k − 1 times; k = N gives LOO), Monte Carlo cross-validation (repeated random splits that may overlap) and the stratified and repeated variants. To choose the degree of a polynomial, fit each degree on the training data and choose the one with the smallest test error. For the course's nine points both holdout (SSE 0.916) and LOO select degree 2.`,
`Полином степени N − 1 проходит через все N точек, ошибка на обучении равна нулю и ничего не говорит о предсказании. Кросс-валидация оценивает, как модель обобщается на новые данные, и выявляет переобучение: данные делят на обучающую часть (подгонка) и тестовую (оценка), несколько раундов усредняют. Исчерпывающие методы перебирают все разбиения: leave-p-out тестирует на p точках и требует C(N, p) обучений (N = 100, p = 30 — около 2.9·10²⁵), leave-one-out — случай p = 1 с N обучениями. Неисчерпывающие: holdout (одно случайное разбиение, тест обычно 10–33 %, быстро, но зависит от разбиения), k-fold (k равных частей, каждая точка в тесте ровно раз и в обучении k − 1 раз; k = N даёт LOO), Monte Carlo (повторные случайные разбиения с пересечениями), а также stratified и repeated. Чтобы выбрать степень полинома, обучаем каждую степень на обучающих данных и берём ту, у которой меньше ошибка на тесте. Для девяти точек курса и holdout (SSE 0.916), и LOO выбирают степень 2.`],
['A1','9. Matrices, rank and linear systems','B3',
`For a square matrix the determinant is multiplicative, det(AB) = det A det B, satisfies det(λA) = λⁿ det A and det Aᵀ = det A, changes sign when two rows are swapped and is unchanged when a multiple of one row is added to another; A is invertible exactly when det A ≠ 0, and then <code>A⁻¹ = adj(A)/det A</code>. Laplace expansion costs O(n!), Gaussian elimination O(n³). The rank is the maximal order of a non-zero minor, equivalently the maximal number of linearly independent rows or columns, and equals the number of pivots in a row echelon form; Kronecker's bordering theorem reduces the number of minors to check. The Rouché–Capelli theorem states that Ax = b has solutions if and only if rank A = rank [A|b]. If this common rank equals the number of unknowns n, the solution is unique; if it is r &lt; n, there are ∞^(n−r) solutions depending on n − r free parameters. A homogeneous system always has the trivial solution. Solutions are found by elimination of variables, by Cramer's rule <code>x_i = det A_i / det A</code> for small square systems, or by Gaussian elimination followed by back substitution.`,
`Определитель квадратной матрицы мультипликативен, det(AB) = det A·det B, det(λA) = λⁿdet A, det Aᵀ = det A, меняет знак при перестановке строк и не меняется при прибавлении к строке кратного другой; A обратима тогда и только тогда, когда det A ≠ 0, и тогда <code>A⁻¹ = adj(A)/det A</code>. Разложение Лапласа стоит O(n!), метод Гаусса — O(n³). Ранг — максимальный порядок ненулевого минора, то есть максимальное число линейно независимых строк или столбцов, и равен числу опорных элементов ступенчатой формы; теорема Кронекера об окаймляющих минорах сокращает перебор. Теорема Руше–Капелли: Ax = b совместна тогда и только тогда, когда rank A = rank[A|b]. Если общий ранг равен числу неизвестных n — решение единственно; если r &lt; n — ∞^(n−r) решений с n − r свободными параметрами. Однородная система всегда имеет тривиальное решение. Решают исключением переменных, правилом Крамера <code>x_i = det A_i/det A</code> для малых квадратных систем или методом Гаусса с обратной подстановкой.`],
['A2','10. Vector spaces, norms and Gram–Schmidt','B3',
`A real vector space is a set closed under addition and multiplication by scalars satisfying the usual axioms, for example Rⁿ or polynomials of degree at most n. Vectors v_1, …, v_n are linearly independent if <code>Σ λ_i v_i = 0</code> forces all λ_i = 0. A system of generators spans the space; a basis is an independent system of generators, and the dimension is the number of basis vectors. A subspace must contain the zero vector; sums and intersections of subspaces are subspaces, unions generally are not, and Grassmann's formula gives <code>dim(U + V) = dim U + dim V − dim(U ∩ V)</code>. A scalar product is a symmetric, positive-definite bilinear form; it induces the norm <code>‖v‖ = sqrt(v·v)</code> and satisfies Cauchy–Schwarz |u·v| ≤ ‖u‖‖v‖. Orthogonal non-zero vectors are independent, not conversely. Lp norms are <code>(Σ |v_i|^p)^(1/p)</code> for p ≥ 1, with the 1-, 2- and max-norms as special cases. Matrix norms induced by them are the maximum absolute column sum, the spectral norm and the maximum absolute row sum; the Frobenius norm is entry-wise. Gram–Schmidt turns any basis into an orthonormal one by subtracting projections on the previous vectors and normalising.`,
`Вещественное векторное пространство — множество, замкнутое относительно сложения и умножения на число с обычными аксиомами, например Rⁿ или многочлены степени не выше n. Векторы v_1, …, v_n линейно независимы, если из <code>Σλ_i v_i = 0</code> следует, что все λ_i = 0. Система образующих порождает пространство; базис — независимая система образующих, размерность — число векторов базиса. Подпространство обязано содержать нулевой вектор; сумма и пересечение подпространств — подпространства, объединение в общем нет; формула Грассмана <code>dim(U + V) = dim U + dim V − dim(U ∩ V)</code>. Скалярное произведение — симметричная положительно определённая билинейная форма; оно порождает норму <code>‖v‖ = √(v·v)</code> и неравенство Коши–Шварца |u·v| ≤ ‖u‖‖v‖. Ортогональные ненулевые векторы независимы, обратное неверно. Нормы Lp: <code>(Σ|v_i|^p)^(1/p)</code> при p ≥ 1, частные случаи — 1-, 2- и max-норма. Индуцированные матричные нормы — максимальная сумма модулей по столбцу, спектральная и максимальная по строке; Фробениус — поэлементная. Грам–Шмидт превращает любой базис в ортонормированный: вычитаем проекции на предыдущие векторы и нормируем.`],
['A3','11. Eigenvalues, diagonalisation, quadratic forms','B3',
`A scalar λ is an eigenvalue of A if <code>Av = λv</code> for some non-zero v, the eigenvector; the eigenvector is only scaled by λ. The condition is equivalent to the homogeneous system (A − λI)v = 0 having non-trivial solutions, so the eigenvalues are the roots of the characteristic equation <code>det(A − λI) = 0</code>. For each eigenvalue we solve (A − λI)v = 0 to get the eigenspace. The algebraic multiplicity is the multiplicity of the root, the geometric multiplicity is <code>n − rank(A − λI)</code>, and 1 ≤ μ_g ≤ μ_a. Moreover det A is the product and tr A the sum of the eigenvalues, and A is invertible if and only if no eigenvalue is zero. A matrix is diagonalisable, <code>A = PΛP⁻¹</code> with the eigenvectors as columns of P, if and only if all eigenvalues are real, their algebraic multiplicities add up to n and μ_a = μ_g for each. A real symmetric matrix has real eigenvalues and orthonormal eigenvectors, <code>A = QΛQᵀ</code>. A quadratic form <code>xᵀAx</code> with A symmetric is positive definite iff all eigenvalues are positive, iff all leading principal minors are positive (Sylvester); indefinite forms have eigenvalues of both signs.`,
`Число λ — собственное значение A, если <code>Av = λv</code> для некоторого ненулевого v (собственного вектора); вектор лишь растягивается в λ раз. Условие равносильно тому, что однородная система (A − λI)v = 0 имеет нетривиальные решения, поэтому собственные значения — корни характеристического уравнения <code>det(A − λI) = 0</code>. Для каждого λ решаем (A − λI)v = 0 и получаем собственное подпространство. Алгебраическая кратность — кратность корня, геометрическая — <code>n − rank(A − λI)</code>, 1 ≤ μ_g ≤ μ_a. Кроме того, det A — произведение, а tr A — сумма собственных значений, и A обратима тогда и только тогда, когда среди них нет нуля. Матрица диагонализуема, <code>A = PΛP⁻¹</code> со столбцами P из собственных векторов, тогда и только тогда, когда все λ вещественны, сумма алгебраических кратностей равна n и μ_a = μ_g для каждого λ. Вещественная симметричная матрица имеет вещественные λ и ортонормированные векторы, <code>A = QΛQᵀ</code>. Квадратичная форма <code>xᵀAx</code> с симметричной A положительно определена ⇔ все λ положительны ⇔ все ведущие главные миноры положительны (Сильвестр); у неопределённой формы λ разных знаков.`],
['A4','12. Principal Component Analysis','B3',
`PCA reduces the dimensionality of a data set of N observations of p correlated variables while keeping as much variance as possible. Principal components are new variables, linear combinations of the original ones, that are uncorrelated and ordered so that the first explains the largest variance, the second the largest remaining variance orthogonally to the first, and so on. Algorithm: (1) standardise each column, <code>z_ij = (x_ij − μ_j)/σ_j</code>, so that variables with large ranges do not dominate; (2) compute the p×p covariance matrix of the standardised data, which is the correlation matrix; (3) compute its eigenvectors and eigenvalues and sort them in decreasing order: the eigenvectors are the principal directions, the eigenvalues the variances along them; (4) keep q &lt; p eigenvectors as the columns of the p×q feature vector; (5) project, <code>FinalData = Z · FeatureVector</code>, an N×q matrix, which is a change of basis. To choose q we keep eigenvalues larger than their mean (equal to 1, since the trace is p), require a cumulative explained variance of at least 80 %, or look for the elbow of the scree plot. For Iris the eigenvalues 2.91, 0.92, 0.15, 0.02 mean that two components explain 95.8 %. PCA captures only linear correlations and the components are hard to interpret.`,
`PCA снижает размерность набора из N наблюдений p коррелированных переменных, сохраняя как можно больше дисперсии. Главные компоненты — новые переменные, линейные комбинации исходных, некоррелированные и упорядоченные: первая объясняет наибольшую дисперсию, вторая — наибольшую оставшуюся ортогонально первой и так далее. Алгоритм: (1) стандартизовать каждый столбец <code>z_ij = (x_ij − μ_j)/σ_j</code>, чтобы переменные с большим диапазоном не доминировали; (2) вычислить p×p матрицу ковариаций стандартизованных данных — это корреляционная матрица; (3) найти её собственные векторы и значения и отсортировать по убыванию: векторы — главные направления, значения — дисперсии вдоль них; (4) взять q &lt; p векторов как столбцы feature vector p×q; (5) спроецировать: <code>FinalData = Z·FeatureVector</code> размера N×q — смена базиса. Для выбора q оставляем собственные значения больше среднего (оно равно 1, так как след равен p), требуем накопленную долю не менее 80 % или ищем «локоть» scree plot. Для Iris λ = 2.91, 0.92, 0.15, 0.02: две компоненты объясняют 95.8 %. PCA ловит только линейные зависимости, а компоненты трудно интерпретировать.`],
['C1','13. Similarity measures and distances','B4',
`Most data analysis tasks, especially clustering, rely on a distance. Similarities are high for alike objects, dissimilarities low; both can be mapped to proximities in [0, 1], e.g. <code>d' = d/(1 + d)</code>. A metric satisfies non-negativity, identity (d = 0 iff x = y), symmetry and the triangle inequality; relaxing one axiom gives pseudometrics, quasimetrics and semimetrics. Any norm induces a metric <code>d(x, y) = ‖x − y‖</code>. The Lp distances include Manhattan L1, Euclidean L2 (the only Lp distance invariant under rotations) and Chebyshev L∞, the maximum coordinate difference (king moves on a chessboard). L0 counts differing coordinates (Hamming for binary data). The Mahalanobis distance <code>sqrt((x − y)ᵀM(x − y))</code> accounts for correlations. The cosine distance 1 − cos θ lies in [0, 2] and is not a metric; the angular distance is. For sets, the Jaccard distance is <code>1 − |A∩B|/|A∪B|</code>; the Hausdorff distance is the larger of the two directed distances sup_x inf_y d(x, y). For strings, edit distances count operations: LCS (insert, delete), Levenshtein (plus substitution), Hamming (substitution, equal lengths), Damerau (plus transposition). Texts are compared via bag-of-words vectors and cosine distance, or via k-grams and Jaccard.`,
`Большинство задач анализа данных, особенно кластеризация, опираются на расстояние. Сходство велико у похожих объектов, несходство мало; оба приводятся к близости в [0, 1], например <code>d' = d/(1 + d)</code>. Метрика удовлетворяет неотрицательности, тождеству (d = 0 ⇔ x = y), симметрии и неравенству треугольника; ослабление одной аксиомы даёт псевдо-, квази- и семиметрики. Любая норма порождает метрику <code>d(x, y) = ‖x − y‖</code>. Расстояния Lp: Манхэттен L1, Евклид L2 (единственная Lp, инвариантная к поворотам) и Чебышёв L∞ — максимальная разность координат (ходы короля). L0 считает различающиеся координаты (Хэмминг для бинарных данных). Махаланобис <code>√((x − y)ᵀM(x − y))</code> учитывает корреляции. Косинусное расстояние 1 − cos θ лежит в [0, 2] и не метрика; угловое — метрика. Для множеств: Жаккар <code>1 − |A∩B|/|A∪B|</code>; Хаусдорф — большее из двух направленных расстояний sup_x inf_y d(x, y). Для строк редакционные расстояния считают операции: LCS (вставка, удаление), Левенштейн (плюс замена), Хэмминг (замена, равные длины), Дамерау (плюс перестановка). Тексты сравнивают векторами bag-of-words с косинусным расстоянием или k-граммами с Жаккаром.`],
['C2','14. Hierarchical clustering','B4',
`Clustering groups data so that points in the same cluster are close and points in different clusters are far apart. Hierarchical clustering builds a hierarchy shown as a dendrogram. The agglomerative (bottom-up) strategy starts with every observation as its own cluster and repeatedly merges the two closest clusters, O(N³); the divisive (top-down) strategy, such as DIANA, starts from one cluster and splits it, O(2^(N−1)). Only the distance matrix is needed, but the method is not robust to outliers. The dissimilarity between clusters is defined by a linkage criterion: single linkage uses the minimum pairwise distance (long chains), complete linkage the maximum, UPGMA the average of all pairs, updated as <code>(|r|d(r,k) + |s|d(s,k))/(|r| + |s|)</code>, WPGMA the simple average <code>(d(r,k) + d(s,k))/2</code>, centroid and median linkages use cluster means, and Ward minimises the increase of the sum of squares. The algorithm finds the minimum of the matrix, merges the pair at height D/2 and replaces the two rows and columns by one using the linkage rule. Cutting the dendrogram at a height gives a partition; the cophenetic correlation and the inconsistency coefficient assess the tree.`,
`Кластеризация группирует данные так, чтобы точки одного кластера были близки, а разных — далеки. Иерархическая кластеризация строит иерархию, изображаемую дендрограммой. Агломеративная (снизу вверх) начинает с кластера на каждое наблюдение и многократно сливает два ближайших, O(N³); дивизивная (сверху вниз, например DIANA) начинает с одного кластера и делит его, O(2^(N−1)). Нужна только матрица расстояний, но метод не робастен к выбросам. Несходство кластеров задаёт критерий связи: single — минимальное расстояние между парами (длинные цепочки), complete — максимальное, UPGMA — среднее по всем парам с обновлением <code>(|r|d(r,k) + |s|d(s,k))/(|r| + |s|)</code>, WPGMA — простое среднее <code>(d(r,k) + d(s,k))/2</code>, centroid и median используют средние кластеров, Ward минимизирует прирост суммы квадратов. Алгоритм находит минимум матрицы, сливает пару на высоте D/2 и заменяет две строки и столбца одной по правилу связи. Разрез дендрограммы на высоте даёт разбиение; кофенетическая корреляция и коэффициент несогласованности оценивают дерево.`],
['C3','15. k-means and its variants','B4',
`Given N points in Rᵖ and a number k, k-means looks for a partition C_1, …, C_k and representatives μ_i minimising the within-cluster sum of squares <code>Σ_i Σ_{j∈C_i} ‖x_j − μ_i‖²</code>, equivalently ‖X − ZU‖²_F. The problem is NP-hard, but two sub-problems are easy. For a fixed partition the optimal representatives are the centroids <code>μ_i = (1/|C_i|) Σ_{j∈C_i} x_j</code>, because each coordinate gives a quadratic minimised at −b/2a. For fixed representatives the optimal partition assigns every point to the nearest centre. Lloyd's algorithm alternates the assignment and update steps until assignments stop changing. Each step cannot increase the objective, which is bounded below by zero, so the values converge by the monotone convergence theorem, but only to a local minimum depending on the initialisation; running time is O(Nkpi). k must be chosen in advance (elbow method, silhouette, DB, CH), and the model assumes spherical clusters of similar size. k-means++ picks each new initial centre with probability proportional to the squared distance from the chosen centres and is O(log k)-competitive. k-medians uses the L1 norm and medians; k-medoids (PAM with BUILD and SWAP) restricts centres to data points and works with any dissimilarity, being more robust to outliers.`,
`Для N точек в Rᵖ и числа k метод k-means ищет разбиение C_1, …, C_k и представителей μ_i, минимизирующих внутрикластерную сумму квадратов <code>Σ_i Σ_{j∈C_i}‖x_j − μ_i‖²</code>, то есть ‖X − ZU‖²_F. Задача NP-трудна, но две подзадачи просты. При фиксированном разбиении лучшие представители — центроиды <code>μ_i = (1/|C_i|)Σ_{j∈C_i} x_j</code>: по каждой координате минимум квадратичной функции в −b/2a. При фиксированных представителях лучшее разбиение — каждую точку к ближайшему центру. Алгоритм Ллойда чередует шаги назначения и обновления, пока назначения меняются. Ни один шаг не увеличивает цель, ограниченную снизу нулём, поэтому значения сходятся (теорема о монотонной сходимости), но лишь к локальному минимуму, зависящему от старта; время O(Nkpi). k нужно задать заранее (локоть, силуэт, DB, CH), модель предполагает сферические кластеры похожего размера. k-means++ выбирает каждый новый стартовый центр с вероятностью, пропорциональной квадрату расстояния до выбранных, и O(log k)-конкурентен. k-medians использует норму L1 и медианы; k-medoids (PAM: BUILD и SWAP) берёт центры из точек данных и работает с любым несходством, он робастнее к выбросам.`],
['C4','16. DBSCAN, fuzzy c-means, evaluation','B4',
`Density-based clustering defines clusters as regions of higher density. DBSCAN has two parameters, the radius ε and the minimum number of points minPts. A core point has at least minPts points within distance ε; a border point lies in a cluster but has fewer neighbours; a noise point is not reachable from any point. A point is directly reachable from a core point within ε, reachability follows chains of core points, and a cluster is a connected component of density-connected points. DBSCAN needs no number of clusters, finds arbitrarily shaped clusters and detects outliers, but struggles with clusters of very different densities; minPts ≥ p + 1, and ε is read from the knee of the k-distance graph. In soft clustering points belong to several clusters with degrees of membership. Fuzzy c-means minimises <code>Σ_i Σ_j w_ij^m ‖x_i − c_j‖²</code> with <code>w_ij = 1/Σ_ℓ (‖x_i − c_j‖/‖x_i − c_ℓ‖)^(2/(m−1))</code> and weighted centroids; m ≈ 2, and m → 1 gives k-means. Clusterings are evaluated by the silhouette <code>S(i) = (b(i) − a(i))/max(a(i), b(i))</code> in [−1, 1] (higher is better), the Davies–Bouldin index (lower is better) and the Calinski–Harabasz index <code>BCSS/WCSS · (N − k)/(k − 1)</code> (higher is better).`,
`Плотностная кластеризация определяет кластеры как области повышенной плотности. У DBSCAN два параметра: радиус ε и минимальное число точек minPts. Ядровая точка имеет не менее minPts точек в радиусе ε; граничная лежит в кластере, но соседей меньше; шумовая недостижима ни из какой точки. Точка непосредственно достижима из ядровой в радиусе ε, достижимость идёт по цепочкам ядровых точек, а кластер — компонента связности плотностно-связанных точек. DBSCAN не требует числа кластеров, находит кластеры любой формы и выбросы, но плохо работает при сильно разной плотности; minPts ≥ p + 1, а ε берут по «колену» графика k-расстояний. В мягкой кластеризации точки принадлежат нескольким кластерам со степенями принадлежности. Fuzzy c-means минимизирует <code>Σ_iΣ_j w_ij^m‖x_i − c_j‖²</code> с <code>w_ij = 1/Σ_ℓ(‖x_i − c_j‖/‖x_i − c_ℓ‖)^(2/(m−1))</code> и взвешенными центроидами; m ≈ 2, при m → 1 получаем k-means. Качество оценивают силуэтом <code>S(i) = (b(i) − a(i))/max(a(i), b(i))</code> в [−1, 1] (выше лучше), индексом Davies–Bouldin (ниже лучше) и Calinski–Harabasz <code>BCSS/WCSS·(N − k)/(k − 1)</code> (выше лучше).`],
['O1','17. Optimality conditions and convexity','B5',
`We minimise f: Rᴺ → R. A point is a global minimum if f(x) ≥ f(x*) everywhere and a local minimum if this holds in a ball around x*. If f is continuously differentiable and x* is a local minimum, then <code>∇f(x*) = 0</code> (first-order necessary condition), because otherwise −∇f would be a descent direction. If f is twice differentiable, a local minimum also has a positive semi-definite Hessian; conversely, ∇f = 0 and a positive definite Hessian imply a strict local minimum. f(x) = x³ shows that a stationary point need not be a minimum. A set is convex if it contains every segment between its points (balls of any norm, subspaces, the cone of PSD matrices). A function is convex if <code>f((1−α)x + αy) ≤ (1−α)f(x) + αf(y)</code>; for differentiable f this is equivalent to <code>f(y) ≥ f(x) + ∇f(x)ᵀ(y − x)</code>, and for twice differentiable f to a positive semi-definite Hessian everywhere. For convex functions every local minimum is global and ∇f(x₀) = 0 is necessary and sufficient. Strict convexity (implied by H ≻ 0) gives uniqueness; strong convexity, H ⪰ mI, also gives existence. For least squares, H = 2AᵀA ≻ 0 and x* = (AᵀA)⁻¹Aᵀb.`,
`Минимизируем f: Rᴺ → R. Точка — глобальный минимум, если f(x) ≥ f(x*) всюду, и локальный, если это верно в шаре вокруг x*. Если f непрерывно дифференцируема и x* — локальный минимум, то <code>∇f(x*) = 0</code> (необходимое условие первого порядка), иначе −∇f было бы направлением спуска. Если f дважды дифференцируема, в локальном минимуме гессиан ещё и положительно полуопределён; обратно, ∇f = 0 и положительно определённый гессиан дают строгий локальный минимум. f(x) = x³ показывает, что стационарная точка не обязана быть минимумом. Множество выпукло, если содержит любой отрезок между своими точками (шары любой нормы, подпространства, конус PSD-матриц). Функция выпукла, если <code>f((1−α)x + αy) ≤ (1−α)f(x) + αf(y)</code>; для дифференцируемой f это равносильно <code>f(y) ≥ f(x) + ∇f(x)ᵀ(y − x)</code>, для дважды дифференцируемой — положительной полуопределённости гессиана всюду. Для выпуклых функций любой локальный минимум глобален, и ∇f(x₀) = 0 необходимо и достаточно. Строгая выпуклость (следует из H ≻ 0) даёт единственность; сильная, H ⪰ mI, — ещё и существование. Для МНК H = 2AᵀA ≻ 0 и x* = (AᵀA)⁻¹Aᵀb.`],
['O2','18. Descent methods and line search','B5',
`Descent methods generate a minimising sequence <code>x_(k+1) = x_k + α_k d_k</code> with f decreasing at each step. The search direction must satisfy ∇f(x_k)ᵀd_k &lt; 0, i.e. make an angle smaller than π/2 with −∇f; in general <code>d_k = −B_k⁻¹ ∇f(x_k)</code> with B_k = I for gradient descent and B_k = H_f for Newton. The negative gradient is the steepest descent direction by Cauchy–Schwarz, and gradient descent stops when ‖∇f‖ ≤ ε; it is cheap and needs O(N) memory but only guarantees stationary points. The step length is chosen by a line search on φ(α) = f(x_k + α d_k). Exact line search minimises φ; for a quadratic it gives <code>α = ‖g‖²/(gᵀPg)</code> and a zig-zag path. Inexact searches use the Wolfe conditions: sufficient decrease <code>f(x + αd) ≤ f(x) + c₁ α ∇fᵀd</code> (Armijo) and curvature <code>∇f(x + αd)ᵀd ≥ c₂ ∇fᵀd</code>, with 0 &lt; c₁ &lt; c₂ &lt; 1; the strong version bounds |φ′(α)|. The Goldstein conditions (c &lt; ½) bound the step from both sides. Backtracking starts with α = 1 and multiplies by b ∈ (0, 1) until the Armijo condition with a ∈ (0, 0.5) holds.`,
`Методы спуска строят минимизирующую последовательность <code>x_(k+1) = x_k + α_k d_k</code>, на каждом шаге f убывает. Направление должно удовлетворять ∇f(x_k)ᵀd_k &lt; 0, то есть составлять с −∇f угол меньше π/2; в общем виде <code>d_k = −B_k⁻¹∇f(x_k)</code>, B_k = I для градиентного спуска и B_k = H_f для Ньютона. Антиградиент — направление наискорейшего спуска (Коши–Шварц); градиентный спуск останавливают при ‖∇f‖ ≤ ε, он дёшев и требует O(N) памяти, но гарантирует лишь стационарные точки. Длину шага выбирает линейный поиск по φ(α) = f(x_k + αd_k). Точный поиск минимизирует φ; для квадратичной функции <code>α = ‖g‖²/(gᵀPg)</code> и путь-зигзаг. Неточный поиск использует условия Вольфе: достаточное убывание <code>f(x + αd) ≤ f(x) + c₁α∇fᵀd</code> (Армихо) и кривизну <code>∇f(x + αd)ᵀd ≥ c₂∇fᵀd</code>, 0 &lt; c₁ &lt; c₂ &lt; 1; сильная версия ограничивает |φ′(α)|. Условия Гольдштейна (c &lt; ½) ограничивают шаг с двух сторон. Backtracking начинает с α = 1 и умножает на b ∈ (0, 1), пока не выполнено Армихо с a ∈ (0, 0.5).`],
['O3','19. Convergence of gradient descent','B5',
`Convergence rates measure how fast an error φ_k goes to zero. Sublinear rates C/√k, C/k and C/k² need O(1/ε²), O(1/ε) and O(1/√ε) iterations; Q-linear convergence φ_(k+1)/φ_k ≤ 1 − σ implies φ_k ≤ C(1 − σ)^k and O(log(1/ε)/σ) iterations; superlinear means the ratio tends to zero; quadratic convergence gives O(log log(1/ε)). A function is L-smooth if its gradient is L-Lipschitz, equivalently −LI ⪯ H ⪯ LI, which gives the quadratic upper bound and, for the step 1/L, the descent lemma <code>f(x − ∇f/L) ≤ f(x) − ‖∇f‖²/(2L)</code>. For an L-smooth function bounded below, gradient descent with step 1/L gives <code>min ‖∇f(x_k)‖ ≤ sqrt(2L(f(x₀) − f̄)/T)</code>; if f is also convex, <code>f(x_T) − f* ≤ L‖x₀ − x*‖²/(2T)</code>; if f is m-strongly convex, using f(x) − f* ≤ ‖∇f‖²/(2m), <code>f(x_T) − f* ≤ (1 − m/L)^T (f(x₀) − f*)</code>, a linear rate with O(κ log(1/ε)) iterations, κ = L/m. For a quadratic with exact line search the factor is ((L − m)/(L + m))², and the best constant step is 2/(L + m). With κ around 1000 gradient descent is practically useless. The conditional gradient method converges as 2LD²/(k + 2).`,
`Скорость сходимости показывает, как быстро ошибка φ_k стремится к нулю. Сублинейные скорости C/√k, C/k и C/k² требуют O(1/ε²), O(1/ε) и O(1/√ε) итераций; Q-линейная φ_(k+1)/φ_k ≤ 1 − σ даёт φ_k ≤ C(1 − σ)^k и O(log(1/ε)/σ) итераций; сверхлинейная — отношение стремится к нулю; квадратичная даёт O(log log(1/ε)). Функция L-гладкая, если её градиент L-липшицев, то есть −LI ⪯ H ⪯ LI; отсюда квадратичная оценка сверху и для шага 1/L лемма о спуске <code>f(x − ∇f/L) ≤ f(x) − ‖∇f‖²/(2L)</code>. Для L-гладкой функции, ограниченной снизу, спуск с шагом 1/L даёт <code>min‖∇f(x_k)‖ ≤ √(2L(f(x₀) − f̄)/T)</code>; если f ещё и выпукла, <code>f(x_T) − f* ≤ L‖x₀ − x*‖²/(2T)</code>; если f m-сильно выпукла, то, используя f(x) − f* ≤ ‖∇f‖²/(2m), <code>f(x_T) − f* ≤ (1 − m/L)^T(f(x₀) − f*)</code> — линейная скорость и O(κ log(1/ε)) итераций, κ = L/m. Для квадратичной функции с точным поиском множитель ((L − m)/(L + m))², лучший постоянный шаг 2/(L + m). При κ около 1000 градиентный спуск практически бесполезен. Условный градиент сходится как 2LD²/(k + 2).`],
['O4','20. Heavy ball and conjugate gradient','B5',
`Gradient descent zig-zags when the curvature differs a lot between directions. Momentum methods continue along the previous direction. The heavy-ball method of Polyak, <code>x_(k+1) = x_k − α∇f(x_k) + β(x_k − x_(k−1))</code>, discretises a ball rolling with friction; for a strongly convex quadratic with <code>α = 4/(√L + √m)²</code> and <code>β = ((√L − √m)/(√L + √m))²</code> it converges linearly in O(√κ log(1/ε)) iterations instead of O(κ log(1/ε)). It needs m and L and is not a descent method. The linear conjugate gradient method of Hestenes and Stiefel solves Ax = b with A symmetric positive definite, equivalently minimises ½xᵀAx − bᵀx. It uses A-conjugate directions, d_iᵀAd_j = 0, computing each from the previous one: <code>α_k = r_kᵀr_k/(d_kᵀAd_k)</code>, <code>x_(k+1) = x_k + α_k d_k</code>, <code>r_(k+1) = r_k − α_k A d_k</code>, <code>β = r_(k+1)ᵀr_(k+1)/r_kᵀr_k</code>, <code>d_(k+1) = r_(k+1) + β d_k</code>. It terminates in at most N steps, in r steps if A has r distinct eigenvalues, and preconditioning improves the spectrum. Non-linear versions are Fletcher–Reeves (globally convergent with strong Wolfe and c₂ &lt; ½), Polak–Ribière (better in practice, effectively restarts), Hestenes–Stiefel, Dai–Yuan and Hager–Zhang, often with restarts every N steps.`,
`Градиентный спуск зигзагует, когда кривизна сильно различается по направлениям. Методы с импульсом продолжают движение по предыдущему направлению. Метод тяжёлого шара Поляка <code>x_(k+1) = x_k − α∇f(x_k) + β(x_k − x_(k−1))</code> — дискретизация шара, катящегося с трением; для сильно выпуклой квадратичной функции при <code>α = 4/(√L + √m)²</code> и <code>β = ((√L − √m)/(√L + √m))²</code> сходится линейно за O(√κ log(1/ε)) итераций вместо O(κ log(1/ε)). Нужны m и L, и это не метод спуска. Линейный метод сопряжённых градиентов Хестенса–Штифеля решает Ax = b с симметричной положительно определённой A, то есть минимизирует ½xᵀAx − bᵀx. Он использует A-сопряжённые направления d_iᵀAd_j = 0, строя каждое по предыдущему: <code>α_k = r_kᵀr_k/(d_kᵀAd_k)</code>, <code>x_(k+1) = x_k + α_k d_k</code>, <code>r_(k+1) = r_k − α_k A d_k</code>, <code>β = r_(k+1)ᵀr_(k+1)/r_kᵀr_k</code>, <code>d_(k+1) = r_(k+1) + βd_k</code>. Он завершается не более чем за N шагов, за r шагов при r различных собственных значениях, а предобуславливание улучшает спектр. Нелинейные версии: Флетчер–Ривс (глобально сходится при сильных Вольфе с c₂ &lt; ½), Полак–Рибьер (лучше на практике, сам перезапускается), Хестенс–Штифель, Дай–Юань и Хагер–Чжан, часто с рестартом каждые N шагов.`],
['O5','21. Newton’s method','B5',
`Second-order methods use the Hessian. Newton's method minimises the quadratic model <code>m(d) = f(x_k) + ∇f(x_k)ᵀd + ½dᵀH_f(x_k)d</code>; setting its gradient to zero gives the Newton direction <code>d_k = −H_f(x_k)⁻¹ ∇f(x_k)</code>, which is a descent direction when the Hessian is positive definite, since ∇fᵀd = −∇fᵀH⁻¹∇f &lt; 0. The natural step length is 1. Locally, if the Hessian is L-Lipschitz near a solution x* with ∇f(x*) = 0 and H_f(x*) ⪰ mI, and ‖x₀ − x*‖ ≤ m/(2L), then <code>‖x_(k+1) − x*‖ ≤ (L/m)‖x_k − x*‖²</code>: quadratic convergence, with the Wolfe conditions eventually accepting α = 1. Globally, with a Wolfe line search and Hessians positive definite with bounded condition number, the method converges. Its drawbacks are the cost and difficulty of computing and factorising the Hessian, and far from the solution the Newton direction may not be a descent direction. Then the Hessian is modified to B_k = H_f + E_k: replacing eigenvalues below δ by δ (minimal Frobenius correction), shifting by τI with τ = max(0, δ − λ_min), Cholesky with an added multiple of the identity (τ increased until the factorisation succeeds) or the modified LDLᵀ Cholesky of Gill, Murray and Wright.`,
`Методы второго порядка используют гессиан. Метод Ньютона минимизирует квадратичную модель <code>m(d) = f(x_k) + ∇f(x_k)ᵀd + ½dᵀH_f(x_k)d</code>; приравнивая её градиент к нулю, получаем направление Ньютона <code>d_k = −H_f(x_k)⁻¹∇f(x_k)</code> — направление спуска при положительно определённом гессиане, так как ∇fᵀd = −∇fᵀH⁻¹∇f &lt; 0. Естественный шаг равен 1. Локально: если гессиан L-липшицев вблизи решения x* с ∇f(x*) = 0 и H_f(x*) ⪰ mI, а ‖x₀ − x*‖ ≤ m/(2L), то <code>‖x_(k+1) − x*‖ ≤ (L/m)‖x_k − x*‖²</code> — квадратичная сходимость, и условия Вольфе в итоге принимают α = 1. Глобально, с поиском по Вольфе и положительно определёнными гессианами с ограниченным числом обусловленности, метод сходится. Недостатки: дорого и сложно вычислять и факторизовать гессиан, а вдали от решения направление Ньютона может не быть направлением спуска. Тогда гессиан модифицируют до B_k = H_f + E_k: заменяют собственные значения меньше δ на δ (минимальная поправка по Фробениусу), сдвигают на τI с τ = max(0, δ − λ_min), применяют Холецкого с добавкой кратного единичной (τ увеличивают до успешной факторизации) или модифицированный LDLᵀ-Холецкий Гилла, Мюррея и Райта.`],
];

function median(s){ const n=s.length; return n%2? s[(n-1)/2] : (s[n/2-1]+s[n/2])/2; }
function quartiles(a){ const s=[...a].sort((x,y)=>x-y), n=s.length; const lo=s.slice(0,Math.floor(n/2)), hi=s.slice(Math.ceil(n/2)); return {s, q1:median(lo.length?lo:s), q2:median(s), q3:median(hi.length?hi:s)}; }
function linfit(x,y){ const n=x.length, mx=mean(x), my=mean(y); let sxx=0,syy=0,sxy=0; for(let i=0;i<n;i++){ sxx+=(x[i]-mx)**2; syy+=(y[i]-my)**2; sxy+=(x[i]-mx)*(y[i]-my); }
  const vx=sxx/(n-1), vy=syy/(n-1), c=sxy/(n-1); const a=c/vx, b=my-a*mx, r=c/Math.sqrt(vx*vy); return {mx,my,vx,vy,c,a,b,r,vr:vy*(1-r*r)}; }
function eig2(a,b,c,d){ const tr=a+d, det=a*d-b*c, disc=tr*tr-4*det; if(disc<-1e-12) return {tr,det,complex:true,re:tr/2,im:Math.sqrt(-disc)/2};
  const s=Math.sqrt(Math.max(0,disc)); const l1=(tr+s)/2, l2=(tr-s)/2; return {tr,det,complex:false,l1,l2}; }

function parseNum(s){ if(s===undefined||s===null) return null; s=String(s).trim().replace(',','.').replace('−','-').replace('%',''); if(!s) return null; if(/^-?\d+(\.\d+)?\/\d+(\.\d+)?$/.test(s)){ const [a,b]=s.split('/').map(Number); return a/b; } const v=parseFloat(s); return Number.isNaN(v)?null:v; }

const GR={alpha:'α',beta:'β',gamma:'γ',delta:'δ',Delta:'Δ',epsilon:'ε',eta:'η',kappa:'κ',lambda:'λ',mu:'μ',nu:'ν',pi:'π',rho:'ρ',sigma:'σ',tau:'τ',phi:'φ',varphi:'φ',theta:'θ',nabla:'∇',le:'≤',leq:'≤',ge:'≥',geq:'≥',succ:'≻',succeq:'⪰',prec:'≺',infty:'∞',cdot:'·',times:'×',sum:'Σ',to:'→',approx:'≈',neq:'≠',ne:'≠',pm:'±',in:'∈',log:'log',ln:'ln',max:'max',min:'min',det:'det',exp:'exp',quad:' ',qquad:'  ',dots:'…',ldots:'…',cdots:'⋯',top:'ᵀ',partial:'∂',Rightarrow:'⇒',iff:'⇔',forall:'∀',lfloor:'⌊',rfloor:'⌋',cap:'∩',cup:'∪',sup:'sup',inf:'inf',operatorname:''};
function grp(s,i){ // s[i]==='{' → [content,endIndex]
  let d=0; for(let j=i;j<s.length;j++){ if(s[j]==='{') d++; else if(s[j]==='}'){ d--; if(!d) return [s.slice(i+1,j), j+1]; } } return [s.slice(i+1), s.length]; }
function arg(s,i){ while(s[i]===' ') i++; if(s[i]==='{') return grp(s,i); if(s[i]==='\\'){ const m=/^\\[a-zA-Z]+/.exec(s.slice(i)); if(m) return [m[0], i+m[0].length]; } return [s[i]||'', i+1]; }
const simple=t=>/^[\w.αβγδεημλνπρστφθκ∞−-]+$/.test(t)&&!/[+\-−]/.test(t.slice(1));
function tex(s){
  if(s==null) return '';
  return String(s).replace(/\\\(([\s\S]*?)\\\)/g,(m,a)=>texm(a)).replace(/\^\{([^}]*)\}/g,'<sup>$1</sup>').replace(/\^([\dn−-]+)/g,'<sup>$1</sup>').replace(/_\{([^}]*)\}/g,'<sub>$1</sub>').replace(/(^|[\s(=,;:\[])-(?=[\d.])/g,'$1−');
}
function texm(s){
  let out='', i=0;
  while(i<s.length){
    const c=s[i];
    if(c==='\\'){
      const m=/^\\([a-zA-Z]+)/.exec(s.slice(i));
      if(!m){ const n=s[i+1]; out+= n==='|'?'‖': n==='\\'?'; ': (n===','||n===';'||n===' '||n==='!')?' ': n==='{'?'{': n==='}'?'}': n; i+=2; continue; }
      const nm=m[1]; i+=m[0].length;
      if(nm==='frac'||nm==='dfrac'||nm==='tfrac'){ const [a,j]=arg(s,i); const [b,k]=arg(s,j); i=k; const A=texm(a), B=texm(b); const fr=(simple(A)?A:'('+A+')')+'/'+(simple(B)?B:'('+B+')'); out+= /^\s*[\\a-zA-Z(]/.test(s.slice(k))? '('+fr+')' : fr; continue; }
      if(nm==='binom'){ const [a,j]=arg(s,i); const [b,k]=arg(s,j); i=k; out+='C('+texm(a)+', '+texm(b)+')'; continue; }
      if(nm==='sqrt'){ const [a,j]=arg(s,i); i=j; const A=texm(a); out+='√'+(simple(A)?A:'('+A+')'); continue; }
      if(nm==='overline'){ const [a,j]=arg(s,i); i=j; out+='mean('+texm(a)+')'; continue; }
      if(nm==='bar'||nm==='tilde'||nm==='hat'){ const [a,j]=arg(s,i); i=j; out+=texm(a)+({bar:'̄',tilde:'̃',hat:'̂'})[nm]; continue; }
      if(nm==='mathrm'||nm==='text'||nm==='mathbf'||nm==='operatorname'||nm==='mathbb'||nm==='boldsymbol'){ const [a,j]=arg(s,i); i=j; out+=texm(a); continue; }
      if(nm==='left'||nm==='right'||nm==='big'||nm==='Big'||nm==='bigl'||nm==='bigr'){ continue; }
      if(nm==='begin'){ const [env,j]=arg(s,i); const endTag='\\end{'+env+'}'; const e=s.indexOf(endTag,j); const body=s.slice(j,e<0?s.length:e); i=e<0?s.length:e+endTag.length;
        if(/matrix/.test(env)){ const rows=body.split('\\\\').map(r=>r.split('&').map(x=>texm(x).trim()).join('  ')); out+='<span class="mat">'+rows.map(r=>'<span>'+r+'</span>').join('')+'</span>'; }
        else out+=texm(body.replace(/\\\\/g,'; ').replace(/&/g,' ')); continue; }
      out+= GR[nm]!==undefined? GR[nm] : nm; continue;
    }
    if(c==='^'||c==='_'){ const [a,j]=arg(s,i+1); i=j; const tg=c==='^'?'sup':'sub'; out+='<'+tg+'>'+texm(a)+'</'+tg+'>'; continue; }
    if(c==='{'||c==='}'){ i++; continue; }
    out+=c; i++;
  }
  return out.replace(/ {2,}/g,' ').replace(/-/g,'−');
}

let root, live={}; // live[itemId] = current snapshot
function stats(){ let ok=0,n=0; Object.values(S.items).forEach(v=>{ok+=v.ok;n+=v.n;}); const done=Object.values(S.mocks).filter(m=>m.finished); return {ok,n,acc:n?Math.round(ok/n*100):null,mocks:done.length,best:done.length?Math.max(...done.map(m=>m.pct)):null}; }

function statsHTML(){ const st=stats(); return `<div><b>${st.ok}</b>верных</div><div><b>${st.n}</b>попыток</div><div><b>${st.acc===null?'—':st.acc+'%'}</b>точность</div><div><b>${st.best===null?'—':st.best+'%'}</b>лучший мок</div>`; }
function refresh(){ const e=root&&root.querySelector('.stats'); if(e) e.innerHTML=statsHTML(); }
function render(el){ root=el; shell(); }
function shell(){
  root.innerHTML=`<div class="tr-head"><div><p class="tag">Тренажёр</p><h1>Задачи и пробные экзамены</h1></div>
   <div class="stats">${statsHTML()}</div></div>
   <nav class="tabs" role="tablist" style="margin:18px 0 18px"><button role="tab" data-tab="tasks" aria-selected="${S.tab==='tasks'}">Задачи</button><button role="tab" data-tab="mock" aria-selected="${S.tab==='mock'}">Пробный экзамен</button><button role="tab" data-tab="wrong" aria-selected="${S.tab==='wrong'}">Работа над ошибками${S.wrong.length?` (${S.wrong.length})`:''}</button></nav>
   <div id="trpane"></div>`;
  root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; save(); clearInterval(timer); shell(); });
  if(S.tab==='tasks') renderTasks(); else if(S.tab==='wrong') renderWrong(); else renderMockList();
}
function dotFor(id){ const v=S.items[id]; if(!v||!v.n) return '<span class="dot">·</span>'; return `<span class="dot ${v.ok/v.n>=.6?'ok':'bad'}">${v.ok}/${v.n}</span>`; }

/* ---------- tasks tab ---------- */
function renderTasks(){
  const pane=root.querySelector('#trpane');
  let rail='<aside class="trail" aria-label="Список задач">';
  TKEYS.forEach(t=>{ const its=ITEMS.filter(x=>x.t===t); if(!its.length) return; rail+=`<h3>${TOP[t][0]}</h3>`+its.map(x=>`<button data-it="${x.id}" aria-current="${x.id===S.cur}"><span class="nm">${x.name}</span>${dotFor(x.id)}</button>`).join(''); });
  rail+='</aside>';
  pane.innerHTML=`<div class="tgrid">${rail}<div id="tbody"></div></div>`;
  pane.querySelectorAll('[data-it]').forEach(b=>b.onclick=()=>{ S.cur=b.dataset.it; save(); renderTasks(); if(innerWidth<760) document.getElementById('tbody').scrollIntoView({behavior:'smooth',block:'start'}); });
  renderTask();
}
function fresh(it){
  if(it.kind==='gen') return snapGen(it.gi);
  const pool=BANK.filter(q=>q.t===it.t); const prev=live[it.id]; let q;
  do{ q=pool[Math.floor(Math.random()*pool.length)]; }while(pool.length>1&&prev&&B2(q.q)===prev.q);
  return snapBank(q);
}
function renderTask(){
  const it=ITEMS.find(x=>x.id===S.cur); const body=root.querySelector('#tbody');
  const s=live[it.id]||(live[it.id]=fresh(it));
  const v=ist(it.id);
  body.innerHTML=`<article class="board" style="margin:0">
    <div class="qhead"><h2>${it.name}</h2><span class="tag">${TOP[it.t][0]}</span><span class="tag" style="color:var(--muted)">${v.n?`решено <span>${v.ok}</span> из <span>${v.n}</span>`:'ещё не решали'}</span></div>
    <p class="statement">${s.q}</p>
    ${s.o? `<div class="opts">${s.o.map((o,i)=>`<button class="opt" data-o="${i}">${o}</button>`).join('')}</div>`
         : `<div class="ans"><input id="tin" type="text" inputmode="decimal" autocomplete="off" placeholder="Ответ, например 2.75 или 3/4" aria-label="Ваш ответ"><button class="primary" id="tchk">Проверить</button></div><p class="hand" style="margin:6px 0 0;font-size:18px">точность ±1 %, дробь вида a/b тоже можно</p>`}
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:14px"><button id="thint">Подсказка</button><button id="tsol">Показать решение</button><button id="tnew">${it.kind==='gen'?'Новые числа':'Другой вопрос'}</button><a href="#${TOP[it.t][1]}" style="align-self:center;margin-left:auto;font-size:14px">→ урок «${TOP[it.t][0]}»</a></div>
    <div id="tout" style="display:grid;gap:10px;margin-top:14px"></div></article>`;
  const out=body.querySelector('#tout');
  let answered=false;
  const finish=(ok,user)=>{
    if(!answered){ answered=true; v.n++; if(ok) v.ok++; if(!ok) addWrong(s,it.name); else dropWrong(s.q); save(); const d=root.querySelector(`[data-it="${it.id}"] .dot`); if(d) d.outerHTML=dotFor(it.id); refresh(); }
    out.innerHTML=`<div class="verdict ${ok?'ok':'bad'}">${ok?'✓ Верно':'✗ Неверно'+(s.o?'':` — ваш ответ <span>${user}</span>`)}. Правильный ответ: <span>${fmtAns(s)}</span></div><div class="solution"><b>Решение.</b> ${s.e}</div>`;
  };
  if(s.o) body.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{ if(answered) return; const i=+b.dataset.o, ok=i===s.a; body.querySelectorAll('[data-o]').forEach(x=>{ x.disabled=true; if(+x.dataset.o===s.a) x.classList.add('right'); }); if(!ok) b.classList.add('wrong'); finish(ok); });
  else { const inp=body.querySelector('#tin'); const go=()=>{ const u=inp.value.trim(); if(!u){ inp.focus(); return; } if(parseNum(u)===null){ out.innerHTML='<div class="verdict bad">Не удалось прочитать число — введите, например, 2.75 или −1/3.</div>'; return; } finish(check(s,u),u); };
    body.querySelector('#tchk').onclick=go; inp.onkeydown=e=>{ if(e.key==='Enter') go(); }; }
  body.querySelector('#thint').onclick=()=>{ out.insertAdjacentHTML('afterbegin',`<div class="solution" style="background:var(--hi)"><b>Подсказка.</b> ${it.hint}</div>`); body.querySelector('#thint').disabled=true; };
  body.querySelector('#tsol').onclick=()=>{ if(!answered){ answered=true; v.n++; addWrong(s,it.name); save(); const d=root.querySelector(`[data-it="${it.id}"] .dot`); if(d) d.outerHTML=dotFor(it.id); refresh(); }
    out.innerHTML=`<div class="verdict bad">Решение открыто — попытка засчитана как неверная. Ответ: <span>${fmtAns(s)}</span></div><div class="solution"><b>Решение.</b> ${s.e}</div>`;
    body.querySelectorAll('[data-o]').forEach(x=>{ x.disabled=true; if(+x.dataset.o===s.a) x.classList.add('right'); }); };
  body.querySelector('#tnew').onclick=()=>{ live[it.id]=fresh(it); renderTask(); };
}

/* ---------- mocks ---------- */
const MOCKS=[
 {id:1,n:10,min:20,title:'Разминка',when:'10 вопросов · 20 минут. Короткая проверка после повторения блока.'},
 {id:2,n:16,min:40,title:'Пробный экзамен',when:'16 вопросов · 40 минут. Все пять блоков, теория и расчёты пополам.'},
 {id:3,n:24,min:60,title:'Полный прогон',when:'24 вопроса · 60 минут. Как длинная письменная часть: держите темп.'},
];
let timer=null;
const mfmt=ms=>{ ms=Math.max(0,ms); const m=Math.floor(ms/60000), s=Math.floor(ms%60000/1000); return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); };
function build(n){
  const topics=[]; while(topics.length<n) topics.push(...shuffle(TKEYS)); topics.length=n;
  const usedB=new Set(), usedG=new Set();
  return topics.map((t,i)=>{
    const wantGen=i%2===1;
    const gens=GEN.map((g,j)=>j).filter(j=>ITEMS.find(x=>x.gi===j&&x.t===t)&&!usedG.has(j));
    const banks=BANK.map((q,j)=>j).filter(j=>BANK[j].t===t&&!usedB.has(j));
    if((wantGen&&gens.length)||!banks.length){ const j=gens.length?gens[Math.floor(Math.random()*gens.length)]:Math.floor(Math.random()*GEN.length); usedG.add(j); return snapGen(j); }
    const j=banks[Math.floor(Math.random()*banks.length)]; usedB.add(j); return snapBank(BANK[j]);
  });
}
function renderMockList(){
  clearInterval(timer);
  const pane=root.querySelector('#trpane');
  let h=`<p class="hand" style="margin:0 0 12px;font-size:19px">Таймер запускается сразу. Ответы проверяются только после «Завершить» — как на настоящем экзамене.</p><div class="mocks">`;
  MOCKS.forEach(m=>{ const ms=S.mocks[m.id]; let st='Не начат';
    if(ms&&ms.finished) st=`Завершён · ${ms.score}/${ms.qs.length} · ${ms.pct}%`; else if(ms) st=`Идёт · осталось ${mfmt(ms.start+m.min*60000-Date.now())}`;
    h+=`<article class="card" style="display:flex;flex-direction:column;gap:8px"><h3 style="margin:0">${m.title}</h3><p style="margin:0;color:var(--muted)">${m.when}</p><p style="margin:0;font-weight:600">${st}</p>
     <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:auto">${ms?`<button class="primary" data-open="${m.id}">${ms.finished?'Результаты':'Продолжить'}</button><button data-reset="${m.id}">Новый вариант</button>`:`<button class="primary" data-start="${m.id}">Начать</button>`}</div><div data-cf="${m.id}"></div></article>`; });
  pane.innerHTML=h+'</div>';
  pane.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{ const id=+b.dataset.start; const m=MOCKS.find(x=>x.id===id); S.mocks[id]={start:Date.now(),qs:build(m.n),ans:{},finished:false}; save(); renderMock(id); });
  pane.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>renderMock(+b.dataset.open));
  pane.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{ const id=+b.dataset.reset; const box=pane.querySelector(`[data-cf="${id}"]`);
    box.innerHTML=`<div class="solution" style="margin-top:6px">Текущие ответы удалятся, вопросы и числа будут новыми. <div style="display:flex;gap:8px;margin-top:8px"><button class="primary" data-go="${id}">Начать заново</button><button data-no="${id}">Отмена</button></div></div>`;
    box.querySelector('[data-go]').onclick=()=>{ const m=MOCKS.find(x=>x.id===id); S.mocks[id]={start:Date.now(),qs:build(m.n),ans:{},finished:false}; save(); renderMock(id); };
    box.querySelector('[data-no]').onclick=()=>renderMockList(); });
}
function grade(id){ const ms=S.mocks[id]; let sc=0; ms.res=ms.qs.map((q,i)=>{ const ok=check(q,ms.ans[i]); if(ok) sc++; else addWrong(q,'Пробный экзамен'); return ok; }); ms.score=sc; ms.pct=Math.round(sc/ms.qs.length*100); ms.finished=true; ms.end=Date.now(); save(); refresh(); }
function renderMock(id){
  clearInterval(timer);
  const m=MOCKS.find(x=>x.id===id), ms=S.mocks[id], pane=root.querySelector('#trpane');
  const deadline=ms.start+m.min*60000;
  if(!ms.finished&&Date.now()>=deadline) grade(id);
  if(ms.finished) return renderResult(id);
  const answered=()=>ms.qs.filter((q,i)=>ms.ans[i]!==undefined&&ms.ans[i]!=='').length;
  pane.innerHTML=`<div class="timerbar"><div><b>${m.title}</b> · <span id="mcnt">${answered()}</span>/${ms.qs.length} с ответом</div><div class="clock" id="mclock">${mfmt(deadline-Date.now())}</div><div style="display:flex;gap:8px"><button data-back>К списку</button><button class="primary" data-fin>Завершить</button></div></div><div id="mfin"></div>
   <div style="display:grid;gap:14px;margin-top:14px">${ms.qs.map((q,i)=>`<article class="board" style="margin:0"><p class="qno">Вопрос ${i+1} из ${ms.qs.length} · ${TOP[q.t][0]}</p><p class="statement">${q.q}</p>
    ${q.o?`<div class="opts">${q.o.map((o,k)=>`<button class="opt${+ms.ans[i]===k&&ms.ans[i]!==undefined?' sel':''}" data-q="${i}" data-k="${k}">${o}</button>`).join('')}</div>`
    :`<div class="ans"><input data-in="${i}" type="text" inputmode="decimal" autocomplete="off" placeholder="Ответ" value="${ms.ans[i]!==undefined?String(ms.ans[i]).replace(/"/g,''):''}" aria-label="Ответ на вопрос ${i+1}"></div>`}</article>`).join('')}</div>
   <div style="margin-top:16px;text-align:right"><button class="primary" data-fin>Завершить и проверить</button></div>`;
  const upd=()=>{ save(); pane.querySelector('#mcnt').textContent=answered(); };
  pane.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.q; ms.ans[i]=+b.dataset.k; pane.querySelectorAll(`[data-q="${i}"]`).forEach(x=>x.classList.toggle('sel',x===b)); upd(); });
  pane.querySelectorAll('[data-in]').forEach(inp=>inp.oninput=()=>{ ms.ans[+inp.dataset.in]=inp.value; upd(); });
  pane.querySelector('[data-back]').onclick=()=>renderMockList();
  pane.querySelectorAll('[data-fin]').forEach(b=>b.onclick=()=>{ const left=ms.qs.length-answered(); const box=pane.querySelector('#mfin');
    box.innerHTML=`<div class="solution" style="margin-top:10px">${left?`Без ответа: ${left}. `:''}Завершить и посмотреть результат? <div style="display:flex;gap:8px;margin-top:8px"><button class="primary" data-yes>Завершить</button><button data-no>Продолжить</button></div></div>`;
    box.querySelector('[data-yes]').onclick=()=>{ grade(id); renderResult(id); }; box.querySelector('[data-no]').onclick=()=>{ box.innerHTML=''; };
    box.scrollIntoView({behavior:'smooth',block:'center'}); });
  const clk=pane.querySelector('#mclock');
  timer=setInterval(()=>{ const left=deadline-Date.now(); if(!clk.isConnected){ clearInterval(timer); return; } clk.textContent=mfmt(left); clk.classList.toggle('low',left<5*60000); if(left<=0){ clearInterval(timer); grade(id); renderResult(id); } },1000);
}
function renderResult(id){
  clearInterval(timer);
  const m=MOCKS.find(x=>x.id===id), ms=S.mocks[id], pane=root.querySelector('#trpane');
  const by={}; ms.qs.forEach((q,i)=>{ const b=by[q.t]||(by[q.t]={ok:0,n:0}); b.n++; if(ms.res[i]) b.ok++; });
  const grade30=Math.round(ms.pct*0.3);
  const used=Math.min(m.min*60000,(ms.end||Date.now())-ms.start);
  const weak=Object.entries(by).filter(([t,b])=>b.ok/b.n<.5).map(([t])=>`<a href="#${TOP[t][1]}">${TOP[t][0]}</a>`);
  pane.innerHTML=`<article class="board" style="margin:0 0 14px"><div class="qhead"><h2>${m.title}: ${ms.score} из ${ms.qs.length} (${ms.pct}%)</h2><span class="tag">время ${mfmt(used)}</span></div>
   <p class="statement" style="margin:6px 0 12px">${ms.pct>=60?`Ориентировочно ${Math.max(18,grade30)}/30 по доле верных — хороший уровень.`:ms.pct>=50?'Около порога 18/30 — повторите слабые темы ниже.':'Ниже 18/30 — начните с уроков по темам с красными полосами.'}${weak.length?' Слабые темы: '+weak.join(', ')+'.':''}</p>
   <div class="tbars">${Object.entries(by).map(([t,b])=>{ const p=Math.round(b.ok/b.n*100); return `<div class="r"><span>${TOP[t][0]}</span><span class="tr"><i style="width:${Math.max(p,2)}%;background:${p>=60?'var(--ok)':p>=50?'var(--marker)':'var(--bad)'}"></i></span><b style="font-variant-numeric:tabular-nums">${b.ok}/${b.n}</b></div>`; }).join('')}</div>
   <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:14px"><button data-back>К списку</button><button class="primary" data-again>Новый вариант</button></div></article>
   <h2 style="font:700 18px var(--f-display);margin:20px 0 10px">Разбор</h2>
   <div style="display:grid;gap:12px">${ms.qs.map((q,i)=>{ const a=ms.ans[i]; const ua= a===undefined||a===''? '<i>нет ответа</i>' : q.o? q.o[+a] : String(a);
     return `<article class="board" style="margin:0"><p class="qno">Вопрос ${i+1} · ${TOP[q.t][0]}</p><p class="statement">${q.q}</p><div class="verdict ${ms.res[i]?'ok':'bad'}">${ms.res[i]?'✓':'✗'} Ваш ответ: <span>${ua}</span>${ms.res[i]?'':` · правильно: <span>${fmtAns(q)}</span>`}</div><div class="solution" style="margin-top:8px">${q.e}</div></article>`; }).join('')}</div>`;
  pane.querySelector('[data-back]').onclick=()=>{ shell(); };
  pane.querySelector('[data-again]').onclick=()=>{ S.mocks[id]={start:Date.now(),qs:build(m.n),ans:{},finished:false}; save(); renderMock(id); };
}

function qBlock(s,onDone){
  const el=document.createElement('div'); el.style.cssText='display:grid;gap:12px';
  el.innerHTML=`<p class="statement" style="margin:0">${s.q}</p>${s.o?`<div class="opts">${s.o.map((o,i)=>`<button class="opt" data-o="${i}">${o}</button>`).join('')}</div>`:`<div class="ans"><input type="text" inputmode="decimal" autocomplete="off" placeholder="Ответ" aria-label="Ответ"><button class="primary" data-chk>Проверить</button></div>`}<div data-out style="display:grid;gap:8px"></div>`;
  const out=el.querySelector('[data-out]'); let done=false;
  const fin=(ok,u)=>{ if(done) return; done=true; out.innerHTML=`<div class="verdict ${ok?'ok':'bad'}">${ok?'✓ Верно':'✗ Неверно'+(u!==undefined?` — ваш ответ <span>${u}</span>`:'')}. Ответ: <span>${fmtAns(s)}</span></div><div class="solution">${s.e}</div>`; onDone(ok); };
  if(s.o) el.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{ if(done) return; const i=+b.dataset.o; el.querySelectorAll('[data-o]').forEach(x=>{ x.disabled=true; if(+x.dataset.o===s.a) x.classList.add('right'); }); if(i!==s.a) b.classList.add('wrong'); fin(i===s.a); });
  else { const inp=el.querySelector('input'); const go=()=>{ const u=inp.value.trim(); if(parseNum(u)===null){ inp.focus(); return; } fin(check(s,u),u); }; el.querySelector('[data-chk]').onclick=go; inp.onkeydown=e=>{ if(e.key==='Enter') go(); }; }
  return el;
}

}

/* ---------- quick check inside a lesson ---------- */
const LTOPIC={s1:'intro',s2:'stats',s3:'stats',s4:'stats',r1:'regr',r2:'regr',r3:'regr',r4:'regr',a1:'linalg',a2:'linalg',a3:'linalg',a4:'pca',c1:'dist',c2:'clust',c3:'clust',c4:'clust',o1:'opt',o2:'opt',o3:'opt',o4:'opt',o5:'opt'};
function quick(box,lid){
  const t=LTOPIC[lid]; if(!t) return;
  const same=Object.keys(LTOPIC).filter(k=>LTOPIC[k]===t), k=same.indexOf(lid);
  const pool=BANK.filter(q=>q.t===t); if(!pool.length) return;
  const n=Math.min(3,pool.length), pick=[]; for(let i=0;i<n;i++) pick.push(pool[(k*n+i)%pool.length]);
  box.innerHTML=`<div class="step"><span class="num">?</span><h2>Мини-проверка</h2></div><p style="color:var(--muted);font-size:14px">${n} вопроса по теме. Ошибки попадут в «Работу над ошибками» в тренажёре.</p><div data-qs style="display:grid;gap:18px"></div>`;
  const wrap=box.querySelector('[data-qs]');
  pick.forEach((q,i)=>{ const s=snapBank(q); const d=document.createElement('div'); d.style.cssText='display:grid;gap:6px;border-top:1.5px dashed var(--edge);padding-top:14px';
    d.innerHTML=`<p class="qno">Вопрос ${i+1}</p>`; d.appendChild(qBlock(s,ok=>{ const v=ist('q:'+t); v.n++; if(ok){ v.ok++; dropWrong(s.q); } else addWrong(s,'Мини-проверка '+lid.toUpperCase()); save(); })); wrap.appendChild(d); });
}
function topicStats(){ const r={}; Object.entries(S.items).forEach(([id,v])=>{ let t=null; if(id.startsWith('q:')) t=id.slice(2); else { const it=ITEMS.find(x=>x.id===id); if(it) t=it.t; } if(!t) return; const b=r[t]||(r[t]={ok:0,n:0}); b.ok+=v.ok; b.n+=v.n; }); return r; }
window.TRAINER={render,tex,stats,quick,topicStats,ORAL,TOP,wrongCount:()=>S.wrong.length,openWrong:()=>{ S.tab='wrong'; save(); },openTab:x=>{ S.tab=x; save(); }};
})();

const OTOP={intro:'Введение',stats:'Статистика',regr:'Регрессия',linalg:'Линейная алгебра',pca:'PCA',dist:'Расстояния',clust:'Кластеризация',opt:'Оптимизация'};
let oralOpen={}, drill=null;
function renderOral(){
  const v=document.getElementById('v-oral'), O=TRAINER.ORAL, tx=TRAINER.tex;
  const f=ST.ofilt; const list=O.map((c,i)=>({c,i})).filter(x=>f==='all'||(f==='rep'?ST.oral[x.i]==='r':x.c[0]===f));
  const known=O.filter((c,i)=>ST.oral[i]==='k').length, rep=O.filter((c,i)=>ST.oral[i]==='r').length;
  const chip=(id,lab)=>`<button data-f="${id}" aria-pressed="${f===id}">${lab}</button>`;
  v.innerHTML=`<div class="vhead"><span class="tag">Устный экзамен</span><h1>31 вопрос: <em>ответь вслух, потом проверь</em></h1>
   <p class="en">Прочитайте вопрос, ответьте вслух по-английски, откройте ответ и честно отметьте. Знаю: ${known} · повторить: ${rep} · не отмечено: ${O.length-known-rep}.</p></div>
   <div class="board"><div class="chips">${chip('all','Все')}${Object.keys(OTOP).map(k=>chip(k,OTOP[k])).join('')}${chip('rep','Повторить ('+rep+')')}</div>
   <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center"><button class="primary" data-drill>Случайный вопрос из списка</button><button data-open-all>Открыть все ответы</button><button data-close-all>Скрыть ответы</button></div></div>
   <div id="oralList" style="display:grid;gap:14px"></div>`;
  const card=({c,i},n)=>{ const st=ST.oral[i], open=oralOpen[i];
    return `<article class="board ocard" data-c="${i}"><div class="qhead"><p class="qno" style="margin:0">${n} · ${OTOP[c[0]]}</p>${st?`<span class="okn ${st}">${st==='k'?'знаю':'повторить'}</span>`:''}</div>
     <h2 style="font-size:19px">${BI(tx(c[2]),tx(c[1]))}</h2><p class="qen">${BI(tx(c[1]),tx(c[2]))}</p>
     ${open?`<div class="ans"><p>${BI(tx(c[4]),tx(c[3]))}</p></div>`:''}
     <div style="display:flex;flex-wrap:wrap;gap:8px">${open?'':`<button class="primary" data-show="${i}">Показать ответ</button>`}<button data-k="${i}" class="${st==='k'?'done':''}">Знаю</button><button data-r="${i}" class="${st==='r'?'on':''}">Повторить</button></div></article>`; };
  const box=v.querySelector('#oralList');
  const paint=()=>{ box.innerHTML=drill!==null?card(list.find(x=>x.i===drill)||list[0],'Случайный')+`<button data-exit style="justify-self:start">← Весь список</button>`:list.map((x,n)=>card(x,'Вопрос '+(x.i+1))).join('')||'<p class="board">В этом фильтре пусто.</p>';
    box.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{ oralOpen[+b.dataset.show]=1; paint(); });
    box.querySelectorAll('[data-k],[data-r]').forEach(b=>b.onclick=()=>{ const i=+(b.dataset.k??b.dataset.r), val=b.dataset.k!==undefined?'k':'r'; ST.oral[i]=ST.oral[i]===val?undefined:val; save(); if(drill!==null){ nextDrill(); } else renderOral(); });
    const ex=box.querySelector('[data-exit]'); if(ex) ex.onclick=()=>{ drill=null; paint(); }; };
  const nextDrill=()=>{ if(!list.length) return; let j; do{ j=list[Math.floor(Math.random()*list.length)].i; }while(list.length>1&&j===drill); drill=j; delete oralOpen[j]; renderOral(); };
  v.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ ST.ofilt=b.dataset.f; drill=null; save(); renderOral(); });

}

let current=null;
function route(){
  const h=(location.hash||'#home').slice(1)||'home';
  const r=byId[h]?h:(['home','orig','trainer','cheat','oral','terms'].includes(h)?h:'home');
  document.querySelectorAll('main > .view, #v-lessons > .view').forEach(v=>v.hidden=true);

  else if(r==='orig'){ document.getElementById('v-orig').hidden=false; renderOrig(); t.textContent='Ответы на английском'; }
  else if(r==='cheat'){ document.getElementById('v-cheat').hidden=false; renderCheat(); t.textContent='Лист формул'; }
  else if(r==='oral'){ document.getElementById('v-oral').hidden=false; renderOral(); t.textContent='Устный экзамен'; }
  else if(r==='terms'){ document.getElementById('v-terms').hidden=false; renderTerms(); t.textContent='Словарь RU ↔ EN'; }
  else if(r==='trainer'){ const v=document.getElementById('v-trainer'); v.hidden=false; TRAINER.render(v); t.textContent='Тренажёр'; }
  else { showLesson(byId[r]); t.textContent=r.toUpperCase()+' · '+byId[r].menu; }

}
addEventListener('hashchange',route);
const redraw=()=>{ if(current&&byId[current]&&byId[current].draw){ const sec=holder.querySelector(`[data-lesson="${current}"]`); if(sec&&!sec.hidden) try{ byId[current].draw(sec); }catch(e){ console.error(e); } } };
let rt; addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(redraw,150); });
route();
})();

const CYR=/[А-Яа-яЁё]/, NUM=/\d+(?:[.,]\d+)?/g;
const norm=s=>s.replace(/\s+/g,' ').trim();
const key=s=>norm(s).replace(NUM,'#');
function tr(s){ const k=key(s); const en=DICT[k]; if(en===undefined) return null; const nums=norm(s).match(NUM)||[]; let i=0;
  const body=en.replace(/#/g,()=>nums[i]!==undefined?nums[i++]:'#'); return s.match(/^\s*/)[0]+body+s.match(/\s*$/)[0]; }
const orig=new WeakMap(), touched=new Set(), aOrig=new WeakMap(), aTouched=new Set();
const ATTRS=['placeholder','title','aria-label'];
let lang='en'; try{ lang=localStorage.getItem('study-lang')||'en'; }catch(e){}
const miss=()=>window.__miss;
function doText(n){ if(!CYR.test(n.data)) return; const r=tr(n.data); if(r===null){ if(miss()) miss().add(key(n.data)); return; } orig.set(n,n.data); touched.add(n); n.data=r; }
function doAttr(el){ if(!el.getAttribute) return; for(const a of ATTRS){ const v=el.getAttribute(a); if(!v||!CYR.test(v)) continue; const r=tr(v); if(r===null){ if(miss()) miss().add(key(v)); continue; }
  let m=aOrig.get(el); if(!m){ m={}; aOrig.set(el,m); } m[a]=v; aTouched.add(el); el.setAttribute(a,r); } }
const BAD=n=>{ const t=n.tagName; return n.hasAttribute('data-nt')||t==='SCRIPT'||t==='STYLE'||t==='TEXTAREA'; };
function inNT(n){ const e=n.nodeType===1?n:n.parentElement; return !!(e&&e.closest('[data-nt],script,style,textarea')); }
function walk(root){
  if(root.nodeType===3){ if(!inNT(root)) doText(root); return; }
  if(root.nodeType!==1||inNT(root)) return;
  doAttr(root);
  const list=[]; const tw=document.createTreeWalker(root,NodeFilter.SHOW_ELEMENT|NodeFilter.SHOW_TEXT,{acceptNode(n){ if(n.nodeType===1){ if(BAD(n)) return NodeFilter.FILTER_REJECT; doAttr(n); return NodeFilter.FILTER_SKIP; } return CYR.test(n.data)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_SKIP; }});
  let n; while((n=tw.nextNode())) list.push(n); list.forEach(doText);
}
function restore(){ touched.forEach(n=>{ const o=orig.get(n); if(o!==undefined&&!CYR.test(n.data)) n.data=o; }); touched.clear(); aTouched.forEach(el=>{ const m=aOrig.get(el); if(m) for(const a in m) el.setAttribute(a,m[a]); }); aTouched.clear(); }
const mo=new MutationObserver(ms=>{ if(lang!=='en') return; for(const m of ms){ if(m.type==='childList') m.addedNodes.forEach(walk); else if(m.type==='characterData'){ if(!inNT(m.target)) doText(m.target); } else if(m.type==='attributes') doAttr(m.target); } });
function paintSw(){ document.querySelectorAll('[data-langsw] [data-l]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang)); }
function setLang(l){ lang=l; try{ localStorage.setItem('study-lang',l); }catch(e){}
  const h=document.documentElement; h.dataset.lang=l; h.lang=l;
  if(l==='en') walk(document.body); else restore(); paintSw(); }
document.addEventListener('click',e=>{ const b=e.target.closest('[data-langsw] [data-l]'); if(b){ e.preventDefault(); if(b.dataset.l!==lang) setLang(b.dataset.l); } });
mo.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:ATTRS});
new MutationObserver(paintSw).observe(document.getElementById('side'),{childList:true});
setLang(lang);
window.__i18n={key,setLang,get lang(){return lang;},walk};
})();
