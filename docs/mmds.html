<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<script>
/* тема: auto | light | dark, хранится в study-theme (синхронизируется с Telegram) */
(function(){
  var R=document.documentElement, m='auto';
  try{m=localStorage.getItem('study-theme')||'auto'}catch(e){}
  function sys(){var w=window.Telegram&&Telegram.WebApp; if(w&&w.initData&&w.colorScheme) return w.colorScheme; return (window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light'}
  function apply(){
    var r=m==='auto'?sys():m; R.setAttribute('data-theme',r); R.style.colorScheme=r;
    var b=document.querySelector('.themebtn'); if(b){b.textContent=m==='auto'?'◐':(m==='dark'?'☾':'☀'); b.title={auto:'Тема: авто',light:'Тема: светлая',dark:'Тема: тёмная'}[m]; b.setAttribute('aria-label',b.title)}
    try{var w=window.Telegram&&Telegram.WebApp; if(w&&w.initData){w.setHeaderColor&&w.setHeaderColor(r==='dark'?'#121315':'#FBFBFA'); w.setBackgroundColor&&w.setBackgroundColor(r==='dark'?'#121315':'#FBFBFA')}}catch(e){}
  }
  window.__theme={get:function(){return m},apply:apply,cycle:function(){m=m==='auto'?'light':(m==='light'?'dark':'auto'); try{localStorage.setItem('study-theme',m)}catch(e){} apply()}};
  apply();
  function mount(){
    apply();
    if(document.querySelector('.themebtn')) return;
    var anchor=document.querySelector('[data-langsw]'); if(!anchor) return;
    var b=document.createElement('button'); b.type='button'; b.className='themebtn'; b.onclick=function(){window.__theme.cycle()};
    anchor.parentNode.insertBefore(b,anchor); apply();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',mount); else mount();
  window.addEventListener('load',apply);
  try{matchMedia('(prefers-color-scheme:dark)').addEventListener('change',apply)}catch(e){}
  /* если Telegram подтянул более новый study-theme из облака, страница перезагрузится синхронизацией */
})();
</script>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
/* JulYera study sync: Telegram CloudStorage <-> localStorage, вход только через бота */
(function(){
  var BOT_URL='https://t.me/dsstudyhub_bot';                 // ссылка на бота, например https://t.me/ИМЯ_БОТА
  var PFX=/^(imsds-|mmmds-|aacm-|study-)/, CH=3500, tg=window.Telegram&&Telegram.WebApp;
  var inTg=!!(tg&&tg.initData);
  var dev=false; try{ if(/[?&]dev=1/.test(location.search)) sessionStorage.setItem('dev','1'); dev=sessionStorage.getItem('dev')==='1'; }catch(e){}
  var origSet=Storage.prototype.setItem;
  function gate(){
    if(inTg||dev) return;
    var s=document.createElement('style');
    s.textContent='#gate{position:fixed;inset:0;z-index:99999;background:#FBFBFA;color:#17181C;display:grid;place-items:center;padding:24px;text-align:center;font:16px/1.5 Onest,system-ui,sans-serif}#gate b{display:block;font:600 22px Unbounded,sans-serif;margin-bottom:10px}#gate p{max-width:34ch;margin:0 auto 18px;color:#5D5F69}#gate a{display:inline-block;background:#557546;color:#fff;text-decoration:none;padding:12px 22px;border-radius:999px;font-weight:600}';
    document.head.appendChild(s);
    function mk(){ var d=document.createElement('div'); d.id='gate'; d.innerHTML='<div><b>JulYera study hub</b><p>Обучалки открываются только через Telegram-бота: так прогресс привязан к твоему аккаунту.</p>'+(BOT_URL?'<a href="'+BOT_URL+'">Открыть бота</a>':'')+'</div>'; document.body.appendChild(d); document.body.style.overflow='hidden'; }
    if(document.body) mk(); else document.addEventListener('DOMContentLoaded',mk);
  }
  /* gate() отключён: сайт открывается и без бота, прогресс хранится в браузере, в Telegram синхронизируется */
  if(!inTg) return;
  try{ tg.ready(); tg.expand(); }catch(e){}
  var cs=tg.CloudStorage, timers={};
  function lsKeys(){ var o=[]; for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(PFX.test(k)) o.push(k); } return o; }
  function push(k){
    var v=localStorage.getItem(k); if(v==null) return;
    var ts=+localStorage.getItem('__ts_'+k)||Date.now(), n=Math.max(1,Math.ceil(v.length/CH));
    for(var i=0;i<n;i++) cs.setItem(k+'_'+i, v.slice(i*CH,(i+1)*CH));
    cs.setItem(k+'_m', JSON.stringify({n:n,ts:ts}));
  }
  Storage.prototype.setItem=function(k,v){
    origSet.call(this,k,v);
    if(this===localStorage && PFX.test(k) && k.indexOf('__ts_')!==0){
      origSet.call(this,'__ts_'+k,String(Date.now()));
      clearTimeout(timers[k]); timers[k]=setTimeout(function(){push(k)},1500);
    }
  };
  document.addEventListener('visibilitychange',function(){ if(document.hidden) lsKeys().forEach(push); });
  cs.getKeys(function(err,keys){
    if(err||!keys) return;
    var metas=keys.filter(function(x){return /_m$/.test(x)}), left=metas.length, changed=false, seen={};
    function finish(){
      lsKeys().forEach(function(k){ if(!seen[k]) push(k); });
      var done=false; try{ done=sessionStorage.getItem('synced')==='1'; }catch(e){}
      if(changed && !done){ try{sessionStorage.setItem('synced','1');}catch(e){} location.reload(); }
    }
    if(!left) return finish();
    metas.forEach(function(mk){
      var k=mk.slice(0,-2); seen[k]=1;
      cs.getItem(mk,function(e,mv){
        var m={}; try{m=JSON.parse(mv)}catch(x){}
        var lts=+localStorage.getItem('__ts_'+k)||0;
        if(m.ts>lts && m.n){
          var names=[]; for(var i=0;i<m.n;i++) names.push(k+'_'+i);
          cs.getItems(names,function(e2,vals){
            if(!e2&&vals){ var s=''; names.forEach(function(nm){ s+=vals[nm]||''; });
              if(s && s!==localStorage.getItem(k)){ origSet.call(localStorage,k,s); changed=true; }
              origSet.call(localStorage,'__ts_'+k,String(m.ts)); }
            if(--left===0) finish();
          });
        } else { if(lts>m.ts) push(k); if(--left===0) finish(); }
      });
    });
  });
})();
</script>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MMMDS Exam Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400;1,8..60,500;1,8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: study app — fixed menu on the left (drawer on phones), one view at a time on grid paper.
   Each lesson = short summary card + numbered boards (drawing + 2–3 lines) + exam path. */
:root{
  --paper:#f6f8fb; --grid:#e3e9f2; --board:#ffffff; --ink:#1b2a44; --muted:#5d6b84;
  --blue:#2457d6; --marker:#f08a00; --hi:#ffe08a; --ok:#1f9d63; --bad:#d23c3c; --edge:#9fb0cc; --iso:#b7c2d6; --violet:#7a4fd0;
  --side:#eef2f8; --soft:#e7eefc; --ok-soft:#e3f4ea; --bad-soft:#fbe8e8;
  --f-display:"Unbounded","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --f-hand:"Caveat","Comic Sans MS",cursive;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1522; --grid:#1a2335; --board:#151d2e; --ink:#e4ebf7; --muted:#9aa8c2;
  --blue:#6f9bff; --marker:#ffa53a; --hi:#5a4a12; --ok:#3fcf8e; --bad:#ff6b6b; --edge:#4a5a78; --iso:#3a4760; --violet:#b296ff; --side:#121a29;
  --soft:#1b2640; --ok-soft:#13291f; --bad-soft:#331b1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1522; --grid:#1a2335; --board:#151d2e; --ink:#e4ebf7; --muted:#9aa8c2;
  --blue:#6f9bff; --marker:#ffa53a; --hi:#5a4a12; --ok:#3fcf8e; --bad:#ff6b6b; --edge:#4a5a78; --iso:#3a4760; --violet:#b296ff; --side:#121a29;
  --soft:#1b2640; --ok-soft:#13291f; --bad-soft:#331b1d; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.6 var(--f-body);margin:0}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
/* side menu */
.side{background:var(--side);border-right:1.5px solid var(--edge);position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 12px 32px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px}
.brand{display:flex;flex-direction:column;gap:2px;padding:4px 8px 12px}
.brand b{font:700 17px/1.2 var(--f-display)}
.brand span{font-size:13px;color:var(--muted)}
.prog{margin:0 8px 10px;height:6px;border-radius:3px;background:var(--grid);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.side h4{margin:14px 8px 4px;font:600 11px/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.side a{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.3}
.side a:hover{background:var(--board)}
.side a[aria-current="page"]{background:var(--board);box-shadow:inset 3px 0 0 var(--blue);font-weight:600}
.side a .id{font:600 12px var(--f-mono);color:var(--blue);min-width:30px}
.side a .t{flex:1;min-width:0}
.side a .ck{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--edge);flex:none;display:grid;place-items:center;font-size:10px;color:var(--board)}
.side a .ck.on{background:var(--ok);border-color:var(--ok)}
.side a.big{font-weight:600;font-size:15px}
.side a.big .ic{width:22px;text-align:center;color:var(--blue);font:600 15px var(--f-mono)}
.topbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;background:var(--side);border-bottom:1.5px solid var(--edge);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  .topbar b{font:700 15px var(--f-display);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side{position:fixed;z-index:30;left:0;top:0;bottom:0;width:min(300px,86vw);height:auto;transform:translateX(-105%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
}
/* main */
main{min-width:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;
  padding:28px max(16px,env(safe-area-inset-right,0px)) 72px max(16px,env(safe-area-inset-left,0px));overflow-wrap:break-word}
.view{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.view.wide{max-width:1180px}
.vhead{display:flex;flex-direction:column;gap:6px}
.tag{font:600 12px/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}
h1{font:700 clamp(24px,4.6vw,36px)/1.15 var(--f-display);margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--marker)}
.en{color:var(--muted);font-size:14px;margin:0}
.board{background:var(--board);border:1.5px solid var(--edge);border-radius:6px;padding:20px clamp(16px,3vw,26px);display:flex;flex-direction:column;gap:14px;min-width:0}
.short{border-color:var(--blue);border-width:2px}
.short h2{font:700 16px var(--f-display);margin:0;color:var(--blue)}
.short ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.step{display:flex;align-items:baseline;gap:12px}
.num{font:700 15px/1 var(--f-display);color:var(--board);background:var(--blue);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;flex:none}
.board h2{font:700 clamp(17px,2.8vw,21px)/1.25 var(--f-display);margin:0;text-wrap:balance}
.board p{margin:0;max-width:68ch}
.board ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.hand{font:600 22px/1.2 var(--f-hand);color:var(--marker);margin:0}
mark{background:var(--hi);color:inherit;padding:0 3px;border-radius:2px}
.f{font-family:var(--f-mono);font-size:.93em;white-space:nowrap}
.formula{font:600 clamp(14px,2.3vw,18px)/1.6 var(--f-mono);background:var(--paper);border:1.5px dashed var(--edge);border-radius:6px;padding:12px 16px;overflow-x:auto;text-align:center}
.formula small{display:block;font:400 13px/1.4 var(--f-body);color:var(--muted);margin-top:4px}
.formula.key{border:2px solid var(--marker)}
sup,sub{font-size:.7em}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.row>*,.row3>*{min-width:0}
@media (max-width:680px){.row,.row3{grid-template-columns:1fr}}
canvas,svg{display:block;width:100%;max-width:100%}
.scroll-x{overflow-x:auto}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
label{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
input[type=range]{accent-color:var(--blue);width:180px;max-width:56vw}
input[type=text],input[type=number],textarea{font:14px var(--f-mono);color:var(--ink);background:var(--paper);border:1.5px solid var(--edge);border-radius:6px;padding:6px 9px}
textarea{width:100%;resize:vertical}
select{font:14px var(--f-body);padding:5px 8px;border-radius:6px;border:1.5px solid var(--edge);background:var(--paper);color:var(--ink)}
button{font:600 14px var(--f-body);color:var(--ink);background:var(--paper);border:1.5px solid var(--edge);border-radius:6px;padding:7px 14px;cursor:pointer}
button:hover{border-color:var(--blue);color:var(--blue)}
button.primary{background:var(--blue);border-color:var(--blue);color:var(--board)}
button.primary:hover{filter:brightness(1.1);color:var(--board)}
button.on,button[aria-pressed="true"]{background:var(--hi);border-color:var(--marker);color:var(--ink)}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--marker);outline-offset:2px}
.readout{font:400 14px/1.5 var(--f-mono);display:flex;flex-wrap:wrap;gap:6px 18px;font-variant-numeric:tabular-nums}
.readout b{color:var(--blue)}
.msg{font:600 15px/1.45 var(--f-mono);min-height:1.45em}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.mini{border:1.5px solid var(--edge);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--paper);min-width:0}
.mini h3{margin:0;font:700 14px var(--f-display)}
.mini p{font-size:14px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:680px){.facts{grid-template-columns:1fr}}
.fact{border-left:4px solid var(--bad);padding:6px 12px;background:var(--paper);border-radius:0 6px 6px 0}
.fact.good{border-color:var(--ok)}
.fact.blue{border-color:var(--blue)}
.fact .big{font:700 19px/1.25 var(--f-display);font-variant-numeric:tabular-nums}
.fact p{font-size:14px;color:var(--muted)}
ol.path{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
ol.path li{background:var(--paper);border:1.5px solid var(--edge);border-radius:20px;padding:6px 12px;font-size:14px;font-weight:500}
ol.path li+li::before{content:"→";margin-right:8px;color:var(--marker);font-weight:700}
.asks{color:var(--muted);font-size:14px;font-style:italic;margin:0}
.chain{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.chain>div{background:var(--paper);border:1.5px solid var(--edge);border-radius:6px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:4px;min-width:0}

.cards4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:780px){.cards4,.cards3{grid-template-columns:repeat(2,1fr)}}

.card .cond{font:600 13px var(--f-mono);color:var(--marker)}
.card p{font-size:13px;color:var(--muted);line-height:1.45;margin:0}

<script>
/* ===== shared helpers ===== */
const LESSONS = [];
const BI = (en, ru) => '<span class="l-en" data-nt>' + en + '</span><span class="l-ru" data-nt>' + ru + '</span>';
const L = {};
L.ns = 'http://www.w3.org/2000/svg';
L.el = (t, a = {}, parent, txt) => { const e = document.createElementNS(L.ns, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; if (parent) parent.appendChild(e); return e; };
L.q = (sec, r) => sec.querySelector(`[data-r="${r}"]`);
L.fmt = (v, d = 3) => { if (v === null || v === undefined || Number.isNaN(v)) return '—'; if (!isFinite(v)) return v > 0 ? '∞' : '−∞'; const a = Math.abs(v); if (a !== 0 && (a < 1e-3 || a >= 1e6)) return v.toExponential(2).replace('-', '−').replace('e+', 'e'); return (+v.toFixed(d)).toString().replace('-', '−'); };
L.sum = a => a.reduce((s, x) => s + x, 0);
L.mean = a => L.sum(a) / a.length;
L.rng = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
L.gauss = r => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
L.niceStep = raw => { const p = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw / p; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p; };
L.ticks = (a, b, n = 5) => { const st = L.niceStep((b - a) / n); const o = []; for (let v = Math.ceil(a / st - 1e-9) * st; v <= b + 1e-9; v += st) o.push(+v.toFixed(10)); return o; };
const tipEl = document.getElementById('tip');
L.hover = (el, f) => { el.style.cursor = 'default'; el.addEventListener('mousemove', e => { tipEl.textContent = typeof f === 'function' ? f() : f; tipEl.style.display = 'block'; tipEl.style.left = (e.clientX + 12) + 'px'; tipEl.style.top = (e.clientY + 12) + 'px'; }); el.addEventListener('mouseleave', () => tipEl.style.display = 'none'); };

/* chart frame in an SVG; colours come from CSS classes so theme switches need no redraw */
L.chart = (svg, o) => {
  svg.innerHTML = '';
  const W = o.W || 600, H = o.H || 300, Lm = o.L ?? 56, Rm = o.R ?? 16, T = o.T ?? 16, B = o.B ?? 40;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const pw = W - Lm - Rm, ph = H - T - B;
  const ly = v => o.logy ? Math.log10(v) : v;
  const X = v => Lm + (v - o.x0) / (o.x1 - o.x0) * pw;
  const Y = v => T + ph - (ly(v) - ly(o.y0)) / (ly(o.y1) - ly(o.y0)) * ph;
  const g = L.el('g', { class: 'ax' }, svg);
  const yt = o.yticks || (o.noAxes ? [] : L.ticks(o.y0, o.y1, o.ny || 5)), xt = o.xticks || (o.noAxes ? [] : L.ticks(o.x0, o.x1, o.nx || 6));
  yt.forEach(v => { L.el('line', { x1: Lm, x2: W - Rm, y1: Y(v), y2: Y(v), class: 'gl' }, g); L.el('text', { x: Lm - 7, y: Y(v) + 4, 'text-anchor': 'end' }, g, o.yfmt ? o.yfmt(v) : L.fmt(v, 2)); });
  xt.forEach(v => { L.el('line', { x1: X(v), x2: X(v), y1: T, y2: T + ph, class: 'gl' }, g); L.el('text', { x: X(v), y: T + ph + 17, 'text-anchor': 'middle' }, g, o.xfmt ? o.xfmt(v) : L.fmt(v, 2)); });
  if (!o.noAxes) { L.el('line', { x1: Lm, x2: W - Rm, y1: T + ph, y2: T + ph, class: 'axl' }, g); L.el('line', { x1: Lm, x2: Lm, y1: T, y2: T + ph, class: 'axl' }, g); }
  if (o.xlabel) L.el('text', { x: Lm + pw / 2, y: H - 4, 'text-anchor': 'middle', class: 'lab' }, g, o.xlabel);
  if (o.ylabel) L.el('text', { x: 12, y: T + ph / 2, 'text-anchor': 'middle', class: 'lab', transform: `rotate(-90 12 ${T + ph / 2})` }, g, o.ylabel);
  const cid = 'clip' + (L._cid = (L._cid || 0) + 1);
  const cp = L.el('clipPath', { id: cid }, L.el('defs', {}, svg)); L.el('rect', { x: Lm, y: T - 3, width: pw, height: ph + 6 }, cp);
  const plot = L.el('g', { 'clip-path': `url(#${cid})` }, svg);
  const path = (pts, cls, extra = {}) => { let d = ''; pts.forEach(([a, b]) => { const yy = Y(b), xx = X(a); if (!isFinite(yy) || !isFinite(xx)) return; d += (d ? 'L' : 'M') + xx.toFixed(1) + ' ' + Math.max(-2000, Math.min(2000, yy)).toFixed(1); }); return L.el('path', Object.assign({ d, class: 'nf ' + cls }, extra), plot); };
  const dot = (a, b, cls, r = 4, tip) => { const c = L.el('circle', { cx: X(a), cy: Y(b), r, class: cls }, plot); if (tip) L.hover(c, tip); return c; };
  const text = (x, y, s, cls = 'note', extra = {}) => L.el('text', Object.assign({ x, y, class: cls }, extra), svg, s);
  const line = (a, b, c, d, cls) => L.el('line', { x1: X(a), y1: Y(b), x2: X(c), y2: Y(d), class: cls }, plot);
  return { X, Y, pw, ph, T, B, Lm, Rm, W, H, path, dot, text, line, plot, svg };
};
/* arrow marker helper */
L.arrow = (svg, x1, y1, x2, y2, cls = 's-b') => { const g = L.el('g', {}, svg); L.el('line', { x1, y1, x2, y2, class: cls }, g); const a = Math.atan2(y2 - y1, x2 - x1), s = 9; L.el('path', { d: `M${x2} ${y2} L${x2 - s * Math.cos(a - .4)} ${y2 - s * Math.sin(a - .4)} M${x2} ${y2} L${x2 - s * Math.cos(a + .4)} ${y2 - s * Math.sin(a + .4)}`, class: 'nf ' + cls }, g); return g; };

/* numerics */
L.solve = (A, b) => { const n = A.length, M = A.map((r, i) => [...r, b[i]]);
  for (let c = 0; c < n; c++) { let p = c; for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r; if (Math.abs(M[p][c]) < 1e-12) return null; [M[c], M[p]] = [M[p], M[c]]; for (let r = c + 1; r < n; r++) { const f = M[r][c] / M[c][c]; for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k]; } }
  const x = Array(n).fill(0); for (let i = n - 1; i >= 0; i--) { let s = M[i][n]; for (let j = i + 1; j < n; j++) s -= M[i][j] * x[j]; x[i] = s / M[i][i]; } return x; };
L.polyfit = (xs, ys, p) => { const c0 = L.mean(xs), s0 = (Math.max(...xs) - Math.min(...xs)) / 2 || 1; const t = xs.map(x => (x - c0) / s0);
  const A = [], b = []; for (let i = 0; i <= p; i++) { A.push([]); for (let j = 0; j <= p; j++) A[i].push(L.sum(t.map(v => Math.pow(v, i + j)))); b.push(L.sum(t.map((v, k) => Math.pow(v, i) * ys[k]))); }
  const a = L.solve(A, b); if (!a) return null; return x => { const tt = (x - c0) / s0; let s = 0; for (let i = p; i >= 0; i--) s = s * tt + a[i]; return s; }; };
L.linfit = (x, y) => { const n = x.length, mx = L.mean(x), my = L.mean(y); let sxx = 0, syy = 0, sxy = 0; for (let i = 0; i < n; i++) { sxx += (x[i] - mx) ** 2; syy += (y[i] - my) ** 2; sxy += (x[i] - mx) * (y[i] - my); }
  const vx = sxx / (n - 1), vy = syy / (n - 1), c = sxy / (n - 1); const a = c / vx, b = my - a * mx, r = c / Math.sqrt(vx * vy); return { mx, my, vx, vy, c, a, b, r, vr: vy * (1 - r * r) }; };
L.eig2 = (a, b, c, d) => { const tr = a + d, det = a * d - b * c, disc = tr * tr - 4 * det; if (disc < -1e-12) return { tr, det, complex: true, re: tr / 2, im: Math.sqrt(-disc) / 2 };
  const s = Math.sqrt(Math.max(0, disc)), l1 = (tr + s) / 2, l2 = (tr - s) / 2; const vec = l => { let v = Math.abs(b) > 1e-12 ? [b, l - a] : Math.abs(c) > 1e-12 ? [l - d, c] : (Math.abs(a - l) < 1e-12 ? [1, 0] : [0, 1]); const n = Math.hypot(...v); return [v[0] / n, v[1] / n]; };
  return { tr, det, complex: false, l1, l2, v1: vec(l1), v2: vec(l2), rep: Math.abs(disc) < 1e-12 }; };
/* Jacobi eigen-decomposition of a symmetric matrix → {vals, vecs (columns)} sorted desc */
L.jacobi = A0 => { const n = A0.length; const A = A0.map(r => [...r]); const V = A.map((r, i) => r.map((_, j) => +(i === j)));
  for (let sweep = 0; sweep < 60; sweep++) { let off = 0; for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) off += A[i][j] ** 2; if (off < 1e-20) break;
    for (let p = 0; p < n; p++) for (let q = p + 1; q < n; q++) { if (Math.abs(A[p][q]) < 1e-15) continue; const th = (A[q][q] - A[p][p]) / (2 * A[p][q]); const t = Math.sign(th || 1) / (Math.abs(th) + Math.sqrt(th * th + 1)); const c = 1 / Math.sqrt(t * t + 1), s = t * c;
      for (let k = 0; k < n; k++) { const akp = A[k][p], akq = A[k][q]; A[k][p] = c * akp - s * akq; A[k][q] = s * akp + c * akq; }
      for (let k = 0; k < n; k++) { const apk = A[p][k], aqk = A[q][k]; A[p][k] = c * apk - s * aqk; A[q][k] = s * apk + c * aqk; }
      for (let k = 0; k < n; k++) { const vkp = V[k][p], vkq = V[k][q]; V[k][p] = c * vkp - s * vkq; V[k][q] = s * vkp + c * vkq; } } }
  const idx = [...Array(n).keys()].sort((i, j) => A[j][j] - A[i][i]); return { vals: idx.map(i => A[i][i]), vecs: idx.map(i => V.map(r => r[i])) }; };
L.median = s => { const n = s.length; return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2; };
L.quart = a => { const s = [...a].sort((x, y) => x - y), n = s.length; const lo = s.slice(0, Math.floor(n / 2)), hi = s.slice(Math.ceil(n / 2)); return { s, q1: L.median(lo.length ? lo : s), q2: L.median(s), q3: L.median(hi.length ? hi : s) }; };
L.lev = (a, b) => { const m = a.length, n = b.length; const D = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]); for (let j = 0; j <= n; j++) D[0][j] = j; for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) D[i][j] = Math.min(D[i - 1][j] + 1, D[i][j - 1] + 1, D[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); return D[m][n]; };
L.osa = (a, b) => { const m = a.length, n = b.length; const D = Array.from({ length: m + 1 }, () => Array(n + 1).fill(0)); for (let i = 0; i <= m; i++) D[i][0] = i; for (let j = 0; j <= n; j++) D[0][j] = j; for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) { D[i][j] = Math.min(D[i - 1][j] + 1, D[i][j - 1] + 1, D[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) D[i][j] = Math.min(D[i][j], D[i - 2][j - 2] + 1); } return D[m][n]; };
L.lcs = (a, b) => { const m = a.length, n = b.length; const D = Array.from({ length: m + 1 }, () => Array(n + 1).fill(0)); for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) D[i][j] = a[i - 1] === b[j - 1] ? D[i - 1][j - 1] + 1 : Math.max(D[i - 1][j], D[i][j - 1]); return D[m][n]; };
L.grams = (s, k) => { const t = s.toLowerCase().replace(/[^\p{L}\p{N}]/gu, ''); const g = new Set(); for (let i = 0; i + k <= t.length; i++) g.add(t.slice(i, i + k)); return g; };
L.kv = (el, items) => { el.innerHTML = items.map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join(''); };
L.d2 = (a, b) => (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2;
/* clusters palette as classes */
L.CL = ['f-b', 'f-o', 'f-g', 'f-v', 'f-r', 'f-ink'];
L.SL = ['s-b', 's-o', 's-g', 's-v', 's-r', 's-i'];
L.blobs = seed => { const R = L.rng(seed), P = []; [[-1.6, 1.1], [1.5, 1.3], [0.1, -1.4], [1.9, -1.2]].forEach((c, ci) => { for (let i = 0; i < (ci === 3 ? 22 : 40); i++) P.push([c[0] + L.gauss(R) * .45, c[1] + L.gauss(R) * .45]); }); return P; };
L.rings = seed => { const R = L.rng(seed), P = []; for (let i = 0; i < 70; i++) { const t = R() * 6.283; P.push([.55 * Math.cos(t) + L.gauss(R) * .08, .55 * Math.sin(t) + L.gauss(R) * .08]); } for (let i = 0; i < 110; i++) { const t = R() * 6.283; P.push([2.2 * Math.cos(t) + L.gauss(R) * .1, 2.2 * Math.sin(t) + L.gauss(R) * .1]); } for (let i = 0; i < 4; i++) P.push([(R() - .5) * 5.6, (R() - .5) * 4.4]); return P; };
L.moons = seed => { const R = L.rng(seed), P = []; for (let i = 0; i < 80; i++) { const t = Math.PI * R(); P.push([Math.cos(t) * 1.5 - .7 + L.gauss(R) * .1, Math.sin(t) * 1.5 - .3 + L.gauss(R) * .1]); } for (let i = 0; i < 80; i++) { const t = Math.PI * R(); P.push([.8 - Math.cos(t) * 1.5 + L.gauss(R) * .1, .3 - Math.sin(t) * 1.5 + L.gauss(R) * .1]); } for (let i = 0; i < 4; i++) P.push([(R() - .5) * 5.6, (R() - .5) * 4.4]); return P; };
L.kmeans = (P, k, seed, pp) => { const R = L.rng(seed); let C; if (pp) { C = [P[Math.floor(R() * P.length)]]; while (C.length < k) { const w = P.map(p => Math.min(...C.map(c => L.d2(p, c)))); let u = R() * L.sum(w), i = 0; while (u > w[i]) { u -= w[i]; i++; } C.push(P[Math.min(i, P.length - 1)]); } } else { const s = new Set(); while (s.size < k) s.add(Math.floor(R() * P.length)); C = [...s].map(i => P[i]); }
  C = C.map(c => [...c]); let A = null; for (let it = 0; it < 100; it++) { const nA = P.map(p => { let b = 0, bd = Infinity; C.forEach((c, j) => { const d = L.d2(p, c); if (d < bd) { bd = d; b = j; } }); return b; }); const ch = !A || nA.some((v, i) => v !== A[i]); A = nA; C = C.map((c, j) => { const m = P.filter((_, i) => A[i] === j); return m.length ? [L.mean(m.map(p => p[0])), L.mean(m.map(p => p[1]))] : c; }); if (!ch) break; }
  return { C, A, W: L.sum(P.map((p, i) => L.d2(p, C[A[i]]))) }; };

/* datasets */

LESSONS.push({
  id: 'a1', menu: 'Матрицы, ранг, системы', en: '9. Matrices, determinant, rank, linear systems (Rouché–Capelli)',
  title: 'Системы уравнений: <em>сравни два ранга</em>',
  short: `<ul>
    <li><b>Определитель:</b> det(AB) = det A·det B, det(λA) = λⁿdet A, перестановка строк меняет знак; Лаплас O(n!), Гаусс O(n³). A обратима ⇔ det A ≠ 0, A⁻¹ = adj(A)/det A.</li>
    <li><b>Ранг:</b> максимальный порядок ненулевого минора = число независимых строк = число опорных элементов после Гаусса. Окаймляющие миноры (Кронекер).</li>
    <li><b>Руше–Капелли:</b> Ax = b совместна ⇔ rank A = rank[A|b]; ранг n → одно решение, r &lt; n → ∞<sup>n−r</sup>.</li>
    <li><b>Методы:</b> исключение переменных, Крамер x<sub>i</sub> = det A<sub>i</sub>/det A (малые n), Гаусс + обратная подстановка.</li></ul>`,
  path: ['det и его свойства', 'ранг через Гаусса', 'rank A vs rank[A|b]', 'нет / одно / ∞^{n−r}', 'Крамер и Гаусс'],
  asks: 'State the Rouché–Capelli theorem. / How do you compute the rank of a matrix? / Describe Gaussian elimination and Cramer’s rule.',
  html: `
  <section class="board"><div class="step"><span class="num">1</span><h2>Гаусс пошагово на системах с доски</h2></div>
    <p>Приводим расширенную матрицу [A|b] к ступенчатому виду. <mark>Синие</mark> клетки — опорные элементы. Число опорных в A — rank A, в [A|b] — rank[A|b].</p>
    <div class="controls"><select data-r="sys"><option value="a">x − y + z = 1, x + y = 4, 2x + 2y + 2z = 9</option><option value="b">x + y − z = 1, 2x + 2y + z = 0</option><option value="c">2x − y + z = 2, x + 2y + t = 0, x − 3y + z − t = 3</option></select><button data-r="step" class="primary">Шаг</button><button data-r="reset">Заново</button></div>
    <div class="scroll-x"><table class="mat" data-r="m"></table></div>
    <div class="msg" data-r="msg"></div>
    <p class="hand">Строка вида (0 … 0 | k), k ≠ 0, значит 0 = k: решений нет.</p>
  </section>
  <section class="board"><div class="step"><span class="num">2</span><h2>Три исхода</h2></div>
    <div class="cards3">
      <div class="card"><h3>Нет решений</h3><span class="cond">rank A ≠ rank[A|b]</span><p>Система несовместна. Пример: третья система (2 и 3).</p></div>
      <div class="card"><h3>Одно решение</h3><span class="cond">rank A = rank[A|b] = n</span><p>Первая система: det A = 4 ≠ 0 → x = 2.25, y = 1.75, z = 0.5.</p></div>
      <div class="card"><h3>∞<sup>n−r</sup></h3><span class="cond">rank A = rank[A|b] = r &lt; n</span><p>Вторая: r = 2, n = 3 → ∞¹: x = (1 − 3y)/3, z = −2/3.</p></div>
    </div>
    <p>Однородная Ax = 0 всегда совместна (x = 0). Множество решений однородной системы — подпространство размерности n − rank A; неоднородной — нет.</p>
  </section>
  <section class="board"><div class="step"><span class="num">3</span><h2>Определитель и обратная матрица</h2></div>
    <div class="facts">
      <div class="fact blue"><div class="big">det = 0, если…</div><p>нулевая строка, две пропорциональные строки, строка — линейная комбинация других.</p></div>
      <div class="fact blue"><div class="big">Гаусс для det</div><p>det A = (произведение диагонали ступенчатой матрицы)/d, d учитывает перестановки (−1) и умножения строк.</p></div>
      <div class="fact good"><div class="big">A⁻¹ = adj(A)/det A</div><p>adj — транспонированная матрица алгебраических дополнений C<sub>ij</sub> = (−1)<sup>i+j</sup>M<sub>ij</sub>. Или [A|I] → [I|A⁻¹].</p></div>
      <div class="fact good"><div class="big">Ортогональная</div><p>Aᵀ = A⁻¹, det = ±1. (AB)ᵀ = BᵀAᵀ, (AB)⁻¹ = B⁻¹A⁻¹, tr(AB) = tr(BA).</p></div>
    </div>
  </section>`,
  init(sec) {
    const SYS = { a: { A: [[1, -1, 1, 1], [1, 1, 0, 4], [2, 2, 2, 9]], v: ['x', 'y', 'z'] }, b: { A: [[1, 1, -1, 1], [2, 2, 1, 0]], v: ['x', 'y', 'z'] }, c: { A: [[2, -1, 1, 0, 2], [1, 2, 0, 1, 0], [1, -3, 1, -1, 3]], v: ['x', 'y', 'z', 't'] } };
    let st = [];
    const build = k => { const S = SYS[k], M = S.A.map(r => [...r]), m = M.length, n = M[0].length - 1; const out = [{ M: M.map(r => [...r]), piv: [], txt: 'Исходная матрица [A|b].' }]; const piv = []; let row = 0;
      for (let c = 0; c < n && row < m; c++) { let p = -1; for (let r = row; r < m; r++) if (Math.abs(M[r][c]) > 1e-9) { p = r; break; } if (p < 0) continue; if (p !== row) { [M[row], M[p]] = [M[p], M[row]]; out.push({ M: M.map(r => [...r]), piv: [...piv, [row, c]], txt: `Меняем строки R${row + 1} ↔ R${p + 1}.` }); }
        piv.push([row, c]); for (let r = row + 1; r < m; r++) { const f = M[r][c] / M[row][c]; if (Math.abs(f) < 1e-12) continue; for (let j = c; j <= n; j++) M[r][j] -= f * M[row][j]; out.push({ M: M.map(rr => [...rr]), piv: [...piv], txt: `R${r + 1} → R${r + 1} − (${L.fmt(f, 3)})·R${row + 1}` }); } row++; }
      const rA = piv.length; const rAb = rA + (M.some(r => r.slice(0, n).every(v => Math.abs(v) < 1e-9) && Math.abs(r[n]) > 1e-9) ? 1 : 0);
      out.push({ M: M.map(r => [...r]), piv, txt: `rank A = ${rA}, rank [A|b] = ${rAb}, n = ${n} → ${rA !== rAb ? 'решений нет' : rA === n ? 'единственное решение' : '∞^' + (n - rA) + ' решений'}.`, final: true }); return out; };
    let i = 0; const show = () => { const s = st[i], n = s.M[0].length - 1; L.q(sec, 'm').innerHTML = s.M.map((r, ri) => '<tr>' + r.map((v, j) => `<td class="${j === n ? 'bar ' : ''}${s.piv.some(p => p[0] === ri && p[1] === j) ? 'pv' : ''}">${L.fmt(Math.abs(v) < 1e-9 ? 0 : v, 3)}</td>`).join('') + '</tr>').join(''); L.q(sec, 'msg').textContent = `${i}/${st.length - 1} · ${s.txt}`; L.q(sec, 'step').disabled = i >= st.length - 1; };
    const reset = () => { st = build(L.q(sec, 'sys').value); i = 0; show(); };
    L.q(sec, 'step').onclick = () => { if (i < st.length - 1) { i++; show(); } }; L.q(sec, 'reset').onclick = reset; L.q(sec, 'sys').onchange = reset; reset();
  }
});

  path: ['линейная независимость', 'базис и размерность', 'подпространства, Грассман', 'скалярное произведение', 'нормы Lp и матричные', 'Грам–Шмидт'],
  asks: 'Define linear independence, basis and dimension. / What is a norm? Give examples. / Describe the Gram–Schmidt process.',
